[project]
name = "genios-brain"
version = "2.0.0-alpha"
description = "GeniOS Brain v2 — hybrid neuro-symbolic intelligence engine"
requires-python = ">=3.11"
readme = "CONTRIBUTING.md"

dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",

    # Data
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",

    # Config + validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",

    # Async tasks
    "celery[redis]>=5.4",
    "redis>=5.1",

    # Crypto
    "cryptography>=43.0",
    "PyJWT>=2.9",
    "bcrypt>=4.2",

    # LLM
    "anthropic>=0.40,<1.0",
    "groq>=0.11",

    # Connectors (Phase 2+ reuse from legacy)
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.150",
    "requests>=2.32",
    "httpx>=0.27",

    # Observability
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.18",
    "posthog>=3.7",

    # Reasoning (g-i-2)
    "z3-solver>=4.13",
    "PyYAML>=6.0",
    "jinja2>=3.1",

    # Util
    "rapidfuzz>=3.10",
    "networkx>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
    "types-PyYAML",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "modules*"]
exclude = ["_legacy*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "unit: fast isolated tests",
    "integration: tests touching DB/external services",
    "acceptance: end-to-end module acceptance criteria",
]
