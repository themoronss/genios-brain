[project]
name = "genios-engine"
version = "0.1.0"
description = "GeniOS intelligence engine — fresh modular backend (L1 capture first)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "cryptography>=43.0",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Real integrations (installed when wiring live Composio). Kept optional so dev/tests
# run without them:  pip install -e ".[real]"
real = ["composio>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["genios_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
