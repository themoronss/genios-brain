# Deal-velocity rules. Reversible recommendations (no hard).
# Per MD g-i-2 §5 real example: stage_stall rule.

- id: stage_stall
  module: sales
  priority: 60
  when:
    all:
      - fact: days_in_current_stage
        op: ">"
        value: 21
      - fact: stage
        op: "in"
        value: ["negotiation", "proposal"]
  then:
    conclusion: deal_stalled
    recommend: flag_to_rep_with_next_action
    reason: "21+ days stalled in late stage"
  hard: false

- id: deal_aging_overall
  module: sales
  priority: 40
  when:
    all:
      - fact: deal_age_days
        op: ">"
        value: 90
      - fact: stage
        op: "not_in"
        value: ["closed_won", "closed_lost"]
  then:
    conclusion: deal_overdue_review
    recommend: schedule_pipeline_review
    reason: "Open deal aged >90 days — review fit"
  hard: false

- id: response_silence_after_proposal
  module: sales
  priority: 50
  when:
    all:
      - fact: stage
        op: "=="
        value: "proposal"
      - fact: days_since_last_buyer_response
        op: ">"
        value: 10
  then:
    conclusion: buyer_disengagement_signal
    recommend: send_lightweight_check_in
    reason: "Buyer silent >10 days after proposal sent"
  hard: false
