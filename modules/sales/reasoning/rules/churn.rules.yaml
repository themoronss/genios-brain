# Churn-detection rules. Per MD g-i-2 §5 real example.
# Reversible recommendations only (no hard:true here — pricing.rules.yaml has the hard ones).

- id: churn_usage_silence
  module: sales
  priority: 80
  when:
    all:
      - fact: usage_drop_pct_30d
        op: ">"
        value: 40
      - fact: days_since_last_contact
        op: ">"
        value: 14
  then:
    conclusion: churn_risk_high
    recommend: trigger_reengagement_sequence
    reason: "Usage down >40% in 30d AND no contact in 14d — high churn risk"
  hard: false

- id: churn_renewal_silent
  module: sales
  priority: 70
  when:
    all:
      - fact: days_to_renewal
        op: "<="
        value: 60
      - fact: days_since_last_contact
        op: ">"
        value: 21
      - fact: nps_score
        op: "<"
        value: 7
  then:
    conclusion: churn_risk_high
    recommend: schedule_executive_check_in
    reason: "Renewal <60d away with no recent contact and low NPS"
  hard: false

- id: churn_champion_left_no_replacement
  module: sales
  priority: 90
  when:
    all:
      - fact: champion_status
        op: "=="
        value: "left_company"
      - fact: replacement_identified
        op: "=="
        value: false
  then:
    conclusion: churn_risk_high
    recommend: identify_new_champion_immediately
    reason: "Primary champion departed; replacement not yet engaged"
  hard: false

- id: churn_champion_left_big_deal
  module: sales
  priority: 90
  when:
    all:
      - fact: champion_status
        op: "=="
        value: "left_company"
      - fact: deal_value
        op: ">"
        value: 50000
  then:
    conclusion: churn_risk_high
    recommend: escalate_to_executive_sponsor
    reason: "Primary champion departed on high-value deal — escalation required"
  hard: false
