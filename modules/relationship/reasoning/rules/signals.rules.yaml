# Signal-aware relationship-intelligence rules — the 2nd-brain layer.
#
# These fire on DERIVED signals (Signal Layer), not raw CSV facts:
#   ball_in_court · importance · momentum · engagement_level · buying_intent · domain
#
# Generic on purpose: the SAME rules serve a founder's whole book (investors,
# customers, hires, partners) AND a sales pipeline. The module's importance()
# function decides WHO scores high — the rule just reacts to the score.

- id: important_relationship_cooling_ball_in_court
  module: relationship
  priority: 90
  when:
    all:
      - fact: ball_in_court
        op: ">="
        value: 1
      - fact: importance
        op: ">="
        value: 0.6
      - fact: momentum
        op: "<="
        value: -0.3
  then:
    conclusion: important_relationship_going_cold
    recommend: reply_now
    reason: "You owe the reply to an important relationship that's cooling — reach out today before it goes cold."
  hard: false

- id: hot_intent_ball_in_court
  module: relationship
  priority: 82
  when:
    all:
      - fact: ball_in_court
        op: ">="
        value: 1
      - fact: buying_intent
        op: ">="
        value: 0.7
  then:
    conclusion: hot_lead_awaiting_you
    recommend: book_meeting_now
    reason: "High intent and the ball is in your court — book the next step now while it's warm."
  hard: false
