                      depends_on: [M8.C1.L-integration.V2.U04]
                - level: 1
                  units:
                    - id: M11.C1.L-logic.V1.U02
                      status: retired         # 2026-09-30 — already built AND already tested
                      what: >
                        RETIRED, NOT DEFERRED. The SkippedStep receipt exists at reason/plan.py:258
                        and is covered by a PASSING test:
                        test_selector_and_registration.py::test_a_unit_whose_every_source_went_is_dropped_and_names_all_of_them
                        asserts both reason_code and missing_fields. Production carries 3,102 of 26,396
                        result rows with a skip_reason_code, so it runs.

                        No code and no test were written. The tree named
