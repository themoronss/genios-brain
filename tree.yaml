  source: >
    speedrun008/YC-II W27/STEP-12 §1-§7, re-checked claim by claim against speedrun008 @ c50f0f7e
    (STEP-12 §8) by two read-only workers and by hand, and measured on the golden set from its
    cassettes: 409 recorded answers, 65 of them the decider's (24 cases); of the 10 must-detect cases
    with no card, 7 never reach the decider at all. Nothing in reason/ reads a file; replay is
    model-free only for the formula (03 F139); a truncated answer is read by nobody (F140); R-6 runs
    ahead of the change gate (F141).
  vision: >
    Every piece of work that changed gets ONE judgment from a strong model, the way a 30-year chief of
    staff would give it: on the whole file — the brief, its history, its numbers with their n, its
    playbook, what was judged before — written as facts that cite their evidence, a frame and its
    rivals, scenarios, an appraisal with reasons, a next move with a draft. Code checks it, stores it,
    and decides the lane; an unchanged file costs nothing, and a decision replays without the model.
  order_note: >
    M32 first and whole, in shadow: it changes no card. Widened 2026-10-10 by `yc2_w27_align` M34.C4
    (STEP-12 §8.8) with nine units its check dropped or other steps deferred to it — 37 in all. ⛔ 40 since
    2026-10-11: three minted at the build of the triggers (M32.C3.L-logic.V1.U09) — a review keeps its
    inputs (C1.U07, C3.U10) and the fingerprint reads a deadline (C2.U09). ⛔ 41 with M32.C4.L-logic.V0.U03,
