yc2_w27_s02:
  status: approved_in_progress
  confirmed: >
    Rohit, 2026-10-06 — "Haan, ab step 2 start karo." Built the same day; QA green at aaca7e67
    (speedrun008/YC-II W27/baseline/yc2w27-s02-qa/qa_record.txt). Local commits; Rohit pushes.
  source: >
    speedrun008/YC-II W27/STEP-02 §1–§3, re-checked claim by claim against speedrun008 @ 56528ddb
    on 2026-10-06 (STEP-02 §8), and measured on the golden runner: today an unchanged sweep pays
    the decider and R-1 again for every subject — F13 2 calls, F12/F25/F28 4, F07 5, F29 12 — and
    production's decider + R-1 ran 1,213 / 759 / 1,887 calls on 2 / 3 / 4 Oct (baseline
    @model_calls_by_day).
  vision: >
    A sweep that brings a subject nothing new pays no model for it: the decider and R-1 run only
    when what the decision depends on changed, or when its standing card is about to lose its
    authority. The decision itself is unchanged — the same model decides, on the same prompt, when
    it runs. A DEFER keeps the card it found. Every skip is recorded, so a subject re-decided on an
    unchanged fingerprint is visible.
  order_note: >
    C1 (the fingerprint) and C2 (its store) first; C3 the gate's rule; C5 the DEFER fix before
    C4, because the legacy lane replays a skipped subject's last outcome and a DEFER must replay as
    indeterminate. C6 last: the counter, the health check, and the golden acceptance — an
    unchanged sweep costs 0 model calls on every founder case. Not in this block, by the check:
    "no model for shadow" (it would break replay, which must not vary by mode — the gate covers
    shadow rows' unchanged sweeps instead) and renewing a standing signal's authority (cards are
    replaced at expiry today; STEP-14).
