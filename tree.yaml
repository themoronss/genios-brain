                      artifact: tests/context/test_l2_shadow_diff.py
                      verify: GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest tests/context/test_l2_shadow_diff.py -q
                      depends_on: []
                    - id: M16.C4.L-data.V0.U05
                      what: >
                        The approver test seeds what 7faff157 requires — the person's node and an
