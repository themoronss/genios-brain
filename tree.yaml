    # ─────────────────────────────────────────────────────────────────────────────────────────
    - id: M17
      name: Nothing captured is lost silently
      ships: >
        The funnel writes a zero when a pass decides nothing, in every lane; a mail whose
        extraction failed is read again until it lands or is given up with its reason; and a Gmail
        attachment is fetched instead of refused. Each closes a STEP-18 row (B17, B18, B19) whose
        probe is in speedrun008/YC-II W27/baseline/production_state.sql.
      categories:

        - id: M17.C1
          name: The funnel writes its zeros (STEP-18 B17)
          layers:
            - layer: logic
              levels:
                - level: 0
                  units:
                    - id: M17.C1.L-logic.V0.U01
                      what: >
                        A completed reasoning pass publishes `decision_emitted` as its own count —
                        every decision it emitted in every lane (rule `emitted`, `native_emitted`,
                        `composite`) — and 0 when it emitted none. A pass that returned early for a
                        retry still writes no row. The per-lane keys stay in `outcomes`; `run_all`
                        sums the stage across packs; `capability_resolved` writes its zero too.
                      artifact: genios_engine/reason/runner.py
                      verify: GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest tests/test_decision_emitted_writes_its_zero.py tests/test_capability_resolved_counts_expertise_not_nodes.py -q
                      depends_on: [M16.C6.L-integration.V0.U01]
            - layer: integration
              levels:
                - level: 1
                  units:
                    - id: M17.C1.L-integration.V1.U02
                      what: >
                        The sweep relays `_funnel.DECISION_EMITTED` from the pass's outcomes
                        instead of the rule lane's `emitted` key — still a relay, never arithmetic.
                      artifact: genios_engine/api/routes.py
                      verify: .venv/bin/python -m pytest tests/test_the_funnel_has_five_numbers.py tests/test_decision_emitted_writes_its_zero.py tests/platform/test_a_zero_is_written_not_skipped.py -q
                      depends_on: [M17.C1.L-logic.V0.U01]

        - id: M17.C2
          name: A failed extraction is read again (STEP-18 B18)
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M17.C2.L-contract.V0.U01
                      what: >
                        The extractor's four park codes (`extraction_call_failed`,
                        `extraction_parse_failed`, `extraction_schema_failed`,
                        `extraction_total_loss`) belong to a drain class, so `drain_parked` and
                        `parked_aging` report them instead of walking past them; and the park-code
                        coverage test reads park codes from `capture/semantic/` as well as
                        `capture/gate/`, so the next orphaned code fails the build.
                      artifact: genios_engine/capture/parked/drain.py
                      verify: .venv/bin/python -m pytest tests/capture/parked/test_park_code_coverage.py tests/capture/parked/test_drain_surfaces.py -q
                      depends_on: [M16.C6.L-integration.V0.U01]
            - layer: data
              levels:
                - level: 0
                  units:
                    - id: M17.C2.L-data.V0.U02
                      what: >
                        A message fingerprint claimed by an event that was SET ASIDE for a re-read
                        (`outcome = 'superseded'`) is void: `claim` removes it and the re-landed copy
                        becomes canonical. A claim by a live event (the screen copy) still suppresses
                        as today, and a claim by an event with no row keeps today's meaning — a
                        deletion is the deleting path's to clean up (U05). Without this, every
                        re-read path is skipped as `seen_on_screen`: this category's re-read, the
                        unread re-read, and STEP-08's re-fetch.
                      artifact: genios_engine/capture/screen/fingerprint.py
                      verify: GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest tests/capture/test_a_claim_by_a_gone_event_is_void_pg.py tests/capture/test_g7_g8_g10_gates.py -q
                      depends_on: [M16.C6.L-integration.V0.U01]
            - layer: logic
              levels:
                - level: 1
                  units:
                    - id: M17.C2.L-logic.V1.U03
                      what: >
                        A second selector beside `find_unread`: emitted events whose extraction
                        parked, with a retained payload, under a bounded ladder (at most 3 attempts,
                        `refetch_next_attempt_at` honoured), then dead-lettered with the last
                        reason. The same set-aside / re-land / restore mechanics, so STEP-05 §3.5
                        extends it rather than replacing it.
                      artifact: genios_engine/capture/landing/unread.py
                      verify: GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest tests/capture/test_a_failed_extraction_is_read_again_pg.py tests/capture/test_unread_reread_pg.py -q
                      depends_on: [M17.C2.L-contract.V0.U01, M17.C2.L-data.V0.U02]
            - layer: integration
              levels:
                - level: 1
                  units:
                    - id: M17.C2.L-integration.V1.U05
                      what: >
                        ADDED IN BUILD (STEP-18 B20 proper). The disconnect-with-wipe deletes the
                        fingerprints of the events it deletes, scoped exactly like its payload
                        delete — as the tenant reset always has. Before, a reconnect re-synced every
                        message straight into `seen_on_screen` and extracted nothing.
                      artifact: genios_engine/api/routes.py
                      verify: .venv/bin/python -m pytest tests/test_a_disconnect_takes_its_fingerprints.py tests/platform/test_a_delete_is_not_a_read.py -q
                      depends_on: [M17.C2.L-data.V0.U02]
                - level: 2
                  units:
                    - id: M17.C2.L-integration.V2.U04
                      what: >
                        The sweep's re-read pass takes the parked extractions through the same door
                        (`ingest_pushed_objects` -> `finalize_l1`) and settles each park:
                        `superseded` when a new copy replaced it, the ladder advanced when it came
                        back, dead-lettered with its reason past the limit.
                      artifact: genios_engine/api/routes.py
                      verify: .venv/bin/python -m pytest tests/capture/test_reread_connection.py tests/test_the_funnel_has_five_numbers.py -q
                      depends_on: [M17.C2.L-logic.V1.U03]

        - id: M17.C3
          name: Gmail attachments are fetched (STEP-18 B19)
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M17.C3.L-contract.V0.U01
                      retired: >
                        RETIRED IN BUILD, 2026-10-05 — replaced by U05. A manual production call
                        is not needed: the connector's no-data error now carries the response's
                        SHAPE, so the first refetch after the deploy records it in
                        `parked_events.refetch_last_error`, read-only, where it can be read back.
                      what: >
                        (retired) HARSH records one live `GMAIL_GET_ATTACHMENT` response shape.
                      artifact: tests/capture/connectors/fixtures/gmail_get_attachment.shape.json
                      verify: .venv/bin/python -m pytest tests/capture/connectors/test_the_attachment_shape_is_recorded.py -q
                      depends_on: []
                    - id: M17.C3.L-contract.V0.U05
                      what: >
                        ADDED IN BUILD. When a `GMAIL_GET_ATTACHMENT` response carries no bytes the
                        connector knows how to read, the error names the response's SHAPE — keys
                        and value types, never a value — so the shape the current toolkit returns
                        is learned from the first refetch after the deploy instead of guessed.
                      artifact: genios_engine/capture/connectors/composio.py
                      verify: .venv/bin/python -m pytest tests/capture/connectors/test_attachment_fetch_sends_file_name.py tests/capture/connectors/test_fastpath_attachment_recovery.py -q
                      depends_on: [M16.C6.L-integration.V0.U01]
            - layer: integration
              levels:
                - level: 1
                  units:
                    - id: M17.C3.L-integration.V1.U02
                      what: >
                        `fetch_attachment` sends `file_name` — the attachment's own filename on the
                        capture path, a neutral default when a caller has none — and reads the
                        recorded response shape. The capture path and the refetch ladder both call
                        it, so one change serves both.
                      artifact: genios_engine/capture/connectors/composio.py
                      verify: .venv/bin/python -m pytest tests/capture/connectors/test_attachment_fetch_sends_file_name.py tests/capture/connectors/test_fastpath_attachment_recovery.py tests/capture/documents/test_attachment_refetch.py tests/capture/parked/test_refetch_drain.py -q
                      depends_on: [M17.C3.L-contract.V0.U05]
            - layer: data
              levels:
                - level: 2
                  units:
                    - id: M17.C3.L-data.V2.U03
                      what: >
                        A re-queue script for the attachment parks dead-lettered by the `file_name`
                        refusal: read-only by default, `--apply` behind the write flag,
                        tenant-scoped, touching only rows whose stored error is that refusal. Claude
                        writes it; Harsh runs it after the deploy.
                      artifact: scripts/requeue_refused_attachments.py
                      verify: .venv/bin/python -m pytest tests/scripts/test_requeue_refused_attachments.py -q
                      depends_on: [M17.C3.L-integration.V1.U02]
            - layer: integration
              levels:
                - level: 2
                  units:
                    - id: M17.C3.L-integration.V2.U04
                      what: >
                        Composio toolkit versions are pinned — gmail at the version the shape was
                        recorded against — in the one place each connector executes, replacing
                        `dangerously_skip_version_check=True`, so an upstream schema change cannot
                        silently refuse every call again. Harsh confirms the versions.
                      artifact: genios_engine/capture/connectors/composio_base.py
                      verify: .venv/bin/python -m pytest tests/capture/connectors/test_composio_toolkits_are_pinned.py -q
                      depends_on: [M17.C3.L-integration.V1.U02]

    # ─────────────────────────────────────────────────────────────────────────────────────────
    - id: M18
      name: Calibration runs on Postgres, and only proposes (STEP-18 B1)
      ships: >
        The weekly calibration completes on Postgres (it has raised `UndefinedColumn card_level` on
        every run since cd7f85d7, 2026-09-10) and writes what it WOULD mute, recover or nudge —
        while `rule_mutes`, gate offsets, the pack revision, signals and cards stay untouched until
        `calibration_apply` is switched on for a tenant. The one-line SQL fix cannot land without
        the shadow switch: alone, it arms unattended muting.
      categories:

