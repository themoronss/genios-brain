                      artifact: genios_engine/context/situation_bso.py::_L1_BY_EVENT_SELECT
                      verify: uv run --no-sync pytest tests/test_l2_reads_what_l1_publishes.py -q -p no:randomly
                      depends_on: [M13.C2.L-logic.V1.U07]
            - layer: integration
