# ═══════════════════════════════════════════════════════════════════════════════════════════════
# ATLAS v2 ALIGNMENT — M8 onward. Added 2026-09-30.
#
# M1-M7 above are permanent and retired-in-place; their IDs are never reused. This block is a
# NEW program: bring the code into line with the GeniOS Design Atlas v2 (29 Sep 2026), layer by
# layer, in DATA-FLOW order (capture -> context -> reason -> executive -> deliver -> feedback),
# which is not the Atlas's own numbering.
#
# ⛔ WHY M8 EXISTS AND NOTHING MAY START BEFORE IT.
# The Atlas is grounded — every codebase number in it was re-measured and matches. But it was
# written design-side, so several things it badges `gap` or `target` are already built, and one
# of them is built BETTER than the Atlas specifies:
#
#   Atlas badge                      | measured reality
#   ---------------------------------|-------------------------------------------------------
#   L1 "no coverage receipts" (gap)  | capture/coverage/signal_coverage.py — per-source, frozen
#                                    | at capture, never 100% by default; + context/quality/
#                                    | window.py "read 37 of about 465". Both written against
#                                    | the same benchmark failure the Atlas cites.
#   ReasoningRequest (target)        | contracts/reasoning.py:679 — exists
#   ContextSnapshot (built)          | contracts/reasoning.py:365 — correct
#   "targeted second pass" (target)  | CritiqueVerdict — exists
#   DeliveryResult (target name)     | DeliveryObject / DeliveryDecision — exists
#   DecisionObject (target)          | ⛔ SETTLED ALREADY. tests/contracts/
#                                    | test_the_decision_object_is_one_object.py: "The plan that
#                                    | led here assumed five competing definitions to choose
#                                    | between. It did not: ReasoningDecision IS the object."
#                                    | The Atlas re-opens a question the code closed.
#
# A previous plan made exactly this mistake once and the code investigation corrected it. M8 is
# the guard against making it a second time, and it produces a RE-RUNNABLE check, not a one-time
# human read, so the Atlas cannot drift from the code again.
#
# VERIFIED MISSING (zero hits, safe to build under any M8 outcome):
#   EvidenceNeed · SituationSeed · QualifiedEnterpriseSignalBundle · the five funnel counters ·
#   the five output lanes.
#
# Verify prelude every unit needs:
#   export PATH="/Users/rohitswerashi/MacBook Air Professional/VS Code/VS Code Setup/toolchains/bin:$PATH"
#   cd "<repo>" && uv run --no-sync pytest <file> -q
# ═══════════════════════════════════════════════════════════════════════════════════════════════

atlas_v2_alignment:
  status: proposed_awaiting_confirmation
  source: "GeniOS Design Atlas v2 — 29 Sep 2026 (HTML + Markdown editions)"
  vision: >
    Every built/target/gap badge in the Atlas is checked against the code by a command anyone can
    re-run, and the four architecture decisions the Atlas leaves open are recorded where the code
    enforces them rather than where prose describes them. On that corrected baseline each of the
    six product layers reaches its Atlas target in data-flow order: Layer 1 hands up a bundle that
    carries its own coverage and can be asked for a named missing fact; the Context Graph answers a
    bounded, revision-stamped read and turns a HOLD into a request instead of a wait; no reasoning
    unit runs without its declared inputs scheduled and uncertainty routes a finding to a lane
    instead of deleting it; the Executive queue is not empty and one situation reaches a verified
    outcome end to end; every sentence on a card is cited or labelled and nothing is dropped
    without a receipt; and a wrong card debits the layer that actually failed.
  order_note: >
    Data-flow order, not Atlas numbering. capture feeds context; reason READS context. The Atlas
    numbers Reasoning L2 and the Context Graph L3, but data reaches them the other way round.

  milestones:
    # ─────────────────────────────────────────────────────────────────────────────────────────
    - id: M8
      name: The baseline is true
      ships: >
        A command prints, for every Atlas badge, whether the code agrees — and the four blocking
        decisions exist as enforced code instead of prose. Nothing above this milestone is planned
        in detail until it is green.
      categories:

        - id: M8.C1
          name: Badge verification
          layers:
            - layer: logic
              levels:
                - level: 0
                  units:
                    - id: M8.C1.L-logic.V0.U01
                      what: >
                        Extract every badge claim in the Atlas markdown (running / built / target /
                        gap, plus each named symbol, table and file) into one machine-readable
                        claims file.
                      artifact: scripts/atlas_claims.py
                      verify: uv run --no-sync python scripts/atlas_claims.py --count
                      depends_on: []
                    - id: M8.C1.L-logic.V0.U02
                      what: >
                        The probe library: for a claimed symbol, table, file or caller, answer
                        EXISTS / ABSENT / UNPROVABLE against the tree. UNPROVABLE is a real third
                        answer and is never silently read as ABSENT.
                      artifact: scripts/atlas_probe.py
                      verify: uv run --no-sync pytest tests/tools/test_atlas_probe.py -q
                      depends_on: []
                - level: 1
                  units:
                    - id: M8.C1.L-logic.V1.U03
                      what: >
                        The resolver: run every claim through the probes and emit the disagreement
                        list — each row naming the badge, the claim, the probe verdict and the file
                        that settles it.
                      artifact: scripts/atlas_verify.py
                      verify: uv run --no-sync python scripts/atlas_verify.py --report
                      depends_on: [M8.C1.L-logic.V0.U01, M8.C1.L-logic.V0.U02]
            - layer: integration
              levels:
                - level: 2
                  units:
                    - id: M8.C1.L-integration.V2.U04
                      what: >
                        The corrected baseline, committed as the document the rest of this program
                        is planned against.
                      artifact: speedrun008/ATLAS_BASELINE.md
                      verify: uv run --no-sync python scripts/atlas_verify.py --assert-baseline speedrun008/ATLAS_BASELINE.md
                      depends_on: [M8.C1.L-logic.V1.U03]

        - id: M8.C2
          name: The four decisions, enforced
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M8.C2.L-contract.V0.U05
                      what: >
                        DECISION 1 — the confidence vector's axes. Code has evidence / freshness /
                        consistency / identity / coverage / analytic and the law that overall_bp is
                        bounded by the weakest axis. The Atlas names evidence / frame / temporal /
                        causal / authority / coverage; only two overlap. Record the chosen set and
                        the composition law in one place, with the rejected set named.
                      artifact: genios_engine/contracts/situation.py
                      verify: uv run --no-sync pytest tests/contracts/test_the_vector_axes_are_declared_once.py -q
                      depends_on: [M8.C1.L-integration.V2.U04]
                    - id: M8.C2.L-contract.V0.U06
                      what: >
                        DECISION 2 — correlation placement. The Atlas puts one Signal Correlation
                        component in L1; ten correlator modules (5,234 lines) live in context/ and
                        every one reads the graph, which the Atlas puts downstream. Record which
                        way it goes and why, next to the import rule that forbids the other.
                      artifact: docs/LAYER_MAP.md
                      verify: uv run --no-sync pytest tests/test_layer_topology.py -q
                      depends_on: [M8.C1.L-integration.V2.U04]
                    - id: M8.C2.L-contract.V0.U07
                      what: >
                        DECISION 3 — the naming freeze. One table mapping every Atlas name to the
                        code name that already holds it (ReasoningDecision, DeliveryObject,
                        brief.v1), naming which side moves.
                      artifact: docs/LAYER_MAP.md
                      verify: uv run --no-sync pytest tests/test_atlas_names_resolve.py -q
                      depends_on: [M8.C1.L-integration.V2.U04]
                    - id: M8.C2.L-contract.V0.U08
                      what: >
                        DECISION 4 — is a layer the package or the product layer? context/ spans
                        product L2 and L3; reason/ spans L2 and L4. Record the addressing rule so
                        two product layers cannot be scheduled against one package.
                      artifact: genios_engine/LAYERS.py
                      verify: uv run --no-sync pytest tests/test_layer_topology.py -q
                      depends_on: [M8.C1.L-integration.V2.U04]
                - level: 1
                  units:
                    - id: M8.C2.L-contract.V1.U09
                      what: >
                        The totality guard, both directions — a name the Atlas uses that the code
                        does not hold fails, and a boundary contract the code holds that the Atlas
                        never names also fails. One direction alone is half a guard.
                      artifact: tests/test_atlas_names_resolve.py
                      verify: uv run --no-sync pytest tests/test_atlas_names_resolve.py -q
                      depends_on: [M8.C2.L-contract.V0.U07]

        - id: M8.C3
          name: The funnel counters
          layers:
            - layer: data
              levels:
                - level: 0
                  units:
                    - id: M8.C3.L-data.V0.U10
                      what: The five-counter table, one row per sweep per tenant.
                      artifact: migrations/0186_pipeline_counters.sql
                      verify: uv run --no-sync pytest tests/platform/test_migrations_apply.py -q
                      depends_on: []
            - layer: integration
              levels:
                - level: 1
                  units:
                    - id: M8.C3.L-integration.V1.U11
                      what: signals_detected and situations_formed, written by the capture and context sweeps.
                      artifact: genios_engine/context/runner.py
                      verify: uv run --no-sync pytest tests/context/test_the_funnel_is_counted.py -q
                      depends_on: [M8.C3.L-data.V0.U10]
                    - id: M8.C3.L-integration.V1.U12
                      what: capability_resolved and decision_emitted, written by the shadow compile.
                      artifact: genios_engine/reason/domain_shadow.py
                      verify: uv run --no-sync pytest tests/reason/test_the_funnel_is_counted.py -q
                      depends_on: [M8.C3.L-data.V0.U10]
                    - id: M8.C3.L-integration.V1.U13
                      what: card_delivered, written by the delivery pipeline.
                      artifact: genios_engine/deliver/pipeline.py
                      verify: uv run --no-sync pytest tests/deliver/test_the_funnel_is_counted.py -q
                      depends_on: [M8.C3.L-data.V0.U10]

        - id: M8.C4
          name: The Atlas, corrected
          layers:
            - layer: interface
              levels:
                - level: 0
                  units:
                    - id: M8.C4.L-interface.V0.U14
                      what: Atlas markdown badges corrected from the baseline report.
                      artifact: speedrun008/atlas/genios-design-atlas-v2.md
                      verify: uv run --no-sync python scripts/atlas_verify.py --zero-disagreements
                      depends_on: [M8.C1.L-integration.V2.U04, M8.C2.L-contract.V1.U09]
                    - id: M8.C4.L-interface.V0.U15
                      what: Atlas HTML edition brought level with the markdown.
                      artifact: speedrun008/atlas/genios-design-atlas-v2.html
                      verify: uv run --no-sync python scripts/atlas_verify.py --editions-agree
                      depends_on: [M8.C4.L-interface.V0.U14]

    # ─────────────────────────────────────────────────────────────────────────────────────────
    - id: M9
      name: L1 Enterprise Signals — capture/
      ships: >
        Layer 1 hands up a bundle that carries its own coverage, and can be asked for one named
        missing fact instead of being read once and never asked again.
      categories:

        - id: M9.C1
          name: The signal bundle
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M9.C1.L-contract.V0.U01
                      what: >
                        QualifiedEnterpriseSignalBundle — signals, entities, candidate relationships,
                        unresolved[], and a coverage receipt that REUSES the existing per-source
                        SourceCoverage rather than blending a new number.
                      artifact: genios_engine/contracts/signal.py
                      verify: uv run --no-sync pytest tests/contracts/test_l1_contracts.py -q
                      depends_on: [M8.C2.L-contract.V1.U09]
            - layer: data
              levels:
                - level: 1
                  units:
                    - id: M9.C1.L-data.V1.U02
                      what: The bundle table, keyed so a replayed signal is idempotent.
                      artifact: migrations/0187_signal_bundle.sql
                      verify: uv run --no-sync pytest tests/platform/test_migrations_apply.py -q
                      depends_on: [M9.C1.L-contract.V0.U01]
            - layer: logic
              levels:
                - level: 1
                  units:
                    - id: M9.C1.L-logic.V1.U03
                      what: >
                        The grouper — incoming signals only, joined by entity, thread, time window,
                        commitment and meeting. It does not read the graph.
                      artifact: genios_engine/capture/esqe/bundle.py
                      verify: uv run --no-sync pytest tests/capture/esqe/test_bundle.py -q
                      depends_on: [M9.C1.L-contract.V0.U01]
                - level: 2
                  units:
                    - id: M9.C1.L-logic.V2.U04
                      what: >
                        The coverage receipt assembled onto the bundle from signal_coverage and the
                        window read — per source, never blended, unknown stays None.
                      artifact: genios_engine/capture/esqe/bundle.py
                      verify: uv run --no-sync pytest tests/capture/esqe/test_bundle_coverage.py -q
                      depends_on: [M9.C1.L-logic.V1.U03]
            - layer: integration
              levels:
                - level: 3
                  units:
                    - id: M9.C1.L-integration.V3.U05
                      what: >
                        The publisher emits a bundle BESIDE qualified_signals — built beside the old
                        path, not over it, and both counted on one sweep before either is retired.
                      artifact: genios_engine/capture/esqe/publisher.py
                      verify: uv run --no-sync pytest tests/capture/esqe/test_publisher_emits_a_bundle.py -q
                      depends_on: [M9.C1.L-logic.V2.U04, M9.C1.L-data.V1.U02]

        - id: M9.C2
          name: The evidence-need door
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M9.C2.L-contract.V0.U06
                      what: >
                        EvidenceNeed — the question, why it changes the decision, acceptable and
                        unacceptable sources, time range, visibility, cost limit, expiry and an
                        idempotency key.
                      artifact: genios_engine/contracts/evidence.py
                      verify: uv run --no-sync pytest tests/contracts/test_evidence_need.py -q
                      depends_on: [M8.C2.L-contract.V1.U09]
            - layer: data
              levels:
                - level: 1
                  units:
                    - id: M9.C2.L-data.V1.U07
                      what: evidence_needs — open / met / unavailable, never hard-deleted.
                      artifact: migrations/0188_evidence_needs.sql
                      verify: uv run --no-sync pytest tests/platform/test_migrations_apply.py -q
                      depends_on: [M9.C2.L-contract.V0.U06]
            - layer: logic
              levels:
                - level: 2
                  units:
                    - id: M9.C2.L-logic.V2.U08
                      what: >
                        The executor — fetch the full thread, backfill older history, or re-extract
                        an attachment, bounded by the need's own cost limit and expiry.
                      artifact: genios_engine/capture/acquire/evidence_need.py
                      verify: uv run --no-sync pytest tests/capture/test_evidence_need_executor.py -q
                      depends_on: [M9.C2.L-data.V1.U07]
            - layer: integration
              levels:
                - level: 3
                  units:
                    - id: M9.C2.L-integration.V3.U09
                      what: >
                        The wire that does not exist today — residue.signal_unreached, which already
                        measures what Layer 2 could not explain, raises an EvidenceNeed instead of
                        reaching only the angles.
                      artifact: genios_engine/context/residue.py
                      verify: uv run --no-sync pytest tests/context/test_residue_raises_a_need.py -q
                      depends_on: [M9.C2.L-logic.V2.U08]

    # ─────────────────────────────────────────────────────────────────────────────────────────
    - id: M10
      name: L3 Context Graph — context/
      ships: >
        A bounded, revision-stamped read the reasoning layer can ask for, and a HOLD that asks for
        what it is missing instead of only waiting for the next sweep.
      categories:

        - id: M10.C1
          name: The bounded query API
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M10.C1.L-contract.V0.U01
                      status: done            # 2026-09-30
                      what: >
                        The read request — seeds, allowed edge types, max hops, max nodes and the
                        asking seat's visibility. Bounded by DEFAULT: an unbounded default makes
                        every caller's mistake invisible until the tenant is large.
                      # Landed beside the reader rather than in contracts/reasoning.py: it is only
                      # ever constructed by a context/ caller and consumed by the traversal below
                      # it, so a contracts/ home would add an import for no reader's benefit.
                      artifact: genios_engine/context/bounded_read.py
                      verify: uv run --no-sync pytest tests/context/test_the_bounded_read_says_when_it_stopped.py -q
                      depends_on: []
            - layer: data
              levels:
                - level: 1
                  units:
                    - id: M10.C1.L-data.V1.U02
                      status: done            # 2026-09-30
                      what: >
                        The bounded reader — one capped breadth-first traversal, with the revision it
                        read AND whether a cap stopped it. A result that hit its cap and does not say
                        so is a partial answer that reads as a complete one.
                      artifact: genios_engine/context/bounded_read.py
                      verify: uv run --no-sync pytest tests/context/test_the_bounded_read_says_when_it_stopped.py -q
                      depends_on: [M10.C1.L-contract.V0.U01]
            - layer: logic
              levels:
                - level: 2
                  units:
                    - id: M10.C1.L-logic.V2.U03
                      status: retired         # 2026-09-30 — already built; the finding was wrong
                      what: >
                        RETIRED, NOT DEFERRED. Compare-and-set on write was already built:
                        reason/runner.py:570 _graph_version_guard reads the tenant row `for share`,
                        compares against the expected revision and yields a boolean the caller at
                        line 1276 honours by refusing to publish on drift. 12 more sites in deliver/
                        and api/ take the same lock. The finding came from grepping context/ only,
                        and the read-modify-write spans packages by design — a guard lives with the
                        READER, not the writer. See
                        speedrun008/YCW27/layer-3-context-graph/STEP-02-WITHDRAWN-compare-and-set.md
                      artifact: genios_engine/reason/runner.py
                      verify: uv run --no-sync pytest tests/test_graph_version_consistency.py -q
                      depends_on: [M10.C1.L-data.V1.U02]

        - id: M10.C2
          name: A hold that asks
          layers:
            - layer: logic
              levels:
                - level: 0
                  units:
                    - id: M10.C2.L-logic.V0.U04
                      status: done            # 2026-09-30
                      what: >
                        A HOLD raises the EvidenceNeed that would clear it. THREE of seven hold
                        reasons, and the four exclusions are the design: conflict_open and
                        cross_domain_contradiction are adjudication, identity_review_required needs a
                        human, and pattern_evidence_required is OUR missing rule not the tenant's
                        missing document. AND qes_required + verified_evidence_required are ONE
                        question, not two — measured at 480 of 504 holds carrying both.
                      # A separate module rather than inside situation_publisher: publication must
                      # not grow a second responsibility, and this is a pure mapping over a held
                      # candidate that is testable without the publisher's eight admission laws.
                      artifact: genios_engine/context/hold_needs.py
                      verify: uv run --no-sync pytest tests/context/test_a_hold_asks_for_what_would_free_it.py -q
                      depends_on: [M9.C2.L-contract.V0.U06]
                - level: 1
                  units:
                    - id: M10.C2.L-logic.V1.U05
                      status: done            # 2026-09-30
                      what: >
                        A met need earns another admission attempt; an unavailable one stops the
                        waiting WITH A REASON; a still-open one changes nothing; and a hold that
                        asked no question is not called "waiting" at all. An EXPIRED open need counts
                        as unavailable — otherwise a hold waits forever on a question nobody will
                        answer. eval_time is a parameter, never now().
                      artifact: genios_engine/context/hold_resolution.py
                      verify: uv run --no-sync pytest tests/context/test_a_met_need_clears_its_hold.py -q
                      depends_on: [M10.C2.L-logic.V0.U04, M9.C2.L-integration.V3.U09]

            - layer: integration
              levels:
                - level: 2
                  units:
                    - id: M10.C2.L-integration.V2.U06
                      status: done            # 2026-09-30 — added during the build, not planned
                      what: >
