    screen never creating a person is a written privacy rule. On the golden set: 10 of 32
    must-detect cases are lost before memory, 4 of 12 must-abstain cases are not exercised.
  vision: >
    Every kept mail and every calendar event enters memory within two sweeps. A mail with a signal
    enters as today; a mail with none enters with the L1 extraction it already has — its words, at
    the confidence it scored, marked below the floor, with no model call; an archived mail enters
    as metadata only — who wrote to whom, when, in which thread — with no text, no ball-in-court and
    no correlation; a calendar event is a meeting node whatever its signal, its newest version
    winning. Every recovery path ends in a re-read, and an archived mail can be promoted out of the
    archive by the same re-read. Screen still creates no person. On the golden set the cases lost
    before memory reach it and the board is re-recorded with every move named; in production the
    share of kept events with an L2 run goes from ~7% to at least 95%, and meeting nodes from 2 to
    every calendar event.
  order_note: >
    C1 (the lane decision, pure) first; then C2, the pull and its pending count, which unlock every
    later unit; then C3, the writers per lane, the meeting and billing; then C4, recovery and
    promotion; then C6, the production checks; the golden set last (C5) — its cassettes, its board
    and the acceptance — because every unit above moves it. Not in this block, by the check: the
    meeting ↔ thread link (no writer exists; STEP-09 groups them); screen-made people (D22);
    `poison_quarantine` (nothing stored to re-read — a connector re-fetch, STEP-08).
