persona_brain_and_layer_repair:
  status: planned_awaiting_confirmation
  revision: 2
  requested_order: [M8, M9, M10, M11, M12]

  vision: >
    On the pilot tenant, a card names what it lacks in the vocabulary of the business it is
    about, ranks on a number Layer 1 measured rather than a default constant, and carries
    doctrine about what good looks like for that kind of company and that person's role. A
    tenant whose persona cannot be resolved behaves exactly as the engine does today, and says
    so on the card.

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # REVISION 2 — what contact with the code changed, before a line was written.
  #
  # Revision 1 invented a parallel persona system: a new `_personas/` tree, two new schemas, a
  # new registry. Three measurements retired it.
  #
  #   1. `Domain Expertise/_personas/` IS INVISIBLE TO EVERY CORPUS TOOL. `_lib.domains()` skips
  #      any directory starting with `_` and requires a `domain.yaml`. `validate.py` would have
  #      reported "0 errors — OK" while validating nothing, which is exactly the verify-that-
  #      passes-on-empty-code this build loop forbids.
  #
  #   2. THE COMPANY-PERSONA MECHANISM ALREADY EXISTS, END TO END, AND IS EMPTY. The corpus has
  #      a `verticals/` axis beside `models/`, with a schema, an inheritance rule
  #      (vertical -> model -> canonical) and a loader that files them as `variant` documents.
  #      Selection is `l3_activation.variant_ids`, read by `declared_variants`, passed through
  #      `domain_shadow` -> `knowledge_retriever` -> `brain_resolver` -> `expertise_builder`.
  #      Measured 2026-09-15: 88 models authored (20 admin, 33 sales, 35 support), ZERO
  #      verticals, and `variant_ids = '[]'` on all three activation rows. Built, wired, unused —
  #      the same shape as the three empty brains and the five dead L2 lanes.
  #
  #      So Group A is not new machinery. It is content for an axis that already resolves, plus
  #      the one genuinely missing piece: deciding WHICH vertical a tenant is. That decision is
  #      Layer 2's, exactly where it was argued it should be.
  #
  #   3. `org_seats.role` IS AN ACCESS ROLE, NOT A JOB PERSONA. All three seats read 'admin'.
  #      And `seat_profiles` (migration 0164, 0 rows) is a BEHAVIOURAL profile — "usual work
  #      hours, what to ignore". Neither is the job axis, so Group B is genuinely new; it extends
  #      `seat_profiles` rather than minting a fourth table beside it.
  #
  # RETIRED, never reused:
  #   M8.C1.L-contract.V0.U01  parallel company persona schema   -> the vertical schema exists
  #   M8.C1.L-contract.V0.U02  parallel role persona schema      -> extends seat_profiles instead
  #   M8.C1.L-contract.V1.U03  persona ids in the vocabulary     -> variants are already a kind
  #   M8.C1.L-contract.V1.U04  seed documents under _personas/   -> invisible path
  #   M8.C2.L-logic.V0.U01     parallel persona registry         -> authoring.py already loads variants
  #   M10.C2.L-contract.V0.U01 parallel doctrine schema          -> model.schema.json is the doctrine schema
  # ═══════════════════════════════════════════════════════════════════════════════════════════

  laws:
    - Persona shapes the QUESTION, never the ANSWER. It may add an expectation, a word, or a
      metric to sample. It may never add a fact, close a gap, or move a confidence.
    - Unknown persona is a first-class answer with a declared refusal, never a default persona.
    - Ranking is Layer 4's. A role weight never reaches Layer 2.
    - Every persona-derived expectation carries which level answered, the same discipline the
      reply-cadence cascade already uses.
    - Existing floors stay. `domain_spec.expected_fields`, `TRENDED_METRICS` and the canonical
      corpus are the floor a persona adds to, never a thing a persona replaces.
    - Ride the mechanism that exists. A second way to say what the corpus already says is how
      88 authored models came to reach nobody.

