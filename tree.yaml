    C4, because the legacy lane replays a skipped subject's last outcome and a DEFER must replay as
    indeterminate. C6 last: the counter, the health check, and the golden acceptance — an
    unchanged sweep costs 0 model calls on every founder case. Not in this block, by the check:
    "no model for shadow" (it would break replay, which must not vary by mode — the gate covers
    shadow rows' unchanged sweeps instead) and renewing a standing signal's authority (cards are
    replaced at expiry today; STEP-14).
