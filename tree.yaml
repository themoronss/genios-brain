vision: >
  On the pilot tenant, the intelligence that reaches Layer 4 is about things that actually
  happened in this mailbox: promises this org made, threads where the ball is ours, counterparties
  who have not replied. Reply history is never mistaken for a live claim, a greeting is never a
  relationship change, one sentence produces one signal, one outreach produces one situation, and
  an absence carries the receipt it has always had. Measured on org_e97e86f858ad48b2bbf64b8a.

