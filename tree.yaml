# ═══════════════════════════════════════════════════════════════════════════════════════════════
# ATLAS v2 ALIGNMENT — M8 onward. Added 2026-09-30.
#
# M1-M7 above are permanent and retired-in-place; their IDs are never reused. This block is a
# NEW program: bring the code into line with the GeniOS Design Atlas v2 (29 Sep 2026), layer by
# layer, in DATA-FLOW order (capture -> context -> reason -> executive -> deliver -> feedback),
# which is not the Atlas's own numbering.
#
# ⛔ WHY M8 EXISTS AND NOTHING MAY START BEFORE IT.
# The Atlas is grounded — every codebase number in it was re-measured and matches. But it was
# written design-side, so several things it badges `gap` or `target` are already built, and one
# of them is built BETTER than the Atlas specifies:
#
#   Atlas badge                      | measured reality
#   ---------------------------------|-------------------------------------------------------
#   L1 "no coverage receipts" (gap)  | capture/coverage/signal_coverage.py — per-source, frozen
#                                    | at capture, never 100% by default; + context/quality/
#                                    | window.py "read 37 of about 465". Both written against
#                                    | the same benchmark failure the Atlas cites.
#   ReasoningRequest (target)        | contracts/reasoning.py:679 — exists
#   ContextSnapshot (built)          | contracts/reasoning.py:365 — correct
#   "targeted second pass" (target)  | CritiqueVerdict — exists
#   DeliveryResult (target name)     | DeliveryObject / DeliveryDecision — exists
#   DecisionObject (target)          | ⛔ SETTLED ALREADY. tests/contracts/
#                                    | test_the_decision_object_is_one_object.py: "The plan that
#                                    | led here assumed five competing definitions to choose
#                                    | between. It did not: ReasoningDecision IS the object."
#                                    | The Atlas re-opens a question the code closed.
#
# A previous plan made exactly this mistake once and the code investigation corrected it. M8 is
# the guard against making it a second time, and it produces a RE-RUNNABLE check, not a one-time
# human read, so the Atlas cannot drift from the code again.
#
# VERIFIED MISSING (zero hits, safe to build under any M8 outcome):
#   EvidenceNeed · SituationSeed · QualifiedEnterpriseSignalBundle · the five funnel counters ·
#   the five output lanes.
#
# Verify prelude every unit needs:
#   export PATH="/Users/rohitswerashi/MacBook Air Professional/VS Code/VS Code Setup/toolchains/bin:$PATH"
#   cd "<repo>" && uv run --no-sync pytest <file> -q
# ═══════════════════════════════════════════════════════════════════════════════════════════════

atlas_v2_alignment:
  status: proposed_awaiting_confirmation
  source: "GeniOS Design Atlas v2 — 29 Sep 2026 (HTML + Markdown editions)"
  vision: >
    Every built/target/gap badge in the Atlas is checked against the code by a command anyone can
    re-run, and the four architecture decisions the Atlas leaves open are recorded where the code
    enforces them rather than where prose describes them. On that corrected baseline each of the
    six product layers reaches its Atlas target in data-flow order: Layer 1 hands up a bundle that
    carries its own coverage and can be asked for a named missing fact; the Context Graph answers a
    bounded, revision-stamped read and turns a HOLD into a request instead of a wait; no reasoning
    unit runs without its declared inputs scheduled and uncertainty routes a finding to a lane
    instead of deleting it; the Executive queue is not empty and one situation reaches a verified
    outcome end to end; every sentence on a card is cited or labelled and nothing is dropped
    without a receipt; and a wrong card debits the layer that actually failed.
  order_note: >
    Data-flow order, not Atlas numbering. capture feeds context; reason READS context. The Atlas
    numbers Reasoning L2 and the Context Graph L3, but data reaches them the other way round.

  milestones:
    # ─────────────────────────────────────────────────────────────────────────────────────────
    - id: M8
      name: The baseline is true
      ships: >
        A command prints, for every Atlas badge, whether the code agrees — and the four blocking
        decisions exist as enforced code instead of prose. Nothing above this milestone is planned
        in detail until it is green.
      categories:

        - id: M8.C1
          name: Badge verification
          layers:
            - layer: logic
              levels:
                - level: 0
                  units:
                    - id: M8.C1.L-logic.V0.U01
                      what: >
                        Extract every badge claim in the Atlas markdown (running / built / target /
                        gap, plus each named symbol, table and file) into one machine-readable
                        claims file.
                      artifact: scripts/atlas_claims.py
                      verify: uv run --no-sync python scripts/atlas_claims.py --count
                      depends_on: []
                    - id: M8.C1.L-logic.V0.U02
                      what: >
                        The probe library: for a claimed symbol, table, file or caller, answer
                        EXISTS / ABSENT / UNPROVABLE against the tree. UNPROVABLE is a real third
                        answer and is never silently read as ABSENT.
                      artifact: scripts/atlas_probe.py
                      verify: uv run --no-sync pytest tests/tools/test_atlas_probe.py -q
                      depends_on: []
                - level: 1
                  units:
                    - id: M8.C1.L-logic.V1.U03
                      what: >
                        The resolver: run every claim through the probes and emit the disagreement
                        list — each row naming the badge, the claim, the probe verdict and the file
                        that settles it.
                      artifact: scripts/atlas_verify.py
                      verify: uv run --no-sync python scripts/atlas_verify.py --report
                      depends_on: [M8.C1.L-logic.V0.U01, M8.C1.L-logic.V0.U02]
            - layer: integration
              levels:
                - level: 2
                  units:
                    - id: M8.C1.L-integration.V2.U04
                      what: >
                        The corrected baseline, committed as the document the rest of this program
                        is planned against.
                      artifact: speedrun008/ATLAS_BASELINE.md
                      verify: uv run --no-sync python scripts/atlas_verify.py --assert-baseline speedrun008/ATLAS_BASELINE.md
                      depends_on: [M8.C1.L-logic.V1.U03]

        - id: M8.C2
          name: The four decisions, enforced
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M8.C2.L-contract.V0.U05
                      what: >
                        DECISION 1 — the confidence vector's axes. Code has evidence / freshness /
                        consistency / identity / coverage / analytic and the law that overall_bp is
                        bounded by the weakest axis. The Atlas names evidence / frame / temporal /
                        causal / authority / coverage; only two overlap. Record the chosen set and
                        the composition law in one place, with the rejected set named.
                      artifact: genios_engine/contracts/situation.py
                      verify: uv run --no-sync pytest tests/contracts/test_the_vector_axes_are_declared_once.py -q
                      depends_on: [M8.C1.L-integration.V2.U04]
                    - id: M8.C2.L-contract.V0.U06
                      what: >
                        DECISION 2 — correlation placement. The Atlas puts one Signal Correlation
                        component in L1; ten correlator modules (5,234 lines) live in context/ and
                        every one reads the graph, which the Atlas puts downstream. Record which
                        way it goes and why, next to the import rule that forbids the other.
                      artifact: docs/LAYER_MAP.md
                      verify: uv run --no-sync pytest tests/test_layer_topology.py -q
                      depends_on: [M8.C1.L-integration.V2.U04]
                    - id: M8.C2.L-contract.V0.U07
                      what: >
                        DECISION 3 — the naming freeze. One table mapping every Atlas name to the
                        code name that already holds it (ReasoningDecision, DeliveryObject,
                        brief.v1), naming which side moves.
                      artifact: docs/LAYER_MAP.md
                      verify: uv run --no-sync pytest tests/test_atlas_names_resolve.py -q
                      depends_on: [M8.C1.L-integration.V2.U04]
                    - id: M8.C2.L-contract.V0.U08
                      what: >
                        DECISION 4 — is a layer the package or the product layer? context/ spans
                        product L2 and L3; reason/ spans L2 and L4. Record the addressing rule so
                        two product layers cannot be scheduled against one package.
                      artifact: genios_engine/LAYERS.py
                      verify: uv run --no-sync pytest tests/test_layer_topology.py -q
                      depends_on: [M8.C1.L-integration.V2.U04]
                - level: 1
                  units:
                    - id: M8.C2.L-contract.V1.U09
                      what: >
                        The totality guard, both directions — a name the Atlas uses that the code
                        does not hold fails, and a boundary contract the code holds that the Atlas
                        never names also fails. One direction alone is half a guard.
                      artifact: tests/test_atlas_names_resolve.py
                      verify: uv run --no-sync pytest tests/test_atlas_names_resolve.py -q
                      depends_on: [M8.C2.L-contract.V0.U07]

        - id: M8.C3
          name: The funnel counters
          layers:
            - layer: data
              levels:
                - level: 0
                  units:
                    - id: M8.C3.L-data.V0.U10
