    later unit; then C3, the writers per lane, the meeting and billing; then C4, recovery and
    promotion; then C6, the production checks; the golden set last (C5) — its cassettes, its board
    and the acceptance — because every unit above moves it. Not in this block, by the check: the
    meeting ↔ thread link (no writer exists; STEP-09 groups them); screen-made people (D22);
    `poison_quarantine` (nothing stored to re-read — a connector re-fetch, STEP-08).
