#   atlas_v2_alignment                M8  … M14   ← the YCW27 work
#   yc2_w27                           M16 … M19   ← YC-II W27; numbered past every other
#                                                   block, so it adds no collision
#   yc2_w27_s02                       M20         ← YC-II W27 STEP-02, the change gate (2026-10-06);
#                                                   numbered past every other block for the same reason
#   yc2_w27_s03                       M21         ← YC-II W27 STEP-03, the gate keeps everything
#                                                   (2026-10-06); past every other block again
#   yc2_w27_s04                       M22         ← YC-II W27 STEP-04, who is us (built 2026-10-06);
#                                                   past every other block again
#   yc2_w27_s05                       M23         ← YC-II W27 STEP-05, every kept item enters memory
#                                                   (2026-10-06); past every other block again
#   yc2_w27_s06                       M24         ← YC-II W27 STEP-06, nothing is lost silently
#                                                   (proposed 2026-10-07); past every other block again
#   yc2_w27_s07                       M25         ← YC-II W27 STEP-07, the company brief
#                                                   (proposed 2026-10-07); past every other block again
#   yc2_w27_s08                       M26         ← YC-II W27 STEP-08, the deleted mail comes back
#                                                   (built 2026-10-07); past every other block again
#   yc2_w27_s09                       M27         ← YC-II W27 STEP-09, a file for every piece of work
#                                                   (built 2026-10-07); past every other block again
#   yc2_w27_s10                       M29         ← YC-II W27 STEP-10, the expert's numbers (built
#                                                   2026-10-08); M28 is held for STEP-09's cards (D2)
#   yc2_w27_s11                       M30, M31    ← YC-II W27 STEP-11, founder playbooks (approved
#                                                   2026-10-09, building); past every other block again
#
# So `M11` is AMBIGUOUS on its own: it names "The remaining Layer 3 losses" in one block and
# "L2 Reasoning" in another, and `M11.C1.L-logic.V0.U01` exists twice with different meanings.
#
# ⛔ THE CANONICAL FORM IS `<block>/<id>` — e.g. `atlas_v2_alignment/M11.C2.L-logic.V1.U04`.
# A bare id in a ticket, a commit or a step document is only legible when the block is obvious from
# context, and it is usually not.
#
# WHY NOT RENUMBER. Two reasons, and both are rules this repo already follows.
#   1. An id is RETIRED, never reused and never changed. Renumbering the older blocks would rewrite
#      the address of work that has already been logged against it.
#   2. `atlas_v2_alignment` is referenced by ~800 lines of step documents under
#      speedrun008/YCW27/ that say M8–M14. Renumbering it would make every one of them wrong.
#
# This is the same shape as the layer-vocabulary collision that `genios_engine/LAYERS.py` documents
# and answers with the identical rule: **always name the namespace, never the digit alone.**
# `tests/test_tree_ids_are_addressable.py` fails the build if a block is added that widens the
# collision.
# ═════════════════════════════════════════════════════════════════════════════════════════════

vision: >
  On the pilot tenant, the intelligence that reaches Layer 4 is about things that actually
  happened in this mailbox: promises this org made, threads where the ball is ours, counterparties
  who have not replied. Reply history is never mistaken for a live claim, a greeting is never a
  relationship change, one sentence produces one signal, one outreach produces one situation, and
  an absence carries the receipt it has always had. Measured on org_e97e86f858ad48b2bbf64b8a.

