                        clock ladders: deadline hours on timeline_unit.URGENCY_LADDER, elapsed
                        days on DAY_LADDER. NARROWED IN BUILD, by measurement: open loops and L1
                        conflicts were planned here, but on all 40 golden cases the request itself
                        carries what the decision reads (a new ask or reply is a new event in the
                        context), so only the two inputs outside it are carried.
