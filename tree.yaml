                        expert's founder cards, found every one with a NULL success signal.
                      artifact: "genios_engine/reason/expert/decide.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/expert/test_the_review_decides.py"
                      depends_on: [M33.C1.L-logic.V0.U01]
            - layer: data
              levels:
                - level: 0
                  units:
                    - id: M33.C1.L-data.V0.U06
                      what: >
                        The expert pass says which files its reviews cover — `covered`, file → the
                        fingerprint of the VALID review that answers it now: written this pass, its
                        fingerprint's own (unchanged), or the last one when nothing touched the file since
                        (untouched). Never a file that is ours, refused, cut, failed, waiting or carried.
                        Minted 11 Oct at the build of V0.U01: the pass alone knows each file's current
                        fingerprint, and the compiled lane needs it to know what to stand down.
                      artifact: "genios_engine/reason/expert/sweep.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/reason/expert/test_the_expert_pass.py"
                      depends_on: [M32.C5.L-integration.V3.U05]
                - level: 1
                  units:
                    - id: M33.C1.L-data.V1.U11
                      what: >
                        The pass names each covered file's people (`people`: file → its people, the anchor
