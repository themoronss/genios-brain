  vision: >
    Every number the expert reasons with about a file is computed, exact, and says what it rests on:
    their reply time counted once and your own, each with its n and basis, "normal" only at n >= 5
    and "too few to say" below; the file's timeline, both directions, with who wrote and the evidence
    id, its gaps, and whether the silence exceeds its own prior gaps; a bounce on the file it belongs
    to; a wave as one object; the connector's rate; and a coverage receipt per mailbox, so "no reply"
    is said only when the window covers it. GET /v1/workstreams/{file} serves it; a health check
    holds every number to its n. Stage dwell and what-if wait (D39).
