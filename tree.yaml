    tier (`speedrun008/YC-II W27/baseline/yc2w27-s07-qa/`); crosscheck ship.
  source: 'speedrun008/YC-II W27/STEP-07 §1–§7, re-checked claim by claim against speedrun008 @ 18b41f0f
    (STEP-07 §8) — by hand and by three read-only traces (every model call site; every store the plan
    names; the capture gate end to end), their claims checked line by line. Golden: 316 of 368 recorded
    model calls judge or read, 0 prompts carry any company context; the portal''s and the intro agent''s
    mail are stopped by four stages keyed on ''is the sender known''. The plan''s stores cannot hold a
    line-level brief (user_model_proposals is per-person persona JSON with no writer; canon may never
    reach the graph; mission-critical holds organisation names only).'
  vision: 'The founder''s company brief exists, versioned, built only from lines the founder accepted:
    the company, the people who are us, goals, work in motion, key people, connectors, a watchlist, preferences.
    Every model call that judges or reads carries it — and a tenant without one sees no change at all.
    The gate keeps and reads what the brief names (W-07). A changed brief re-decides each subject once
    and no cache serves an answer made under an older one. The drafter proposes from memory patterns and
    a weekly diff; the founder decides. On the golden set every judge/read prompt carries the founder''s
    brief and the board moves only where the brief''s deterministic reading moves it.'
  order_note: 'C1 first (the contract, the table, the store, the composer). C2, C3, C4 and the thirteen
    C5 units then depend only on C1 — C5''s site units touch one file each and can be built side by side.
    C6 after C1. C7 last: the golden brief, the re-record, the acceptance. Not in this block: card copy
    and the other writing sites (STEP-14); the dashboard screen (genios-dashboard); letting the AI filter''s
    archive stand (D29, default no).'
  milestones:
  - id: M25
    name: The company brief (STEP-07)
    ships: A versioned company brief from accepted lines only; routes and a script to accept, edit, reject
      and remove; a drafter that proposes from memory patterns and a weekly diff; the gate keeps and reads
      the brief's senders; every judging and reading prompt carries it, guarded; a health check; on the
      golden set the brief in every judge/read prompt and the board re-recorded.
