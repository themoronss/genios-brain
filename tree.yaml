# ═════════════════════════════════════════════════════════════════════════════════════════════
# yc2_w27 — YC-II W27 (speedrun008/YC-II W27/), the block after STEP-00. Proposed 2026-10-05.
#
# ⛔ ITS MILESTONES START AT M16 ON PURPOSE. M1–M15 are each taken in at least one older block, so
# a block numbered from M16 adds no collision; tests/test_tree_ids_are_addressable.py asserts that.
# Canonical addresses are still `yc2_w27/<id>`.
#
# Verify commands run from the repo root. A command that sets GENIOS_TEST_DATABASE_URL needs the
# scratch Postgres of `STEP-00` §4.2 — and the `postgresql+psycopg://` scheme, never a bare
# `postgresql://` (tests/test_llm_cost_attribution.py builds its engine from the raw URL).
#
# ⛔ ONE WRITER PER FILE. `genios_engine/api/routes.py` is touched by four units (M17.C1.U02,
# M17.C2.U04, M18.C1.U05, M19.C2.U01) and `tests/packs/brains/test_org_discovery.py` by two
# (M16.C4.U05, M16.C5.U02): never build those in parallel.
# ═════════════════════════════════════════════════════════════════════════════════════════════
yc2_w27:
  status: proposed_awaiting_confirmation
  source: >
    speedrun008/YC-II W27/ — STEP-00 §4.2 (the database suite), STEP-18 B1/B2/B17/B18/B19, STEP-01;
    the root causes measured on 2026-10-05 against speedrun008 @ e96787d8 and a scratch Postgres 17.
  vision: >
    The database suite runs green on Postgres, so every later step's verify means something. The
    funnel writes its zeros in every lane, a mail whose extraction failed is read again, and a
    Gmail attachment is fetched instead of refused. Calibration runs on Postgres and only proposes —
    it mutes nothing and moves no threshold until Rohit says otherwise. One command prints the
    golden-set board, and its numbers are the before-score every later step is measured against.
  order_note: >
    Rohit's order (2026-10-05): the database part first, then B17, B18 and B19, then the golden set.
    The edges below are facts, not that order: every later milestone depends on M16 because its
    verify runs on the scratch database and a red baseline makes it unreadable. M17, M18 and M19
    do not depend on each other; Rohit's order sequences them, and the one-writer rule above keeps
    their shared files apart.

  milestones:
    # ─────────────────────────────────────────────────────────────────────────────────────────
    - id: M16
      name: The database suite is green
      ships: >
        GENIOS_TEST_DATABASE_URL=postgresql+psycopg://… pytest -q exits 0 — 0 failed, 0 errors —
        where on 2026-10-05 it gave 16,683 passed, 50 failed. The hermetic suite stays green.
        27 of the 50 are one live bug (B2); the other 23 are test-side and need no engine change.
      categories:

        - id: M16.C1
          name: The edge vocabulary covers every writer (STEP-18 B2 — 27 tests)
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M16.C1.L-contract.V0.U01
                      what: >
                        The totality guard sees every way an edge type reaches `write_edge`: a
                        literal, a module constant, a loop over literal tuples (with list +
                        comprehension), and every `RelationMap` built from literals. It names the
                        one indirection it resolves through `RelationMap` (`context/structured.py`
                        ~93) and fails on any write site it cannot resolve. Today's regex sees only
                        `edge_type="…"`, so `involves`, `edited`, `assigned` and `used` were invisible
                        to it — and adding them naively would turn its other half red.
                      artifact: tests/context/test_the_edge_vocabulary_is_closed.py
                      verify: .venv/bin/python -m pytest "tests/context/test_the_edge_vocabulary_is_closed.py::test_the_collector_sees_every_write_path" -q
                      depends_on: []
                - level: 1
                  units:
                    - id: M16.C1.L-contract.V1.U02
                      what: >
                        `EDGE_TYPES` gains the four relations already being written — `involves`
                        (deal and the person on it; CRM rows write it person -> deal, so readers
                        walk it both ways), `edited` (person -> document: last editor, not owner),
                        `assigned` (person -> task), `used` (person -> product account) — each with
                        its direction and what it does not mean.
                      artifact: genios_engine/context/graph_store.py
