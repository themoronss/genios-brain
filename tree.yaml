                      Fault-inject unavailable refinement reads and preserve baseline behaviour.
                    artifact: genios_engine/context/outreach_situations.py::refresh_outreach_situations
                    depends_on: [M5.C3.L-data.V1.U01]
      - id: M5.C4
        name: 1C and 1D — established subjects receive observations
        layers:
          - layer: data
            levels:
              - level: 0
                units:
                  - id: M5.C4.L-data.V0.U01
                    verify: uv run --no-sync pytest tests/context/test_event_presence_store.py -q -p no:randomly
                    what: >
                      Persist replay-safe event presence with real SQLite observation/source-ref SQL.
                      Keep semantic observations untouched; JSON evidence must remain actual JSON.
                    artifact: genios_engine/context/graph_store.py::write_event_presence
