        - id: M36.C2
          name: What is missing is asked
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M36.C2.L-contract.V0.U01
                      what: >
                        `0201_founder_questions`: the one question a file asks the founder — the file, the
                        review that asks it (fingerprint, the audited run), the question, why it matters, when
                        asked; answered (the words, by whom, when) or retired (why) — one open question per
                        file. Not `evidence_needs`: a question to the founder is answered by the founder, and
                        the needs executor closes for good a need no source can fetch. Wiped by `/reset`;
                        rolled back cleanly.
                      artifact: "migrations/0201_founder_questions.sql"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/context/test_the_founder_questions_table.py tests/platform/test_the_code_can_always_be_rolled_back.py"
                      depends_on: []
            - layer: data
              levels:
                - level: 1
                  units:
                    - id: M36.C2.L-data.V1.U02
                      what: >
                        The questions, kept (`context/founder_questions`): ask (a file's new question retires
                        its old one), answer (once, the founder's words), retire (the review no longer asks),
                        the file's open question, the answers a file holds.
                      artifact: "genios_engine/context/founder_questions.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/context/test_a_file_asks_one_question.py"
                      depends_on: [M36.C2.L-contract.V0.U01]
                - level: 2
                  units:
                    - id: M36.C2.L-data.V2.U07
                      what: >
                        Your answer feeds the file: the dossier shows what you told us (`[answer:<id>]`, your
                        words, when) and the fingerprint names it — so the next sweep reviews the file with
                        your answer in front of the expert. A file with no answer is printed and fingerprinted
                        byte for byte as before.
                      artifact: "genios_engine/reason/expert/dossier.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/reason/expert/test_your_answer_feeds_the_file.py tests/reason/expert/test_the_dossier.py tests/reason/expert/test_the_file_fingerprint.py"
                      depends_on: [M36.C2.L-data.V1.U02]
                    - id: M36.C2.L-data.V2.U12
                      what: >
                        Your answer is your words, and an answered question is not asked again (fix-first,
                        crosscheck `03` X05, X25): the dossier's answer line prints only your words and the
                        question's id — never the question's text, which for a held review IS the claim its
                        check dropped, and never its date (a line of its own, which no fact can cite) — so a
                        fact citing `answer:` is grounded on your words alone ("No. He asked for the roadmap"
                        never grounds "Send Neel the deck", pinned on `verify.check_review`, verify unedited);
                        `founder_questions.ask` returns the ANSWERED question when the file already answered
                        the same words under any fingerprint, retiring an open other one (`NO_LONGER_ASKED`) —
                        a question retired unanswered may still be asked again; and `asks.ask_the_founder`
                        files no signal for it (`answered_already`), the file's open question signal expired
                        and its card REPLACED. Amended 13 Oct (fix, the STEP-13 second crosscheck B2 — X05 was
                        still open): names and numbers are all a fact's check reads, so your "No. He asked for
                        the roadmap" still grounded "Neel asked for the deck", and in the database path the
                        resolved QUESTION card's line (its headline the claim the check dropped) grounded the
                        claim again, its move shown. Now a question card's headline grounds nothing (the file's
                        people name its question cards by their signal's rule, `file_judgments.PriorCard.
                        rule_id`; never printed), and a move whose standing ground is only what you told us —
                        your answer, a question card; no mail or meeting — is confirmed with you first: held,
                        "You said: “…”. Should we go ahead with “<the move>”?" (`asks.WHY_CONFIRM`); your yes
                        to that (`verify.confirms`: a closed yes, no negation, no "but") lets it stand, noted
                        `confirmed_by_you`; any other answer suppresses it (`declined_by_you`). The bound,
                        declared: a move resting on a mail beside your answer stands on the mail; polarity is
                        not read.
                      artifact: "genios_engine/reason/expert/verify.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/<fresh> .venv/bin/python -m pytest -q tests/reason/expert/test_a_move_on_your_answer_is_confirmed.py tests/reason/expert/test_your_answer_feeds_the_file.py tests/context/test_a_file_asks_one_question.py tests/reason/expert/test_a_held_file_asks.py tests/deliver/test_answering_a_question.py"
                      depends_on: [M36.C2.L-data.V2.U07, M36.C2.L-integration.V2.U03, M36.C2.L-interface.V4.U06]
                    - id: M36.C2.L-data.V2.U14
                      what: >
                        An answered file is never silenced (added 13 Oct by the STEP-13 second crosscheck, F2):
                        a review that, after your answer, asks the very words you answered got
                        `answered_already` — no signal, no card — and the gate remembered it SUPPRESSED, skipped
                        until the file moved (0 signals, 0 cards, `expert_unchanged` the next day). The words you
                        answered are still never asked again (X25); the file asks what should happen next,
                        quoting your latest words (`asks.after_your_answer`, `WHY_AFTER_YOUR_ANSWER`), on its own
                        card; only when that too was answered is nothing left to ask, and the gate remembers it
                        INDETERMINATE (decided again next sweep, no model), never SUPPRESSED.
                      artifact: "genios_engine/reason/expert/asks.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/<fresh> .venv/bin/python -m pytest -q tests/reason/expert/test_a_held_file_asks.py tests/deliver/test_answering_a_question.py tests/deliver/test_a_question_card.py"
                      depends_on: [M36.C2.L-data.V2.U12, M36.C2.L-integration.V2.U11]
            - layer: logic
              levels:
                - level: 1
                  units:
                    - id: M36.C2.L-logic.V1.U04
                      what: >
                        A question is authorised as a question (`reason/authority`): an audited expert run
                        that ended insufficient on its answer, unexpired, its question open on the file —
                        never through the decision's fragment, which needs a selected move.
                      artifact: "genios_engine/reason/authority.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/reason/test_a_question_is_authorised.py"
                      depends_on: [M36.C2.L-contract.V0.U01]
                - level: 2
                  units:
                    - id: M36.C2.L-logic.V2.U10
                      what: >
                        The question is asked in checked words (fix-first, crosscheck `03` X06, X10's asks
                        part, X34): `asks.question_words` reads only what the check let stand — a held file
                        asks the check's own question; a find-out file asks YOU a real question: its review's
                        first unknown when it is a question or reads as one ("Whether…" → "Can you tell us
                        whether…?") and every name and number in it is in the checked words (the card's words,
                        the quotes the check matched, the facts it kept — never a dropped fact or a withheld
                        reading), else its checked move framed "Can you tell us: …?" — never the raw
                        `frames.primary`, never an instruction. Its `why` is one closed, founder-facing phrase
                        (`asks.WHYS`, read off the check's verdicts), never the check's internal reason; the
                        question card's situation is the checked reading or that closed phrase, and a question
                        filed with any other `why` is carded with the closed one. (Added 12 Oct, found by the
                        golden lane: STEP-11's founder-card clause.) The question card says what answering does
                        and what waiting costs — `success_signal` and `do_nothing_consequence`, closed phrases
                        of ours, never model prose — and has no play window (`outcome_window_days` None).
                        Amended 13 Oct (fix, the STEP-13 second crosscheck G2 and the acceptance's echo): a
                        held question asked "Is it so: “<the fell fact's claim / the move as written>”? It is not
                        in what it cites." — the words the check dropped (a misattributed name, a wrong number) on
                        the question card, and "not in what it cites" said of words the mail holds. It asks "What
                        is the next step with <the counterparty>? We held the one we found: <why>.", why worded
                        per the reason it fell (`claim_check.HELD_BECAUSE`, MISQUOTED reworded true of what
                        failed; the move's own words by `verify._MOVE_FELL`), never a word that failed; the
                        acceptance's three strict xfails XPASS and lose their markers.
                      artifact: "genios_engine/reason/expert/verify.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/<fresh> GENIOS_GOLDEN_REQUIRED=1 .venv/bin/python -m pytest -q tests/reason/expert/test_a_held_question_says_truly_why.py tests/reason/expert/test_a_held_file_asks.py tests/deliver/test_a_question_card.py tests/replays/test_every_claim_is_checked.py"
                      depends_on: [M36.C2.L-integration.V2.U03, M36.C2.L-interface.V3.U05, M36.C2.L-data.V2.U12]
                    - id: M36.C2.L-logic.V2.U19
                      what: >
                        A question to you never names you, held or find-out (added 13 Oct by the STEP-13 second
                        crosscheck, F3): `names_us` is a SUBJECT matcher — a one-word company name must be the
                        whole subject, a first name claims nothing — so "…whether GeniOS is incubated…" and
                        golden F54's "…whether Arjun went to the event…" were asked, and a held question skipped
                        the filter. `platform/self_identity.speaks_of_us` reads PROSE: the company's name
                        whole-word at any length, written as a name; a first or a full name (a title, an article
                        aside); our addresses and domains. A question that names us is asked in the second person
                        (`to_you`: "whether you went…", "your deck", "Do you want…"; an address of ours "you")
                        where it can be — else passed over (find-out) or our closed question (held) — your own
                        quoted words left as you wrote them; each hit noted `speaks_of_you` on the `question`
                        line, and every card text's own note reads prose too.
                      artifact: "genios_engine/platform/self_identity.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/expert/test_a_question_never_names_you.py tests/reason/expert/test_a_held_file_asks.py tests/reason/expert/test_verify_recipient.py tests/reason/expert/test_verify_people.py"
                      depends_on: [M36.C2.L-logic.V2.U10]
                    - id: M36.C2.L-logic.V2.U17
                      what: >
                        A find-out file never asks an instruction (added 13 Oct by the STEP-13 second crosscheck,
                        G8 — X34 partly closed): with no unknown its checked words stand behind, the file framed
                        its checked MOVE "Can you tell us: <the move>?", and a move is an instruction (F22 "…: Find
                        out whether you count as…?", F52 "…: Check the current count of paying customers…?"; 4 of
                        the 8 authored find-out reviews). `asks._find_out_question` asks the review's unknowns in
                        order — the first that is, or reads as, a question and stands on the checked words —
                        else the checked move only when it IS a question, else our closed question
                        (`NOTHING_TO_ASK`); the two tests that pinned the framed move are restated with the reason.
                      artifact: "genios_engine/reason/expert/asks.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/<fresh> .venv/bin/python -m pytest -q tests/reason/expert/test_a_held_file_asks.py tests/deliver/test_a_question_card.py"
                      depends_on: [M36.C2.L-logic.V2.U19]
            - layer: interface
              levels:
                - level: 2
                  units:
                    - id: M36.C2.L-interface.V2.U09
                      what: >
                        The question card's own door in the card store (added 12 Oct, found while building U05:
                        every reader of a card re-proves the DECISION's authority, so a question card written
                        to `cards` would reach nobody): the insert holds the question's authority, and the
                        queue (`/cards`) and the card read (`/cards/{id}`) show a question card while its
                        question is open — never through the decision's door, never a decision through it.
                      artifact: "genios_engine/deliver/store.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/deliver/test_a_question_card_has_its_door.py"
                      depends_on: [M36.C2.L-logic.V1.U04]
                - level: 3
                  units:
                    - id: M36.C2.L-interface.V3.U05
                      what: >
                        The question card: the pipeline builds a card from each open question signal, by its
                        own authority — the question as its headline, why it matters as its situation, the
                        lane `investigation`, an Answer action; the file's one card (a new question or a
                        decision retires it).
                      artifact: "genios_engine/deliver/pipeline.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/deliver/test_a_question_card.py"
                      depends_on: [M36.C2.L-interface.V2.U09, M36.C2.L-integration.V2.U03]
                - level: 4
                  units:
                    - id: M36.C2.L-interface.V4.U06
                      what: >
                        Your answer: the card's Answer action (`POST /cards/{id}/action`, `answer` with your
                        words) answers the file's question, once, and resolves its card.
                      artifact: "genios_engine/deliver/actions.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/deliver/test_answering_a_question.py"
                      depends_on: [M36.C2.L-interface.V3.U05]
                    - id: M36.C2.L-interface.V4.U07
                      what: >
                        The Answer press and the sweep lock in ONE order (added 13 Oct by the STEP-13 second
                        crosscheck, G11; 886e16c5 "NOT FIXED, NOTICED"): the press locked card → signal → question
                        in one statement, the sweep question → signal → card — a deadlock when they meet. Both take
                        the file's question lock first (`context/founder_questions.lock_file`, a transaction-scoped
                        advisory lock on tenant and file), then rows: the press before its door, the sweep before it
                        asks or retires. Proven on two connections with pg_locks: while one holds the file's lock,
                        the press, the asking sweep and the retiring sweep each wait on that advisory lock holding
                        no row of the card, its signal or its question (each lockable NOWAIT). The statement pin
                        moves 3,108 → 3,110 by the two literals, the reason beside it.
                      artifact: "genios_engine/context/founder_questions.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/<fresh> .venv/bin/python -m pytest -q tests/deliver/test_answering_a_question.py tests/reason/expert/test_a_held_file_asks.py tests/platform/test_a_delete_is_not_a_read.py"
                      depends_on: [M36.C2.L-interface.V4.U06, M36.C2.L-data.V2.U14]
            - layer: integration
              levels:
                - level: 2
                  units:
                    - id: M36.C2.L-integration.V2.U03
                      what: >
                        The sweep asks: a covered file decided insufficient on its answer — its review held,
                        or finding out — files its question and its question signal (lane `investigation`);
                        any other decision retires the file's open question. And the needs queue has its
                        reader at last (`capture/acquire/need_executor.run_needs`, the composition root
                        joining the two halves): with no connector wired it refuses, counted, and closes
                        nothing (STEP-13 §1 claim 5).
                      artifact: "genios_engine/reason/domain_shadow.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/reason/expert/test_a_held_file_asks.py tests/capture/test_the_needs_queue_gets_worked.py"
                      depends_on: [M36.C2.L-data.V1.U02, M35.C3.L-integration.V2.U02]
                    - id: M36.C2.L-integration.V2.U11
                      what: >
                        A question lives while it is asked (fix-first, crosscheck `03` X04, X26, X27, X41): an
                        asking run is remembered STANDING on its question's window (never SUPPRESSED, which the
                        change gate skipped forever) and the file is decided again in the day before that window
                        closes (`change_gate.QUESTION_RENEW_MARGIN`) — a re-run re-binds the question, and the
                        re-bind moves its card's `expires_at` with its authority in the same statement; a question
                        card that lapsed while its question is still open and asked is revived — the same card,
                        queued (`deliver/store`'s upsert, the question builder's only); a file that leaves
                        coverage retires its question (`LEFT_COVERAGE`) and its card (`06` D60, the file's one
                        card) — but a pass whose expert covered nothing takes no question down; on a day the cap
                        is spent the question is still asked or the old decision cleared (the cap applies after
                        the outcome, to a decision that would be shown); and a re-bound question card reads the
                        review asking it now (the run's trigger). Proven at NOW+169 h with the gate intact.
                      artifact: "genios_engine/reason/domain_shadow.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/<fresh> .venv/bin/python -m pytest -q tests/reason/expert/test_a_held_file_asks.py tests/deliver/test_a_question_card.py tests/reason/test_change_gate.py"
                      depends_on: [M36.C2.L-integration.V2.U03, M36.C2.L-interface.V3.U05, M36.C2.L-logic.V2.U10]
                - level: 6
                  units:
                    - id: M36.C2.L-integration.V6.U08
                      what: >
                        On the golden set: F01 and F52 get their question card (must-detect up by two), every
                        other find-out file asks once and stays within its case's cards (F07, F21, F22, F54
                        measured), every must-abstain case holds; the board restated.
                      artifact: "tests/replays/test_a_held_file_asks_once.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test GENIOS_GOLDEN_REQUIRED=1 .venv/bin/python -m pytest -q tests/replays && GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python scripts/golden_score.py --assert-recorded \"speedrun008/YC-II W27/03-FINDINGS.md\""
                      depends_on: [M36.C2.L-data.V2.U07, M36.C2.L-interface.V4.U06, M35.C4.L-integration.V1.U03]
        - id: M36.C3
          name: The replays tighten
          layers:
            - layer: integration
              levels:
                - level: 0
                  units:
