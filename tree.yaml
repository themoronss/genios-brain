                      depends_on: [M32.C5.L-integration.V2.U04, M32.C3.L-interface.V3.U05, M32.C5.L-data.V1.U06]
    - id: M33
      name: The review decides each covered file (STEP-12, after D1)
      ships: >
        A covered file gets one audited decision from its review and its situations stand down; the
        decider is asked 0 times on a covered file; F01, F02, F09, F11, F15, F16, F17 and F47 each get
        one decision about their file; a replay asks no model; the live pass recorded (D50).
      categories:
        - id: M33.C1
          name: The review decides
          layers:
            - layer: logic
              levels:
                - level: 0
                  units:
                    - id: M33.C1.L-logic.V0.U04
                      what: >
                        The compiled lane's `{baseline: …}` thresholds read the file's numbers (`03` F104):
                        `ContextAdapter` is handed the file's measured normals (STEP-10, each with its n) where it read
                        `metadata[\"baselines\"]`, which only the legacy lane wrote — so a corpus threshold answers instead
                        of UNKNOWN. Added by M34.C4.
                      artifact: "genios_engine/reason/adapters/expertise.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/test_a_corpus_baseline_reads_the_files_numbers.py"
                      depends_on: []
                    - id: M33.C1.L-logic.V0.U01
                      what: >
                        A covered file's review becomes ONE audited Layer 4 request: the mode -> the
                        outcome, the next move -> the play, confidence from the evidence that validated
                        (never the model's number), the lane by `reason/output_lane.route`; under `06`
                        D1 the appraisal sets importance and urgency.
                      artifact: "genios_engine/reason/expert/decide.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/expert/test_the_review_decides.py"
                      depends_on: [M32.C5.L-integration.V3.U05]
                    - id: M33.C1.L-logic.V0.U10
                      what: >
                        What a covered file's review explains — one rule for both lanes: a decision about
                        the file's anchor or one of its people is its own file's review's; one about a node
                        no one's counterparty (a thread, a meeting's reading, a stated dependency) is any
                        covered file's whose review saw it — and only when the review saw EVERY event
                        behind it. A person, a company or the tenant is never matched by events. Minted 12
                        Oct at the first decided re-record (`03` F173): the review explained only the
                        file's own anchor, and a second card stood beside the file's on 18 of the 21 cases it failed.
                      artifact: "genios_engine/reason/expert/cover.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/expert/test_what_a_review_explains.py"
                      depends_on: [M32.C3.L-data.V1.U03]
                - level: 1
                  units:
                    - id: M33.C1.L-logic.V1.U05
                      what: >
                        A run whose decision maker asks no model is read by no model either: the
                        orchestrator's test-mode R-1 runs only before a decision maker that may consult one
                        (`asks_no_model`), so a covered file's run asks R-1 nothing — the negative control
                        proves the switch fires on the same request otherwise. Minted 11 Oct at the build of
                        V0.U01: with the test-mode decider on, R-1 would read the expert's run, paid for,
                        moving the snapshot its decision replays from.
                      artifact: "genios_engine/reason/orchestrator.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/test_a_decision_that_asks_no_model_reads_none.py"
                      depends_on: [M33.C1.L-logic.V0.U01]
                    - id: M33.C1.L-logic.V1.U03
                      what: >
                        `03` F139 for covered files: an expert-backed decision is replayed from its
                        stored review — zero model calls in a fresh process.
                      artifact: "genios_engine/reason/replay.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/reason/expert/test_replay_asks_no_model.py"
                      depends_on: [M33.C1.L-logic.V0.U01, M33.C1.L-logic.V1.U05]
                    - id: M33.C1.L-logic.V1.U16
                      what: >
                        The expert's play says what done looks like: its success events are the review's
                        own `done_when`, so the card a covered file's decision raises names its success
                        (`deliver/card_builder._play_success`) — never NULL. Minted 12 Oct at the golden
