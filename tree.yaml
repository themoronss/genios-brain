three_problems_followup:
  status: approved_in_progress
  specs: [docs/plans/AGENT_PROMPT.md, docs/plans/THREE_PROBLEMS.md]
  vision: >
    Derived situations retain event-level receipts; a fixed-time campaign fixture reaches
    evidence 65 and freshness 50 without changing scoring formulas or the 4500 floor.
    Compiled-card rendering preserves grounded quotes and authored fallback copy. Business
    nouns enter the graph with receipts, explicit statements outrank judgements, and absent
    information remains missing. Fixture proof and live customer outcomes are separate.
  historical_tree: >
    M1-M4 and their baseline comments above are preserved historical work, not findings or
    completion claims for this follow-up. New work uses permanent IDs M5-M7.
  requested_order: [1E, 1F, 1A, 1B, 1C, 1D, Task3, Task2]
  measurements: >
    September 10 numbers are supplied measurements, not measurements taken during this build:
    1001 observations on 30 people, 18 legacy cards, zero compiled cards. The campaign stores
    7 contacted and 7 awaiting despite its 13-investor label. Never manufacture 6-of-13 copy
    or claim live numbers moved from fixture tests.
  protected:
    - DEFAULT_CONFIDENCE_FLOOR_BP remains 4500
    - freshness_score and evidence_score formulas remain unchanged
    - analytic ramp remains unchanged; only its confidence-ceiling participation changes
    - no LLM inside a reasoning unit
    - cards_one_per_signal remains unchanged
    - FEATURE_BUNDLE remains unchanged by this work
  verification:
    unit_command: uv run --no-sync pytest <path> -q -p no:randomly
    full_suite_command: uv run --no-sync pytest -q -p no:randomly
    constraints: >
      New tests use fixed timestamps, local fixtures, SQLite and fake model responses; no live
      database, network, wall-clock-dependent assertions or real LLM calls. Prove a failing
      regression before implementation. Failed refinement reads preserve the original path.
    supplied_baseline:
      passed: 9899
      failed: 24
      failure_files:
        tests/capture/esqe/test_qualification_routes.py: 12
        tests/capture/connectors/test_new_route_wiring.py: 6
        tests/capture/esqe/test_rejection_ledger.py: 4
        tests/capture/test_g9_gate_probes.py: 1
        tests/contracts/test_h0_gate.py: 1
    reporting: >
      Capture current baseline and final full-suite results, including skips and exact failure
      identities. The supplied baseline is not a current run. A nonzero suite is not green even
      when failures match the allowlist. Do not skip tests, weaken assertions or fix unrelated
      code to manufacture green. No commit, push or deployment is requested here.
  progress_record: >
    Record each unit's defect, why, changed artifact, RED command/result, GREEN command/result,
    fixture delta, limitations and remaining work. Give step-by-step user updates and a final
    task-by-task report. A unit's artifact names its production seam; regression tests accompany
    that unit and must fail for the intended reason before the production change.
  live_handoff:
    - >
      Task 2D's actual drain of 767 parked attachments requires an operator/live run. Verify
      the recovery path offline; report the live drain as NOT RUN.
    - >
      Bundle activation is reserved for the user after Task 1. Brief/critique activation and
      automatic new-tenant activation in the broader spec are outside the narrower coding brief.
    - >
      Live evidence/card counts and the final customer sentence require remeasurement after
      rollout. A 5000-bp ceiling alone does not prove all publication gates passed.

milestones:

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - id: M1
    name: Layer 1 — a signal is about this message
    ships: >
      No qualified signal on the pilot quotes a reply-attribution header, a bare timestamp or a
      greeting. Measured before the work: 23 header signals, 49 bare-timestamp spans, 39 spans
      under 25 characters.
    known_gap: >
      Two, both recorded rather than fixed with a bad rule. (1) A SUBJECT LINE is not refused —
      nothing in the string says it is a subject, that needs the envelope this pass is not given,
      and a length or capitalisation heuristic would be the meaning-judgement the floor exists to
      avoid. (2) "If you are unable to attend, please inform us at least one hour in advance"
      produced 13 `commitment_due` signals from 13 meeting invitations by one sender. That
      sentence is an INSTRUCTION TO THE RECIPIENT, not a promise by anyone, so the defect is a
      misclassification in extraction, not a duplication to be deduplicated — and it is a prompt
      problem, not something deterministic code should paper over.
    categories:

      # ─────────────────────────────────────────────────────────────────────────────────────
      - id: M1.C1
        name: Quoted history is never evidence
        why: >
          THE ROOT CAUSE, and it explains three separate symptoms at once. Reply history is
          extracted as live claims, which is where the 23 attribution headers come from AND why
          one sentence yields ten signals — measured, `copies == distinct_events` in every
          duplicate group, and 395 signal rows are 395 distinct (event, type, quote) triples.
          There is no within-event duplication at all. The quoted-history detector already
          exists, is adversarially tested, and lives in `context/lifecycle/textguard.py`; its
          only importer is `context/lifecycle/judge.py`. `genios_engine/capture/` has zero hits
          for `quoted_regions` or `in_quoted_history`.
          WORSE: the trimmer actively PROTECTS reply headers. `preprocess/text.py:_DEADLINE`
          matches `\b(mon|tue|wed|thu|fri|sat|sun)\b`, and every attribution line carries a
          weekday — so `protected_line_spans("On Sat, 8 Aug 2026 at 14:22, X wrote:")` returns a
          span, and the token-budget trimmer is forbidden from dropping it.
        layers:

          - layer: contract
            levels:
              - level: 0
                units:
                  - id: M1.C1.L-contract.V0.U01
                    what: >
                      Quoted-history detection becomes a Layer 1 concern. Move the implementation
                      to capture/preprocess/quoted.py; leave context/lifecycle/textguard.py as a
                      re-export so judge.py and its adversarial suite are untouched. L2 importing
                      L1 is the correct direction; L1 importing L2 is not.
                    artifact: genios_engine/capture/preprocess/quoted.py
                    verify: uv run --no-sync pytest tests/context/lifecycle/test_h6_adversarial.py -q
                    depends_on: []

          - layer: logic
            levels:
              - level: 1
                units:
                  - id: M1.C1.L-logic.V1.U02
                    what: >
                      PreparedContent carries history_spans, in clean_text coordinates, computed
                      once in preprocess(). Additive field with a default so every stored row
                      still loads.
                    artifact: genios_engine/capture/preprocess/preprocess.py
                    verify: uv run --no-sync pytest tests/capture/preprocess/test_history_spans.py -q
                    depends_on: [M1.C1.L-contract.V0.U01]

                  - id: M1.C1.L-logic.V1.U03
                    what: >
                      A line inside quoted history is never protected from trimming. Today the
                      weekday in an attribution line makes it look like a deadline and the word
                      "renewal" in a quoted paragraph makes it look important, so the trimmer
                      keeps exactly the text that should not be there.
                    artifact: genios_engine/capture/preprocess/text.py
                    verify: uv run --no-sync pytest tests/capture/preprocess/test_history_spans.py -q
                    depends_on: [M1.C1.L-contract.V0.U01]

              - level: 2
                units:
                  - id: M1.C1.L-logic.V2.U04
                    what: >
                      A span that resolves inside quoted history is not a receipt for this
                      message. The binder refuses it rather than the validator lying about
                      `verified` — `verified` means "L1.5.1 opened the text and found the quote",
                      and the quote IS there; what is false is that it is this sender's sentence.
                    artifact: genios_engine/capture/semantic/evidence_binder.py
                    verify: uv run --no-sync pytest tests/capture/semantic/test_history_evidence.py -q
                    depends_on: [M1.C1.L-logic.V1.U02]

      # ─────────────────────────────────────────────────────────────────────────────────────
      - id: M1.C2
        name: A span must be capable of carrying a claim
        why: >
          The verifier only checks that the quoted text EXISTS in the source. It does not check
          that the text can mean anything, so a 96% verification rate hid 49 signals whose whole
          receipt is a bare ISO timestamp, 39 under 25 characters, and "Hi Rohit," stored three
          times as a relationship_change. This is not a semantic judgement and must not become
          one — it is a shape floor, and every rule below is decidable by looking at the string.
        layers:
          - layer: logic
            levels:
              - level: 0
                units:
                  - id: M1.C2.L-logic.V0.U05
                    what: >
                      A receipt floor: a bare datetime literal, a bare salutation, and a fragment
                      with no verb-bearing clause cannot be the sole receipt for a business claim.
                      Deterministic, no model, no similarity.
                    artifact: genios_engine/capture/semantic/evidence_binder.py
                    verify: uv run --no-sync pytest tests/capture/semantic/test_receipt_floor.py -q
                    depends_on: []

      # ─────────────────────────────────────────────────────────────────────────────────────
      # ─────────────────────────────────────────────────────────────────────────────────────
      - id: M1.C3
        name: Template text is not a promise
        why: >
          RETIRED, and the data says why. The unit assumed a sentence recurring across many
          events was boilerplate. Measured: every repeated quote on the tenant has exactly ONE
          distinct sender, and zero signals quote a `>`-prefixed line. The repeats are not
          templates and not reply history — they are ONE SENDER'S CAMPAIGN.
          "Pitching GeniOS (Software That Thinks For Your Company) From India" appears ten times
          because Rohit sent the same pitch to ten VCs, and "we can expect the numbers to hit
          nearly ~$2-3k MRR" ten times for the same reason. Ten investors, ten threads, ten
          situations — that is CORRECT, and it is precisely the investor-outreach intelligence
          this whole effort exists to surface. A recurrence rule would have deleted it.
        layers:
          - layer: logic
            levels:
              - level: 0
                units:
                  - id: M1.C3.L-logic.V0.U06
                    retired: true
                    retired_reason: >
                      Recurrence is evidence of a campaign on this tenant, not of boilerplate.
                      Building it would have refused the ten cold-outreach signals to Peak XV,
                      Titan, Afore and the rest — the exact intelligence the feed is missing.
                    superseded_by: []

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - id: M2
    name: Layer 2 — one situation per real thing, ranked
    ships: >
      41 awaiting_response situations covering 22 counterparties become 22. Absence situations
      carry a real importance instead of the flat 4000 default that all 103 of them share today.
      response_expected stops saying false on 40 of 41 threads where the ball is demonstrably
      with the other side.
    categories:
      - id: M2.C1
        name: One situation per conversation
        why: >
          Measured: 41 `awaiting_response` situations covering 22 distinct counterparties. Nobody
          wrote a bug — `waiting.py` writes `thread.*` onto BOTH the thread node and the party who
          corresponded on it, because those are genuinely different facts, and this reading mints
          one anchor per node carrying them. The two rows are not near-duplicates to be merged
          afterwards: one of them is simply the wrong subject to address a card to.
        layers:
          - layer: logic
            levels:
              - level: 0
                units:
                  - id: M2.C1.L-logic.V0.U01
                    what: >
                      A thread whose counterparty carries the same waiting facts yields to them.
                      The `corresponded_with` edge is the bridge; the party must ALSO be waiting,
                      so the three pilot threads whose counterparty was never resolved keep their
                      situation instead of vanishing.
                    artifact: genios_engine/context/outreach_situations.py
                    verify: uv run --no-sync pytest tests/context/test_one_situation_per_conversation.py -q
                    depends_on: []

      - id: M2.C2
        name: response_expected means WE asked THEM
        why: >
          40 of 41 said false, including every 28-day investor thread, and the one that said true
          was wrong for the opposite reason. An observation is attributed to its message's SENDER,
          so outbound mail produced 425 observations across exactly TWO nodes — Rohit's pitch to
          eleven VCs recorded the ask on Rohit and never on the VC. Meanwhile the old read matched
          any ask-kind observation on the node regardless of direction, so a question THEY asked
          US marked us as awaiting THEIR answer, and `mrrohitswerashi@gmail.com` matched itself.
        layers:
          - layer: logic
            levels:
              - level: 0
                units:
                  - id: M2.C2.L-logic.V0.U02
                    what: >
                      The flag resolves from an ask-kind observation on a message WE SENT this
                      node, joined through `thread.last_outbound` and `graph_source_refs`.
                      Validated read-only against the tenant before it was written: 19 nodes
                      resolve where 12 did, and the 11 dropped are all inbound questions or the
                      founder's own node.
                    artifact: genios_engine/context/waiting.py
                    verify: uv run --no-sync pytest tests/context/test_response_expected.py -q
                    depends_on: []

      - id: M2.C3
        name: The absence receipt lands
        why: >
          Built and tested earlier on this branch (25 passed) and never executed against the
          tenant. 103 absence situations sit at exactly 4000 bp with
          count(distinct importance_bp) = 1 — the DEFAULT_IMPORTANCE_BP fallback, which is the
          visible fingerprint of the L1 bundle never arriving. L2-4 (confidence 0-30 on exactly
          the situations that matter) is downstream of the same starvation and needs no separate
          unit. BLOCKED on a pipeline run, not on code.
        layers: []

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - id: M3
    name: Layer 3 — the corpus a tenant compiles from is the one it switched on
    ships: >
      An expertise package for this tenant is built only from domains present in
      `l3_activation`. Measured before: `relationship` situations routed to
      ["admin", "customer_support", "sales"] on a tenant whose only activated domain is `admin`,
      and the four capabilities in the most packages were all `customer_support` (150, 144, 144,
      144) followed by eight `sales.post_sale_and_growth.*` at 79 each.
    categories:
      - id: M3.C1
        name: Activation gates the corpus
        why: >
          `l3_activation(org_id, domain)` is how an operator says which expertise a tenant runs.
          The publisher honoured it, the admission gate honoured it, and `domain_shadow` carries a
          comment saying a single compiler cannot serve a tenant with Admin activated and Sales
          not. THE CAPABILITY ROUTE DID NOT: with no domain hint the resolver considered every
          authored domain, and with hints it took them whole. This is also where Layer 4's ballot
          came from — 270 of 512 candidates were sales plays because L4's plays come from the
          capabilities compiled here.
        layers:
          - layer: logic
            levels:
              - level: 0
                units:
                  - id: M3.C1.L-logic.V0.U01
                    what: >
                      `CapabilityResolver(activated_domains=...)`, threaded through
                      `DomainCompiler` and `make_domain_compiler`, and wired to
                      `domain_shadow`'s existing `live_domains` on the LIVE compiler only. The
                      measurement compiler stays unfiltered on purpose: its job is to report what
                      a tenant would get from a corpus it has not switched on.
                    artifact: genios_engine/packs/compiler/capability_resolver.py
                    verify: uv run --no-sync pytest tests/packs/test_activation_gates_the_corpus.py -q
                    depends_on: []

      - id: M3.C2
        name: The three empty brains
        why: >
          NOT A DEFECT, and measured rather than assumed. `behavior_patterns`,
          `organization_rules` and `adaptive_preferences` are 0 in all 381 packages because
          `PostgresRuntimeBrains` reads `learned_brain_entries` and `temporary_memories`, and
          BOTH ARE EMPTY FOR EVERY ORG IN THE DATABASE — as is `card_feedback_verdicts`. The
          three brains fill from usage, nobody has ever given the system feedback on a card, so
          they are correctly empty. This is a cold start, not a bug, and no unit can fix it.
        layers: []

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - id: M4
    name: Layer 4 — no defect of its own
    ships: >
      NOTHING, and that is the finding. Both L4 items trace to M3.C1.
    categories:
      - id: M4.C1
        name: The sales ballot
        why: >
          270 of 512 candidates came from the `sales` pack on an admin-only tenant. L4's plays
          come from the capabilities L3 compiled, so M3.C1 is the fix and a unit here would be a
          second guard on a corrected input.
        layers: []
      - id: M4.C2
        name: The eliminated are not the best
        why: >
          WITHDRAWN. The 30 eliminated candidates are 15 `sales.pb.upsell` and 15
          `sales.pb.churn_prevention`, every one eliminated by `core.constraint` at the `policy`
          stage with `reason_code = tenant_policy_block`. Check outcomes are 2109 pass, 571 warn,
          30 eliminate. Layer 4 received a ballot polluted by Layer 3 and refused the worst of it
          — it was doing its job, and "the best candidates are being killed" was the wrong
          reading of a high utility score meeting a correct guard rail.
        layers: []

