yc2_w27_s13:
  status: approved_in_progress   # 2026-10-12: Rohit's "13 pe chalte hain aur complete karte hain"; D59-D61 at their recommended answers until he says otherwise
  source: >
    speedrun008/YC-II W27/STEP-13 §1-§6, re-checked claim by claim against speedrun008 @ c97155cd
    (STEP-13 §8) by a read-only worker and by hand, and measured on the golden set's 94 authored expert
    answers (66 files, 58 cases). STEP-12 already refuses a review whose facts cite nothing the dossier
    shows or state a number it does not hold — but it refuses the WHOLE review, the file then falls back
    to the per-situation path; nothing checks that a cited mail says what a fact claims, that a number is
    the calculator's, whom a draft goes to, or whether the ask is already answered; an expert card skips
    the card validators; a find-out review is held in Investigation and no card asks it (F01, F52); five
    signal writers leave the lane NULL; the needs queue has no reader.
  vision: >
    Nothing the expert says reaches the founder unchecked. Each claim a move rests on quotes the mail it
    cites; each number is the calculator's; a draft goes to someone on the file — never to us, never to a
    connector standing in for the person it introduced; an ask already answered is not raised again. A
    claim that fails is dropped, not the review; a move that loses its ground becomes one question to the
    founder, on its own card, and the answer goes back into the file. Every decision carries its lane.
  order_note: >
    M35 first: the contract (C1.U01, U02), the pure checks (C2.U01-U05) — then the prompt (C3.U04) and the
    authored answers (C4.U01) BEFORE anything is wired, re-recorded once (C4.U02), so the golden lane stays
    green while each check is wired (C1.U03, C3.U01, C2.U06, C3.U02, C3.U03); M35's acceptance (C4.U03)
    last. M36.C1 (the lanes) any time after; M36.C2 after M35.C4.U02; M36.C3 last. Every unit: its own
    tests, a mutation run, the repo's guards; the step: a crosscheck and the whole QA tier, awake.
  milestones:
    - id: M35
      name: Nothing the expert says reaches you unchecked (STEP-13 §3.1-§3.4)
      ships: >
        On the golden set every authored review stands the check whole, and each mutation of a served
        answer — a decisive fact unquoted or misquoted, a name its lines do not hold, a wrong number, a
        draft to us, a draft to a connector, an answered ask — is caught on its case and recorded with its
        reason, and the card it would have made does not appear; must-detect and must-abstain do not move
        backwards; every expert card sentence carries its source or an inference label.
      categories:
        - id: M35.C1
          name: What the check reads and writes
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M35.C1.L-contract.V0.U01
                      what: >
                        The review contract, second version: a fact may carry `quote` — the words of the
                        mail it cites, as the dossier prints them; the next move names `rests_on` (the facts
                        it rests on, by number — a stored review without it rests on every fact), `to`
                        (whom its draft goes to — required with a draft) and `answers` (the ask it answers,
                        a `loop:` id, optional). `validate` refuses a move resting on no fact
                        (`ungrounded_move`) and an `answers` that is no ask, or one the
                        dossier never showed (`unknown_evidence`) — the prompt's map of rules names the
                        new refusal's rule (its text unchanged until M35.C3.L-interface.V0.U04). A v1
                        answer reads, validates and is stored as before.
                      artifact: "genios_engine/contracts/expert_review.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/expert/test_the_review_contract.py"
                      depends_on: []
                    - id: M35.C1.L-contract.V0.U02
                      what: >
                        The check's verdicts: each checked line kept, corrected (from, to, by which
                        calculator) or dropped for a closed reason — uncited, unknown_evidence, unquoted,
                        misquoted, unsupported, wrong_number, ungrounded, no_recipient,
                        recipient_not_on_file, recipient_is_us, recipient_is_connector,
                        not_ours_to_answer, answered, nothing_stands — a wording note (speaks_of_you), and
                        the checked review: what stands, the verdicts, the move's fate (shown, held,
                        suppressed, refused) and the question a held move asks. Frozen, pure; read back
                        as stored.
                      artifact: "genios_engine/contracts/claim_check.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/expert/test_the_claim_check_contract.py"
                      depends_on: [M35.C1.L-contract.V0.U01]
                    - id: M35.C1.L-contract.V0.U04
                      what: >
                        A misshapen move field drops its line, not the review (crosscheck X15, `06` D59):
                        a `rests_on` ref that names no fact of the review, beside the facts it does name,
                        is named by `validate` (`unknown_evidence`, never `ungrounded_move`) and dropped by
                        the check on its own `rests_on` line — the move stands on the facts it names; an
                        `answers` that is no `loop:` id the dossier printed (a mail, a promise, a
                        calculator) drops the `answers` line `unknown_evidence`, as an unprinted ask already
                        did, instead of refusing the review STRUCTURAL. A move resting on NO fact of the
                        review is still refused whole (§8.4.1).
                      artifact: "genios_engine/contracts/expert_review.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/expert/test_a_misshapen_move_field_drops_its_line.py tests/reason/expert/test_the_review_contract.py"
                      depends_on: [M35.C1.L-contract.V0.U01, M35.C2.L-logic.V1.U02]
                - level: 1
                  units:
                    - id: M35.C1.L-contract.V1.U03
                      what: >
                        `0200_expert_review_checks`: a review's check stored beside it — the checked review,
                        the check's version, when it ran; the decision reads a review only through its
                        check, and a review checked under an older version is checked again. Wiped by
                        `/reset` with its review; rolled back cleanly.
                      artifact: "migrations/0200_expert_review_checks.sql"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/reason/expert/test_expert_reviews_table.py tests/platform/test_the_code_can_always_be_rolled_back.py"
                      depends_on: [M35.C1.L-contract.V0.U02]
        - id: M35.C2
          name: The checks
          layers:
            - layer: logic
              levels:
                - level: 0
                  units:
                    - id: M35.C2.L-logic.V0.U08
                      what: >
                        The invention rule is the engine's, not the card's: V-02's `invention_ok` and the
                        readers it rests on move, byte for byte, from `deliver/render` to the cross-cutting
                        `platform/grounding` (reasoning may not import delivery — `tests/test_layer_topology`),
                        with `corpus_of` for plain lines; `deliver/render` re-exports the same objects
                        under the names its callers import. One rule, one place (the executive layer's own
                        copy is declared, `03` F180).
                      artifact: "genios_engine/platform/grounding.py"
                      verify: ".venv/bin/python -m pytest -q tests/platform/test_the_invention_rule_is_one.py tests/test_delivery.py tests/test_render_compiled_copy.py tests/deliver/test_a_name_with_an_accent_is_not_an_invention.py tests/deliver/test_claims_are_extracted.py tests/test_layer_topology.py"
                      depends_on: []
                    - id: M35.C2.L-logic.V0.U01
                      what: >
                        The dossier's lines by id — every id the dossier prints, the lines that print it
                        (a touch's words with it) — and the file's people as the dossier names them, with
                        which of them are us (STEP-04's identities) and which are connectors (STEP-09's
                        roles) marked. Pure over the dossier's text and parts.
                      artifact: "genios_engine/reason/expert/dossier.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/expert/test_the_dossier_lines.py tests/reason/expert/test_the_dossier.py"
                      depends_on: []
                    - id: M35.C2.L-logic.V0.U13
                      what: >
                        The connector is named as the person (fix-first, crosscheck `03` X07):
                        `dossier.connector_of` (read by `people_of`) names a connector at an address by the
                        name its own mail in the file signs (the latest), else by the address's own words
                        (`pankaj@saka.vc` → "Pankaj", `pankaj.mehta@saka.vc` → "Pankaj Mehta") — never by its
                        domain's label, which named Pankaj "saka"; a connector known only by its company's
                        domain keeps that domain's label. So `verify`'s own `matches` (verify unedited) catches
                        "Send Pankaj the short deck to forward to Marco", to "Pankaj Mehta", as the connector:
                        the draft never goes to whoever made the introduction. The graph's node name is not
                        read (the name the connector's mail signs is the one the graph took it from). Amended 13
                        Oct (fix, the STEP-13 second crosscheck G1): named as the person only, the firm case
                        regressed — `to='Saka'` (pankaj@saka.vc) was `recipient_is_connector` at be27 and then
                        shown. `verify.the_connector` matches the person OR the firm (their host's first label,
                        never a public mail host's), in both connector checks and in whom a headline names first.
                      artifact: "genios_engine/reason/expert/dossier.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/expert/test_a_connector_is_named_as_the_person.py tests/reason/expert/test_the_dossier_lines.py tests/reason/expert/test_verify_people.py"
                      depends_on: [M35.C2.L-logic.V0.U01, M35.C2.L-logic.V1.U02]
                - level: 1
                  units:
                    - id: M35.C2.L-logic.V1.U02
                      what: >
                        The check (`reason/expert/verify.check_review`), one pass in one order. Claims
                        (§3.1): a fact cites ids the dossier printed; a fact the move rests on that cites a
                        mail whose words are shown QUOTES them, and they are there; its names are on its
                        lines by the card validator's own rule — else it drops, the review stays (`06`
                        D59); an inference or pattern stands while a ground stands. Numbers (§3.2, RULE
                        08): corrected to the one value the one cited calculator prints, or dropped; the
                        card's words corrected by the same map, else withheld — a headline that fails holds
                        the move. People (§3.3): a draft goes to someone the file's mail shows — never us
                        (held), never the connector that introduced the counterparty (the review's
                        alternative, else held); a move answers an ask that waits on us; "the founder" on a
                        card is noted (F178). Not already done (§3.4): a meeting ask the file has a meeting
                        for since is answered — suppressed, with that meeting; a closed ask cannot be named
                        (the dossier shows open asks only). The fate: refused when no fact stands, held
                        with ONE question, suppressed, or shown. Pure.
                      artifact: "genios_engine/reason/expert/verify.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/expert/test_verify.py tests/reason/expert/test_verify_claims.py tests/reason/expert/test_verify_numbers.py tests/reason/expert/test_verify_people.py tests/reason/expert/test_an_answered_ask_is_not_raised_again.py"
                      depends_on: [M35.C1.L-contract.V0.U02, M35.C2.L-logic.V0.U01, M35.C2.L-logic.V0.U08]
                    - id: M35.C2.L-logic.V1.U09
                      what: >
