                      artifact: tests/packs/brains/test_org_discovery.py
                      verify: GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest "tests/packs/brains/test_org_discovery.py::test_an_approver_resolves_through_the_identity_layers_own_keys" -q
                      depends_on: []
