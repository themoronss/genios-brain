                      artifact: tests/test_deal_node_from_correspondence.py
                      verify: GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest tests/test_deal_node_from_correspondence.py -q
                      depends_on: [M16.C3.L-logic.V0.U05]

        - id: M16.C4
          name: Fixtures that follow the code (premises the code outgrew — 6 tests)
          layers:
            - layer: data
              levels:
                - level: 0
                  units:
                    - id: M16.C4.L-data.V0.U01
