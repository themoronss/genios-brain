                      artifact: genios_engine/capture/landing/repository.py
                      verify: uv run --no-sync python -m scripts.unit_ledger --check
                      depends_on: []

    # ─────────────────────────────────────────────────────────────────────────────────────────
    - id: M15
      name: The quality is measured, not asserted
