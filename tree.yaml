        - id: M49.C3
          name: The dev secret never signs a production session — platform
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M49.C3.L-contract.V0.U07
                      what: >
                        STEP-18 B7. `platform/config.insecure_boot`: why this configuration may not serve —
                        an environment named outside dev (`dev`, `development`, `test`, `local`) whose
                        `jwt_secret` is still the shipped default (`config.py:37`), with which anyone can sign a
                        session. `None` when it may. An unset `GENIOS_ENV` reads `dev` as it always has.
                      artifact: "genios_engine/platform/config.py"
                      verify: ".venv/bin/python -m pytest -q tests/platform/test_the_dev_secret_never_boots_outside_dev.py"
                      depends_on: []
                - level: 1
                  units:
                    - id: M49.C3.L-contract.V1.U10
                      what: >
                        `06` D62 (Rohit, 12 Oct; crosscheck S18-X03) — U07's unset case closed. An
                        UNSET `GENIOS_ENV` (`"env" not in model_fields_set`) is not dev
                        (`config.is_dev_env`), as `platform/egress` always read it, so a production
                        that never named its environment no longer boots on the public secret;
                        `change-me-in-prod` (`.env.example`) is refused like the default
                        (`PUBLIC_JWT_SECRETS`); one `DEV_ENVS` (dev, development, test, local) serves
                        the boot and egress — egress gains `local`, a laptop's name the device routes
                        already read as dev. The unset-env test re-pinned, with its negative control
                        (an unset env with a secret of its own boots).
                      artifact: "genios_engine/platform/config.py"
                      verify: ".venv/bin/python -m pytest -q tests/platform/test_the_dev_secret_never_boots_outside_dev.py tests/test_egress.py tests/test_migrate_read_only.py"
                      depends_on: [M49.C3.L-contract.V0.U07]
            - layer: integration
              levels:
                - level: 1
                  units:
                    - id: M49.C3.L-integration.V1.U08
                      what: >
                        STEP-18 B7, the boot. `main.lifespan` asks `insecure_boot` first and refuses to start
                        with its reason, before migrations and before any worker. ⛔ Deploy precondition
                        (Harsh, `08`): production's `GENIOS_JWT_SECRET` is set — with the default and a
                        non-dev `GENIOS_ENV` the new image will not boot, by design.
                      artifact: "genios_engine/main.py"
                      verify: ".venv/bin/python -m pytest -q tests/platform/test_the_dev_secret_never_boots_outside_dev.py tests/test_migrate_read_only.py"
                      depends_on: [M49.C3.L-contract.V0.U07]
                - level: 2
                  units:
                    - id: M49.C3.L-interface.V2.U09
                      what: >
                        S18-X02, X04 (the STEP-17/18 crosscheck), with `06` D62 — 08 had nothing for
                        STEP-18 though three places send Harsh there. 08 §3.14: before the deploy read
                        `GET /config` (its `env`, `dev` when unset), read whether `GENIOS_ENV`,
                        `GENIOS_JWT_SECRET` and `GENIOS_COMPOSIO_WEBHOOK_SECRET` are set, and set the
                        env and the secret together — an unset or non-dev env with a public secret
                        refuses to boot (exit 3); a rotated secret signs every user and paired desktop
                        out; a non-dev env turns unsigned Composio webhooks into 403 unless the webhook
