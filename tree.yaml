                    artifact: genios_engine/context/document_register.py
                    depends_on: [M5.C2.L-data.V0.U01]
      - id: M5.C3
        name: 1B — evidence follows the subject and the complete group
        layers:
          - layer: data
            levels:
              - level: 0
                units:
                  - id: M5.C3.L-data.V0.U01
                    verify: uv run --no-sync pytest tests/context/test_situation_evidence_neighborhood.py -q -p no:randomly
                    what: >
                      Count anchor and one-hop person/company evidence in BOTH edge directions.
                      Deduplicate events/sources, preserve event time, exclude other tenants and
                      second-hop spillover. Six observations from one source score 65; none score 0.
                    artifact: genios_engine/context/outreach_situations.py::_EVENT_COUNTS
                    depends_on: []
