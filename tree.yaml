                      verify: GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest tests/test_availability_pg.py -q
                      depends_on: []
                    - id: M16.C4.L-data.V0.U03
                      what: >
