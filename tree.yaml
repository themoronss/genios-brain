                      artifact: tests/capture/esqe/test_groups.py
                      verify: uv run --no-sync pytest tests/capture/esqe/test_groups.py -q -p no:randomly
                      depends_on: [M14.C1.L-contract.V0.U12]
        - id: M14.C2
          name: Prose matches code
          layers:
            - layer: logic
              levels:
                - level: 0
                  units:
                    - id: M14.C2.L-logic.V0.U14
