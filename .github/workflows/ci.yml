# GeniOS Engine CI — the safety net every refactor stands on.
#
# Two jobs. `test` is the hermetic suite: in-memory repos and fakes, no service containers, and
# the golden set deselected (`-m "not golden"`) because it needs a database. `golden-pg` is the
# golden set itself (STEP-01, tree yc2_w27/M19): the founder cases and the Atlas replays driven
# through the REAL chain on a scratch Postgres with recorded model answers, then the board.
# `GENIOS_GOLDEN_REQUIRED=1` turns a missing database into a failure — a golden set that skipped
# would be "a pass over an empty table".
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q -m "not golden"

  golden-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: scratch
          POSTGRES_DB: genios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GENIOS_TEST_DATABASE_URL: postgresql+psycopg://postgres:scratch@localhost:5432/genios_test
      GENIOS_GOLDEN_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Production's own dependency set (it carries `anthropic`, which the runner refuses), plus
      # the test extras.
      - name: Install
        run: pip install -r requirements.txt && pip install -e ".[dev]"
      - name: Golden set
        run: pytest -q tests/replays tests/test_golden_labels_sheet.py
      - name: Golden board
        run: python scripts/golden_score.py --assert-recorded "speedrun008/YC-II W27/03-FINDINGS.md"
