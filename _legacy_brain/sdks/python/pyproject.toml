[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genios"
version = "1.1.0"
description = "Official Python SDK for the GeniOS Context API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
stream = ["httpx>=0.27"]

[project.urls]
Homepage = "https://genios.ai"
