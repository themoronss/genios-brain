    speedrun008/YC-II W27/STEP-15 §1-§6, re-checked claim by claim against fbd0aeaa (STEP-13 at 24 of 29
    units) and measured on a fresh scratch database: the twelve brief-only golden cases and ten must-abstain
    cases replayed from their cassettes (no spend), and the existing morning surfaces called on four kept
    tenants. Twelve of the 45 must-detect cases are brief-only and counted not expressible, so must-detect
    >= 90% cannot be reached without a brief (ceiling 33/45). The summary ladder counts signals: it says
    "Nothing needs you right now." on F14 and F22 while the expert holds a wait rule and an open question.
    The digest goes to Slack only, once per UTC day; meeting prep is a desktop moment 3 h ahead; nothing in
    the engine runs at a local hour; `executive/` reads no file, review, question, promise or meeting.
  vision: >
    At 08:00 in your timezone you read one brief, in under three minutes: today's five things — a meeting
    today and a dated promise or deadline within 48 hours always among them — then what changed since
    yesterday, what is stuck, what a file asks you, your promises, your meetings with their prep, and what I
    am watching and why. Code reads the day and orders it from the expert's own appraisals; a cheap model
    writes it from that checked material, and a strong one only when the cheap one fails the check; every
    line says where it came from, uses no name, number or date its source does not hold, speaks to you as
    "you", and takes your mark. An empty morning says so — and only when nothing is open, asked, due or
    watched.
  order_note: >
    M44 first and whole: the brief's CONTENT, by code, with no model — the contract and 0230, the five
    readers, the day, its order and the template, the store, compose and the tick, the route; then the
    golden set judges it (C5, the board restated). M45 after M44's acceptance: the sites, the budget and the
    feature, the prompt, the line check and the writer, compose through the writer, the mark, the digest,
    the live look, M45's acceptance last. M45.C4 waits for its decisions — U01 on s15-D2 (a file on the
    shadow lane), U02 on `06` D8 (screen reminders), U03 on s15-D3 (a small move) — and is not built on the
    default answer. The live look spends only on Rohit's yes and a key (s15-D1). STEP-13 closed first: its
    question card (M36.C2.L-interface.V3.U05) is where an asked line leads, and its golden judge already
    keeps a card's quoted sources apart from its words (eb2b0486) — the brief's judge does the same. STEP-14
    is not a precondition: the brief is built per file, from reviews, not from cards. Every unit: its own tests, a mutation run, the repo's guards; the step:
    a crosscheck and the whole QA tier, awake.
