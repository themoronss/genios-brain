                      artifact: "tests/replays/model_sites.py"
                      verify: ".venv/bin/python -m pytest -q tests/replays/test_every_chain_model_site_is_recorded.py tests/replays/test_recorded_llm.py"
                      depends_on: [M38.C1.L-contract.V0.U02]
                - level: 11
                  units:
                    - id: M38.C2.L-integration.V11.U03
                      what: >
                        `review_file` reviews through the ladder: once per fingerprint as before — the row is the
                        review that stands — and the attempts beside it; a standing row is still its own cache.
                      artifact: "genios_engine/reason/expert/review.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/reason/expert/test_one_review.py tests/reason/expert/test_one_review_climbs_the_ladder.py"
                      depends_on: [M38.C2.L-logic.V3.U02, M37.C4.L-logic.V10.U05, yc2_w27_s14/M43.C2.L-integration.V2.U03]
                - level: 12
                  units:
                    - id: M38.C2.L-integration.V12.U05
                      what: >
                        The pass runs the ladder (`reason/expert/sweep`): a client per rung (the R-sites' door, read
                        per tier when the pass runs); the receipt counts each rung's reviews, its repairs, the climbs
                        by reason and the cost per rung; the day's budget binds across rungs.
                      artifact: "genios_engine/reason/expert/sweep.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/reason/expert/test_the_expert_pass.py tests/reason/expert/test_the_pass_climbs_and_counts.py"
                      depends_on: [M38.C2.L-integration.V11.U03, M37.C5.L-integration.V11.U03]
