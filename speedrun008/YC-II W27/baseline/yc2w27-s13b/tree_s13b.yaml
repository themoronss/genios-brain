    - id: M38
      name: Cheap models first — Haiku, then Sonnet when the check says so, Opus only if allowed; every model scored
      ships: >
        One review climbs a ladder of models: Haiku-class first; an answer that fails the check for the writer's own
        fault (malformed after its repair, cut at the ceiling, nothing standing, a move held on a fact it cited
        wrongly, a headline that fails, a draft to us or to the connector) is asked once more on its own rung with the
        check's verdicts; Sonnet-class only when that repaired answer still fails; Opus-class only when both fail and
        Rohit allows a third rung (s13b-D1); never a climb for the file's own state. Every rung's consult
        kept and counted, priced at its own rung, inside one day's budget; the review that stands is the best the
        rungs gave. The live scorecard says, per model and for the ladder: the board, each review's fate, the drop
        reasons and misquote rate, how many lines came from the engine and from the expert's own, tokens and cost —
        and a kept live pass can be re-judged with no spend.
      categories:
        - id: M38.C1
          name: The ladder's rule and its rungs
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M38.C1.L-contract.V0.U02
                      what: >
                        The expert's rungs (`reason/bundle/sites`): `EXPERT_LADDER` — T1 (Haiku-class), T2
                        (Sonnet-class), and T3 (Opus-class, `tier_model("T3")`) ONLY with s13b-D1's answer
                        amending `06` D7; without it the ladder is T1, T2 and the three tests that pin "no Opus
                        tier" stand as they are. The ladder is configuration: its order and length set per tenant
                        (default T1, T2), the prompt names no model.
                      artifact: "genios_engine/reason/bundle/sites.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/expert/test_the_expert_site_and_feature.py tests/reason/expert/test_tiers_and_the_cache_key.py tests/reason/test_llm_policy.py"
                      depends_on: [yc2_w27_s15/M45.C1.L-contract.V0.U01]
                    - id: M38.C1.L-contract.V0.U04
                      what: >
                        `0250_expert_review_attempts`: every rung's consult of a file kept — the file, the
                        fingerprint, the rung, the model, its status, its check's fate and the reason it climbed
                        (closed), its tokens and cost — and `expert_reviews.rung`, the rung whose review stands.
                        Wiped by `/reset`; rolled back cleanly.
                      artifact: "migrations/0250_expert_review_attempts.sql"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/reason/expert/test_expert_review_attempts_table.py tests/platform/test_the_code_can_always_be_rolled_back.py"
                      depends_on: []
                - level: 1
                  units:
                    - id: M38.C1.L-contract.V1.U03
                      what: >
                        One day for every rung (`reason/bundle/budget`): the expert's $2 a day (`06` D7) spent by
                        every rung, each consult priced at its own rung's tier; a per-call ceiling per rung — $0.10
                        for T1 and T2, $0.20 for T3 (measured: the costliest of Haiku's 110 answers would cost $0.151
                        at Opus prices, over today's $0.10).
                      artifact: "genios_engine/reason/bundle/budget.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55432/genios_test .venv/bin/python -m pytest -q tests/reason/expert/test_tiers_and_the_cache_key.py tests/reason/expert/test_every_rung_spends_one_day.py"
                      depends_on: [M38.C1.L-contract.V0.U02, yc2_w27_s15/M45.C1.L-contract.V1.U02]
                - level: 2
                  units:
                    - id: M38.C1.L-contract.V2.U01
                      what: >
                        The ladder's rule (`contracts/model_ladder`), pure — "climb", never "escalate" (the
                        executive's escalation ladder owns that word, `executive/reminder.py`): a rung's answer is
                        FINAL when its check shows it, suppresses it, or holds it for the file's own state (an
                        answered ask); it FAILS for the writer's faults only — malformed after its one repair, cut
                        at the ceiling, refused (nothing stands), held because a fact the move rests on dropped
                        uncited, unknown_evidence, unquoted, misquoted, unsupported or wrong_number, the headline
                        failing, the move addressed to us or to the connector. A failed answer is REPAIRED once on
                        its own rung, handed the check's verdicts (the lines dropped and why — crosscheck X32,
                        s13b-D4), and CLIMBS only when the repaired answer still fails; when every rung failed, the
                        best fate stands (shown > suppressed > held > refused; on a tie, the higher rung). Closed
                        reasons, each counted; the ladder's version for the fingerprint.
                      artifact: "genios_engine/contracts/model_ladder.py"
                      verify: ".venv/bin/python -m pytest -q tests/contracts/test_the_model_ladder.py"
                      depends_on: [M37.C1.L-contract.V1.U03]
