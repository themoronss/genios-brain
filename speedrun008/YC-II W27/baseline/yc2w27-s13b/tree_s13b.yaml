# Proposed tree block for STEP-13b (the GeniOS Engine in the expert's hands) — checked and planned 2026-10-12
# against yc2w27-s13b-plan @ d3c1bb3c (the integration line: STEP-13 with its fixes, STEP-17, STEP-18). The lead
# merges it into tree.yaml (and updates tests/test_tree_ids_are_addressable.py: one block more than whatever the
# tree then holds, and the header's table: `yc2_w27_s13b  M37, M38  ← STEP-13b, the engine in the expert's hands
# (planned 12 Oct)`). M37 and M38 appear in no other block (grep of tree.yaml and every baseline tree, 12 Oct).
# Cross-block dependencies use the canonical form `<block>/<id>` (tree.yaml header); the STEP-14, STEP-15 and
# STEP-16 ids are those of their proposed blocks (baseline/yc2w27-s14/, -s15/, -s16/tree_s1x.yaml).
# Verify URLs are written as the other blocks write them; run each on a FRESH pg2 database (55433) — 55432 is at
# its database limit. ⛔ The step file STEP-13b-… turns `tests/test_the_plan_folder_is_consistent.py::
# test_the_folder_has_its_step_files` red (it names STEP-00…STEP-18 exactly): the lead restates it in the merge.
yc2_w27_s13b:
  status: proposed   # 2026-10-12: checked and planned (STEP-13b §8); `06` D64 is Rohit's go; s13b-D1…D8 open
  source: >
    speedrun008/YC-II W27/STEP-13b, written 12 Oct from Rohit's direction (`06` D64: "GeniOS Engine ka matlab domain
    expertise graph … and reasoning expertise graph … LLM parallely GeniOS Engine & Data & khud ki reasoning se
    results dega") and checked claim by claim against d3c1bb3c, with four measurements (baseline/yc2w27-s13b/):
    the first live expert pass on Haiku 4.5 (19 pass / 28 fail / 11 not expressible, $2.17) replayed from its
    recorded answers with no spend — 92 reviews, 68 HELD, 42 of them because a fact the move rests on cites a
    dossier line that carries no id (a section title, the file's head, the brief, a mailbox), 288 facts dropped
    `unknown_evidence` in all; the 94 authored answers against the corpus — 22 can cite an engine line today (the
    kind's playbook, `pb:`), 57 at least and 79 at most would print one; and the compiled lane with the expert
    off on six cases — 3 of 33 admission decisions admitted and 2 packages, all on F02's account files; a held
    situation never reaches the compile, so no package and no compiled unit runs on any other.
  vision: >
    The expert reasons from three sources at once and says which line came from which: the file's DATA (every
    line of its dossier citable — the head, the brief, what was checked, what the company said of itself on
    another file), the GeniOS ENGINE (the Domain Expertise of the file's situations — capabilities' doctrine,
    playbooks, heuristics, rules and their constraints, framing blocks, what the tenant's brains learned — and the
    Reasoning Expertise, the units' readings of the file), and its OWN thirty years, written as its own lines, in
    words, never a fact and never a number. The check verifies the engine's lines as it verifies evidence; a
    change in the engine re-thinks the files it touches. And a cheap model goes first: Haiku, then Sonnet when
    Haiku's answer fails the check for the writer's own fault, Opus only if Rohit allows a third rung — every
    climb counted, every model scored on the golden set side by side.
  order_note: >
    Three steps edit the expert's files first, and this block builds on what they leave: STEP-14 (dossier.py,
    verify.py, review.py, decide.py, claim_check.py, the cassettes twice), STEP-16 (prompt.py, fingerprint.py,
    triggers.py, dossier.py, verify.py, claim_check.py, the cassettes once) and STEP-15 (reason/expert/store.py,
    reason/bundle/sites.py, budget.py, scripts/golden_eval.py). Units that touch only new files — the contracts
    (M37.C1.U01, U02; M38.C1.U01, U04), the engine reader (M37.C2.U01, U02), the units' reading (M37.C2.U03), the
    company's record (M37.C2.U04) — may be built at once, beside them. Everything else waits on the last unit of
    theirs that edits the same file, named in its depends_on. The dossier is ONE writer in order: read_parts
    (M37.C2.U05), the citable lines (C3.U01), the engine and units sections (C3.U02), the company's record
    (C3.U03); then the check (C4), the fingerprint and triggers (C5), the ladder (M38.C2) — and ONE re-record
    (M37.C6.U03) for the whole step, after STEP-14's second and STEP-16's re-record, so the board is restated in
    its five places once. Every unit: its own tests, a mutation run, the repo's guards (tests/*.py root and
    tests/platform); each milestone: a crosscheck and the whole QA tier, awake. The paid passes are the lead's
    (`06` D65), never a unit's verify: M38.C4.U02 checks the scorecards they keep.
  milestones:
    - id: M37
      name: The GeniOS Engine in the expert's hands — data, engine and its own expertise, each labelled and checked
      ships: >
        Every line of a file's dossier the expert may lean on carries an id (the head, the brief, what was checked,
        each section's "none", the company's own record); the dossier prints the Domain Expertise of the file's
        situations and kind and the reasoning units' readings, each line with its id and source, unreviewed lines
        labelled (D3); the expert writes its own expertise as `own` lines; the check holds engine ids as it holds
        evidence ids, drops a fact resting only on the engine or on itself, an own line with a number or a name of
        the file; each line of a review says whether it came from the data, the engine or the expert; the
        fingerprint names the engine the file reads, and a change in it re-thinks the file. On the golden set every
        authored answer stands; at least 57 of the 94 authored answers' dossiers print an engine line (22 today), every
        investor file prints the investor playbook (26 answers' files print none today); forbidden outputs 0;
        must-abstain 13 of 13; must-detect does not move backwards.
      categories:
        - id: M37.C1
          name: What the expert is handed, and what it writes
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M37.C1.L-contract.V0.U01
                      what: >
                        What the engine hands one file (`contracts/engine_read`), pure and frozen: an `EngineLine`
                        — its id, its family, its words, its source (the corpus artifact and its content hash, the
                        learned entry and its version, or the unit and its version), whether a named human reviewed
                        it, authored or learned or measured — in closed families with closed id prefixes: `cap:`
                        (a capability's question and failure modes), `sig:` (a corpus situation's signals of
                        progress and decay), `pb:` (playbooks and heuristics, as the dossier already prints the
                        kind's), `rule:` (an authored rule's statement), `cons:` (its compiled constraint and the
                        predicate's verdict: holds, fails, unknown), `frame:` (a mental model or decision
                        framework), `org:` `pat:` `pref:` (the Organization, Behaviour and Adaptive brains), `ru:`
                        (a reasoning unit's reading); an `EngineRead` — the lines, what each family's limit cut
                        (counted), the corpus situations that MAY apply and are not shown (a predicate unknown), and
                        its version (`eng-` and the hash of what it shows). Read back as written.
                      artifact: "genios_engine/contracts/engine_read.py"
                      verify: ".venv/bin/python -m pytest -q tests/contracts/test_an_engine_read.py"
                      depends_on: []
                    - id: M37.C1.L-contract.V0.U02
                      what: >
                        The review's third version (`contracts/expert_review`): `own` — the expert's own expertise,
                        each a practice, a base rate, a counter-pattern or a benchmark in words, with why; an
                        inference's or pattern's `based_on` may name engine ids and `own:N` beside the dossier's
                        ids and `fact:N`; the move's `rests_on` may name `inference:N` (its standing facts are the
                        move's ground — 55 of Haiku's 58 `rests_on` drops named an inference) and its `guided_by`
                        names the engine or own lines it follows. `validate` holds an `own:N` past the list and an
                        engine id the catalogue does not hold as it holds an unprinted id; an answer of the first or
                        second version reads and validates exactly as before.
                      artifact: "genios_engine/contracts/expert_review.py"
                      verify: ".venv/bin/python -m pytest -q tests/reason/expert/test_the_review_contract.py tests/reason/expert/test_a_misshapen_move_field_drops_its_line.py"
                      depends_on: [yc2_w27_s13/M35.C1.L-contract.V0.U04]
                - level: 1
                  units:
                    - id: M37.C1.L-contract.V1.U03
                      what: >
                        The check's next version (`contracts/claim_check`): closed reasons `engine_is_no_fact` (a
                        fact citing only engine or own lines — the engine is a prior about the work, never evidence
                        about this file), `own_states_a_number`, `own_names_the_file`; a note `own_disagrees` (an
                        inference citing an own line against an engine line — kept, counted for the scorecard);
                        each line's SOURCE (data · engine · own · mixed), derived by code, never asserted;
