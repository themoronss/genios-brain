                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/s16_verify .venv/bin/python -m pytest -q tests/feedback/test_every_feedback_reason_is_stored_pg.py tests/feedback/test_every_wrong_reason_is_kept.py tests/platform/test_the_code_can_always_be_rolled_back.py"
