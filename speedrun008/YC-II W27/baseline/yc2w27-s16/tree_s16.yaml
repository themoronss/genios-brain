yc2_w27_s16:
  status: proposed   # 2026-10-12: checked and planned (STEP-16 §8); S16-D1..D10 at their recommended answers until Rohit says otherwise
  source: >
    speedrun008/YC-II W27/STEP-16 §1-§6, re-checked claim by claim against yc2w27-s13 @ fbd0aeaa (STEP-13
    nearly built) — STEP-16 §8 — by reading the code and running it on fresh scratch databases (production
    not read). Since 5 Oct calibration runs in shadow (yc2_w27/M18), STEP-12 made the expert's review each
    covered file's one decision, and STEP-13 made your answer the first correction to reach the next
    judgment. What is missing: the dashboard's "wrong because" lands in card_events, which eight of the nine
    verdict readers never read, while the extension's door refuses eight of the eleven reasons (a 500); a
    verdict moves a file's fingerprint and triggers no review, and "you ask about it" has no door; there is
    no surface for a correction in your words, and a question card cannot be called wrong; nothing L6
    learns reaches the expert; a founder play's success is a sentence no monitor can see; and a file
    decision that ends records nothing of what closed it.
  vision: >
    A correction you make changes the next judgment on its file — and on every file of its kind when you say
    it is how this work goes — and never silently: the expert follows it, or says, citing it, why the file
    now outweighs it, and a move made over a correction it does not cite becomes one question to you. Every
    reason you give is stored, through either door, in one ledger every reader reads. A file decision that
    ends says how, and what proved it; your own numbers stand beside the playbook's priors; the week's
    scorecard shows usefulness, what was held back, coverage, verified outcomes and what each correction
    changed. Nothing learns a pattern from one click, nothing mutes a rule, nothing writes a learned brain.
  order_note: >
    M46.C1 (the guard) first, so every later unit runs it. Then M46.C2 (the ledger) and M46.C3 (your
    correction) in either order — C3's card and question units after C2.U03 and after STEP-13's Answer
    action and question card, which edit the same files; M46.C4's contract and prompt any time, the dossier
    after M46.C3.U02, then the fingerprint, the trigger, the delta, and never silently after the dossier;
    M46.C5 (the brief) any time; M46.C6.U01 once STEP-15's morning brief exists; M46's acceptance last.
    M47.C1 any time after M46.C2.U01; M47.C2 after M47.C1 and M46.C4.U03; M47.C3 after M47.C1 and the
    delta; M47.C4's contract and cases any time, the runner after M46.C3.U04, ONE re-record after every unit
    that changes what the expert is shown or asked (M46.C4, M47.C2) — so the golden lane is re-recorded
    once for the whole step — and the acceptance last. Outside the block: STEP-14 and STEP-15 (this step's
    dependencies), STEP-17's feedback test (M46.C2.U01 takes its eight markers off). Every unit: its own
    tests, a mutation run, the repo's guards (tests/*.py root and tests/platform); the step: a crosscheck
    and the whole QA tier, awake.
  milestones:
    - id: M46
      name: Your correction changes the next judgment, and never silently (STEP-16 §3.1, §3.2, §4)
      ships: >
        On Postgres: every one of the eleven reasons is stored through either door in one ledger that every
        reader reads (0 × 500); a correction you write — on a card, on a question card or on a file — is in
        that file's dossier with its id, moves its fingerprint and brings it back to the expert, whose next
        review follows it or says why not, citing it, and a move made over a correction it does not cite is
        held as ONE question to you; a correction for a kind of work prints beside that kind's playbook
        prior on every file of the kind; a question you call wrong is never asked again in its words; a bare
        click changes only its own file; both decisions replay with every model door poisoned, and the delta
        names what the correction changed. Calibration, the learned brains and the distinct_days gate are
        untouched.
      categories:
        - id: M46.C1
          name: What learning from you may not do
          layers:
            - layer: integration
              levels:
                - level: 0
                  units:
                    - id: M46.C1.L-integration.V0.U01
                      what: >
                        Written first, so every later unit runs it: no module this block adds or edits
                        writes `rule_mutes`, `calibration_nudges`, `tenant_packs.authority_revision`,
                        `learned_brain_entries` or `temporary_memories` (their statements read from the AST,
                        constants resolved); `calibration_apply` stays in `NOT_DEFAULT_ON` (`06` D13);
                        `feedback/units.unit_recommendation_learning` still passes `distinct_days=1`,
                        `validate_learning` still runs before `govern`, and no stored policy floor is lowered
                        (the tripwire is in this verify — do not fix `distinct_days` before ADR-10); the
                        expert's rule `file_review` and the question's `founder_question` are rules of no
                        pack manifest, so calibration never scores an expert card.
                      artifact: "tests/feedback/test_learning_from_you_arms_nothing.py"
                      verify: ".venv/bin/python -m pytest -q tests/feedback/test_learning_from_you_arms_nothing.py tests/feedback/test_the_declared_violation_is_blocked_by_arithmetic.py tests/feedback/test_calibration_is_shadow_until_armed.py"
                      depends_on: []
