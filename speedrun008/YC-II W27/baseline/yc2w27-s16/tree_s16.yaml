          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M46.C2.L-contract.V0.U01
                      status: built   # ⛔ 12 Oct, by STEP-18 — `0210` (`61d679ed`), not by this step; see below
                      what: >
