                        NOT write `0240`. 0210 drops 0034's unnamed reason CHECK on
                        `card_feedback_verdicts` and `card_feedback_revisions` and adds one NAMED CHECK
                        per table (`*_reason_vocabulary`) holding the eleven reasons of
                        `contracts/learning_attribution.ALL_REASONS`; a second migration on these
                        constraints would be a second writer of one rule, and a drop-by-text could remove
