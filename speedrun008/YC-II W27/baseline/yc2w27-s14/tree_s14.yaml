    what changed is said, the words before are kept, a renewal changes nothing you see — never a second card; a
    question the file asks you, and your answer, are versions of it too. The card is in the gold shape, every line
    from the checked review or from code's own calculators, no model writing it, whatever model reviewed: who and
    what the file is, what remains, why now, the move (who, what, for whom, by when, to whom), its alternative,
    when to stop, what done looks like, its window, its receipts. Nothing false reaches the dashboard — us, an
    internal field name, money with no money in the evidence, a quote that is not in the quotes — from either card
