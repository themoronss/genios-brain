                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/genios_test .venv/bin/python -m pytest -q tests/test_migration_0211_a_followup_names_its_observation.py tests/platform/test_the_code_can_always_be_rolled_back.py"
                      depends_on: []
            - layer: logic
              levels:
                - level: 0
                  units:
                    - id: M48.C2.L-logic.V0.U03
                      what: >
                        STEP-18 B21 (`03` F32). `context/model_audit.record_model_run` audits a parsed
                        answer that holds a decimal: the response hash reads each float as its decimal text
