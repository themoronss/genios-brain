    - id: M49
      name: Nothing is paid for that nothing reads, and what the engine says about itself is true (STEP-18 B7, B11, B25; 03 F97, F117, F128, F135)
      ships: >
        A calendar page buys no relevance call (a structured object is decided by rule at capture); a bounce
        on the connector's fast path is never primed for the junk filter and never left a snippet; the
        behaviour brain holds this company's conduct only; a brief read through a connection sees that
        transaction and is never served from the cache; the 24 public mail hosts are one list everywhere a
        company is minted; `scripts/activate_tenant.py` names the effect of every Layer 3 domain; a boot outside
        dev with the default JWT secret refuses.
      categories:
        - id: M49.C1
          name: No paid call about nothing — L1 Signals (`capture/`)
          layers:
            - layer: logic
              levels:
                - level: 0
                  units:
                    - id: M49.C1.L-logic.V0.U01
                      what: >
                        STEP-18 B25 (`03` F42). `capture/pipeline.page_relevance_candidate` marks an object the
                        way `capture_event` routes it — a mapped kind (a calendar event) or an enterprise
                        system is structured — so `RelevancePage.prime` never pre-judges it: at capture the
                        cascade settles it by `RULE_STRUCTURED_SOURCE` and the page's paid verdict was never
                        read (and a page of unknown organisers raised a false "graph-coverage" alert). Mail is
                        primed exactly as before.
                      artifact: "genios_engine/capture/pipeline.py"
                      verify: ".venv/bin/python -m pytest -q tests/capture/test_a_calendar_event_buys_no_relevance_call.py tests/capture/test_a_company_brief_sender_is_kept_and_read.py"
                      depends_on: []
                    - id: M49.C1.L-logic.V0.U02
                      what: >
                        `03` F117, the bounce. On the connector's fast path a delivery report
                        (`capture/gate/rules.is_a_delivery_report`, the one way Layer 1 asks it) is neither
                        primed for the junk filter nor left a list snippet on a "drop" verdict: the gate keeps
                        and reads it (`06` D38), so the batch call was bought for nothing, and a confident
                        drop skipped the body the bounce parser reads.
                      artifact: "genios_engine/capture/connectors/composio.py"
                      verify: ".venv/bin/python -m pytest -q tests/capture/connectors/test_a_bounce_is_read_whole_on_the_fast_path.py"
                      depends_on: []
        - id: M49.C2
          name: What it says about itself is what it measured — L2 Plane D (`packs/`), L3 (`context/`), platform
          layers:
            - layer: logic
              levels:
                - level: 0
                  units:
                    - id: M49.C2.L-logic.V0.U03
                      what: >
                        STEP-18 B11. `packs/brains/behavior_distill`: `relationship.response_latency_hours` is
                        the COUNTERPARTY's reply latency (`context/analytic/sampler._reply_latencies_hours`:
                        from our outbound to their next inbound) and leaves `BEHAVIOR_ELIGIBLE_METRICS`
                        (`:105`, labelled "how fast this company answers") — declared, with the reason, beside
                        the other metrics that measure the world's conduct. A published entry of a metric that
                        is no longer eligible is named (`metric_not_ours`), never read as a series gone dark.
                      artifact: "genios_engine/packs/brains/behavior_distill.py"
                      verify: ".venv/bin/python -m pytest -q tests/packs/brains/test_behavior_distill.py"
                      depends_on: []
                    - id: M49.C2.L-logic.V0.U04
                      what: >
                        `03` F97. `platform/company_brief.current` keeps its promise: a CONNECTION is read
                        through `brief_for` on that connection, never through a second one of its engine and
                        never from or into the per-process cache — so a caller inside a transaction sees its
                        own writes, and an empty brief read mid-transaction is not served after the commit.
                      artifact: "genios_engine/platform/company_brief.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/genios_test .venv/bin/python -m pytest -q tests/platform/test_a_brief_read_in_a_transaction_sees_it.py"
                      depends_on: []
                    - id: M49.C2.L-logic.V0.U05
                      what: >
                        `03` F128. One list of public mail hosts: `capture/structured/apply._PERSONAL_DOMAINS`
                        (8 hosts — read by the structured lane, `context/pipeline._company_domain` and
                        `context/introductions._stem`) is `capture/validate/canonical.CONSUMER_EMAIL_DOMAINS`
                        (24 — `platform/self_identity.PUBLIC_MAIL_DOMAINS`), so rediffmail.com, zoho.com,
                        yahoo.co.in and thirteen more no longer mint one company file shared by everyone
                        writing from them.
                      artifact: "genios_engine/capture/structured/apply.py"
                      verify: ".venv/bin/python -m pytest -q tests/context/test_one_list_of_public_mail_hosts.py"
                      depends_on: []
            - layer: interface
              levels:
                - level: 0
                  units:
                    - id: M49.C2.L-interface.V0.U06
                      what: >
                        `03` F135. `scripts/activate_tenant.py` names a Layer 3 domain's effect from
                        `platform/l3_activation.EFFECTS` — its own `EFFECT` table had no `founder_office` line,
                        so the dry run an operator reads before `--apply` showed it blank.
                      artifact: "scripts/activate_tenant.py"
                      verify: ".venv/bin/python -m pytest -q tests/test_activate_tenant_names_every_effect.py"
                      depends_on: []
        - id: M49.C3
          name: The dev secret never signs a production session — platform
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M49.C3.L-contract.V0.U07
                      what: >
                        STEP-18 B7. `platform/config.insecure_boot`: why this configuration may not serve —
                        an environment named outside dev (`dev`, `development`, `test`, `local`) whose
                        `jwt_secret` is still the shipped default (`config.py:37`), with which anyone can sign a
                        session. `None` when it may. An unset `GENIOS_ENV` reads `dev` as it always has.
                      artifact: "genios_engine/platform/config.py"
                      verify: ".venv/bin/python -m pytest -q tests/platform/test_the_dev_secret_never_boots_outside_dev.py"
                      depends_on: []
            - layer: integration
              levels:
                - level: 1
                  units:
                    - id: M49.C3.L-integration.V1.U08
                      what: >
                        STEP-18 B7, the boot. `main.lifespan` asks `insecure_boot` first and refuses to start
                        with its reason, before migrations and before any worker. ⛔ Deploy precondition
                        (Harsh, `08`): production's `GENIOS_JWT_SECRET` is set — with the default and a
                        non-dev `GENIOS_ENV` the new image will not boot, by design.
                      artifact: "genios_engine/main.py"
                      verify: ".venv/bin/python -m pytest -q tests/platform/test_the_dev_secret_never_boots_outside_dev.py tests/test_migrate_read_only.py"
                      depends_on: [M49.C3.L-contract.V0.U07]
