                      artifact: "genios_engine/context/situations.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/genios_test .venv/bin/python -m pytest -q tests/capture/coverage/test_a_failed_coverage_read_loses_itself_alone.py"
                      depends_on: [M48.C2.L-data.V0.U07]
                    - id: M48.C2.L-data.V1.U10
