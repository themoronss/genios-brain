# yc2_w27_s18 — STEP-18, the live bugs already found. Proposed 2026-10-12 by the STEP-18 worker for the
# lead to merge into `tree.yaml` (the worker never edits it). Same shape as `yc2_w27_s13`.
yc2_w27_s18:
  status: built   # 2026-10-12 on `yc2w27-s18` (c885d677..), 20 units + 3 fixes, every unit mutation-tested; not pushed
  source: >
    speedrun008/YC-II W27/STEP-18 B1-B29 and the rows of `03` that name STEP-18 as their owner (F65, F79,
    F97, F100, F108, F109, F111, F117, F120, F128, F135, F158, F159, F165, F166, F180), each re-checked at
    `fbd0aeaa` with its file and line (STEP-18 §8.1-§8.2). Of the 29: B1, B2, B5, B6, B14, B17, B18, B19 are
    fixed by earlier steps, B20 by half; B16 was retired by STEP-09's own measurement; B8 is half fixed
    (fundraising) and half a declared choice (`general`); B9, B10, B22-B24, B26 wait on a decision or on
    arming; B27-B29 need a design of their own. What is left and buildable without a decision, without
    a re-record of the golden set and without a file STEP-13 is building is below.
  vision: >
    What you tell GeniOS is kept: every "wrong because" reason saves, and a learning that waits for your
    review can be reviewed. Memory is never aborted by a number, never rebuilt without its mail, never
    doubled by a screen follow-up, and a failed read loses itself alone. A wipe takes its claims with it.
    Nothing is paid for that nothing reads — no relevance call about a calendar event, no junk verdict
    on a bounce. What the engine says about itself is true: the behaviour brain holds this company's
    conduct, a brief read inside a transaction sees it, one list says which hosts are public mail, the
    operator's activation table names every effect, and a production boot refuses the dev secret.
  order_note: >
    Every unit has no dependency outside its own category except where `depends_on` says, so the order is
    the categories' — M48.C1, C2, C3, then M49.C1, C2, C3 — with the repo guards (root, platform and the
    folders a group touched) run on fresh databases on the second scratch server (pg2, 127.0.0.1:55433)
    after every two or three units that change together. Every unit: a failing test first, its verify, a
    mutation run (`SP/s12/mutants.py`), its own commit. The verify commands name `genios_test`; each run
    uses a database created fresh for it on pg2. No unit changes a model prompt, so no golden cassette is
    re-recorded (B25 removes a calendar page's relevance call; the golden runner lands calendars on their
    own pages, so no mail prompt changes).
  milestones:
    - id: M48
      name: What you tell it is kept, and nothing memory holds is aborted, lost or doubled (STEP-18 B3, B4, B12, B13, B20, B21; 03 F65, F120)
      ships: >
        Each of the eleven reasons a card offers saves through `POST /v1/intelligence/feedback` (0 × 500,
        was 8 of 11); a weekly learning routed to review rests at `human_review` and the review route takes
        it (was 409); a parsed answer holding a decimal is audited and the resolution pass goes on; a
        rebuilt graph holds the mail it was built from; a screen follow-up has one active observation however
        often it changes; a coverage read that fails loses itself alone; no read leaves its connection open;
        every wipe of mail events deletes their fingerprints first.
      categories:
        - id: M48.C1
          name: Your verdicts are kept — L6 Learning (`feedback/`)
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M48.C1.L-contract.V0.U01
                      what: >
                        STEP-18 B3. `0210_every_wrong_reason_is_kept`: the two CHECKs `0034` put on
                        `card_feedback_verdicts` and `card_feedback_revisions` (`reason in ('not_relevant',
                        'wrong_facts', 'bad_timing')`, `0034:168, 189`) take the eleven reasons of
                        `contracts/learning_attribution.ALL_REASONS` — the set the card offers
                        (`deliver/card_builder`) and the route accepts (`api/intelligence_routes._FB_WRONG_REASONS`).
                        A `wrong` verdict still needs a reason; every other rule of the table is unchanged.
                        Additive: it drops a constraint and adds a looser one, so the previous image runs.
                        Nothing is armed: calibration stays in shadow (`06` D13), and the Adaptive lease
                        counts `bad_timing` rows only, so a new reason only adds to its denominator.
                      artifact: "migrations/0210_every_wrong_reason_is_kept.sql"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/genios_test .venv/bin/python -m pytest -q tests/feedback/test_every_wrong_reason_is_kept.py tests/platform/test_the_code_can_always_be_rolled_back.py"
                      depends_on: []
            - layer: data
              levels:
                - level: 0
                  units:
                    - id: M48.C1.L-data.V0.U02
                      what: >
                        STEP-18 B4. A weekly learning that governance routes to a human
                        (`feedback/governance`: a knowledge suggestion, an Organization or a constrained
                        brain) rests at `human_review`: `feedback/publisher.publish` moves the row's state
                        with the transition it logs (`publisher.py:242-245, 278` logged it and left the row
                        `governed`), so `api/learning_routes.review` (`:136`, 409 on anything else) takes it
                        and the console's queue (`api/brain_routes`, `learning_routes` counts) lists it. One
                        state-only UPDATE — the write-once guard's measured set of updaters moves from two to
                        three, deliberately.
                      artifact: "genios_engine/feedback/publisher.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/genios_test .venv/bin/python -m pytest -q tests/feedback/test_a_review_object_waits_for_review.py tests/api/test_a_proposal_is_written_once.py tests/feedback/test_no_transition_takes_an_edge_the_contract_forbids.py"
                      depends_on: []
        - id: M48.C2
          name: Memory is never aborted, lost on a rebuild, doubled, or failed by a neighbour's read — L3 Context Graph (`context/`) and its writers
          layers:
            - layer: contract
              levels:
                - level: 0
                  units:
                    - id: M48.C2.L-contract.V0.U12
                      what: >
                        ADDED IN BUILD (STEP-18 B13). `0211_a_followup_names_its_observation`:
                        `screen_followups.observation_id` — the graph observation a follow-up was last
                        written as, so the next write of a changed follow-up can retire it (finding it
