                      artifact: "genios_engine/context/model_audit.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/genios_test .venv/bin/python -m pytest -q tests/context/lifecycle/test_a_decimal_answer_is_audited.py"
                      depends_on: []
            - layer: data
              levels:
                - level: 0
                  units:
                    - id: M48.C2.L-data.V0.U04
                      what: >
                        STEP-18 B12, the read. `context/runner._rows_for_rebuild` (private, as `_safe_process_one`): every kept event that has
                        a road into memory (`memory_lanes.lane_for` — a signal, below the floor, metadata,
                        calendar), with the drain's own columns (the cached extraction, the prepared text,
                        the recipients, the thread) — one spelling with `_pull`, which reads the same columns
