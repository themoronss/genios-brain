                      artifact: "genios_engine/reason/moments/screen_memory.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/genios_test .venv/bin/python -m pytest -q tests/test_a_followup_has_one_observation_pg.py tests/test_screen_memory_batch_pg.py"
                      depends_on: [M48.C2.L-contract.V0.U12]
                    - id: M48.C2.L-data.V0.U07
                      what: >
                        `03` F120, the first read. `capture/coverage/window.coverage_for_window` reads its
