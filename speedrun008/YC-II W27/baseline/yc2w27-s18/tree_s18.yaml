                      artifact: "genios_engine/context/runner.py"
                      verify: "GENIOS_TEST_DATABASE_URL=postgresql+psycopg://postgres:scratch@127.0.0.1:55433/genios_test .venv/bin/python -m pytest -q tests/context/test_a_rebuild_reads_every_road.py tests/context/test_memory_lanes.py"
                      depends_on: []
                    - id: M48.C2.L-data.V0.U06
                      what: >
