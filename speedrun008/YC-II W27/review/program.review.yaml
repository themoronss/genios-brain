- id: L121
  artifact: founder_office.obj.program_applications.application
  field: purpose
  text: 'One application by the company to one intake of one programme — an accelerator, an incubator,
    a fellowship, a grant or a government scheme — and where it stands. It exists apart from an investor
    conversation because the two move differently: a conversation moves when its parties move it; an application
    moves on the programme''s published calendar, by its rules, for the whole batch at once. What it holds
    is that calendar, the stage the programme''s own words put the application in, whose turn it is, and
    — when it ends — how, including the date on which a rejection stops being true.'
