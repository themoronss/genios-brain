kind: program
capability: founder_office.programs_and_applications.program_applications
how: For every line set decision to accept, edit or reject; give an edit or a reject a note. Nothing is
  admitted until every line is accepted (06 D45).
lines:
- id: L001
  artifact: founder_office.programs_and_applications.program_applications
  field: description
  text: 'Every application the company makes to an accelerator, an incubator, a fellowship, a grant or
    a government scheme, from the submission to the programme''s first day, and the programme''s own deadlines
    while the company is in it. An application is a selection process, not a conversation. The programme
    publishes its calendar, reads every applicant against the same form, decides as a batch or by a committee,
    and answers on its own date — or, for a rolling scheme, on its own clock from receipt. Four things
    follow that an investor reading gets wrong. The programme''s deadline is the one date in the file
    that will not move for anyone. Its silence before its published decision date is not a no, because
    the answer has a date and many programmes promise to answer every applicant; the exception is the
    programme that writes only to the applicants it wants, and knowing which kind this is decides what
    the quiet means. Its rejection usually carries a date on which it stops being true — the next intake
    — and is worth filing with that date and with what will be different. And its acceptance is not the
    end: it opens a second process with its own dates — the agreement, the investment documents where
    the programme invests, the entity the programme can invest in, and for some programmes a move. The
    capability''s job is to keep each application''s real stage, the programme''s next date and whose
    turn it is visible, so that no application is lost on a date rather than on merit.'
  fingerprint: d11295c24ce27998
  decision: ''
  note: ''
- id: L002
  artifact: founder_office.programs_and_applications.program_applications
  field: question
  text: Where does this application stand, and what does its programme expect next?
  fingerprint: ef9bb3594f5cb19d
  decision: ''
  note: ''
- id: L003
  artifact: founder_office.programs_and_applications.program_applications
  field: outcomes[1]
  text: Every live application carries its programme's own calendar — the deadline in the programme's
    time zone and in the founder's, the review window, the decision-by date, the start — each with the
    page it came from; or the file says the programme is rolling and names its response clock instead.
  fingerprint: e820b7264ea6b465
  decision: ''
  note: ''
- id: L004
  artifact: founder_office.programs_and_applications.program_applications
  field: outcomes[2]
  text: Each application's stage is named from the programme's own words — its mail or its portal's status
    — and the file says what the programme's quiet means at that stage, rather than how long it feels.
  fingerprint: 9c147fdb0c25a0f2
  decision: ''
  note: ''
- id: L005
  artifact: founder_office.programs_and_applications.program_applications
  field: outcomes[3]
  text: Every request a programme makes — an interview slot to book, a clarification, a missing document,
    an offer to accept — is answered before the programme's own date, with every founder it asks for.
  fingerprint: 7b0449827e8fd0c8
  decision: ''
  note: ''
- id: L006
  artifact: founder_office.programs_and_applications.program_applications
  field: outcomes[4]
  text: 'A decision is recorded with what it asks next: an offer accepted in writing before its reply-by
    date and its papers in hand before the first day, or a rejection filed with its re-application date
    and the change the next application will lead with.'
  fingerprint: 5e734d71bfbc69b2
  decision: ''
  note: ''
- id: L007
  artifact: founder_office.programs_and_applications.program_applications
  field: outcomes[5]
  text: Programmes are kept out of the investor reading. No chase is sent to a selection team that has
    published its date, no introduction is sought for a process that reads every application alike, and
    no rejection is filed as a lost relationship.
  fingerprint: 742bab76750a2024
  decision: ''
  note: ''
- id: L008
  artifact: founder_office.programs_and_applications.program_applications
  field: outcomes[6]
  text: 'An application is stopped on purpose when that is the answer: a programme past its own decision
    date that has not answered one status query, an offer the founder chooses to decline, or an intake
    the company is not eligible for is closed with its reason — not left as a live file that ages until
    someone asks why it is still there.'
  fingerprint: 968f062faa19d8a2
  decision: ''
  note: ''
- id: L009
  artifact: founder_office.programs_and_applications.program_applications
  field: failure_modes[1]
  text: Reading a programme as an investor. The file is then chased like a fund that has gone quiet, a
    warm introduction is sought for a process that says it does not rely on introductions, and a rejection
    is filed as a lost deal — when the programme has published its calendar, decides through its own selection
    rounds and invites the company back at its next intake.
  fingerprint: f8ab3effe49b4942
  decision: ''
  note: ''
- id: L010
  artifact: founder_office.programs_and_applications.program_applications
  field: failure_modes[2]
  text: 'Treating a batch''s silence as a no. The founder gives up — or nags — before the published decision
    date, when the programme answers on its own calendar and has said it will answer everyone. The opposite
    error is as costly: waiting for a programme that writes only to the applicants it wants, long after
    its silence has become the answer.'
  fingerprint: bbf179b875dfc512
  decision: ''
  note: ''
- id: L011
  artifact: founder_office.programs_and_applications.program_applications
  field: failure_modes[3]
  text: Missing a deadline that does not move. The date is read in the founder's time zone when the programme
    publishes it in its own, the upload is left to the final hour, or a co-founder's part of the form
    is still open. A late application is read for the next cohort, or read with no promised date — never
    marked on time for a good reason.
  fingerprint: f4f92acc80d46740
  decision: ''
  note: ''
- id: L012
  artifact: founder_office.programs_and_applications.program_applications
  field: failure_modes[4]
  text: Filing a rejection as final when the programme invites a re-application. Without the date and
    the feedback the company either never re-applies or re-applies with the same application, and a programme
    that counts progress since the last application sees none.
  fingerprint: cf9dbdaa9a8623fb
  decision: ''
  note: ''
- id: L013
  artifact: founder_office.programs_and_applications.program_applications
  field: failure_modes[5]
  text: Losing an offer in onboarding. Acceptance is read as the finish while the agreement goes unsigned,
    the investment documents wait on a cap table nobody has checked, or the entity the programme can invest
    in does not exist yet — a parent company abroad, or a licence in the programme's own jurisdiction
    — and each of those has a date of its own.
  fingerprint: c3943a5ceff9167c
  decision: ''
  note: ''
- id: L014
  artifact: founder_office.programs_and_applications.program_applications
  field: failure_modes[6]
  text: Reading only the mail. A government scheme's portal holds the status and the mail only reports
    it, often in a template that a filter takes for an automated notice; the application moves, or is
    asked a question, and nobody sees it until the portal's own clock has run.
  fingerprint: 7ebefbed55c39837
  decision: ''
  note: ''
- id: L015
  artifact: founder_office.programs_and_applications.program_applications
  field: kpis[1]
  text: 'programme_calendar_on_file (higher_is_better): Share of live applications whose file carries
    the programme''s published deadline and decision date with the page each came from, or a stated response
    clock for a rolling programme. The capability''s floor: an application nobody can date is an application
    nobody is running.'
  fingerprint: cbedca6faa7fcaaa
  decision: ''
  note: ''
- id: L016
  artifact: founder_office.programs_and_applications.program_applications
  field: kpis[2]
  text: 'programme_requests_answered_in_time (higher_is_better): Share of programme requests — interview
    bookings, clarifications, documents, offer acceptances — answered before the programme''s own date.
    The most actionable number here, because the programme''s date passes whether or not anyone reminds
    the founder of it.'
  fingerprint: f5faff94bdd27d2e
  decision: ''
  note: ''
- id: L017
  artifact: founder_office.programs_and_applications.program_applications
  field: kpis[3]
  text: 'oldest_unanswered_programme_request (lower_is_better): Age of the oldest programme request still
    waiting on the founder. Read against the request''s own date, never against how quiet the programme
    has been.'
  fingerprint: e2acbcc9348376b2
  decision: ''
  note: ''
- id: L018
  artifact: founder_office.programs_and_applications.program_applications
  field: kpis[4]
  text: 'declines_filed_with_a_reapplication_date (higher_is_better): Share of rejections recorded with
    the programme''s re-application window and what will change. Measures whether the reversible half
    of the rejections survives being written down.'
  fingerprint: bb37ddc0661454d3
  decision: ''
  note: ''
- id: L019
  artifact: founder_office.programs_and_applications.program_applications
  field: kpis[5]
  text: 'programme_files_read_as_investors (lower_is_better): Programme files carried in the investor
    reading — chased, offered an introduction, or filed as a pass. Each one is advice built for a different
    kind of counterparty.'
  fingerprint: a76dedddaf00ed62
  decision: ''
  note: ''
- id: L020
  artifact: founder_office.heu.program_applications.a_batch_is_silent_until_it_decides
  field: purpose
  text: 'Says what a programme''s quiet means, which is not what an investor''s quiet means: a selection
    team with a published decision date is silent because the batch has not been decided, not because
    this application has.'
  fingerprint: d2347aa5ccf44b03
  decision: ''
  note: ''
- id: L021
  artifact: founder_office.heu.program_applications.a_batch_is_silent_until_it_decides
  field: heuristic.statement
  text: A programme that reads its applications as a batch answers on its own published calendar, not
    on the applicant's. Its quiet before that date is not a no — and after it, the programme's own reply
    rule, not the length of the quiet, says what the quiet means.
  fingerprint: f396526e2852ce7c
  decision: ''
  note: ''
- id: L022
  artifact: founder_office.heu.program_applications.a_batch_is_silent_until_it_decides
  field: heuristic.why
  text: Reviewers read an intake's applications against one calendar and answer on dates they publish.
    YC tells on-time applicants they "will get a decision by December 11" and says "We always respond
    to everyone who applies, no exceptions"; Techstars reviews "within four weeks of applications closing"
    and "will notify all applicants about the state of their application"; Hub71 promises "feedback about
    the status of your application within three months of applying". The answer has a date, so until that
    date has come the quiet carries no information about this application.
  fingerprint: eabcdc1ef21b95f8
  decision: ''
  note: ''
- id: L023
  artifact: founder_office.heu.program_applications.a_batch_is_silent_until_it_decides
  field: heuristic.applies_when
  text: The application is under review or awaiting a decision, and the programme has published a decision
    date or a response time.
  fingerprint: 12b6007c8ad46916
  decision: ''
  note: ''
- id: L024
  artifact: founder_office.heu.program_applications.a_batch_is_silent_until_it_decides
  field: heuristic.breaks_down_when
  text: 'Three regimes. A programme that writes only to the applicants it wants — Antler''s form says
    "If there''s a fit, we''ll be in touch by email" — means its silence, once past its own response time,
    as the answer. A programme that publishes no date gives the quiet no reference point, and the outcome
    window has to stand in for one. And on a government scheme the status may already have changed on
    the portal while the mailbox is silent: SISFS shows status on its dashboard in real time.'
  fingerprint: 122796a6cc95b96f
  decision: ''
  note: ''
- id: L025
  artifact: founder_office.heu.program_applications.a_programme_is_not_an_investor
  field: purpose
  text: 'Separates an application from an investor conversation, which the extraction cannot: both arrive
    from people who may put money into the company, and the two need opposite moves.'
  fingerprint: e481555c2660325a
  decision: ''
  note: ''
- id: L026
  artifact: founder_office.heu.program_applications.a_programme_is_not_an_investor
  field: heuristic.statement
  text: An application to a programme is a selection process with a published calendar, not an investor
    conversation — even when the programme invests. Read it by its calendar and its rules, not by how
    warm the last mail was.
  fingerprint: 2f4657314bd894e9
  decision: ''
  note: ''
- id: L027
  artifact: founder_office.heu.program_applications.a_programme_is_not_an_investor
  field: heuristic.why
  text: 'A programme reads every applicant against the same form and the same calendar, and decides through
    its own selection rounds; YC puts it plainly — "One of YC''s core principles is considering all applications
    equally. We don''t rely on introductions the way many investors do." Its terms are its own, published
    before anyone applies: YC has "a standard deal for every company that is accepted", Techstars offers
    $220,000 "for the vast majority of our programs", Hub71 AED 250,000 on a SAFE note. And its no comes
    with a next intake. Read as an investor, the same file gets an investor''s moves — a chase to a selection
    team that has published its date, a warm introduction to a process that reads every application alike,
    a pass filed as final — and each one is wrong here.'
  fingerprint: 00217350c362de06
  decision: ''
  note: ''
- id: L028
  artifact: founder_office.heu.program_applications.a_programme_is_not_an_investor
  field: heuristic.applies_when
  text: The counterparty is an accelerator, an incubator, a fellowship, a grant-maker or a government
    scheme, and the company has applied or is about to.
  fingerprint: 9c085dd58088a407
  decision: ''
  note: ''
- id: L029
  artifact: founder_office.heu.program_applications.a_programme_is_not_an_investor
  field: heuristic.breaks_down_when
  text: 'Once the company is in an investing programme, the programme holds a SAFE or shares — YC also
    takes a right to invest in later rounds — and from then the relationship is investor relations. And
    an investor''s own programme behaves like the fund it belongs to: Peak XV calls Surge "the way Peak
    XV does seed investing" and reviews its applications on a rolling basis, and Antler India says around
    half of its investments have been made directly, outside its residency. There the application is an
    investment conversation with a programme''s paperwork.'
  fingerprint: ea05ff0bd6fca039
  decision: ''
  note: ''
- id: L030
  artifact: founder_office.heu.program_applications.a_rejection_carries_a_reapplication_date
  field: purpose
  text: 'Separates a programme''s rejection from a verdict on the company, because the two need opposite
    handling: a verdict is filed and forgotten, a dated rejection is scheduled against.'
  fingerprint: 56e08b095a4b0f45
  decision: ''
  note: ''
- id: L031
  artifact: founder_office.heu.program_applications.a_rejection_carries_a_reapplication_date
  field: heuristic.statement
  text: 'A programme''s rejection is usually a dated fact, not a verdict: it stops being true at the next
    intake. File it with that date and with what will be different.'
  fingerprint: 7ef2233acc9a8d91
  decision: ''
  note: ''
- id: L032
  artifact: founder_office.heu.program_applications.a_rejection_carries_a_reapplication_date
  field: heuristic.why
  text: 'Programmes re-admit on a calendar and say so. "In a typical YC batch, about half the companies
    applied multiple times before being accepted", and YC strongly encourages applying again; Techstars:
    "It takes many companies a few tries to get in"; SISFS takes a new application six weeks after a rejection;
    Hub71 and NSRCEL take applications for future cohorts. A cohort has a fixed number of places — Techstars
    Paris takes twelve companies a class — so a no can be about the batch as much as the company, and
    the next application is read for the progress since the last: YC calls that progress "a strong signal".'
  fingerprint: a1086ec0fcdf5f11
  decision: ''
  note: ''
- id: L033
  artifact: founder_office.heu.program_applications.a_rejection_carries_a_reapplication_date
  field: heuristic.applies_when
  text: A programme has declined an application, with or without feedback.
  fingerprint: 8df4b373a07691be
  decision: ''
  note: ''
- id: L034
  artifact: founder_office.heu.program_applications.a_rejection_carries_a_reapplication_date
  field: heuristic.breaks_down_when
  text: 'An eligibility rejection does not reopen with time and can close for good: SISFS admits only
    companies incorporated not more than two years before the application, so waiting can end eligibility
    rather than restore it. A one-off programme has no next intake. And a re-application with nothing
    new repeats the decision — NSRCEL asks re-applicants to "highlight any additional information of your
    progress since your application for a previous cohort".'
  fingerprint: 4bd705958799c3ab
  decision: ''
  note: ''
- id: L035
  artifact: founder_office.heu.program_applications.the_deadline_is_the_only_fixed_point
  field: purpose
  text: Names the one date in an application that the company cannot move, so that every other date is
    planned from it rather than towards it.
  fingerprint: 3e23ed1ca81cb0d4
  decision: ''
  note: ''
- id: L036
  artifact: founder_office.heu.program_applications.the_deadline_is_the_only_fixed_point
  field: heuristic.statement
  text: In an application, the programme's deadline is the one date that will not move for this company;
    every other date in the plan is set backwards from it, on the programme's clock.
  fingerprint: 0450fd67a1cd6c42
  decision: ''
  note: ''
- id: L037
  artifact: founder_office.heu.program_applications.the_deadline_is_the_only_fixed_point
  field: heuristic.why
  text: The deadline is published once, for every applicant, and kept. YC publishes "November 2 at 8pm
    PT" and answers a request to mark a late application on time with "No, sorry"; Hub71 reads an application
    that misses its cohort's deadline for the next cohort. Everything on the company's side — the deck,
    the numbers, a co-founder's week — can move; the deadline cannot, so it is the only point a plan can
    be anchored to.
  fingerprint: ae599f4892202ce3
  decision: ''
  note: ''
- id: L038
  artifact: founder_office.heu.program_applications.the_deadline_is_the_only_fixed_point
  field: heuristic.applies_when
  text: A programme with a published deadline, before the deadline has passed.
  fingerprint: 1f85ce8c90701fdd
  decision: ''
  note: ''
- id: L039
  artifact: founder_office.heu.program_applications.the_deadline_is_the_only_fixed_point
  field: heuristic.breaks_down_when
  text: 'A rolling programme has no deadline — SISFS takes applications on an ongoing basis — and its
    fixed points are its eligibility rules on the day of application and its response clock. A programme
    can extend its own window, and then the new date replaces the old one. And a late application is not
    always a lost one: YC still reads late applications and says "We fund many companies that apply late
    every batch", so for YC late moves the application to an unpromised date rather than out of the process.'
  fingerprint: f9a4bdede8288f3a
  decision: ''
  note: ''
- id: L040
  artifact: founder_office.heu.program_applications.the_portal_is_the_record
  field: purpose
  text: Says where a government scheme's decision actually lives, so that a templated notice is not discarded
    as noise and a silent mailbox is not read as a silent scheme.
  fingerprint: a090b7f776975746
  decision: ''
  note: ''
- id: L041
  artifact: founder_office.heu.program_applications.the_portal_is_the_record
  field: heuristic.statement
  text: 'For a government scheme, the portal''s status is the decision record and the mail only reports
    it. Read the portal before reading the mailbox''s silence, and keep the portal''s templated notices:
    they are the programme speaking.'
  fingerprint: 0414e351875f23a5
  decision: ''
  note: ''
- id: L042
  artifact: founder_office.heu.program_applications.the_portal_is_the_record
  field: heuristic.why
  text: A scheme applies its published rules through its portal. SISFS lets every applicant "track the
    progress of their application on the Startup India portal on a real-time basis", requires every incubator
    to report its evaluation progress there, and notifies rejections by email. Such notices typically
    arrive as templates from an automated sender — the shape a mail filter treats as automated — so the
    mailbox is the copy of the record most likely to be lost.
  fingerprint: 06d8263b524d1e47
  decision: ''
  note: ''
- id: L043
  artifact: founder_office.heu.program_applications.the_portal_is_the_record
  field: heuristic.applies_when
  text: The application is to a government scheme, or to any programme that runs its own portal.
  fingerprint: e7d460aa2515e45d
  decision: ''
  note: ''
- id: L044
  artifact: founder_office.heu.program_applications.the_portal_is_the_record
  field: heuristic.breaks_down_when
  text: When the mail carries the request itself — a clarification with its own date — the mail is the
    instruction and must be answered on time whatever the portal shows. Where an incubator writes to the
    founders directly, its mail can report a decision before the portal does. And a programme with no
    portal keeps its record in the mail.
  fingerprint: cca3325ad2d8b6db
  decision: ''
  note: ''
- id: L045
  artifact: founder_office.pb.program_applications.documents_after_acceptance
  field: purpose
  text: 'Acceptance starts a second process with dates of its own: the programme''s agreement, its investment
    instruments where it invests, the company documents behind them, and for some programmes a new entity
    or a move. Each has an owner and a date, and none is a formality — the money and the first day wait
    on them.'
  fingerprint: 8a363201ee52fd37
  decision: ''
  note: ''
- id: L046
  artifact: founder_office.pb.program_applications.documents_after_acceptance
  field: when_to_use.signals[1]
  text: A programme has accepted the company, or selected it for a grant or a seed fund.
  fingerprint: 6019d990354fa658
  decision: ''
  note: ''
- id: L047
  artifact: founder_office.pb.program_applications.documents_after_acceptance
  field: when_to_use.signals[2]
  text: A programme sends an agreement, a contract, investment documents or an onboarding list.
  fingerprint: 2a06182e4ed5b17a
  decision: ''
  note: ''
- id: L048
  artifact: founder_office.pb.program_applications.documents_after_acceptance
  field: when_to_use.do_not_use_when[1]
  text: The offer has not been accepted yet — the decision-mail move comes first.
  fingerprint: 2eacfcf4511cb43a
  decision: ''
  note: ''
- id: L049
  artifact: founder_office.pb.program_applications.documents_after_acceptance
  field: steps[1]
  text: 'Get the programme''s whole list in writing — Ask once for every document the programme needs
    and by when, and work from its list rather than from what another programme asked for. (done when:
    The programme''s onboarding list is on the file, each item with a date.)'
  fingerprint: e6b318fb63ca04ad
  decision: ''
  note: ''
- id: L050
  artifact: founder_office.pb.program_applications.documents_after_acceptance
  field: steps[2]
  text: 'Sign the programme''s agreement — SISFS: "it is mandatory to sign a legal agreement with the
    incubator to avail the seed fund"; Google for Startups Accelerator India sends a programme contract
    to sign; YC invests with a YC Agreement alongside its SAFEs; Hub71''s selected startups "enter into
    an agreement". (done when: The programme''s agreement is signed for the company and on the file.)'
  fingerprint: 3cee1301d5bccab6
  decision: ''
  note: ''
- id: L051
  artifact: founder_office.pb.program_applications.documents_after_acceptance
  field: steps[3]
  text: 'Check that the company can take the investment — YC invests in US, Canada, Cayman and Singapore
    corporations; a company incorporated elsewhere — an Indian private limited company, say — creates
    a parent in one of them, which YC says "will require a significant effort on your part". Hub71 requires
    an ADGM tech licence for a subsidiary of the holding company. (done when: The entity the programme
    invests in exists, or each step to create it has an owner and a date.)'
  fingerprint: 2faa927a282c35c5
  decision: ''
  note: ''
- id: L052
  artifact: founder_office.pb.program_applications.documents_after_acceptance
  field: steps[4]
  text: 'Put the cap table in order before the instruments — The instruments are issued against the cap
    table — YC''s two SAFEs, Techstars'' uncapped MFN SAFE and post-money CEA, Hub71''s SAFE note. An
    Indian scheme reads shareholding too: SISFS requires Indian promoters to hold at least 51% when the
    company applies. (done when: A current cap table is on the file, and the instruments the programme
    will issue are named against it.)'
  fingerprint: 395544c13b9fdd21
  decision: ''
  note: ''
- id: L053
  artifact: founder_office.pb.program_applications.documents_after_acceptance
  field: steps[5]
  text: 'Have the scheme''s eligibility papers to hand — A government scheme admits only the company its
    rules describe, and its incubator checks before it signs — SISFS takes only DPIIT-recognised startups
    incorporated not more than two years before the application, and its incubators "conduct due diligence
    of the startups and sign legal agreement". (done when: The recognition, where the scheme requires
    one, is on the file, and the company met the scheme''s other rules on the day it applied.)'
  fingerprint: 5e7bcd15b7cee47c
  decision: ''
  note: ''
- id: L054
  artifact: founder_office.pb.program_applications.documents_after_acceptance
  field: steps[6]
  text: 'Give the account the money goes to — SISFS pays startups "in their company bank accounts" and
    releases the first grant instalment within 60 days of receiving the application; later instalments
    wait on an interim progress update and a utilisation certificate. (done when: The company''s bank
    details have gone to the programme in the form it asked for.)'
  fingerprint: c005fe7a27e34ca5
  decision: ''
  note: ''
- id: L055
