lines:
- id: L001
  artifact: founder_office.fundraising.investor_relations
  field: description
  text: 'Reading and running the founder''s conversations with the people who might fund the company —
    funds, angels, angel networks and syndicates — and with the people who introduce them, from first
    contact to a decision. It lives in the Founder Office because an investor is not a customer, and the
    default reading of an investor thread as a deal is wrong in a specific, expensive way. Four things
    are structurally different from a purchase. The counterparty is not buying a product, so there is
    nothing to demo in the sales sense and no value case to prove. There is no close date the founder
    controls: a fund invests when its own cycle, thesis and partnership say so. "No" is usually "not now"
    with a reopening condition attached, so a pass is a state to schedule against rather than an outcome
    to record and forget. And the whole thing is a PARALLEL process on one shared clock: an investor''s
    read of the company is substantially a read of how the round is going, so silence is not neutral the
    way it is in a deal — it is evidence, and what it is evidence of depends on the stage the conversation
    has reached. The capability''s job is to keep every conversation''s real stage and real next move
    visible, to read silence against what is typical for that stage, and to keep the reversible conversations
    from being written off.'
  fingerprint: 59652f70937373c6
  decision: ''
  note: ''
- id: L002
  artifact: founder_office.fundraising.investor_relations
  field: question
  text: Where does each investor conversation actually stand, and what does it need from us next?
  fingerprint: 265d0670a4665ca2
  decision: ''
  note: ''
- id: L003
  artifact: founder_office.fundraising.investor_relations
  field: outcomes[1]
  text: Each investor conversation placed on the stage list — first contact, first call, partner meeting,
    diligence, term sheet, closed or passed — from the last observable event rather than from how warm
    the last email felt, and `unknown` where nothing establishes it.
  fingerprint: 310c861b6a665307
  decision: ''
  note: ''
- id: L004
  artifact: founder_office.fundraising.investor_relations
  field: outcomes[2]
  text: 'Ball-in-court named per investor, with the asymmetry stated. Investors do not chase: where the
    turn is ours and has been for a while, that is the finding, and it is nearly always the cheapest thing
    on the list to fix.'
  fingerprint: bd9175ec2af1753d
  decision: ''
  note: ''
- id: L005
  artifact: founder_office.fundraising.investor_relations
  field: outcomes[3]
  text: 'A pass recorded WITH its reason and its reopening condition, or with an explicit statement that
    none was given. "Passed" alone destroys the information: the next round, the next fund and the partner
    who liked the company all remain live and all become invisible.'
  fingerprint: 09afb241be92fcd8
  decision: ''
  note: ''
- id: L006
  artifact: founder_office.fundraising.investor_relations
  field: outcomes[4]
  text: Accelerator, incubator and programme applications kept apart from fund conversations and handed
    to `founder_office.programs_and_applications.program_applications`. They run on cohort deadlines that
    do not move, so the correct action is calendar-shaped, not persuasion-shaped.
  fingerprint: a25924dbc2f912bd
  decision: ''
  note: ''
- id: L007
  artifact: founder_office.fundraising.investor_relations
  field: outcomes[5]
  text: The relationships worth keeping warm while NOT raising named as such. Most investor relationships
    are dormant most of the time, and that is their healthy state rather than a lapse.
  fingerprint: 11ac96cf05ba2641
  decision: ''
  note: ''
- id: L008
  artifact: founder_office.fundraising.investor_relations
  field: outcomes[6]
  text: An explicit verdict per investor — advance it, re-approach at a stated trigger, or let it rest.
    "Keep warm" is not a verdict; it is what gets written when nobody decided.
  fingerprint: f6b7c4dfe9867c62
  decision: ''
  note: ''
- id: L009
  artifact: founder_office.fundraising.investor_relations
  field: failure_modes[1]
  text: 'Reading the relationship as a deal. Everything that follows from that reading is wrong: a stalled-deal
    frame on a fund that is simply between partner meetings, a "closed lost" on a pass that invited a
    return, urgency aimed at a party that has no reason to feel it.'
  fingerprint: 53316776b2bf9c83
  decision: ''
  note: ''
- id: L010
  artifact: founder_office.fundraising.investor_relations
  field: failure_modes[2]
  text: Treating a pass as terminal. Many passes are on stage, timing or traction rather than on the company
    itself, and those carry their own dates; filing them as verdicts discards what Paul Graham calls "some
    of your warmest leads for future fundraising".
  fingerprint: c6cb78fc2e26787c
  decision: ''
  note: ''
- id: L011
  artifact: founder_office.fundraising.investor_relations
  field: failure_modes[3]
  text: Mistaking activity for progress. A raise produces a great deal of pleasant correspondence, and
    "investors habitually seem more positive than they are" (Graham). The measure is whether the process
    moved — a partner meeting booked, diligence opened, an offer with terms — not whether the last email
    was friendly.
  fingerprint: 3f9d99164bf089ef
  decision: ''
  note: ''
- id: L012
  artifact: founder_office.fundraising.investor_relations
  field: failure_modes[4]
  text: Single-threading a fund. The associate who sourced the company cannot fund it, and a conversation
    that never reaches a partner converts at approximately nothing however well it reads.
  fingerprint: e1f1712a795be243
  decision: ''
  note: ''
- id: L013
  artifact: founder_office.fundraising.investor_relations
  field: failure_modes[5]
  text: Running the round in sequence. Talking to investors one at a time removes the only real source
    of momentum and hands each of them an indefinite option, at the founder's expense.
  fingerprint: 72b330075a0616e5
  decision: ''
  note: ''
- id: L014
  artifact: founder_office.fundraising.investor_relations
  field: failure_modes[6]
  text: Letting the wrong parties into the set — a connector filed as an investor, an introduction bot,
    a newsletter, a portfolio-operations address, the company's own domain. Each needs a different move
    or none, and each costs attention every time the set is reviewed.
  fingerprint: 70d10ade982584e7
  decision: ''
  note: ''
- id: L015
  artifact: founder_office.fundraising.investor_relations
  field: kpis[1]
  text: 'investor_state_coverage (higher_is_better): Share of active investor conversations carrying a
    stage newer than their last inbound. The floor: a set of conversations nobody can place is not being
    run, whatever the founder''s confidence about it.'
  fingerprint: 4b1c7b25fde4f59d
  decision: ''
  note: ''
- id: L016
  artifact: founder_office.fundraising.investor_relations
  field: kpis[2]
  text: 'ball_in_our_court_age (lower_is_better): Age of the oldest conversation waiting on us. The most
    actionable number here, because the counterparty will not produce it — an investor who is waiting
    simply stops appearing.'
  fingerprint: 345e4083e5ed37e6
  decision: ''
  note: ''
- id: L017
  artifact: founder_office.fundraising.investor_relations
  field: kpis[3]
  text: 'stage_dwell_past_prior (lower_is_better): Share of live conversations that have sat in their
    stage longer than the stage''s typical duration on the spine. A conversation past its stage''s prior
    has usually been decided by the investor and not yet told to the founder.'
  fingerprint: c13fff678047b089
  decision: ''
  note: ''
- id: L018
  artifact: founder_office.fundraising.investor_relations
  field: kpis[4]
  text: 'reopening_conditions_captured (higher_is_better): Share of passes recorded with the condition
    under which the investor invited a return. Measures whether the reversible half of the set survives
    being written down.'
  fingerprint: a1e38dab9ea60d70
  decision: ''
  note: ''
- id: L019
  artifact: founder_office.fundraising.investor_relations
  field: kpis[5]
  text: 'partner_reach_rate (higher_is_better): Share of live fund conversations that have reached someone
    with a cheque decision. Everything below it is sourcing.'
  fingerprint: def3021fdaf66cf5
  decision: ''
  note: ''
- id: L020
  artifact: founder_office.fundraising.investor_relations
  field: kpis[6]
  text: 'dormant_revival_rate (higher_is_better): Share of re-approaches at a stated trigger that produce
    a meeting. Calibrates whether the reopening conditions being captured are real ones or politeness
    recorded as a plan.'
  fingerprint: 3b079d7da4e0d8ee
  decision: ''
  note: ''
- id: L021
  artifact: founder_office.heu.investor_relations.a_pass_is_a_date_not_a_verdict
  field: purpose
  text: 'Separates the two things a pass can be, because a pipeline''s closed-lost reading cannot: it
    fires the same way on both, and the two demand opposite behaviour.'
  fingerprint: b57ff636d3306e4b
  decision: ''
  note: ''
- id: L022
  artifact: founder_office.heu.investor_relations.a_pass_is_a_date_not_a_verdict
  field: heuristic.statement
  text: Most passes are decisions about timing, stage or a metric, and each of those carries an implicit
    date on which it stops being true. Record the date, not the refusal. Only thesis and team passes are
    verdicts.
  fingerprint: e503eaf74e15d1ba
  decision: ''
  note: ''
- id: L023
  artifact: founder_office.heu.investor_relations.a_pass_is_a_date_not_a_verdict
  field: heuristic.why
  text: 'A fund passing on stage is saying its cheque does not fit today''s round, which changes at the
    next round without anyone changing their mind; a fund passing on timing is reading its own cycle.
    Both are scheduling facts wearing the vocabulary of rejection, and the vocabulary is what gets recorded.
    Investors who reject a company "are some of your warmest leads for future fundraising" — any who "spent
    significant time deciding probably came close to saying yes" (Graham). Thesis and team are different
    in kind: judgments about what the company is, which no date changes.'
  fingerprint: e4fde97d924e7e53
  decision: ''
  note: ''
- id: L024
  artifact: founder_office.heu.investor_relations.a_pass_is_a_date_not_a_verdict
  field: heuristic.applies_when
  text: A pass has been received or inferred, and a reason is stated or can be read from it.
  fingerprint: e13f5cc45a960f77
  decision: ''
  note: ''
- id: L025
  artifact: founder_office.heu.investor_relations.a_pass_is_a_date_not_a_verdict
  field: heuristic.breaks_down_when
  text: A pass with no reason given carries no date and must not be assigned one — an invented trigger
    produces a re-approach with nothing behind it, which is worse than none. Repeated passes from the
    same investor across rounds stop being about timing whatever the stated reason. And a warm pass is
    sometimes simple politeness with no invitation inside it.
  fingerprint: a5eab5c213a302b5
  decision: ''
  note: ''
- id: L026
  artifact: founder_office.heu.investor_relations.investors_do_not_chase
  field: purpose
  text: Corrects the reflex a seller brings to a quiet thread. In a deal, a buyer who wants the product
    will eventually surface; in a raise, the counterparty has no such incentive and attrition costs it
    nothing. So a conversation waiting on the founder does not stall visibly — it disappears, without
    ever producing a signal that anything went wrong.
  fingerprint: 145913cdeb94d276
  decision: ''
  note: ''
- id: L027
  artifact: founder_office.heu.investor_relations.investors_do_not_chase
  field: heuristic.statement
  text: When the turn is ours, the clock is running against us and nobody will say so. Age the conversations
    where we owe the reply before the ones where they do.
  fingerprint: 670dcc0fe743ae67
  decision: ''
  note: ''
- id: L028
  artifact: founder_office.heu.investor_relations.investors_do_not_chase
  field: heuristic.why
  text: 'A fund sees far more companies than it can fund — one partner described 500 to 800 plans a year
    for one or two deals done (David Hornik, quoted by Paul Graham) — and loses nothing by dropping one.
    A partial reply left unanswered reads to it as a company that lost momentum, the one attribute a raise
    cannot afford to project. The asymmetry is structural: our silence is informative to them; theirs,
    before the stage says otherwise, is not informative to us.'
  fingerprint: 705e6aeed8e9df4e
  decision: ''
  note: ''
- id: L029
  artifact: founder_office.heu.investor_relations.investors_do_not_chase
  field: heuristic.applies_when
  text: The last message came from the investing party, and something was asked or offered in it.
  fingerprint: 3c7146330c610d99
  decision: ''
  note: ''
- id: L030
  artifact: founder_office.heu.investor_relations.investors_do_not_chase
  field: heuristic.breaks_down_when
  text: Three regimes. A deliberate hold — waiting for a metric or a lead before replying — looks identical
    from the correspondence and is often correct. A courtesy close leaves the turn nominally ours with
    nothing owed. And where a programme's application window is running, the programme's own deadline
    outranks the turn; that clock belongs to the programmes capability.
  fingerprint: 2d4be1179a7bfd16
  decision: ''
  note: ''
- id: L031
  artifact: founder_office.heu.investor_relations.momentum_is_a_parallel_process
  field: purpose
  text: 'Explains why a round run one investor at a time stalls, and what actually moves an investor who
    is waiting: another investor moving.'
  fingerprint: 4662571c2e9ec59c
  decision: ''
  note: ''
- id: L032
  artifact: founder_office.heu.investor_relations.momentum_is_a_parallel_process
  field: heuristic.statement
  text: A round's momentum comes from investors seeing other investors move. Run every conversation in
    parallel, and let each live investor hear real progress elsewhere; a conversation run on its own has
    no clock.
  fingerprint: e939518570aac25d
  decision: ''
  note: ''
- id: L033
  artifact: founder_office.heu.investor_relations.momentum_is_a_parallel_process
  field: heuristic.why
  text: '"The biggest factor in most investors'' opinions of you is the opinion of other investors" (Graham,
    "How to Raise Money"), and getting far along with one firm "will sometimes provoke other firms, even
    good ones, to make up their minds, lest they lose the deal" ("Investor Herd Dynamics"). Talked to
    one at a time, each investor holds a free option and waits; and the first commitment is the hard one
    — "Once you start getting investors to commit, it becomes increasingly easy to get more to."'
  fingerprint: 6116dcb7e19e95bd
  decision: ''
  note: ''
- id: L034
  artifact: founder_office.heu.investor_relations.momentum_is_a_parallel_process
  field: heuristic.applies_when
  text: The founder is raising from more than one investor, or deciding whether to wait on one.
  fingerprint: cd446cd6ec005d70
  decision: ''
  note: ''
- id: L035
  artifact: founder_office.heu.investor_relations.momentum_is_a_parallel_process
  field: heuristic.breaks_down_when
  text: 'When the progress is exaggerated: investors are very sensitive to manufactured urgency, and telling
    one firm who the other is ("Do not, however, tell A who B is") costs trust with both. When the round
    is going badly everywhere, parallel silence carries momentum too, downward. And when the company''s
    numbers are flat between meetings, which cools investors faster than competing interest warms them
    — "if your numbers are flat or down they''ll start to get cold feet" (Graham).'
  fingerprint: e196473752d731e5
  decision: ''
  note: ''
- id: L036
  artifact: founder_office.heu.investor_relations.only_an_offer_counts
  field: purpose
  text: Draws the line between interest and commitment, which a founder's hopes and an investor's politeness
    both blur, so that the round is counted in money that will arrive rather than in warmth.
  fingerprint: 3f169c768f071602
  decision: ''
  note: ''
- id: L037
  artifact: founder_office.heu.investor_relations.only_an_offer_counts
  field: heuristic.statement
  text: Count an investor in only when they have made a definite offer — an amount and a valuation or
    cap, with no conditions — and confirmed it in writing. Until then, treat them as a no, however warm
    they sound.
  fingerprint: e5468683dd1a90c8
  decision: ''
  note: ''
- id: L038
  artifact: founder_office.heu.investor_relations.only_an_offer_counts
  field: heuristic.why
  text: '"Investors habitually seem more positive than they are", and some "use language that makes it
    sound as if they''re committing, but which doesn''t actually commit them" (Graham). "We''d love to
    be part of this", "we''re in if you find a lead" and "we can do fifty to a hundred and fifty" are
    not offers: Y Combinator''s Handshake Deal Protocol defines an offer as an amount plus a valuation
    or cap and refuses ranges and conditions, because a founder who keeps room for a conditional yes is
    the only party it binds.'
  fingerprint: f9d6aa3b241a4f90
  decision: ''
  note: ''
- id: L039
  artifact: founder_office.heu.investor_relations.only_an_offer_counts
  field: heuristic.applies_when
  text: An investor has expressed interest, or the founder is counting how much of the round is committed.
  fingerprint: 2948c5d2dbfc0c2d
  decision: ''
  note: ''
- id: L040
  artifact: founder_office.heu.investor_relations.only_an_offer_counts
  field: heuristic.breaks_down_when
  text: An established investor's verbal yes on standard paperwork is rarely withdrawn — "Established
    ones have learned to treat saying yes as like diving off a diving board" (Graham) — so the written
    confirmation is a formality there, though still worth the email. And a term sheet is conditional by
    design (diligence, documents); that is the term-sheet stage, not a contingent yes.
  fingerprint: d2edea69a153df8f
  decision: ''
  note: ''
- id: L041
  artifact: founder_office.heu.investor_relations.silence_reads_by_stage
  field: purpose
  text: 'Stops two opposite mistakes with one rule: chasing a firm that is quietly doing its diligence,
    and waiting on a firm whose partners decided a week ago and will never send the no.'
  fingerprint: 303117e00dccde0b
  decision: ''
  note: ''
- id: L042
  artifact: founder_office.heu.investor_relations.silence_reads_by_stage
  field: heuristic.statement
  text: Investor silence means different things at different stages. Before a first meeting it is the
    default; after a first call that named no next step it is usually a soft no; more than a week after
    a partners' meeting it is usually a no; in diligence it is the work; after a term sheet it is paperwork,
    until the timetable slips. Read silence by the stage, never by its length alone.
  fingerprint: d3d11e50f901b80f
  decision: ''
  note: ''
- id: L043
  artifact: founder_office.heu.investor_relations.silence_reads_by_stage
  field: heuristic.why
  text: Each stage has a different decider and a different clock. A firm in diligence is calling references
    and writing its memo (Gompers et al. measured ten reference calls on average); a partnership decides
    in a weekly meeting, and its rejection "will rarely come in the form of an actual 'no'" (Dixon); and
    investors at every stage prefer an open option to a closed door — "Some of the worse ones never actually
    do say no; they just stop replying to your emails" (Graham). The same twelve days of quiet is therefore
    nothing in diligence and an answer after a partners' meeting.
  fingerprint: 60a74c607d8764bf
  decision: ''
  note: ''
- id: L044
  artifact: founder_office.heu.investor_relations.silence_reads_by_stage
  field: heuristic.applies_when
  text: An investor conversation is open, the turn is theirs, and the stage is known.
  fingerprint: 2d65c4bad77201ff
  decision: ''
  note: ''
- id: L045
  artifact: founder_office.heu.investor_relations.silence_reads_by_stage
  field: heuristic.breaks_down_when
  text: 'When the investor named a date that has not yet passed: the date outranks the stage. When the
    stage itself is wrong — a "diligence" request that is an associate asking for a deck before any partner
    has met the company. And with angels, who decide alone and on no cycle: their silence after a first
    call reads like a fund''s after a partners'' meeting.'
  fingerprint: a956decf6cdf95d2
  decision: ''
  note: ''
- id: L046
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: purpose
  text: Getting an introduction to an investor and following it through on both sides. In a raise the
    introduction is the door — "Before you can talk to investors, you have to be introduced to them" (Graham)
    — and who opens it matters as much as that it is opened. This move picks the connector, hands them
    a note they can forward, lets the investor opt in, and closes the loop with the connector whatever
    the answer.
  fingerprint: 0a468f98645cc68c
  decision: ''
  note: ''
- id: L047
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: when_to_use.signals[1]
  text: The founder wants a meeting with a specific investor and has no direct relationship with them.
  fingerprint: 62f9b18dba33c832
  decision: ''
  note: ''
- id: L048
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: when_to_use.signals[2]
  text: A connector has offered, or agreed, to make an introduction.
  fingerprint: dd3372b2f2167946
  decision: ''
  note: ''
- id: L049
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: when_to_use.do_not_use_when[1]
  text: The only path is an investor who has just passed on the company. Asked, they make an introduction
    that reads as an anti-recommendation.
  fingerprint: b73d6a4dd99248db
  decision: ''
  note: ''
- id: L050
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: when_to_use.do_not_use_when[2]
  text: The founder already knows the investor well enough to write directly.
  fingerprint: a0218705b2547036
  decision: ''
  note: ''
- id: L051
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: steps[1]
  text: 'Pick the connector whose word carries most — Rank the paths: an investor who has just committed
    to the round, then a founder the investor has backed, then others who know them well (Graham''s order).
    Never ask an investor who has just passed on the company. (done when: One connector is chosen, with
    the reason they carry weight with this investor written down.)'
  fingerprint: adf7b36c7ebf8bcf
  decision: ''
  note: ''
- id: L052
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: steps[2]
  text: 'Give the connector a note they can forward — Write three to five lines the connector can forward
    unchanged — what the company does, the one number that matters, why this investor, the ask. A connector
    who has to write it themselves often never does. (done when: The connector has a forwardable note
    in hand.)'
  fingerprint: c2c5880874f33931
  decision: ''
  note: ''
- id: L053
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: steps[3]
  text: 'Ask for a double opt-in — Ask the connector to check with the investor before introducing — Fred
    Wilson''s double opt-in. An introduction the investor agreed to is a meeting; one they did not agree
    to is an email they can ignore. (done when: The connector has asked the investor, or has said when
    they will.)'
  fingerprint: 6db93a3d1e16895c
  decision: ''
  note: ''
- id: L054
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: steps[4]
  text: 'Answer the introduction the same day — When the introduction lands, reply that day: thank the
    connector and move them to bcc, then offer the investor two or three times to meet. (done when: A
    reply offering times is sent on the day the introduction arrives.)'
  fingerprint: 939955aeb1179092
  decision: ''
  note: ''
- id: L055
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: steps[5]
  text: 'Close the loop with the connector — Tell the connector what came of it — a meeting, a pass or
    nothing — whatever the answer. A connector who never hears back does not introduce again. (done when:
    The connector has been told the outcome.)'
  fingerprint: c80e206643da4d9d
  decision: ''
  note: ''
- id: L056
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: steps[6]
  text: 'If it stalls, remind once, then let it go — If the connector has not sent it by the time they
    gave, remind them once with the note attached again. If the investor declined to opt in, accept it:
    writing to them cold around the connector spends the connector too. (done when: The introduction is
    made, declined or dropped, and nobody was approached around the connector.)'
  fingerprint: 0d78a5cecafe0427
  decision: ''
  note: ''
- id: L057
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: success_signal
  text: The investor opts in and a first meeting with them is on the calendar.
  fingerprint: ded42785bb979637
  decision: ''
  note: ''
- id: L058
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: do_nothing_consequence
  text: The connector's offer goes stale, the investor is approached cold or not at all, and the strongest
    door into that fund stays shut.
  fingerprint: cc9cabb10daabc9a
  decision: ''
  note: ''
- id: L059
  artifact: founder_office.pb.investor_relations.a_warm_intro_to_an_investor
  field: outcome_window_days
  text: wait 14 days for the success signal
  fingerprint: aad4a9b732510772
  decision: ''
  note: ''
- id: L060
  artifact: founder_office.pb.investor_relations.before_an_investor_call
  field: purpose
  text: 'The preparation that makes one investor call move its conversation to the next stage: knowing
    the investor, knowing where this conversation stands and what the call must produce, and leaving with
