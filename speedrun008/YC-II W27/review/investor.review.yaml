- id: L100
  artifact: founder_office.pb.investor_relations.run_an_investor_conversation
  field: stages[2]
  text: 'First call held [first_call]: typically 14 days — a prior; source: practitioner judgement — unverified;
    for the founder''s review. The funnel is measured (Gompers, Gornall, Kaplan & Strebulaev, "How Do
    Venture Capitalists Make Decisions?", NBER Working Paper 22587, 2016, section 3.2: "One in four opportunities
    lead to meeting the management; one-third of those are reviewed at a partners meeting"); the duration
    is not.; quiet means: The investor is deciding whether to spend more time, and most do not: at a venture
    firm about one company in three whose management the firm meets is reviewed at a partners'' meeting
    (Gompers et al.). After a first call that ended without a named next step, silence is usually a soft
    no; after one that named a step and a date, it is the firm''s process until that date passes.; leaves
    when: A partners'' meeting or a second meeting with a decision-maker is booked, diligence material
    is requested, or the investor passes.'
  fingerprint: b7f1aeb769ba9363
