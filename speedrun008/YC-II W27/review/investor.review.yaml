    the VC partnership", cdixon.org, 27 August 2009: the partnership meets weekly ("their weekly monday
    meeting"), and the prior is one such cycle — the cycle is sourced, the seven days are that cycle.;
    quiet means: A partnership decides in its weekly cycle, so silence more than a week after the meeting
    usually means no — and the no "will rarely come in the form of an actual ''no''" (Dixon). About half
