- id: L138
  artifact: founder_office.sit.live_investor_contact
  field: description
  text: 'A named individual at an investor — a partner, a principal, an associate, an angel — read at
    the PERSON level: where their conviction stands, what they last asked for, and whose move it is. The
    counterparty here is not an organisation deciding; it is a person who has to take the case to a partnership
    or an investment committee, and their engagement is the only reliable signal available before a decision
    exists. It is emphatically not a prospect relationship. Nobody is buying, there is no value to prove
    and no close to drive toward; the currency is conviction and the sequence is theirs. The failure this
    file exists to prevent is treating an associate''s silence as a signal about the fund. Associates
    go quiet because they are gathering internal support, because the partner meeting is next week, or
    because the answer is no and nobody has said so — three readings with three different next moves,
    and only the correspondence and the stage distinguish them. An associate has no decision-making power
    of their own (Paul Graham, "How to Raise Money", note 5).'
  fingerprint: 33a0641726091eb2
  decision: ''
  note: ''
- id: L139
  artifact: founder_office.sit.live_investor_contact
  field: do_nothing_consequence
  text: The person who would have carried the case inside the fund loses the thread, and the conviction
    built so far decays without anyone ever saying no.
  fingerprint: a26d16e00416fb18
  decision: ''
  note: ''
- id: L140
  artifact: founder_office.sit.live_investor_relationship
  field: description
  text: 'An ongoing relationship with a party that might fund the company, read at the ACCOUNT level:
    the fund, the angel network, the syndicate — not the individual partner. Layer 2 types it `fundraising`,
    which the Founder Office now serves. It is emphatically NOT an opportunity. There is no purchase,
    no value to prove, no close date the founder controls, and a "no" is usually a "not now" carrying
    a condition. Read through a pipeline it produces closed-lost language about a fund that explicitly
    invited a return next round. An accelerator or a programme that reaches this situation is a misfile:
    its clock is a cohort''s, and it belongs to the programmes capability.'
  fingerprint: 954fea37bdee5ef8
