    than a signal: funded seed founders in DocSend''s 2019 sample contacted 77 investors on average and
    held 40 meetings, so a large share of first emails never become a meeting. After a warm introduction,
    silence means the investor has not opted in; ask the connector, not the investor.; leaves when: A
