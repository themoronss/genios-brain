    # NOTHING WRITES THESE. They are here rather than in `substrate` for exactly the reason the
    # census exists: `reason/baselines.py` writes one account-level rate, and the six patterns
    # below were asking that one name for three other numbers. A share is not a rate, a person is
    # not an account, and a count of callers is neither. Sharing one name made the backlog claim
    # eleven patterns unblocked when two were.
    #
    # Each name states its ANCHOR and its UNIT, because the anchor and the unit are the two things
    # the old name left to the reader to guess:
    - derived.person_contact_rate     # contacts/week from ONE person. Same unit as
                                      #   derived.contact_frequency, different denominator
                                      #   population — an individual, not the company they
                                      #   work at. Wanted by req.repeat_contact_inside_a_week,
                                      #   cs.sent.reopened_or_repeat_contact,
                                      #   esc.the_diagnosis_restarted,
                                      #   contact.is_a_proxy_for_someone_else.
    - derived.person_inbound_share    # basis points of an ACCOUNT's inbound attributable to one
                                      #   person. Dimensionless proportion, so it can never be
                                      #   compared against the contact_rate_per_account baseline
                                      #   the way a rate can. Already named inside the corpus as
                                      #   named_contact.inbound_share, from which
                                      #   customer_account.contact_concentration is computed.
                                      #   Wanted by account.the_relationship_is_one_person_deep.
    - derived.account_distinct_contacts  # how many distinct individuals contacted us from one
                                      #   account inside the window. An integer count: it is what
                                      #   a named-caller allowance is compared against, and
                                      #   neither a rate nor a share can produce it. Wanted by
