# Domain Expertise — the closed vocabulary
#
# This file is the contract between AUTHORED expertise and the RUNNING engine.
#
# Everything under `closed:` is enforced by _tools/validate.py as an ERROR. Everything under
# `open:` is enforced as a WARNING — author outside it freely, but you will be told, so the
# list stays a real census rather than a wish.
#
# The predicate grammar and the substrate below are transcribed from the live engine, not
# invented here. If they drift, the authored brain silently stops firing. Sources:
#   genios_engine/reason/engine.py       _eval_condition / _cmp / _resolve_value
#   genios_engine/packs/sales_v1.py      schema.fields · schema.signal_vocab
#   genios_engine/packs/general_v1.py    schema.fields · schema.signal_vocab

version: 1.0.0
transcribed_from_engine_at: "2026-08-08"

# ─────────────────────────────────────────────────────────────────────────────
# CLOSED — validator errors on anything outside these sets
# ─────────────────────────────────────────────────────────────────────────────
closed:

  # The comparison operators _cmp() understands. Note IN is UPPERCASE: engine.py:71 tests
  # `op == "IN"`, so a lowercase `in` falls through to the numeric branch and silently
  # evaluates False forever. That is the single easiest way to author a dead pattern.
  predicate_ops: ["=", "!=", "IN", ">", ">=", "<", "<="]

  # The ten predicate forms _eval_condition() dispatches on, in its own dispatch order.
  # A dict that matches none of them returns False — it does not raise.
  predicate_forms:
    - form: "{exists: <path>}"
      reads: "the fact path is present on this node"
    - form: "{absent: <path>}"
      reads: "the fact path is not present on this node"
    - form: "{has_obs: <obs_kind>}"
      reads: "this node carries at least one observation of that kind"
    - form: "{no_obs: <obs_kind>}"
      reads: "this node carries no observation of that kind"
    - form: "{neighbor_has_obs: <obs_kind>}"
      reads: "some 1-hop neighbour carries that observation kind"
    - form: "{neighbor_no_obs: <obs_kind>}"
      reads: "no 1-hop neighbour carries that observation kind"
    - form: "{neighbor_fact: <path>, op: <op>, value: <v>}"
      reads: "latest value of that fact across neighbours compares true"
    - form: "{fn: edge_count, op: <op>, value: <v>}"
      reads: "graph degree of this node compares true"
    - form: "{fn: days_since | hours_since, path: <path>, op: <op>, value: <v>}"
      reads: "time elapsed since that timestamp fact compares true"
    - form: "{path: <path>, op: <op>, value: <v>}"
      reads: "the typed fact compares true"

  # A threshold is a literal, or baseline-derived. _resolve_value() computes
  # max(floor, mult · baseline); a cold-start baseline falls back to floor.
  value_forms:
    - "<literal>"
    - "{baseline: <baseline_name>, mult: <number>, floor: <number>}"

  # Object property types the compiler can emit.
  property_types: [string, integer, number, boolean, enum, timestamp, duration, money, ref, list]

  # Authoring lifecycle of a file. `stable` is the only state the compiler will emit.
  status_values: [draft, review, stable, deprecated]

  # Where an object or knowledge artifact lives, decided by the reference graph rather than
  # by intent.
  #   core       referenced by MORE THAN ONE capability  -> <kind>/core/
  #   capability referenced by EXACTLY ONE               -> <kind>/<capability>/
  # validate.py enforces both directions for objects AND artifacts; see domain.yaml.
  object_scopes: [core, capability]

  # The five Atlas knowledge types that are not objects, their folder, and their id prefix.
  # One schema (artifact.schema.json) discriminated by `kind`; the folder is checked against
  # it so a heuristic cannot quietly sit in playbooks/.
  artifact_kinds:
    - {kind: playbook,           dir: playbooks,           prefix: pb}
    - {kind: heuristic,          dir: heuristics,          prefix: heu}
    - {kind: mental_model,       dir: mental-models,       prefix: mm}
    - {kind: rule,               dir: rules,               prefix: rule}
    - {kind: decision_framework, dir: decision-frameworks, prefix: df}

  # An object attribute is one of four shapes. `composite` groups others and carries no data;
  # the rest hold or point at data. This replaced the old Components/Properties pair, where
  # every real field appeared in both lists and the two copies disagreed within a week.
  attribute_types: [composite, value, derived, reference]

  # Whether an inference pattern can run today. `executable` means every path and obs kind
  # it names exists in `substrate` below. `needs_signal` means it cannot fire yet and is
  # reported by _tools/backlog.py as a requirement on Layers 1 and 2.
  pattern_status: [executable, needs_signal]

  pattern_kinds: [deterministic, heuristic]

  # Every score is an integer basis point, 0–10000. Atlas Rule 03 + packs/snapshot.py:
  # floats do not hash reproducibly across machines, so a threshold met on one worker is
  # missed on another. Any field ending _bp is validated to this range.
  score_range_bp: {min: 0, max: 10000}

  layers: [L0, L1, L2, L3, L4, L5, "L5.2", L6]

# ─────────────────────────────────────────────────────────────────────────────
# SUBSTRATE — what the engine can actually evaluate TODAY
#
# This is the honest floor. An inference pattern that names anything outside this section
# is marked `status: needs_signal` and becomes a Layer 1/2 backlog item rather than dead
# authoring. Grow these lists only when the pipeline genuinely emits the thing.
# ─────────────────────────────────────────────────────────────────────────────
substrate:

  # Typed fact paths the reasoner can read off a node.
  #
  # PROVENANCE, checked against the code rather than remembered (2026-08-26). Three producers,
  # and the union of them is this list:
  #   1. `context/extract/vocab.py::ENGINE_FIELDS` — what the engine requires of every tenant
  #      regardless of pack, so a pack may add to it and may not remove it.
  #   2. `packs/sales_v1.py` and `packs/general_v1.py` `schema.fields` — what each shipped pack
  #      declares and its rules read.
  #   3. Three fields the L2 pipeline writes directly and no pack declares — named below.
  #
  # This list used to hold twelve, which understated the substrate by eleven and forced honest
  # patterns about meetings, correspondence direction and counterparty role to be marked
  # `needs_signal` when they can in fact fire today. The check that matters is not "is it in a
  # pack manifest" but "does anything WRITE it and can a predicate READ it": `reason/runner.py`
  # `_load_context` selects every active fact on the node with no field filter, and
  # `context/situation_bso.py` `build_context_slice` passes them through unfiltered, so any field
  # Layer 2 writes is evaluable by the predicate grammar.
  #
  # What is deliberately NOT here: the L1 structured-connector fields (`deal.stage`,
  # `deal.amount`, `meeting.title`, `meeting.location`, ... in `capture/structured/registry.py`).
  # Those exist only for a tenant who has connected that source, so a pattern resting on one is
  # true for some tenants and silently dead for the rest — which is what `needs_signal` is for.
  fact_paths:
    # ── the WAITING substrate, written by `context/waiting.py` ────────────────
    #
    # The only facts in the system derived from what did NOT happen. Every other family here
    # records an event; a source system never emits "they have not replied", so these are
    # arithmetic against a clock over the message timeline `graph_source_refs` reconstructs.
    # Without them a situation about silence could state nothing about the silence.
    - thread.days_waiting          # days since our last message, while the last word is ours
    - thread.follow_up_count       # how many times we have chased since they last wrote
    - thread.last_heard_days       # days since anything inbound
    - thread.response_expected     # true when we actually put a question to them
    - party.reply_cadence_days     # THEIR median reply latency — needs >= 2 replies to exist
    # The same five, projected onto the `outreach` anchor `context/outreach_situations.py`
    # mints, so a situation about waiting carries them on its own subject rather than one hop
    # away. `outreach.objective` is deliberately NOT here — see planned_substrate.
    - outreach.days_waiting
    - outreach.follow_up_count
    - outreach.days_since_last_heard
    - outreach.their_normal_reply_days
    - outreach.response_expected
    - outreach.counterparty
    - outreach.counterparty_role
    # WHY WE WROTE — moved here from planned_substrate the day `pipeline.objective_of` gave it a
    # writer. `relationship.nature` distinguishes an investor from a vendor; this distinguishes an
    # investor we are RAISING FROM (`fundraising`) from one we merely OWE A REPORT
    # (`investor_update`) — same person, same nature, opposite follow-ups.
    #
    # Written ONLY on the outbound leg (the objective is ours) and ONLY when the extractor could
    # place the message: `unknown` is never stored, so an unplaced thread keeps the field in the
    # situation's `missing` list rather than satisfying it with a word that means nothing.
    - thread.objective
    - outreach.objective
    # The `commitment` anchor's own fields. `commitment.delivered_at` is NOT here and cannot be:
    # nothing reports that a promise was kept.
    - commitment.days_overdue
    - commitment.owed_to
    # ── the CAMPAIGN, on the `cohort` anchor ─────────────────────────────────
    #
    # The first family here describing a GROUP. Everything above is about one thing, so "of
    # everyone I contacted about the raise, who has gone quiet?" could only be answered by
    # reading N rows and doing the arithmetic by hand.
    #
    # `awaiting_beyond_normal` is a COMPARATIVE count — measured against each person's own reply
    # cadence, falling back to the cohort's median where an individual has too little history,
    # never against a fixed number of days. `cohort.target` is absent and belongs in
    # planned_substrate: a reply rate has no meaning without a denominator of intent.
    - cohort.objective
    - cohort.contacted
    - cohort.replied
    - cohort.awaiting
    - cohort.awaiting_beyond_normal
    - cohort.never_chased
    - cohort.chased_twice_plus
    - cohort.reply_rate_bp
    - cohort.chaseable
    - cohort.cadence_known
    - cohort.median_reply_days
    - cohort.waiting_longest
    - cohort.organizations
    - cohort.organization_count
    # Period aggregates, written onto the tenant node by `context/periodic.py`. Computed, never
    # extracted — they are not in any pack's `schema.fields` for the same reason `derived.*` is
    # stripped from the extraction prompt.
    - period.open_deals
    - period.events_this_window
    - period.events_prev_window
    - period.counterparties_awaiting_us
    - period.commitments_open
    - period.commitments_overdue
    - period.active_situations
    # ── deal (sales_v1) ────────────────────────────────────────────────────────
    - deal.status
    - deal.last_inbound
    - deal.value              # declared, and absent in practice — never derived, see below
    # ── correspondence (ENGINE_FIELDS; both packs read them) ───────────────────
    - thread.last_inbound
    - thread.last_outbound    # the other half of the pair; attention.py already reads it
    - thread.ball_in_court
    # ── commitment (ENGINE_FIELDS + general_v1) ────────────────────────────────
    - commitment.due_at
    - commitment.action
    - commitment.text         # pipeline.py writes it beside due_at; `action` is the reader's name
    - commitment.status       # pipeline.py writes 'open' with due_at. Undeclared by any pack
    # ── meeting (general_v1) ───────────────────────────────────────────────────
    - meeting.status
    - meeting.start_at
    - meeting.end_at
    - meeting.scheduled
    - meeting.occurred
    - meeting.attended
    - meeting.external_counterparty
    - meeting.open_loop       # meeting_lifecycle.py: it ended with something unresolved
    # ── the lens: what the counterparty IS to us (sales_v1) ────────────────────
    - relationship.nature
    - relationship.direction
    - party.role              # pipeline.py writes it; card_builder reads it. No pack declares it
    - role                    # legacy flat names, still written and still read. Superseded by
    - company                 #   party.role / the works_at edge, not yet removed
    # ── engine-computed (never extracted; context/derived.py) ──────────────────
    - derived.momentum        # engine-computed trajectory
    - derived.engagement      # engine-computed two-way volume vs prior fortnight
    - derived.sentiment       # engine-computed observation balance
    # ACCOUNT-LEVEL CONTACT RATE, and nothing else. reason/baselines.py rolls each company's
    # people up through the works_at edge and writes contacts/week over the recent window.
    # Paired with the contact_rate_per_account baseline below — a rate is not evidence without
    # its own norm.
    #
    # THE NAME USED TO COVER FOUR MEASUREMENTS AND SHIP ONE. Eleven authored patterns named
    # `derived.contact_frequency`; only five of them wanted this account rate. Four wanted a
    # PERSON's contact rate, one wanted a person's SHARE of an account's inbound, and one wanted
    # a COUNT of distinct callers. backlog.py therefore reported this signal as "unblocks 11"
    # and shipping the writer unblocked 2 — the count was of a name, not of a measurement. The
    # other three now have their own names in planned_substrate.fact_paths below, unwritten,
    # which is the only place a name with no writer belongs. Do not attach a pattern to this
    # entry unless the thing it counts is an ACCOUNT's contacts per week.
    #
    # AND THE WRITER REACHED NOTHING UNTIL 2026-08-30. Having a writer is not the same as having
    # a measurement, which is the one thing this list is supposed to distinguish.
    # `baselines._account_rows` filtered `node_type='company'` on the edge's FROM side, while
    # `pipeline.py::_works_at` writes PERSON -> COMPANY — so it matched only `owns`
    # (company -> deal) edges, looked up a deal id in a person-keyed map, and wrote a contact
    # rate for zero accounts. Measured read-only on the design partner's org that morning:
    # `baselines` held 387 rows — 129 people x 3 person-level metrics — and not one
    # `contact_frequency` row, from a build that had run ten minutes earlier. The hermetic test
    # covering it used a fake connection that returns its edge list whatever SQL it is handed.
    # With the direction fixed the same org yields 37 accounts, 27 of them with real history.
    - derived.contact_frequency
    # ── the seven correspondence readings (context/support_situations.py) ──────
    #
    # Computed, never extracted, and deliberately NOT named `ticket.*` / `sla.*` / `ticket.queue`
    # even where the build note asked for them. This tenant has no helpdesk: there is no ticket,
    # no queue and no SLA object, so a fact path asserting one would be a fabricated record wearing
    # the corpus's vocabulary. `response.*` is a clock computed from message timestamps against a
    # policy the tenant STATED, `backlog.*` is one unmet ask from the open-loop ledger, `mailbox.*`
    # is one connected mailbox and not a routing decision. The `ticket.*`/`sla.*`/`entitlement.*`
    # families stay in planned_substrate, unwritten, which is what keeps the difference visible.
    #
    # first_response_overdue — the clock, and where it came from
    - response.opened_at
    - response.target_at
    - response.target_source     # tenant_policy | engine_default. NEVER entitlement: no
                                 #   per-customer target exists anywhere in this system.
    - response.channel
    - response.overdue_hours
    # ticket_aging — one unmet ask, with the two clocks kept apart
    - backlog.opened_at
    - backlog.age_days
    - backlog.days_since_customer    # separate from age on purpose: an old item being worked and
    - backlog.days_since_we_touched  #   an old item nobody has touched share an age, not a finding
    - backlog.waiting_on
    - backlog.open_asks
    - backlog.ask_repeats
    - backlog.age_percentile_bp
    # escalation_requested — the raise, and the acceptance that has not happened
    - escalation.requested_at
    - escalation.origin
    - escalation.ask_text
    - escalation.thread_id
    - escalation.account_node_id
    - escalation.requester_node_id
    - escalation.receiver_named
    - escalation.status
    # repeat_contact — the ordinal is a FLOOR, never an exact count
    - repeat.intent
    - repeat.ordinal
    - repeat.window_days
    - repeat.first_contact_at
    - repeat.latest_contact_at
    - repeat.prior_answered
    # knowledge_gap — volume and answer stability. `published_answer_seen` is deliberately absent
    #   from this list: nothing writes it, and it is the corpus's real discriminator between
    #   "write the article" and "fix findability".
    - knowledge.intent
    - knowledge.distinct_askers
    - knowledge.distinct_accounts
    - knowledge.asks_this_window
    - knowledge.asks_prev_window
    - knowledge.answered_count
    - knowledge.answer_reuse_bp
    - knowledge.first_asked_at
    - knowledge.last_asked_at
    # queue_overloaded — one connected mailbox. The ratios are PRECOMPUTED because the predicate
    #   grammar above compares a path to a LITERAL and has no fact-to-fact form, so Layer 4 cannot
    #   divide two of these. If Layer 2 does not materialise them, no rule can express them.
    - mailbox.loops_opened
    - mailbox.loops_opened_prev
    - mailbox.loops_closed
    - mailbox.loops_closed_prev
    - mailbox.loops_open_now
    - mailbox.loops_open_prev
    - mailbox.loops_reopened
    - mailbox.loops_opened_baseline
    - mailbox.backlog_oldest_days
    - mailbox.backlog_age_p50_days
    - mailbox.backlog_age_p90_days
    - mailbox.backlog_over_14d
    - mailbox.threads_awaiting_us
    - mailbox.threads_awaiting_us_oldest_days
    - mailbox.flow_ratio
    - mailbox.arrival_vs_baseline
    - mailbox.backlog_delta
    - mailbox.reply_turnaround_days   # named for what it measures: a loop closes on OUR reply,
                                      #   so this is time-to-reply and not time-to-resolution
    # workaround_only — `workaround.cost` is written only when the wording is unambiguous, so an
    #   absent value means "we could not tell" rather than "one-off"
    - workaround.provided_at
    - workaround.description
    - workaround.cost
    - workaround.days_open
    - workaround.quiet_since
    # ── the file's own record of itself (context/documents.py) ────────────────
    #
    # Projected at authority rank 3 from the metadata `capture/connectors/drive.py` was already
    # fetching and discarding. `document.approved_at`, `document.review_due_at`,
    # `document.classification` and `document.retention_until` stay in planned_substrate below and
    # are NOT moved up with these: none is a file-store concept, none has a writer, and inferring
    # any of them from a modification history is the one thing the situation file forbids by name.
    # That split is what keeps `missing` truthful on every records row — an artefact reports
    # "approval state unknown", never "unapproved".
    - document.id
    - document.title
    - document.version          # a file-store REVISION COUNTER, not a semantic version: v3 of the
                                #   security policy is not `version: 3`
    - document.modified_at
    - document.created_at
    - document.owner_email
    - document.last_modified_by  # very often NOT the owner; the two are kept apart deliberately
    - document.mime
    - document.location
    - document.shared
    - document.content_hash      # over the PII-masked text, which is the only form L2 ever sees
    # Copy clustering (context/document_register.py) — the derived half of the corpus's
    # `derived.document_identity_cluster` ask. It answers "two live copies of this exist" and
    # deliberately not "the wrong version is in circulation": supersession has no emitter here, so
    # a correctly withdrawn v1 and two teams editing in parallel are the same picture.
    - derived.document_cluster_key
    - derived.document_live_copies

  # Observation kinds Layer 2 emits.
  #
  # GENERATED FROM `genios_engine/context/vocabulary.py::CANONICAL_OBS_KINDS`, which is the
  # complete set the extractor is offered — `extract/vocab.py::observation_vocabulary` unions the
  # tenant's rule-referenced kinds WITH the canonical set and never restricts to them, precisely
  # so the kinds carrying the most intent keep being captured before a rule exists to read them.
  #
  # This list held eighteen of the thirty-four. The sixteen it omitted are not theoretical: on the
  # design partner's org today `positive_reply` (57), `negative_reply` (8), `meeting_request`
  # (128), `question` (65), `next_step_agreed` (17) and `objection_timing` (2) are all present in
  # `graph_observations` — while every one of `budget_approved`, `budget_freeze`,
  # `champion_change`, `contract_requested`, `discount_pressure`, `objection_price`,
  # `legal_review` and `verbal_yes` on the old list has zero rows. The old list was a sales-deal
  # ontology, and it made the honest expertise about correspondence, meetings and administrative
  # obligation unauthorable — the very domains a non-sales tenant lives in.
  obs_kinds:
    # positive (OBS_POSITIVE)
    - budget_approved
    - buying_intent
    - champion_engaged
    - contract_requested
    - demo_requested
    - next_step_agreed
    - positive_reply
    - pricing_discussed
    - security_review_started
    - stakeholder_added
    - verbal_yes
    # negative (OBS_NEGATIVE)
    - budget_freeze
    - champion_change
    - churn_risk
    - closed_lost_mention
    - competitor
    - discount_pressure
    - going_dark
    - negative_reply
    - objection
    - objection_authority
    - objection_integration
    - objection_price
    - objection_security
    - objection_timing
    - price_pushback
    - stakeholder_left
    - timeline_slip
    # neutral (OBS_NEUTRAL) — no polarity, high intent
    - followup_sent
    - introduction
    - legal_review
    - meeting_request
    - proposal_sent
    - question
    # ── admin / fundraising ───────────────────────────────────────────────────
    # Added with the extraction prompt that asks for them. Until they existed the whole kind
    # vocabulary was a sales pipeline, so an approval, an invoice and a fund passing were read
    # through buying words or not read at all — and `pass_received` in particular had to be its
    # own kind, because filing a reversible investor pass as `closed_lost_mention` is what
    # produced "Save the deal now" on a fundraising rejection.
    - approval_blocked
    - approval_granted
    - approval_requested
    - deadline_stated
    - decision_deferred
    - diligence_started
    - document_sent
    - information_requested
    - intro_made
    - intro_requested
    - investor_update_sent
    - invoice_sent
    - meeting_cancelled
    - meeting_scheduled
    - pass_received
    - payment_confirmed
    - payment_overdue

  # Learned per-entity baselines available to {baseline: ...} thresholds.
  baselines:
    - reply_cadence
    - contact_rate_per_account   # per-company contacts/week over the 56d window (reason/baselines.py)

  # Layer 2 situation types a situation file may bind to via `matches.l2_situation_types`.
  # Union of both packs' schema.signal_vocab. A situation naming a type outside this list
  # can never be looked up at runtime — validate.py errors.
  # Layer 2 situation types a situation file may bind to via `matches.l2_situation_types`.
  #
  # GENERATED FROM `genios_engine/context/domain_spec.py` — the ONLY producer of the value the
  # compiler looks up (`capability_resolver` does `domain.routes.get(situation.type)`).
  #
  # This list used to be the union of both packs' `schema.signal_vocab` — Layer 3 SIGNAL REASON
  # CODES, which Layer 2 never emits. Validating against it meant "0 errors, 715 warnings"
  # certified nothing about whether a single route could ever be reached, and live compilation
  # returned NoExpertiseRoute for 73 of 73 situations. A vocabulary check is only worth running
  # against the substrate that actually produces the value.
  l2_situation_types:
    - channel_touch             # sales, anchored on a MEETING with an external party.
                                #   `context/meeting_touch.py`. Serves `demo` only —
                                #   calls and LinkedIn are in planned, still unwritten.
    - deal                      # sales, anchored on a deal
    - opportunity               # sales, anchored on a company
    - prospect_relationship     # sales, anchored on a person
    - support_case              # support, anchored on a company
    - support_contact           # support, anchored on a person
    - account_admin             # admin, anchored on a company
    - admin_contact             # admin, anchored on a person. Added with the `domain_spec` entry
                                #   that produces it: only `company` was described, so a
                                #   person-anchored admin situation fell to the generic
                                #   `<domain>_<anchor>` default (`admin_person`) and no situation
                                #   file could claim it.
    - investor_relationship     # fundraising, anchored on a company
    - investor_contact          # fundraising, anchored on a person
    - relationship              # general, anchored on a company or a person
    # The three PERIOD types, anchored on the tenant node `context/periodic.py` mints. They are
    # substrate rather than planned because the aggregates they carry are computed from facts that
    # already exist — no connector is involved. Twenty-two capabilities were waiting on them.
    - pipeline_period_review    # sales, anchored on the tenant, one window
    - admin_period_review       # admin, anchored on the tenant, one window
    - support_period_review     # support, anchored on the tenant, one window
    # The three STATE readings — the first situation types in this list named after what is
    # HAPPENING rather than who it is about. Every type above answers WHO (a person, a company, a
    # deal, a window), which is why a capability written for "we wrote and nobody answered" had
    # nothing to bind to and every waiting relationship in an org reached the same person-shaped
    # lane and produced the same card.
    #
    # All three are declared on ADMIN alone in `domain_spec.py`: the readers mint one situation
    # per claiming domain, so a second claimant would mean two situations, two compiles and two
    # cards for one silence.
    - cohort_outreach_gap       # admin, anchored on the `cohort` node — one per stated
                                #   OBJECTIVE, not per organisation: two partners at two firms
                                #   are one raise, while a fundraising thread and a vendor
                                #   thread with the same firm are two different things.
    - awaiting_response         # admin, anchored on the `outreach` node
                                #   `context/outreach_situations.py` mints per waiting
                                #   counterparty
    - commitment_overdue        # admin, anchored on the `commitment` node — a promise of OURS
                                #   whose own stated date has passed. The mirror of support's
                                #   `ticket_aging`, which is an unmet ask of THEIRS.
    - meeting_follow_through    # admin, anchored on the same `meeting` node sales reads as
                                #   `channel_touch`. Same evidence, different question: sales
                                #   asks what channel this was, admin asks whether the
                                #   follow-through happened.
    # The seven CORRESPONDENCE readings, minted by `context/support_situations.py`. They are
    # substrate rather than planned because nothing new had to be connected: a mailbox already
    # carries the shape of a service desk — a request arrives, somebody replies or does not, the
    # same person comes back about the same thing, a customer asks for a manager, we hand out a
    # workaround and go quiet.
    #
    # Every one is an APPROXIMATION and none of them may be read as a record. There is no ticket,
    # no queue, no assignee and no SLA on this tenant, so each situation caps its `coverage` and
    # names what it cannot see in `missing` on every row — entitlement, holidays, other channels,
    # resolution as distinct from reply, help-centre telemetry. The families those would need
    # (`ticket.*`, `sla.*`, `entitlement.*`, `csat.*`) stay unwritten in planned_substrate
    # deliberately: the gap between an inference and a record has to stay visible, because the
    # failure this whole section exists to prevent is a card labelled "SLA Breach Imminent" on an
    # org that has no SLAs.
    #
    # Each declares its OWN anchor node type in `domain_spec`, because `type_for` maps one anchor
    # to one type. That constraint matched what the corpus already asked for: per-item aging
    # "needs the item to be a first-class subject" (queue-overloaded.yaml) and a content gap
    # "belongs to an INTENT" rather than to the person who reported it (repeat-contact.yaml).
    - first_response_overdue    # support, anchored on the thread the request arrived in
    - ticket_aging              # support, anchored on one unmet ask (`backlog_item`)
    - escalation_requested      # support, anchored on the raise (`escalation`)
    - repeat_contact            # support, anchored on one person and one topic (`contact_intent`)
    - knowledge_gap             # support, anchored on the topic itself (`topic`)
    - queue_overloaded          # support, anchored on one connected mailbox (`mailbox`)
    - workaround_only           # support, anchored on the workaround a customer lives on
    # The RECORDS reading, minted by `context/document_register.py` on a `document` node that
    # `context/documents.py` projects from file-store metadata. Substrate rather than planned
    # because nothing new had to be connected: `capture/connectors/drive.py` already listed every
    # file, downloaded it and extracted its text, and simply threw the id, the revision counter,
    # the modification stamp and the owner away — so `document.*` had no writer while the data was
    # arriving in the same response as the body.
    #
    # It mints one situation per GAP and never one per file, which is the situation file's own
    # render hint ("the headline is the gap, not the document"): a Drive of four hundred files
    # would otherwise produce four hundred cards saying a document exists.
    #
    # Two of the four failures this subdomain exists to catch do NOT survive the approximation and
    # must not be papered over. Missing approval cannot be read from a file store at all, and
    # retention needs a schedule the tenant has never stated — so `retention_and_archival` gets a
    # route and an empty hand, and both are named in `missing` on every row.
    - document_under_control    # admin, anchored on one file (`document`)
# ─────────────────────────────────────────────────────────────────────────────
# PLANNED SUBSTRATE — asked for by authored expertise, emitted by nothing yet.
#
# `substrate` above is what the engine can evaluate TODAY. This section is what the authored
# brain has asked it to evaluate and it cannot. Nothing here is executable, and putting a name
# here does not make it so — it makes the ask countable.
#
# It exists because the Sales brain was authored against packs that already shipped, and the
# Customer Support brain was not. Support has no pack: of the 26 L2 situation types above,
# exactly five are domain-neutral (commitment_overdue, unanswered_email, champion_quiet,
# meeting_no_followup, intro_followup) and ZERO observation kinds are support-native. A support
# brain restricted to those five would be a sales brain wearing a support hat.
#
# So a situation whose real trigger does not exist declares it under
# `matches.pending_l2_situation_types`, exactly as an inference pattern declares
# `status: needs_signal`. The rule is the same in both places and it is the rule the whole
# library turns on: AUTHOR THE TRUTH, MARK WHAT CANNOT FIRE. The alternative — binding
# "SLA breach imminent" to `unanswered_email` because it is the closest thing available — is
# the failure this section prevents, and it is worse than a gap because it looks like coverage.
#
# A name moves from here into `substrate` in the same commit that ships the pack emitting it.
# validate.py WARNS (never errors) when a pending type is absent here, so the list stays a
# real census rather than a wish; it ERRORS when a pending type is already in `substrate`,
# because that one belongs in `l2_situation_types` and is silently routing nothing.
planned_substrate:

  # Would be shipped by a support_v1 pack's schema.signal_vocab.
  l2_situation_types:
    # Named by an authored situation but missing from this census until 2026-08-29, so
    # `touch-outside-mail.yaml` carried two asks that validate.py could only report as warnings
    # and backlog.py could not count at all. Both are confirmed BLOCKED on a source the tenant has
    # not connected — `channel_touch` on a dialler / LinkedIn / meeting-recorder, and
    # `market_period_review` on external market data no SaaS in the stack contains. Listing them
    # is the point: the census records what is asked for, and an ask nobody records is an ask
    # nobody is tracking.
    - channel_touch
    - market_period_review
    - sla_breach_imminent
    - sla_breached
    - ticket_reopened
    - major_incident_declared
    - incident_unresolved
    - csat_detractor
    - entitlement_expired
    - entitlement_mismatch
    - deflection_failed
    - bug_awaiting_engineering
    - churn_risk_from_support
    - coverage_gap
