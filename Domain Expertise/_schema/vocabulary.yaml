# ─────────────────────────────────────────────────────────────────────────────
# OPEN — validator warns, does not error. Extend by editing this file in the same
# commit that first uses the new term, so the warning stays meaningful.
# ─────────────────────────────────────────────────────────────────────────────
open:

  # Typed edges between objects. Read as: <subject> <verb> <target>.
  relationship_verbs:
    - owns
    - belongs_to
    - member_of
    - works_with
    - reports_to
    - approves
    - blocks
    - influences
    - requires
    - produces
    - attaches_to
    - competes_with
    - references
    - precedes
    - supersedes
    - gates
    # added by Customer Support — an edge set built only for a pipeline motion cannot express
    # a resolution motion, where the load-bearing relations are causal and custodial.
    - resolves
    - caused_by
    - escalates_to
    - assigned_to
    - covers
    - documents
    - deflects
    - merges_into
    - measures
    # added by Admin — an administrative graph is custodial and evidential rather than
    # causal. `owns` cannot express "Priya is the named custodian of this laptop until she
    # returns it", and losing that distinction is how an asset register becomes a list.
    - custodian_of
    - issued_to
    - governed_by
    - evidences
    - renews
    - allocated_to
    - files_with
    - delegates_to

  # Recommended lifecycle states. An object declares its own subset in `states.values`.
  object_states:
    - unknown
    - identified
    - contacted
    - engaged
    - qualified
    - active
    - at_risk
    - dormant
    - inactive
    - disqualified
    - closed
    # added by Customer Support. `waiting_on_customer` is not a flavour of `dormant`: the SLA
    # clock is paused in one and running in the other, and collapsing them is how a queue
    # reports health it does not have.
    - new
    - open
    - triaged
    - in_progress
    - waiting_on_customer
    - waiting_on_engineering
    - escalated
    - breached
    - resolved
    - verified
    - reopened
    - archived
    # added by Admin. `pending_approval` is not `waiting_on_customer` and not `blocked`: the
    # obligation clock keeps running, a named person owes an answer, and the queue reports
    # health it does not have if the three are collapsed. `expired` and `revoked` are likewise
    # different endings — one lapsed, one was taken away, and Layer 6 learns opposite lessons.
    - draft
    - submitted
    - pending_approval
    - approved
    - rejected
    - published
    - superseded
    - issued
    - returned
    - overdue
    - expired
    - revoked
    - retained
    - disposed
    - cancelled
    - on_hold

  # Where evidence for a claim comes from. Feeds `evidence[].source`.
  evidence_sources:
    - email
    - calendar
    - meeting_transcript
    - call_recording
    - crm
    - slack
    - document
    - contract
    - website
    - manual_entry
    - derived
    # added by Customer Support
    - ticket
    - chat
    - phone
    - help_center
    - knowledge_base
    - survey
    - status_page
    - telemetry
    # added by Admin — the systems of record an administrative claim is proven against.
    - erp
    - hris
    - payroll
    - portal
    - signed_form
    - register
    - access_log
    - regulator
    - attestation

  # Who consumes an object's outputs.
  consumers:
    - L4.reasoning_unit
    - L4.decision_maker
    - L5.execution_planning
    - L5.communication_planning
    - "L5.2.channel_planner"
    - L6.learning_unit
