  # Would be shipped by a support_v1 pack's schema.fields.
  fact_paths:
    # ── the two names the STATE readings need and cannot have ────────────────
    #
    # Each is the most load-bearing remaining gap in its own situation, and each is listed here
    # rather than quietly omitted so the gap is a tracked ask instead of a felt absence.
    #
    # `outreach.objective` LEFT this list on 2026-09-01 — it now has a writer and sits in
    # `substrate.fact_paths`. It is still absent on any thread the extractor could not place,
    # which is a different and honest state from having no producer at all.
    #
    # `cohort.target` — how many people we MEANT to reach. "5 of 18 replied" reads as a result
    # and is not one: 18 contacted against a target of 20 is a campaign nearly run, against 200 it
    # has barely started, and the same two numbers mean opposite things. Nothing holds a target,
    # so it stays in `missing` on every cohort row and no card may call a rate good or bad.
    - cohort.target
    # `commitment.delivered_at` — whether a promise was actually kept. No source system reports
    # it and none can be inferred: an outbound after a due date is not evidence the promised
    # thing was in it. So a card may say a promise is still showing as open and may never say it
    # was not delivered.
    - commitment.delivered_at
    # `meeting.recap_sent` — whether the follow-up after a meeting was a follow-up TO it. An
    # outbound within a day of a meeting is not a recap, and treating it as one would let the
    # system mark its own strongest finding resolved on unrelated mail.
    - meeting.recap_sent
