# Customer Support — on hold, with seven capabilities formally deferred `blocked_on_l2_type`. These
# cases assert that the deferral is STRUCTURAL, which is the claim `deferrals.yaml` makes and which
# nothing tested before this file.
domain: customer_support
cases:
  - id: support.deferred_capability.is_unreachable
    kind: deferral_is_structural
    capability: customer_support.diagnosis_and_resolution.root_cause_analysis
    expect: abstain
    reason: deferred
    why: >
      ⛔ `deferrals.yaml` claims a deferral is structural rather than a label — the capability appears
      in no route and any situation it owns is suppressed from the generated map. That is a claim
      about the GENERATOR, and until this case nothing checked it. A deferred capability that is
      still routable would mean unreviewed expertise reaching a reader through a door somebody
      believed they had closed.

  - id: support.every_deferred_capability.is_unreachable
    kind: deferral_is_structural_all
    expect: abstain
    reason: deferred
    why: >
      The same claim over all seven, so that an eighth deferral added later cannot be a label while
      the first seven are structural.

  - id: support.issue_under_diagnosis.abstains
    situation_type: issue_under_diagnosis
    domain_hints: [customer_support]
    expect: abstain
    reason: no_situation_binds_type
    why: >
      The type is in `planned_substrate` and emitted by nothing, and the situation that would bind it
      is owned by a deferred capability. Both halves must hold, and if either stops holding this
      capability becomes reachable without anybody deciding it should.
