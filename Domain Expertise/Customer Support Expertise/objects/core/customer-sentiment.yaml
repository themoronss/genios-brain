metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  completeness: complete
  notes: >
    All twenty-three sections populated. Fifty-three attributes across eight composites. Twenty-three
    inference patterns: THIRTEEN executable today, ten needs_signal. Eleven relationships, all carrying
    weight and confidence. Eight exceptions, eight anti-patterns, nine best practices, seventeen
    dependencies, seven preconditions.

    This is the strongest day-one object in the Customer Support brain by a wide margin, and the reason is
    structural rather than authorial: `derived.sentiment`, `derived.engagement`, `derived.momentum`,
    `thread.ball_in_court`, `thread.last_inbound`, `commitment.due_at`, `meeting.start_at`, four borrowed
    observation kinds and the `reply_cadence` baseline are all real, and between them they carry a genuine
    read. Only `commitment` is comparable and it has fewer independent instruments feeding it.

    The ten needs_signal entries are ranked in the order they should be built. First
    `derived.sentiment_by_author`, because it is a correctness fix rather than a feature: every executable
    confidence in this file is capped several hundred basis points below where it could sit purely because
    the engine cannot separate the customer's words from ours, and shipping it re-calibrates the whole object
    rather than adding to it. It would also populate `customer_message_share_bp` and, where the connector
    carries a sender identity, finally give `scope_level` something better than `thread_aggregate`. Second
    `derived.sentiment_trend`, because a level cannot express a trajectory and trajectory is what this object
    is for. Third `cancellation_threat`, because it is the moment support becomes a revenue question and it
    is stated in plain language in threads we already ingest. Everything after those three is additive.

    Three uncomfortable admissions this file makes deliberately rather than hides. One: a thread-scoped read
    cannot say WHICH person is unhappy, so almost every live read will carry `scope_level:
    thread_aggregate` and a null subject, and the preconditions degrade rather than pretend. Two: three
    executable patterns (`pushback_at_the_answer`, `audience_widening_on_our_ball`, `compensation_sought`)
    sit at or near 5000 and are authored as corroboration only — they are here because they are honestly what
    the substrate offers, not because they are good. Three: `leaving_language_proxy` binds a sales extractor
    (`closed_lost_mention`) to a support meaning, which is exactly the kind of nearest-available substitution
    the domain header warns against; it is admitted at 6000 with an explicit instruction to DELETE rather
    than tune it the day `cancellation_threat` ships, and that deletion is the test of whether the pack
    worked.
