# ─────────────────────────────────────────────────────────────────────────────
# Knowledge Article — a durable answer, written once, reachable without a human.
#
# This object exists to hold one uncomfortable idea: knowledge decays SILENTLY. Nothing
# breaks. No alarm fires. The article sits there being wrong, and the only trace it leaves
# is in tickets nobody connects back to it.
#
# Four consequences run through every section below.
#
#   1. An article nobody has reported as wrong is not therefore right. The absence of
#      complaints about documentation is the absence of evidence, not evidence. Most
#      customers who find a wrong answer do not file feedback — they file a ticket, or they
#      leave.
#   2. An article that is FOUND and then followed by a ticket anyway is worse than no
#      article. It spent the customer's patience before it cost us the contact, and the
#      agent now inherits someone who has already been let down once.
#   3. Freshness is not accuracy. A doc edited last week against last year's UI is fresh and
#      wrong. `last_edited_at` measures activity; only `last_verified_at` against a known
#      product version measures truth, and almost every knowledge base conflates them.
#   4. Coverage must be measured against what is ASKED, not against what exists. A hundred
#      articles covering ninety topics nobody asks about is zero coverage with a good
#      dashboard.
#
# Almost every pattern here is `needs_signal`, and that is the honest state of it. The
# signals being asked for — zero-result search queries, article views immediately preceding
# a contact, article-to-ticket conversion — are already generated by every help centre on
# the market and thrown away by almost all of them. They are cheap to instrument. The reason
# nobody instruments them is that each one can only produce bad news about work already
# done, which is exactly why they are the right things to measure.
# ─────────────────────────────────────────────────────────────────────────────
#
# MIGRATED to the 23-section object schema: description -> purpose.statement,
# components + properties -> attributes, relationships[].verb -> .type,
# yields.property -> yields.attribute. Prose carried across unchanged.

identity:
  id: customer_support.obj.core.knowledge_article
  scope: core
  name: Knowledge Article
  domain: customer_support
  subdomain: knowledge_and_deflection
  owner_capability: customer_support.knowledge_and_deflection.knowledge_authoring
  version: 1.0.0
  status: draft
  aliases:
  - KB Article
  - Help Center Article
  - Doc
  - Support Article
  - Solution Article
purpose:
  statement: A durable answer, written once, reachable without a human. Distinct from a Macro (which is
    an agent's shortcut, sent BY a person) and from a Resolution (which is what made one customer's problem
    stop). An article is a standing claim about how the product behaves, addressed to a stranger, and
    it keeps making that claim long after the product stopped behaving that way. Its value is not that
    it exists, is well written, or is recently edited — it is that a specific person with a specific question
    found it and did not then need us. Everything measurable about the first three is easy to collect
    and nearly worthless; the fourth is the only one that matters and is almost never instrumented.
attributes:
- name: coverage
  purpose: 'What question this claims to answer, in whose words. `intent_covered` is customer language
    on purpose — an article indexed under our vocabulary is invisible to someone using theirs.

    '
  type: composite
  contains:
  - title
  - article_type
  - intent_covered
  - audience
  - locale
- name: ownership
  purpose: 'Who is accountable for it still being true. An article with no named owner is not "team owned",
    it is unowned, and unowned articles are where decay accumulates first.

    '
  type: composite
  contains:
  - owner_ref
  - ownership_state
  - last_edited_at
  - promised_update_due_at
  - promised_update_action
- name: accuracy
  purpose: 'Whether the claim is still true, held deliberately apart from whether the file was recently
    touched. This separation is the single most important structure on the object.

    '
  type: composite
  contains:
  - accuracy_state
  - last_verified_at
  - verified_against_version
  - maintenance_state
  - decay_risk_bp
- name: findability
  purpose: 'Reachable, by someone who does not know what we call it. An accurate article nobody can find
    and a wrong article are the same object from the customer''s chair.

    '
  type: composite
  contains:
  - findability
  - search_terms
  - zero_result_query_count
  - inbound_link_count
  - search_rank_position
  - visibility
- name: effectiveness
  purpose: 'What actually happened to the people who read it. Read by Layer 4 and Layer 6; the only component
    here that can falsify the article rather than describe it.

    '
  type: composite
  contains:
  - view_count_30d
  - article_to_ticket_rate_bp
  - deflection_attributed_count
  - feedback_positive_count
  - feedback_negative_count
  - effectiveness_bp
  - last_linked_in_thread_at
- name: title
  purpose: 'Worth treating as a findability field rather than a label. Titles written in internal product
    nomenclature ("Configuring the Ingest Pipeline") are the most common cause of an article that is accurate,
    ranked, and never retrieved.

    '
  type: value
  data_type: string
  required: true
- name: article_type
  purpose: 'Decay rate differs sharply by type and this field is the cheapest predictor of it. `known_issue`
    and `release_note` are born with an expiry date; `policy` changes rarely but catastrophically; `troubleshooting`
    rots quietly with every UI change.

    '
  type: value
  data_type: enum
  allowed_values:
  - how_to
  - troubleshooting
  - reference
  - policy
  - faq
  - release_note
  - known_issue
- name: intent_covered
  purpose: 'The questions this answers, phrased as a customer would phrase them. This is what coverage
    is measured against — never the article count. An empty list means we do not know what this article
    is for, which is more common than anyone admits.

    '
  type: value
  data_type: list
- name: audience
  purpose: '`agent_only` content counted in a public deflection number is a straightforward measurement
    error, and it is present in most knowledge bases.

    '
  type: value
  data_type: enum
  allowed_values:
  - customer
  - agent_only
  - partner
  - internal_engineering
- name: locale
  purpose: 'Machine-translated articles inherit the source article''s accuracy AND add their own failure
    mode. A locale variant is a separate object with its own verification date, not a rendering of this
    one.

    '
  type: value
  data_type: string
- name: owner_ref
  purpose: Named human accountable for it still being true. Null is a finding, not a blank.
  type: reference
  ref: customer_support.obj.core.support_agent
  data_type: ref
- name: ownership_state
  purpose: '`team_owned` is included reluctantly, because in practice it behaves identically to `unowned`
    — it is what an article becomes when the person who wrote it leaves and nobody is willing to say so.

    '
  type: value
  data_type: enum
  allowed_values:
  - named_owner
  - team_owned
  - unowned
  - owner_departed
- name: last_edited_at
  purpose: 'Activity, not truth. Deliberately NOT the freshness signal. A typo fix advances this and changes
    nothing about whether the article is right.

    '
  type: value
  data_type: timestamp
- name: last_verified_at
  purpose: 'When a human last checked the claim against the shipping product. The only honest freshness
    field. Systems that advance this on save destroy the distinction the entire object is built on.

    '
  type: value
  data_type: timestamp
- name: promised_update_due_at
  purpose: 'Live today. When someone says "I''ll update the doc by Friday", that promise is a commitment
    in the graph, and it is currently the ONLY decay signal the pipeline can actually see. It catches
    only decay somebody already noticed — which is the minority of it.

    '
  type: value
  data_type: timestamp
  source_paths:
  - commitment.due_at
- name: promised_update_action
  purpose: The text of the promised change. Useful mainly for telling a rewrite from a one-line correction.
  type: value
  data_type: string
  source_paths:
  - commitment.action
- name: accuracy_state
  purpose: '`unverified` and `unknown` are different and the distinction is load-bearing: `unverified`
    means nobody has checked since a known date, `unknown` means we cannot even establish when it was
    last checked. The second is worse and is usually recorded as the first.

    '
  type: value
  data_type: enum
  allowed_values:
  - verified
  - unverified
  - contradicted
  - superseded
  - unknown
- name: verified_against_version
  purpose: 'The product version or release the claim was last checked against. Without this, "verified"
    is a date with no referent — and a date with no referent is what makes a fresh, wrong article look
    healthy.

    '
  type: value
  data_type: string
- name: maintenance_state
  purpose: '`update_unscheduled` means a change was agreed with no date attached. Treat it as a decision
    not to update — undated documentation work is never done.

    '
  type: value
  data_type: enum
  allowed_values:
  - current
  - update_scheduled
  - update_unscheduled
  - update_overdue
  - abandoned
- name: decay_risk_bp
  purpose: 'Probability this article is currently wrong, given type, age since verification, and release
    activity in the area it documents. A prediction, not an observation, and it should never be shown
    next to `last_edited_at` without the distinction being explicit.

    '
  type: value
  data_type: integer
  unit: basis_points
- name: findability
  purpose: '`gated` is separated from `unfindable` because the fix is commercial rather than editorial:
    the article is fine, it sits behind a login this requester cannot pass, and no amount of rewriting
    helps.

    '
  type: value
  data_type: enum
  allowed_values:
  - findable
  - weakly_findable
  - unfindable
  - unlinked
  - gated
- name: search_terms
  purpose: 'Synonyms and misspellings customers actually use, harvested from search logs rather than invented
    in a planning meeting. The invented ones are consistently wrong because the people writing them already
    know the answer.

    '
  type: value
  data_type: list
- name: zero_result_query_count
  purpose: 'Searches that plausibly meant this article and returned nothing. The cheapest instrumentation
    in the whole support stack and the one most often retained for thirty days and then discarded.

    '
  type: value
  data_type: integer
- name: inbound_link_count
  purpose: 'How many tickets, macros, articles and threads point here. Live-ish today via graph degree.
    Ambiguous on purpose — see the hub pattern below.

    '
  type: value
  data_type: integer
- name: search_rank_position
  purpose: Position for its own primary intent. Rank four for the question it was written to answer is
    functionally unpublished.
  type: value
  data_type: integer
- name: visibility
  purpose: 'Determines whether deflection is even possible. An `entitled_only` article cannot deflect
    a pre-login contact, however good it is.

    '
  type: value
  data_type: enum
  allowed_values:
  - public
  - logged_in
  - entitled_only
  - internal
  - unpublished
- name: view_count_30d
  purpose: 'The most reported and least informative number on the object. High views are equally consistent
    with a great article and with one people keep being sent to and bouncing off. On its own it should
    move no decision.

    '
  type: value
  data_type: integer
- name: article_to_ticket_rate_bp
  purpose: 'Share of views followed by a contact from the same person within the window. THE number. A
    high-traffic article with a high conversion rate is actively costing money — it is intercepting people
    and failing them.

    '
  type: value
  data_type: integer
  unit: basis_points
- name: deflection_attributed_count
  purpose: 'Contacts credited as avoided. Kept because it is what gets reported, flagged because it is
    the most gamed metric in support: it improves when help is harder to find, since a customer who never
    searched never converted.

    '
  type: value
  data_type: integer
- name: feedback_positive_count
  purpose: 'How many readers marked this article as having helped. Treat it as weak positive evidence
    and never as proof: the people it failed mostly leave without voting, so a high count with a high
    subsequent-ticket rate means the article satisfies the people it was already going to satisfy.'
  type: value
  data_type: integer
- name: feedback_negative_count
  purpose: 'Read as a lower bound and nothing more. Thumbs-down is submitted by a small, angry, unrepresentative
    minority; zero of them across heavy traffic says nothing about the article and quite a lot about the
    feedback widget.

    '
  type: value
  data_type: integer
- name: effectiveness_bp
  purpose: Composite. Should be dominated by article_to_ticket_rate_bp and unmoved by view counts.
  type: value
  data_type: integer
  unit: basis_points
- name: last_linked_in_thread_at
  purpose: 'Live today, and honest about its limits: it only sees articles pasted into email threads we
    ingest. It undercounts help-centre traffic by approximately everything, and is useful as a signal
    that AGENTS still trust the article, not that customers reach it.

    '
  type: value
  data_type: timestamp
  source_paths:
  - thread.last_inbound
states:
  initial: draft
  values:
  - name: draft
    description: Written, not reviewed. The state most "knowledge initiatives" produce in bulk and never
      leave.
  - name: submitted
    description: Awaiting review by someone who can check the claim, not just the prose.
  - name: published
    description: Live and reachable by its intended audience. Reachable is part of the definition — published-but-unlinked
      is not published.
  - name: at_risk
    description: Something concrete suggests it is now wrong or unowned. Never entered from elapsed time
      alone.
    entered_when:
    - fn: days_since
      path: commitment.due_at
      op: '>'
      value: 30
  - name: superseded
    description: A newer article carries the claim. Still indexed until archived, which is the dangerous
      window.
  - name: archived
    description: Removed from the index and from coverage counts. Deleting is worse — inbound links then
      404 silently.
  transitions:
  - from: draft
    to: submitted
  - from: submitted
    to: draft
  - from: submitted
    to: published
  - from: published
    to: at_risk
    when:
    - fn: days_since
      path: commitment.due_at
      op: '>'
      value: 30
  - from: at_risk
    to: published
  - from: published
    to: superseded
  - from: at_risk
    to: superseded
  - from: at_risk
    to: archived
  - from: superseded
    to: archived
relationships:
- target: customer_support.obj.core.intent
  cardinality: zero_or_many
  description: The edge coverage is actually measured on. An article covering no recorded intent is not
    coverage of anything, whatever the article count says. What the customer was trying to do, in their
    words. Matching on intent rather than on title keywords is the difference between an article that
    is found and one that merely exists.
  type: covers
  weight_bp: 7500
  confidence_bp: 4000
  priority: 3
  direction: outbound
- target: customer_support.obj.core.issue
  cardinality: zero_or_many
  description: Many articles, one issue. When the issue is fixed, every article documenting it is simultaneously
    wrong — this edge is what makes that a query instead of a surprise. The article documents an underlying
    problem rather than a single report. KCS structures knowledge around the issue precisely so one article
    serves every future ticket about it.
  type: documents
  weight_bp: 8500
  confidence_bp: 5000
  priority: 1
  direction: outbound
- target: customer_support.obj.core.ticket
  cardinality: zero_or_many
  description: 'Deliberately reversible in reading: the same edge records the article deflecting the contact
    and the contact that happened anyway. Modelling only the success case is how deflection numbers become
    fiction. The deflection edge and the unit of value in KCS — reuse is review. Low confidence here is
    a direct measurement of how little of the Solve loop is actually running, not of how good the article
    is.'
  type: deflects
  weight_bp: 8000
  confidence_bp: 4500
  priority: 2
  direction: outbound
- target: customer_support.obj.core.resolution
  cardinality: zero_or_many
  description: The resolution this was written from. The durable articles are almost always a resolution
    somebody bothered to write down the second time it occurred. What the article claims will make the
    problem stop. When this diverges from what actually resolved the tickets, the article is stale and
    nothing reports it.
  type: references
  weight_bp: 7000
  confidence_bp: 5000
  priority: 4
  direction: outbound
- target: customer_support.obj.core.content_gap
  cardinality: zero_or_one
  description: The gap this was written to close. An article created with no recorded gap is an article
    somebody wanted to write, which is a different and much less useful thing. The article exists BECAUSE
    a gap was observed. Preserving that link is what lets the Evolve loop measure whether authoring is
    aimed at demand.
  type: caused_by
  weight_bp: 6500
  confidence_bp: 4000
  priority: 5
  direction: outbound
- target: customer_support.obj.core.product_area
  cardinality: zero_or_one
  description: 'Required for the only real accuracy test there is — did this area ship a change after
    the article was verified. Ownership and decay both follow the product area: an article''s shelf life
    is set by how fast its surface changes.'
  type: belongs_to
  weight_bp: 6000
  confidence_bp: 7000
  priority: 6
  direction: outbound
- target: customer_support.obj.core.support_agent
  cardinality: zero_or_one
  description: The named owner. Unset is a finding. A named owner. An article without one decays silently
    and nobody is accountable for the decay.
  type: assigned_to
  weight_bp: 4500
  confidence_bp: 6500
  priority: 9
  direction: outbound
- target: customer_support.obj.core.knowledge_article
  cardinality: zero_or_one
  description: Self-referential. Superseding without retiring the predecessor leaves two answers in the
    index, and search will keep returning the older one because it has the backlinks. Self-referential
    supersession. Versioning matters here more than almost anywhere else, because a Layer 6 suggestion
    needs an addressable id and version to point at.
  type: supersedes
  weight_bp: 5500
  confidence_bp: 6000
  priority: 7
  direction: outbound
- target: customer_support.obj.core.entitlement
  cardinality: zero_or_one
  description: When the article is gated, entitlement decides reachability. A gated answer is not a deflection
    and must never be counted as one. Some knowledge is gated to a plan tier. A gated article is not self-service
    for the customer who cannot reach it.
  type: requires
  weight_bp: 3500
  confidence_bp: 5000
  priority: 10
  direction: outbound
- target: customer_support.obj.core.conversation
  cardinality: zero_or_many
  description: Where an agent linked it. Agent link behaviour is a quiet, honest quality vote — see the
    routing-around pattern. Where capture happens. KCS is explicit that knowledge is captured in the workflow
    while responding, in the requester's context — not written up afterwards.
  type: attaches_to
  weight_bp: 5000
  confidence_bp: 5000
  priority: 8
  direction: outbound
inference_patterns:
  deterministic:
  - id: ka.orphaned_no_inbound_links
    statement: Nothing in the graph links to this article — no ticket, no macro, no other article, no
      thread.
    status: executable
    when:
    - fn: edge_count
      op: '='
      value: 0
    yields:
      confidence_bp: 9200
      value: unlinked
      attribute: findability
    evidence_fields:
    - inbound_link_count
    note: 'Graph degree is a fact, not an inference, so this is high. Not higher because our graph is
      a projection of what we ingested — an article richly cross-linked inside the help centre''s own
      navigation, which we do not read, appears here as an orphan. The correct response is to exclude
      it from coverage, not to delete it.

      '
  - id: ka.update_promised_and_overdue
    statement: Someone committed to updating this article and the date has passed.
    status: executable
    when:
    - exists: commitment.due_at
    - fn: days_since
      path: commitment.due_at
      op: '>'
      value: 0
    yields:
      confidence_bp: 9000
      value: update_overdue
      attribute: maintenance_state
    evidence_fields:
    - commitment.due_at
    - commitment.action
    note: 'The only decay signal the pipeline can see today, and it has a severe selection bias worth
      stating plainly: it fires only for decay somebody already noticed, cared about, and promised to
      fix out loud. That is the small, visible minority. Silent decay — the actual subject of this object
      — produces no commitment and therefore no signal here.

      '
  - id: ka.update_promised_without_a_date
    statement: A change to this article was agreed with no date attached to it.
    status: executable
    when:
    - exists: commitment.action
    - absent: commitment.due_at
    yields:
      confidence_bp: 8500
      value: update_unscheduled
      attribute: maintenance_state
    evidence_fields:
    - commitment.action
    note: 'Treat an undated documentation commitment as a decision not to do it. This is a judgement,
      not a measurement, and it is why the confidence sits below the overdue pattern rather than above
      it — occasionally the fix lands the same afternoon. Held at 8500 because in the aggregate the pessimistic
      reading is right often enough to act on.

      '
  - id: ka.viewed_then_contacted
    statement: The person read this article and opened a ticket on the same intent within the window.
    status: needs_signal
    yields:
      confidence_bp: 9200
      attribute: article_to_ticket_rate_bp
    requires_signals:
    - kind: fact_path
      name: knowledge.viewed_at
      owner_layer: L1
      note: Every help centre logs a view with a session and a timestamp. It is discarded at the platform
        boundary. This is the single highest-value missing signal in the entire Customer Support brain.
    - kind: obs_kind
      name: ticket_created
      owner_layer: L2
      note: Needed with a requester identity so the view and the contact can be joined. Unjoined, both
        events are already collected and neither means anything.
    - kind: obs_kind
      name: self_service_attempted
      owner_layer: L2
      note: Distinguishes a read from a skim. Without it the window is the only discriminator and it will
        over-attribute.
    note: 'The pattern this object is for. It is the only way to separate a helpful article from a well-ranked
      one, and it is the only measurement that can make an article''s score go DOWN as its traffic goes
      up. Both halves already exist in every stack; nobody joins them, because the join can only produce
      bad news about work already shipped.

      '
  - id: ka.searched_for_and_not_found
    statement: Customers searched terms this article claims to cover and the search returned nothing.
    status: needs_signal
    yields:
      confidence_bp: 8800
      value: unfindable
      attribute: findability
    requires_signals:
    - kind: fact_path
      name: search.query_text
      owner_layer: L1
      note: The zero-result query log is the only honest record of what was ASKED as opposed to what was
        written. Most help centres keep it for thirty days and then bin it.
    - kind: fact_path
      name: search.result_count
      owner_layer: L1
      note: Zero-result is the trivially instrumentable case. The harder and more valuable one is a non-zero
        result the customer scrolled past.
    - kind: obs_kind
      name: self_service_abandoned
      owner_layer: L2
      note: 'Search-then-leave without opening anything. Distinguishes a vocabulary mismatch from a genuine
        content gap, which need opposite fixes: synonyms versus writing.'
    note: 'High confidence when it fires, because a zero-result search on a term we claim to cover is
      close to proof. The common mistake it corrects is treating this as a content gap and commissioning
      a new article, when the existing article is fine and only the words are wrong.

      '
  - id: ka.surface_changed_since_verification
    statement: The product area this article documents shipped a change after the article was last verified.
    status: needs_signal
    yields:
      confidence_bp: 9000
      value: contradicted
      attribute: accuracy_state
    requires_signals:
    - kind: fact_path
      name: product.released_at
      owner_layer: L1
      note: Release timestamps per product area. Available in every deploy pipeline and connected to no
        knowledge base anywhere.
    - kind: fact_path
      name: product.surface_version
      owner_layer: L1
      note: So verified_against_version has a referent. A verification date with nothing to compare against
        is a date, not a verification.
    note: 'This is the pattern that breaks the freshness illusion. An article edited last week against
      last year''s UI is fresh and wrong, and no field currently on the object can tell you so. Not 10000
      because a release in an area does not always touch what the article describes — it should demote
      to `unverified` and queue a check, never auto-retire.

      '
  - id: ka.owner_departed
    statement: The named owner no longer works here and nobody was assigned in their place.
    status: needs_signal
    yields:
      confidence_bp: 9500
      value: owner_departed
      attribute: ownership_state
    requires_signals:
    - kind: fact_path
      name: knowledge.owner_id
      owner_layer: L1
      note: Ownership is stored in the knowledge base and never projected as a fact, so it cannot be joined
        to anything.
    - kind: obs_kind
      name: leaver_confirmed
      owner_layer: L2
      note: 'Already on the planned list for Admin. One emitter would serve both domains: Admin uses it
        for asset recovery, Support for knowledge custody.'
    note: 'Near-deterministic once both signals exist, and it should trigger reassignment rather than
      a review. The failure mode is well known and rarely instrumented: articles outlive their authors,
      and the first person to notice is a customer.

      '
  heuristic:
  - id: ka.hub_by_reference_degree
    statement: A large number of graph neighbours point at this article.
    status: executable
    when:
    - fn: edge_count
      op: '>='
      value: 8
    yields:
      confidence_bp: 6000
      attribute: null
    evidence_fields:
    - inbound_link_count
    note: 'Read this as blast radius, not as quality. High reference count is equally consistent with
      an article everyone relies on and with one everyone keeps being sent to and bouncing off — the two
      are indistinguishable from degree alone, which is exactly why this sits at 6000 and does nothing
      but reorder the verification queue. The common mistake is reporting hub articles as "top performing
      content".

      '
  - id: ka.promise_abandoned_for_a_quarter
    statement: A promised update to this article is more than ninety days past its date.
    status: executable
    when:
    - exists: commitment.due_at
    - fn: days_since
      path: commitment.due_at
      op: '>'
      value: 90
    yields:
      confidence_bp: 6500
      value: unowned
      attribute: ownership_state
    evidence_fields:
    - commitment.due_at
    - commitment.action
    note: 'Late is a scheduling problem; a quarter late is an ownership problem, and they need different
      interventions — a reminder versus a reassignment. Held at 6500 rather than higher because the commitment
      record may simply have been closed out somewhere the pipeline cannot see. Ninety days is chosen
      as roughly one planning cycle, past which "we''ll get to it" has been empirically falsified.

      '
  - id: ka.traffic_without_feedback
    statement: Sustained readership and no feedback events of any kind, positive or negative.
    status: needs_signal
    yields:
      confidence_bp: 3500
      attribute: null
    requires_signals:
    - kind: fact_path
      name: knowledge.view_count_30d
      owner_layer: L1
    - kind: obs_kind
      name: knowledge_feedback_submitted
      owner_layer: L2
      note: Any feedback event at all — thumbs, comment, correction. The absence of the event is what
        carries the meaning here, so it must be emitted reliably or not at all.
    note: 'Deliberately 3500, and it is the most important low confidence on this object. Silence is not
      endorsement — but it is also not condemnation, and a pattern that treated it as either would be
      worse than no pattern. Its only legitimate job is to CAP the confidence of any claim that this article
      is working, so that unobserved never gets scored the same as validated. Reviewers who want this
      number higher are usually about to make the exact error it exists to prevent.

      '
  - id: ka.repeat_contact_after_self_service
    statement: The same account came back on the same intent shortly after a self-service attempt on this
      article.
    status: needs_signal
    yields:
      confidence_bp: 7000
      attribute: null
    requires_signals:
    - kind: obs_kind
      name: self_service_attempted
      owner_layer: L2
    - kind: derived
      name: derived.contact_frequency
      owner_layer: L2
      note: Already planned. Needs to be sliced by intent, not just by account — an account contacting
        more overall is not the same as an account contacting again about the SAME thing.
    - kind: baseline
      name: contact_rate_per_account
      owner_layer: L2
      note: Needed so 'shortly after' means something relative to how often this account contacts us anyway.
        Absolute windows mis-fire badly on high-touch enterprise accounts.
    note: 'A repeat contact after a self-service attempt is the definition of a failed deflection, and
      every view-counting dashboard currently records it as a successful one. 7000 rather than higher
      because the second contact is genuinely sometimes a different question the article was never meant
      to answer.

      '
  - id: ka.agents_route_around_it
    statement: Agents answering this intent write free text or use a macro instead of linking the article.
    status: needs_signal
    yields:
      confidence_bp: 6800
      attribute: effectiveness_bp
    requires_signals:
    - kind: obs_kind
      name: knowledge_article_linked
      owner_layer: L2
      note: Already planned. The link event is the observable; the absence of it, on an intent this article
        covers, is the signal.
    - kind: baseline
      name: article_link_rate
      owner_layer: L2
      note: Per-intent baseline so 'unusually low' is measured against how link-happy this team is, not
        against an absolute.
    note: 'The cheapest quality signal available and almost nobody uses it. Agents abandon bad articles
      silently and immediately — it costs them nothing to be honest, because rewriting the answer is faster
      than arguing about the doc. Their link rate is a more trustworthy quality measure than any survey.
      Not higher than 6800 because agents also route around perfectly good articles out of habit and because
      a macro is quicker.

      '
  - id: ka.read_then_escalated
    statement: This article appears on the path of tickets that later escalate.
    status: needs_signal
    yields:
      confidence_bp: 7500
      attribute: null
    requires_signals:
    - kind: obs_kind
      name: knowledge_article_linked
      owner_layer: L2
    - kind: obs_kind
      name: escalation_requested
      owner_layer: L2
      note: Planned. Needed with a path back to what the customer was shown before they asked for a manager.
    - kind: obs_kind
      name: ticket_reopened
      owner_layer: L2
      note: A reopen after an article link is the same failure in a quieter register — the answer was
        accepted, tried, and did not hold.
    note: 'This is the "worse than no article" case made measurable. The customer spent patience on our
      answer before they spent it on our queue, and the agent inherits somebody already let down once.
      Deliberately below the direct conversion pattern because escalation has many upstream causes and
      article quality is only one of them — but when an article shows up repeatedly on escalated paths,
      that is not noise.

      '
inputs:
- source: knowledge_base
  signal: article body, type, locale, edit history, owner
  description: The catalogue. Tells you what exists and almost nothing about whether it works.
- source: help_center
  signal: search queries, zero-result queries, view events, dwell
  description: Generated continuously today, projected into Layer 2 nowhere. Most of this object's needs_signal
    patterns dissolve the day this lands.
- source: ticket
  signal: contacts filed shortly after a view, on the same intent
  description: The falsifier. Requires a requester identity common to both sides of the join.
- source: manual_entry
  signal: a promised documentation update
  path: commitment.due_at
- source: manual_entry
  signal: what the promised update was
  path: commitment.action
- source: email
  signal: articles an agent pasted into a reply thread
  path: thread.last_inbound
- source: survey
  signal: was this helpful
  description: Retain, but weight low and never treat its absence as approval — the widget is answered
    by the delighted and the furious.
- source: telemetry
  signal: release timestamps for the product area this documents
  description: The only real accuracy test. It lives in the deploy pipeline and is connected to no knowledge
    base.
- source: derived
  signal: graph degree — what points at this article
  path: derived.engagement
outputs:
- name: answer_confidence_bp
  type: integer
  description: How sure we are this article is currently correct. Must fall on release activity, not only
    on age.
  consumed_by:
  - L4.reasoning_unit
- name: send_ready
  type: boolean
  description: Whether an agent or AI answer may reuse this right now. False on overdue maintenance or
    a post-verification release.
  consumed_by:
  - L5.communication_planning
  - L5.2.channel_planner
- name: deflection_candidate
  type: boolean
  description: Whether this could plausibly answer the incoming intent WITHOUT a human. Gated content
    is never a candidate.
  consumed_by:
  - L4.decision_maker
- name: decay_risk_bp
  type: integer
  description: Predicted probability the article is already wrong. Drives the verification queue order.
  consumed_by:
  - L4.reasoning_unit
  - L6.learning_unit
- name: coverage_gap_signal
  type: string
  description: Demand observed against this topic that the article did not satisfy. Feeds content_gap_analysis.
  consumed_by:
  - L4.reasoning_unit
- name: verification_due
  type: boolean
  description: A human must re-check the claim against the shipping product.
  consumed_by:
  - L5.execution_planning
preconditions:
- id: ka.issue_or_intent_identified
  statement: An article must attach to a known issue or a known intent before it can be reused deliberately.
  requires:
  - customer_support.obj.core.issue
  - customer_support.obj.core.intent
  if_unmet: degrade
- id: ka.owner_named
  statement: A named owner must exist before publication.
  requires:
  - customer_support.obj.core.support_agent
  if_unmet: block
- id: ka.audience_decided
  statement: The audience — internal or external — must be decided before the article can be counted as
    self-service coverage.
  if_unmet: block
constraints:
- id: ka.no_reuse_after_unverified_release
  statement: May not be sent as an authoritative answer when the documented area has shipped a change
    since last_verified_at.
  hard: true
- id: ka.gated_content_is_not_a_public_answer
  statement: An entitled_only or logged_in article may not be offered to a requester who cannot reach
    it, nor counted as coverage for them.
  hard: true
- id: ka.view_never_counts_as_deflection
  statement: A view, a click or a dwell time may never be recorded as a deflected contact.
  hard: true
- id: ka.no_customer_data_in_public_content
  statement: Public articles may not contain account names, ticket excerpts or reproduction data taken
    from a real case.
  hard: true
- id: ka.locale_variant_verified_separately
  statement: A translated variant does not inherit the source article's verification. It carries its own,
    or it is unverified.
  hard: false
- id: ka.agent_only_excluded_from_deflection
  statement: audience = agent_only content may not appear in customer-facing deflection coverage.
  hard: true
business_rules:
- id: ka.no_publish_without_named_owner
  statement: An article may not be published without a named owner. "Team owned" does not satisfy this
    — a team cannot be asked whether something is still true.
  then: block_publish
  severity: blocking
- id: ka.edit_must_not_advance_verification
  statement: 'An edit must never advance last_verified_at. Verification is a separate act against a named
    product version. Collapsing the two makes every article permanently fresh and permanently unchecked,
    and it is the default behaviour of most knowledge bases.

    '
  then: preserve_last_verified_at
  severity: blocking
- id: ka.view_is_not_deflection
  statement: 'A view may not be counted as a deflection. Deflection may only be claimed when no contact
    from that person on that intent followed inside the window. Counting views is how a support org reports
    rising deflection while its ticket volume also rises.

    '
  then: reject_deflection_claim
  severity: blocking
- id: ka.overdue_promised_update_blocks_reuse
  statement: An article with an overdue promised update must be flagged before an agent or an AI answer
    reuses it.
  when:
  - fn: days_since
    path: commitment.due_at
    op: '>'
    value: 0
  then: flag_stale_for_reuse
  severity: warning
- id: ka.orphan_is_not_coverage
  statement: An article nothing links to must be excluded from coverage counts. It is inventory, not coverage.
  when:
  - fn: edge_count
    op: '='
    value: 0
  then: exclude_from_coverage
  severity: warning
- id: ka.gated_article_is_not_self_service
  statement: 'An article behind an entitlement the requester does not hold may not be offered as a self-service
    answer or counted as available coverage for that requester.

    '
  severity: advisory
- id: ka.no_customer_identifiers_in_public_articles
  statement: 'Articles drafted from a ticket must not carry account names, ticket bodies or reproduction
    data. This is the most frequent real incident caused by knowledge authoring, and it is caused by the
    correct instinct of writing from a real case.

    '
  severity: blocking
decision_factors:
- name: answer_accuracy
  weight_bp: 3000
  direction: increases
  description: 'Verified against a named version, not recently edited. Dominant because a wrong answer
    delivered instantly is the worst outcome this object can produce.

    '
  reads:
  - accuracy_state
  - last_verified_at
  - verified_against_version
  - decay_risk_bp
- name: demand_match
  weight_bp: 2200
  direction: increases
  description: 'Does it answer something people actually ask, in their words. Coverage against demand,
    never against the catalogue.

    '
  reads:
  - intent_covered
  - search_terms
  - zero_result_query_count
- name: article_to_ticket_conversion
  weight_bp: 2000
  direction: decreases
  description: 'The falsifier. A high rate should suppress this article harder than a low view count ever
    suppresses it — being read and failing is worse than not being read.

    '
  reads:
  - article_to_ticket_rate_bp
  - effectiveness_bp
- name: findability
  weight_bp: 1400
  direction: increases
  description: An accurate article at search position four is, operationally, an absent article.
  reads:
  - findability
  - search_rank_position
  - inbound_link_count
  - visibility
- name: maintenance_health
  weight_bp: 900
  direction: context
  description: 'Context rather than increases: a well-maintained article about a discontinued feature
    should not be promoted, and an unmaintained one about a stable policy may be fine.

    '
  reads:
  - maintenance_state
  - ownership_state
  - promised_update_due_at
- name: blast_radius
  weight_bp: 500
  direction: context
  description: 'How much is downstream of this being wrong. Small weight, but it decides which of two
    equally suspect articles gets checked first.

    '
  reads:
  - inbound_link_count
  - view_count_30d
evidence:
- source: telemetry
  strength_bp: 9500
  description: Release and version data for the documented surface. The only source that can prove an
    article WRONG rather than merely old.
- source: ticket
  strength_bp: 8500
  description: A contact filed minutes after a view. A receipt that the article failed, and the strongest
    negative evidence there is.
- source: help_center
  strength_bp: 8000
  description: Search and view logs. Tells you what was asked, which nothing else does.
- source: knowledge_base
  strength_bp: 6000
  description: Edit history and metadata. Proves the file changed. Says nothing about whether the claim
    is true — this is the source most often mistaken for proof.
- source: email
  strength_bp: 5000
  description: An agent chose to paste this link. A quiet, unprompted quality vote, and more honest than
    a survey.
- source: survey
  strength_bp: 4000
  description: Thumbs and comments. Bimodal and thin. Useful as a pointer, never as a verdict, and its
    silence means nothing at all.
- source: derived
  strength_bp: 3500
  description: Graph degree and inferred decay. Corroborating only — it orders the queue, it does not
    decide anything.
- source: manual_entry
  strength_bp: 3000
  description: Somebody ticked reviewed. Worth something only when accompanied by a version; without one
    it is a date.
metrics:
- name: article_to_ticket_rate
  unit: percent
  description: Views followed by a contact from the same person on the same intent. The number this object
    exists to produce, and currently uncomputable.
  owner_layer: L6
- name: zero_result_query_rate
  unit: percent
  description: Share of help-centre searches returning nothing. The cheapest proxy for what is asked and
    uncovered.
  owner_layer: L2
- name: verified_coverage_of_top_intents
  unit: percent
  description: Top intents by volume with a VERIFIED article. Coverage measured against demand, not against
    the catalogue — the denominator is the whole point.
  owner_layer: L6
- name: median_days_since_verification
  unit: days
  description: 'Across published articles. Use the median, not the mean: a handful of hot articles updated
    weekly hides a long tail nobody has read since launch.'
  owner_layer: L6
- name: agent_link_rate
  unit: percent
  description: Share of replies on a covered intent that link the article rather than rewriting it. A
    quality signal that costs nothing to collect.
  owner_layer: L6
- name: orphan_article_share
  unit: percent
  description: Published articles with zero inbound links. Computable today from graph degree.
  owner_layer: L6
- name: time_to_correct
  unit: hours
  description: From a contradiction being detected to the article being corrected. The metric that separates
    a knowledge base from an archive.
  owner_layer: L6
- name: deflection_attributed
  unit: count
  description: Retained because it is what gets reported. Flagged because it is the most gamed number
    in support — it improves when help is harder to find.
  owner_layer: L6
events:
- id: ka.published
  name: Article Published
  payload:
  - title
  - intent_covered
  - audience
  - visibility
- id: ka.update_promise_broken
  name: Promised Update Missed
  emitted_when:
  - fn: days_since
    path: commitment.due_at
    op: '>'
    value: 0
  payload:
  - promised_update_action
  - promised_update_due_at
  - owner_ref
- id: ka.went_at_risk
  name: Article At Risk
  emitted_when:
  - fn: days_since
    path: commitment.due_at
    op: '>'
    value: 30
  payload:
  - maintenance_state
  - decay_risk_bp
- id: ka.orphaned
  name: Article Orphaned
  emitted_when:
  - fn: edge_count
    op: '='
    value: 0
  payload:
  - inbound_link_count
  - findability
- id: ka.contradicted_by_release
  name: Contradicted By A Release
  payload:
  - verified_against_version
  - last_verified_at
  description: Cannot be emitted today. The single most valuable uncaught event on this object — it is
    the exact moment a fresh article becomes a wrong one, and it passes unobserved on every release.
- id: ka.deflection_failed
  name: Deflection Failed
  payload:
  - article_to_ticket_rate_bp
  - view_count_30d
  description: Read and then contacted anyway. Cannot be emitted today. Its absence is why deflection
    numbers only ever go up.
- id: ka.superseded
  name: Article Superseded
  payload:
  - title
  description: Emit at supersession, not at archival. The window between the two is when search still
    returns the old answer, because the old answer has the backlinks.
actions:
- id: ka.verify_against_product
  name: Re-verify against the shipping product
  actor: human
  effect: Sets last_verified_at AND verified_against_version. Either one alone is theatre.
- id: ka.assign_owner
  name: Assign a named owner
  actor: human
  preconditions:
  - fn: edge_count
    op: '>='
    value: 1
  effect: Converts ownership_state away from unowned. A team is not an owner.
- id: ka.rewrite_in_customer_language
  name: Rewrite the title and terms in customer language
  actor: human
  effect: The highest-yield and least-glamorous fix. Most 'content gaps' are vocabulary gaps in disguise.
- id: ka.add_search_synonyms
  name: Add synonyms harvested from search logs
  actor: agent
  effect: Harvested, never invented — the people who can invent them already know the answer and therefore
    use the wrong words.
- id: ka.link_from_macro
  name: Link this article from the matching macro
  actor: agent
  effect: Keeps the agent path and the customer path pointing at one source of truth. When they diverge,
    the macro wins and the article rots.
- id: ka.draft_from_resolution
  name: Draft an article from a repeated resolution
  actor: agent
  effect: Trigger on the second occurrence, not the first. Drafting from one case produces an article
    about one customer.
- id: ka.retire
  name: Retire and redirect
  actor: human
  effect: Redirect, never delete. A deleted article's inbound links fail silently and the traffic simply
    disappears from the numbers.
dependencies:
- target: customer_support.obj.core.issue
  kind: derived_from
  strength: soft
  description: Most durable articles are written from a diagnosed issue rather than from a single ticket.
- target: customer_support.obj.core.ticket
  kind: enriches
  strength: soft
  description: Reuse links are what make the article measurable. Without them the collection can only
    be judged on opinion.
- target: customer_support.obj.core.content_gap
  kind: derived_from
  strength: soft
  description: 'Demand-driven authoring: the gap is the reason the article exists.'
- target: customer_support.obj.core.product_area
  kind: invalidated_by
  strength: hard
  description: A change in the product area is what makes an article wrong. This is the decay mechanism
    and it is silent.
- target: customer_support.obj.macro_management.macro
  kind: enriches
  strength: soft
  description: The macro is what the agent sends; the article is what the customer finds. Same knowledge,
    two surfaces, and content excellent as one is usually poor as the other.
exceptions:
- id: ka.deliberately_internal
  statement: An article may be kept internal even though it is correct and would answer the customer's
    question.
  why: Some workarounds should not be taught at scale — they are load-bearing, unsupported, or would mask
    a defect we intend to fix. Publishing them converts a temporary accommodation into an expectation.
  frequency: occasional
- id: ka.delete_rather_than_fix
  statement: When the product has changed underneath an article, deleting it beats updating it.
  overrides:
  - ka.edit_must_not_advance_verification
  why: A rewritten article inherits the old one's search ranking and reader trust while describing a different
    system. A confidently wrong article outranks no article, which is why removal is sometimes the higher-value
    edit.
  frequency: occasional
- id: ka.correct_and_unfindable
  statement: An article that is factually perfect and never surfaces is treated as absent, not as coverage.
  why: KCS captures in the requester's context because the customer's words are the search terms of the
    next customer. Rewriting into internal vocabulary is the single most common way a good article becomes
    invisible.
  frequency: common
- id: ka.reuse_is_review_has_a_floor
  statement: An article on a rare but critical path is maintained on a calendar even though nothing reuses
    it.
  overrides:
  - ka.orphan_is_not_coverage
  why: Reuse is review works because demand is a good proxy for importance. Disaster-recovery and data-loss
    procedures are the case where it is not — they are used almost never and must be right the one time
    they are.
  frequency: rare
best_practices:
- id: ka.capture_in_the_workflow
  statement: Write the article while answering the ticket, in the requester's own words.
  why: KCS Capture. Written afterwards it never gets written, and written in internal vocabulary it never
    gets found — the customer's phrasing is the next customer's search query.
  applies_when: Any ticket answered without an existing article.
- id: ka.fix_at_the_moment_of_use
  statement: Improve the article the moment it is found wrong, rather than filing a correction.
  why: KCS Improve. A correction queue is a place where corrections wait; the person who just discovered
    the error has more context than anyone who will read that queue later.
- id: ka.link_every_reuse
  statement: Attach the article to the ticket every time it is used.
  why: Reuse is review. The link is what turns the collection from an opinion into a measured asset, and
    it is the only input the Evolve loop has.
- id: ka.structure_before_prose
  statement: Keep a consistent article structure so a reader can skip to the part they need.
  why: KCS Structure. Support readers are not reading, they are scanning under pressure, and a well-written
    narrative performs worse than a plain one with predictable headings.
anti_patterns:
- id: ka.views_counted_as_deflection
  statement: Treating an article view as a deflected contact.
  why_it_happens: Views are trivially instrumented and deflection is the metric leadership asks for, so
    the substitution is nearly irresistible.
  cost: Deflection only asks whether a contact reached an agent — an abandonment counts as success. A
    customer who read the article, failed, and gave up is recorded identically to one who was helped,
    so the worst outcome in support is reported as the best.
  instead: Measure article-view-then-ticket as the failure signal, and treat unresolved self-service as
    a churn input rather than a saving.
  detectable_by:
  - view_count
  - ka.view_is_not_deflection
- id: ka.review_by_calendar
  statement: Scheduling quarterly reviews of the whole knowledge base.
  why_it_happens: It is auditable, it is easy to staff, and it looks like diligence.
  cost: It spends the most effort on the articles nobody uses and reaches the high-traffic ones on the
    same cadence as the dead ones. Meanwhile decay happens on product release timelines, not on review
    timelines.
  instead: Reuse is review — drive maintenance from demand and from observed failure, with a calendar
    floor only for rare-but-critical procedures.
  detectable_by:
  - last_reviewed_at
  - reuse_count
- id: ka.write_for_the_expert
  statement: Authoring articles in the vocabulary of the team that built the feature.
  why_it_happens: The author is an expert, the internal name is the precise one, and precision feels like
    quality.
  cost: The article is unfindable by the people it was written for, so it is simultaneously correct and
    useless — and its existence suppresses anyone writing the findable version.
  instead: Capture in the requester's context and keep their phrasing in the title and the first paragraph.
  detectable_by:
  - search_miss_rate
- id: ka.hide_the_contact_button
  statement: Raising deflection by making it harder to reach a human.
  why_it_happens: It works immediately, it needs no content investment, and every dashboard improves at
    once.
  cost: It converts solvable problems into silent churn. The metric improves precisely because the experience
    got worse, which makes it the most dangerous number in support.
  instead: Judge self-service on subsequent-contact rate and on effort, never on deflection alone.
  detectable_by:
  - ka.view_is_not_deflection
examples:
- label: '"Resetting your API key" — 4k views/month, thumbs never used, ticket volume on the same intent
    flat and high'
  note: The canonical silent failure. Every reported number looks healthy. It is being found, read, and
    failed, and no field currently on the object can say so.
- label: Migration guide edited nine days ago, UI redesigned eleven months ago
  note: Fresh and wrong. last_edited_at is recent, last_verified_at is absent, verified_against_version
    is null. Passes every freshness audit ever run.
- label: Accurate billing article at search position four for its own primary question
  note: findability = weakly_findable. Operationally identical to not existing. The fix is synonyms and
    a title rewrite, not a new article — and the content-gap report will recommend a new article.
- label: Known-issue notice for a bug fixed two releases ago, still indexed, still ranked first
  note: 'Now actively harmful: it tells customers a resolved problem is unresolved and generates contacts
    on its own. Retire and redirect; deleting it 404s the inbound links and the traffic vanishes from
    the numbers instead of being explained.'
- label: Detailed SSO troubleshooting guide behind entitled_only visibility
  note: findability = gated. Cannot deflect a pre-login contact, however good it is, and every coverage
    dashboard counts it. The fix is commercial, not editorial.
- label: Article written from one enterprise ticket, published with the account's hostname in the example
  note: 'Two failures at once: a data-exposure incident, and an article scoped to a single customer''s
    configuration that will mislead everyone else.'
references:
- title: KCS v6 Practices Guide
  kind: methodology
  author: Consortium for Service Innovation
  url: https://www.serviceinnovation.org/included/docs/KCS_v6_Practices_Guide_2023_06_08.pdf
  note: 'The authority for this entire object. Solve loop: Capture, Structure, Reuse, Improve. Evolve
    loop: collection health driven by demand and usage. ''Reuse is review'' shapes the states, the freshness
    attributes and the maintenance position taken above.'
- title: KCS Solve loop
  kind: methodology
  url: https://library.serviceinnovation.org/KCS/KCS_v6/KCS_v6_Practices_Guide/030/030
  note: Capture happens in the workflow while responding, in the requester's context — the source of the
    capture-in-the-workflow practice and of the write-for-the-expert anti-pattern.
- title: KCS Evolve loop
  kind: methodology
  url: https://library.serviceinnovation.org/KCS/KCS_v6/KCS_v6_Practices_Guide/030/040
  note: The Evolve loop depends entirely on people doing the right thing in the Solve loop — it is the
    aggregate of many correctly-handled events. This is why the reuse link is modelled as the unit of
    value.
- title: Deflection is not first contact resolution
  kind: practitioner
  url: https://www.inbenta.com/articles/first-contact-resolution-vs-deflection
  note: Deflection measures only whether a contact reached a live agent, so abandonment scores as success.
    The direct source of the views-counted-as-deflection and hide-the-contact-button anti-patterns.
metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ''
