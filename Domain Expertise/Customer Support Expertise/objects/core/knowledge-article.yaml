    One executable pattern was considered and deliberately NOT authored: followup_sent plus thread.ball_in_court
    = us as a proxy for article-to-ticket conversion. It is grammatical and it would have made the headline
    metric look covered while measuring something else. That is structurally the same error as binding
    "SLA breach imminent" to unanswered_email, which the domain header names as the failure this whole
    architecture exists to prevent.

