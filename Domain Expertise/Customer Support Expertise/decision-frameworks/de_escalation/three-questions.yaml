purpose:
  statement: 'The three questions a heated customer is actually asking: do you understand what happened
    to me, is anyone in charge of it, and when will I know more.


    Answering the technical question they typed while leaving these three unanswered is the most common
    shape of a reply that is correct and useless. Any draft can be checked against them in seconds,
    which is what makes this the most practical framework here.'
