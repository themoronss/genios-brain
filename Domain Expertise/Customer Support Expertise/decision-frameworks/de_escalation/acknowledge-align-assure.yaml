purpose:
  statement: 'Acknowledge — Align — Assure: name what happened in their words, agree what matters most
    to them right now, commit to the next contact.


    The Align step is the one that gets skipped and the one that carries the value. What matters most
    to the customer is frequently not the fix — it may be a workaround before a board meeting, or something
    they can forward — and assuming otherwise produces a perfectly executed response to the wrong priority.'
