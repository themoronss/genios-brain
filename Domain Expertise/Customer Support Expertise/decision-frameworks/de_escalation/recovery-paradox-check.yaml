purpose:
  statement: 'Recovery check: would this customer now describe the handling as evidence we are reliable,
    or as evidence we eventually respond to pressure?


    Both outcomes end the ticket and they teach the account opposite lessons. The second one predicts
    that the next contact opens at a higher temperature, which is the mechanism by which a team''s escalation
    volume grows without its defect rate changing.'
