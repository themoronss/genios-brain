purpose:
  statement: 'Separation test before escalating: what does the receiving owner have — authority, access,
    or information — that the current owner lacks?


    It is the only reliable defence against escalation-as-temperature-management. If the honest answer
    is nothing, the right move is a better message from the current owner, and routing it upward will
    produce the same message from someone busier.'
