purpose:
  statement: 'Who-Noticed Test — establish before anything else whether the customer raised this or
    we did, and branch the entire response on the answer.


    It is the earliest available fork and the cheapest to evaluate, and getting it wrong contaminates
    every later step. Running it first also prevents the common drift where an internally-found problem
    is progressively re-narrated as a customer complaint.'
