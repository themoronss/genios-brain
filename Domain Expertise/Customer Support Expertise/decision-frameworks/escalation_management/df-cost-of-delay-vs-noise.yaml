purpose:
  statement: 'Cost of Delay versus Cost of Noise — the only real trade in the decision to escalate.
    Delay is paid by this customer; noise is paid by every future escalation from this agent.


    Names both sides of a trade that is usually argued with only one side visible. It also makes explicit
    that the cost of over-escalating is real, which is what stops the corrective advice to escalate
    earlier from degrading into escalating everything.'
