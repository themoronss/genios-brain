purpose:
  statement: 'Impact and Reversibility — how much of the customer''s work is stopped, and whether waiting
    makes the outcome permanently worse. Reversibility, not loudness, is what should move an escalation
    forward.


    Separates the genuinely urgent from the merely unpleasant. An irreversible harm — data loss, a missed
    regulatory window, a launch that cannot be re-run — justifies spending credibility that an equally
    distressing but recoverable problem does not.'
