purpose:
  statement: 'SBAR handoff — Situation, Background, Assessment, Request. Borrowed intact from clinical
    shift handover.


    Medicine solved this problem under far worse consequences: context lost between shifts kills people,
    and SBAR is what survived the attempts to fix it. Support loses accounts rather than lives, which
    is precisely why it never developed a discipline of its own and should import one.'
