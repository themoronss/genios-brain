purpose:
  statement: 'Fault tree analysis — start from the undesired outcome and decompose into the combinations
    of conditions that could produce it, then eliminate branches with evidence.


    Handles the branching and multi-cause structure that Five Whys cannot express, and makes the unexamined
    branches visible so an investigation can be reviewed for what it did not check. Expensive; earn
    it on high-severity or recurring issues.'
