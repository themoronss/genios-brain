purpose:
  statement: 'Blameless framing — treat every human action in the timeline as the reasonable output
    of the information and incentives available at that moment, and ask what made it reasonable.


    Not a courtesy. It is the mechanism that keeps the people who saw what happened willing to say so,
    and every organisation that abandons it loses its evidence supply within a couple of incidents.'
