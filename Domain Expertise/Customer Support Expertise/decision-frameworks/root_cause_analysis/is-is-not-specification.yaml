purpose:
  statement: 'IS / IS-NOT problem specification — describe the problem in four dimensions (what, where,
    when, extent) and for each state both what IS affected and what comparably IS NOT.


    The only common framework that forces disconfirming evidence into the room. The IS-NOT column is
    where the cause is actually located, and it is the column teams skip because it feels like recording
    nothing.'
