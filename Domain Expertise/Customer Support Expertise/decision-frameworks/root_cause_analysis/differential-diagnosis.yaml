purpose:
  statement: 'Differential diagnosis — enumerate competing explanations first, then choose the cheapest
    test that most reduces the field, rather than the test that most confirms the favourite.


    Borrowed from medicine because the problem shape is identical: an uncalibrated reporter, an inaccessible
    system, and time pressure. It directly counters the dominant bias, which is testing the first hypothesis
    until it is either confirmed or exhausted.'
