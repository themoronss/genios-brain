purpose:
  statement: 'Ishikawa / fishbone, with support-native categories — product defect, data, configuration,
    environment, third party, documentation, process, and expectation.


    Its job is breadth before depth, forcing categories nobody would have volunteered. The last two
    categories matter disproportionately here: a large share of support "faults" are the product working
    as designed against a customer who was told otherwise, and no engineering RCA template has a place
    to put that.'
