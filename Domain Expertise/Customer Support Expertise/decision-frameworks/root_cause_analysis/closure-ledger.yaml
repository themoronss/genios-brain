purpose:
  statement: 'Closure ledger — a two-column verdict recorded on every issue: what closes the ticket,
    and what closes the issue, each with an owner and a state.


    This is the local invention rather than an industry framework, and it exists because the two closures
    are otherwise represented by one field. Written down, "workaround shipped, issue open, owned by
    platform" becomes a reviewable statement instead of a thing three people remember differently.'
