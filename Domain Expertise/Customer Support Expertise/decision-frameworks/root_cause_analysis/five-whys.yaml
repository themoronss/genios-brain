purpose:
  statement: 'Five Whys — chain each answer into the next question until the chain reaches a control
    the organisation owns.


    Cheap, teachable, and wrong more often than its reputation suggests: it produces a single linear
    chain when real failures branch, and it stops wherever the asker gets comfortable. Its value is
    entirely in the stopping rule — never on a person, never on an act of nature — and without that
    rule it is a machine for generating blame.'
