purpose:
  statement: 'Little''s Law — how long people wait is how many are waiting, divided by how fast you
    finish them.


    It is the only relationship here that is not negotiable, and it constrains what any plan can promise.
    Stated in words it is also a good test of a proposal: if a plan claims lower wait without changing
    either the number in the queue or the completion rate, it is not a plan. The arithmetic belongs
    to Layer 4; what belongs to the operator is knowing which of the three quantities they can actually
    move this week.'
