purpose:
  statement: 'Work-in-progress limits — cap what is held open per agent and per queue, rather than targeting
    what is closed.


    Throughput targets encourage starting; WIP limits encourage finishing. Since wait is driven by how
    much is simultaneously in flight, limiting the in-flight count lowers wait without anyone working
    faster.'
