purpose:
  statement: 'The utilisation curve — expected wait rises steeply, not smoothly, as arrival rate approaches
    service capacity.


    Used here as a shape rather than a formula. It is the reason a report of near-full utilisation is
    an alarm and not a status, and the reason the last increment of demand costs far more than the previous
    one. Where the bend sits for a given queue is arithmetic and lives in the pack manifest, not here.'
