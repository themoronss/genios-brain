purpose:
  statement: 'Interval-level staffing — size the rota against the shape of arrivals across the day and
    week, plus the variance around it, never against the period total.


    A daily or weekly total tells you nothing about whether anyone was on shift when the work arrived.
    Support demand has structure — time of day, day of week, release cadence, billing cycle — and staffing
    that ignores the structure fails predictably.'
