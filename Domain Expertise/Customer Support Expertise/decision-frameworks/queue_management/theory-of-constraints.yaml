purpose:
  statement: 'Theory of constraints — find the single step where work actually stops and stop tuning
    the steps around it.


    In support the constraint is almost never first-line; it is a specialist queue, an engineering handoff
    or one person who knows the legacy system. Improvements anywhere else deliver the work to the bottleneck
    faster and change nothing the customer can feel.'
