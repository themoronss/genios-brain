purpose:
  statement: 'Knowledge-Centered Service — capture the answer while solving the case, review by usage
    rather than by calendar, and make the person who used an article the person who fixes it.


    Answers written later, by people who did not solve the case, describe the product rather than the
    problem. Usage-driven review also concentrates maintenance where decay actually costs something
    instead of spreading it evenly over content nobody reads.'
