purpose:
  statement: 'Treat every search string as a statement of the job the customer is trying to finish,
    and title the answer after the job rather than after the feature.


    Customers search for what they are trying to do, not for what we called the thing that does it.
    This is the single cheapest intervention on findability and it costs no new content.'
