purpose:
  statement: 'Design the route to a human first, then place the self-service answer in front of it —
    never the reverse.


    When the answer is designed first, the human route becomes whatever space is left, which is how
    it ends up at the bottom of a page behind an accordion. Designing the escape first makes obstruction
    a visible decision somebody has to argue for.'
