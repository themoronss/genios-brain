purpose:
  statement: 'Answerable / account-specific / adversarial — sort every intent into one before deciding
    whether it may be deflected at all.


    Answerable intents deserve content. Account-specific ones need a human with the record in front
    of them. Adversarial ones — refunds, cancellations, disputes — are where self-service is read as
    evasion, and deflecting them damages the relationship even when the answer is correct.'
