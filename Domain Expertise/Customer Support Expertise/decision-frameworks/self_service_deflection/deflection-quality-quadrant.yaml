purpose:
  statement: 'Cross found-versus-not-found with solved-versus-not-solved. Only one cell is a success,
    and the found-but-not-solved cell is the one that produces angry repeat contacts.


    Blended deflection collapses all four cells into one number and hides the only cell that tells you
    something actionable. Found-but-not-solved is a content defect; not-found is a findability or coverage
    defect; the fixes are opposite and the volume is identical.'
