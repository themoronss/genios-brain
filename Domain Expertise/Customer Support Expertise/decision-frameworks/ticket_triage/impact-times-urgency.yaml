purpose:
  statement: 'Impact times urgency, inherited from service management — impact is how much of the customer''s
    business is affected, urgency is how fast the damage grows.


    It travels well into support because it separates size from rate of change, which the naive severity
    scale does not. It fails whenever urgency quietly becomes a property of the person reporting rather
    than of the damage, and that drift is silent.'
