purpose:
  statement: 'Severity/priority matrix — severity from blast radius and workaround availability, priority
    from severity crossed with entitlement and current queue contents.


    Its real value is procedural rather than analytical: it forces both axes to be stated out loud,
    which is the thing under pressure that people stop doing. Its danger is that teams begin treating
    the grid as the reasoning instead of the record of it.'
