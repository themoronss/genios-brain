purpose:
  statement: 'The clock ledger — start event, each pause with its cause, each restart, the deadline,
    the outcome. Disputes are settled by reading it.


    An SLA without an append-only history is an assertion. The ledger is also what makes an honest breach
    survivable in a QBR, because it demonstrates the miss was known rather than discovered.'
