purpose:
  statement: 'Promise hierarchy — the contractual SLA, the published target, and what an agent said
    on this ticket. The last binds in the customer''s mind; the first binds in a renewal negotiation.


    Expertise is knowing you owe all three and that they routinely disagree. Most escalations that begin
    as SLA complaints are actually a conflict between the third and the first.'
