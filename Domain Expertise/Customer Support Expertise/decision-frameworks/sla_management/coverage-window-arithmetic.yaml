purpose:
  statement: 'Coverage arithmetic — deadlines accrue only inside the entitlement''s covered hours, using
    the customer''s holiday calendar, and are quoted in the requester''s local time.


    Coverage, calendar and timezone are three separate mistakes that all look identical afterwards.
    Separating them is what lets a follow-the-sun team debug a breach instead of arguing about it.'
