purpose:
  statement: 'Start / pause / stop — the clock state model. Every SLA question reduces to which state
    the clock is in and who changed it last.


    It is small enough that agents actually use it, and it forces the useful question — who changed
    it last — which is the one that finds both the accidental automation and the deliberate parking.'
