purpose:
  statement: 'The pause test — is there an outstanding question, was it actually sent, is it genuinely
    unanswered, and could we make progress without it? Any no invalidates the pause.


    Each limb catches a different real failure: no question at all, a question drafted but never sent,
    a question the customer already answered, and a question we could have worked around. Asked as one
    question instead of four, agents answer it optimistically.'
