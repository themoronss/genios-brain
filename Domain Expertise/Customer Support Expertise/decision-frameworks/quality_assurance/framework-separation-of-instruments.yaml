purpose:
  statement: 'Separation of instruments — QA for coaching, satisfaction for outcome, performance management
    standing on its own independently gathered evidence.


    Each instrument is only trustworthy while it is not being asked to do another one''s job. This framework
    is the operational form of the whole capability''s central claim, and it is the one most often abandoned
    under pressure from a manager who wants a number today.'
