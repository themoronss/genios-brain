purpose:
  statement: 'Behaviourally anchored rating — each mark on each dimension is described by what the agent
    observably did, never by an adjective.


    Adjectival scales (excellent / good / fair) drift per reviewer and per mood, and cannot be calibrated
    because there is nothing concrete to disagree about. Behavioural anchors make the disagreement locatable
    and therefore fixable.'
