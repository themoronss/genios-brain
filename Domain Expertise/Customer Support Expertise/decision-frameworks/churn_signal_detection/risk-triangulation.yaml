purpose:
  statement: 'Risk triangulation — treat a flag as credible when a behavioural change, a relationship
    change and a support-history pattern point the same way.


    Any one of these alone produces more false positives than an account team will tolerate, and tolerance
    is the scarce resource. Agreement across independent channels is what makes a flag survive contact
    with someone who has a quota.'
