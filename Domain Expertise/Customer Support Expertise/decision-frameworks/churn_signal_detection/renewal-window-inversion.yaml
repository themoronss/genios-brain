purpose:
  statement: 'Renewal-window inversion — read the support history backwards from the renewal date rather
    than forwards from today.


    Recall is weighted towards the recent and the humiliating, not towards the average, so reading forwards
    produces a fair summary of a period the customer will not remember fairly. Reading backwards reconstructs
    what they will actually bring to the conversation.'
criteria:
- name: Renewal window inversion
  description: Renewal-window inversion — read the support history backwards from the renewal date rather
    than forwards from today.
  reads: &id001
  - customer_support.obj.core.customer_account
  - customer_support.obj.core.entitlement
  - customer_support.obj.core.ticket
how_to_apply:
- Renewal-window inversion — read the support history backwards from the renewal date rather than forwards
  from today.
- Recall is weighted towards the recent and the humiliating, not towards the average, so reading forwards
  produces a fair summary of a period the customer will not remember fairly. Reading backwards reconstructs
  what they will actually bring to the conversation.
when_to_use:
  situations:
  - A renewal or contract end date is known.
