purpose:
  statement: 'Customer Effort over satisfaction as the standing loyalty proxy, with satisfaction kept
    as a tone reading only.


    The renewal decision weighs the cost of continuing rather than the pleasure of the last interaction,
    and effort is the measure that speaks to cost. Keeping satisfaction as a tone reading rather than
    deleting it preserves what it is actually good at.'
