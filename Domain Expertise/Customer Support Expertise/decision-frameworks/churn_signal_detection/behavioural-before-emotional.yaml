purpose:
  statement: 'Behavioural-before-emotional triage — read the account''s contact and usage trend first,
    and only then read tone.


    Tone is vivid, immediate and misleading. Fixing the order of the read is what stops the loudest
    account from consuming the attention the quiet one needed, and it is the single change that most
    improves this capability in practice.'
