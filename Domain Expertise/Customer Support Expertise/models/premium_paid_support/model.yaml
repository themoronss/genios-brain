# Premium / Paid Support — model branch node.
#
# INHERITANCE: this file declares only what DIFFERS from canonical. No capability file and no
# object file is copied into this branch; resolution is vertical -> model -> canonical.
#
# READING THE CAPABILITY DIFF
#   activates    canonical capabilities a default support org runs nominally or not at all,
#                and that this branch cannot function without.
#   deactivates  canonical capabilities that do not exist in this motion at all.
#   emphasises   present either way, disproportionately load-bearing here.

identity:
  id: customer_support.model.premium_paid_support
  name: Premium / Paid Support
  kind: model
  domain: customer_support
  parent: null
  version: 0.1.0
  status: draft
  stub: false

description: >
  Support is sold as a product with its own price, its own contract and its own renewal. That
  changes what a support decision is. In every other branch, answering someone quickly out of
  goodwill is a kindness with no consequence; here it is a discount given away, and it devalues
  the tier for every customer who paid for the same thing. Generosity stops being free and
  becomes a pricing action taken by whoever happens to be on the ticket.
  .
  The mirror of that, and the branch's characteristic corruption, is that the cheapest way to
  make the paid tier attractive is to make the unpaid one worse. Nobody decides this. It happens
  through a hundred defensible small choices — staffing the paid queue first, routing the best
  agents there, letting the free queue's documentation age — and it is invisible from inside
  because every individual decision was correct. The only reliable detector is measuring the
  unpaid experience with the same instruments and the same seriousness as the paid one, which
  is the first budget cut when the attach rate is under pressure.
  .
  The entitlement document becomes a product specification rather than a reference. Customers
  who paid read it, quote it, and hold the letter of it; every ambiguity is revenue leakage in
  one direction or a churn event in the other. Scope — what is and is not supported — generates
  more expensive arguments than technical difficulty ever does, and the skill the branch needs
  and rarely trains is refusal: saying no clearly, early, with a reason, to somebody who is
  paying. Agents who cannot refuse deliver unbounded service at a bounded price, and the
  arithmetic of that shows up two quarters later as a margin problem nobody can attribute.
  .
  Breach costs money. Once an SLA carries a credit, missing it is an accounting event with a
  journal entry, and the incentive to pause the clock becomes financial rather than cosmetic.
  The pause ledger is now a control that needs auditing, and a support organisation that has
  never had to defend its own numbers to finance will be surprised by how quickly the metric
  stops describing reality.
  .
  One genuine advantage no other branch has: the customer can cancel support without cancelling
  the product. That is an early, unambiguous, unmistakable churn signal — a deliberate decision
  to stop paying for help — and it arrives months before the product renewal it usually
  precedes. Support non-renewal is the highest-information event in this branch and is normally
  logged by billing and read by nobody.
  .
  What an operator carries over wrongly from an internal cost-centre team: the reflex to absorb.
  In a cost centre, absorbing an out-of-scope request is efficient — arguing costs more than
  doing. In a paid tier, absorbing it teaches the customer the scope is negotiable, and the
  precedent is quoted back at renewal by a procurement team that keeps better records than we do.

characteristics:
  buyer: "an IT, engineering or operations leader with a budget line for support specifically, frequently a different person from whoever bought the product and on a different renewal date"
  typical_acv: "a defined percentage of product spend or a standalone fee, priced per tier and visibly comparable to competitors' equivalent tiers"
  decision_style: "explicit and documented — the tier is chosen against a published matrix, and every promise in that matrix will be tested"
  requester: "named, entitled, senior-skewed technical contacts who know exactly what they bought and will cite the clause"
  typical_resolution_hours: 4
  volume_shape: "moderate volume, high expectation density; the spikes follow the customer's own change windows because premium tiers are bought precisely to cover those"
  staffing_model: "a senior-weighted dedicated pool with a hard entitlement gate at intake, sized to the tier's promise rather than to the queue's average"
  coverage: "24x7 for the top tiers, because continuous coverage is the most legible thing a tier can sell"
  automation_level: "deliberately low and expensive because of it — what was purchased is a human, and automating the first touch is the fastest way to make the tier feel like the free one"
  primary_channels: [phone, ticket_portal, chat, email]
  notes: >
    Watch the tier boundary rather than the tier. Almost all of the branch's operational pain
    concentrates on the customers just below the line they wanted to buy and the ones who bought
    up a tier and are not using it. The first group generates the scope arguments; the second
    group churns quietly at renewal having never tested what they paid for, and looks like the
    healthiest cohort on every dashboard right up until they leave.

capabilities:

  # Cost to serve is an efficiency metric in a cost centre and a margin line here, on a product
  # with a price, a cost and a gross margin someone reports. Coverage is activated because 24x7
  # is not an operational posture in this branch, it is a line item that was sold — the rota is
  # the deliverable, and a gap in it is a failure to supply rather than a staffing inconvenience.
  activates:
    - customer_support.support_operations.cost_to_serve
    - customer_support.entitlement_and_sla.coverage_and_on_call

  # Nothing. The seductive deletion is self_service_deflection, on the theory that a customer who
  # paid for a human should always get one. It misreads what was bought: premium customers are
  # the most sophisticated population in the tree and want the answer now, not a conversation.
  # What they purchased is the RIGHT to a human, not the obligation to wait for one — and taking
  # away good documentation as a way of honouring their purchase makes the tier worse for exactly
  # the people who chose it.
  deactivates: []

  emphasises:
    - customer_support.entitlement_and_sla.entitlement_verification
    - customer_support.entitlement_and_sla.sla_management
    - customer_support.entitlement_and_sla.breach_prevention
    - customer_support.entitlement_and_sla.commitment_tracking
    - customer_support.customer_communication.expectation_setting
    - customer_support.support_management.account_relationship_management
    - customer_support.escalation_and_incident.executive_escalation
    - customer_support.voice_of_customer.satisfaction_measurement
    - customer_support.voice_of_customer.churn_signal_detection
    - customer_support.support_management.quality_assurance

objects:
  extends:
    - object: customer_support.obj.core.entitlement
      require_properties: [plan, entitled_first_response_minutes, entitled_resolution_hours, entitled_channels, coverage_hours, expires_at]
      note: >
        In this branch the entitlement object is the product specification, and every attribute
        on it is a clause somebody can quote in an escalation. Nothing may be inferred and
        nothing may be defaulted: an unresolved entitlement means we do not know what was sold,
        which is a commercial hole rather than a missing field. `expires_at` matters more here
        than anywhere else because the support contract can lapse while the product contract
        runs, and the first ticket after that date is the worst possible moment to discover it.
    - object: customer_support.obj.core.sla_target
      require_properties: [is_contractual, target_at, clock_state, credit_exposure, pause_reason, pause_is_disputable]
      note: >
        Once a breach carries a credit, the pause ledger becomes a financial control. Every pause
        is a claim that the delay was the customer's, and `pause_is_disputable` is the attribute
        that decides whether that claim survives being read back by a customer with the timestamps
        in front of them. A branch that pauses aggressively will meet its numbers and lose the
        argument in the room where it matters.
    - object: customer_support.obj.core.ticket
      require_properties: [is_named_account, account_arr, entitlement_ref, sla_target_ref]
      note: >
        The entitlement reference is mandatory at intake, not at escalation. The whole value of
        a paid tier is that what may be promised is known before anyone speaks, and the failure
        mode is an agent making a commitment the tier does not carry — which converts goodwill
        into a liability that the customer will hold for the rest of the term.
    - object: customer_support.obj.core.churn_risk
      require_properties: [plan_tier, renewal_at, days_to_renewal]
      note: >
        The support product renews separately, so it can be cancelled on its own. A downgrade
        from the top tier is the clearest churn signal available anywhere in this domain: it is
        deliberate, it is documented, it is taken by a budget holder, and it usually precedes the
        product renewal by two quarters. It is also almost always invisible to support, because
        it happens in billing.
    - object: customer_support.obj.core.escalation
      require_properties: [executive_visible, reason, receiving_owner_ref]
      note: >
        An escalation from a paying tier is frequently a commercial move rather than a technical
        one — the customer is establishing a record for the renewal conversation. Reading it as
        purely technical produces a correct answer to the wrong question. The tell is who is
        copied: a thread that acquires the customer's procurement or vendor-management function
        has stopped being about the ticket.

overrides:
  capabilities.customer_support.entitlement_and_sla.sla_management.breach_has_financial_penalty: true
  capabilities.customer_support.entitlement_and_sla.sla_management.pause_ledger_is_audited: true
  capabilities.customer_support.entitlement_and_sla.entitlement_verification.enforcement: "strict_scope_boundary"
  capabilities.customer_support.entitlement_and_sla.entitlement_verification.checked_at: "intake"
  capabilities.customer_support.customer_communication.expectation_setting.scope_refusal_is_expected: true
  capabilities.customer_support.support_operations.cost_to_serve.frame: "gross_margin_not_efficiency"
  capabilities.customer_support.voice_of_customer.churn_signal_detection.support_tier_downgrade_is_a_signal: true

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  notes: >
    This branch composes with named_tam and premium is usually where a TAM is sold from, but the
    two are genuinely separate: a TAM conceded during a renewal is not a priced tier and cannot
    be withdrawn, whereas everything in this file assumes the service has a number attached. If a
    tenant matches both, resolve premium first — the entitlement discipline here is the stricter
    of the two and the TAM branch's informality is what it exists to bound.
