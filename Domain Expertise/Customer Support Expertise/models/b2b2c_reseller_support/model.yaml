# B2B2C Reseller Support — model branch node.
#
# INHERITANCE: this file declares only what DIFFERS from canonical. No capability file and no
# object file is copied into this branch; resolution is vertical -> model -> canonical.
#
# NOT THE SAME BRANCH AS customer_support.model.b2b2c. There, support serves both the partner
# and the partner's end customers, and the hard question is which of two conflicting customers
# is in front of us. Here the reseller OWNS the end customer completely: they run tier one, they
# hold the contract with the consumer, they control the brand, and we are their supplier. We
# never speak to the person with the problem and are usually contractually barred from trying.
#
# READING THE CAPABILITY DIFF
#   activates    canonical capabilities a default support org runs nominally or not at all,
#                and that this branch cannot function without.
#   deactivates  canonical capabilities that do not exist in this motion at all.
#   emphasises   present either way, disproportionately load-bearing here.

identity:
  id: customer_support.model.b2b2c_reseller_support
  name: B2B2C Reseller Support
  kind: model
  domain: customer_support
  parent: null
  version: 0.1.0
  status: draft
  stub: false

description: >
  Our customer is another support organisation. Every contact arrives from a trained
  professional who has already run tier one, consulted their own runbook, and failed — which
  means the easy contacts structurally never reach us. Our queue is, by construction, somebody
  else's escalation tail: tiny in volume, brutal in average difficulty, and completely
  unbenchmarkable against a direct queue. A leader who imports handle-time or first-contact-
  resolution targets from a consumer operation will conclude within a month that this is the
  worst-performing team in the company, and will be measuring the wrong population.
  .
  The second structural fact is that all evidence is hearsay. We cannot see the end customer's
  screen, cannot ask them a follow-up, and cannot reproduce anything without a proxy. A question
  we would answer in ninety seconds on a live chat becomes a two-day round trip through two
  queues, and each hop loses fidelity — the reseller's agent paraphrases the customer, we
  paraphrase the agent, and the fault we finally investigate is three descriptions removed from
  the fault that exists. Reproduction stops being a step inside diagnosis and becomes the
  branch's hardest discipline: getting the right evidence requested, in the right words, in one
  round trip, because a second round trip costs another day of somebody else's SLA.
  .
  Third: there are two clocks and only one of them is ours. The reseller promised their customer
  four hours, has spent three of them, and reaches us with one hour left — and presents that as
  urgency rather than as contract, because it is not our contract. Our clock starts when they
  report, which is late by definition; theirs started when the customer complained. That gap is
  the source of nearly every escalation in this branch, and it is a structural mismatch rather
  than a service failure. It cannot be fixed by responding faster; it can only be managed by
  making the two clocks explicit to both sides.
  .
  Fourth: our words are republished by somebody with a commercial reason to soften them. What we
  write is forwarded, paraphrased, or pasted into the reseller's own template — and the caveats
  go first. "We believe this is fixed in the next release, subject to testing" reaches the end
  customer as "it is fixed next release". The correct craft here is to write for republication:
  short, quotable, self-contained statements that survive being cut, with the conditional part
  structurally inseparable from the claim.
  .
  Fifth: a substantial share of escalations are evidentiary rather than technical. The reseller
  needs something in writing to show their customer — a position, a date, an acknowledgement —
  and escalating to us is how they get it. Reading those as demands for more engineers produces
  the wrong response entirely. What is needed is a written, quotable, dated position, and it can
  usually be produced in an hour by someone who understands what is being asked for.
  .
  What an operator carries over wrongly from direct B2B: treating the requester's emotional state
  as the customer's. The reseller's agent is either professionally calm about a situation that is
  on fire, or escalated about something minor because their own manager is escalated. Neither
  register maps to the end user's actual state, and both mislead. The second carry-over error is
  closing the ticket when the reseller's agent understands the answer. Their understanding is not
  the resolution — the resolution is their customer's problem stopping, and we will never see it
  happen. Anything we learn about whether it worked comes back only as a re-open, weeks later,
  through the same two queues.

characteristics:
  requester: "a support agent or technical lead employed by the reseller, working to their own SLA, describing a problem they have not personally experienced on a system they do not own"
  typical_resolution_hours: 24
  volume_shape: "very low ticket count against very high difficulty; volume is driven by the reseller's own book and spikes in correlated bursts when one of their platforms or campaigns breaks"
  staffing_model: "a small senior partner-facing team with fast engineering access, plus a named partner manager per reseller"
  coverage: "aligned to the reseller's commitments to their own customers, which are usually wider than anything we sell directly and were agreed without us"
  automation_level: "low on contacts, high on enablement — deflection here means the reseller's agent finding the answer in partner documentation, which is a professional-audience content product and not a help centre"
  primary_channels: [ticket_portal, email, chat, phone]
  notes: >
    Concentration risk has no analogue in a direct branch. Losing one reseller is not losing a
    customer, it is losing their entire book at once, and the decision is taken by a partner
    manager who reads our support performance as a supplier-scorecard line. This is the only
    branch where a single unresolved ticket can plausibly be a material commercial event, and it
    is also the branch where the smallest number of people at the customer see our work.

capabilities:

  # Reproduction is a step inside diagnosis for most orgs and is the branch's binding constraint
  # here, because every observation is secondhand and every clarifying question costs a day. The
  # capability that matters is designing the evidence request, not running the test.
  # Deflection is activated with its target changed: the population to deflect is the reseller's
  # own agents, and the artefact is partner-grade technical documentation. Enablement is the only
  # lever in this branch that reduces load rather than moving it.
  activates:
    - customer_support.diagnosis_and_resolution.issue_reproduction
    - customer_support.knowledge_and_deflection.self_service_deflection

  # Nothing. The seductive deletion is de_escalation, since we never meet the angry person. It is
  # wrong in an instructive way: the anger arrives secondhand, carried by an intermediary who has
  # absorbed it for three hours and can neither resolve it nor escape it, and it is harder to
  # defuse than the original — because the one move that works on an upset customer, addressing
  # them directly, is unavailable to us.
  deactivates: []

  emphasises:
    - customer_support.customer_communication.response_drafting
    - customer_support.customer_communication.expectation_setting
    - customer_support.entitlement_and_sla.entitlement_verification
    - customer_support.entitlement_and_sla.commitment_tracking
    - customer_support.escalation_and_incident.escalation_management
    - customer_support.escalation_and_incident.engineering_handoff
    - customer_support.escalation_and_incident.major_incident_communication
    - customer_support.intake_and_triage.duplicate_and_merge
    - customer_support.support_management.account_relationship_management
    - customer_support.voice_of_customer.churn_signal_detection

objects:
  extends:
    - object: customer_support.obj.core.requester
      require_properties: [reports_on_behalf_of, role_title, technical_fluency]
      note: >
        `reports_on_behalf_of` is an edge case in the canonical object and is populated on every
        single ticket here — it is the branch in one attribute. It also carries a second-order
        reading worth having: a reseller agent who consistently reports on behalf of the same end
        customer is dealing with a recurring fault their own tier one cannot hold, which is an
        enablement gap on our side long before it is a defect on ours.
    - object: customer_support.obj.core.ticket
      require_properties: [external_ref, account_ref, requester_ref]
      note: >
        The reseller's own ticket id is the only join key between our record and the problem as
        it actually exists. Without it, neither party can reconcile a list of open issues, every
        status meeting is spent matching descriptions to descriptions, and a customer-affecting
        fault can be closed on our side while open on theirs with nobody able to prove it.
        Nothing else in this branch is as cheap to fix or as consistently skipped.
    - object: customer_support.obj.core.sla_target
      require_properties: [started_at, measured_from, target_at]
      note: >
        Our clock and theirs are different clocks and ours starts later. `measured_from` has to
        record which event started it — their customer's complaint or their report to us — because
        the whole of this branch's escalation pressure lives in the difference, and a target that
        looks comfortably met against our clock can be two hours past breach against the one the
        end customer is experiencing.
    - object: customer_support.obj.core.entitlement
      require_properties: [plan, named_contacts, entitled_channels]
      note: >
        Entitlement stops at the reseller. The end customer holds nothing from us at all, which
        means any promise made to them was made by someone with no authority to make it — and it
        will still be quoted at us. The practical control is the named contact list: contacts
        outside it are usually the reseller's own escalations routing around their tier one, which
        is worth noticing because it is the earliest sign that their support organisation is
        failing and their volume is about to become ours.
    - object: customer_support.obj.core.knowledge_article
      require_properties: [audience, article_type, accuracy_state]
      note: >
        Partner documentation is a different product from customer documentation, written for a
        trained professional who wants the mechanism rather than the reassurance. Publishing the
        consumer article to partners is the standard mistake and it insults the reader; publishing
        the partner article to consumers leaks internals. `audience` is what keeps them apart, and
        conflating them is how the enablement lever quietly stops working.
    - object: customer_support.obj.core.escalation
      require_properties: [origin, reason, reason_note]
      note: >
        Separate the evidentiary escalation from the technical one — the reseller frequently needs
        a written, dated position to show their own customer, not more capacity on the problem.
        `reason_note` is where that distinction survives, and getting it right converts a
        three-day engineering interrupt into an hour of careful writing.

overrides:
  capabilities.customer_support.diagnosis_and_resolution.issue_reproduction.evidence_is_secondhand: true
  capabilities.customer_support.diagnosis_and_resolution.issue_reproduction.round_trip_cost: "one_partner_sla_day"
  capabilities.customer_support.entitlement_and_sla.sla_management.clock_starts_at: "partner_report_not_end_user_impact"
  capabilities.customer_support.customer_communication.response_drafting.written_for: "republication_by_partner"
  capabilities.customer_support.voice_of_customer.satisfaction_measurement.measured_party: "partner_agent"
  capabilities.customer_support.support_operations.support_analytics.benchmark_against_direct_queue: "not_meaningful"
  capabilities.customer_support.diagnosis_and_resolution.verification_and_closure.end_state_unobservable: true

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  notes: >
    satisfaction_measurement is deliberately kept rather than deactivated, with the measured party
    overridden. It runs, and it measures how usable we are to a trained intermediary — a real and
    useful thing — while telling us nothing about the market whose experience we determine. Naming
    that blind spot in the override is more honest than deleting the capability and pretending the
    survey was never sent.
