# Enterprise Support — model branch node.
#
# INHERITANCE: this file declares only what DIFFERS from canonical. No capability file and no
# object file is copied into this branch; resolution is vertical -> model -> canonical.
#
# READING THE CAPABILITY DIFF
#   activates    canonical capabilities a default support org runs nominally or not at all,
#                and that this branch cannot function without.
#   deactivates  canonical capabilities that do not exist in this motion at all.
#   emphasises   present either way, disproportionately load-bearing here.
#
# This is a SEGMENT branch — it describes who is being supported, not how the team is arranged.
# It composes with an operating-structure branch (tiered, swarming, follow-the-sun); enterprise
# accounts are most often served through a tiered or named-engineer structure, and the two
# branches answer different questions.

identity:
  id: customer_support.model.enterprise_support
  name: Enterprise Support
  kind: model
  domain: customer_support
  parent: null
  version: 0.1.0
  status: draft
  stub: false

description: >
  Supporting an organisation that negotiated its support terms as a schedule to a contract, and
  that employs people whose job is to hold us to them. Three structural facts follow and they
  touch everything.
  .
  First, the requester is usually a support or platform engineer inside the customer's own IT
  organisation, so their tier one has already run. What reaches us is the residue: the easy half
  is gone before the ticket exists, and a deflection rate that would read as failure in a
  consumer org is here evidence that the customer's helpdesk is working. Second, everything
  promised is written and everything written is audited — response targets, severity
  definitions, escalation levels, coverage windows, service credits — so a support commitment is
  a commercial instrument, and a one-off favour becomes a precedent quoted back for the rest of
  the term. Third, resolution is not ours to declare. The fix ships on our side and lands on
  theirs weeks later through a change window we do not control, which is why "fixed" and
  "resolved" are two different dates here and only one of them is ours to set.
  .
  The escalation path is procurement-grade rather than emotional. There is a named matrix on
  both sides, an accepting owner at each level, and a contractual window in which acceptance
  must happen. An escalation nobody accepts inside that window is itself a breach, independent
  of whether the underlying ticket was ever technically hard — which is the part that surprises
  operators arriving from a segment where escalation means an unhappy customer.
  .
  What an operator carries over wrongly from mid-market or SMB: speed as the currency.
  Enterprise customers will wait. What they will not absorb is being surprised, and a fast wrong
  answer costs more than a slow correct one because it enters a record that gets read back. The
  second carry-over error is answering only the person in the ticket. An enterprise account has
  a governance chain that is not in the thread, and an escalation that appears from nowhere is
  almost always a sponsor who heard nothing for three weeks while their engineer was answered
  within the hour.

characteristics:
  requester: "a support or platform engineer inside the customer's own IT organisation, who has already run their tier one; almost never the buyer and never the signatory"
  typical_resolution_hours: 72
  volume_shape: "low volume, extreme complexity, concentrated around the customer's upgrade windows, change freezes and audit cycles"
  staffing_model: "named senior engineers per account behind a tier ladder, with a TAM and a written escalation matrix"
  coverage: "24x7 for severity-1 by contract; business hours in the customer's region below that"
  automation_level: "low — the customer's own helpdesk has already deflected everything a knowledge base can answer, so deflection targets imported from another segment measure the wrong population"
  buyer: "a procurement-led committee; support terms are negotiated as a schedule to the master agreement, not chosen from a pricing page"
  typical_cycle_days: 180
  typical_acv: "six to eight figures, with the support schedule priced as a percentage of licence and renegotiated at renewal"
  committee_size: "large — procurement, security, the technical sponsor and the economic buyer, with the day-to-day requester usually absent from all of it"
  decision_style: "documented, evidence-led and slow; claims are read back at renewal and a written RCA is a deliverable rather than a courtesy"
  primary_channels: [ticket_portal, email, phone, shared_slack_channel, scheduled_review]
  notes: >
    The support relationship here has a second surface no other segment has: the quarterly
    review. Tickets that were individually handled correctly can still add up to a bad QBR, and
    the customer arrives with their own extract of our data. A queue that is only ever read
    ticket by ticket cannot see the thing the customer will present.

capabilities:

  # Nominal in most orgs, contractual here. Coverage is a clause with a number in it rather than
  # a rota decision; executive escalation has a named matrix on both sides; and the postmortem
  # is a document the customer is owed, on a deadline, in a format their auditors accept.
  activates:
    - customer_support.entitlement_and_sla.coverage_and_on_call
    - customer_support.escalation_and_incident.executive_escalation
    - customer_support.escalation_and_incident.postmortem

  # Nothing. The tempting deletion is self_service_deflection — enterprise customers "do not
  # self-serve" — and it is wrong about who the reader is. The audience for an enterprise
  # knowledge base is the customer's OWN support organisation, and an article that lets their
  # tier one close a case is worth more than one that deflects an end user, because it removes
  # the ticket before it is ours. Deleting the capability here just makes their helpdesk guess.
  deactivates: []

  emphasises:
    # What was promised is written down, checkable, and expensive to get wrong in either
    # direction: over-serving is unbilled cost, under-serving is a credit.
    - customer_support.entitlement_and_sla.entitlement_verification
    - customer_support.entitlement_and_sla.sla_management
    - customer_support.entitlement_and_sla.breach_prevention
    - customer_support.entitlement_and_sla.commitment_tracking
    # The account is the thing that renews and it is not in the ticket.
    - customer_support.support_management.account_relationship_management
    - customer_support.escalation_and_incident.escalation_management
    # Hard enterprise tickets end at an engineer, and the handoff is where they die.
    - customer_support.escalation_and_incident.engineering_handoff
    - customer_support.diagnosis_and_resolution.root_cause_analysis
    - customer_support.escalation_and_incident.major_incident_communication
    # Silence is the failure mode. A three-week investigation with no updates is experienced as
    # a three-week outage of us, whatever the ticket record says.
    - customer_support.customer_communication.proactive_status_updates
    - customer_support.customer_communication.expectation_setting

objects:
  extends:
    - object: customer_support.obj.core.entitlement
      require_properties: [plan, coverage_hours, expires_at, named_contacts, named_contact_limit,
                           entitled_severity_levels, has_technical_account_manager]
      note: >
        The named-contact list is a gate, not metadata. A request from outside it is a
        commercial decision — serve it and the limit is fiction, refuse it and someone senior
        hears about it within the hour — and the one thing an agent must not do is make that
        call silently. `entitled_severity_levels` matters because the customer declares
        severity in this segment and the contract says which declarations we are obliged to
        honour; a sev-1 the contract does not carry is a negotiation, not a triage input.
    - object: customer_support.obj.core.sla_target
      require_properties: [is_contractual, clock_state, pause_reason, pause_is_disputable,
                           credit_exposure]
      note: >
        Every pause is evidence. Enterprise customers reconcile our clock against their own
        record at renewal, and a pause with no stated reason is a pause they will disallow — so
        an undocumented `waiting_on_customer` is not a bookkeeping lapse, it is a credit.
        `is_contractual` separates the targets that cost money from the internal standards that
        cost goodwill; in this segment most are the former, which is exactly the assumption that
        breaks when the same operator moves down-market.
    - object: customer_support.obj.core.escalation
      require_properties: [level, receiving_owner_ref, receiver_accepted_at, direction]
      note: >
        The matrix is in the contract, so acceptance is a timestamped event and not a courtesy.
        An escalation with a receiving owner who has not accepted is un-owned in exactly the
        window where the customer believes it is most owned. Note that the named owner is
        frequently on the customer's side too — their internal sponsor — and an escalation that
        maps only ours is half-drawn.
    - object: customer_support.obj.core.ticket
      require_properties: [account_ref, entitlement_ref, verified_by_customer, resolution_type]
      note: >
        Closure is the customer's to confirm, not ours to assert. Our fix reaches their users
        through a change window we do not control, so `verified_by_customer` is the only honest
        closure signal and `resolution_type` records whether what we shipped was a fix or a
        workaround. A queue that closes on "answer sent" reports a resolution rate the customer
        will contest, item by item, at the next review.
    - object: customer_support.obj.core.incident
      require_properties: [is_declared, customers_notified_count, postmortem_required, credit_owed]
      note: >
        Individual notification is required here; a status page is not notification when the
        contract names a person to be called. The written postmortem is a deliverable with a
        deadline, and it is read by people who were not in the incident — so it is drafted for
        an auditor, not for the responders.
    - object: customer_support.obj.core.commitment
      require_properties: [due_at, action]
      note: >
        A promise made to an enterprise customer outlives the person who made it and the ticket
        it was made in. "We will come back to you Thursday" is minuted on their side even when
        it is nowhere on ours, and the accumulation of small unkept ones — none individually
        worth escalating — is what produces the escalation that arrives with no proximate cause.

overrides:
  capabilities.customer_support.diagnosis_and_resolution.verification_and_closure.closure_requires_customer_confirmation: true
  capabilities.customer_support.entitlement_and_sla.sla_management.pause_requires_documented_reason: true
  capabilities.customer_support.escalation_and_incident.escalation_management.receiving_owner_required: true
  capabilities.customer_support.escalation_and_incident.escalation_management.acceptance_window_is_contractual: true
  capabilities.customer_support.escalation_and_incident.postmortem.customer_facing_document_required: true
  capabilities.customer_support.knowledge_and_deflection.self_service_deflection.audience: "customer_helpdesk"
  capabilities.customer_support.intake_and_triage.priority_and_severity.severity_declared_by: "customer"

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  notes: >
    Segment branch. It composes with an operating-structure branch rather than replacing one —
    an enterprise account served by a tiered org inherits both diffs, and where they disagree
    the operating structure wins on how work moves and this branch wins on what was promised.
