# B2C support — model branch node.
#
# INHERITANCE: this file declares only what DIFFERS from its parent. Capability and object
# files are NOT copied into this branch; resolution is vertical -> model -> canonical.

identity:
  id: customer_support.model.b2c
  name: B2C Support
  kind: model
  domain: customer_support
  parent: null
  version: 0.1.0
  status: draft
  stub: false

description: >
  Supporting individual consumers. Requester, buyer and payer collapse into one person, which
  removes the whole B2B problem of a hidden economic audience and replaces it with a harder
  one: volume. The queue is large, the median contact is simple and repetitive, and the
  economics only work if most contacts never reach a human. Sentiment is public — a consumer
  who is unhappy has a review site and a social account, and the escalation path runs through
  an audience rather than through a committee. Contacts arrive in every channel at once and
  the same person will open three of them about one problem while waiting.
  The error carried in from B2B is per-ticket craftsmanship. A bespoke, carefully worded
  investigation for one consumer is not thoroughness at this volume; it is capacity taken
  from the queue behind it. The corresponding B2C-native error is assuming volume means the
  contacts are trivial — a frozen account or a missing delivery is not a small problem to the
  person it happened to, and tone failures here are the ones that end up screenshotted.

characteristics:
  requester: "the consumer themselves — buyer, user and payer in one person, with no procurement process and no patience for one"
  typical_resolution_hours: 4
  volume_shape: "very high volume, low median complexity, strongly diurnal, with campaign-, outage- and season-driven spikes an order of magnitude above baseline"
  staffing_model: "pooled agents on shared queues, no formal tiers, specialist pods for fraud/billing"
  coverage: "extended hours seven days, often 24x7 on chat"
  automation_level: "high — bots, help centre and in-product answers are expected to resolve the majority before a human is involved"

capabilities:
  emphasises:
    # Every consumer motion lives or dies on what never becomes a ticket.
    - customer_support.knowledge_and_deflection.self_service_deflection
    - customer_support.knowledge_and_deflection.ai_deflection
    - customer_support.knowledge_and_deflection.macro_management
    - customer_support.intake_and_triage.channel_intake
    - customer_support.intake_and_triage.intent_classification
    - customer_support.intake_and_triage.duplicate_and_merge
    # Tone is the product at this volume; localisation is not a nicety when the queue spans
    # a dozen languages and the macro library is the voice of the company.
    - customer_support.customer_communication.tone_and_localization
    - customer_support.customer_communication.response_drafting
    - customer_support.voice_of_customer.satisfaction_measurement
    - customer_support.voice_of_customer.sentiment_analysis
    - customer_support.support_operations.queue_management
    - customer_support.support_operations.cost_to_serve
  deactivates:
    # There is no named contact at a named account to have a relationship with. The
    # capability's whole object graph — customer_account, named_contact — has no referent for
    # a consumer, and running it here produces relationship management of a spreadsheet row.
    - customer_support.support_management.account_relationship_management

objects:
  extends:
    - object: customer_support.obj.core.ticket
      require_properties: [channel, queue]
      note: >
        Channel is load-bearing in B2C in a way it is not in B2B: the same person contacting
        by chat, app store review and DM is one problem and three tickets, and the merge
        decision cannot be made without knowing where each arrived from.
    - object: customer_support.obj.core.customer_sentiment
      note: >
        Sentiment here has an audience. A consumer's anger is a public risk as well as a
        service failure, which is why sentiment_analysis is emphasised and why the same
        polarity reading justifies a different response than it would in B2B.
    - object: customer_support.obj.core.requester
      note: >
        The requester IS the account. Anything the canonical object models as inherited from
        an organisation — entitlement, locale, history — is a property of this one person.

