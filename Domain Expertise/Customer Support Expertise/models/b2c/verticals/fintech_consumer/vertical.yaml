# Consumer fintech support — vertical branch under customer_support.model.b2c.
#
# INHERITANCE: declares only what DIFFERS from the parent. Resolution is vertical -> model ->
# canonical.

identity:
  id: customer_support.model.b2c.fintech_consumer
  name: Consumer Fintech Support
  kind: vertical
  domain: customer_support
  parent: customer_support.model.b2c
  version: 0.1.0
  status: draft
  stub: false

description: >
  Supporting people whose money is involved. This vertical differs from every other B2C branch
  on one axis that changes everything: the cost of the customer being unable to act is
  immediate, material and sometimes irreversible. A locked account is not an inconvenience, it
  is rent unpaid and a card declined at a till. Severity here is not about system health but
  about financial exposure and time, and a cosmetic defect on a payments path outranks a total
  outage on a rewards page.
  The second structural fact is that support is a regulated function. Complaints have statutory
  definitions, statutory clocks and mandatory reporting; vulnerable-customer duties change what
  an agent is permitted to say; and financial-crime controls mean the correct answer to a
  distressed, articulate customer is sometimes "I cannot tell you why". That is the inverse of
  every service instinct, and agents who cannot hold it either breach a control or break the
  relationship. Anything an agent writes is potentially disclosable evidence.
  Third, the queue is adversarial in part. Fraud claims, chargebacks and account-recovery
  requests arrive from claimants whose account of events cannot be taken at face value, mixed
  indistinguishably with genuine victims of fraud who are frightened and correct. Sorting them
  consistently, at speed, without treating victims as suspects, is the actual quality bar.
  The error carried in from ecommerce is treating goodwill as free. A goodwill payment in a
  regulated context can constitute redress, can imply liability, and is reportable.

characteristics:
  requester: "an individual whose money or access is affected right now, frequently frightened, sometimes vulnerable in the regulatory sense, and occasionally not who they claim to be"
  typical_resolution_hours: 6
  volume_shape: "steady baseline with sharp spikes on payment-rail incidents, fraud waves and pay dates; complaint volume is seasonal and regulatory-deadline shaped"
  staffing_model: "tiered with mandatory specialist pods for fraud, complaints and vulnerable customers, each with its own training and authority; general agents cannot cross into them"
  coverage: "24x7 for card, payment and fraud paths; business hours acceptable for servicing and disputes"
  automation_level: "high on balance, statement and card-control intents; deliberately low on fraud, complaints and anything touching a vulnerable customer, where an automated response is both a control failure and a reputational one"
  notes: >
    Identity verification precedes almost every substantive answer, and the verification step is
    itself a large share of contact time and of customer frustration. It is not overhead; it is
    the product working.

capabilities:
  emphasises:
    # Entitlement here means regulatory eligibility and product terms, and it gates what may even
    # be said, not merely what may be promised.
    - customer_support.entitlement_and_sla.entitlement_verification
    - customer_support.entitlement_and_sla.sla_management
    # Statutory complaint clocks are real clocks with regulators attached.
    - customer_support.entitlement_and_sla.breach_prevention
    - customer_support.escalation_and_incident.escalation_management
    - customer_support.escalation_and_incident.executive_escalation
    # Distress is the normal emotional register and mishandling it is a conduct issue.
    - customer_support.customer_communication.de_escalation
    - customer_support.customer_communication.tone_and_localization
    # Consistency across agents is a control, not a nicety; QA is the mechanism.
    - customer_support.support_management.quality_assurance
    - customer_support.support_management.agent_coaching
    # Everything written is potentially disclosable, so the record is part of the deliverable.
    - customer_support.support_management.ticket_review

objects:
  extends:
    - object: customer_support.obj.core.ticket
      require_properties: [severity, priority, resolution_type]
      note: >
        Severity and priority separate unusually violently here. A defect affecting a small number
        of customers who cannot access money outranks a large-blast-radius cosmetic fault, and a
        model that lets blast radius dominate will systematically deprioritise exactly the
        contacts that carry regulatory and human consequence.
    - object: customer_support.obj.core.requester
      require_properties: [is_admin, affected_user_ref, accessibility_needs]
      note: >
        Vulnerability is a regulated attribute with duties attached, not a soft observation. It
        changes what an agent may say, what pace the conversation runs at, and what must be
        recorded — and it has to be visible before the first reply rather than inferred from how
        the conversation goes.
    - object: customer_support.obj.core.escalation
      require_properties: [origin, reason_category, requested_at]
      note: >
        A statutory complaint is an escalation with a legally defined clock and a mandatory
        outcome record. Modelling it as an ordinary escalation loses the deadline; modelling it as
        an ordinary ticket loses the reporting obligation.
    - object: customer_support.obj.core.entitlement
      require_properties: [plan, expires_at]
      note: >
        Product terms here are regulatory as much as commercial — which protections apply, which
        limits, which jurisdiction. Over-serving is not generosity but potentially a compliance
        breach, which inverts the usual advice about goodwill.

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  notes: >
    This vertical carries duties that vary substantially by jurisdiction, so the specific clocks
    and definitions are deliberately not stated here — they belong in a tenant's organisation
    brain rather than in the profession's. What generalises is the shape: statutory clocks exist,
    complaints are a defined artefact, vulnerability changes conduct, and support output is
    disclosable.
