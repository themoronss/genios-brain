# Travel support — vertical branch under customer_support.model.b2c.
#
# INHERITANCE: declares only what DIFFERS from the parent. Resolution is vertical -> model ->
# canonical.

identity:
  id: customer_support.model.b2c.travel
  name: Travel Support
  kind: vertical
  domain: customer_support
  parent: customer_support.model.b2c
  version: 0.1.0
  status: draft
  stub: false

description: >
  Supporting travellers before, during and after a trip. Two structural facts do all the work
  here, and both are about time.
  The clock is a departure, and it is unforgiving. The same contact — "my booking is wrong" —
  is a routine amendment three weeks out and an emergency ninety minutes before a gate closes,
  because after the cutoff the cheap remedy stops existing and only the expensive, manual,
  supplier-dependent one remains. Time-to-departure, not severity and not arrival order, is the
  correct queue ordering, and a triage model that ignores it will handle contacts in the order
  that maximises the number of people who miss their trip.
  Disruption arrives as a cohort. Weather, strikes, cancellations and technical events do not
  produce a gradual rise; they produce every affected passenger contacting simultaneously,
  through every channel, about the same event, with the same three questions. Handling that as
  individual tickets guarantees that most people are answered after the situation has already
  resolved itself badly.
  Underneath both, the remedy usually belongs to somebody else. Fare rules, carrier policy,
  hotel terms and supplier refund latency bound what may be offered, and duty-of-care
  obligations to a stranded passenger apply regardless of whose fault it was.
  The error carried in from consumer ecommerce is treating this as a refunds queue. A refund is
  the worst available outcome for someone standing in an airport — what they need is to still
  travel — and an operator who reaches for money first has solved the wrong problem expensively.

characteristics:
  requester: "the traveller, often mid-journey, frequently on a phone, in another timezone, with a deadline they cannot move and sometimes without connectivity"
  typical_resolution_hours: 3
  volume_shape: "seasonal baseline plus violent event-driven surges — one weather system or strike can produce a day's volume in an hour, entirely from one affected cohort"
  staffing_model: "pooled agents with an in-trip/disruption desk held separate from pre-travel sales and post-travel claims"
  coverage: "24x7 and genuinely global; someone is always mid-journey somewhere"
  automation_level: "high on pre-travel self-service and check-in, deliberately lower in-trip — a bot that cannot rebook is an obstacle to a passenger at a gate"
  notes: >
    The three phases — pre-travel, in-trip, post-travel — behave like three different support
    organisations sharing a brand. Staffing and measuring them as one queue is the most common
    structural error in this vertical.

capabilities:
  emphasises:
    # Ordering by time-to-departure is the defining judgement and it looks wrong from outside.
    - customer_support.intake_and_triage.priority_and_severity
    - customer_support.intake_and_triage.routing_and_assignment
    # A disruption is one event with a passenger manifest attached, not N tickets.
    - customer_support.escalation_and_incident.incident_management
    - customer_support.escalation_and_incident.major_incident_communication
    # Surges are partly forecastable and always require pre-positioned coverage.
    - customer_support.support_operations.capacity_planning
    - customer_support.entitlement_and_sla.coverage_and_on_call
    # Stranded, tired and out of options is a distinct emotional state with its own handling.
    - customer_support.customer_communication.de_escalation

objects:
  extends:
    - object: customer_support.obj.core.ticket
      require_properties: [priority, resolution_target_at]
      note: >
        The resolution target is the departure, not a service promise. When the contractual clock
        and the flight disagree the flight wins, and any system that only knows the contractual
        clock will report a healthy queue while the cabin doors close.
    - object: customer_support.obj.core.incident
      require_properties: [affected_customer_count, blast_radius, broadcast_cadence_minutes]
      note: >
        Blast radius here is a route, a date and a supplier, which makes the affected population
        exactly enumerable in advance of them contacting us. That is unusual and it is the whole
        opportunity: a disruption is one of the few consumer events where proactive contact can
        genuinely empty the queue that is about to form.
    - object: customer_support.obj.core.requester
      require_properties: [timezone, preferred_channel, language]
      note: >
        A traveller is by definition not where they normally are. Their local time, the channel
        that works on foreign data roaming, and the language they need under stress are all
        different from what their profile says, and getting any of the three wrong turns a
        recoverable situation into an unreachable one.
    - object: customer_support.obj.core.customer_sentiment
      require_properties: [public_exposure]
      note: >
        Distress in transit is qualitatively different from dissatisfaction with a purchase, and
        it photographs well. Reading it as ordinary consumer anger under-rates both the human
        situation and the reputational one.

