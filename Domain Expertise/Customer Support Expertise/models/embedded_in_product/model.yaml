# Embedded-in-Product Support — model branch node.
#
# INHERITANCE: this file declares only what DIFFERS from canonical. No capability file and no
# object file is copied into this branch; resolution is vertical -> model -> canonical.
#
# READING THE CAPABILITY DIFF
#   activates    canonical capabilities a default support org runs nominally or not at all,
#                and that this branch cannot function without.
#   deactivates  canonical capabilities that do not exist in this motion at all.
#   emphasises   present either way, disproportionately load-bearing here.

identity:
  id: customer_support.model.embedded_in_product
  name: Embedded-in-Product Support
  kind: model
  domain: customer_support
  parent: null
  version: 0.1.0
  status: draft
  stub: false

description: >
  Support lives inside the product: a widget on the screen where the problem happened, opened
  by someone who is signed in, mid-task, at the moment of failure. This branch has the best
  context in the entire domain and the worst reach, and every property worth knowing about it
  follows from that pair.
  .
  The context is genuinely exceptional. Identity, plan, tenant, product version, the screen they
  are on, the last few actions they took and the error the system already logged all arrive
  attached to the contact. The reproduction interview — what were you doing, what did you see,
  what browser, can you send a screenshot — largely disappears, and with it the two-day round
  trip that dominates every other branch's cycle time. Intent is close to known before a word is
  read, because the screen is the strongest intent prior available anywhere in this library.
  .
  The reach is the problem, and it fails in exactly the wrong direction: the harder the failure,
  the less likely the channel works. A user who cannot log in cannot reach in-app support. An
  account that lapsed cannot reach it. During an outage the widget goes down with the product,
  at the precise moment demand peaks and the company most needs a channel. So the queue in this
  branch is systematically missing its most damaged users, and it is missing them silently — the
  absence looks like calm. Any reading of health from this queue alone is a reading taken from a
  population that excludes everyone we hurt most.
  .
  The corollary is that the fallback channel is load-bearing infrastructure, not a legacy
  convenience. Status page, email address, a route that survives the product being down: these
  are the branch's incident response, and they are the first thing cut when the in-app numbers
  look good.
  .
  Third structural fact: demand is generated by the interface. Where the entry point is placed
  decides who contacts support and about what — a widget on the billing screen and a widget in
  the admin console produce entirely different populations, volumes and tempers. That placement
  is a support-operations decision that is, in practice, made by product designers who have
  never seen the queue, and it is the single cheapest lever on volume that support does not hold.
  .
  What an operator carries over wrongly from email: async tolerance. A widget implies chat
  speed whether or not anyone staffed it for chat speed, and the conversation is anchored to a
  session that ends when the tab closes. A reply sent four hours later arrives to a person who
  has left, in a context that no longer exists, and reads as no reply at all. Either the channel
  is staffed to its implied promise or the implied promise is changed at the widget, and
  changing it at the widget is a product change support has to negotiate for.

characteristics:
  requester: "a signed-in user in the middle of the task that failed — always the affected person, rarely a proxy, and therefore emotional and imprecise in a way B2B ticket queues rarely are"
  typical_resolution_hours: 4
  volume_shape: "tracks feature usage and release timing rather than account count; a redesign or a new entry point moves volume more than any change in product quality"
  staffing_model: "a chat-speed pool with product depth, sitting close to engineering, plus an asynchronous overflow for anything that outlives the session"
  coverage: "whenever the widget is visible, which is 24x7 unless it is deliberately hidden — hiding it outside staffed hours is the honest option and is almost never taken"
  automation_level: "high, and unusually effective, because the answer can be selected by the screen the person is standing on rather than by what they managed to type"
  primary_channels: [in_app, chat, help_center, email]
  notes: >
    The population bias is the fact to carry into every metric this branch produces. Satisfaction,
    volume, sentiment and intent distributions are all measured on people who could still reach
    us. The users with the worst experience are structurally absent from the sample, so this
    branch's dashboards are not merely incomplete, they are biased in a known direction, and any
    trend read from them should be read as a lower bound on harm.

capabilities:

  # channel_intake is plumbing almost everywhere and is a demand-shaping decision here: entry
  # point placement IS the volume curve, and it is owned by product. diagnostics is activated
  # because the capability changes character — elsewhere it is an interview conducted with the
  # customer, here it is a read of telemetry that arrived before the message did, and the skill
  # moves from extraction to interpretation.
  activates:
    - customer_support.intake_and_triage.channel_intake
    - customer_support.diagnosis_and_resolution.diagnostics

  # Nothing. The seductive deletion is issue_reproduction, on the grounds that the environment,
  # the version and the error all arrive automatically so there is nothing left to reproduce. It
  # is wrong in the way telemetry is always wrong: it records what happened and never what the
  # person was trying to do. The gap between the logged action and the intended outcome is
  # exactly where this branch's hardest tickets live, and it is only reachable by asking.
  deactivates: []

  emphasises:
    - customer_support.intake_and_triage.intent_classification
    - customer_support.knowledge_and_deflection.self_service_deflection
    - customer_support.customer_communication.expectation_setting
    - customer_support.customer_communication.response_drafting
    - customer_support.escalation_and_incident.major_incident_communication
    - customer_support.knowledge_and_deflection.content_gap_analysis
    - customer_support.voice_of_customer.product_feedback_routing
    - customer_support.voice_of_customer.feedback_synthesis
    - customer_support.diagnosis_and_resolution.issue_reproduction

  # major_incident_communication is emphasised for a reason specific to this branch: during a
  # major incident the primary support channel is part of the thing that is down. Every other
  # model can talk to its customers while the product is broken. This one has to have arranged
  # that in advance, and the arrangement is used perhaps twice a year, which is why it is
  # invariably found to be stale at the moment it is needed.

objects:
  extends:
    - object: customer_support.obj.core.ticket
      require_properties: [channel, product_area_ref, conversation_ref, created_at]
      note: >
        `product_area_ref` is an inference almost everywhere and a fact here — the screen is
        known. That makes this branch's tickets unusually good input to aggregation, and it is
        the reason a small embedded team can hand product a defensible defect ranking that a
        large email queue cannot. `conversation_ref` is mandatory because the session, not the
        ticket, is the unit the customer experiences; a ticket that outlives its conversation
        has to be deliberately re-opened in a channel that survives, and if that does not happen
        it is abandoned rather than closed.
    - object: customer_support.obj.core.requester
      require_properties: [is_affected_user, product_familiarity, language]
      note: >
        The requester is always the person the problem happened to. That sounds trivial and is
        not: every B2B habit for handling a proxy reporter — asking them to check with the user,
        deferring for detail, discounting emotional register — is wrong here and reads as
        disbelief. `product_familiarity` carries more weight than seniority, because the same
        error message means an onboarding defect to one user and a genuine bug to another.
    - object: customer_support.obj.core.knowledge_article
      require_properties: [intent_covered, findability, locale]
      note: >
        Findability in this branch is not a search problem, it is a placement problem: the right
        article is chosen by the screen and shown before anyone types. That makes coverage of
        specific screens the operational unit, and it means an article can be excellent, correct
        and completely ineffective because nothing points at it from the place the problem occurs.
    - object: customer_support.obj.core.incident
      require_properties: [is_customer_visible, status_page_published, comms_owner_ref]
      note: >
        The one object where this branch is structurally weaker than every other. When the
        product is down, the channel is down, so `status_page_published` is not a communications
        nicety — it is the only remaining path to the customers who are affected, and the count
        of people we could not reach is not knowable from inside this branch at all.

overrides:
  capabilities.customer_support.intake_and_triage.channel_intake.entry_points_owned_by: "product"
  capabilities.customer_support.intake_and_triage.intent_classification.strongest_prior: "screen_context"
  capabilities.customer_support.diagnosis_and_resolution.diagnostics.context_source: "session_telemetry"
  capabilities.customer_support.knowledge_and_deflection.self_service_deflection.selection_key: "screen_context"
  capabilities.customer_support.escalation_and_incident.major_incident_communication.primary_channel_fails_with_product: true
  capabilities.customer_support.support_operations.support_analytics.population_excludes_locked_out_users: true

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  notes: >
    This branch is the strongest argument in the domain for the planned telemetry fact paths.
    Everything it does well depends on session context arriving with the contact, and nothing in
    the shipped substrate carries any of it — the engine can see a thread and not a screen, so
    the branch's defining advantage is currently unreadable and every pattern that would exploit
    it is needs_signal.
