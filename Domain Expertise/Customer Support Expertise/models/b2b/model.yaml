# B2B support — model branch node.
#
# INHERITANCE: this file declares only what DIFFERS from its parent. Capability and object
# files are NOT copied into this branch; resolution is vertical -> model -> canonical.

identity:
  id: customer_support.model.b2b
  name: B2B Support
  kind: model
  domain: customer_support
  parent: null
  version: 0.1.0
  status: draft
  stub: false

description: >
  Supporting an organisation that bought from us. The defining structural fact is that the
  person in the ticket is almost never the person who signed the contract and almost never
  the person who renews it. A ticket therefore has two audiences — the requester, who wants
  their problem to stop, and the account, which is quietly scoring whether we are safe to
  keep. Entitlement is real, written down and checkable, so what may be promised is bounded
  before an agent opens their mouth. Volume is moderate and complexity is high: the questions
  are configuration-specific, which is why deflection rates that look normal in consumer
  support are unachievable here and chasing them wastes a year.
  The error an operator carries in from B2C is treating ticket closure as the unit of
  success. Closing an admin's ticket in nine minutes while the economic buyer hears nothing
  for a quarter is how an account with a clean support dashboard churns.

characteristics:
  requester: "an administrator, developer or power user at the customer, rarely the buyer and never the signatory"
  typical_resolution_hours: 24
  volume_shape: "moderate volume, high complexity, business-hours concentrated, spiky around the customer's own release and upgrade windows"
  staffing_model: "tiered L1/L2/L3 with a named escalation owner per account tier"
  coverage: "business hours in the customer's region, on-call for severity-1"
  automation_level: "moderate — macros and a knowledge base carry the repetitive third; the rest is configuration-specific and resists deflection"
  notes: "The canonical capability set is closest to this motion, so this branch mostly emphasises rather than adds or removes."

capabilities:
  emphasises:
    # Entitlement and the SLA clock are contractual here, not a service standard we set
    # ourselves. Getting them wrong is a commercial event, not a quality one.
    - customer_support.entitlement_and_sla.entitlement_verification
    - customer_support.entitlement_and_sla.sla_management
    - customer_support.entitlement_and_sla.breach_prevention
    # The account is the unit that renews, and it is invisible in the ticket.
    - customer_support.support_management.account_relationship_management
    - customer_support.escalation_and_incident.escalation_management
    - customer_support.escalation_and_incident.executive_escalation
    # Most hard B2B tickets end at an engineer, not an answer.
    - customer_support.escalation_and_incident.engineering_handoff
    - customer_support.voice_of_customer.churn_signal_detection

objects:
  extends:
    - object: customer_support.obj.core.entitlement
      require_properties: [plan, coverage_hours, expires_at]
      note: >
        Entitlement is checked, never assumed, in every B2B branch. An agent who promises a
        four-hour response the contract does not carry has created a liability out of
        goodwill, and the customer will quote it back for the rest of the term.
    - object: customer_support.obj.core.sla_target
      require_properties: [clock_state]
      note: >
        Clock state is mandatory here because `waiting_on_customer` and `open` look identical
        on a board and mean opposite things about whether we are currently in breach.
    - object: customer_support.obj.core.escalation
      note: >
        An escalation without a named receiving owner is a complaint. In B2B that named owner
        is frequently on the customer's side of the table too — their internal sponsor — and
        an escalation that only names ours is half-mapped.

