# Logistics support — vertical branch under customer_support.model.b2b.
#
# INHERITANCE: declares only what DIFFERS from the parent. Resolution is vertical -> model ->
# canonical.

identity:
  id: customer_support.model.b2b.logistics
  name: Logistics Support
  kind: vertical
  domain: customer_support
  parent: customer_support.model.b2b
  version: 0.1.0
  status: draft
  stub: false

description: >
  Supporting freight, fulfilment and supply-chain operations. The subject of the ticket is
  moving, and that single fact rewrites triage.
  Ordering is by time-to-irreversibility, not by severity. A shipment two hours from a vessel
  cutoff outranks a worse problem with a week of slack, because after the cutoff the cheap fix
  stops existing and the expensive one — re-booking, air freight, demurrage — is all that is
  left. A queue sorted by severity and arrival time will handle the bigger problem first and pay
  for the privilege. This is the vertical where an expert's ordering looks wrong to everyone who
  has not done the job.
  The truth is distributed and none of it is ours. Carriers, customs brokers, ports and
  warehouses each hold one fragment of what happened, each answers on their own timeline, and
  several of them are legally the only party who may act. Support here is exception management
  against third parties, so the load-bearing skills are chasing, corroborating and telling the
  customer something true while it is still unknown.
  Every ticket carries a downstream promise. The customer has already told their customer a
  date, so a delay is not an inconvenience to them — it is a broken promise they now have to
  make on our behalf. That is why status updates that say nothing new still have value here and
  nowhere else.
  The error carried in from SaaS is waiting until there is an answer before writing. By then the
  window has closed and the customer has spent the intervening hours assuming we did not know.

characteristics:
  requester: "a shipping coordinator, warehouse supervisor or transport planner with a live operational deadline and several other exceptions open at the same time"
  typical_resolution_hours: 6
  volume_shape: "disruption-driven rather than release-driven — weather, port congestion, customs holds and strikes create correlated regional surges with no warning"
  staffing_model: "pooled exception desks by lane or region, with carrier-liaison specialists and follow-the-sun handover along the freight's own timezone"
  coverage: "24x7 across the lanes in motion; a shipment does not stop at 6pm and neither can the desk that owns it"
  automation_level: "high on tracking and status, low on exception resolution — the visibility layer deflects the where-is-it questions and concentrates the queue into genuine exceptions"
  notes: >
    Because tracking automation removes the easy contacts, the residual queue is harder per
    ticket than the raw volume suggests. Staffing this vertical from ticket counts alone
    reliably under-resources it.

capabilities:
  emphasises:
    # Ordering by decision window rather than by damage is the defining judgement here.
    - customer_support.intake_and_triage.priority_and_severity
    # Saying something true while it is still unknown, on a cadence, to a customer who has their
    # own customer waiting.
    - customer_support.customer_communication.proactive_status_updates
    - customer_support.customer_communication.expectation_setting
    - customer_support.entitlement_and_sla.commitment_tracking
    # Third parties hold both the facts and the fix, so escalation is mostly external.
    - customer_support.escalation_and_incident.escalation_management
    # A regional disruption is one event with hundreds of tickets attached.
    - customer_support.escalation_and_incident.incident_management
    - customer_support.support_operations.workload_balancing

objects:
  extends:
    - object: customer_support.obj.core.ticket
      require_properties: [priority, commitment_ref, resolution_target_at]
      note: >
        The resolution target here is set by the physical world — a cutoff, a sailing, a
        delivery window — and not by the support plan. When the contractual clock and the
        operational deadline disagree, the operational one is the real one, and a system that
        only knows the contractual clock will report a healthy queue full of missed shipments.
    - object: customer_support.obj.core.commitment
      note: >
        A commitment in this vertical is usually a promise the customer will immediately repeat
        to their own customer. That relay is what makes vagueness expensive: "later today" is
        forwarded as a date, and the person who forwarded it takes the damage when it slips.
    - object: customer_support.obj.core.escalation
      require_properties: [receiving_owner_ref, receiver_accepted_at]
      note: >
        Most escalations here leave our organisation, which makes acceptance the only meaningful
        proof of transfer. An email to a carrier's exceptions inbox is not an escalation, it is
        a message, and treating the two as equivalent is how a shipment sits unowned across a
        weekend.
    - object: customer_support.obj.core.incident
      require_properties: [blast_radius, affected_account_count]
      note: >
        Blast radius here is geographic and temporal — a lane, a port, a window — and it lets
        the desk answer the question every affected customer is about to ask before they ask it.
        A port closure handled as four hundred individual tickets is four hundred inconsistent
        answers to the same question.

