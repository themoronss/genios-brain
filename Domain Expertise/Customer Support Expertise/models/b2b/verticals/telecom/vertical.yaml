# Telecom support — vertical branch under customer_support.model.b2b.
#
# INHERITANCE: declares only what DIFFERS from the parent. Resolution is vertical -> model ->
# canonical.

identity:
  id: customer_support.model.b2b.telecom
  name: Telecom Support
  kind: vertical
  domain: customer_support
  parent: customer_support.model.b2b
  version: 0.1.0
  status: draft
  stub: false

description: >
  Supporting business connectivity and voice services. This is the vertical where support
  process is industrialised, and the three consequences are unusually concrete.
  The SLA is an invoice. Availability and restoration targets carry contractual service credits
  that are computed from clock data and paid out, so clock accuracy is an accounting control
  rather than a reporting nicety. A pause applied incorrectly is not a dashboard artefact; it is
  a billing dispute the customer's procurement team will pursue, and a breach we failed to
  self-declare is worse than the outage that caused it.
  Most faults are not on our equipment. The path runs across last-mile access we resell,
  peering we do not own, and customer premises equipment nobody has looked at in four years. The
  actual craft is sectionalisation — proving which segment is at fault before committing an
  engineer — and it is slow, adversarial and mostly conducted against other carriers who have
  their own trouble-ticket process and their own clocks that do not align with ours.
  Planned work is a different object from a fault. A degradation inside a notified maintenance
  window is contractually not an outage, and a customer reporting one has usually not read the
  notice — which makes proactive notification a support function with commercial consequences
  rather than an operations courtesy.
  The error carried in from SaaS is treating the SLA as a service standard we set for ourselves
  and can miss with an apology. The error carried in from hardware is assuming we can dispatch
  our way out; here the engineer frequently has to be someone else's.

characteristics:
  requester: "a network or IT manager at the customer, often reading the same alarms we are, and frequently already on a bridge with their own users waiting"
  typical_resolution_hours: 8
  volume_shape: "steady trouble-ticket baseline with hard correlated spikes on any core, access or upstream event; a single fibre cut generates a synchronised wave"
  staffing_model: "NOC-fronted with tiered field and core engineering, formal shift handover, and carrier-to-carrier escalation paths"
  coverage: "24x7 by construction — the network does not observe business hours and neither can the fault desk"
  automation_level: "high on detection and correlation, low on customer resolution — alarms self-raise tickets long before anyone can explain them"
  notes: >
    Detection automation without correlation is a known failure here: one fibre cut can auto-raise
    hundreds of tickets, and a queue that treats them as hundreds of problems has already lost the
    outage.

capabilities:
  emphasises:
    # The clock is money. Everything about how it starts, pauses and stops is contractual.
    - customer_support.entitlement_and_sla.sla_management
    - customer_support.entitlement_and_sla.breach_prevention
    # Carrier-grade incident process: declare, bridge, notify on cadence, close formally.
    - customer_support.escalation_and_incident.incident_management
    - customer_support.escalation_and_incident.major_incident_communication
    - customer_support.escalation_and_incident.postmortem
    # Sectionalisation is the real diagnostic skill and it involves third parties.
    - customer_support.diagnosis_and_resolution.diagnostics
    # Alarm storms make deduplication a prerequisite for seeing anything at all.
    - customer_support.intake_and_triage.duplicate_and_merge
    - customer_support.entitlement_and_sla.coverage_and_on_call

objects:
  extends:
    - object: customer_support.obj.core.sla_target
      require_properties: [clock_state, exclusions, credit_exposure, is_contractual]
      note: >
        Credit exposure has to be visible on the live clock, not computed at month end, because
        it is what makes prioritisation rational under load — two breaching tickets with different
        credit consequences are not equally urgent. Exclusions are mandatory for the same reason:
        maintenance windows and force-majeure carve-outs are the difference between a breach and
        a non-event, and they are agreed in the contract, not decided at triage.
    - object: customer_support.obj.core.incident
      require_properties: [declared_at, broadcast_cadence_minutes, affected_account_count, comms_owner_ref]
      note: >
        A named communications owner separate from the incident commander is standard here for a
        reason: the commander is on the technical bridge and cannot also be writing customer
        updates on a fixed cadence, and when one person tries to do both, the updates stop
        exactly when the customers most need them.
    - object: customer_support.obj.core.ticket
      require_properties: [severity, product_area_ref, escalation_ref]
      note: >
        Product area here means network segment, and it is what allows a hundred tickets to
        collapse into one fault. A ticket without it is a customer complaint with no path to the
        cause, which is precisely what an alarm-generated queue fills up with.

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  notes: >
    typical_resolution_hours of 8 is a median across a bimodal queue — configuration and voice
    faults close in an hour, physical access faults take days waiting on a third-party engineer.
    The bimodality is the point and averaging it away is how this vertical gets mis-staffed.
