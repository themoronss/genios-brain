# B2B SaaS support — vertical branch under customer_support.model.b2b.
#
# INHERITANCE: declares only what DIFFERS from the parent. Resolution is vertical -> model ->
# canonical.
#
# HONESTY NOTE: this is the vertical the canonical B2B model was implicitly written against, so
# the diff is deliberately small. Two structural facts are genuinely specific and everything
# else is inherited unchanged — see the description. Padding this file with invented differences
# would make the tree look richer and reason worse.

identity:
  id: customer_support.model.b2b.saas
  name: B2B SaaS Support
  kind: vertical
  domain: customer_support
  parent: customer_support.model.b2b
  version: 0.1.0
  status: draft
  stub: false

description: >
  Multi-tenant software sold to businesses. This vertical inherits almost everything from B2B
  support — entitlement is contractual, the requester is an admin and not the buyer, complexity
  is configuration-specific — and only two things are structurally its own.
  First, multi-tenancy collapses "one ticket" into "an incident" faster than anywhere else in
  the domain. The same defect reaches every tenant on the same code path simultaneously, so the
  third similar report inside an hour is not a coincidence to be triaged three times; it is an
  incident that has not been declared yet, and the deduplication decision is the highest-value
  judgement in the queue.
  Second, the resolution locus is our own codebase. We can unilaterally ship the fix, which
  means "workaround now, fix next release" is a genuine two-step plan rather than a euphemism
  for abandonment — and it also means an unfixed defect is a choice we made, which customers
  correctly read as one.
  The error an operator carries in from hardware_iot or logistics is assuming resolution needs
  a third party and pacing the customer accordingly. The error carried in from B2C is treating
  a burst of similar tickets as a volume problem to staff around rather than a single fault to
  find.

characteristics:
  requester: "an admin, developer or integration owner inside the customer, usually technical enough to have already read the docs"
  typical_resolution_hours: 20
  volume_shape: "moderate and business-hours shaped, with sharp post-deploy spikes on our release calendar and on the customer's own upgrade windows"
  staffing_model: "tiered L1/L2 with product-area specialists and a standing engineering escalation rota"
  coverage: "business hours per region, on-call for severity-1 and for declared incidents"
  automation_level: "moderate — docs and macros cover the how-do-I third; the configuration-specific remainder resists deflection and always will"
  notes: >
    typical_resolution_hours is the median across a queue whose tail is very long: a config
    question closes in an hour, a confirmed defect waits for a release train. Reading the median
    as the experience is the classic SaaS support reporting error.

capabilities:
  emphasises:
    # Multi-tenancy means correlation IS triage. Merging is not queue hygiene here; it is how a
    # platform-wide fault gets noticed before the customers notice it for us.
    - customer_support.intake_and_triage.duplicate_and_merge
    - customer_support.escalation_and_incident.incident_management
    # We own the code, so the diagnosis chain runs all the way to a cause and a filed bug —
    # there is no third party to stop at.
    - customer_support.diagnosis_and_resolution.root_cause_analysis
    - customer_support.escalation_and_incident.engineering_handoff
    - customer_support.voice_of_customer.product_feedback_routing
    # Every release invalidates part of the knowledge base. Unmaintained articles do more damage
    # in SaaS than in any vertical where the product stands still.
    - customer_support.knowledge_and_deflection.knowledge_authoring

objects:
  extends:
    - object: customer_support.obj.core.ticket
      require_properties: [product_area_ref, issue_ref]
      note: >
        Both become mandatory because they are what makes clustering possible. A ticket without
        a product area cannot join the count that declares an incident, and a ticket without an
        issue link cannot tell you that forty customers hit the same thing — which is exactly
        the question the roadmap needs support to answer.
    - object: customer_support.obj.core.incident
      note: >
        Blast radius here is a tenant list, not an estimate. A shared code path makes the
        affected population computable rather than guessed, and an incident record that leaves
        it blank in SaaS is under-using information we already have.
    - object: customer_support.obj.core.knowledge_article
      require_properties: [verified_against_version]
      note: >
        Article accuracy has a version, not a date. An article verified last month against a
        release that shipped since is stale in a way a timestamp cannot express, and stale
        self-service is worse than absent self-service because it burns the customer's trust
        before they reach a human.

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  notes: >
    Deliberately the thinnest vertical in the tree. If a future reviewer finds this file
    unsatisfyingly short, the correct response is to check whether the canonical B2B model is
    quietly SaaS-shaped, not to invent SaaS specifics here.
