purpose:
  statement: A fix that works is weak evidence for the cause it was based on.
heuristic:
  statement: A fix that works is weak evidence for the cause it was based on.
  why: Most remediations change several things at once, and restarts, cache clears and reinstalls resolve
    faults of entirely unrelated origin. Confirmation requires the mechanism to predict something else
    that is then checked — ideally that the symptom returns when the condition is recreated.
