purpose:
  statement: Two affected customers with nothing in common tell you more than fifty who share a configuration.
heuristic:
  statement: Two affected customers with nothing in common tell you more than fifty who share a configuration.
  why: Shared configuration explains the symptom too easily and leaves the hypothesis space wide. Disjoint
    contexts force the cause upward to something those customers genuinely share, which is usually the
    platform, the data path, or a default nobody remembers setting.
