purpose:
  statement: A root cause that names a person is not a root cause.
heuristic:
  statement: A root cause that names a person is not a root cause.
  why: Blame terminates the analysis exactly one question early, and it feels like completion, which
    is why it is the most common stopping point in the industry. The useful question is never "who did
    it" but "why did the system accept it" — and an organisation whose leading root cause is human error
    has learned something about its analysis, not about its systems.
