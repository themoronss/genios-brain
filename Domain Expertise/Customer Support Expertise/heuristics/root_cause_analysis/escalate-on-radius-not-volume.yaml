purpose:
  statement: Escalate on blast radius and irreversibility, not on ticket volume.
heuristic:
  statement: Escalate on blast radius and irreversibility, not on ticket volume.
  why: Volume is the metric the queue surfaces naturally, so loud cosmetic faults outrank quiet destructive
    ones by default. A single silent data-corruption report outranks a wave of rendering complaints,
    and nothing in the tooling will tell you that.
