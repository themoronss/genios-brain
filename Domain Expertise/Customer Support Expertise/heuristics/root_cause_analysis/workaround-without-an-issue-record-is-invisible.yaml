purpose:
  statement: A workaround shipped with no issue record open means the fault has become invisible rather
    than fixed.
heuristic:
  statement: A workaround shipped with no issue record open means the fault has become invisible rather
    than fixed.
  why: Once the tickets close, the queue stops reporting it, prioritisation stops seeing it, and the
    defect survives only as tribal knowledge among the agents who happened to handle it. This is how
    products accumulate faults that everyone works around and nobody can name.
  reads:
  - customer_support.obj.core.issue
  - customer_support.obj.core.ticket
