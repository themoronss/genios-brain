purpose:
  statement: Assume the fault has been shipping quietly for far longer than the ticket has existed.
heuristic:
  statement: Assume the fault has been shipping quietly for far longer than the ticket has existed.
  why: Reports require a customer to notice, care, and bother — three filters, each of which loses most
    occurrences. "It started last week" almost always means "we noticed last week", and treating it
    as an onset date wrecks the timeline.
