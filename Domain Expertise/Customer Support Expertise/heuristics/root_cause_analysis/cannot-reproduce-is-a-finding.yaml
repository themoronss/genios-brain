purpose:
  statement: Cannot reproduce is a finding, not a dead end.
heuristic:
  statement: Cannot reproduce is a finding, not a dead end.
  why: It eliminates deterministic, universal faults outright, and points at environment, state, timing,
    data, or a description that does not match what the customer actually did. Each of those has a different
    next move; closing the ticket takes all of them off the table at once and the fault is rediscovered
    from zero next time.
  applies_when: reproduction has been attempted seriously in an environment resembling the customer's
