purpose:
  statement: Intermittent means state-dependent until proven otherwise. Randomness is a claim about
    your instrumentation, not about the system.
heuristic:
  statement: Intermittent means state-dependent until proven otherwise. Randomness is a claim about
    your instrumentation, not about the system.
  why: Software is deterministic given all of its inputs, and the input you are missing is usually time,
    ordering, cache contents, concurrency, or another tenant's activity. Accepting "random" ends the
    search at the point it became interesting.
