  name: Symptom is not the fault
  kind: heuristic
  domain: customer_support
  scope: capability
  owner_capability: customer_support.diagnosis_and_resolution.root_cause_analysis
  subdomain: diagnosis_and_resolution
  version: 1.0.0
  status: draft
purpose:
  statement: The reported symptom is almost never the fault. It is the outermost point at which the
    fault became visible to someone with a keyboard.
heuristic:
  statement: The reported symptom is almost never the fault. It is the outermost point at which the
    fault became visible to someone with a keyboard.
  why: Customers can only report what their layer of the system exposes, and error surfaces are designed
    to be generic. The distance between the symptom and the fault is roughly the depth of the stack
    between them, which is why the fix that matches the symptom's wording is nearly always the wrong
    fix.
  reads:
  - customer_support.obj.core.ticket
  - customer_support.obj.core.issue
