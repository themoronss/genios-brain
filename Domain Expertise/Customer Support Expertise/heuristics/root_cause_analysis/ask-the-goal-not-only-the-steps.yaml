purpose:
  statement: Ask what the customer was trying to achieve, not only what they did.
heuristic:
  statement: Ask what the customer was trying to achieve, not only what they did.
  why: Their account of the steps is filtered through their model of the product, and that model is
    often the defect. The goal is unfiltered, and the gap between the goal and the steps is frequently
    the whole issue.
  reads:
  - customer_support.obj.core.requester
