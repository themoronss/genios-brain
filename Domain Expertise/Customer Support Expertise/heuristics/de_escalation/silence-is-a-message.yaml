purpose:
  statement: Silence is a message, and usually the worst one available.
heuristic:
  statement: Silence is a message, and usually the worst one available.
  why: An unanswered thread does not read as neutral; it reads as deprioritised. The customer writes
    their own explanation for the gap and it is invariably less flattering than the true one, which
    is normally that we were waiting to have something worth saying.
  reads:
  - customer_support.obj.core.ticket
  - customer_support.obj.core.conversation
