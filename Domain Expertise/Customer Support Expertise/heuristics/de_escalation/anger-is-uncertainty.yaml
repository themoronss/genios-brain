identity:
  id: customer_support.heu.de_escalation.anger_is_uncertainty
  name: Anger is uncertainty
  kind: heuristic
  domain: customer_support
  scope: capability
  owner_capability: customer_support.customer_communication.de_escalation
  subdomain: customer_communication
  version: 1.0.0
  status: draft
purpose:
  statement: Anger is almost always about uncertainty or about not being heard, not about the defect.
heuristic:
  statement: Anger is almost always about uncertainty or about not being heard, not about the defect.
  why: The defect existed before the anger did and produced none of it. What produced it was a period
    in which the customer could not tell whether anyone was working, or a retelling that landed on someone
    who started from the beginning. Teams that treat the fault as the grievance ship the fix and are
    genuinely surprised the customer is still angry.
  reads:
  - customer_support.obj.core.customer_sentiment
  - customer_support.obj.core.conversation
  - customer_support.obj.core.ticket
