purpose:
  statement: Anger apparently aimed at a person is often anger about being handed around.
heuristic:
  statement: Anger apparently aimed at a person is often anger about being handed around.
  why: Transfers cost us almost nothing and cost the customer the whole story again. The current agent
    inherits the accumulated heat of every previous handover and reads it as hostility toward them personally,
    which is the fastest route to matching the emotion.
  reads:
  - customer_support.obj.core.ticket
  - customer_support.obj.core.requester
