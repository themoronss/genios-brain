purpose:
  statement: Before escalating, ask what the new owner can do that the current one cannot. `They are
    more senior` is not an answer.
heuristic:
  statement: Before escalating, ask what the new owner can do that the current one cannot. `They are
    more senior` is not an answer.
  why: An escalation without a capability difference is a complaint being routed. It teaches the customer
    that seniority is the unlock, and it teaches the organisation that escalations are about temperature
    rather than about authority or access.
  reads:
  - customer_support.obj.core.escalation
