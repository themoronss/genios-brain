purpose:
  statement: The word `policy` in an early reply is a de-escalation failure regardless of what follows
    it.
heuristic:
  statement: The word `policy` in an early reply is a de-escalation failure regardless of what follows
    it.
  why: It relocates the decision to an entity the customer cannot argue with, which is exactly the powerlessness
    the anger is a response to. The same constraint stated as our own choice — what we can do, what
    we cannot, and who could change it — leaves the customer with a person to deal with.
