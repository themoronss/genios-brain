purpose:
  statement: If the customer repeats themselves, stop advancing — they have not been heard yet.
heuristic:
  statement: If the customer repeats themselves, stop advancing — they have not been heard yet.
  why: Repetition is not emphasis and it is not stubbornness; it is the reliable signal that our last
    message did not land. Continuing to push the resolution forward from that point makes every subsequent
    message land the same way.
