heuristic:
  statement: A specific next time beats a sincere apology.
  why: Apology asks for trust in our feelings; a time asks for trust in our calendar, and only the second
    is checkable. A customer who has been let down has stopped extending the first kind of credit and
    will still extend the second, once.
