purpose:
  statement: Do not correct the customer's version of events while the temperature is up.
heuristic:
  statement: Do not correct the customer's version of events while the temperature is up.
  why: The correction will still be available later and the relationship may not be. Winning the factual
    point in the moment is the most expensive small victory in support, and it converts a solvable contact
    into a dispute about who is honest.
