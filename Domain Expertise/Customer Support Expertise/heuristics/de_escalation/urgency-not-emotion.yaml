purpose:
  statement: Match the customer's urgency exactly; do not match their emotion at all.
heuristic:
  statement: Match the customer's urgency exactly; do not match their emotion at all.
  why: Urgency is a claim about the clock and matching it is how we show we agree about the stakes.
    Emotion is a state, and reflecting it back removes the one thing the customer needs from this exchange
    — the sense that someone on the other end is steady.
