purpose:
  statement: The loudest customers are usually the ones still trying. Worry harder about the polite
    short ones.
heuristic:
  statement: The loudest customers are usually the ones still trying. Worry harder about the polite
    short ones.
  why: Rage costs effort and effort is investment. The customer who has decided to leave writes a brief,
    courteous note and does not renew. That is the more dangerous state and it is the one no queue surfaces,
    because it generates no work.
  reads:
  - customer_support.obj.core.churn_risk
  - customer_support.obj.core.customer_sentiment
