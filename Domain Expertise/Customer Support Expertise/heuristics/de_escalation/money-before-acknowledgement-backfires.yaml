purpose:
  statement: Compensation offered before acknowledgement raises the temperature rather than lowering
    it.
heuristic:
  statement: Compensation offered before acknowledgement raises the temperature rather than lowering
    it.
  why: Before the grievance is named, a credit reads as a transaction to close the subject. After it
    is named, the same credit reads as consequence. Nothing about the amount changes; the order changes
    everything.
