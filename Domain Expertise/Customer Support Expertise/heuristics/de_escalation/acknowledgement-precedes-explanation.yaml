purpose:
  statement: Acknowledgement precedes explanation, always, with no exception for being right.
heuristic:
  statement: Acknowledgement precedes explanation, always, with no exception for being right.
  why: Being right is the condition under which this rule is broken, and it is the condition under which
    it matters most. The customer is not weighing the explanation on its merits while they still believe
    we have not registered what happened to them.
