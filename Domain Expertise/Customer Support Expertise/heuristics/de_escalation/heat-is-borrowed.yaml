purpose:
  statement: Assume some of the heat is borrowed from the customer's own stakeholders.
heuristic:
  statement: Assume some of the heat is borrowed from the customer's own stakeholders.
  why: The person writing to us usually promised something internally on our behalf and is now exposed.
    Giving them something they can forward — a plain statement of status they can send onward without
    editing — often does more than anything we say about the fault itself.
  applies_when: The requester is not the person suffering the impact, or is relaying a complaint from
    elsewhere in their organisation.
  reads:
  - customer_support.obj.core.requester
  - customer_support.obj.core.ticket
