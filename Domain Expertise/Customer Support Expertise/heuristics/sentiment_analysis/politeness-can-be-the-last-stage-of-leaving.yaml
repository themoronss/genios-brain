identity:
  id: customer_support.heu.sentiment_analysis.politeness_can_be_the_last_stage_of_leaving
  name: Politeness can be the last stage of leaving
  kind: heuristic
  domain: customer_support
  scope: capability
  owner_capability: customer_support.voice_of_customer.sentiment_analysis
  subdomain: voice_of_customer
  version: 1.0.0
  status: draft
purpose:
  statement: Some customers get NICER as they disengage — short, courteous, no feature asks, no complaints.
    Falling engagement with rising politeness is a quiet-quitting account, not a happy one.
  answers:
  - Is a suddenly-polite low-engagement account healthy?

heuristic:
  statement: >
    Some customers get NICER as they disengage — short, courteous, no feature asks, no complaints.
    Falling engagement with rising politeness is a quiet-quitting account, not a happy one.
  why: >
    Complaint requires investment. A customer who still argues about the roadmap is still planning
    to be here; one who has decided to leave stops spending effort on us, and what remains is
    politeness, because politeness is cheap. Every tone-based instrument reads that as improvement,
    and every engagement-based instrument reads it as a settled customer, so the account looks
    healthy on both until the renewal.
  confidence_bp: 7500
  applies_when: An established account whose interaction volume has fallen while its tone has warmed or formalised.
  breaks_down_when: >
    The customer has simply become competent. A well-adopted product produces exactly this
    signature — fewer questions, less friction, pleasant brief exchanges — and it is the intended
    outcome rather than a warning. Distinguishing the two requires usage or outcome data that
    support does not hold, which is why this is a prompt to look rather than a verdict. It also
    breaks down where a contact changed: the new person is polite because they are new.
  reads: [customer_support.obj.core.customer_sentiment, customer_support.obj.core.customer_account, customer_support.obj.core.churn_risk]
  contradicts: [customer_support.heu.satisfaction_measurement.response_bias_bends_both_tails]
limits:
- 'It identifies a pattern worth investigating, never a conclusion. The two causes look identical from inside support.'
- 'It needs both series — tone and engagement — and most instrumentation carries only one.'
failure_modes:
- 'Applied to a successfully onboarded account, which is the same signature and the opposite meaning.'
- 'Escalated as churn risk on tone alone, which damages credibility with the account team the first time it is wrong.'
variants:
- applies_to: named_tam
  change: The TAM can simply ask, which converts the ambiguity into an answer for the cost of one conversation.
  why: There is a relationship and a reason to use it.
- applies_to: b2c
  change: Largely inapplicable — there is no per-customer baseline and no relationship to cool.
  why: The interaction history is too thin to have a shape.
references:
- title: Customer sentiment measurement practice
  kind: practitioner

