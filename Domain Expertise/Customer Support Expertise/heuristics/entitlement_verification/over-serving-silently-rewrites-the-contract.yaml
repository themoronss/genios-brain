purpose:
  statement: Consistently giving P1 treatment to P3 contracts teaches the customer their real tier is
    fiction — and makes the eventual enforcement feel like a downgrade. Kindness beyond contract should
    be explicit and occasional, not ambient.
  answers:
  - What is the cost of quietly exceeding entitlement?
