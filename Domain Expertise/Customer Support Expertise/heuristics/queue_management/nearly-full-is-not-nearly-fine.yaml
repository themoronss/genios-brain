purpose:
  statement: A team at almost-full utilisation is not a short step away from comfortable.
heuristic:
  statement: A team at almost-full utilisation is not a short step away from comfortable.
  why: The relationship between utilisation and wait is not a straight line — it bends upward sharply
    as arrivals approach the service rate. The last sliver of spare capacity is what absorbs variance
    in arrivals and handling time; remove it and the queue stops recovering between spikes and begins
    compounding them.
