purpose:
  statement: Speed of first response and speed of resolution pull against each other, and which one
    you are buying must be a decision.
heuristic:
  statement: Speed of first response and speed of resolution pull against each other, and which one
    you are buying must be a decision.
  why: Interrupting deep work to acknowledge new arrivals raises responsiveness and lowers throughput.
    Both are defensible; what is not defensible is having chosen neither and being surprised at whichever
    one is failing.
