purpose:
  statement: Variance, not volume, is what breaks a queue.
heuristic:
  statement: Variance, not volume, is what breaks a queue.
  why: A heavy but predictable load can be staffed. An average load arriving in clumps cannot, and a
    rota built from the mean is guaranteed to be underwater at exactly the moments the customers are
    watching.
