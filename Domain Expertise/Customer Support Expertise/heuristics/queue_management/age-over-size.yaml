purpose:
  statement: Backlog age tells you more than backlog size.
heuristic:
  statement: Backlog age tells you more than backlog size.
  why: Size is largely a function of arrival rate and is often out of your control by the time you read
    it. Age is a function of your own work-selection order and is entirely yours. A large young queue
    is a busy day; a small old queue is a broken policy.
