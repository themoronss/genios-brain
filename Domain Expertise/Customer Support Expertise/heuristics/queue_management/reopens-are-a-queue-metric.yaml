purpose:
  statement: Count reopens against the queue, not the agent.
heuristic:
  statement: Count reopens against the queue, not the agent.
  why: A reopen is usually the visible end of pressure to close, and pressure to close is a queue policy.
    Attributing it to the individual produces defensiveness and hides the policy that caused it.
