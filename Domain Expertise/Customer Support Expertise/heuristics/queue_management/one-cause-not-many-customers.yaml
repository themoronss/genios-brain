purpose:
  statement: When arrivals spike, look for one cause before you assume many customers.
heuristic:
  statement: When arrivals spike, look for one cause before you assume many customers.
  why: Independent customers rarely change behaviour simultaneously. A jump in volume is almost always
    a single upstream event with many downstream reporters, and it is fixable where it started far more
    cheaply than where it landed.
