heuristic:
  statement: Every queue metric improving at once is a warning, not a win.
  why: Handle time, closes-per-agent and mean age all improve simply by working the easy tickets first.
    Genuine improvement almost always makes at least one number worse — usually handle time, because
    the hard ones finally got picked up.
