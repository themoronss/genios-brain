purpose:
  statement: The oldest ticket in the queue is the most expensive one in it.
heuristic:
  statement: The oldest ticket in the queue is the most expensive one in it.
  why: It has already spent goodwill, it will take longer to resolve because context has decayed and
    the original agent has moved on, and it is the item most likely to reappear as an escalation, a
    bad survey or a renewal conversation.
