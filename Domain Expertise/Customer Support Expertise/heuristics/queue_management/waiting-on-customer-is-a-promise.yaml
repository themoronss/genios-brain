heuristic:
  statement: Waiting-on-customer is neither resolved nor idle — it is a paused clock with a promise
    attached.
  why: It is the most abused state in every ticketing system because it improves the numbers without
    improving anything. A queue that does not chase it has simply moved its backlog somewhere the dashboard
    does not look.
