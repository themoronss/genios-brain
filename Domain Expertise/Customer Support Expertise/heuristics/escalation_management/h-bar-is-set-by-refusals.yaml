identity:
  id: customer_support.heu.escalation_management.h_bar_is_set_by_refusals
  name: H bar is set by refusals
  kind: heuristic
  domain: customer_support
  scope: capability
  owner_capability: customer_support.escalation_and_incident.escalation_management
  subdomain: escalation_and_incident
  version: 1.0.0
