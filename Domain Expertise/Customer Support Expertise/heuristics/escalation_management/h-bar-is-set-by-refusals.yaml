purpose:
  statement: If everything escalates, nothing does — and the bar is held by receivers refusing well-formed
    but unnecessary escalations, not by policy documents.
heuristic:
  statement: If everything escalates, nothing does — and the bar is held by receivers refusing well-formed
    but unnecessary escalations, not by policy documents.
  why: Escalation is a scarce attention channel and policy cannot ration attention. A refusal that explains
    itself teaches the bar in one interaction; a policy that is never enforced teaches that the bar
    is decorative.
