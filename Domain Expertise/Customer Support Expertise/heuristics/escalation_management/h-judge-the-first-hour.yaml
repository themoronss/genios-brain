heuristic:
  statement: Judge an escalation by the receiver's first hour, not by the agent's first message.
  why: Almost all the value and almost all the damage occurs after the transfer. Quality programmes
    that review the raising message and stop there optimise the paperwork and leave the actual mechanism
    unmeasured.
