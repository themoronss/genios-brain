purpose:
  statement: An escalation that cannot say what would close it will not close.
heuristic:
  statement: An escalation that cannot say what would close it will not close.
  why: Without an exit condition the flag survives its own reason, the escalated pool only grows, and
    the state stops carrying information. Permanent escalations are how an organisation loses the ability
    to tell which of its problems are serious.
