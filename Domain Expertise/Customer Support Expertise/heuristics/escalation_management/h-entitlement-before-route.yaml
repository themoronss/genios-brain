purpose:
  statement: Check what the account is actually owed before choosing the route. Entitlement bounds what
    may be promised on the way up as well as on the way in.
heuristic:
  statement: Check what the account is actually owed before choosing the route. Entitlement bounds what
    may be promised on the way up as well as on the way in.
  why: Escalation is where over-promising happens, because the escalating agent is trying to restore
    confidence and the receiver has not yet read the contract. A commitment made during an escalation
    is the hardest one to walk back.
  reads:
  - customer_support.obj.core.entitlement
