  name: H anger is not a reason
  kind: heuristic
  domain: customer_support
  scope: capability
  owner_capability: customer_support.escalation_and_incident.escalation_management
  subdomain: escalation_and_incident
  version: 1.0.0
  status: draft
purpose:
  statement: '"The customer is angry" is not an escalation reason. It is a symptom. The reason is whatever
    made them angry, and if you cannot write that down, escalating relocates the confusion rather than
    resolving it.'
heuristic:
  statement: '"The customer is angry" is not an escalation reason. It is a symptom. The reason is whatever
    made them angry, and if you cannot write that down, escalating relocates the confusion rather than
    resolving it.'
  why: Reasons stated as emotions cannot be acted on or refused, so receivers respond to the loudest
    description rather than the largest impact. Forcing the reason into a factual sentence is also the
    cheapest test of whether the escalation is ready.
  reads:
  - customer_support.obj.core.customer_sentiment
