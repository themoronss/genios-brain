purpose:
  statement: Escalating early costs credibility; escalating late costs the account. If you genuinely
    cannot tell which side of the line you are on, you are already late.
heuristic:
  statement: Escalating early costs credibility; escalating late costs the account. If you genuinely
    cannot tell which side of the line you are on, you are already late.
  why: The two costs are not felt symmetrically. Looking premature is immediate, personal and lands
    on the agent; losing the account is delayed, diffuse and lands on someone else. Untrained judgement
    therefore drifts late in a way that feels like prudence, and the tie breaker exists to correct a
    known bias rather than to describe a real balance point.
