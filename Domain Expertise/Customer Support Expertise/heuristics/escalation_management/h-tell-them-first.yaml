purpose:
  statement: The customer should hear about the escalation from us, with a name and a next-contact time,
    before an unfamiliar name appears on their ticket.
heuristic:
  statement: The customer should hear about the escalation from us, with a name and a next-contact time,
    before an unfamiliar name appears on their ticket.
  why: An unannounced new responder reads as being passed around, which is precisely the experience
    escalation exists to end. The same event framed as "I have brought in X, who now owns this" reads
    as being taken seriously.
