purpose:
  statement: If the receiver's first message to the customer asks something the customer has already
    answered in the thread, the escalation failed at the handoff, not at the fix.
heuristic:
  statement: If the receiver's first message to the customer asks something the customer has already
    answered in the thread, the escalation failed at the handoff, not at the fix.
  why: It is the only test of handoff quality that is falsifiable from the artefact itself, needs no
    survey, and puts the defect where it actually occurred. Teams that watch it stop blaming escalation
    outcomes on receiver capacity.
