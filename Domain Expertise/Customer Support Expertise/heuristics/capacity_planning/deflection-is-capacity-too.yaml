identity:
  id: customer_support.heu.capacity_planning.deflection_is_capacity_too
  name: Deflection is capacity too
  kind: heuristic
  domain: customer_support
  scope: capability
  owner_capability: customer_support.support_operations.capacity_planning
  subdomain: support_operations
  version: 1.0.0
  status: draft
purpose:
  statement: Before hiring for a rising curve, check whether the top driver is deflectable — an article
    or product fix that kills a driver adds capacity with no payroll and no ramp time.
  answers:
  - What are the options when demand outgrows the team?

heuristic:
  statement: >
    Before hiring for a rising curve, check whether the top driver is deflectable. An article or a
    product fix that kills a driver adds capacity with no payroll and no ramp time.
  why: >
    Demand in support is not exogenous. A large share of it is generated by specific, identifiable
    causes — a confusing flow, a missing article, a defect — and removing one of those reduces
    demand permanently at a fraction of the cost of serving it forever. Hiring, by contrast, adds
    capacity that must be paid every month and that arrives a quarter late. The reason hiring wins
    anyway is that it is the tool the planning process is built around, and deflection requires
    somebody else's roadmap.
  confidence_bp: 8000
  applies_when: A rising volume trend concentrated in identifiable drivers.
  breaks_down_when: >
    The growth is broad rather than concentrated. When volume rises across every category
    proportionally with customer growth, there is no driver to kill and deflection analysis delays
    a hire that was always necessary. It also breaks down where the deflection depends on a product
    change nobody will prioritise: a theoretical capacity gain that requires a roadmap slot you
    will not get is not capacity, and treating it as such understaffs the team.
  reads: [customer_support.obj.core.backlog, customer_support.obj.core.content_gap, customer_support.obj.core.product_area]
  contradicts: [customer_support.heu.coverage_and_on_call.on_call_that_always_fires_is_a_staffing_bug]
limits:
- 'It applies to concentrated drivers. Diffuse growth needs people.'
- 'Deflection capacity is only real once the article ships or the fix lands, and both are outside support.'
failure_modes:
- 'Used to defer hiring indefinitely on the promise of a deflection that never gets prioritised.'
- 'Applied to broad growth, which delays a necessary hire by a quarter.'
variants:
- applies_to: plg_self_serve
  change: Strongest — deflection is the primary capacity mechanism and hiring is the exception.
  why: The unit economics do not support headcount scaling with volume.
- applies_to: enterprise_support
  change: Weakest. Demand is relationship-driven and rarely concentrated in a deflectable driver.
  why: The questions are specific to each account's environment.
references:
- title: Queueing behaviour in service operations
  kind: research

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  completeness: complete
  notes: >
    The first failure mode is the one that damages teams: this heuristic is used to defer hiring
    indefinitely on the promise of a deflection that never reaches a roadmap, and the shortfall
    lands on the people absorbing it.
