purpose:
  statement: Repeat contact about the same underlying issue predicts departure better than any single
    severe one.
heuristic:
  statement: Repeat contact about the same underlying issue predicts departure better than any single
    severe one.
  why: Customers forgive events; they do not forgive a pattern. One outage is something that happened
    to us both. Returning again and again about the same thing is evidence the product does not work
    for them, and an apology does not change evidence.
  reads:
  - customer_support.obj.core.ticket
  - issue
  - customer_support.obj.core.churn_risk
