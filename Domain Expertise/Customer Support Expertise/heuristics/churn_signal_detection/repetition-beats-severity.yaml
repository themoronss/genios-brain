identity:
  id: customer_support.heu.churn_signal_detection.repetition_beats_severity
  name: Repetition beats severity
  kind: heuristic
  domain: customer_support
  scope: capability
  owner_capability: customer_support.voice_of_customer.churn_signal_detection
  subdomain: voice_of_customer
  version: 1.0.0
