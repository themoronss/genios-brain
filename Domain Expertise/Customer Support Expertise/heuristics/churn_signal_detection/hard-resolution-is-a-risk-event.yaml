identity:
  id: customer_support.heu.churn_signal_detection.hard_resolution_is_a_risk_event
  name: Hard resolution is a risk event
  kind: heuristic
  domain: customer_support
  scope: capability
  owner_capability: customer_support.voice_of_customer.churn_signal_detection
  subdomain: voice_of_customer
  version: 1.0.0
  status: draft
purpose:
  statement: A resolved ticket with a long or contentious path is a risk event, not a closed one.
heuristic:
  statement: A resolved ticket with a long or contentious path is a risk event, not a closed one.
  why: Closure records that the work item ended, not that the customer feels well served. The story
    the buyer will tell internally is assembled from how hard it was, and difficulty survives resolution.
  reads:
  - customer_support.obj.core.ticket
  - customer_support.obj.core.resolution
  - customer_support.obj.core.effort_score
