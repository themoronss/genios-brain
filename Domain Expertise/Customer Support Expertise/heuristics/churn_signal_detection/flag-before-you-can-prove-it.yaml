heuristic:
  statement: Raise the flag while it is still arguable, not once it is defensible.
  why: A churn signal is only useful while there is time to act on it, and the level of proof a reviewer
    would accept arrives after the decision has been taken. A false positive costs a conversation; a
    false negative costs the account. The asymmetry should be deliberate.
