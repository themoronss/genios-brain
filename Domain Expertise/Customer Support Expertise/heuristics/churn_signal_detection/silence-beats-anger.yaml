purpose:
  statement: A drop in contact volume from a previously active account is worse news than an angry ticket.
heuristic:
  statement: A drop in contact volume from a previously active account is worse news than an angry ticket.
  why: Complaining is an investment of effort that presumes a future worth improving. When that investment
    stops, the effort has been redirected — usually to evaluating or migrating to someone else. Anger
    is engagement; withdrawal is the state change.
