purpose:
  statement: Support alone cannot distinguish a customer who no longer needs us from one who no longer
    wants us.
heuristic:
  statement: Support alone cannot distinguish a customer who no longer needs us from one who no longer
    wants us.
  why: Both produce the same silence in the queue. Only product usage separates them, and where support
    cannot see usage, the honest output is a request for that evidence rather than a confident read
    of the silence.
  reads:
  - customer_support.obj.core.customer_account
  - customer_support.obj.core.churn_risk
