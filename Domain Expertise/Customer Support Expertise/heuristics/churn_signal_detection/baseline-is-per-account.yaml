identity:
  id: customer_support.heu.churn_signal_detection.baseline_is_per_account
  name: Baseline is per account
  kind: heuristic
  domain: customer_support
  scope: capability
  owner_capability: customer_support.voice_of_customer.churn_signal_detection
  subdomain: voice_of_customer
  version: 1.0.0
  status: draft
purpose:
  statement: Compare an account against its own contact history, never against the queue's average.
heuristic:
  statement: Compare an account against its own contact history, never against the queue's average.
  why: Absolute volume carries no information about a specific relationship. The signal is the delta
    from that account's normal, which means the detector is a baseline problem and cannot be built from
    thresholds that apply to everyone.
  reads:
  - customer_support.obj.core.customer_account
  - customer_support.obj.core.ticket
