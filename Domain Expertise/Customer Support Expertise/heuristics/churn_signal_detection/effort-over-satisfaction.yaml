purpose:
  statement: Effort predicts renewal better than satisfaction does.
heuristic:
  statement: Effort predicts renewal better than satisfaction does.
  why: Satisfaction measures how the last interaction felt; effort measures what the product costs to
    live with. A customer can rate an agent warmly and still be exhausted by how many times they had
    to ask, and it is the exhaustion that shows up at renewal.
  applies_when: Choosing which experience measure to weight when both are available.
  reads:
  - customer_support.obj.core.satisfaction_score
  - customer_support.obj.core.effort_score
