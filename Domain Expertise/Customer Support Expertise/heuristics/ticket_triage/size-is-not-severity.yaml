identity:
  id: customer_support.heu.ticket_triage.size_is_not_severity
  name: Size is not severity
  kind: heuristic
  domain: customer_support
  scope: capability
  owner_capability: customer_support.intake_and_triage.ticket_triage
  subdomain: intake_and_triage
  version: 1.0.0
  status: draft
purpose:
  statement: Do not raise priority because the account is large. Raise it because the account is entitled,
    or because the fault is spreading.
heuristic:
  statement: Do not raise priority because the account is large. Raise it because the account is entitled,
    or because the fault is spreading.
  why: Revenue-weighted triage feels commercially obvious and quietly converts the support queue into
    an account-management queue. The predictable second-order effect is that customers without commercial
    leverage learn that shouting is the only lever they have.
  reads:
  - customer_support.obj.core.entitlement
