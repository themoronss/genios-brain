purpose:
  statement: Priority should be cheap to revise; severity should not.
heuristic:
  statement: Priority should be cheap to revise; severity should not.
  why: The asymmetry is deliberate. Priority is an allocation and the world it allocates against changes
    hourly, so requiring evidence to change it makes the queue rigid. Severity is a claim about the
    fault, and letting it drift without evidence turns the whole scale into noise.
