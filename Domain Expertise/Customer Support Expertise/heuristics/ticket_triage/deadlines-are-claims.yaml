purpose:
  statement: A deadline asserted inside a ticket is a fact to verify, not a priority input to accept.
heuristic:
  statement: A deadline asserted inside a ticket is a fact to verify, not a priority input to accept.
  why: Customer-stated deadlines are real often enough to matter and self-serving often enough to warrant
    a check. Verifying one is cheap; discovering the invented one after the queue has been rearranged
    around it is not.
