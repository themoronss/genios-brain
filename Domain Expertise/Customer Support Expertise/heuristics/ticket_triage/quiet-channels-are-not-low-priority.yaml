purpose:
  statement: Treat the channel a contact arrived through as evidence about the customer's expectation,
    not about the urgency of the fault.
heuristic:
  statement: Treat the channel a contact arrived through as evidence about the customer's expectation,
    not about the urgency of the fault.
  why: Chat feels urgent because someone is present; an email feels patient because nobody is waiting
    visibly. Both are facts about expectation management, which belongs to a different capability. Letting
    them into the severity decision means the same fault gets two answers.
