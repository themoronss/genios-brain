purpose:
  statement: If a triage decision takes longer than reading the ticket twice, what is missing is an
    input, not thought.
heuristic:
  statement: If a triage decision takes longer than reading the ticket twice, what is missing is an
    input, not thought.
  why: Long triage is almost always a missing entitlement, a missing reproduction, or a missing second
    report. Staring at the text does not produce any of the three, and the clock is running while the
    staring happens.
