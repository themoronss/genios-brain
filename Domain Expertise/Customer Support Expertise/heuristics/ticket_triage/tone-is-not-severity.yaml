heuristic:
  statement: A calm ticket describing lost data outranks a furious ticket describing a layout defect.
  why: Tone is evidence about the relationship and about the reporter's prior experience with us — both
    worth acting on, in a different capability. Sorting the queue by tone rewards escalation language,
    which increases the supply of escalation language until it carries no information.
