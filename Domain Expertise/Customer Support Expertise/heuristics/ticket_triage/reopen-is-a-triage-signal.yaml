identity:
  id: customer_support.heu.ticket_triage.reopen_is_a_triage_signal
  name: Reopen is a triage signal
  kind: heuristic
  domain: customer_support
  scope: capability
  owner_capability: customer_support.intake_and_triage.ticket_triage
  subdomain: intake_and_triage
  version: 1.0.0
  status: draft
purpose:
  statement: A reopened ticket enters triage at higher priority than a new one describing the same thing.
heuristic:
  statement: A reopened ticket enters triage at higher priority than a new one describing the same thing.
  why: A reopen means a previous resolution was wrong and the customer has already spent patience once.
    The fault is not more severe, but the relationship cost of a second miss is substantially higher,
    and priority is the field that is allowed to carry that.
  reads:
  - customer_support.obj.core.ticket
  - customer_support.obj.core.customer_sentiment
