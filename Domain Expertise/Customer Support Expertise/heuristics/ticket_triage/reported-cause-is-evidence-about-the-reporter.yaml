purpose:
  statement: The customer's stated cause is evidence about the customer, not about the cause.
heuristic:
  statement: The customer's stated cause is evidence about the customer, not about the cause.
  why: People report where they noticed a failure, which is reliably downstream of where it happened.
    Routing on the stated cause is how authentication faults end up in the billing queue and sit there
    being correctly ignored.
