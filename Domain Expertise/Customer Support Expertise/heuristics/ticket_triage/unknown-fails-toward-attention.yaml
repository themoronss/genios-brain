purpose:
  statement: Unknown severity fails toward attention, never away from it.
heuristic:
  statement: Unknown severity fails toward attention, never away from it.
  why: Severity is bounded by what has actually been measured, and a fault nobody could classify inside
    a minute is disproportionately a fault with an unusual shape. Defaulting unknown to low is a standing
    bet that the unmeasured is benign, and support pays that bet on precisely its worst days.
  reads:
  - customer_support.obj.core.ticket
