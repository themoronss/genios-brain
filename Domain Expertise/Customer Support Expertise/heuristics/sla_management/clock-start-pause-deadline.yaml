purpose:
  statement: An SLA is a clock with a start, a pause and a deadline, and almost every dispute is about
    the pause.
heuristic:
  statement: An SLA is a clock with a start, a pause and a deadline, and almost every dispute is about
    the pause.
  why: Starts are stamped and deadlines are arithmetic — neither is easy to argue with. The pause is
    the only part that is a human judgement made under pressure, so that is where the disagreement,
    the drift and the gaming all concentrate. Design the pause carefully and most of SLA management
    is solved.
