purpose:
  statement: If the pause depends on the customer doing something they have already done, the clock
    is running whatever the system says.
heuristic:
  statement: If the pause depends on the customer doing something they have already done, the clock
    is running whatever the system says.
  why: The contractual position and the moral position coincide here, and the customer will argue the
    moral one. A pause is only valid while the ball is genuinely in their court; the moment they reply
    it is ours, whether or not an automation noticed.
