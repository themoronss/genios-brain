purpose:
  statement: Reassignment, merge, split and reclassification are clock events. Any of them close to
    a deadline is suspicious until the ledger says otherwise.
heuristic:
  statement: Reassignment, merge, split and reclassification are clock events. Any of them close to
    a deadline is suspicious until the ledger says otherwise.
  why: None of these is done in order to cheat, most of the time. But each one can restart or relocate
    a clock as a side effect, and the ones that happen near a deadline are the ones where the side effect
    changes the answer. Treating them as clock events makes the accident and the intent equally visible.
