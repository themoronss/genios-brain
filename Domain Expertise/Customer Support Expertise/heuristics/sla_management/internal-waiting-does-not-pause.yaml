purpose:
  statement: Waiting on engineering, on a vendor or on a deploy window does not pause the customer's
    clock.
heuristic:
  statement: Waiting on engineering, on a vendor or on a deploy window does not pause the customer's
    clock.
  why: The customer bought an outcome, not our dependency graph. Every system that permits internal
    waiting to stop the clock ends up with a healthy dashboard and a backlog of tickets that have been
    unattended for weeks, because the pause removed exactly the pressure that would have surfaced them.
