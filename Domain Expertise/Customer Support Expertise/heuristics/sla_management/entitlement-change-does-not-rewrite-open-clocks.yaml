purpose:
  statement: An entitlement that expires or downgrades mid-ticket does not retroactively unmake the
    promise on tickets already open under it.
heuristic:
  statement: An entitlement that expires or downgrades mid-ticket does not retroactively unmake the
    promise on tickets already open under it.
  why: The promise attached at the moment the ticket was raised. Re-clocking open tickets on a plan
    change is technically defensible, universally experienced as a bait and switch, and produces exactly
    the conversation you least want during a renewal.
