purpose:
  statement: A customer arguing about the deadline is usually arguing about the severity.
heuristic:
  statement: A customer arguing about the deadline is usually arguing about the severity.
  why: Deadlines are derived from severity, so the deadline is where the disagreement becomes visible.
    Negotiating the clock leaves the real disagreement intact and sets a precedent; re-examining the
    severity resolves both or ends the argument honestly.
