purpose:
  statement: Waiting on customer is both the correct mechanism and the most abused one in support.
heuristic:
  statement: Waiting on customer is both the correct mechanism and the most abused one in support.
  why: It is correct because we genuinely cannot resolve some tickets without the customer, and penalising
    a team for a wait it does not control produces false breaches and then produces pressure to write
    looser promises. It is abused because it is the only button an agent can press that moves the deadline.
    Removing it is wrong; leaving it unaudited is worse.
