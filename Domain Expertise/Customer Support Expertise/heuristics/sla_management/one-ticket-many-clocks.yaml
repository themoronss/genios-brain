purpose:
  statement: When an entitlement creates more than one clock on a ticket, decide up front which one
    the ticket is judged on.
heuristic:
  statement: When an entitlement creates more than one clock on a ticket, decide up front which one
    the ticket is judged on.
  why: Left undecided, the ticket will be judged retroactively on whichever clock was met, by whoever
    is writing the report. That is not a metric, it is a narrative.
