purpose:
  statement: First response means a human read the ticket and said something specific about it.
heuristic:
  statement: First response means a human read the ticket and said something specific about it.
  why: Any weaker definition is satisfiable by automation, and a metric satisfiable by automation stops
    measuring service within a quarter of someone noticing. The specificity test — does the reply contain
    a fact about this ticket — is the cheapest available guard.
