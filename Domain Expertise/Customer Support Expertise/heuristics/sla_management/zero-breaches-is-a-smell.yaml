purpose:
  statement: A queue that has never breached is not evidence of excellence.
heuristic:
  statement: A queue that has never breached is not evidence of excellence.
  why: Real service under real load misses sometimes. A spotless record almost always means the target
    was set below actual capability — in which case it is not constraining anything — or that clocks
    are being stopped rather than met.
