heuristic:
  statement: If nearly everyone passes, the rubric is measuring attendance.
  why: A rubric with no discrimination consumes reviewer time and produces no information. Either the
    bar sits below the floor of current practice, or reviewers are marking generously to avoid the conflict
    of a low score — and the second is far more common than the first.
