purpose:
  statement: When QA scores and customer feedback persistently disagree, look at the rubric before you
    look at the agent.
heuristic:
  statement: When QA scores and customer feedback persistently disagree, look at the rubric before you
    look at the agent.
  why: A standing gap between what the rubric rewards and what customers report usually means the rubric
    has drifted into describing internal preference. Agents scoring well on a rubric customers do not
    recognise are doing what they were asked.
  reads:
  - customer_support.obj.core.customer_sentiment
