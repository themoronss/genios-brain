purpose:
  statement: The moment a QA score appears in a performance conversation, it stops being QA.
heuristic:
  statement: The moment a QA score appears in a performance conversation, it stops being QA.
  why: Consequence changes what people show you. Agents route their hardest tickets to peers off the
    record, stop flagging their own mistakes, and start coaching each other on the rubric rather than
    on the customer. The honest signal is lost permanently — this is not a policy you can quietly reverse,
    because the agents' belief is now the operative fact.
  applies_when: Any time QA output is requested by someone who can hire, fire, promote or pay.
