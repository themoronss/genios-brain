purpose:
  statement: A reviewer who no longer works the queue is scoring a memory of the job.
heuristic:
  statement: A reviewer who no longer works the queue is scoring a memory of the job.
  why: Product changes, tooling changes and the actual difficulty of the current backlog are invisible
    from outside it. Reviewers who have stopped handling tickets drift toward scoring the ideal reply
    rather than the achievable one, and agents can tell immediately.
