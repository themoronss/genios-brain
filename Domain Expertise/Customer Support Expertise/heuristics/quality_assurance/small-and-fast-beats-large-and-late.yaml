purpose:
  statement: A small sample reviewed carefully and fed back this week beats a large sample reviewed
    shallowly next month.
heuristic:
  statement: A small sample reviewed carefully and fed back this week beats a large sample reviewed
    shallowly next month.
  why: Feedback decays with distance from the interaction. The agent must still remember the ticket
    — what they were thinking, what else was in the queue — for the conversation to be learning rather
    than an audit finding.
