purpose:
  statement: Reserve auto-fail for genuinely unrecoverable errors — a promise outside entitlement, a
    data or security disclosure, a fabricated answer.
heuristic:
  statement: Reserve auto-fail for genuinely unrecoverable errors — a promise outside entitlement, a
    data or security disclosure, a fabricated answer.
  why: Auto-fail is a blunt instrument that erases every other dimension on the sheet. Applied to recoverable
    lapses it makes the score a coin flip on whether a trigger happened to fire, and agents stop reading
    the rest of the sheet.
  reads:
  - customer_support.obj.core.entitlement
