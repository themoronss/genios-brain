purpose:
  statement: Anything a reviewer can score without reading the customer's problem is a compliance item,
    not a quality item.
heuristic:
  statement: Anything a reviewer can score without reading the customer's problem is a compliance item,
    not a quality item.
  why: Form checks are cheap to score and cheap to game, so they expand to fill the rubric and crowd
    out the dimensions that actually distinguish good support — did the agent understand the question,
    did they say the awkward true thing, did they check rather than assume.
