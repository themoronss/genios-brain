purpose:
  statement: A sample that was not drawn at random measures whoever is being watched.
heuristic:
  statement: A sample that was not drawn at random measures whoever is being watched.
  why: Every non-random selection encodes a prior belief about where the problems are, and the review
    then confirms it. Escalated and reopened tickets are the least representative population in the
    queue and the most tempting one to reach for.
