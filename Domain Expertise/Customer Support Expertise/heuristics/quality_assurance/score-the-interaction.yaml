purpose:
  statement: Score the interaction, not the outcome.
heuristic:
  statement: Score the interaction, not the outcome.
  why: Outcomes are contaminated by draw — which tickets the agent happened to get, whether the customer
    was reasonable, whether a fix existed at all. The only thing the agent controls is what they did
    with what arrived, so that is the only thing a fair instrument can measure.
  reads:
  - customer_support.obj.core.ticket
  - customer_support.obj.core.knowledge_article
