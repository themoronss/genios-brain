purpose:
  statement: If an agent cannot predict their own score, the rubric has taught them nothing.
heuristic:
  statement: If an agent cannot predict their own score, the rubric has taught them nothing.
  why: The point of a written standard is to be internalised and applied before the reply is sent, not
    discovered afterwards. Predictability is the measure of whether the standard transferred; an unpredictable
    score teaches only that QA is arbitrary.
