purpose:
  statement: A trend across many reviews is evidence; a single review is an anecdote — and the person
    being scored will treat both as fact.
heuristic:
  statement: A trend across many reviews is evidence; a single review is an anecdote — and the person
    being scored will treat both as fact.
  why: The sampling error on one interaction is enormous. Drawing a conclusion about a person from one
    review is both wrong and visibly wrong to them, and it discredits the whole programme faster than
    any amount of harsh scoring.
