purpose:
  statement: Deflection that rises while contact volume stays flat is not deflection; it is a denominator
    moving.
heuristic:
  statement: Deflection that rises while contact volume stays flat is not deflection; it is a denominator
    moving.
  why: The usual formula counts help-center sessions that were not followed by a ticket, so anything
    that drives more people into the help center — a bad release, a confusing new flow, a campaign —
    inflates the numerator while real demand is unchanged or worse.
