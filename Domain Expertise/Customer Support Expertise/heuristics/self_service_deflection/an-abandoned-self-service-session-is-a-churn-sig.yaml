purpose:
  statement: An abandoned self-service session is a churn signal, not a saved ticket.
heuristic:
  statement: An abandoned self-service session is a churn signal, not a saved ticket.
  why: The customer had a problem, tried, failed, and stopped asking us. They did not stop having the
    problem — they lowered their expectation of us. Read against account health this is one of the earliest
    quiet churn indicators support ever gets, and the deflection dashboard is actively concealing it.
  reads:
  - customer_support.obj.core.churn_risk
  - customer_support.obj.core.requester
  - customer_support.obj.core.customer_sentiment
