purpose:
  statement: Self-service only works on questions that have one right answer. Anything account-specific,
    ambiguous or emotionally loaded should be routed to a human deliberately, and the right deflection
    rate for those intents is none.
heuristic:
  statement: Self-service only works on questions that have one right answer. Anything account-specific,
    ambiguous or emotionally loaded should be routed to a human deliberately, and the right deflection
    rate for those intents is none.
  why: A failed deflection does not cost one ticket. It costs the wasted attempt, the ticket that follows,
    and the customer's new belief that we hide behind our documentation — and that last cost never appears
    on the support ledger.
  reads:
  - customer_support.obj.core.intent
  - customer_support.obj.core.customer_sentiment
