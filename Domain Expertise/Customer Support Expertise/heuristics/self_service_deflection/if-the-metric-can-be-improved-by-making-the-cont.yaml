purpose:
  statement: If the metric can be improved by making the contact button harder to find, it is not measuring
    what you think it is measuring.
heuristic:
  statement: If the metric can be improved by making the contact button harder to find, it is not measuring
    what you think it is measuring.
  why: Any instrument that infers success from the absence of a ticket rewards obstruction and answering
    identically, and obstruction is cheaper. Success has to be claimed by the customer, not inferred
    from their silence.
