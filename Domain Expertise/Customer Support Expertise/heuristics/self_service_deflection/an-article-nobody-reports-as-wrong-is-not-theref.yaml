purpose:
  statement: An article nobody reports as wrong is not therefore right.
heuristic:
  statement: An article nobody reports as wrong is not therefore right.
  why: Feedback on knowledge is catastrophically under-supplied — the misled customer leaves rather
    than complains, and the confused one assumes the fault is theirs. Silence on an article carries
    the same information as silence on an article nobody read, so freshness must be checked on a schedule
    and against releases rather than waited for.
  reads:
  - customer_support.obj.core.knowledge_article
