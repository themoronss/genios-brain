purpose:
  statement: 'When the grievance is about not being heard, move to a channel with a voice in it.


    Text strips the signals that prove listening happened, and a long written apology can read as a
    longer defence. A short call does in minutes what a thread will not do at all — but only when the
    grievance is about being unheard, not when it is about a missing fix.'
