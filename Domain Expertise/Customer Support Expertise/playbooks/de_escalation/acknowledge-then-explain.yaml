purpose:
  statement: 'Acknowledge, then explain — in that order, in separate sentences, never merged.


    "I''m sorry, but" is not an acknowledgement; the conjunction converts it into a preamble to the
    defence. The acknowledgement has to be able to stand alone as a complete sentence the customer would
    agree with, and only then does the explanation get a hearing.'
