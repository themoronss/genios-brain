purpose:
  statement: 'Name one owner and keep them on it until the temperature is down, even at a cost to queue
    efficiency.


    Continuity is the visible proof that someone is in charge. The routing cost of pinning an agent
    is real and it is smaller than the cost of a customer who has now explained their problem to four
    people and concludes that nobody owns it.'
