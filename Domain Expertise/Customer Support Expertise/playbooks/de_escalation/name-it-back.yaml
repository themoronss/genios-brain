purpose:
  statement: 'Play their account back in their own words before adding anything of ours.


    Repetition by the customer is the reliable symptom of not having been heard. Playing the account
    back is the cheapest possible test of whether we understood it, and when we got it wrong the correction
    arrives as collaboration rather than as another grievance.'
