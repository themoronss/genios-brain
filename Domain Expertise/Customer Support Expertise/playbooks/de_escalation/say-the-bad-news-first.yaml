purpose:
  statement: 'Deliver bad news ourselves, early, before the customer discovers it or asks for it.


    Bad news volunteered is evidence of control; the same news extracted is evidence of concealment.
    The content is identical and the effect on trust is opposite, which is why slipping a deadline quietly
    costs more than the slip itself.'
