purpose:
  statement: 'Convert every apology into a commitment: a named owner, a stated next contact, and what
    will be true by then.


    An apology is unfalsifiable and a time is not. The customer cannot verify our remorse but they can
    verify whether we wrote when we said we would, and that verification is what actually rebuilds the
    predictability the anger is asking for.'
