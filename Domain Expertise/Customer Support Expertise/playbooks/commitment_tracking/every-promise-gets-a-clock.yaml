identity:
  id: customer_support.pb.commitment_tracking.every_promise_gets_a_clock
  name: Every promise gets a clock
  kind: playbook
  domain: customer_support
  scope: capability
  owner_capability: customer_support.entitlement_and_sla.commitment_tracking
  subdomain: entitlement_and_sla
  version: 1.0.0
  status: stable
purpose:
  statement: >
    Capture, date and close every promise made inside a case that no tool created — the callback
    before end of day, the update on Friday, the bug someone said they would file. These are the
    promises customers remember most sharply, because a human said them directly, and they are the
    only ones with nothing watching them.
  answers:
  - What did we personally promise this customer, and by when?
  - Is that promise still going to happen, and if not, who is telling them?
  not:
  - Contractual response targets — customer_support.obj.core.sla_target owns those, and a tool already watches them.

when_to_use:
  conditions:
  - {exists: commitment.due_at}
  signals:
  - next_step_agreed
  - question
  do_not_use_when:
  - The statement was an intention rather than a commitment. "I'll try to get to it today" is not a
    promise until the other side relies on it, and tracking intentions inflates the ledger until the
    real promises are indistinguishable.

steps:
- order: 1
  name: Capture the promise, not the sentence
  description: >
    Record the obligation, not the wording. A ledger keyed on text splits one promise into three
    entries when it is restated, and each restatement then ages independently.
  actor: agent
  objects_read: [customer_support.obj.core.commitment]
  produces: One commitment record per obligation.
  done_when: The obligation has an owner, a recipient and a date either party actually stated.
- order: 2
  name: Date it from the agreement, never from the record
  description: >
    A due date inferred from when the row was created produces an overdue flag the customer would
    not recognise, and the first unrecognisable flag teaches the reader to distrust every later one.
  actor: agent
  produces: A due date traceable to something said.
  done_when: The date is quoted from the exchange, or the commitment is explicitly marked undated.
- order: 3
  name: Read whose turn it is before doing anything with it
  description: >
    An overdue promise means opposite things in the two directions. With the ball on us it is our
    failure; with the ball on them it is a normal wait. A chase sent in the first case is the single
    most damaging message support sends.
  actor: system
  objects_read: [customer_support.obj.core.named_contact]
  produces: A direction.
  done_when: ball_in_court is resolved, or the commitment is held until it is.
- order: 4
  name: Close the loop ON the date, including with no news
  description: >
    Silence on the promised day is read as being forgotten, not as being unfinished. "No news yet,
    here is what I have tried, next update Tuesday" costs one message and preserves the promise.
  actor: human
  produces: A message sent on the due date.
  done_when: Something reached the customer on the day, whatever its content.
- order: 5
  name: Renegotiate before the date, apologise only after
  description: >
    Before the date the promise is still ours to redefine; after it, it is theirs to be disappointed
    by. The move is available for a fixed window and almost nobody takes it.
  actor: human
  produces: A revised, agreed date.
  done_when: A new date is agreed, or the original is met.
- order: 6
  name: Give every promise a verdict and remove it
  description: >
    Kept, renegotiated, or explicitly dropped. A commitment that quietly stops being tracked is
    recorded as dropped, with a date — a ledger that only grows is one nobody reads.
  actor: agent
  produces: A closed commitment.
  done_when: The commitment has left the live set with a stated verdict.

objects_used:
- customer_support.obj.core.commitment
- customer_support.obj.core.named_contact
- customer_support.obj.core.ticket
- customer_support.obj.core.customer_account

limits:
- >
  It cannot capture what was said on a call unless somebody wrote it down. The most binding promises
  in support are made verbally, and this playbook's coverage is exactly the coverage of the written
  record.
- Step 5 assumes the slip is visible before the date. Promises that fail on the day itself skip straight to step 6.

failure_modes:
- >
  Step 3 skipped because the overdue date was enough to act on. It is the step that decides whether
  the next message is a chase or an answer, and getting it backwards costs standing rather than time.
- >
  The ledger maintained beautifully and never converted into a move. A register that produces no
  next action per line is diligence performed rather than work done.

variants:
- applies_to: swarming_support
  change: Step 1 records the promise against the case, not the agent, because the person who made it may not be the person who keeps it.
  why: In a swarm the promise outlives its author's involvement within hours.
- applies_to: ai_first_support
  change: Steps 1 and 2 are automatic; step 4 must remain human or become a template, and a templated no-news update is worse than none.
  why: The value of a no-news update is the evidence that a person is still holding it.

references:
- title: The Effortless Experience
  kind: book
  author: Dixon, Toman, DeLisi
  note: The source of the finding that broken small promises drive disloyalty harder than slow resolutions do.
- title: customer_support.obj.core.commitment
  kind: internal

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  completeness: complete
  notes: >
    The only Customer Support playbook in this batch that is fully executable against today's
    substrate: commitment.due_at, commitment.action and thread.ball_in_court all have real writers,
    which is why steps 1 to 4 can be checked rather than merely recommended.
