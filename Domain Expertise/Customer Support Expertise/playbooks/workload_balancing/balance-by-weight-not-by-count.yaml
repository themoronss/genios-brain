identity:
  id: customer_support.pb.workload_balancing.balance_by_weight_not_by_count
  name: Balance by weight, not by count
  kind: playbook
  domain: customer_support
  scope: capability
  owner_capability: customer_support.support_operations.workload_balancing
  subdomain: support_operations
  version: 1.0.0
  status: draft
purpose:
  statement: Load is balanced on effective weight — ticket complexity × current WIP — not raw counts,
    because ten password resets and ten incident escalations are not the same shift.

when_to_use:
  do_not_use_when:
  - The team is swarming a single incident. Load balancing during an incident competes with the coordination the incident needs.
steps:
- order: 1
  name: Weight tickets before counting them
  description: >
    Ten password resets and ten escalations are not the same shift, and the count dashboard says
    they are.
  actor: system
  objects_read: [customer_support.obj.core.ticket, customer_support.obj.core.effort_score]
  done_when: Load is expressed in effective weight.
- order: 2
  name: Include work in progress
  description: >
    Two agents with the same daily assignment and different open loads have different capacity, and
    only one of them is available.
  actor: system
  objects_read: [customer_support.obj.core.support_agent]
  done_when: Current WIP is part of the assignment decision.
- order: 3
  name: Cap work in progress
  description: >
    An agent holding twelve open tickets is context-switching rather than working, and every one of
    the twelve is slower for it.
  actor: system
  done_when: A ceiling exists and assignment respects it.
- order: 4
  name: Distribute difficulty, not just volume
  description: >
    Giving the capable agent every hard ticket is locally optimal each time and is how they leave
    within the year.
  actor: human
  done_when: Hard work is spread deliberately, including for development.
- order: 5
  name: Check perceived fairness against the dashboard
  description: >
    The team knows whose queue is heavy. Where the dashboard disagrees with them, the dashboard is
    measuring the wrong thing.
  actor: human
  done_when: The two readings agree, or the metric was changed.
objects_used: [customer_support.obj.core.ticket, customer_support.obj.core.support_agent, customer_support.obj.core.queue,
               customer_support.obj.core.backlog, customer_support.obj.core.effort_score]
limits:
- 'Weighting requires a difficulty estimate at assignment time, which is exactly when least is known about the ticket.'
- 'It distributes work; it cannot create capacity, and a fairly balanced overloaded queue is still overloaded.'
failure_modes:
- 'Step 4 skipped because the capable agent resolves it fastest, which is true and is the mechanism.'
- 'Step 5 treated as a morale survey rather than as a check on the instrument.'
variants:
- applies_to: swarming_support
  change: Balancing is emergent rather than assigned, and the risk moves to the same people claiming the hard work every time.
  why: Self-selection concentrates difficulty faster than assignment does.
- applies_to: outsourced_bpo
  change: Weighting must be contractual or the provider optimises for count, which is what is measured and paid.
  why: The incentive follows the metric across the boundary.
references:
- title: Workload distribution in service teams
  kind: practitioner
  note: Where perceived fairness is treated as a check on the load metric rather than as a separate concern.

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  completeness: complete
  notes: >
    Step 4 is the one that is correct to skip on every individual ticket and wrong to skip
    repeatedly. The capable agent does resolve it fastest, and a year of that is how they become
    the person who leaves.
