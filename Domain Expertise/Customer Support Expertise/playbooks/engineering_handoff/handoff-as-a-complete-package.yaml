identity:
  id: customer_support.pb.engineering_handoff.handoff_as_a_complete_package
  name: Handoff as a complete package
  kind: playbook
  domain: customer_support
  scope: capability
  owner_capability: customer_support.escalation_and_incident.engineering_handoff
  subdomain: escalation_and_incident
  version: 1.0.0
  status: draft
purpose:
  statement: A ticket crosses to engineering with repro, environment, impact, and what support already
    ruled out — one self-sufficient package, because every missing piece returns as a round-trip through
    the customer.

when_to_use:
  do_not_use_when:
  - Reproduction has not been attempted. Escalating an unreproduced report transfers the diagnosis rather than the defect, and it is the largest source of boomerangs.
steps:
- order: 1
  name: Assemble the package before sending
  description: >
    Repro, environment, impact, exclusions. A missing piece returns in two days as a question,
    having burned queue time twice and the customer's patience once.
  actor: human
  objects_read: [customer_support.obj.core.issue, customer_support.obj.core.bug_report]
  done_when: Engineering could start without contacting us.
- order: 2
  name: State impact in their terms
  description: >
    How many accounts, how badly, with what workaround. Support's urgency is real and it is not
    the input engineering prioritises on.
  actor: human
  objects_read: [customer_support.obj.core.customer_account]
  done_when: Impact is expressed as breadth and severity, not as pressure.
- order: 3
  name: Say what you already ruled out
  description: >
    Without it the first thing engineering does is repeat the three checks support already
    performed, which is the most avoidable duplication at this boundary.
  actor: human
  done_when: The exclusions are listed.
- order: 4
  name: Keep the customer owner on our side
  description: >
    The defect moves; the relationship does not. Unowned during escalation is the state customers
    describe as being abandoned.
  actor: human
  objects_read: [customer_support.obj.core.support_agent]
  done_when: A named person still holds the customer.
- order: 5
  name: Hold back what is not actionable
  description: >
    Escalating for attention trains engineering to discount support escalations generally, which
    costs the ones that mattered.
  actor: human
  done_when: The escalation is actionable or explicitly still in support.
objects_used: [customer_support.obj.core.issue, customer_support.obj.core.bug_report, customer_support.obj.core.customer_account,
               customer_support.obj.core.ticket, customer_support.obj.core.support_agent]
limits:
- 'It prepares and holds; it cannot make engineering prioritise, which is where escalated defects actually stall.'
- 'Step 1 costs support time that a queue under load does not have, which is why thin handoffs happen.'
failure_modes:
- 'Step 5 abandoned under customer pressure, which is understandable and slowly devalues every escalation.'
- 'Step 4 assumed rather than assigned, so both sides believe the other has the customer.'
variants:
- applies_to: swarming_support
  change: The boundary is softer and step 1 matters less, because the engineer is already in the conversation.
  why: Handoff is replaced by participation.
- applies_to: enterprise_support
  change: Step 2 carries account context that genuinely changes priority, and it must be verifiable rather than asserted.
  why: Revenue-weighted impact is legitimate and easily overstated.
references:
- title: Support-to-engineering escalation practice
  kind: practitioner
  note: Where handoff completeness is measured by return rate rather than by template compliance.

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  completeness: complete
  notes: >
    Step 5 is the one that erodes under customer pressure, and the erosion is invisible: each
    individual escalation is defensible and the aggregate teaches engineering to discount the
    channel.
