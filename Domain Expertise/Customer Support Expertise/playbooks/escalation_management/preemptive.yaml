purpose:
  statement: 'Escalate ahead of a known bad milestone — before the entitlement clock runs out, before
    a renewal conversation, before the customer''s own internal deadline — rather than at the moment
    of failure.


    Escalating before the breach is a plan; escalating after it is a report. The receiver has options
    in the first case and only apologies in the second, and the customer can tell which one they got.'
when_to_use:
  situations:
  - The failure is foreseeable and dated, and someone senior can still change the outcome.
  do_not_use_when:
