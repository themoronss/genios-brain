purpose:
  statement: 'Tell the raising agent what happened after the transfer, including when the escalation
    was judged unnecessary.


    Escalation judgement is learned only from feedback on past calls. An agent who never hears the outcome
    calibrates on how the transfer felt, which is the wrong signal, and typically converges on escalating
    less than they should.'
