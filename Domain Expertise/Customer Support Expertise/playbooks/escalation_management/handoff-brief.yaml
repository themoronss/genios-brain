purpose:
  statement: 'The handoff brief — symptom, impact on the customer''s actual work, what has been tried
    and what it ruled out, what the customer has already been told and promised, and the specific ask
    of the receiver. No brief, no transfer.


    The brief is the entire economic argument for escalating. With it, the transfer costs the receiver
    minutes; without it, it costs them the same investigation the outgoing owner already paid for, and
    the customer pays for it a second time in their own patience.'
