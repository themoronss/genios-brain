purpose:
  statement: 'Before anything else, ask who noticed. Customer noticed first — repair the relationship,
    then the fault. We noticed first — fix the fault, and tell the customer only where there is something
    for them to know, decide or do.


    The two triggers share a word and nothing else. Running the wrong branch is not merely inefficient:
    it either leaves a broken relationship behind a fixed ticket, or invents a worry in a customer who
    was perfectly content.'
