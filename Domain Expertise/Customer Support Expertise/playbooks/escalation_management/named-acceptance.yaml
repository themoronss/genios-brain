purpose:
  statement: 'Hold the escalation as pending until a named person acknowledges it. Pending is a visible
    state with a clock on it, not a silence.


    The dangerous interval is between raising and accepting, and it is invisible in every tool because
    both the sender and the system believe the work has moved on. Making acceptance explicit is what
    converts an announcement into a transfer.'
