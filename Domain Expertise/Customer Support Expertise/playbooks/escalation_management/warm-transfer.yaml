purpose:
  statement: 'Warm transfer over cold: the outgoing owner stays on the thread until the receiver has
    spoken to the customer once, then hands over in writing in front of the customer.


    It puts a witness on the handoff. The customer sees continuity rather than abandonment, and the
    receiver cannot quietly restart the diagnosis with the previous owner still reading.'
