purpose:
  statement: 'Have someone who did not build the flow attempt to reach a human from each self-service
    surface, unaided, and record what they had to do.


    Nobody sets out to hide the contact button; it disappears one reasonable optimisation at a time.
    Walking it is the only test that survives everyone''s good intentions, and if the walk is hard the
    deflection number is fiction regardless of how it is computed.'
when_to_use:
  situations:
  - Any time the help center, in-product help or the contact form is redesigned.
  do_not_use_when:
