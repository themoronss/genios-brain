purpose:
  statement: 'Place the answer inside the screen, email or error state that produced the question, rather
    than only in a destination the customer has to decide to visit.


    Searching requires the customer to name their problem correctly, which is precisely the thing a
    confused customer cannot do. Contextual placement removes that step entirely and routinely beats
    better-written content one click away.'
