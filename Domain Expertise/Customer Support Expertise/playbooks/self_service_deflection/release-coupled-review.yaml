purpose:
  statement: 'Bind the highest-traffic answers to the product areas they describe, so a shipped change
    forces a content check rather than waiting for someone to notice.


    Decay is the default state of knowledge and it produces no signal. An article nobody reports as
    wrong is not therefore right — it may simply be read by people who assume the mistake is theirs.'
