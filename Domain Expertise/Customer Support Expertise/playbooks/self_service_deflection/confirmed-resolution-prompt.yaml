purpose:
  statement: 'Ask the customer at the end of the flow whether this solved it, offer the human route
    in the same breath, and treat every unanswered prompt as unknown rather than as success.


    It converts deflection from an inference about absence into a claim the customer made. The cost
    is a lower reported number; the benefit is a number that cannot be improved by obstruction, which
    is the only kind worth acting on.'
