purpose:
  statement: 'Start from the contact reasons, ranked by volume, and sort each one by whether it can
    be answered without knowing anything about this specific account. Only then decide what to write.


    Content programmes that start from the content backlog write what authors can write. Starting from
    intents forces the uncomfortable finding that a large share of volume is account-specific and should
    never be deflected at all, which is the finding that keeps the programme honest.'
