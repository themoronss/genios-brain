purpose:
  statement: 'Read the raw query strings — especially the ones returning nothing and the ones the customer
    immediately refined — on a regular cadence, and use the query itself as the candidate article title.


    It is the only place in the whole funnel where a customer states, in their own words, a problem
    you have no answer for, before a ticket exists. Everything else measures the questions you already
    handle.'
