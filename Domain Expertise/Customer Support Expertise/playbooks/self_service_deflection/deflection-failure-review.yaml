purpose:
  statement: 'Sample tickets whose requester demonstrably visited the relevant answer before contacting,
    and review them as content defects with a reproduction case attached, not as agent workload.


    These are the highest-information tickets support produces: the answer existed, was found, and did
    not work. Every other analysis has to guess at why deflection failed; here the customer has already
    shown you.'
