purpose:
  statement: 'After a major incident, revisit the affected accounts once the noise has cleared rather
    than while it is loudest, and record who is still cold.


    During an outage every account looks at risk, so the signal carries no information. What discriminates
    is who remains disengaged after the apology cycle has finished and who quietly stopped using the
    thing that broke.'
