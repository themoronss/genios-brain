purpose:
  statement: 'Treat explicit mentions of alternatives, contract terms, notice periods or "evaluating
    options" as recorded evidence attached to the account, not as conversational texture that dies with
    the ticket.


    These phrases are the rare case where the customer tells us directly, and they are routinely lost
    because they arrive mid-thread in a ticket about something else. Capturing them is cheap; reconstructing
    them after the loss is impossible.'
