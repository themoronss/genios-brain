  owner_capability: customer_support.voice_of_customer.churn_signal_detection
  subdomain: voice_of_customer
  version: 1.0.0
  status: draft
purpose:
  statement: 'Run a standing sweep of accounts whose contact rate has fallen materially below their
    own established norm, and check each against whatever usage evidence is reachable before concluding
    anything.


    Falling contact with steady usage is self-sufficiency and is good news. Falling contact with falling
    usage is departure. The two are indistinguishable inside the support system alone, which is exactly
    why the sweep must be a scheduled review with a human reading it rather than an alert.'
when_to_use:
  do_not_use_when:
  - The preceding step in this capability has not produced its artefact yet.
