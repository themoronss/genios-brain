  actor: human
  description: Falling contact with steady usage is self-sufficiency and is good news. Falling contact
    with falling usage is departure. The two are indistinguishable inside the support system alone,
    which is exactly why the sweep must be a scheduled review with a human reading it rather than an
    alert.
