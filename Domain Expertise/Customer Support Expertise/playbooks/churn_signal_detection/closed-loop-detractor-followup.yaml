purpose:
  statement: 'Follow up on a detractor with a named human who can change something, and close the loop
    by telling the customer what changed.


    An unanswered complaint confirms the customer''s thesis that we do not listen, which is usually
    the underlying grievance rather than the incident itself. A survey that solicits criticism and then
    absorbs it silently is worse than no survey.'
