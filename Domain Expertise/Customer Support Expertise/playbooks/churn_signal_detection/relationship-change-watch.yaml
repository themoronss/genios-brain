purpose:
  statement: 'Watch for a change in who contacts us, not only in how much. Flag when the habitual contact
    goes silent and an unfamiliar name appears in their place.


    A reassignment or a disengagement of the internal power user removes the person who would have argued
    for the renewal. The account''s ticket volume can be unchanged while its advocacy has gone to zero.'
