purpose:
  statement: 'Sample recently resolved tickets from strategic accounts and read them for reopens, handoffs
    between agents, and how often the customer had to restate the same facts.


    This reconstructs effort for the silent majority who will never answer a survey. It is the only
    route to the loyalty-relevant measurement when response rates are dominated by the delighted and
    the furious.'
