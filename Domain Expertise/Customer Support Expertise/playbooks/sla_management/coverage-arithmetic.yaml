purpose:
  statement: 'Compute the deadline inside the entitlement''s coverage window, then translate it into
    the requester''s local time before anyone says it out loud.


    Two different errors hide here. Computing in the wrong calendar produces breaches nobody saw coming;
    quoting in the wrong timezone produces a customer who believes a different deadline than the one
    being measured, which is worse because both parties think they agree.'
