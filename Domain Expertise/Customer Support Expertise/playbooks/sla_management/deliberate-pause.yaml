purpose:
  statement: 'Pause only against a specific outstanding question that has been sent to the customer,
    and record the condition that restarts the clock at the same moment you pause it.


    A pause with no question is a hiding place. A pause with no restart condition never restarts — the
    ticket leaves the running board and re-enters the world weeks later as a complaint. Writing the
    restart condition at pause time costs seconds and is the only practice that reliably prevents both.'
