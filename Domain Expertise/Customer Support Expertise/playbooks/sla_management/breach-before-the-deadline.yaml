purpose:
  statement: 'When a clock is going to be missed, say so before it is missed — with a new commitment
    and a reason — rather than after.


    The apology is cheap before the deadline and expensive after it. Customers remember whether they
    were told, far more sharply than whether it was met; a disclosed miss is a relationship event, an
    undisclosed one is a trust event.'
