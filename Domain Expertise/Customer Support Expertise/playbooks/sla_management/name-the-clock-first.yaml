  owner_capability: customer_support.entitlement_and_sla.sla_management
  subdomain: entitlement_and_sla
  version: 1.0.0
  status: draft
purpose:
  statement: 'Before working a ticket, establish which clocks the entitlement actually created and which
    one this ticket will be judged on. Put that clock, and only that clock, in the view the agent works
    from.


    Agents optimise whatever is displayed. If the queue shows resolution and the contract promises first
    response, the team will work the wrong deadline diligently and correctly, and no amount of coaching
    will fix a display problem.'
