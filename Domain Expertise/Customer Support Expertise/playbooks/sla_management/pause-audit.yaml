  owner_capability: customer_support.entitlement_and_sla.sla_management
  subdomain: entitlement_and_sla
  version: 1.0.0
  status: draft
purpose:
  statement: 'Sweep paused tickets on a cadence and read the last outbound message, not the status field.
    Anything without a live unanswered question goes back to running with the pause reversed.


    The status field is the claim; the last outbound message is the evidence. Auditing the claim against
    itself is why invalid pauses survive in almost every support organisation — the abuse is trivially
    detectable and almost never looked for.'
