purpose:
  statement: 'Periodically intersect met-clock tickets with dissatisfied customers, and treat every
    overlap as a defect in the promise rather than in the agent.


    This is the only routine that can falsify an attainment number. Without it, high attainment is unfalsifiable
    and therefore uninformative, and the natural organisational response to an unhappy customer inside
    a met clock is to blame the person who met it.'
