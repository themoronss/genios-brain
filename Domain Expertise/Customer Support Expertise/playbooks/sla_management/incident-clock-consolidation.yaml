purpose:
  statement: 'When one cause is breaching many clocks, manage the clocks as a set: one status of record,
    one restoration commitment, per-ticket updates that all point at it.


    Treating a shared cause as many independent clocks multiplies the communication load exactly when
    capacity is lowest, and produces contradictory promises across tickets that customers compare with
    each other.'
