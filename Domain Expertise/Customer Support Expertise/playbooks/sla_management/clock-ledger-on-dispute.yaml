purpose:
  statement: 'Settle any SLA disagreement by reading the ledger end to end — start event, every pause
    with its cause, every restart, the deadline, the outcome — rather than by comparing recollections.


    Disputes are almost never about arithmetic and almost always about a pause somebody considers illegitimate.
    The ledger either shows the outstanding question or it does not, and that ends the conversation
    in either direction.'
