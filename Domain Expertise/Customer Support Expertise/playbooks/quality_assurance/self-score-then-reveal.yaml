purpose:
  statement: 'Have the agent score their own interaction against the same rubric before the reviewer''s
    score is shown. Discuss the gap, not the score.


    The gap separates a skill problem from a standard problem. An agent who scores themselves the same
    as the reviewer and still did it wrong needs training; an agent who scores themselves far higher
    never understood the standard, which is a rubric or onboarding finding rather than a performance
    one.'
