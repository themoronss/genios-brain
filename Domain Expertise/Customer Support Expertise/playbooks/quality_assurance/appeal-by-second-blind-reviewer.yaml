purpose:
  statement: 'A challenged score is re-scored by a reviewer who has not seen the first score, and the
    outcome is logged against the rubric dimension that was disputed.


    It makes disputes cheap enough to raise and turns them into calibration data. A dimension that generates
    repeated upheld appeals is a badly worded dimension, and the appeal log is the fastest way to find
    it.'
