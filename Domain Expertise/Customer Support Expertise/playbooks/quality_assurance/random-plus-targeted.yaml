purpose:
  statement: 'Keep two sampling buckets. One drawn at random from the eligible population to estimate
    the queue; one drawn deliberately to answer a stated question. Never average them, and never let
    the targeted bucket be reported as coverage.


    Both buckets are legitimate and they answer different questions. Mixing them produces a number that
    estimates nothing, and the targeted bucket — which is always heavier with failures, because that
    is why it was targeted — drags the estimate somewhere false.'
