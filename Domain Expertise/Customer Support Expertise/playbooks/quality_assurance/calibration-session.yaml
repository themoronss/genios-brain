purpose:
  statement: 'Reviewers independently score the same interaction, then reconcile — and the reconciliation
    output is an edit to the rubric wording, not an instruction to a reviewer.


    A verbal agreement between reviewers decays and does not survive a new hire. If the disagreement
    was real, the rubric was ambiguous, and fixing the rubric is the only repair that persists.'
