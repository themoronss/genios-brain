purpose:
  statement: 'On a standing cadence, re-derive the rubric from the tickets that actually arrived this
    period, and delete dimensions that no longer discriminate.


    Rubrics rot as the product changes. Dimensions written for a problem the product no longer has cost
    reviewer attention and crowd out the ones that matter now, and nobody ever removes a dimension unless
    removal is somebody''s scheduled job.'
