purpose:
  statement: 'State the cause as conditions, mechanism, expected versus actual — in language someone
    outside the investigation could use to prove you wrong.


    An unfalsifiable cause cannot be reviewed, cannot be tested by the fix, and cannot be inherited
    by whoever picks the issue up next. If nobody can argue with it, it was a summary rather than an
    analysis.'
