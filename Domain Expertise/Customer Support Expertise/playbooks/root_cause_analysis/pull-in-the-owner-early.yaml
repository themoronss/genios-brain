purpose:
  statement: 'Bring in whoever owns the subsystem at the point of the first credible hypothesis, not
    at the point of exhaustion — with the timeline, the IS/IS-NOT and the reproduction attempt already
    assembled.


    Their marginal cost of eliminating a hypothesis is far lower than support''s, and the handover is
    only cheap while the evidence is still fresh. Escalating an exhausted investigation transfers confusion
    rather than a question.'
