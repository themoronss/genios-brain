purpose:
  statement: 'Write the IS and the IS-NOT side by side: which accounts, versions, regions, roles and
    inputs show the symptom, and which comparable ones do not. Investigate the boundary rather than
    the centre.


    Confirming cases narrow nothing — a hundred of them are compatible with almost any hypothesis. The
    first genuine disconfirming case eliminates half the space, and the boundary between affected and
    unaffected is the shape of the cause.'
