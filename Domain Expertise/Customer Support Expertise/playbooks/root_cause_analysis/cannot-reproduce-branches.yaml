purpose:
  statement: 'When it will not reproduce, branch rather than stop. Split into environmental (something
    in their setup we do not have), intermittent (state, timing or ordering), data-dependent (their
    records, not ours), and misdescribed (they did something other than what they reported) — and take
    the different next step each demands.


    Cannot-reproduce is a strong finding: it has already eliminated the entire class of deterministic
    universal faults. Recording it as a close reason throws that elimination away and guarantees the
    next occurrence starts from nothing.'
