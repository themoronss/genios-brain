purpose:
  statement: 'Keep asking why until the answer names something the organisation owns and can change.
    If the next answer would be a person''s name or an act of nature, you have stopped one question
    early and should ask what allowed it instead.


    A cause is only useful if acting on it changes the probability of recurrence. People are the most
    substitutable component in any system, so a cause naming one predicts nothing about whether it happens
    again.'
