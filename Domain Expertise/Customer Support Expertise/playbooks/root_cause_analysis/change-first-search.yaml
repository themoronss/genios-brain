purpose:
  statement: 'Ask what changed before asking what is broken. Most faults in a running system are not
    new faults; they are old faults newly reachable because something moved — a version, a limit, a
    data shape, a permission, a dependency.


    Systems that worked yesterday and fail today have a smaller explanation space than systems examined
    from first principles. Starting from the code is starting from the largest search space available.'
