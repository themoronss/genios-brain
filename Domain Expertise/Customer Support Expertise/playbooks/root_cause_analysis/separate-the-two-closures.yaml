identity:
  id: customer_support.pb.root_cause_analysis.separate_the_two_closures
  name: Separate the two closures
  kind: playbook
  domain: customer_support
  scope: capability
  owner_capability: customer_support.diagnosis_and_resolution.root_cause_analysis
  subdomain: diagnosis_and_resolution
  version: 1.0.0
  status: draft
purpose:
  statement: 'Record two closures explicitly and never let one imply the other: what made the customer''s
    problem stop, and what made the fault stop. Where only the first happened, mark the issue open,
    assign it an owner, and attach the condition under which it must be revisited.


    This is the single distinction the whole capability exists to hold. A support system with one closure
    field cannot tell the difference between a fixed product and a well-managed backlog of unfixed defects,
    and it reports the second as the first.'
