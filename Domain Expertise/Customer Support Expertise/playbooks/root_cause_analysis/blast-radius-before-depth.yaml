  subdomain: diagnosis_and_resolution
  version: 1.0.0
  status: draft
purpose:
  statement: 'Map who is affected before going deep on anyone. Search every ticket carrying this symptom,
    attach them to a single issue, and look at what the affected share and what the unaffected do not.


    Depth on a single-account defect is the most expensive way to be right, and the shape of the affected
    population constrains the cause before a single log line is read. It also stops the same fault being
    investigated three times in parallel by three agents.'
