purpose:
  statement: 'Reconstruct the timeline before forming any hypothesis: first occurrence, last known good,
    and every change that landed in between — releases, configuration, data volume, entitlement changes,
    third-party incidents, and the customer''s own changes, which nobody thinks to ask about.


    Order of events is the cheapest evidence available and the fastest to be destroyed by log rotation
    and memory. Hypothesis-first investigation reads a timeline looking for confirmation and reliably
    finds it.'
