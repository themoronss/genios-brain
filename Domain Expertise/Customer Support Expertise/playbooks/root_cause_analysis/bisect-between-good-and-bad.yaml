purpose:
  statement: 'Bisect between the last known good and the first known bad along whichever axis is cheapest
    to halve — version, configuration, tenant, data set, time window.


    Bisection converges without requiring a theory, and theories are what make investigations stall.
    It is the only technique on this list that works when nobody understands the subsystem.'
