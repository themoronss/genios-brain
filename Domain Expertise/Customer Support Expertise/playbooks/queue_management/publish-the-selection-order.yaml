purpose:
  statement: 'Write down the order work is taken in, by class rather than by ticket, and make it visible
    in the same place the queue is.


    If the order is not stated, every agent supplies their own, and the sum of individually rational
    choices is the queue''s worst outcome. Writing it down also makes it arguable — a bad published
    order gets fixed, an unpublished one gets rediscovered in a postmortem.'
