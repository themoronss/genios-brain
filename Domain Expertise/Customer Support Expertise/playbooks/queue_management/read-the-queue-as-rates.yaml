purpose:
  statement: 'Before touching a single ticket, state three things: what arrived, what closed, and which
    is larger.


    A growing pile and a shrinking pile look identical in a screenshot and need opposite interventions.
    If arrivals exceed closures, no amount of working harder inside the queue changes the trajectory
    — the answer is on the arrival side or in the service rate itself, never in effort.'
