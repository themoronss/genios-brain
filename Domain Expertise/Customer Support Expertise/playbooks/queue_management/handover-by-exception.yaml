purpose:
  statement: 'Hand a queue over by naming what is aging, what has been promised and what is stuck —
    never by reciting the count.


    The count is already on the screen. What does not survive a shift change is context: which customer
    was told what, which ticket is one reply from closing, which one is quietly about to become an escalation.'
