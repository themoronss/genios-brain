purpose:
  statement: 'Separate predictable, fast work from investigative, slow work into distinct lines before
    attempting to balance anything.


    Mixing service times in one line is the single cheapest way to make a queue worse: the variance
    of the slow work is inflicted on all of the fast work, and neither population can be given an honest
    expectation.'
