purpose:
  statement: 'When volume spikes, spend the first stretch of the response on why it rose, not on absorbing
    it.


    Support volume rarely rises because the world changed; it rises because we changed something — a
    release, a pricing email, a broken form, a status page nobody updated. Fixed at the cause it costs
    one action; absorbed in the queue it costs every ticket.'
when_to_use:
  situations:
  - Arrival rate departs sharply from its own recent shape rather than drifting.
  do_not_use_when:
