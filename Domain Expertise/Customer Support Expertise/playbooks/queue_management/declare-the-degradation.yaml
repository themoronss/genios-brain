purpose:
  statement: 'When the queue is behind, decide what is not being served, say so internally, and tell
    the affected customers before they discover it by waiting.


    Undeclared degradation still happens — it just happens invisibly, unevenly and to whoever is unlucky.
    A stated reduction in scope is a decision that can be reviewed; an unstated one is a lottery the
    customer loses without being told they entered.'
