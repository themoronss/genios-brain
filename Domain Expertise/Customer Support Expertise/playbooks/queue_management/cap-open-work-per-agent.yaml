purpose:
  statement: 'Limit how many tickets an agent holds open rather than pushing how many they close.


    An agent juggling a wide open pile ages every item in it simultaneously. Constraining work in progress
    converts the same throughput into markedly lower wait, because tickets finish instead of all advancing
    slightly.'
