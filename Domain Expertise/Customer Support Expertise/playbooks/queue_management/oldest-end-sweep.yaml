purpose:
  statement: 'Run a standing pass over the oldest end of the queue as a separate assignment, given to
    someone who is not simultaneously measured on volume that shift.


    Anything that competes with throughput loses to throughput. Aged tickets are slow, context has been
    lost, and the customer is already unhappy — an agent choosing rationally will never pick one. The
    tail only gets worked when working the tail is somebody''s actual job for the day.'
