identity:
  id: customer_support.pb.breach_prevention.work_the_at_risk_list_hourly
  name: Work the at-risk list, not the breach list
  kind: playbook
  domain: customer_support
  scope: capability
  owner_capability: customer_support.entitlement_and_sla.breach_prevention
  subdomain: entitlement_and_sla
  version: 1.0.0
  status: stable
purpose:
  statement: >
    Produce a short list of cases that WILL breach if nobody changes anything, hours before they do,
    and act on the cheapest intervention for each. A queue that alerts at the moment of breach is not
    warning anyone — it is reporting the past.
  answers:
  - Which cases are going to breach, and what is the earliest cheap move?
  - Which cases are safe, so that the amber list means something?

when_to_use:
  conditions:
  - {path: thread.ball_in_court, op: "=", value: us}
  do_not_use_when:
  - A major incident is running. The queue is unrepresentative and every forecast built on it is wrong.
  - The list would exceed what the shift can actually work. A list nobody can clear is a report, and it trains people to ignore amber.

steps:
- order: 1
  name: Forecast from load, not from time remaining
  description: >
    Time remaining is the input every tool uses and the least predictive one. What decides the outcome
    is the assignee's other deadlines this shift, whether the deadline crosses a coverage handover,
    and whether our last outbound actually asked the customer for anything.
  actor: system
  objects_read: [customer_support.obj.core.sla_target, customer_support.obj.core.coverage_window, customer_support.obj.core.backlog]
  produces: A ranked at-risk list.
  done_when: Each entry names WHY it is at risk, not just when it is due.
- order: 2
  name: Cut the list to what the shift can work
  description: >
    An instrument that leaves every ticket permanently amber has the same information content as one
    that says nothing. The list's credibility is its only asset.
  actor: human
  produces: A workable list.
  done_when: The list is short enough that clearing it is plausible.
- order: 3
  name: Take the cheapest intervention per case
  description: >
    Usually a reassignment, a two-line holding reply, or a handover note to the next region. The
    expensive interventions are rarely necessary this early, which is the entire argument for being early.
  actor: human
  produces: One action per entry.
  done_when: Every entry has a taken action or a stated decision not to act.
- order: 4
  name: Check what the intervention cost elsewhere
  description: >
    Pulling an agent onto an at-risk case without looking at what they were holding is how one amber
    ticket becomes three.
  actor: human
  objects_read: [customer_support.obj.core.support_agent]
  done_when: No new at-risk case was created by the fix.
- order: 5
  name: Refuse the pause that is not real
  description: >
    Asking a customer a question we do not need the answer to stops the clock, meets the target and
    serves nobody. Customers notice the pattern faster than managers do.
  actor: human
  done_when: Any clock pause is justified by needing the answer.
- order: 6
  name: Warn on the breach you cannot prevent
  description: >
    An unavoidable breach the customer was told about costs a fraction of the same breach they
    discover themselves.
  actor: human
  produces: A pre-breach message.
  done_when: The customer knows before the deadline passes.

objects_used:
- customer_support.obj.core.sla_target
- customer_support.obj.core.support_plan
- customer_support.obj.core.coverage_window
- customer_support.obj.core.backlog
- customer_support.obj.core.support_agent
- customer_support.obj.core.ticket

limits:
- >
  Steps 1 and 2 need queue telemetry — sla.clock_state, ticket.status, derived.backlog_age, the
  coverage window — none of which has a writer today. On a correspondence-only tenant only step 5 and
  step 6 are runnable, and step 6 is the one worth keeping.
- It forecasts breaches, not quality. A queue that never breaches can still be answering badly.

failure_modes:
- >
  Run as an alert rather than as a shift ritual. An alert per at-risk case reproduces the permanently
  amber failure this playbook exists to avoid; the list is a list, worked at an interval.
- Step 5 quietly dropped because the breach metric improves without it. That is the metric being gamed, and it is visible only in clock_pause_share.

variants:
- applies_to: follow_the_sun
  change: Step 1's handover term dominates. Most preventable breaches in a follow-the-sun model are deadlines landing in the gap between regions.
  why: The coverage boundary is where the forecast is both hardest and most valuable.
- applies_to: swarming_support
  change: Step 4 becomes cheap — there is no single assignee to pull off something else.
  why: Swarming already distributes the load this step exists to protect.
- applies_to: smb_support
  change: Steps 1 and 2 collapse into reading the queue. The discipline survives, the machinery does not.
  why: Below a certain volume a person can hold the whole at-risk list in their head.

references:
- title: ITIL 4 — Service Level Management
  kind: framework
  note: Where the distinction between monitoring a target and managing toward it is made explicitly.
- title: customer_support.obj.core.sla_target
  kind: internal

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  completeness: complete
  notes: >
    Steps 2 and 5 are the two that keep this capability honest, and both make the headline metric look
    worse in the short term — a shorter list and fewer pauses. A team that drops them will report a
    better breach rate and be serving customers less well, which is the failure this playbook is
    actually written against.
