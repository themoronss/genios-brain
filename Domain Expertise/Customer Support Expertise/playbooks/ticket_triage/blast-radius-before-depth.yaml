purpose:
  statement: 'Establish breadth before depth: one user, one account, one segment, or everyone.


    Depth is what the reporter can see and describe. Breadth is what turns a ticket into an incident,
    and it is invisible from inside a single ticket unless triage deliberately goes looking for the
    second report.'
