purpose:
  statement: 'When two queues are genuinely equally plausible, choose the one with the shorter path
    to a diagnosis and record that it was a coin flip.


    Ambiguity resolved by a stated coin flip is auditable and improvable — the pattern shows up in reassignment
    data and the taxonomy gets fixed. Ambiguity resolved by escalating to a lead moves the identical
    coin flip to a more expensive person and leaves no trace.'
