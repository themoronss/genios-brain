purpose:
  statement: 'Answer two questions separately and in order — what is broken and for whom, then what
    we work on first — and write both answers down.


    Severity is a claim about the world and stays true after the ticket is reassigned. Priority is an
    allocation of attention and expires the moment the queue''s contents change. Recording only the
    merged verdict throws away the half that is still valid tomorrow.'
