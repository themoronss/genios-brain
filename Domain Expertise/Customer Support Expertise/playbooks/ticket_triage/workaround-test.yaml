purpose:
  statement: 'Ask whether a workaround the customer can execute today exists, before deciding severity.


    It is the only severity input a triager can usually establish without engineering, and it genuinely
    changes the answer — the same fault with and without a clean workaround are not the same severity,
    because severity is about harm sustained rather than code correctness.'
