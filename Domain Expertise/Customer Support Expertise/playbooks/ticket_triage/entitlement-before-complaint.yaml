purpose:
  statement: 'Open the entitlement before reading the complaint.


    The entitlement bounds what may be promised and frequently changes the verdict outright. Read second,
    it becomes a check on a conclusion already anchored by the customer''s framing, and anchored conclusions
    survive contradicting evidence far more often than they should.'
