purpose:
  statement: 'Ask the single question that would change the route, and route provisionally while waiting
    for the answer.


    A ticket parked in waiting-on-customer at triage looks handled and is not; it has an apparent owner,
    a paused-looking clock and nobody watching it. Provisional routing keeps a named owner attached
    to a clock that is still running.'
