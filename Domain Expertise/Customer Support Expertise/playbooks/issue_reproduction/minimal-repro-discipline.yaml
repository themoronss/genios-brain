identity:
  id: customer_support.pb.issue_reproduction.minimal_repro_discipline
  name: Minimal repro discipline
  kind: playbook
  domain: customer_support
  scope: capability
  owner_capability: customer_support.diagnosis_and_resolution.issue_reproduction
  subdomain: diagnosis_and_resolution
  version: 1.0.0
  status: draft
purpose:
  statement: 'A reproduction is the issue captured in the fewest steps that still fail. The minimal repro
    is the handoff currency: engineering trusts it, fixes verify against it, and closure is testable because
    of it.'
steps:
- order: 1
  name: Script the exact path
  description: Numbered steps from clean state to failure, with data values. 'Sometimes it breaks' is
    a symptom report, not a repro.
  actor: human
- order: 2
  name: Shrink until every step is load-bearing
  description: Remove steps until removal makes it pass. What remains is the cause's outline.
  actor: human
- order: 3
  name: Record environment as part of the repro
  description: Version, browser, tenant config — a repro that omits its environment reproduces arguments
    instead of bugs.
  actor: human
