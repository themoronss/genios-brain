identity:
  id: customer_support.pb.support_analytics.drivers_first_averages_second
  name: Drivers first, averages second
  kind: playbook
  domain: customer_support
  scope: capability
  owner_capability: customer_support.support_operations.support_analytics
  subdomain: support_operations
  version: 1.0.0
  status: draft
purpose:
  statement: Support analytics starts with WHAT is driving tickets — categories, trends, per-account spikes
    — because volume drivers are actionable while org-wide averages mostly hide the story inside them.

when_to_use:
  do_not_use_when:
  - The period is dominated by an incident. Every metric describes the incident, and reporting the month as if it were normal misleads more than saying nothing.
steps:
- order: 1
  name: Lead with drivers
  description: >
    What is generating tickets, by category and trend and per-account spike. Drivers are
    actionable; org-wide averages are comparable and inert.
  actor: system
  objects_read: [customer_support.obj.core.ticket, customer_support.obj.core.product_area]
  done_when: The first thing reported is what changed and why.
- order: 2
  name: Report distributions, not means
  description: >
    The tail is what customers experience and the mean is what makes a chart look settled. The gap
    between them is where the escalations come from.
  actor: system
  done_when: Percentiles are shown alongside any average.
- order: 3
  name: Pair every gameable metric with its counterweight
  description: >
    Handle time with reopens, deflection with escalation temperature, closure speed with reopen
    rate. Alone, each rewards the wrong behaviour.
  actor: system
  done_when: No gameable number appears unaccompanied.
- order: 4
  name: Route ticket volume to product
  description: >
    It is the product's error rate as experienced by humans, and analytics' highest use is getting
    a rising driver category in front of the team that owns it.
  actor: human
  objects_read: [customer_support.obj.core.content_gap]
  done_when: Driver trends reached product.
- order: 5
  name: Refuse the claims the data cannot carry
  description: >
    Handle time by agent on a mixed queue ranks ticket difficulty. Producing it because somebody
    asked spends the credibility of every sound number in the same report.
  actor: human
  done_when: Unsupportable requests were declined with a reason.
objects_used: [customer_support.obj.core.ticket, customer_support.obj.core.backlog, customer_support.obj.core.product_area,
               customer_support.obj.core.support_agent, customer_support.obj.core.customer_account]
limits:
- 'It reports what the queue holds. Customers who did not contact us are invisible, and they include the ones who gave up.'
- 'Driver attribution depends on the taxonomy, which is a classification decision made upstream.'
failure_modes:
- 'Step 5 abandoned under pressure from a leader who wants a ranking, which is the moment the function''s value is decided.'
- 'Step 3 dropped for simplicity, which produces a clean dashboard that rewards early closure.'
variants:
- applies_to: outsourced_bpo
  change: Contractual metrics are usually the gameable ones, so step 3 has to be written into the agreement rather than added to the report.
  why: What is measured is what is paid for.
- applies_to: plg_self_serve
  change: Step 4 dominates — with no relationship layer, the ticket stream is the primary product feedback channel.
  why: Nobody else is talking to the customer.
references:
- title: Service metrics and gaming
  kind: practitioner
  note: Where each common support metric is paired with the behaviour that improves it without improving service.

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  completeness: complete
  notes: >
    Step 5 is where this function's credibility is decided. Producing an unsupportable ranking
    because a leader asked spends the trust of every sound number in the same report, and it is
    asked for constantly.
