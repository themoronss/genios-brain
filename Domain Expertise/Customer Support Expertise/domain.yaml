# Customer Support — domain root
#
# The one question this domain answers, in Layer 3 terms:
#   "How would a seasoned support operator read this situation?"
#
# Not what is true (Layer 2). Not what to do (Layer 4). Only how an expert would understand it.
#
# ARCHITECTURE v2 — identical to Sales, deliberately. A second domain is the first real test
# of whether the layout was a structure or a habit.
#
#   objects/core/<name>.yaml              shared — loaded by MORE THAN ONE capability
#   objects/<capability>/<name>.yaml      scoped — loaded by EXACTLY ONE
#
#   capabilities/<NN-subdomain>/<capability>/
#       capability.yaml     purpose, expertise, KPIs, handoffs
#       objects.yaml        the load-set — references only, core and scoped split
#       situations/         the situations this capability owns
#
# Support MODELS (tiered, swarming, follow-the-sun, AI-first...) and OFFERINGS (product,
# service, hybrid) do not re-list capabilities. They live under models/ and offerings/ and
# change how these capabilities behave, never whether the profession has them.
#
# ─────────────────────────────────────────────────────────────────────────────
# READ THIS BEFORE JUDGING THE COVERAGE NUMBERS
#
# Sales was authored against packs that already shipped. Customer Support was not: there is
# no support_v1 pack. Of the 26 Layer 2 situation types in the substrate, exactly FIVE are
# domain-neutral — commitment_overdue, unanswered_email, champion_quiet, meeting_no_followup,
# intro_followup — and ZERO observation kinds are support-native. No ticket, no SLA clock, no
# CSAT, no escalation, no incident.
#
# That leaves two honest options and one dishonest one. The dishonest one is to bind
# "SLA breach imminent" to `unanswered_email` because it is the closest thing available; the
# situation then routes, the dashboard shows coverage, and the system nudges about the wrong
# thing forever. It is worse than a gap because it looks like the opposite of one.
#
# So this domain does what the library already does at the pattern level. Six situations bind
# to types Layer 2 genuinely emits and run today. The rest declare their real trigger under
# `matches.pending_l2_situation_types`, route nothing, and appear in registry/signal-backlog.md
# as the concrete specification of what a support_v1 pack must emit.
#
# The backlog is the deliverable here, not an apology for one.
# ─────────────────────────────────────────────────────────────────────────────

identity:
  id: customer_support
  name: Customer Support
  version: 1.0.0
  status: draft

description: >
  The promise-keeping motion: receiving what a customer asks, deciding how urgent it is and
  who owns it, working out what is actually wrong, fixing it or routing it to whoever can,
  keeping the human informed while that happens, honouring whatever was contractually
  promised about how fast — and then making sure the same question does not have to be asked
  again. Plus the operations and management disciplines that keep a queue staffed, measurable
  and survivable.

question: "How would a seasoned support operator read this situation?"

# ─────────────────────────────────────────────────────────────────────────────
# Subdomains — the resolution lifecycle, in order
#
# The ordering is the life of one contact, not an org chart. Intake before diagnosis because
# a misrouted ticket is unfixable downstream; knowledge before voice-of-customer because
# deflection is a resolution activity and satisfaction is a measurement one.
# ─────────────────────────────────────────────────────────────────────────────
subdomains:

  - id: intake_and_triage
    dir: "01-intake-and-triage"
    name: Intake & Triage
    question: "What came in, how bad is it, and who should own it?"
    capabilities: [channel_intake, intent_classification, ticket_triage, priority_and_severity,
                   routing_and_assignment, duplicate_and_merge]
    note: >
      priority_and_severity is one capability and not two on purpose. They are different
      things — severity is how broken it is, priority is what we do about it first — and the
      expertise is entirely in holding them apart under pressure. Splitting them into separate
      capabilities loses exactly the knowledge that matters.

  - id: diagnosis_and_resolution
    dir: "02-diagnosis-and-resolution"
    name: Diagnosis & Resolution
    question: "What is actually wrong, and what makes it stop being wrong?"
    capabilities: [issue_reproduction, diagnostics, root_cause_analysis, workaround_management,
                   resolution_delivery, verification_and_closure]

  - id: customer_communication
    dir: "03-customer-communication"
    name: Customer Communication
    question: "Does the human on the other end know where they stand?"
    capabilities: [response_drafting, expectation_setting, proactive_status_updates,
                   de_escalation, tone_and_localization]

  - id: entitlement_and_sla
    dir: "04-entitlement-and-sla"
    name: Entitlement & SLA
    question: "What did we promise this customer, and are we about to break it?"
    capabilities: [entitlement_verification, sla_management, breach_prevention,
                   coverage_and_on_call, commitment_tracking]

  - id: knowledge_and_deflection
    dir: "05-knowledge-and-deflection"
    name: Knowledge & Deflection
    question: "How does this stop being asked?"
    capabilities: [knowledge_authoring, macro_management, self_service_deflection,
                   content_gap_analysis, ai_deflection]

  - id: escalation_and_incident
    dir: "06-escalation-and-incident"
    name: Escalation & Incident
    question: "This is bigger than one ticket — now what?"
    capabilities: [escalation_management, incident_management, major_incident_communication,
                   engineering_handoff, executive_escalation, postmortem]

  - id: voice_of_customer
    dir: "07-voice-of-customer"
    name: Voice of Customer
    question: "What is the aggregate telling us that no single ticket can?"
    capabilities: [satisfaction_measurement, sentiment_analysis, feedback_synthesis,
                   product_feedback_routing, churn_signal_detection]

  - id: support_operations
    dir: "08-support-operations"
    name: Support Operations
    question: "Is the queue staffed, measurable and affordable?"
    capabilities: [queue_management, workload_balancing, capacity_planning, support_analytics,
                   cost_to_serve]

  - id: support_management
    dir: "09-support-management"
    name: Support Management
    question: "Are the people, the queues and the named accounts being run well?"
    capabilities: [agent_coaching, quality_assurance, performance_management, ticket_review,
                   team_health, account_relationship_management]
    note: >
      team_health is a capability and not an HR concern. Support is the only function in a
      company where the job is absorbing other people's frustration all day, attrition is the
      dominant cost driver, and burnout is visible in queue data weeks before it is visible in
      a resignation. An expert reads it from the tickets.

# ─────────────────────────────────────────────────────────────────────────────
# Naming — enforced by _tools/validate.py
# ─────────────────────────────────────────────────────────────────────────────
id_scheme:
  domain: "customer_support"
  subdomain: "customer_support.<subdomain>"
  capability: "customer_support.<subdomain>.<capability>"
  situation: "customer_support.sit.<name>"
  core_object: "customer_support.obj.core.<name>"
  scoped_object: "customer_support.obj.<capability>.<name>"
  model: "customer_support.model.<model>[.<vertical>]"
  offering: "customer_support.offering.<family>[.<type>]"

# ─────────────────────────────────────────────────────────────────────────────
# The core / scoped rule
#
# CORE      loaded by MORE THAN ONE capability   -> objects/core/
# SCOPED    loaded by EXACTLY ONE                -> objects/<capability>/
#
# Decided by the reference graph, not by intent, and validate.py enforces it in both
# directions. See Sales domain.yaml for the full argument; it is the same rule and it does not
# get a second opinion here.
# ─────────────────────────────────────────────────────────────────────────────
core_objects:
  people_and_orgs: [requester, customer_account, support_agent, stakeholder, escalation_owner,
                    named_contact]
  work:            [ticket, conversation, issue, resolution, workaround, root_cause,
                    bug_report, commitment, escalation, incident]
  contract:        [entitlement, sla_target, support_plan, coverage_window]
  experience:      [customer_sentiment, satisfaction_score, effort_score, churn_risk]
  knowledge:       [knowledge_article, intent, product_area, content_gap]
  operations:      [queue, backlog, capacity_plan, quality_scorecard]

# Referenced but not yet authored. A reference to an id here is a tracked WARNING; a
# reference to an id that appears nowhere is an ERROR. Regenerate with:
#   python "Domain Expertise/_tools/plan.py"
