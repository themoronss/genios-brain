# ─────────────────────────────────────────────────────────────────────────────
# Glossary — terms that mean something specific HERE and are routinely confused
#
# The first four exist because conflating them is the most common modelling error in support
# software, and every ticketing product on the market has made at least one of them.
# ─────────────────────────────────────────────────────────────────────────────
glossary:

  - term: Ticket
    means: >
      One unit of promised work with a state, an owner and a clock. It is NOT the conversation
      and it is NOT the problem. A ticket can be closed while the issue behind it is wide open,
      which is exactly what "resolved" means when we shipped a workaround.

  - term: Conversation
    means: >
      The message thread with the human. One conversation can spawn several tickets ("also,
      while I have you...") and one ticket can span several conversations across channels.
      Modelling them as the same object is why so many systems lose the second question.

  - term: Issue
    means: >
      The underlying defect or gap. Many tickets, one issue. This is the object that makes
      "forty customers hit this" expressible; without it every report is a fresh surprise and
      the queue can never tell you what to fix.

  - term: Resolution
    means: >
      What made the customer's problem stop. Distinct from a fix: a refund, a workaround, a
      documentation link and a code change are all resolutions, and only one of them closes
      the issue.

  - term: Severity vs Priority
    means: >
      Severity is how broken it is — a property of the fault. Priority is what we work on
      first — a decision about scarce attention. A sev-1 on a free trial account and a sev-3
      on a customer renewing next week routinely invert. Collapsing the two is the single
      most expensive triage error there is.

  - term: Entitlement
    means: >
      What this customer is contractually owed — channels, hours, response targets, named
      contacts. It bounds what may be promised. It is checked, never assumed, and it expires.

  - term: SLA target
    means: >
      A specific clock with a start, a pause condition and a deadline. Entitlement says a
      four-hour first response exists; the SLA target is the timestamp four hours from now on
      this ticket, and whether the clock is currently running.

  - term: Escalation
    means: >
      A transfer of ownership upward or sideways, with a reason. Not a synonym for "urgent"
      and not a synonym for "the customer is angry" — both of those can be true without one,
      and an escalation without a named receiving owner is a complaint.

  - term: Deflection
    means: >
      A contact that never became a ticket because the answer was already reachable. The only
      support metric that improves by the work not existing, and therefore the only one that
      is routinely gamed by making help hard to find.

  - term: Object
    means: >
      The smallest reusable knowledge unit. Authored once and referenced by id. Carries
      eighteen sections, of which inference_patterns does most of the work.

  - term: Core object
    means: >
      An object loaded by more than one capability. Lives in objects/core/ and is authored
      once — Ticket is needed by twenty capabilities and twenty copies would drift apart
      within a week.

  - term: Scoped object
    means: >
      An object loaded by exactly one capability. Lives in objects/<capability>/. Macro
      belongs to macro_management and would be noise anywhere near incident response.

  - term: Situation
    means: >
      The load-set selector between a capability and its objects. Exists so a compile loads
      five objects instead of forty. Lives in situations/ inside its owning capability.

  - term: Business Situation (Layer 2)
    means: >
      A DIFFERENT thing with a similar name — the BusinessSituationObject Layer 2 emits. Our
      situation files bind to it through `matches.l2_situation_types`; an unbound situation can
      never be looked up and fails silently, producing nothing and logging nothing.

  - term: pending_l2_situation_types
    means: >
      A situation whose real trigger no shipped pack emits. Routes nothing today, states
      exactly what Layer 1 or 2 must emit, and is ranked in registry/signal-backlog.md. The
      situation-level twin of an inference pattern's `needs_signal`, and for this domain it
      is the majority of the file set — see the header.

  - term: needs_signal
    means: >
      An authored inference pattern whose fact paths or observation kinds the pipeline does
      not emit yet. Not a defect — it is the Layer 1/2 backlog, ranked by _tools/backlog.py.

