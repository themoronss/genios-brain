  notes: >
    Stub — identity, purpose and load-set only. Promote by writing failure_modes FIRST rather
    than outcomes: the expertise in intake is almost entirely about channel-specific loss (what a
    phone intake drops that an email intake keeps, why a forwarded contact arrives with the wrong
    requester attached, how a chat that ends without a ticket becomes an invisible promise). Then
    add heuristics for the one-arrival-many-tickets split and for deciding when a channel's
    implied expectation should and should not reach the priority decision. Handoffs are already
    clear: downstream into intent_classification and ticket_triage, parallel with
    duplicate_and_merge. Blocked in practice on the Conversation object being authored, since
    intake's central distinction — conversation is not ticket — has nothing to reference until
    then.
