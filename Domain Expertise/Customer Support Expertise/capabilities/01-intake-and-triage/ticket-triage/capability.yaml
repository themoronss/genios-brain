metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-08'
  review_status: approved
  confidence: provisional
  notes: 'Note what is deliberately absent: no severity bands, no ageing thresholds, no reassignment limits,
    no weighting between entitlement and blast radius. All of that is Layer 4 arithmetic and belongs in
    the pack manifest; a number appearing here would mean the Layer 3/4 boundary had leaked. Note also
    what this capability cannot currently see — there is no ticket, SLA or escalation signal in the substrate,
    so nothing in this file is executable today and the objects it loads carry the gap as needs_signal
    patterns rather than pretending otherwise. Two claims here are the most likely to be argued with on
    review and should be: that unknown severity must fail toward attention rather than into a triage backlog,
    and that priority should be cheap to revise while severity is not. Both are defensible in a queue
    with slack and become expensive in one without it, which is the review question worth asking.

    '
  reviewed_at: '2026-08-24'
