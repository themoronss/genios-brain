  notes: >
    Stub — identity, purpose and load-set only. Promote by separating the two decisions
    explicitly through every section: queue-level playbooks and heuristics, then person-level
    ones, and failure_modes for each. The highest-value content is the continuity-versus-capacity
    trade and the rules for when round-robin should be suspended (named accounts, active
    escalations, reopened tickets, anything an agent has already apologised for). KPIs must
    include unowned-queue ageing alongside per-agent load, because a perfectly balanced roster
    sitting next to an ageing catch-all queue reads as healthy. Handoffs: upstream from
    ticket_triage, parallel with queue_management and workload_balancing, downstream into
    diagnostics and escalation_management.
