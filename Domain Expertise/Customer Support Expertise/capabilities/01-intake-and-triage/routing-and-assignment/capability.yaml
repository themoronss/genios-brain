description: >
  Choosing the queue and then choosing the human, which are two decisions with different failure
  modes and are usually run as one. Queue routing fails on taxonomy — a ticket with no obvious
  home lands in the largest queue and ages there, unowned and apparently handled. Assignment fails
  on load and on skill, and load is the one organisations optimise because it is the one a
  dashboard can see. The judgement that separates a good router from a fair one is knowing when to
  break the rule for continuity: an account that has been working with a specific agent through a
  long-running problem loses more to a fresh, well-balanced owner than the queue gains from the
  balance. Assignment without a named human is not assignment, it is deferral with extra steps.

question: "Which queue can finish this, and which person should hold it?"

