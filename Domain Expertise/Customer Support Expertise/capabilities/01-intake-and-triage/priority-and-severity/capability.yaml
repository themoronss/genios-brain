description: >
  Holding apart how broken something is from what we work on first, under exactly the conditions
  that make people collapse them. Severity is a property of the fault, established from blast
  radius and whether a workaround exists; priority is an allocation of scarce attention,
  established from severity crossed with what the account is entitled to and what else is currently
  in the queue. The two routinely invert — the worst fault on a free trial against a middling one
  on an account renewing next month — and an organisation whose data model cannot express that
  inversion will work the wrong one first and be able to prove it followed the rules. This is one
  capability rather than two because all of the expertise lives in the tension between them, and
  splitting it loses precisely the knowledge that matters.

question: "How broken is this, and — separately — what do we work on first?"

