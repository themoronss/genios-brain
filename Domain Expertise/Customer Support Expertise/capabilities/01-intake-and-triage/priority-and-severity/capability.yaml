  notes: >
    Stub — identity, purpose and load-set only. Promote by adding decision_frameworks first
    (impact times urgency, the workaround ladder, the blast-radius ladder), then the heuristics
    that govern revision: who may change severity and on what evidence, who may change priority
    and on whose authority, and why those two answers should differ. failure_modes should cover
    severity inflation by escalation, the single-field collapse, and the quieter one where
    severity is set correctly and priority is never revisited as the queue changes around it.
    Keep all band definitions out of this file — they are Layer 4 arithmetic and belong in the
    pack manifest. Cannot become executable until an SLA and severity signal exists; today
    ticket.severity and sla.clock_state are planned substrate only.
