description: >
  Deciding what the customer is actually trying to get done, which is regularly not what they
  wrote. The durable signal is the outcome they would accept rather than the words they used —
  "how do I export this" and "your export is broken" are the same intent when the feature exists
  and cannot be found, and different intents when it does not exist at all. A taxonomy only earns
  its cost if two agents independently pick the same label, and every taxonomy drifts past that
  point unless somebody is actively deleting categories rather than only adding them. The failure
  worth watching for is the catch-all bucket quietly becoming the largest one, because at that
  point classification has stopped carrying information while still costing a decision per ticket.

question: "What is this customer actually trying to get done?"

