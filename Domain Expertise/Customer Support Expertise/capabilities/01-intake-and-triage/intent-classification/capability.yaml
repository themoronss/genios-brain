  notes: >
    Stub — identity, purpose and load-set only. Promote by adding failure_modes (catch-all
    growth, label-per-team rather than label-per-customer-outcome, classification that mirrors the
    org chart and therefore cannot survive a reorg), heuristics for collapsing near-duplicate
    labels, and mental_models for the relationship between intent and deflection — a taxonomy that
    cannot be joined to knowledge articles cannot answer the only question leadership asks of it,
    which is what to write next. KPIs should include inter-rater agreement before volume-by-label,
    because volume-by-label with poor agreement is confidently wrong. Handoffs: upstream from
    channel_intake, downstream into ticket_triage, self_service_deflection and
    content_gap_analysis.
