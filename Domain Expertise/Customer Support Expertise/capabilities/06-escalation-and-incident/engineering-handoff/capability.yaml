description: 'Converting a customer''s problem into something an engineering team can act on, and holding
  the customer relationship while they do. The boundary fails because the two sides optimise different
  things — support wants this customer unblocked today, engineering wants the defect class understood
  before touching it — and a handoff that does not translate between those gets politely triaged into
  a backlog and never seen again. A bug report that cannot be reproduced from its own text is a request
  for engineering to redo the work support already did, and it will be priced accordingly. The customer''s
  ticket does not close when the bug is filed: ownership stays on the support side, because a filed bug
  with no support owner is how a customer becomes somebody else''s forgotten backlog item.

  '
question: Is this a defect engineering can actually act on, and who still owns the customer while they
  do?
metadata:
