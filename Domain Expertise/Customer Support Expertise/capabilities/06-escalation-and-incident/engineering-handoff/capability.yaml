  confidence: experimental
  notes: 'Stub — identity, judgement and load-set only. Promote by adding outcomes, failure_modes (the
    unreproducible report, closing the ticket on filing, the report that describes the customer''s guess
    at the cause rather than the observed behaviour, and the silent backlog where nobody tells support
    the fix shipped), playbooks, heuristics with a why on each, mental_models, decision_frameworks, kpis
    and handoffs, following escalation-management/capability.yaml in this folder. It owns bug-awaiting-engineering.yaml,
    which binds under pending_l2_situation_types (bug_awaiting_engineering, workaround_only) — write it
    in the same pass, and note there that workaround_only is the more valuable of the two signals because
    it marks customers who are technically resolved and actually still broken.

    '
