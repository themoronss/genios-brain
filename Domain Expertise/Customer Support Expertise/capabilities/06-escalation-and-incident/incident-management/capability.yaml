  notes: >
    Stub — identity, judgement and load-set only. Promote by adding outcomes, failure_modes
    (start with under-declaration, the commander who debugs, and closing the incident while the
    customer-side cleanup is still open), playbooks, heuristics with a why on each,
    mental_models, decision_frameworks, kpis and handoffs, following escalation-management/
    capability.yaml in this folder. It also owns the situation major-incident-declared.yaml,
    which binds under pending_l2_situation_types (major_incident_declared, incident_unresolved)
    because no shipped pack emits an incident signal — write that file in the same pass.
