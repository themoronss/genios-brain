description: >
  Running a fault that has stopped being one customer's problem. The hard part is the
  declaration, not the response: declaring is expensive and feels like admitting fault, so
  teams spend the opening period arguing about whether this qualifies while the impact
  compounds and the tickets arrive. An incident needs a commander whose job is coordination
  rather than debugging — the moment the commander picks up the fault, nobody is running the
  incident — and ticket volume must be read as the lagging indicator it is, because the
  customers who did not write in have already formed an opinion by the time the queue shows it.

question: "Is this still a ticket, and if it is not, who is running it and who is telling the customers?"

