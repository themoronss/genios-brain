# FULL capability — the one complete file in subdomain 06. The other five are stubs.
#
# The whole subdomain hangs off one distinction that ticketing software refuses to make:
# an escalation is a TRANSFER OF OWNERSHIP with a named receiver and a written reason.
# Every product on the market models it as a flag, a priority bump or a tag — a property of
# the ticket rather than an event between two people. That modelling error is upstream of
# almost everything below: a flag has no receiver, so nobody accepted it; a flag carries no
# reason, so nobody knows what they were asked for; and a flag has no exit, so it stays on
# forever and stops meaning anything.
#
# No numbers in this file. Thresholds — how long before escalation, how many contacts count
# as repeat, what share of the queue may carry the flag — are Layer 4's arithmetic and live
# in the pack manifest. The judgement about WHAT to measure lives here; the number does not.
#
# Playbooks, heuristics, mental models and decision frameworks moved OUT of this
# file and into knowledge.yaml + the artifact folders. They are files now because a
# Layer 6 suggestion needs an id and a version to point at, and because a framework
# used by four capabilities cannot live inline in all four.

identity:
  id: customer_support.escalation_and_incident.escalation_management
  name: Escalation Management
  domain: customer_support
  subdomain: escalation_and_incident
  version: 1.0.0
  status: draft
  stub: false
description: 'Moving a piece of work from the person who owns it to a person better placed to finish
  it, on purpose, with the reason and the accumulated context travelling with it. Escalation is not
  urgency, not anger and not seniority — those are things that often accompany it and are routinely
  mistaken for it. It is a named receiver accepting responsibility for a specific ask, plus a stated
  condition under which ownership comes back. The capability includes the decision not to escalate,
  which is the more common correct answer and the one that gets made by default rather than on purpose.

  '
question: This has outgrown its current owner — who takes it, what are we asking them for, and what
  do they already know?
outcomes:
- A named person has accepted the transfer. Not a queue, not a channel, not a rota — a person who knows
  they now own it.
- 'The reason is written as a reason and not as a mood: what is happening, why normal handling will
  not finish it, and what specifically is being asked of the receiver.'
- The context moved with the ticket — what was tried, what was ruled out and why, and what the customer
  has already been told, so the receiver's first act is progress rather than a re-diagnosis.
- The trigger is recorded as customer-initiated or internally-triggered, because the two are different
  events that share a word and need opposite first moves.
- The customer learned about the change of ownership from us, with a name and a next-contact time, before
  an unfamiliar name appeared on their thread.
- 'An exit condition exists: the stated circumstance under which this returns to ordinary ownership.'
- Where the answer was not to escalate, that is a recorded decision with a reason, not an absence.
failure_modes:
- 'Escalating the ticket without escalating the context. The receiver opens a thread with no brief,
  asks the customer to describe the problem, and the customer — who has already described it twice —
  concludes that escalating made things actively worse. This is the characteristic failure of the capability
  and it is a handoff defect, not a technical one.

  '
- 'An escalation with no named receiver: a post into a channel, a tag on a ticket, a mention of a team.
  Nobody''s workload changed, so nobody''s evening got shorter, so nothing happened. It felt like an
  escalation to the person who raised it and looked like noise to everyone else.

  '
- 'Treating a customer-initiated escalation as a process problem. The ticket gets reprioritised and
  worked faster, the loss of confidence that actually caused the escalation is never addressed, and
  the account escalates again next quarter about something smaller.

  '
- 'The mirror error: treating an internally-triggered escalation as a relationship event and apologising
  to a customer who did not know anything was wrong. This manufactures a concern and teaches the customer
  to watch for problems we would otherwise have quietly fixed.

  '
- 'Escalating for cover rather than for help — transferring ownership so the risk belongs to someone
  else. Receivers learn to discount that agent''s escalations, which means the one that genuinely mattered
  gets the discounted response.

  '
- 'Escalations with no exit. The flag persists after the reason has gone, the escalated pool grows monotonically,
  and the signal degrades until leadership stops reading it.

  '
- 'Silent escalation. Ownership moves internally, the customer is told nothing, keeps chasing the previous
  owner, and experiences the whole thing as being ignored faster.

  '
- 'Escalating to seniority instead of to capability. A director cannot reproduce the fault; what has
  been bought is attention and what has been spent is hours. Correct only when the thing needed is a
  decision or a concession, which is a different capability.

  '
- 'Letting volume set the bar. When the customers who shout get escalations and the ones who wait politely
  do not, the base is being trained in how to get service, and the queue''s escalation data stops describing
  severity at all.

  '
- 'Escalating and reassigning in one motion without saying which changed. The customer sees a new name
  and cannot tell whether they have been promoted or dropped.

  '
kpis:
- name: escalation_rate
  unit: percent
  description: 'Share of tickets that become escalations. Read as a band, never as a target: near zero
    means the path is blocked, feared or unknown, and a high figure means ordinary resolution is failing
    upstream of here.

    '
  direction: target_band
- name: customer_initiated_share
  unit: percent
  description: 'Of all escalations, the share the customer raised rather than we did. This is the single
    best measure of whether support notices its own trouble, and it is almost never reported.

    '
  direction: lower_is_better
- name: time_to_named_owner
  unit: hours
  description: Raised to accepted by a named person. Measures the invisible interval in which everyone
    believes someone else has it.
  direction: lower_is_better
- name: receiver_re_ask_rate
  unit: percent
  description: 'Share of escalations where the receiving owner''s first customer message asks something
    already answered in the thread. The sharpest available measure of handoff quality, and the direct
    instrumentation of this capability''s characteristic failure.

    '
  direction: lower_is_better
- name: escalation_acceptance_rate
  unit: percent
  description: 'Share of raised escalations a receiver accepts. A band: universal acceptance means there
    is no bar, and frequent refusal means the path or the criteria are misunderstood at the front line.

    '
  direction: target_band
- name: de_escalation_rate
  unit: percent
  description: 'Share of escalations that returned to ordinary ownership on a stated exit condition
    rather than being closed while still flagged. Tests whether the loop can terminate.

    '
  direction: higher_is_better
- name: escalation_resolution_time
  unit: hours
  description: Accepted to exit. Compare against the same issue class resolved without escalation —
    if escalating is not faster, the mechanism is ceremony.
  direction: lower_is_better
- name: repeat_escalation_accounts
  unit: count
  description: Accounts escalating more than once in a period. A generator to be found, not a set of
    tickets to be worked.
  direction: lower_is_better
- name: post_escalation_retention
  unit: percent
  description: 'Share of escalated accounts still present at their next renewal. Slow, noisy and the
    only KPI here that measures whether any of this worked.

    '
  direction: higher_is_better
