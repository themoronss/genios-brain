metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ''
  last_updated: '2026-08-08'
  review_status: unreviewed
  confidence: provisional
  notes: 'Two structural notes for a reviewer. First, escalation is deliberately NOT modelled as a property
    of a ticket anywhere in this file; it is an event with two parties, which is why the load-set requires
    escalation_owner and why several KPIs measure the interval between raising and acceptance rather
    than time to resolution. Second, nothing in this capability is executable against today''s substrate
    — there is no escalation observation kind, no escalation_requested situation type and no ticket
    fact path in the shipped packs. The corresponding situation file, escalation-requested.yaml, therefore
    binds under pending_l2_situation_types, and that is the honest state rather than a defect. The two
    signals that would unlock the most here are the obs kinds escalation_requested and escalation_accepted:
    the pair, not either alone, because the gap between them is the interval this capability exists
    to shorten.

    '
