  notes: >
    Stub — identity, judgement and load-set only. Promote by adding outcomes, failure_modes
    (the optimistic ETA, the update that goes quiet exactly when the fix looks close, the
    all-clear published before the customer-visible backlog has drained, and the status page that
    is technically accurate and operationally useless), playbooks, heuristics with a why on each,
    mental_models, decision_frameworks, kpis and handoffs, following escalation-management/
    capability.yaml in this folder. Worth resolving at promotion: the boundary with
    proactive_status_updates, which is the same discipline addressed to one customer — the split
    is real (broadcast versus thread) but the heuristics overlap and should cross-reference
    rather than be duplicated.
