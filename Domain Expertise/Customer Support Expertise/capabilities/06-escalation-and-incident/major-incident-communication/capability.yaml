description: >
  Telling a lot of customers the same true thing at the same time, repeatedly, while the facts
  are still moving. During an outage the customer is not buying a fix — they are buying the
  ability to tell their own boss what is happening, which means cadence beats content: an update
  that says nothing new but arrives when promised is worth more than a detailed one that is late,
  because silence is read as loss of control rather than as concentration. Never publish a
  restoration time you cannot beat; publish the time of the next update instead, which is the
  one promise that can always be kept and the one that buys the room to keep the others.

question: "What do we say, to whom, and when exactly do they hear from us next?"

