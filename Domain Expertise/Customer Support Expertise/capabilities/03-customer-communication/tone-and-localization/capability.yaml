  name: Tone & Localization
  domain: customer_support
  subdomain: customer_communication
  version: 0.1.0
  status: draft
  stub: false

description: >
  Meeting the customer in their language, register and norms — including the ones they never state.
  Directness that reads as efficient in one market reads as dismissive in another, and machine
  translation destroys precisely the hedges, honorifics and conditional forms that were carrying
  the apology. Tone is also a function of the customer's state and not only their locale: the
  register that suits a routine how-do-I question is patronising to someone who has just lost a
  day of work, and the same sentence can be warm from a peer and insulting from a vendor.

question: "Does this read the way we intend it to read, to this person, in their language?"

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: experimental
  notes: >
    Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models,
    decision_frameworks, kpis and handoffs, following the shape of
    capabilities/03-customer-communication/de-escalation/capability.yaml. Capture first: which
    parts of a message must never be machine-translated (the apology, the commitment, and anything
    legally binding), the difference between localising a template and localising a relationship,
    and the failure mode where a friendly house style survives translation into something that
    reads as flippant about a serious outage. Worth pairing with macro_management in the Knowledge
    & Deflection subdomain, since most tone damage at scale is authored once into a macro rather
    than typed by an agent.
