  notes: 'Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models, decision_frameworks,
    kpis and handoffs, following the shape of capabilities/03-customer-communication/de-escalation/capability.yaml.
    Capture first: which parts of a message must never be machine-translated (the apology, the commitment,
    and anything legally binding), the difference between localising a template and localising a relationship,
    and the failure mode where a friendly house style survives translation into something that reads as
    flippant about a serious outage. Worth pairing with macro_management in the Knowledge & Deflection
    subdomain, since most tone damage at scale is authored once into a macro rather than typed by an agent.

    '
