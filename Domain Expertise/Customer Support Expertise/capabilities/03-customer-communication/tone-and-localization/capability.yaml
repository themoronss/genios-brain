description: 'Meeting the customer in their language, register and norms — including the ones they never
  state. Directness that reads as efficient in one market reads as dismissive in another, and machine
  translation destroys precisely the hedges, honorifics and conditional forms that were carrying the apology.
  Tone is also a function of the customer''s state and not only their locale: the register that suits
  a routine how-do-I question is patronising to someone who has just lost a day of work, and the same
  sentence can be warm from a peer and insulting from a vendor.

  '
question: Does this read the way we intend it to read, to this person, in their language?
