description: 'Speaking before being asked, on a rhythm the customer was told to expect. An update carrying
  no progress is still an update and is nearly always worth sending: the alternative is the customer inventing
  a reason for the silence, and their version is reliably worse than ours. The whole discipline is holding
  the promised cadence on the days there is nothing good to say, because those are the only days it proves
  anything — and because the update that is skipped is the one the customer notices.

  '
question: When did we last tell this customer where they stand, and when did we say we would tell them
  again?
