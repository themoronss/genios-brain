metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-08'
  review_status: approved
  confidence: provisional
  notes: 'The load-bearing content here is failure_modes and the heuristics'' `why` clauses, not the outcomes.
    Note also what is absent: no thresholds for how long a silence is too long, no definition of what
    counts as heated, no escalation trigger. Those are Layer 4''s arithmetic and they belong in the pack
    manifest. What makes this capability hard to run today is upstream of that — there is no angry_language
    observation kind, no cancellation_threat, no escalation signal in the shipped substrate, so nothing
    in this file can currently be fired automatically. That gap is the point of vocabulary.yaml planned_substrate
    and is tracked there rather than papered over here by binding heat to derived.sentiment, which measures
    a different thing.

    '
  reviewed_at: '2026-08-24'
