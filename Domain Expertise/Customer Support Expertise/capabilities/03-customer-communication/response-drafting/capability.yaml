  name: Response Drafting
  domain: customer_support
  subdomain: customer_communication
  version: 0.1.0
  status: draft
  stub: false

description: >
  Turning what we currently know into a message the customer can act on without writing back to
  ask what it meant. The craft is subtractive: most weak support replies fail by including the
  internal reasoning, the hedges and the answer to a question nobody asked, so the one sentence
  that mattered arrives fourth and is read last. A draft is finished when it states what is true,
  what happens next and who owns it — and contains nothing that only makes sense to us.

question: "What is the shortest message that leaves this customer able to act?"

