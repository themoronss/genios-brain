identity:
  id: customer_support.customer_communication.expectation_setting
  name: Expectation Setting
  domain: customer_support
  subdomain: customer_communication
  version: 0.1.0
  status: draft
  stub: false

description: >
  Deciding what to promise, knowing that every promise becomes a clock somebody has to answer to.
  The expensive mistake is optimism offered to end an uncomfortable exchange: an under-promise
  that lands early costs nothing, while an over-promise turns a solvable ticket into a broken one
  and hands the next agent a trust problem stacked on top of the original fault. Expectations are
  set against what the queue actually does, not against what the entitlement document says it does
  — and a promise made without saying what happens if it slips is only half a promise.

question: "What can we honestly commit to here, and what happens when it slips?"

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: experimental
  notes: >
    Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models,
    decision_frameworks, kpis and handoffs, following the shape of
    capabilities/03-customer-communication/de-escalation/capability.yaml. The expertise worth
    capturing first: why a range beats a point estimate and why a next-contact time beats both;
    the rule that we commit to when we will speak rather than to when it will be fixed, because
    only one of those is inside our control; and the failure mode where the entitlement target is
    quoted back as a prediction when it is a floor. Pairs with commitment_tracking in the
    Entitlement & SLA subdomain — anything promised here must become a tracked Commitment, or it
    is not a promise, it is a hope with a timestamp.
