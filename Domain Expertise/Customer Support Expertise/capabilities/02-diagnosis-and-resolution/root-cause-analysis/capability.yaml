metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-08'
  review_status: approved
  confidence: provisional
  notes: 'Contains no numbers by design — no severity bands, no time-boxes, no confidence scores. Those
    belong to the pack manifest at Layer 4, and this file is the judgement that decides which of them
    are worth computing. Two things to watch in review. First, the load-set here requires issue and root_cause
    and treats ticket as optional, which is deliberate and will look wrong: this capability analyses the
    fault, and a ticket is one report of it. Second, every signal this capability would most like to read
    — reproduction_failed, root_cause_identified, ticket_reopened — is planned substrate rather than shipped
    substrate, so nothing here routes automatically yet. That is the Layer 1/2 backlog, and it is stated
    rather than papered over.

    '
  reviewed_at: '2026-08-24'
