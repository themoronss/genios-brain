  notes: >
    Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models, kpis and
    handoffs, following the sibling root-cause-analysis/capability.yaml. The judgement to write
    down first is when NOT to ship one: a workaround with a worse failure mode than the fault, a
    workaround that requires the customer to remember something forever, and a workaround
    offered before the fault is understood well enough to know what it is working around. The
    kpis should carry the debt view rather than the relief view — count of accounts on live
    workarounds and their age, not workarounds delivered. This capability is the main producer
    of the planned obs kind workaround_provided and of the pending L2 type workaround_only;
    both belong to the situation bug-awaiting-engineering, which is owned by engineering_handoff
    rather than here.
