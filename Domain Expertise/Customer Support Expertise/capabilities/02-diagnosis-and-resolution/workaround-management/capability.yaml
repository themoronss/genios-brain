description: >
  Giving the customer a way to keep working while the fault is still there, and then holding the
  fact that it is still there. A workaround is a genuine resolution and a genuine debt at the
  same time: it closes tickets, drains escalation pressure, and quietly removes the only signal
  that was keeping the defect funded — which is why the most dangerous workaround is the one
  that works well. It has to be recorded against the issue with an owner and a condition for
  retirement, and the customer has to know they are on one, because a workaround they mistake
  for a fix becomes the behaviour they build on and the thing they complain about when it is
  finally taken away.

question: "What lets them keep working today without letting anyone believe the fault is gone?"

metadata:
  owner: Customer Support
  created_by: ai
