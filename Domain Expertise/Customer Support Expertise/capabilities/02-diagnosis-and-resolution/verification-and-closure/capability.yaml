identity:
  id: customer_support.diagnosis_and_resolution.verification_and_closure
  name: Verification & Closure
  domain: customer_support
  subdomain: diagnosis_and_resolution
  version: 0.2.0
  status: stable
  stub: false
description: 'Confirming with the person who reported it that the problem has actually stopped, and only
  then closing. Silence is not agreement — an unanswered "is this resolved?" leaves a ticket unverified
  rather than verified by default, and auto-closing on silence is the cheapest way ever invented to convert
  an unmeasured failure into a clean metric. A reopen costs far more than the original contact because
  it arrives with the customer''s patience already spent and their belief that anyone is tracking their
  problem already damaged, so the whole value of this capability is spending a small confirmation to avoid
  a large one.

  '
question: Is it actually fixed for the person who reported it, and do they say so?

outcomes:
- 'Closure on the customer''s confirmation, or after a stated silence window with an easy reopen — never unilaterally at the moment an agent believes it is fixed.'
- 'Silence treated as silence. An unanswered "is this resolved?" is not agreement, and a ticket closed on it is a ticket that reopens with a worse tone.'
- 'A reopen path that is genuinely easy, because the alternative is a new ticket with no history and a customer explaining it again.'
- 'The verification question asked in a form that can be answered in one word, since a question requiring effort gets the silence it was testing for.'
- 'The negative outcome: a ticket held OPEN past a target because the customer has not confirmed. Closure discipline is what makes the resolution numbers mean anything.'
failure_modes:
- 'CLOSING ON AGENT BELIEF. It is the single largest source of reopens and it makes time-to-close look excellent.'
- 'TREATING NO REPLY AS YES, which is the most common closure rule and the least defensible one.'
- 'A SILENCE WINDOW WITH NO WARNING, so the customer discovers the closure rather than being given a chance to object.'
- 'HARD REOPENS. Where reopening means filing again, the metric improves and the customer experience does not.'
- 'ASKING A VERIFICATION QUESTION THAT TAKES WORK TO ANSWER, which manufactures the silence it then interprets as consent.'
kpis:
- name: reopen_rate
  unit: percent
  description: Closed tickets reopened. The metric that cannot be gamed by closing early, which is why it outranks time-to-close.
  direction: lower_is_better
- name: customer_confirmed_share
  unit: percent
  description: Closures on explicit confirmation rather than on timeout or agent judgement.
  direction: higher_is_better
- name: timeout_closure_share
  unit: percent
  description: A target band. Some silence is genuine satisfaction; a high share means the question is not being answered.
  direction: target_band
- name: reopen_friction
  unit: count
  description: Steps to reopen. Above one, the reopen rate understates the failure.
  direction: lower_is_better
handoffs:
  upstream: [customer_support.diagnosis_and_resolution.resolution_delivery, customer_support.diagnosis_and_resolution.workaround_management]
  downstream: [customer_support.voice_of_customer.satisfaction_measurement, customer_support.knowledge_and_deflection.knowledge_authoring,
               customer_support.support_management.ticket_review]
  parallel: [customer_support.customer_communication.proactive_status_updates, customer_support.entitlement_and_sla.commitment_tracking]
applies_to:
  models: [b2b, b2c, b2b2c, enterprise_support, mid_market_support, smb_support, tiered_support, swarming_support,
           ai_first_support, outsourced_bpo, named_tam, embedded_in_product]
  offerings: [product, service, hybrid]

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  reviewed_at: '2026-08-27'
  notes: >
    Promoted out of Phase-1 stub. Not on a live route. ticket.status and ticket.reopen_count are
    planned_substrate with no writer.

    reopen_rate outranks time-to-close throughout this capability, and the reason is stated in
    its heuristic: time-to-close can be improved by closing early and often, and reopen rate
    cannot be improved by anything except actually resolving things. When the two conflict, the
    second is the true one.

    reopen_friction is the KPI that keeps reopen_rate honest. Where reopening means filing a new
    ticket, the reopen rate falls and the failure it was measuring does not — the customer
    simply appears as a new report with no history.

