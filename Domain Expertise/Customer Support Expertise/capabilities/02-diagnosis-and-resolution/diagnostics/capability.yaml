description: 'Getting what the system already knows about the failure — logs, traces, versions, configuration,
  the account''s own data, the screenshot nobody asked for — and getting it in one pass rather than in
  a chain of round trips. The expertise is mostly in restraint: every additional request spends customer
  patience on evidence that is frequently retrievable from our own side, and a customer who has been asked
  three times for the same thing stops believing anyone is reading their replies. Diagnostics collected
  after a hypothesis has formed are collected to confirm it, which is why what to gather is decided before
  anyone has a theory, and why the log everyone wants is the one that rotated away yesterday.

  '
question: What does the evidence actually say, and what do we still need before we can say anything?
