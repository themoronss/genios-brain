  notes: 'Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models, kpis and handoffs,
    following the sibling root-cause-analysis/capability.yaml. Two bodies of knowledge belong here and
    neither is written yet: the standard evidence bundle per product_area, which is what turns a round
    trip into a single ask, and the etiquette of asking a customer for access to their environment, which
    is where trust is most often spent badly. Watch the boundary with root_cause_analysis when promoting
    — diagnostics gathers and reads evidence, RCA explains it, and a promoted file that starts asserting
    causes has absorbed its neighbour. Nothing here can route today: derived.contact_frequency and the
    ticket fact paths this capability would key on are planned substrate.

    '
