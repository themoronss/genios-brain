identity:
  id: customer_support.diagnosis_and_resolution.issue_reproduction
  name: Issue Reproduction
  domain: customer_support
  subdomain: diagnosis_and_resolution
  version: 0.2.0
  status: stable
  stub: false
description: 'Getting the fault to happen on demand, in an environment somebody controls, with the steps
  written down well enough that a stranger could follow them. Reproduction is not a formality before the
  real work — it is the moment a customer''s account of events turns into evidence, and the steps that
  finally trigger the fault are routinely not the steps that were reported, because customers narrate
  their intention rather than their actions. Failing to reproduce is itself a result and should be recorded
  as one: it eliminates deterministic universal faults and points at environment, state, data or a misdescription,
  which are four different next steps and one bad close.

  '
question: Can we make it happen on demand, and if we cannot, what has that ruled out?

outcomes:
- 'The fault happening on demand in an environment somebody controls, with steps a stranger could follow.'
- 'The MINIMAL reproduction — the fewest steps that still fail — because that is the handoff currency engineering trusts and fixes verify against.'
- 'A failure to reproduce treated as a finding: what has it ruled out, and what does the difference between environments tell us?'
- 'The environment delta bracketed when reproduction fails, since "works for me" means the difference between environments IS the bug''s habitat.'
- 'The negative outcome: a ticket NOT closed as no-repro. Closing without bracketing the difference schedules the reopening.'
failure_modes:
- 'REPRODUCING WITH THE CUSTOMER''S FULL SETUP AND STOPPING THERE. It proves the bug exists and gives engineering nothing to work with.'
- 'CLOSE-AS-NOREPRODUCE. It is the most common way a real defect leaves the queue, and it comes back with a worse tone.'
- 'ADDING STEPS TO BE SAFE. A reproduction with irrelevant setup is one engineering must first reduce themselves.'
- 'REPRODUCING IN THE WRONG ENVIRONMENT and concluding it is fixed, which is confirmation of a different system.'
- 'TREATING REPRODUCTION AS A FORMALITY BEFORE ESCALATION rather than as the diagnostic act it is.'
kpis:
- name: reproduction_rate
  unit: percent
  description: Reported defects reproduced on demand.
  direction: higher_is_better
- name: repro_step_count
  unit: count
  description: Steps in the reproduction. Fewer is better and it is what makes the handoff usable.
  direction: lower_is_better
- name: no_repro_reopen_rate
  unit: percent
  description: Tickets closed as no-repro that came back. The measure of whether no-repro was a finding or a disposal.
  direction: lower_is_better
- name: engineering_repro_acceptance
  unit: percent
  description: Handoffs engineering could reproduce from our steps without contact.
  direction: higher_is_better
handoffs:
  upstream: [customer_support.diagnosis_and_resolution.diagnostics, customer_support.intake_and_triage.priority_and_severity]
  downstream: [customer_support.escalation_and_incident.engineering_handoff, customer_support.diagnosis_and_resolution.root_cause_analysis,
               customer_support.diagnosis_and_resolution.workaround_management]
  parallel: [customer_support.customer_communication.expectation_setting, customer_support.diagnosis_and_resolution.verification_and_closure]
applies_to:
  models: [b2b, b2c, b2b2c, enterprise_support, mid_market_support, smb_support, tiered_support, swarming_support,
           embedded_in_product, premium_paid_support, outsourced_bpo]
  offerings: [product, hybrid]

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  reviewed_at: '2026-08-27'
  notes: >
    Promoted out of Phase-1 stub. Not on a live route. reproduction_confirmed and
    reproduction_failed are planned_substrate obs kinds with no writer.

    no_repro_reopen_rate is the KPI that makes the whole capability honest. Close-as-no-
    reproduce is the commonest way a real defect leaves a queue, and it is invisible in every
    metric except the one that counts what came back — which is why it is stated here and almost
    nowhere else.

    repro_step_count as a metric to minimise is unusual and deliberate: a reproduction carrying
    the customer's full setup proves the bug exists and hands engineering a reduction exercise
    they now have to perform themselves.

