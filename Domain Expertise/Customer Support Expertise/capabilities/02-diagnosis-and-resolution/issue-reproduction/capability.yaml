description: 'Getting the fault to happen on demand, in an environment somebody controls, with the steps
  written down well enough that a stranger could follow them. Reproduction is not a formality before the
  real work — it is the moment a customer''s account of events turns into evidence, and the steps that
  finally trigger the fault are routinely not the steps that were reported, because customers narrate
  their intention rather than their actions. Failing to reproduce is itself a result and should be recorded
  as one: it eliminates deterministic universal faults and points at environment, state, data or a misdescription,
  which are four different next steps and one bad close.

  '
question: Can we make it happen on demand, and if we cannot, what has that ruled out?
