  notes: >
    Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models, kpis and
    handoffs, following the shape of the sibling root-cause-analysis/capability.yaml. The
    expertise worth writing down first is the interviewing: how to extract the real sequence
    from a customer who is describing their goal, what to capture before it rotates away, and
    when reproducing on a copy of their data is worth the access request. The failure_modes
    list is where this capability earns its keep — reproducing a different bug that shares the
    symptom, and reproducing on an internal environment configured by people who understand the
    product, are both common and both invisible from the ticket. Note that the observation kinds
    this capability would fire on, reproduction_confirmed and reproduction_failed, are planned
    substrate rather than shipped substrate, so nothing here routes yet.
