  reviewed_by: harsh
  last_updated: '2026-08-08'
  review_status: approved
  confidence: experimental
  notes: 'Stub — identity, description, question and load-set only. Promote by adding the heuristics that
    separate tone from risk (the going-polite signal, per-writer baselining, the flattening effect of
    an incident on everyone''s tone at once, and the cultural and language differences that make absolute
    sentiment labels unusable across regions), then the failure modes around routing on sentiment alone,
    KPIs, and handoffs into de_escalation and churn_signal_detection. Executability is limited: derived.sentiment
    exists in the substrate, but it is computed from an observation balance built for a sales motion and
    has no support-native inputs, so any pattern that means support tone should be marked needs_signal
    against angry_language and cancellation_threat rather than bound to it.

    '
  reviewed_at: '2026-08-24'
