  confidence: experimental
  notes: 'Stub — identity, description, question and load-set only. Promote by adding the failure modes
    (the silent black hole, feature-request framing that hides the underlying job, the same issue filed
    repeatedly under different names, and routing by whoever answers rather than by ownership), heuristics
    with a `why` on what makes a report credible to an engineer, a decision framework for when a contact
    becomes a bug report versus a documentation gap versus a roadmap input, KPIs weighted to the return
    leg, and handoffs from feedback_synthesis and into engineering_handoff. Nothing here is executable
    until bug_filed and handoff_to_engineering are emitted; today the closed-loop half of this capability
    is entirely a human practice.

    '
