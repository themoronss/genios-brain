description: >
  Turning many individual contacts into a claim about the product that someone outside support
  will act on. The hard part is not clustering — it is resisting the loudest theme: volume
  measures how easy something is to complain about, not how much it costs the business, and a
  frequent trivial annoyance will always outrank a rare catastrophe unless the synthesis
  weights consequence rather than counts. What survives the summary must keep at least one
  customer's own words attached, because an engineering team argues with a percentage and
  cannot argue with a sentence.

question: "What are all these contacts collectively saying that no single one of them says?"

metadata:
  owner: Customer Support
