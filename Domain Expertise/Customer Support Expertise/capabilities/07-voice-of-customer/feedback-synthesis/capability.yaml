  confidence: experimental
  notes: >
    Stub — identity, description, question and load-set only. Promote by adding the failure
    modes first (frequency mistaken for importance, themes that dissolve the moment anyone asks
    what to build, synthesis that arrives after the roadmap was set, and the survivorship
    problem where the customers who left are absent from every input), then heuristics with a
    `why`, the weighting framework that trades volume against consequence and account value,
    KPIs on whether synthesis changed anything, and handoffs into product_feedback_routing and
    content_gap_analysis. Executable today only in the weakest sense: nothing in the substrate
    groups tickets by issue, so the clustering step is a needs_signal against issue-level
    identity rather than a pattern.
