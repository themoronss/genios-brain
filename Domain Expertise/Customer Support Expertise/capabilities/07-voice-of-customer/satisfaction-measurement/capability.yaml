  notes: 'Stub — identity, description, question and load-set only. Promote by adding outcomes and failure_modes
    first: the failure modes here are unusually well known (surveying after a save rather than after a
    struggle, agent-level attribution of a product problem, response bias treated as signal) and they
    carry more of the expertise than the outcomes do. Then heuristics with a `why`, the survey-instrument
    decision framework, KPIs that include response representativeness rather than only response rate,
    and handoffs to churn_signal_detection and agent_coaching. It also needs the csat_detractor situation,
    which it owns. Nothing here can fire until a support pack emits csat.score and csat_submitted; see
    the domain header.

    '
