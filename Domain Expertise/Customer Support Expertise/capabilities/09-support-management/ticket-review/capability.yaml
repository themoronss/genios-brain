  notes: 'Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models, decision_frameworks,
    kpis and handoffs, following quality-assurance in this subdomain. The expertise worth encoding: selection
    is the whole method — a review of tickets chosen because they went badly is a census of failure modes,
    and a review of tickets chosen because a manager noticed them is a census of what managers notice.
    The highest-yield selections are reopens, tickets with more than two owners, and anything the customer
    escalated after we thought it was closed. Also worth stating explicitly is that this capability shares
    almost all its inputs with postmortem and differs only in scope: one ticket rather than one incident.

    '
