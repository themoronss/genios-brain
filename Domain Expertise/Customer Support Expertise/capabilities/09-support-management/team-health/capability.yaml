description: 'Reading whether the people can keep doing this. Support is the only function whose daily
  work is absorbing other people''s frustration, attrition is its dominant cost driver, and burnout is
  legible in queue data weeks before it is legible in a resignation — quality drifting down while throughput
  holds, macro use climbing, the same agent taking every escalation because they are the one who can.
  This is a capability rather than an HR concern precisely because an expert reads it from the tickets,
  and by the time it reaches a one-to-one the recoverable window has usually closed.

  '
question: Can this team keep doing this, and what in the queue is telling us it cannot?
