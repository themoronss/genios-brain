identity:
  id: customer_support.support_management.team_health
  name: Team Health
  domain: customer_support
  subdomain: support_management
  version: 0.2.0
  status: stable
  stub: false
description: 'Reading whether the people can keep doing this. Support is the only function whose daily
  work is absorbing other people''s frustration, attrition is its dominant cost driver, and burnout is
  legible in queue data weeks before it is legible in a resignation — quality drifting down while throughput
  holds, macro use climbing, the same agent taking every escalation because they are the one who can.
  This is a capability rather than an HR concern precisely because an expert reads it from the tickets,
  and by the time it reaches a one-to-one the recoverable window has usually closed.

  '
question: Can this team keep doing this, and what in the queue is telling us it cannot?

outcomes:
- 'Leading signals watched rather than exit interviews: after-hours creep, terse internal tone, rising sick days, falling QA. Attrition is the lagging one and it lags by two quarters.'
- 'Load reduced when the signals move, since this is the only function whose daily work is absorbing other people''s frustration.'
- 'Emotional load treated as a real quantity with a budget, not as resilience. Continuous exposure without breaks is the mechanism, and it is invisible in every operational metric.'
- 'The cause looked for upstream in the load curve, because the team that burned out in March resigns in September and the exit interviews will describe September.'
- 'The negative outcome: work REFUSED or a service level renegotiated because the team cannot sustain it. A health function that never reduces load is a monitoring function.'
failure_modes:
- 'WATCHING ATTRITION. It is the outcome, it lags by two quarters, and by the time it moves the cause is unfixable retrospectively.'
- 'READING WILLINGNESS AS CAPACITY. The people absorbing the load are the ones who will not complain, which is why they are absorbing it.'
- 'FIXING AT THE EXIT INTERVIEW, which aims the remedy at a moment months after the damage.'
- 'CELEBRATING THE HEROIC SHIFT, which tells everybody the sustainable state is the exception.'
- 'MEASURING HEALTH WITH A SURVEY ONLY, which asks people under load to spend energy reporting that they are under load.'
kpis:
- name: after_hours_activity_trend
  unit: percent
  direction: lower_is_better
  description: Work outside shift, trending. The earliest and most reliable leading signal available.
- name: qa_score_drift
  unit: ratio
  description: Quality falling at constant volume. It precedes stated dissatisfaction by months.
  direction: lower_is_better
- name: load_intervention_rate
  unit: percent
  description: Signal movements that produced an actual load reduction. Without it this is monitoring.
  direction: higher_is_better
- name: attrition_lead_indicator_gap
  unit: days
  description: Time between the leading signals moving and attrition. Measures whether anybody acted in the window.
  direction: higher_is_better
handoffs:
  upstream: [customer_support.support_operations.workload_balancing, customer_support.support_operations.capacity_planning,
             customer_support.support_management.performance_management]
  downstream: [customer_support.entitlement_and_sla.coverage_and_on_call, customer_support.support_management.agent_coaching]
  parallel: [customer_support.customer_communication.de_escalation, customer_support.support_management.quality_assurance]
applies_to:
  models: [b2b, b2c, b2b2c, enterprise_support, mid_market_support, smb_support, tiered_support, swarming_support,
           follow_the_sun, outsourced_bpo, named_tam]
  offerings: [product, service, hybrid]

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  reviewed_at: '2026-08-27'
  notes: >
    Promoted out of Phase-1 stub. Not on a live route.

    attrition_lead_indicator_gap is the KPI that makes this capability accountable rather than
    observational. The leading signals move first and attrition follows two quarters later;
    measuring the gap asks whether anybody used the window, which is the only question that
    matters here.

    The framing is the domain's own: support is the only function whose daily work is absorbing
    other people's frustration, attrition is its dominant cost driver, and burnout is invisible
    in every operational metric because the people absorbing the load are precisely the ones who
    will not say so.

