  confidence: experimental
  notes: 'Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models, decision_frameworks,
    kpis and handoffs, following quality-assurance in this subdomain. The expertise worth encoding is
    the set of leading indicators that live in queue data rather than in a survey: unequal distribution
    of hard work, quality falling while volume holds, rising reliance on canned responses, one person
    absorbing every out-of-hours page, and the disappearance of the small unpaid acts — updating an article,
    correcting a macro — that people stop doing first when they are depleted. Also worth stating: an engagement
    survey measures what people are willing to say about a team they are still in, which is the last place
    a problem shows up rather than the first.

    '
  reviewed_at: '2026-08-24'
