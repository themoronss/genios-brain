  last_updated: '2026-08-08'
  review_status: approved
  confidence: experimental
  notes: 'Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models, decision_frameworks,
    kpis and handoffs, following quality-assurance in this subdomain. The hardest thing to get right,
    and the thing worth writing down first, is the relationship with quality_assurance: QA scores exist
    to teach, and the moment they are admissible as evidence here, honest self-reporting stops and the
    sample stops describing the work. Some organisations accept that trade deliberately; the file should
    say which trade is being made rather than leave it implicit. Second is the volume-versus-quality trap
    — every metric that rewards closing tickets rewards closing them prematurely, and reopen rate is the
    only cheap correction.

    '
  reviewed_at: '2026-08-24'
