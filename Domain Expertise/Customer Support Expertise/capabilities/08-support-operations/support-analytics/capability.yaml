  confidence: experimental
  notes: 'Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models, decision_frameworks,
    kpis and handoffs, following the queue-management capability in this subdomain. The reason to delay
    promotion is that this capability describes how to read the other eight subdomains, so authoring it
    early risks encoding a measurement view of triage, escalation and deflection that those capabilities
    then contradict. When it is promoted, the load-bearing content is the counter-metric pairing table
    and the distinction between a metric that measures the work and a metric that measures the people
    — the two get conflated in every support review deck, and the conflation is what makes teams stop
    trusting their own dashboards.

    '
