# Situation — Queue Overloaded.
#
# The only situation in this domain whose subject is the team rather than a customer. Everything
# unusual about the file follows from that: there is no requester, no sentiment, no thread, and
# the scope field is deliberately absent because the enum has no member that is true here.
#
# The observable that matters is AGE, not SIZE. A queue count is a stock and the problem is
# always a flow, and a count is additionally the one measure that cherry-picking improves —
# agents take the quick, well-written, easily-closed tickets, the count falls, average handle
# time falls, and the customers who have waited longest keep waiting. The oldest open item is the
# number that cannot be gamed by working the queue badly, which is why the load-set requires
# Backlog and not merely Queue.

identity:
  id: customer_support.sit.queue_overloaded
  name: Queue Overloaded
  domain: customer_support
  owner_capability: customer_support.support_operations.queue_management
  version: 1.0.0
  status: draft

description: >
  A queue is taking in more than it is getting through, and has been for long enough that the
  oldest end of it has stopped being served at all. Not a busy morning — a rate mismatch that has
  persisted, which is a different thing with different remedies. The characteristic shape is a
  queue that looks acceptable by count and terrible by age distribution: the middle of the queue
  moves, the tail calcifies, and every incentive an individual agent has points away from the
  tail. The situation is about the team's ability to absorb what arrives, so the useful questions
  are what changed on the arrival side, what is deliberately not being served while this is true,
  and who has been forgotten — never simply how many are open.

matches:
  # ROUTED SINCE 2026-08-29, and the two types are DIFFERENT SHAPES built from one ledger.
  # `queue_overloaded` anchors on a `mailbox` node — one connected mailbox — and carries the
  # rates and the age distribution. `ticket_aging` anchors on a `backlog_item` node, one per
  # unmet ask, which is what this file asked for in its own words: per-item aging "needs the item
  # to be a first-class subject". Both come from `context/support_situations.py`.
  #
  # THE FILE'S TWO INSISTENCES ARE BOTH KEPT. It is not per-thread — the load reading is anchored
  # on the mailbox — and it is not count-shaped: what is carried is the oldest open item, the p50
  # and p90 of the wait, and the size of the tail over fourteen days. The average is never
  # reported. The second of the three rules that opens it is the anti-pattern this file is
  # actually about — a pile SHRINKING while getting OLDER, which every count-based signal reads
  # as improvement — and the third is cosmetic closure, caught because `record_ask` reopens a
  # loop when the customer asks again.
  #
  # WHAT IS LOST, on every row's `missing`.
  # (1) THERE IS NO QUEUE. No queue object, no assignee, no rota. The only honest partition on a
  #     mail tenant is one connected mailbox, and on a founder inbox that degenerates to the whole
  #     org — so every string produced says "this mailbox", never "this queue", and
  #     `workload_balancing` still has nothing it can move people between. The file's own line —
  #     an alert nobody owns is a dashboard — is a fair charge against this build, and the answer
  #     is to route the card to a named human at delivery, not to pretend the fact exists.
  # (2) CLOSURE IS NOT RESOLUTION. A loop closes on OUR reply on the thread, so a holding reply
  #     zeroes the age of exactly the calcified item this exists to find, and the turnaround
  #     figure is named `mailbox.reply_turnaround_days` for that reason. Partly recovered:
  #     `mailbox.loops_reopened` is real evidence of the bulk-closure failure, lagging by however
  #     long the customer takes to re-ask.
  # (3) ARRIVAL COMPLETENESS. Only the nine `ASK_KINDS` enter the ledger and none of them is
  #     support-native — no ticket_created, no bug_filed, no refund_requested. "The export is
  #     broken" counts only if the extractor labelled it a question, so demand is systematically
  #     UNDER-counted and the ratio it feeds is biased low. This is the largest fidelity loss and
  #     it is not fixable without a support extraction vocabulary.
  # (4) NO ARRIVAL-SIDE ATTRIBUTION and NO ENTITLED ORDER. The output can say demand rose; it
  #     cannot say a release or a broken page caused it, which is the half this file says usually
  #     tells a manager to fix something this week rather than to hire.
  # (5) For `ticket_aging`: comparable work means comparable work in this ORG, not in its queue,
  #     so a billing question and a production outage sit in one distribution; and recall is
  #     bounded by the extractor rather than by the mailbox.
  # (6) THE LOAD-SET IS STILL SHORT. Three of the four objects below — Queue, Backlog and
  #     Support Agent — plus Capacity Plan from `capacity_planning`'s manifest exist only as
  #     planned_objects, and `ObjectResolver` raises RequiredKnowledgeMissing on a missing
  #     REQUIRED object. So both types above route, resolve, and compile to nothing;
  #     `domain_shadow` counts them under `required_missing`. Measured 2026-08-29 against the real
  #     catalog. It is written here because `validate.py` tolerates a planned reference by design
  #     and reports no error for a live route that cannot produce a single package. Authoring
  #     Queue and Support Agent is also the honest blocker on loss (1) below — they cannot be
  #     written as records on this tenant, only as the definitions that say what is absent.
  l2_situation_types:
    - queue_overloaded
    - ticket_aging

  # ── THE CENSUS ENTRIES THESE TYPES USED TO HAVE, kept rather than deleted ──────────────────
  #
  # Both were `pending_l2_situation_types` until 2026-08-29. Neither can stay one — the schema and
  # `validate.py` both make naming an EMITTED type there an error, because as written it would
  # route nothing — but deleting them would erase the only record of what the approximation cannot
  # say. Each original ask is kept, clause by clause, marked against what was actually built.
  #
  # queue_overloaded
  #   Must mean: for a named QUEUE, arrivals exceeding closures and a degraded age distribution —
  #   two rates plus the shape of the wait, never a count.
  #     PARTLY BUILT. The rates and the shape are built and the average is never reported. THE
  #     QUEUE IS NOT: the subject is one connected mailbox, which on a founder inbox is the whole
  #     org, so every string says "this mailbox".
  #   It must be emitted per queue, with an OWNER attached, because an alert nobody owns is a
  #   dashboard.
  #     NOT BUILT, and the charge stands. `org_seats` is empty and no helpdesk supplies an
  #     assignee, so `mailbox.owner` is deliberately left unwritten rather than guessed. The
  #     answer is to route the card to a named human at delivery, not to invent the fact.
  #   It should carry the arrival-side attribution — a release, a campaign, a broken page.
  #     NOT BUILT. Nothing in the substrate attributes a rise in demand to a cause, which is the
  #     half that usually tells a manager to fix something this week rather than to hire.
  #   What would emit it: derived.backlog_age and ticket.queue against the ticket_volume baseline,
  #   with the band left to Layer 4.
  #     NOT BUILT AS SPECIFIED. `ticket.queue` has no writer and never will on a mailbox;
  #     `mailbox.*` is computed from the open-loop ledger instead. `ticket_volume` as a learned
  #     baseline is also absent — `mailbox.loops_opened_baseline` is a per-sweep computation, not
  #     a stored baseline. THE BAND IS NOT LAYER 4 EITHER: the three opening rules live in Layer 2
  #     as a mint-gate, which is a declared deviation from this clause and is recorded in the
  #     build notes rather than hidden here.
  #   Why unanswered_email is not good enough: it is per-thread and it counts SIZE when the
  #   finding is AGE.
  #     ANSWERED. The reading is anchored on the mailbox, and what it carries is the oldest item,
  #     p50, p90 and the tail over fourteen days — a pile shrinking while getting older opens it.
  #
  # ticket_aging
  #   Must mean: an individual open item that has waited materially longer than comparable work,
  #   with time-since-last-customer-contact carried SEPARATELY from time-since-open.
  #     BUILT. `backlog.days_since_customer` and `backlog.days_since_we_touched` are written
  #     apart from `backlog.age_days`, so an item being worked and an item nobody has touched stop
  #     sharing an age.
  #   In its QUEUE.
  #     NOT BUILT. Comparable work means comparable work in this org, so a billing question and a
  #     production outage sit in one distribution.
  #   It must distinguish waiting on the customer from waiting on us.
  #     BUILT — `backlog.waiting_on` comes from `thread.ball_in_court`.
  #   What would emit it: Layer 2 over ticket.created_at, ticket.status and derived.backlog_age
  #   relative to the resolution_time baseline for the queue.
  #     NOT BUILT AS SPECIFIED. There is no ticket and no `resolution_time` baseline; the band is
  #     the org's own median reply turnaround with a floor, and it is named
  #     `mailbox.reply_turnaround_days` because a loop closes on OUR REPLY and not on a
  #     resolution. Calling it resolution time would put a wrong word under every number here.
  #   Why commitment_overdue is not good enough: it needs a promise to exist, and the aging items
  #   that matter are the ones nobody promised anything about.
  #     STILL TRUE, and it is why this reading opens on the age of an unmet ask rather than on a
  #     commitment.

  # No scope. The enum offers person, deal, meeting and account, and the subject of this
  # situation is a queue owned by a team. Picking `account` because it is the least wrong would
  # be the same compromise this domain refuses everywhere else, and it would silently narrow the
  # situation to one customer's work — which is the reading that lets a backlog age.

also_serves:
  - customer_support.support_operations.workload_balancing
  - customer_support.support_operations.capacity_planning
  - customer_support.support_management.team_health

objects:
  load:
    - customer_support.obj.core.queue
    - customer_support.obj.core.backlog
    - customer_support.obj.core.ticket
    - customer_support.obj.core.support_agent
  optional:
    # sla_target gives the queue a contractual order that competes with its operational one —
    # genuinely useful and genuinely not required, because a queue with no entitled work in it is
    # still overloaded. capacity_plan and coverage_window turn "the service rate is too low" into
    # a statement about a rota that somebody can change this week.
    - customer_support.obj.core.sla_target
    - customer_support.obj.core.capacity_plan
    - customer_support.obj.core.coverage_window
  never_load:
    # Requester drops the altitude to one human, and that substitution is how backlogs are
    # allowed to age: reasoning about the customer in front of you is always more legible and
    # more satisfying than reasoning about the tail of a distribution, so the system will do it
    # given any excuse. The excuse is not provided here.
    - customer_support.obj.core.requester
    # Same reason one level along. Per-customer sentiment during an overload will preferentially
    # surface the loudest, and the loudest are systematically not the longest-waiting — the
    # people at the oldest end of a queue have usually stopped writing in.
    - customer_support.obj.core.customer_sentiment
    # Entitlement here would be read as permission to triage by who is paying most, which is a
    # legitimate policy but is a deliberate degradation decision made by a named person, not an
    # inference this situation should make quietly on its own.
    - customer_support.obj.core.entitlement

priority_bp: 7200
typical_duration_days: 10

render:
  artifact_kind: brief
  render_hint: >
    Report the distribution and the oldest open item, never the average — the finding is in the
    tail, and a mean is how the failing segment stays hidden. Say "this mailbox", never "this
    queue": there is no queue object, no assignee and no rota behind this, and the arrival count
    is only the requests an extractor recognised as asks, so it understates demand. Name the
    oldest item and how long it has waited before naming any total.
  fallback:
    headline: "Oldest work in this mailbox is not being served"
    situation: >-
      Arrivals are outrunning closures in this mailbox and the oldest end of it has stopped
      moving. No queue, owner or resolution state exists behind this reading.

signals_of_progress:
  - ticket_resolved
  - ticket_closed
  - agent_reassigned
  - first_response_sent

signals_of_decay:
  - ticket_created
  - ticket_reopened
  - sla_breach
  - escalation_requested
  - angry_language

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  notes: >
    Every string in signals_of_progress and signals_of_decay is a support-native obs kind from
    planned_substrate; none is emitted today, and none is schema-validated, so the file loads
    without being able to run. This situation is further from executable than any other in the
    domain — both of its objects, Queue and Backlog, are planned rather than authored, and its
    core measure, derived.backlog_age, is a planned fact path.
    agent_reassigned appears under progress here and under decay in escalation-requested.yaml.
    That is not an inconsistency: moving people onto a drowning queue is the correct response at
    this altitude, and moving a single escalated customer between owners is the failure at that
    one. It is a good illustration of why obs kinds cannot be scored globally and have to be read
    inside a situation.
    ticket_closed sits under progress and should be read with suspicion by any reviewer. Bulk
    closure of aged tickets is the most common cosmetic response to this exact situation: it
    removes the symptom, keeps the demand, and returns within a fortnight as reopens and repeat
    contacts. ticket_reopened is in the decay list partly as the counterweight to it, and the
    pair should be read together or not at all.
