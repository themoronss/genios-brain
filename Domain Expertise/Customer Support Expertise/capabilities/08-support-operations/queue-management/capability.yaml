metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ''
  last_updated: '2026-08-08'
  review_status: unreviewed
  confidence: provisional
  notes: 'No thresholds, no utilisation figures, no age bands. The utilisation curve is described by
    its shape because the shape is true of every queue ever run; the point on it where a given team
    starts drowning is arithmetic, differs between two queues in the same company, and belongs to Layer
    4. A number in this file would mean the Layer 3/4 boundary had leaked. The load-set is honest about
    a harder problem: queue and backlog are planned objects that nothing in the shipped substrate emits,
    so almost nothing here can fire until a support pack ships derived.backlog_age and the ticket fact
    paths. That is the point of the backlog, not a caveat on this file.

    '
