  confidence: experimental
  notes: 'Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models, decision_frameworks,
    kpis and handoffs, following the queue-management capability in this subdomain. Promote this one before
    support-analytics: a capacity conversation is the point at which support numbers get read by people
    outside support, and the characteristic failures are worth encoding first — planning to the period
    total instead of the interval, counting headcount rather than productive presence net of leave, training
    and meetings, and treating attrition as an exception rather than a standing input. Also worth encoding
    is the political reality that a capacity plan is usually the only budget artefact support owns, which
    is why it tends to be written to be approvable rather than to be right.

    '
