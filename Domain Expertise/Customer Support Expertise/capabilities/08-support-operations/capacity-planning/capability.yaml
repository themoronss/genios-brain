  name: Capacity Planning
  domain: customer_support
  subdomain: support_operations
  version: 0.1.0
  status: draft
  stub: true

description: >
  Sizing the team against demand that is bursty, seasonal and partly self-inflicted. A plan
  built on average volume guarantees being underwater during peaks and idle between them, so the
  plan is built against the shape of arrivals and the variance around it, and it has to absorb
  the lag between deciding to hire and having someone genuinely productive — long enough in
  support that the demand which justified the hire has usually changed by the time they arrive.
  The lever most plans ignore sits on the other side of the equation entirely: deflection,
  routing accuracy and product fixes move demand, and they move it faster than recruitment ever
  will.

question: "Will we have enough of the right people on shift when the work actually arrives?"

metadata:
  owner: Customer Support
