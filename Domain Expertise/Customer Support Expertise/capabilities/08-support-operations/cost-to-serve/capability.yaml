description: 'Working out what it actually costs to support a given customer, plan or product area, and
  what that fact obliges someone to do. The cost is almost never spread the way people expect — it concentrates
  in a handful of accounts, a couple of product areas and a small set of endlessly repeated questions
  — and until the total is split by cause it justifies nothing except hiring. The finding usually belongs
  to somebody else: a segment that is unprofitable to serve is normally a product gap or a mis-sold plan,
  so cutting service to fix it treats the symptom that is visible instead of the cause that is not.

  '
question: What does serving this customer really cost us, and is that cost a support problem or somebody
  else's?
