  notes: 'Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models, decision_frameworks,
    kpis and handoffs, following the queue-management capability in this subdomain. Promotion needs the
    attribution model settled first, because every version of this capability lives or dies on how contact
    effort is allocated to accounts and how much overhead is loaded onto it — get that wrong and the output
    is precise, defensible and useless. The expertise worth encoding is the set of moves available once
    the number exists: price change, plan redesign, product fix, documentation, proactive outreach and,
    last and most often reached for, service reduction. It is also the capability most likely to be used
    against the support team that produced it, which is a fact about how it should be written rather than
    a reason not to write it.

    '
