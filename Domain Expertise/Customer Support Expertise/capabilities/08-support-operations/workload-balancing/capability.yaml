  notes: 'Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models, decision_frameworks,
    kpis and handoffs, following the queue-management capability in this subdomain. Promotion is worth
    doing once the queue-management heuristics are settled, since this capability inherits its selection
    order from them and would otherwise encode a second, conflicting one. The genuinely novel expertise
    to capture on promotion is the tension between skill-based routing and skill development — the assignment
    that resolves fastest is almost never the assignment that grows the team — plus the reading of concentration,
    where one agent holding a disproportionate share of the hard work is a resourcing risk long before
    it is a performance story.

    '
