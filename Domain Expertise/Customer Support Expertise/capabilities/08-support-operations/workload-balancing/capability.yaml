description: 'Deciding who works what, given that agents are not interchangeable units of capacity. An
  even split of ticket count across an uneven split of difficulty is not balance — it is a slow queue
  and a quietly resentful team — so the load being balanced is open work in progress and skill match,
  not throughput. The hard part is the specialist: routing everything difficult to the one person who
  can do it optimises this week and manufactures a single point of failure, which is why some deliberately
  inefficient assignment is the price of a team that still functions when that person is on leave.

  '
question: Who should be working what right now, and who is quietly carrying this queue?
