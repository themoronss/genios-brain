    first_response_overdue.

    The expertise to capture on promotion: the intervention ladder, cheapest first — reply,
    reassign, borrow, escalate, renegotiate — and the fact that its rungs get dramatically more
    expensive as the deadline approaches, which is the entire argument for acting early. Also
    the alert-fatigue trade-off, why an unassigned ticket is a stronger predictor than an old
    one, and why a deadline landing inside a coverage handover deserves attention before the
    handover rather than after.
