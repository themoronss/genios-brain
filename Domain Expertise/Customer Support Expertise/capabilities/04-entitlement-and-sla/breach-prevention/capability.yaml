description: >
  The work of not breaching, which happens hours before the breach and while nothing about the
  ticket looks different yet. It is a separate capability from sla_management because managing
  a clock is bookkeeping and preventing a breach is forecasting: the useful signal is not the
  time remaining but the assignee's other open deadlines, the coverage handover the deadline
  falls across, and whether the last outbound message actually asked the customer for anything.
  The characteristic failure is a queue that alerts at the moment of breach, which is not a
  warning but a notification about the past — and the second is alerting so early and so often
  that the warning becomes background noise and every ticket is permanently amber.

question: "Which tickets will breach if nobody changes anything, and what is the earliest cheap intervention?"

