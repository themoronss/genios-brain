identity:
  id: customer_support.entitlement_and_sla.coverage_and_on_call
  name: Coverage & On-Call
  domain: customer_support
  subdomain: entitlement_and_sla
  version: 0.2.0
  status: stable
  stub: false
description: 'Making sure somebody who can actually help is awake, reachable and accountable for every
  hour a promise is live. Coverage is the arithmetic that turns a contractual window into a roster, and
  all of the expertise is in the seams rather than the middle of a shift: the handover between regions,
  the public holiday that exists in one country and not the next, the on-call engineer who is nominally
  covering a product area they have never worked on. A coverage gap almost never presents as a gap — it
  presents hours later and somewhere else, as a breach, an unacknowledged incident, or a customer who
  called the number on the contract and got nobody.

  '
question: Is someone who can actually help awake, reachable and accountable right now?

outcomes:
- 'Staffing hours and on-call depth derived from what has been SOLD — the tiers, time zones and response promises in live contracts — rather than from historical volume.'
- 'The map re-derived when sales sells something new, because a coverage model is a snapshot of last quarter''s contracts until somebody updates it.'
- 'Somebody who can actually help awake and reachable for every hour a promise is live. Reachable and able are different tests and only one is usually checked.'
- 'Escalation depth defined, so the on-call person knows who they can wake and under what conditions.'
- 'The negative outcome: a promise identified as UNCOVERABLE with current staffing, raised before it is sold again rather than discovered during an incident.'
failure_modes:
- 'STAFFING FROM VOLUME HISTORY, which describes when tickets arrived and not when we promised to answer them.'
- 'REACHABLE BUT NOT ABLE. A duty rota of people with no access and no authority is a phone tree.'
- 'NO RE-DERIVATION WHEN A NEW TIER IS SOLD, so the contract and the roster diverge silently until an incident reveals it.'
- 'TREATING CHRONIC OFF-HOURS PAGING AS DEDICATION. Regular pages are the roster and the contract map disagreeing.'
- 'SINGLE-DEPTH ON-CALL, where the one person unreachable means the promise is simply not met.'
kpis:
- name: coverage_gap_hours
  unit: hours
  description: Hours where a live promise exists and nobody able is on. The number the whole capability produces.
  direction: lower_is_better
- name: contract_map_currency
  unit: days
  description: Time since coverage was re-derived from live contracts. It ages every time sales closes something.
  direction: lower_is_better
- name: off_hours_page_rate
  unit: count
  description: Pages outside working hours. Chronic load is capacity-planning debt wearing a pager, not commitment.
  direction: lower_is_better
- name: escalation_depth_reached
  unit: percent
  description: Pages resolved at first depth rather than requiring somebody else to be woken.
  direction: higher_is_better
handoffs:
  upstream: [customer_support.entitlement_and_sla.entitlement_verification, customer_support.support_operations.capacity_planning]
  downstream: [customer_support.entitlement_and_sla.breach_prevention, customer_support.escalation_and_incident.incident_management]
  parallel: [customer_support.support_operations.workload_balancing, customer_support.support_management.team_health]
applies_to:
  models: [b2b, b2b2c, enterprise_support, mid_market_support, tiered_support, follow_the_sun, premium_paid_support,
           named_tam, outsourced_bpo, field_service]
  offerings: [product, service, hybrid]

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  reviewed_at: '2026-08-27'
  notes: >
    Promoted out of Phase-1 stub. Not on a live route. entitlement.coverage_hours and
    coverage_gap are planned_substrate with no writer.

    contract_map_currency is the KPI that names the structural failure: coverage is derived
    once, from the contracts that existed then, and it ages every time sales closes a deal in a
    new time zone or at a new tier. Nobody owns re-deriving it, so the gap is discovered during
    the first incident that lands in it.

    off_hours_page_rate is framed against the culture that reads chronic paging as commitment.
    Regular off-hours pages are the roster and the contract map disagreeing, and treating them
    as dedication is how the disagreement is never fixed.

