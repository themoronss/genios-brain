description: >
  Making sure somebody who can actually help is awake, reachable and accountable for every hour
  a promise is live. Coverage is the arithmetic that turns a contractual window into a roster,
  and all of the expertise is in the seams rather than the middle of a shift: the handover
  between regions, the public holiday that exists in one country and not the next, the on-call
  engineer who is nominally covering a product area they have never worked on. A coverage gap
  almost never presents as a gap — it presents hours later and somewhere else, as a breach, an
  unacknowledged incident, or a customer who called the number on the contract and got nobody.

question: "Is someone who can actually help awake, reachable and accountable right now?"

