  notes: >
    Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models,
    decision_frameworks, kpis and handoffs, following ../sla-management/capability.yaml. This
    capability owns no situation in the current roster; the nearest pending L2 type is
    coverage_gap, and a situations/coverage-gap.yaml would be the natural first addition when
    the roster next grows.

    The expertise to capture on promotion: nominal versus effective coverage — the roster says
    covered, the skills matrix says nobody on it can fix this; the difference between reachable
    and responsive, which is what an acknowledgement target actually measures; handover as a
    transfer of context rather than of a pager, and why the tickets that fall through are almost
    always the ones mid-diagnosis; and the on-call load question, since a rota that burns people
    out is a team_health problem that presents first as a coverage one.
