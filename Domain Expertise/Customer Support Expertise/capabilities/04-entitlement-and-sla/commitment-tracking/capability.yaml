  confidence: experimental
  notes: 'Promote by adding outcomes, failure_modes, playbooks, heuristics, mental_models, decision_frameworks,
    kpis and handoffs, following ../sla-management/capability.yaml, and by authoring situations/promised-followup-overdue.yaml
    (customer_support.sit.promised_followup_overdue), which this capability owns and which is one of the
    few support situations that binds to a REAL L2 type today — commitment_overdue, over commitment.due_at
    and commitment.action. That makes this the most executable capability in the subdomain despite being
    a stub, and it should probably be promoted before the others.

    The expertise to capture on promotion: extracting a commitment from conversational language that never
    says "I commit"; the fact that a soft promise made to defuse a moment is remembered as a hard one;
    renegotiating before the due time rather than apologising after; and why a commitment owned by a team
    is owned by nobody.

    '
