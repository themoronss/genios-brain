description: 'Holding the promises made inside a ticket that no contract ever created — the callback before
  end of day, the update on Friday, the bug someone said they would file with engineering. These are the
  promises customers remember most sharply, because a human said them directly and specifically, and they
  are the ones no clock is watching. The working rule is that an unrecorded commitment is an unmade one,
  and the discipline that matters most is closing the loop on the due date even when the answer is that
  there is no news yet, because silence is read as being forgotten rather than as being unfinished.

  '
question: What did we personally promise this customer, and is it still going to happen?
metadata:
  owner: Customer Support
