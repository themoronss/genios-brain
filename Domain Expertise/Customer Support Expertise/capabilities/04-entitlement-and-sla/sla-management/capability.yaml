metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ''
  last_updated: '2026-08-08'
  review_status: unreviewed
  confidence: provisional
  notes: 'This capability is deliberately narrow. It owns the state of the clock and the truthfulness
    of the ledger, and nothing else. Predicting and averting a miss is breach_prevention, which is a
    separate capability because that work happens hours before the deadline while nothing about the
    ticket looks different yet — an alert at the moment of breach is a notification about the past.
    Deciding what was promised is entitlement_verification. Saying the deadline to a human is expectation_setting.

    Nothing here is executable against today''s substrate: there is no ticket, SLA clock or entitlement
    fact path in the shipped packs, so every inference this capability wants sits in planned_substrate
    (sla.clock_state, sla.target_first_response_at, ticket.first_response_at, entitlement.coverage_hours)
    and in the pending L2 types sla_breach_imminent, sla_breached and first_response_overdue. That is
    the backlog, not a defect in this file.

    '
