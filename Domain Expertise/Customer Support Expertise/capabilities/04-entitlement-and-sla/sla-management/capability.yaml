# FULL capability — the reference file for subdomain 04.
#
# An SLA is a clock with a start, a pause and a deadline. Starts are stamped by a system and
# deadlines are arithmetic; both are hard to argue with. The pause is a human judgement made
# under queue pressure, which is why almost every SLA dispute — internal or with the customer —
# is a dispute about the pause. This file is organised around that fact.
#
# NOTE ON THE MISSING NUMBERS. There is not a threshold in here on purpose. "First response
# within four hours for a platinum plan" is a pack manifest fact and Layer 4's arithmetic; what
# Layer 3 knows is that a first-response clock exists, what legitimately stops it, and how a
# team fools itself about whether it was met. The moment a duration appears in this file the
# Layer 3/4 boundary has leaked and the expertise has been replaced by one customer's contract.
#
# Playbooks, heuristics, mental models and decision frameworks moved OUT of this
# file and into knowledge.yaml + the artifact folders. They are files now because a
# Layer 6 suggestion needs an id and a version to point at, and because a framework
# used by four capabilities cannot live inline in all four.

identity:
  id: customer_support.entitlement_and_sla.sla_management
  name: SLA Management
  domain: customer_support
  subdomain: entitlement_and_sla
  version: 1.0.0
  status: draft
  stub: false
description: 'Running the clocks that an entitlement created: knowing which clocks exist on a ticket,
  which one the ticket is actually judged on, when each started, whether it is legitimately running
  right now, and when it runs out in the customer''s covered hours rather than the agent''s. SLA management
  is bookkeeping in the honourable sense — the value is entirely in the ledger being true. It is not
  the work of avoiding a breach (that is breach_prevention, and it happens hours earlier), and it is
  not the promise itself (that is entitlement_verification, and it is a contract clause). A team that
  manages clocks well can still miss every deadline; a team that manages them badly cannot tell whether
  it missed them at all.

  '
question: Which clock is running on this ticket, is it running for the right reason, and when does it
  run out?
outcomes:
- Every ticket under an entitlement carries an explicit clock state — running, paused, met or breached
  — and never an implied one.
- 'Every clock names the promise it measures: first response, next response, restoration or resolution.
  Which one the ticket is judged on is decided before the deadline, not after it.'
- Every pause carries a recorded cause and a recorded restart condition, so the pause can be audited
  by someone who was not there.
- Deadlines are computed inside the entitlement's coverage window and quoted to the customer in the
  customer's local time.
- A breach is recorded as a breach. It is never dissolved by a retroactive pause, a reclassification
  or a merge.
- The deadline the customer believes in and the deadline the system holds are the same deadline.
- Attainment is reported next to the pause ratio, so nobody can read the first number without the number
  that qualifies it.
failure_modes:
- The pause as a parking space. The ticket is set waiting-on-customer with a question the customer has
  already answered, or with no question at all. The clock stops, the queue reports health, and the ticket
  rots in a state nobody looks at.
- Clock laundering. Reclassify, reassign, split or merge a ticket near its deadline and a fresh clock
  starts. The metric survives; the customer's wait does not reset.
- Measuring a promise the contract did not make — reporting resolution attainment when the entitlement
  promised first response, or the reverse. Everyone works the displayed clock, so displaying the wrong
  one is a team-wide error, not an individual one.
- First response satisfied by an autoresponder or a holding reply that says nothing specific about the
  ticket. Contractually a response, practically nothing, and once the field is satisfiable without reading
  the ticket the queue learns to satisfy it that way.
- Business-hours arithmetic done in the agent's timezone instead of the entitlement's coverage window.
  Produces real breaches over weekends and phantom breaches on public holidays that exist in one country
  and not another.
- Treating met as good. A met clock on a furious customer is a measurement failure — the promise being
  measured was not the promise they thought they had — and it is invisible to every SLA report ever
  built.
- Silent pauses. A clock stopped by a status change nobody intended as a pause, most often a bulk update,
  a merge or an automation firing on a stale rule.
- Internal waiting treated as customer waiting. Waiting on engineering is our problem; the moment it
  stops the clock, the queue shows a healthy board full of tickets nobody has touched in weeks.
- A breach discovered by the customer before it is discovered by the queue. The clock was arithmetically
  perfect and nobody was watching it.
- Per-ticket clocks during a widespread incident, so one fix breaches many clocks at once and generates
  a stack of individual apologies instead of one honest communication.
- Retroactive clock correction as routine practice. Correcting a genuinely wrong start is right; doing
  it monthly at reporting time means the ledger is now written by whoever runs the report.
kpis:
- name: first_response_attainment
  unit: percent
  direction: higher_is_better
  description: 'Share of tickets whose first-response clock was met. Uninterpretable without the pause
    ratio and the invalid-pause rate beside it, because both can manufacture it.

    '
- name: resolution_attainment
  unit: percent
  direction: higher_is_better
  description: Share of tickets whose resolution or restoration clock was met.
- name: pause_ratio
  unit: percent
  direction: target_band
  description: 'Share of elapsed wall time spent with the clock paused. The most diagnostic SLA metric
    there is and the one almost nobody reports. A band rather than a direction: near zero usually means
    agents are afraid to pause legitimately, and high means the queue is parking.

    '
- name: invalid_pause_rate
  unit: percent
  direction: lower_is_better
  description: 'Paused tickets with no live unanswered question to the customer. Measures the abuse
    directly instead of inferring it from attainment.

    '
- name: breach_rate
  unit: percent
  direction: lower_is_better
  description: Share of clocks missed. Read alongside breach severity — not all misses cost the same.
- name: proactive_breach_disclosure_rate
  unit: percent
  direction: higher_is_better
  description: 'Share of breaches the customer was told about before the deadline rather than after.
    The single best predictor of whether a breach becomes an escalation.

    '
- name: met_but_dissatisfied_rate
  unit: percent
  direction: lower_is_better
  description: 'Tickets that met every clock and still produced a detractor. The falsifier for attainment;
    without it the attainment number cannot be wrong and therefore cannot be informative.

    '
- name: retroactive_clock_correction_rate
  unit: percent
  direction: lower_is_better
  description: 'Clocks adjusted after the fact. Some correction is honest housekeeping; a rising rate
    means the ledger is being written by whoever runs the report.

    '
- name: clock_coverage
  unit: percent
  direction: higher_is_better
  description: 'Share of entitled tickets that actually carry a clock. Usually assumed to be complete
    and usually is not — untracked tickets are where the expensive breaches live.

    '
