    The expertise to capture on promotion, in order of value: the silent-expiry problem; the
    contract-versus-configuration drift that makes the ticketing system an unreliable witness;
    grandfathering and goodwill as deliberate, recorded exceptions rather than agent discretion;
    and the fact that a downgrade discovered mid-ticket is a commercial conversation wearing a
    support ticket's clothes.
