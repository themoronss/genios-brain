description: >
  Establishing what this customer is actually owed before anyone promises anything: which
  channels, which hours, which response targets, which named people may open a ticket at all.
  The whole capability rests on one habit — entitlement is checked, never assumed — because it
  expires quietly, it is usually richer in the signed contract than in whatever the ticketing
  system was configured with, and that gap is normally discovered by an angry customer rather
  than by an audit. The hard half is verifying downward: telling someone they are not entitled
  to what they are asking for is cheap on first contact and ruinous after work has begun, so
  the skill is doing it early and without making the customer feel caught out.

question: "What is this customer actually owed right now, and does the system still believe it?"

