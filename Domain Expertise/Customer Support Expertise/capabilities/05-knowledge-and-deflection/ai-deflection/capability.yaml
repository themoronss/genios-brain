identity:
  id: customer_support.knowledge_and_deflection.ai_deflection
  name: AI Deflection
  domain: customer_support
  subdomain: knowledge_and_deflection
  version: 0.2.0
  status: stable
  stub: false
description: 'Putting a model between the question and the queue, and owning what it says. The failure
  that matters is not the occasional wrong answer — it is that a confident wrong answer costs more than
  no answer at all, because the customer acts on it and returns with a second problem plus a grievance,
  and the transcript is now evidence. The operator judgement is about handover and grounding: when the
  assistant must escalate without being asked, what it may assert versus what it must cite, and whether
  a conversation it contained was actually resolved or merely outlasted. Containment is the number the
  vendor sells; it is not the number to run the programme on.

  '
question: Can a model answer this safely, and does it know when to stop trying?

outcomes:
- 'Automated answers attempting the known and handing off the unknown gracefully, with full context carried across so the human never asks the customer to repeat what the bot already heard.'
- 'A model that knows when to stop trying. The failure that matters is not the occasional wrong answer — it is the confident wrong answer that costs the customer time before a human sees it.'
- 'Deflection measured net of the temperature it creates, because every minute in a bot loop pre-heats the ticket the human eventually gets.'
- 'The exit available at any point and obvious, since a customer who cannot find the way out is being held rather than helped.'
- 'The negative outcome: a question class REMOVED from the bot because it answers it badly. Coverage that produces confident wrong answers is negative value.'
failure_modes:
- 'MEASURING DEFLECTION RATE ALONE. It flatters — a customer who gave up and left counts identically to one who was helped.'
- 'CONFIDENT WRONG ANSWERS. A hedge-free incorrect answer costs the customer the time to act on it plus the time to recover.'
- 'CONTEXT LOST AT HANDOFF, so the human opens with a question the customer has already answered twice.'
- 'NO VISIBLE EXIT, which converts assistance into containment and is precisely what customers describe when they say they were stuck with a bot.'
- 'EXPANDING COVERAGE TO RAISE THE RATE, which adds exactly the classes the model handles worst.'
kpis:
- name: net_deflection
  unit: percent
  description: Deflected minus those that returned as tickets. The only honest version of the headline number.
  direction: higher_is_better
- name: escalation_temperature_delta
  unit: ratio
  description: Sentiment of bot-escalated tickets against direct ones. The cost deflection rate hides.
  direction: lower_is_better
- name: context_carried_rate
  unit: percent
  description: Handoffs where the human had what the customer already said.
  direction: higher_is_better
- name: confident_wrong_rate
  unit: percent
  description: Answers given without hedging that were incorrect. The failure that matters most and is measured least.
  direction: lower_is_better
handoffs:
  upstream: [customer_support.intake_and_triage.channel_intake, customer_support.intake_and_triage.intent_classification,
             customer_support.knowledge_and_deflection.knowledge_authoring]
  downstream: [customer_support.intake_and_triage.routing_and_assignment, customer_support.knowledge_and_deflection.content_gap_analysis]
  parallel: [customer_support.knowledge_and_deflection.self_service_deflection, customer_support.customer_communication.response_drafting]
applies_to:
  models: [b2c, b2b, b2b2c, ai_first_support, plg_self_serve, smb_support, mid_market_support, community_support,
           embedded_in_product, outsourced_bpo]
  offerings: [product, service, hybrid]

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  reviewed_at: '2026-08-27'
  notes: >
    Promoted out of Phase-1 stub. Not on a live route. self_service_attempted and
    self_service_abandoned are planned_substrate obs kinds with no writer.

    net_deflection and escalation_temperature_delta exist as a pair because the headline metric
    is the most flattering number in support: a customer who gave up and left counts identically
    to one who was helped, and a customer who spent nine minutes in a loop before reaching a
    human counts as neither.

    confident_wrong_rate is the measurement almost nobody takes and the one that decides whether
    deflection is worth having. A hedged wrong answer costs a redirect; a confident one costs
    the time spent acting on it plus the time recovering plus the customer's trust in every
    subsequent answer.

