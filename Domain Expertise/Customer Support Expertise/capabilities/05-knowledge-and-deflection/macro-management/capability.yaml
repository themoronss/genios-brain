description: 'Curating the canned responses that make an agent fast, and pruning the ones that make the
  company sound like a wall. A macro saves time and destroys trust in the same motion when it answers
  a question nobody asked — the customer detects the mismatch instantly, reads it as not having been listened
  to, and the second contact costs more than the first would have. The governing trade is coverage against
  dilution: a small, ruthlessly maintained set that agents edit before sending beats a large library that
  turns every reply into a lottery, and a macro used at high volume with poor satisfaction attached is
  a stronger signal about the product than about the agent who sent it.

  '
question: Which canned reply makes this faster without making it feel canned?
