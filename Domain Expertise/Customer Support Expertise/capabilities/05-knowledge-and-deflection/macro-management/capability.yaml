  notes: 'Promote by adding outcomes, failure_modes (the first three: unedited sends, macros that outlive
    the product behaviour they describe, and macros written to close a ticket rather than to answer a
    question), heuristics with a why, kpis and handoffs. This capability owns the only scoped object in
    the subdomain — customer_support.obj.macro_management.macro — so promotion should happen alongside
    that object rather than before it. The measurement that would make this real, macro usage joined to
    reopen and satisfaction data, needs signals Layer 1 does not emit yet.

    '
