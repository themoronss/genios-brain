# Situation — Repeat Contact.
#
# One event, two findings, and every ticketing system on the market keeps the wrong one.
#
#   Finding A: this customer is having a bad time. Recorded, worked, and closed with the ticket.
#   Finding B: something upstream is missing — an answer that does not exist, or exists and
#              cannot be found. Discarded, every time, because the second ticket is a new record
#              with a new clock and nothing in the schema says "this is the second".
#
# B is the valuable one. It is the only finding in support that compounds: fixing it removes
# future work rather than completing present work. This file exists to make B survive the closure
# of the ticket that produced it, which is why the owner is content_gap_analysis and not
# response_drafting, and why Content Gap is loaded rather than merely available.

identity:
  id: customer_support.sit.repeat_contact
  name: Repeat Contact
  domain: customer_support
  owner_capability: customer_support.knowledge_and_deflection.content_gap_analysis
  version: 1.0.0
  status: draft

description: >
  The same person is back about the same thing. Not a reopened ticket — the previous contact was
  answered, closed, and by the system's own account handled correctly — but a fresh arrival that
  is, in substance, the same question. Read from the customer's side this is a broken promise
  wearing a compliant record: they asked, we answered, and they still had to come back. Read from
  the queue's side it is evidence that the answer was wrong, incomplete, unfindable, or correct
  but delivered in a form the customer could not use. The second reading is the one that pays,
  and it is only visible if the two contacts can be seen at once, which is exactly what the
  ticket-per-contact model prevents.

matches:
  # ROUTED SINCE 2026-08-29. BOTH types on this file now mint, from one mechanism in
  # `context/support_situations.py`: a closed deterministic lexicon names the TOPIC of every
  # inbound message, and the two readings are the same evidence grouped two ways —
  # `repeat_contact` per person-and-topic, `knowledge_gap` per topic across everybody.
  #
  # `knowledge_gap` gets its own `topic` anchor node, which REMOVES the limitation this file
  # records below rather than inheriting it: the finding finally has its own subject instead of
  # being filed against the customer who reported it. `repeat_contact` keeps the person anchor,
  # because the repetition is what is observable there.
  #
  # THE ANSWERED GATE IS THE SITUATION, and it is enforced: every contact in a repeat group
  # except the newest must show `thread.ball_in_court = them`, so a group whose earlier contact
  # was never answered is left to unanswered mail, which is what it is. `knowledge_gap`
  # additionally requires three distinct askers at two distinct accounts, because one chatty
  # account is a repeat contact and not a content gap.
  #
  # WHAT IS LOST, declared on every row's `missing` rather than papered over.
  # (1) The corpus's real discriminator — was an article surfaced and rejected, or was nothing
  #     surfaced at all — is NOT recovered and must not be faked. It needs help-centre search
  #     telemetry nobody has connected. `knowledge.answer_reuse_bp` is a SURROGATE measuring how
  #     much OUR OWN replies repeat themselves: high means a settled answer exists and should be
  #     published, low means none exists yet. That is a related question, not the same one, and
  #     `knowledge.published_answer_seen` is deliberately never written so the difference stays
  #     visible. Commissioning a duplicate article is the specific harm named below.
  # (2) Intent is INFERRED from the customer's own wording, not handed over by a requester's
  #     taxonomy. The failure is asymmetric and in the safe direction: a phrasing the lexicon does
  #     not recognise splits the group and the situation quietly does NOT fire. So the ordinal is
  #     a floor, never an exact count, and `inputs` says so rather than presenting "3rd contact"
  #     as a fact.
  # (3) Email only. A customer who called and then wrote reads as a first contact, and nothing
  #     here can detect that an arrival is missing.
  # (4) Deflection has no denominator — every contact counted arrived by mail by definition — so
  #     no deflection rate can be reported at all.
  # (5) THE LOAD-SET IS STILL SHORT. `content_gap` and `intent` are in `objects.load` below and
  #     exist only as planned_objects, and `ObjectResolver` raises RequiredKnowledgeMissing on a
  #     missing REQUIRED object — so BOTH types above route, resolve, and then compile to nothing;
  #     `domain_shadow` counts them under `required_missing`. Measured 2026-08-29 against the real
  #     catalog. Recorded here rather than left to be discovered, because `validate.py` tolerates
  #     a planned reference by design and reports no error for a live route that cannot produce a
  #     single package.
  l2_situation_types:
    - repeat_contact
    - knowledge_gap

  # ── THE CENSUS ENTRIES THESE TYPES USED TO HAVE, kept rather than deleted ──────────────────
  #
  # Both were `pending_l2_situation_types` until 2026-08-29. Neither can stay one — the schema and
  # `validate.py` both make naming an EMITTED type there an error, because as written it would
  # route nothing — but deleting them would erase the only record of what the approximation cannot
  # say. Each original ask is kept, clause by clause, marked against what was actually built.
  #
  # repeat_contact
  #   Must mean: the same requester, or the same account, contacting again about the same INTENT
  #   within a window — counted by intent and not by ticket.
  #     BUILT. The anchor is one person and one topic, and the group is keyed on the topic a
  #     closed lexicon named, never on a thread or a ticket.
  #   It must survive the earlier tickets being closed, merged or handled by a different agent.
  #     BUILT by construction — there are no tickets to close, and the reading is over the
  #     correspondence itself.
  #   It must carry the ordinal, because the shape of the curve is the finding.
  #     PARTLY BUILT. `repeat.ordinal` is written and is a FLOOR, not a count: a phrasing the
  #     lexicon does not recognise silently leaves a contact out of its own group.
  #   What would emit it: Layer 2 clustering ticket_created observations by requester and intent
  #   over derived.contact_frequency, with Layer 1 supplying the intent classification, and the
  #   contact_rate_per_account baseline making the window adaptive.
  #     PARTLY BUILT, and by a different instrument. There is no `ticket_created` obs kind and no
  #     Layer 1 intent classifier; a deterministic lexicon over masked text stands in for both.
  #     THE ADAPTIVE WINDOW IS BUILT — `account_rate` derives it from the account's own contact
  #     rhythm, clamped to 14..90 days — but `contact_rate_per_account` as a learned BASELINE is
  #     NOT: the rate is recomputed per sweep and nothing stores it.
  #   Why unanswered_email is not good enough: every one of these contacts was answered.
  #     STILL TRUE and now ENFORCED: every contact in a group except the newest must show
  #     `thread.ball_in_court = them`, so an unanswered pile is left to unanswered mail.
  #
  # knowledge_gap
  #   Must mean: a question the help centre does not answer, or answers somewhere nobody finds —
  #   and the type must carry the discriminator between them.
  #     NOT BUILT, and this is the one that matters. The discriminator needs help-centre search
  #     telemetry that nobody has connected. `knowledge.answer_reuse_bp` measures how much OUR OWN
  #     replies repeat themselves, which is a related question and not this one, and
  #     `knowledge.published_answer_seen` is deliberately never written so the substitution stays
  #     visible. Until it is built, commissioning a duplicate article remains possible.
  #   Its subject is an intent, not a ticket. A gap that exists only as a property of a ticket
  #   dies when the ticket closes.
  #     BUILT. `knowledge_gap` mints its own `topic` anchor, so the finding has a subject of its
  #     own instead of being filed against whichever customer reported it.
  #   What would emit it: zero-result and abandoned help-centre searches, knowledge_article_linked
  #   observations, and Layer 2 aggregation of deflection_failed across an intent.
  #     NOT BUILT. None of `self_service_attempted`, `self_service_abandoned`,
  #     `knowledge_article_linked` or `deflection_failed` exists; all remain in
  #     `planned_substrate`. What was built is an aggregation over inbound mail alone.
  #   Why the nearest is not good enough: every type the pipeline emits is customer-shaped and
  #   this one is content-shaped.
  #     ANSWERED by the `topic` anchor. This clause is the one the build closed outright.

  # Person, because that is where the repetition is observable. Note the limitation honestly: the
  # gap this situation is really about belongs to an intent and affects everyone who has it, and
  # the scope enum has no member for that. Person-scope finds the evidence; it does not describe
  # the finding.
  scope: person

also_serves:
  # Three deflection mechanisms that all need the same thing this type would carry: an
  # identity for the QUESTION, so a repeat can be recognised as a repeat. Without it a macro
  # library, an AI deflector and a duplicate detector are each guessing at sameness.
  - customer_support.knowledge_and_deflection.macro_management
  - customer_support.knowledge_and_deflection.ai_deflection
  - customer_support.intake_and_triage.duplicate_and_merge
  - customer_support.knowledge_and_deflection.knowledge_authoring
  - customer_support.knowledge_and_deflection.self_service_deflection
  - customer_support.voice_of_customer.product_feedback_routing

objects:
  load:
    - customer_support.obj.core.content_gap
    - customer_support.obj.core.ticket
    - customer_support.obj.core.knowledge_article
    - customer_support.obj.core.intent
    - customer_support.obj.core.requester
  optional:
    # issue separates a documentation gap from a defect no article can fix — the most common
    # misdiagnosis in this capability, and the one that produces beautifully written articles
    # explaining how to live with a bug. product_area routes the finding to whoever can act.
    - customer_support.obj.core.issue
    - customer_support.obj.core.product_area
    - customer_support.obj.core.customer_sentiment
  never_load:
    # Every contact in this sequence probably met its clock. That is the trap: the SLA view of a
    # repeat contact says all is well, three times, and it is the reason this situation is
    # invisible to the reports a support team looks at daily. Loading SLA Target here would
    # import that blindness into the reasoning and let the compile conclude the customer was
    # served on time, which is both true and beside the point.
    - customer_support.obj.core.sla_target
    # Escalation is the wrong upgrade path. A repeat contact is a content problem and treating it
    # as an ownership transfer moves one customer to a better agent while leaving the gap that
    # will produce the next forty.
    - customer_support.obj.core.escalation

priority_bp: 6800
typical_duration_days: 14

signals_of_progress:
  - knowledge_article_linked
  - self_service_attempted
  - ticket_resolved
  - followup_sent

signals_of_decay:
  - ticket_created
  - self_service_abandoned
  - ticket_reopened
  - angry_language

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  notes: >
    Every string in these lists except followup_sent is a support-native obs kind from
    planned_substrate and is emitted by nothing today. They are free-form and unvalidated, so the
    file loads without running.
    The duration is set at 14 days against the gap, not against the customer's ticket. The
    customer's contact resolves in hours; the situation is only genuinely over when the answer
    exists and is findable, and a fortnight is the honest span for writing, publishing and seeing
    whether contacts on that intent fall. Setting it to the ticket's lifetime would let the
    system mark the valuable half of this situation closed at the moment it discarded it — which
    is what the tooling already does and what the file is written to prevent.
    knowledge_article_linked sits under progress with a caveat: linking an article the customer
    has already read is one of the two failures this capability watches for, and no obs kind
    currently distinguishes a first link from a repeat one. Until it does, that signal is weaker
    than its position in the list implies.
