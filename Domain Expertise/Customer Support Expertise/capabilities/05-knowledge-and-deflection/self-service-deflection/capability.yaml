identity:
  id: customer_support.knowledge_and_deflection.self_service_deflection
  name: Self-Service Deflection
  domain: customer_support
  subdomain: knowledge_and_deflection
  version: 1.0.0
  status: stable
  stub: false
description: 'Making the answer reachable at the moment the question forms, so the contact never has to
  become a ticket — and, harder, telling the difference between a customer who found the answer and a
  customer who gave up. Deflection is not a content problem and not a help-center problem; it is a judgement
  about which intents can honestly be answered without a human, where those answers must physically sit,
  and how a customer signals that the attempt worked. A deflection programme that cannot distinguish resolution
  from abandonment is not measuring deflection, it is measuring silence.

  '
question: Did this customer get their answer without us, and would they say so?
outcomes:
- 'Every high-volume intent carries an explicit verdict: deflect, deflect with a visible human escape,
  or route to a human on purpose.'
- The claim that a deflection happened comes from the customer confirming it, not from the absence of
  a ticket.
- Every failed self-service attempt lands somewhere countable — as a missing answer, a findability defect,
  or a product defect — rather than evaporating.
- The route from any self-service surface to a human is discoverable without searching for it, and that
  has been verified by someone walking it, not assumed from the sitemap.
- The answer sits in the surface that produced the confusion, not only in the help center the customer
  would have to know to visit.
- Deflection is reported per intent with contact volume beside it, so a rate that moved because the question
  mix moved cannot be read as an improvement.
- Intents that are not generically answerable are recorded as such, so nobody is later rewarded for deflecting
  them.
failure_modes:
- Defining deflection as tickets-not-filed and then optimising it. This produces a beautiful chart and
  a furious customer base, in that order.
- Hiding, delaying or gating the contact route — interstitials, mandatory article views, a support address
  behind three clicks — and calling the result self-service.
- Booking an abandonment as a deflection, so the earliest churn signal support can see is recorded as
  a saving.
- Publishing for the intents that are pleasant to write about rather than the ones generating contacts,
  because the former have willing authors.
- 'Treating an unchallenged article as a correct article. Knowledge decays silently: the product ships,
  the screenshot lies, and the misled customer leaves rather than complains.'
- Answering in the company's vocabulary, so the article exists and is unfindable — after which content-gap
  analysis commissions a duplicate that competes with it in search.
- 'Deflecting intents that were never generically answerable: billing disputes, account-specific breakage,
  anything with an angry human attached.'
- Letting a macro do an article's job. The customer receives a canned answer to a question they did not
  ask, and now distrusts both that answer and the next one.
- Optimising a single blended company-wide rate, which moves with intent mix and can therefore be improved
  by a marketing campaign about password resets.
- Owning the number in marketing or in whoever administers the help-center tool, so nobody who reads tickets
  ever sees the evidence that deflection failed.
- Declaring victory when contacts fall without checking whether customers fell too. Churned customers
  deflect beautifully.
kpis:
- name: confirmed_deflection_rate
  unit: percent
  description: Self-service sessions where the customer explicitly said the answer solved it. The only
    deflection figure that cannot be improved by concealing the human route.
  direction: higher_is_better
- name: self_service_abandonment_rate
  unit: percent
  description: Sessions that ended with neither an answer nor a contact. Read as suppressed demand and
    a candidate churn signal, never as a saving.
  direction: lower_is_better
- name: deflection_failure_rate
  unit: percent
  description: Tickets whose requester viewed the relevant answer before contacting. Each one is a content
    defect with the reproduction attached.
  direction: lower_is_better
- name: zero_result_search_share
  unit: percent
  description: Share of help-center searches returning nothing. The content backlog, stated by customers
    in their own words, before any ticket exists.
  direction: lower_is_better
- name: contact_rate_per_account
  unit: contacts_per_account
  description: 'Contacts normalised by customers rather than by sessions. The honest counterweight: real
    deflection lowers this, gamed deflection does not move it.'
  direction: lower_is_better
- name: repeat_contact_after_self_service
  unit: percent
  description: Requesters who came back after a self-service attempt. Distinguishes an answer that worked
    from one that merely ended the session.
  direction: lower_is_better
- name: time_to_answer_self_serve
  unit: seconds
  description: How long the successful path takes. A rising figure predicts abandonment before the abandonment
    rate moves.
  direction: lower_is_better
- name: knowledge_freshness_lag
  unit: days
  description: Time between a product change and the corresponding answer being reviewed. The measurable
    proxy for silent decay.
  direction: lower_is_better
handoffs:
  upstream:
  - customer_support.intake_and_triage.intent_classification
