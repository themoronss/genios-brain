metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-08'
  review_status: approved
  confidence: provisional
  notes: 'Almost nothing in this capability is observable today. There is no self-service telemetry in
    the substrate at all — self_service_attempted, self_service_abandoned, knowledge_article_linked and
    deflection_failed are all planned_substrate, as is the contact_rate_per_account baseline. The load-bearing
    distinction of the whole capability, answered versus abandoned, requires exactly the two observation
    kinds that do not exist, which is why it is stated here in prose rather than encoded in patterns.
    Objects loaded by this capability should carry those as needs_signal patterns rather than binding
    to unanswered_email, which would produce coverage-shaped nonsense. Everything a customer would recognise
    as evidence — the confirmation prompt, the escape-hatch walk, the deflection-failure sample — is deliberately
    human-run until then, because a proxy metric here does not degrade gracefully: it inverts.

    '
  reviewed_at: '2026-08-24'
