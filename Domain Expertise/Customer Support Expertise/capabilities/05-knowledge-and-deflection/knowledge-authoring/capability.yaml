  notes: >
    Promote by adding outcomes, failure_modes (start with the two that dominate: authoring
    from the product's vocabulary rather than the customer's, and treating publication as
    completion rather than as the start of a maintenance obligation), playbooks, heuristics,
    mental_models, kpis and handoffs. The upstream is resolution_delivery and
    content_gap_analysis; the downstream is self_service_deflection and macro_management. It
    stays a stub until there is a real position on who authors — the solver, a writer, or a
    reviewer — because every other decision in the file follows from that one.
