description: >
  Writing the answer once, in the words the customer used to ask it, while the ticket that
  proved it was missing is still open. Authoring is a resolution activity rather than a
  documentation project: an article written weeks later by someone who did not solve the case
  reliably describes the product instead of the problem, which is why it reads fluently and
  deflects nothing. The judgement that matters is subtractive — which of the answers already
  in agents' heads is worth making public, given that every published article is a promise to
  keep it true and a competitor to the other articles in search.

question: "What did we just learn that should never have to be worked out again?"

metadata:
  owner: Customer Support
  created_by: ai
