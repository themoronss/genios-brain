purpose:
  statement: 'Escalation is a control loop, not a status: entry condition, owner, exit condition. A
    state with no exit is a label.


    Explains the slow decay every escalation process suffers. Loops that cannot terminate accumulate,
    and an accumulating signal converges on meaninglessness no matter how well the entry criteria were
    written.'
