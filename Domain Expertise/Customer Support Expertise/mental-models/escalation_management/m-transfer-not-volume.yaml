purpose:
  statement: 'Escalation is a transfer of ownership, not an increase in volume. The transaction is one
    person accepting responsibility from another; the tag, the priority change and the channel post
    are bookkeeping about that event, not the event.


    Holding this model is what makes the failure modes visible. Once escalation is understood as a transfer,
    "who accepted it" becomes an obvious question, and every tool''s flag-shaped implementation is revealed
    as an unowned announcement.'
