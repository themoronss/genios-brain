purpose:
  statement: 'An agent''s escalations draw on a finite credibility balance with the receiving team.
    Spend it on things that did not need it and the balance is empty on the day it matters.


    It explains why blanket "escalate whenever unsure" guidance fails in practice. The cost of an unnecessary
    escalation is not the receiver''s time; it is the discount applied to that agent''s next one, which
    is paid by a future customer.'
