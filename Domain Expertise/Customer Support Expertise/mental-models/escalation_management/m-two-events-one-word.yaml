purpose:
  statement: 'Two different events wear the word "escalation": a relationship event the customer starts,
    and a process event we start. Different observers, different first moves, different definitions
    of done.


    Nearly every escalation policy in circulation describes only the process event while practitioners
    spend most of their time in the relationship one. The merged model is why so much escalation training
    feels irrelevant to the people doing it.'
