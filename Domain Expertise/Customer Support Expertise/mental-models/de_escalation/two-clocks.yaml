purpose:
  statement: 'Two clocks run on every heated contact: the resolution clock and the reassurance clock.
    They run at different speeds and only one of them is on the ticket.


    Most support tooling instruments the resolution clock alone, so a team can be doing well on everything
    it measures while the customer''s experience is governed entirely by the other one. The reassurance
    clock resets with every outbound message and expires much faster.'
