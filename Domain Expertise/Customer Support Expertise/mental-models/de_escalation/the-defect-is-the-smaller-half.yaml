purpose:
  statement: 'Every escalated contact has two problems: the fault, and what the handling of the fault
    taught the customer about us. Only the second one survives the ticket.


    It is the argument for spending effort on communication that could have gone into the fix. The fix
    is forgotten within the quarter; the conclusion the customer drew about whether we can be relied
    on is what gets quoted in the renewal conversation.'
