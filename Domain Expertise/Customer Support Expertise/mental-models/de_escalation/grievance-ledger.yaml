purpose:
  statement: 'There is a ledger. Every unanswered message, every retelling, every reassignment, every
    missed promise is an entry — and the anger is the balance, not the last line.


    It explains the response that looks disproportionate to the current ticket, and it explains why
    one good reply rarely settles it. The ledger is paid down entry by entry through kept commitments;
    it cannot be zeroed with a gesture.'
