purpose:
  statement: 'Temperature falls with predictability, not with concessions. Concessions move the floor,
    not the trajectory.


    Teams reach for discounts and credits because those are the levers they control unilaterally. They
    buy a step change and no slope. The slope only comes from a sequence of promises that were kept,
    which is why the third on-time update matters more than the first credit.'
