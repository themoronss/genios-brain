purpose:
  statement: 'The customer is writing an account of this incident that they will tell internally. We
    are either a character in it or an absence in it.


    It reframes what an update is for. The update is not only information transfer — it is material
    for the story the requester has to tell their own manager, and a customer who has nothing to relay
    has to invent something, usually about our indifference.'
