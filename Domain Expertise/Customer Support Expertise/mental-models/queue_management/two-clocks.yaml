purpose:
  statement: 'Every ticket carries two clocks: the customer''s, which started when they had the problem,
    and ours, which started when we touched it.


    Only the first matters to the customer, and only the second is usually instrumented. Most arguments
    between support and its customers are two people reading different clocks and each believing the
    other is being unreasonable.'
