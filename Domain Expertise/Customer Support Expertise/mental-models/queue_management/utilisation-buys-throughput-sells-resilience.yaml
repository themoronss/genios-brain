purpose:
  statement: 'Slack is not waste; it is the mechanism by which a queue recovers from a bad day.


    A queue run with no idle capacity has traded its ability to absorb variance for a marginally better
    average. It will look efficient right up until the first spike, after which it never catches up,
    because there is no spare service rate with which to catch up.'
