purpose:
  statement: 'A queue is a rate mismatch made visible, not a pile of work.


    Reframing the pile as a gap between two rates changes every available action. You can lower arrivals,
    raise service rate, or accept the gap and choose who bears it — and only the third of those is achievable
    by asking people to try harder.'
