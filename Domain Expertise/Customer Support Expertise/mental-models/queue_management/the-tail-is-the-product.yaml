purpose:
  statement: 'The average customer experience is not experienced by anyone; the tail is.


    Nobody escalates because of the mean. Reputation, churn and executive attention are generated entirely
    by the worst experiences, which is why a queue managed to its average can be simultaneously healthy
    and reputationally on fire.'
