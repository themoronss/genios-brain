purpose:
  statement: 'Two ledgers run at once: the contractual clock and the customer''s felt clock. They start
    at the same instant and only one of them pauses.


    The customer experiences unbroken wall time from the moment they hit send. Every legitimate pause
    widens the gap between the two ledgers, and every SLA dispute lives inside that gap. Knowing the
    gap exists is what stops a team from quoting attainment at an angry customer.'
