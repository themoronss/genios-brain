purpose:
  statement: 'An SLA is an insurance policy, not a service standard. It states the worst acceptable
    case.


    A team that treats the floor as the target has converted its worst acceptable performance into its
    normal performance, which is precisely what the customer will then experience and then renegotiate.
    The clock exists to bound a wait, not to describe an ambition.'
