purpose:
  statement: 'The clock is a shared object that only one party can see.


    We hold the instrument and the customer holds the expectation. Everything good in SLA communication
    follows from deliberately showing them our side of it — a stated deadline, a stated pause, a stated
    miss — and everything bad follows from assuming they can infer it.'
