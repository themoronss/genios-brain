  subdomain: entitlement_and_sla
  version: 1.0.0
  status: draft
purpose:
  statement: 'Entitlement is the promise; an SLA target is that promise instantiated on one ticket.
    The first is a clause, the second is a timestamp.


    Collapsing them is the most common modelling error in ticketing software. It makes it impossible
    to express a ticket whose clock is wrong because the entitlement lookup was wrong, which is one
    of the most common ways an SLA goes bad.'
