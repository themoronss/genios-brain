purpose:
  statement: 'Attainment is not a measurement of speed. It is a ratio between how fast we were and how
    slow we promised to be, and both terms are editable.


    This is why attainment across teams or vendors is close to meaningless without the targets and the
    pause rules alongside it, and why a team under pressure will always find it easier to edit the denominator
    than the numerator.'
