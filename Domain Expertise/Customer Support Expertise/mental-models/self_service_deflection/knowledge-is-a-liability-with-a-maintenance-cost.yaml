purpose:
  statement: 'Knowledge is a liability with a maintenance cost, not an asset that accrues.


    Every published answer is a promise to keep it true. A help center that only grows is a help center
    whose average article is getting more wrong every quarter, and whose search results are getting
    worse for the answers that are still right.'
