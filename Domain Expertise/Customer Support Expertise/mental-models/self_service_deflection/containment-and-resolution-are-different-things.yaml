purpose:
  statement: 'Containment and resolution are different things. Containment means the contact stayed
    inside the self-serve channel; resolution means the problem stopped.


    A channel can contain perfectly and resolve nothing — that is exactly what a dead end looks like
    from the outside. Vendors sell containment because it is the number their product can see.'
