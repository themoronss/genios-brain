purpose:
  statement: 'Deflection is a funnel, not a rate: the question forms, the surface is reached, an answer
    is found, the problem stops, the customer agrees it stopped. Every published deflection number silently
    picks one of those arrows and calls it the whole thing.


    Naming the arrow you measured is what makes two teams'' numbers comparable, and is what makes it
    obvious that "did not file a ticket" is the weakest arrow in the chain.'
