purpose:
  statement: 'Support is the earliest sensor of churn and the last party consulted about it.


    Frequency of contact makes support the first to know and organisational position makes it the last
    to be asked. The information genuinely exists inside this function; what does not exist is a path
    from it to the person who can act. Building that path is most of this capability, and it is why
    the deliverable is a briefing rather than a score.'
