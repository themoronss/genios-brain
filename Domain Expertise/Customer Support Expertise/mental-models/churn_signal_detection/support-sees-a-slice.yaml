purpose:
  statement: 'Support sees the part of the relationship that went wrong, and only that part.


    The queue is a biased sample by construction — it contains failures and questions and nothing else.
    That makes it superb at detecting deterioration and structurally incapable of measuring health,
    and a churn read that forgets this will call every heavy user a risk.'
