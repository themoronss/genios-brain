purpose:
  statement: 'Absence is a signal, but only against a stored expectation.


    Nothing arrives when a customer goes quiet, so there is no event for a rule to match on. Detection
    requires a remembered picture of that account''s normal behaviour, which makes this a baseline capability
    rather than an event capability and explains why it degrades badly on new accounts.'
