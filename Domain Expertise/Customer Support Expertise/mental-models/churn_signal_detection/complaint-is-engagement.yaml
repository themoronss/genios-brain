purpose:
  statement: 'Complaint is engagement; silence is exit.


    Telling us something is wrong costs the customer effort and presumes a relationship worth repairing.
    The withdrawal of that effort is the actual transition, and it emits nothing — no ticket, no observation,
    no timestamp — which forces detection to look for absence.'
