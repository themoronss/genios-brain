purpose:
  statement: 'Churn has a slow shape and a sudden shape, and a detector tuned for one is blind to the
    other.


    The slow shape is accumulated effort: nothing individually escalatable, everything individually
    forgivable, visible only as trend. The sudden shape is a single unforgivable event — lost data,
    a billing failure, a broken promise made in writing. Trend detection misses the second entirely;
    event detection misses the first entirely.'
