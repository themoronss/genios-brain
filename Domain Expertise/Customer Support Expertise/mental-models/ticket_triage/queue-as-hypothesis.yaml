purpose:
  statement: 'A queue assignment is a hypothesis about who can finish the work.


    Every reassignment is that hypothesis being falsified. Reassignment rate is therefore a measurement
    of the taxonomy first and of the triager second, and organisations that read it the other way around
    coach individuals for a structural problem.'
