purpose:
  statement: 'Triage is reversible in the tool and expensive in the relationship.


    Reassigning costs a click. But the customer has already been told, the clock has already been spent,
    and the receiving agent starts from a story someone else wrote. Cheap-to-undo in the system is not
    cheap-to-undo for the human on the other end.'
