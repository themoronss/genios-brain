purpose:
  statement: 'Every triage taxonomy is a lossy compression of the work, and the tickets it compresses
    badly are the ones worth reading.


    A category that fits everything has stopped carrying information. The tickets that resist classification
    are the census of what the product, the documentation or the queue design is currently getting wrong,
    and they are the cheapest research available to a support leader.'
