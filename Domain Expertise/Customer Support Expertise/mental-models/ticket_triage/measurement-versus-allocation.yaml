purpose:
  statement: 'Severity is a measurement. Priority is an allocation.


    Measurements are compared against the world and can be wrong. Allocations are compared against everything
    else in the queue and can only be better or worse. They obey different rules for revision, review
    and audit, which is why merging them into one field destroys both.'
