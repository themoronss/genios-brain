purpose:
  statement: 'QA is a measuring instrument, and the first property of a usable measuring instrument
    is that it does not change what it measures. Consequence is what breaks that property.


    This is the single frame that explains most of the failure modes at once. Once you accept that observation
    under threat produces observed behaviour rather than real behaviour, blind review, coaching-only
    routing and the separation from performance management all stop being cultural preferences and become
    measurement requirements.'
