purpose:
  statement: 'The rubric is the organisation''s written-down definition of good support. Most arguments
    about a score are actually arguments about that definition, and a score is the cheapest place a
    company will ever discover it disagrees with itself about what good looks like.


    Reframing disputes this way makes them productive. The question stops being "was this agent good"
    and becomes "is this what we meant", which is answerable and produces an edit.'
