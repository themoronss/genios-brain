purpose:
  statement: 'Reproduction is a lever, not a gate. Being unable to reproduce multiplies the cost of
    every later step; it does not remove the obligation to explain.


    Treating it as a gate produces the industry''s most common bad close, and treating it as irrelevant
    produces investigations that never converge. Naming it as a cost makes the trade-off explicit —
    more instrumentation, more customer access, or an honest unknown.'
