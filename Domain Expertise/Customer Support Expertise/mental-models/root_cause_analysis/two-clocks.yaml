purpose:
  statement: 'There are two clocks: the ticket clock and the issue clock. A workaround stops the first
    and leaves the second running.


    Almost every reporting pathology in support comes from an organisation with only one clock — it
    cannot express "resolved for the customer, unresolved in the product", so it reports the more comfortable
    of the two. This model is the reason resolution_delivery and root_cause_analysis are separate capabilities
    rather than one.'
