purpose:
  statement: 'Who is affected and who is not is itself the hypothesis. The population outline is the
    cause outline, drawn before any log is opened.


    Population evidence is cheap, already collected, and constrains the search far more sharply than
    any single deep trace. Teams skip it because deep investigation feels like the real work.'
