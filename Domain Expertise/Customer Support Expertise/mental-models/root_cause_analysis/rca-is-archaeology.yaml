purpose:
  statement: 'Root cause analysis is archaeology rather than forensics. The event you are studying is
    a layer of sediment, not a crime scene, and most of it has already eroded.


    This sets the right expectation about evidence: it is partial, biased toward what happened to be
    logged, and reconstructed rather than observed. Investigators who expect forensic certainty stall;
    investigators who expect archaeology triangulate.'
