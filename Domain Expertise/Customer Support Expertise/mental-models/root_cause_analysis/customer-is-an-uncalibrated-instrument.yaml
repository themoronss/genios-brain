purpose:
  statement: 'The customer is an instrument you did not calibrate: sensitive, positioned exactly where
    the fault surfaced, and reporting in units of their own mental model.


    This is the framing that makes their report simultaneously indispensable and untrustworthy, and
    stops the two common errors — dismissing the report because a detail is wrong, and taking the report
    literally because it is detailed.'
