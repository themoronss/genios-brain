purpose:
  statement: 'Symptom, fault and cause are three different objects. The symptom is what was seen, the
    fault is what the system does wrong, the cause is why the system is permitted to do it.


    Most fields labelled "root cause" in ticketing tools contain a fault, and a great many contain a
    symptom. Once the three are named separately it becomes obvious which one an investigation has actually
    reached, and that judgement is otherwise unavailable.'
