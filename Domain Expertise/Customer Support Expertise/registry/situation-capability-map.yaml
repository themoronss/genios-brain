# ── Deferred ──────────────────────────────────────────────────────────────
# Capabilities with no door and a named reason for it. They appear in no route, the
# situations they own are suppressed from the map above, and they compile into zero
# packages. Authored in <domain>/deferrals.yaml; not deleted, not deprecated.
deferred_capabilities:
  customer_support.diagnosis_and_resolution.issue_reproduction:
    kind: blocked_on_l2_type
    reason: 'Advising on how to reproduce a defect requires knowing whether it reproduces, and `issue.reproduction_state` is emitted by nothing. Binding to `support_case` instead would have this capability advise on reproducing something with no record of whether it ever has — which its sibling situation names as the second specific reason that binding is wrong.'
    blocked_on:
      - issue_under_diagnosis
  customer_support.diagnosis_and_resolution.resolution_delivery:
    kind: blocked_on_l2_type
    reason: 'Delivering a resolution presupposes a resolution to deliver, and `issue.resolution_kind` — none, workaround, or fix — has no writer. Without it this capability cannot tell a workaround being shipped as a fix from a fix, which is the one distinction it exists to hold.'
    blocked_on:
      - issue_under_diagnosis
  customer_support.diagnosis_and_resolution.root_cause_analysis:
    kind: blocked_on_l2_type
    reason: 'A root cause is invisible from one report at a time, and one report at a time is all this product can currently see: no `issue` object exists, so nothing clusters the tickets that describe the same defect. Owns `customer_support.sit.issue_under_diagnosis`, which binds no L2 type and is suppressed with it. Unblocked when Layer 2 emits `issue_under_diagnosis` with issue identity, reproduction state and resolution kind — not by authoring more expertise.'
    blocked_on:
      - issue_under_diagnosis
  customer_support.diagnosis_and_resolution.verification_and_closure:
    kind: blocked_on_l2_type
    reason: 'Closure cannot be inferred from silence, and silence is the only signal available today. `issue.verified_at` and `ticket.reopen_count` are emitted by nothing, so this capability would read a customer going quiet as a customer confirming a fix — reporting live defects as resolved, which is precisely the failure it was authored to prevent. Owns `customer_support.sit.ticket_reopened`, suppressed with it.'
    blocked_on:
      - issue_under_diagnosis
      - ticket_reopened
  customer_support.escalation_and_incident.incident_management:
    kind: blocked_on_l2_type
    reason: 'There is no incident to manage until a named human declares one with a severity, a start time, a blast radius and a commander, and no source emits that. The nearest signal available is a burst of unanswered mail, which arrives late, is proportional to who wrote in rather than who is affected, and prescribes N individual replies — the exact wrong action. Owns `customer_support.sit.major_incident_declared`, suppressed with it.'
    blocked_on:
      - incident_unresolved
      - major_incident_declared
  customer_support.escalation_and_incident.major_incident_communication:
    kind: blocked_on_l2_type
    reason: 'Communicating during an incident needs the clock no incident tool tracks — time since the last customer-facing update, carried separately from time since declaration. An incident can be under control technically and completely silent externally, and the silence is what generates the escalations. `incident_unresolved` is planned and emitted by nothing.'
    blocked_on:
      - incident_unresolved
      - major_incident_declared
  customer_support.escalation_and_incident.postmortem:
    kind: blocked_on_l2_type
    reason: 'A postmortem needs an incident that was declared and then resolved, and neither end of that interval is observable: nothing emits the declaration and nothing records the resolution. A postmortem written from inferred boundaries would document an incident that may never have been called, and would be read as a record of one that was.'
    blocked_on:
      - incident_unresolved
      - major_incident_declared

