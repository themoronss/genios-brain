# Physical goods — offering type under Product.
#
# Shipped, held and consumed goods: apparel, consumables, retail stock, furniture, parts.
# Declares only what differs from customer_support.offering.product.

identity:
  id: customer_support.offering.product.physical_goods
  name: Physical Goods
  kind: offering_type
  domain: customer_support
  parent: customer_support.offering.product
  version: 0.1.0
  status: draft
  stub: false

description: >
  Goods that are picked, shipped, held and consumed. It differs from hardware in that the item
  is not diagnosed, it is replaced — nobody troubleshoots a jumper — and it differs from every
  other offering in this tree in that most contacts are not about the product at all. "Where is
  my order" is the dominant intent by a wide margin, and it is a question about a carrier's
  network, answered out of a tracking system we do not own, concerning an exception we did not
  cause and cannot correct.
  That is the worst structural position support can occupy: we own the relationship and none of
  the control. The customer holds us responsible, entirely correctly, because they bought from
  us and have never heard of the third party involved. Our only unilateral levers are reship
  and refund, and both cost goods rather than minutes, which is why cost-to-serve in this
  offering is measured in units and margin rather than in handle time.
  Volume is seasonal to the point of violence and is driven by events outside the company
  altogether — weather, a carrier disruption, a promotion, a peak trading week. Capacity planned
  against an annual average is wrong on every single day of the year, in one direction or the
  other.
  The habit to unlearn on arrival from software support is waiting for certainty before
  answering. A stalled delivery scan has no diagnosis coming; the information the carrier will
  give us in four days is already the information we have now, and a proactive message sent the
  hour the scan stops deflects more contacts than any article ever written for this business.

characteristics:
  delivery: "picked, packed and carried to an address by a third party we contract but do not control"
  pricing_shape: "one-off transactional purchase, frequently low value, sometimes a replenishment subscription"
  margin_profile: "thin unit margin — a single reship or refund erases the margin on several other orders, which means an agent choosing between waiting, reshipping and refunding is making a direct P&L decision in about ninety seconds with no finance training"
  post_sale_load: "concentrated in the delivery window and then again in the returns window, with almost nothing in between"
  support_load: "dominated by order status and delivery exceptions rather than product faults. Violently seasonal, with peak weeks running at several times baseline, and spiky on inputs nobody in the company scheduled: weather, carrier failures, and our own marketing"
  resolution_locus: "a warehouse, a carrier or the refund ledger — third parties whose relationship we own and whose behaviour we cannot influence inside the life of one ticket. Where the goods themselves are faulty the locus is a supplier, which is slower still and equally out of reach"
  notes: >
    Returns are a second support motion hiding inside this one. They have their own clock, their
    own fraud surface and their own emotional register, and organisations that route them into
    the ordinary queue discover that a return conversation and a delivery conversation need
    opposite defaults about giving the customer the benefit of the doubt.

capabilities:
  deactivates:
    # There is no engineering to hand off to. The party who can act on a damaged batch or a bad
    # carrier lane is a supplier, a warehouse or a logistics manager, and none of them accept a
    # bug report or work a backlog. Leaving this capability on routes the most important
    # escalations of the year at an organisation that does not exist.
    - customer_support.escalation_and_incident.engineering_handoff

  emphasises:
    # The single highest-yield act in this offering is telling the customer before they ask.
    - customer_support.customer_communication.proactive_status_updates
    - customer_support.customer_communication.expectation_setting
    # Order tracking is the most effective self-service surface in any consumer business, and
    # the one most often buried behind a login the guest checkout never created.
    - customer_support.knowledge_and_deflection.self_service_deflection
    - customer_support.intake_and_triage.intent_classification
    - customer_support.intake_and_triage.channel_intake
    # Seasonality is the operations problem, and it is forecastable to a degree that would
    # embarrass most support functions if they measured it.
    - customer_support.support_operations.capacity_planning
    - customer_support.support_operations.workload_balancing
    - customer_support.support_operations.queue_management
    # Consumer volume, consumer disappointment, and a public review as the escalation path.
    - customer_support.customer_communication.de_escalation
    - customer_support.customer_communication.tone_and_localization

objects:
  extends:
    - object: customer_support.obj.core.ticket
      require_properties: [intent_ref, external_ref]
      note: >
        `external_ref` is the order number, and a contact without one cannot be answered at all
        — which makes capturing it an intake problem rather than a triage problem, and moves the
        cost of missing it to the very front of the queue. `intent_ref` matters because an
        order-status contact is not a support case: putting a diagnostic workflow on a logistics
        question wastes the agent's time and reads to the customer as evasion.
    - object: customer_support.obj.core.customer_sentiment
      require_properties: [broken_promise_count, trajectory]
      note: >
        Delivery promises are made in public, dated, and broken visibly. Sentiment in this
        offering is almost entirely a function of how many times a stated date has moved, not of
        how the messages were worded, and a sentiment read that ignores the promise ledger will
        keep scoring a polite third apology as a neutral conversation.
    - object: customer_support.obj.core.commitment
      note: >
        Worth noting even though the object is not authored yet: the commitment in this offering
        is frequently one we did not make. A carrier's estimated delivery date is quoted to the
        customer by our own storefront, becomes a promise in their mind, and is then missed by
        somebody else. Any commitment model here needs to distinguish a promise we control from
        a promise we merely displayed.

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  notes: >
    The parent family's emphasis on root cause analysis is inherited and is genuinely useful
    here, but it points somewhere unfamiliar: the recurring root causes in this offering are
    packaging, a specific carrier lane and a listing that oversells sizing, none of which any
    support tool models. Expect the aggregate to be right and the field to record it in to be
    missing.
