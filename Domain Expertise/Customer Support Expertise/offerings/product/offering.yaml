# Product — offering family node.
#
# INHERITANCE: an offering file declares a DIFF and never a copy. Capability and object files
# are not duplicated into this branch; resolution is type -> family -> canonical.
#
# The question this tree exists to answer, for support specifically, is: WHERE DOES A FIX LAND?
# Everything else about an offering — its price, its packaging, its sales motion — leaves the
# support job broadly unchanged. That one property changes it completely. For the product
# family the answer is "in the artefact", and the four types below exist because the artefact
# is reachable in four incompatible ways.

identity:
  id: customer_support.offering.product
  name: Product
  kind: offering_family
  domain: customer_support
  parent: null
  version: 0.1.0
  status: draft
  stub: false

description: >
  Something built once and sold many times. The support consequence of "many times" is that
  demand is a population rather than a series of individuals: the same defect arrives from
  forty customers who have never met, and the fortieth ticket carries no information the first
  one did not. That makes the aggregate — not the ticket — the unit of intelligence, and it
  makes a fix an asset. Labour spent once retires a whole class of future contact, so the
  marginal cost of the forty-first resolution is zero and the economics reward elimination over
  service quality. This is the only offering family where the correct long-run goal of a
  support organisation is to receive less work.
  The habit an operator carries in from services and gets punished for is treating each ticket
  as bespoke and answering it beautifully in private. Forty excellent private answers is a
  failure that looks exactly like excellent work on every dashboard: the article was never
  written, the issue was never filed, nothing was routed to whoever could make it stop, and
  next month it is eighty.

characteristics:
  delivery: "the identical artefact reaches every buyer; value sits in possession or in use rather than in an engagement"
  pricing_shape: "recurring subscription, per-unit purchase or licence — priced per copy, never per hour"
  margin_profile: "high gross margin with support as the dominant variable cost, which is why cost-to-serve is a board-level number here and a rounding error in services"
  post_sale_load: "value is consumed continuously after purchase, so the relationship is never finished and there is no point at which the revenue is safe"
  support_load: "correlated across the install base and event-driven — one bad release, one expired certificate, one changed third-party API turns a queue into a spike within the hour. Steady-state volume tracks active users, not revenue, which is why the cheapest segment is usually the loudest"
  resolution_locus: "the artefact itself in the general case — but WHICH artefact and who is permitted to touch it is exactly what separates the four types below. A fix we deploy, a fix we put in a van, a fix the customer must install and a fix that is really a refund are four different jobs wearing one word"
  notes: >
    The commercially useful test for whether something is a product in the support sense is not
    how it is priced but whether the fix is reusable. Software billed per hour is still a
    product to support if the same code change helps the next customer.

capabilities:
  emphasises:
    # A product queue's most valuable act is recognising that this contact is not new. Every
    # capability below exists to turn many identical tickets into one piece of work.
    - customer_support.intake_and_triage.duplicate_and_merge
    - customer_support.diagnosis_and_resolution.root_cause_analysis
    - customer_support.voice_of_customer.product_feedback_routing
    # Deflection is only rational when the same question genuinely recurs. It does here, and it
    # does not in most of the service tree — which is why these are emphasised in exactly one
    # branch of this file and switched off in parts of the other.
    - customer_support.knowledge_and_deflection.knowledge_authoring
    - customer_support.knowledge_and_deflection.self_service_deflection
    - customer_support.knowledge_and_deflection.content_gap_analysis
    # Correlated failure is normal here rather than exceptional, so the incident path is a
    # volume path.
    - customer_support.escalation_and_incident.incident_management
    # The aggregate is the product of the support function, not a report about it.
    - customer_support.support_operations.support_analytics
    - customer_support.support_operations.cost_to_serve

objects:
  extends:
    - object: customer_support.obj.core.ticket
      require_properties: [issue_ref, product_area_ref]
      note: >
        A product ticket that does not link to an underlying issue and a product area cannot be
        aggregated, and an unaggregatable product queue can answer "how busy are we" but never
        "what should we fix". These two fields are what make the sentence "forty customers hit
        this" expressible at all; without them every report is a fresh surprise and the backlog
        is ordered by whoever complained most recently.
    - object: customer_support.obj.core.knowledge_article
      require_properties: [intent_covered, accuracy_state, verified_against_version]
      note: >
        Products move. An article that was correct against last quarter's build and is still
        being served confidently is worse than no article, because it converts a customer who
        was about to succeed into a customer who followed our instructions and failed. The
        version it was verified against is therefore not metadata here, it is the article's
        expiry date.
    - object: customer_support.obj.core.incident
      require_properties: [blast_radius, is_customer_visible]
      note: >
        In a product business the first question of an incident is not how broken it is but how
        many people can see it broken. Blast radius decides whether this is a queue event or a
        broadcast event, and those two have opposite correct first actions.

metadata:
  owner: Customer Support
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  notes: >
    No deactivations at this level. Every canonical capability has a real referent in a product
    business; the differences are all differences of weight, and the honest place to record a
    weight difference is `emphasises`. The deactivations in this tree live in the service and
    digital-product branches, where capabilities genuinely have nothing to point at.
