# Moved from Sales' investor relations with a new id (STEP-11 M30.C6.L-data.V1.U01).
identity:
  id: founder_office.heu.investor_relations.investors_do_not_chase
  name: Investors do not chase
  kind: heuristic
  domain: founder_office
  scope: capability
  owner_capability: founder_office.fundraising.investor_relations
  subdomain: fundraising
  version: 1.0.0
  status: draft
  aliases:
    - Silence is not neutral in a raise

purpose:
  statement: >-
    Corrects the reflex a seller brings to a quiet thread. In a deal, a buyer who wants the product will
    eventually surface; in a raise, the counterparty has no such incentive and attrition costs it
    nothing. So a conversation waiting on the founder does not stall visibly — it disappears, without
    ever producing a signal that anything went wrong.
  answers:
    - Whose silence should worry me — theirs or mine?
    - Is a quiet investor thread evidence of anything?

heuristic:
  statement: >-
    When the turn is ours, the clock is running against us and nobody will say so. Age the conversations
    where we owe the reply before the ones where they do.
  why: >-
    A fund sees far more companies than it can fund — one partner described 500 to 800 plans a year for
    one or two deals done (David Hornik, quoted by Paul Graham) — and loses nothing by dropping one. A
    partial reply left unanswered reads to it as a company that lost momentum, the one attribute a raise
    cannot afford to project. The asymmetry is structural: our silence is informative to them; theirs,
    before the stage says otherwise, is not informative to us.
  confidence_bp: 7500
  applies_when: >-
    The last message came from the investing party, and something was asked or offered in it.
  breaks_down_when: >-
    Three regimes. A deliberate hold — waiting for a metric or a lead before replying — looks identical
    from the correspondence and is often correct. A courtesy close leaves the turn nominally ours with
    nothing owed. And where a programme's application window is running, the programme's own deadline
    outranks the turn; that clock belongs to the programmes capability.
  reads:
    - thread.ball_in_court
    - thread.last_inbound
    - derived.engagement
    - founder_office.obj.investor_relations.investor_conversation

objects_used:
  - founder_office.obj.investor_relations.investor_conversation
  - founder_office.obj.core.company

outcomes:
  - >-
    Conversations waiting on us sort above conversations waiting on them, which is the reverse of the
    sales default.
  - >-
    Ball-in-court age becomes the primary number on the set, rather than days since contact.

failure_modes:
  - >-
    Reading it as a mandate to reply at once with nothing to say. A fast empty reply spends the turn
    without moving anything.
  - >-
    Applying it to a courtesy close, which produces a chase where no answer was ever expected.

limits:
  - >-
    It is a statement about whose turn it is, not about whether the investor is interested. A prompt
    reply to an investor who has already decided changes nothing.

metrics:
  - name: ball_in_our_court_age
    unit: days
    direction: lower_is_better
    description: Age of the oldest conversation waiting on us.

references:
  - title: A Fundraising Survival Guide
    kind: practitioner
    author: Paul Graham
    url: https://paulgraham.com/fundraising.html
    note: >-
      August 2008. David Hornik (August Capital): "500 to 800 plans received and read, somewhere between
      50 and 100 initial 1 hour meetings held ... 1 to 2 deals done in a year."

metadata:
  owner: Founder Office
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-10-09"
  review_status: unreviewed
  confidence: experimental
  completeness: complete
  notes: >
    Moved from Sales' investor relations, where it was a draft approved by Harsh on 2026-08-25. New id,
    so it is unreviewed here until the founder accepts it (`06` D45). The "fund sees far more companies
    than it can fund" claim now names its source.
