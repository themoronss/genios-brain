map:
  investor_relationship:
    situations:
      - founder_office.sit.live_investor_relationship
    capabilities:
      - founder_office.fundraising.investor_relations
    objects:
      load:
        - founder_office.obj.core.company
        - founder_office.obj.investor_relations.investor_conversation
      optional:
        - founder_office.obj.core.contact
        - founder_office.obj.core.next_action
        - founder_office.obj.core.risk

