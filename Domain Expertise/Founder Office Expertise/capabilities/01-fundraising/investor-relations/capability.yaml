  notes: >
    Moved from Sales' investor relations capability (`10-investor-relations`, admitted there on
    2026-08-25) and re-identified; moving it changes its ids and its content hash, so it is
    re-reviewed by the founder line by line before it is admitted here (`06` D45). The description,
    the question, the outcomes, the failure modes and the KPIs are carried over and rewritten only
    where they were true of their old home; the stages, the moves and three of the five heuristics
    are new. Programme doctrine ("cohort deadlines that do not move") now points at the Founder
    Office's own programmes capability. No numbers here: the typical durations live in the spine
    playbook, each with its source.
