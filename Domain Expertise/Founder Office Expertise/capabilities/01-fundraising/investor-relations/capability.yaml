# Investor relations — moved from Sales' `10-investor-relations` (STEP-11 M30.C6.L-data.V1.U01),
# re-identified, and deepened into the Founder Office's fundraising capability.
#
# WHY IT LIVES HERE. In Sales it was written against the sales reading of itself, because a compiled
# signal could carry authority only in a pack lane the tenant held, and Sales was the lane. That
# reason is gone (`packs/wiring._corpus_packs` gives every authored corpus its own lane), and the
# reading it had to refuse is gone with it: an investor is not a customer, so the doctrine sits beside
# the founder's other work rather than inside a pipeline.
#
# WHAT IS NOT HERE, as before: no thresholds, no scores, no rules (Atlas RULE 06 — those are Layer 4's
# arithmetic). The stages and their typical durations live in the spine playbook,
# `founder_office.pb.investor_relations.run_an_investor_conversation`, each duration a sourced prior.
identity:
  id: founder_office.fundraising.investor_relations
  name: Investor Relations
  domain: founder_office
  subdomain: fundraising
  version: 1.0.0
  status: draft
  stub: false

description: >
  Reading and running the founder's conversations with the people who might fund the company — funds,
  angels, angel networks and syndicates — and with the people who introduce them, from first contact
  to a decision. It lives in the Founder Office because an investor is not a customer, and the
  default reading of an investor thread as a deal is wrong in a specific, expensive way.


  Four things are structurally different from a purchase. The counterparty is not buying a product,
  so there is nothing to demo in the sales sense and no value case to prove. There is no close date
  the founder controls: a fund invests when its own cycle, thesis and partnership say so. "No" is
  usually "not now" with a reopening condition attached, so a pass is a state to schedule against
  rather than an outcome to record and forget. And the whole thing is a PARALLEL process on one shared
  clock: an investor's read of the company is substantially a read of how the round is going, so
  silence is not neutral the way it is in a deal — it is evidence, and what it is evidence of depends
  on the stage the conversation has reached.


  The capability's job is to keep every conversation's real stage and real next move visible, to
  read silence against what is typical for that stage, and to keep the reversible conversations from
  being written off.

question: Where does each investor conversation actually stand, and what does it need from us next?

outcomes:
  - >-
    Each investor conversation placed on the stage list — first contact, first call, partner meeting,
    diligence, term sheet, closed or passed — from the last observable event rather than from how
    warm the last email felt, and `unknown` where nothing establishes it.
  - >-
    Ball-in-court named per investor, with the asymmetry stated. Investors do not chase: where the
    turn is ours and has been for a while, that is the finding, and it is nearly always the cheapest
    thing on the list to fix.
  - >-
    A pass recorded WITH its reason and its reopening condition, or with an explicit statement that
    none was given. "Passed" alone destroys the information: the next round, the next fund and the
    partner who liked the company all remain live and all become invisible.
  - >-
    Accelerator, incubator and programme applications kept apart from fund conversations and handed
    to `founder_office.programs_and_applications.program_applications`. They run on cohort deadlines
    that do not move, so the correct action is calendar-shaped, not persuasion-shaped.
  - >-
    The relationships worth keeping warm while NOT raising named as such. Most investor relationships
    are dormant most of the time, and that is their healthy state rather than a lapse.
  - >-
    An explicit verdict per investor — advance it, re-approach at a stated trigger, or let it rest.
    "Keep warm" is not a verdict; it is what gets written when nobody decided.

failure_modes:
  - >-
    Reading the relationship as a deal. Everything that follows from that reading is wrong: a
    stalled-deal frame on a fund that is simply between partner meetings, a "closed lost" on a pass
    that invited a return, urgency aimed at a party that has no reason to feel it.
  - >-
    Treating a pass as terminal. Many passes are on stage, timing or traction rather than on the
    company itself, and those carry their own dates; filing them as verdicts discards what Paul Graham
    calls "some of your warmest leads for future fundraising".
  - >-
    Mistaking activity for progress. A raise produces a great deal of pleasant correspondence, and
    "investors habitually seem more positive than they are" (Graham). The measure is whether the
    process moved — a partner meeting booked, diligence opened, an offer with terms — not whether the
    last email was friendly.
  - >-
    Single-threading a fund. The associate who sourced the company cannot fund it, and a conversation
    that never reaches a partner converts at approximately nothing however well it reads.
  - >-
    Running the round in sequence. Talking to investors one at a time removes the only real source of
    momentum and hands each of them an indefinite option, at the founder's expense.
  - >-
    Letting the wrong parties into the set — a connector filed as an investor, an introduction bot, a
    newsletter, a portfolio-operations address, the company's own domain. Each needs a different
    move or none, and each costs attention every time the set is reviewed.

kpis:
  - name: investor_state_coverage
    unit: percent
    direction: higher_is_better
    description: >-
      Share of active investor conversations carrying a stage newer than their last inbound. The
      floor: a set of conversations nobody can place is not being run, whatever the founder's
      confidence about it.
  - name: ball_in_our_court_age
    unit: days
    direction: lower_is_better
    description: >-
      Age of the oldest conversation waiting on us. The most actionable number here, because the
      counterparty will not produce it — an investor who is waiting simply stops appearing.
  - name: stage_dwell_past_prior
    unit: percent
    direction: lower_is_better
    description: >-
      Share of live conversations that have sat in their stage longer than the stage's typical
      duration on the spine. A conversation past its stage's prior has usually been decided by the
      investor and not yet told to the founder.
  - name: reopening_conditions_captured
    unit: percent
    direction: higher_is_better
    description: >-
      Share of passes recorded with the condition under which the investor invited a return.
      Measures whether the reversible half of the set survives being written down.
  - name: partner_reach_rate
    unit: percent
    direction: higher_is_better
    description: >-
      Share of live fund conversations that have reached someone with a cheque decision. Everything
      below it is sourcing.
  - name: dormant_revival_rate
    unit: percent
    direction: higher_is_better
    description: >-
      Share of re-approaches at a stated trigger that produce a meeting. Calibrates whether the
      reopening conditions being captured are real ones or politeness recorded as a plan.

handoffs:
  # Founder Office capabilities only. An investor introduction is a networking act before it is a
  # conversation; a booked investor call is an external meeting to prepare for and follow through;
  # a programme application runs beside a raise on its own calendar.
  upstream:
    - founder_office.networking_and_intros.introductions
  downstream:
    - founder_office.meetings.external_meetings
  parallel:
    - founder_office.programs_and_applications.program_applications

