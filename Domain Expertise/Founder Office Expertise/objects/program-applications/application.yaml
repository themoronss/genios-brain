metadata:
  owner: Founder Office
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-10-09"
  review_status: unreviewed
  confidence: experimental
  completeness: partial
  notes: >
    Eight executable patterns, four blocked. Every executable one reads correspondence — whose turn, a
    stated date, a request, a meeting, a pass, a deferral, a long quiet; every blocked one would say what
    the application is. Relationships to the domain's core objects join when those objects land.
