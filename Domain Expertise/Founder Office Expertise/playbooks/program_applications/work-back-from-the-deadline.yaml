  reviewed_by: ""
  last_updated: "2026-10-09"
  review_status: unreviewed
  confidence: experimental
  completeness: partial
  notes: >
    The outcome window (14) is practitioner judgement, unverified; for the founder's review. Every rule
    quoted is the programme's own, read on 9 October 2026, and changes with each intake.
