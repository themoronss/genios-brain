# Outsourced — model branch node.
#
# INHERITANCE: this file declares only what DIFFERS from its parent. Capability and object
# files are NOT copied into this branch; resolution is vertical -> model -> canonical.

identity:
  id: admin.model.outsourced
  name: Outsourced
  kind: model
  domain: admin
  parent: null
  version: 0.1.0
  status: draft
  stub: false

description: >
  Administrative work performed by an external provider under contract. The internal function
  stops doing the work and starts governing it, which is a different capability set — the
  failure mode moves from capacity to contract.

characteristics:
  typical_cycle_days: 5
  committee_size: "2-4 approvers across both organisations"
  decision_style: "contractual; anything outside the statement of work is a change request"
  primary_channels: [portal, email, scheduled_review]

capabilities:
  emphasises:
    - admin.contract_and_vendor.vendor_performance_management
    - admin.contract_and_vendor.contract_administration
    - admin.admin_operations.service_level_management

metadata:
  owner: Admin
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: experimental
