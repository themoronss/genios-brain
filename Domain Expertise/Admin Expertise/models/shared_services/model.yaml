description: >
  A centralised internal centre serving several business units through a request queue and
  published service levels. Work becomes measurable and repeatable; the cost is distance from
  the context in which the request was raised.

characteristics:
  typical_cycle_days: 3
  committee_size: "2-3 approvers, threshold-driven"
  decision_style: "ticket-driven, procedure before judgement"
  primary_channels: [portal, email, chat]

capabilities:
  emphasises:
    - admin.admin_operations.request_intake
    - admin.admin_operations.service_level_management
    - admin.admin_operations.sop_management
    - admin.admin_operations.admin_analytics

