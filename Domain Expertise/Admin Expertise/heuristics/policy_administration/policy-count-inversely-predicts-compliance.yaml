identity:
  id: admin.heu.policy_administration.policy_count_inversely_predicts_compliance
  name: Policy count inversely predicts compliance
  kind: heuristic
  domain: admin
  scope: capability
  owner_capability: admin.compliance_and_governance.policy_administration
  subdomain: compliance_and_governance
  version: 1.0.0
  status: draft
purpose:
  statement: Beyond a small set, each additional policy reduces attention to all of them. The compliance-maximising
    move is often deleting policies, not adding them.
  answers:
  - Does more policy mean more compliance?

heuristic:
  statement: >
    Beyond a small set, each additional policy reduces attention to all of them. The
    compliance-maximising move is often deleting a policy, not adding one.
  why: >
    Attention is the binding constraint, not coverage. Nobody reads twenty policies; they read the
    three they were told matter and skim-acknowledge the rest, which means every addition past that
    point converts a read policy into an unread one somewhere else. The organisation gets more
    written commitments and less actual compliance, and the metric it watches — coverage — improves
    throughout.
  confidence_bp: 7500
  applies_when: A general workforce population expected to know and apply the policies themselves.
  breaks_down_when: >
    The policies are reference material consulted at a decision point rather than knowledge carried
    around — a treasury limits schedule, a delegation matrix, a clinical protocol. Those are looked
    up, not remembered, and their number costs almost nothing. It also breaks down where the set is
    externally mandated: deleting a required policy to improve attention is a finding, and the real
    move there is to separate the required set from the read set rather than to shrink either.
  reads: [admin.obj.core.policy]
  contradicts: [admin.heu.document_control.authority_needs_maintenance]
limits:
- 'It is about attention, not about risk coverage. Some risks require a policy nobody will read.'
- 'The threshold is unstated on purpose — it varies by population and by how much of the job the policy touches.'
failure_modes:
- 'Used to delete a mandated policy, converting an attention problem into a compliance finding.'
- 'Applied to reference schedules, where volume is not a cost.'
variants:
- applies_to: regulated
  change: The mandated set is fixed; the discretion is in what else is added beside it.
  why: You cannot shrink the floor, only refrain from building on it.
- applies_to: startup_lean
  change: Strongest form. Three policies genuinely known beats fifteen inherited from a template.
  why: There is no compliance function to carry the unread set.
references:
- title: ISO 9001 — control of documented information
  kind: standard

metadata:
  owner: Admin
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  completeness: complete
  notes: >
    contradicts authority-needs-maintenance because that heuristic adds a maintenance obligation
    per document while this one argues for the smallest set. Read together they say the only
    defensible position: few policies, genuinely maintained.
