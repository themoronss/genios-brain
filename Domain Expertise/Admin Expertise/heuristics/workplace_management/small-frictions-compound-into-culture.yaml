identity:
  id: admin.heu.workplace_management.small_frictions_compound_into_culture
  name: Small frictions compound into culture
  kind: heuristic
  domain: admin
  scope: capability
  owner_capability: admin.facilities_and_assets.workplace_management
  subdomain: facilities_and_assets
  version: 1.0.0
  status: draft
purpose:
  statement: Broken chairs, dead markers, unbookable rooms — individually trivial, collectively they say
    'nobody cares here'. Workplace upkeep is culture maintenance in physical form.
  answers:
  - Why sweat small workplace issues?

heuristic:
  statement: >
    Broken chairs, dead markers, unbookable rooms — individually trivial, collectively they say
    "nobody cares here". Workplace upkeep is culture maintenance in physical form.
  why: >
    People infer intent from environment because it is the only continuously available evidence
    about how the organisation treats them. Nobody concludes anything from one broken chair; the
    conclusion comes from the accumulation and from how long each thing stayed broken, which reads
    as a statement about whether anyone is paying attention. It is also self-reinforcing: in an
    environment where things stay broken, reporting them feels pointless, so fewer are reported and
    more stay broken.
  confidence_bp: 7500
  applies_when: A shared physical workplace people attend regularly.
  breaks_down_when: >
    The organisation is visibly under strain and everybody knows it. In a genuine cash crisis,
    spending on the environment reads as misjudged priorities rather than as care, and the same
    broken chair is interpreted entirely differently. It also breaks down where upkeep substitutes
    for the substantive thing: an immaculate office at a company that has not given a pay rise in
    three years is read as a deflection, and correctly.
  reads: [admin.obj.core.request, admin.obj.core.asset]
  contradicts: [admin.heu.maintenance_coordination.deferred_maintenance_is_borrowing]
limits:
- 'It concerns the aggregate and the duration, not any individual item.'
- 'The effect is invisible in every metric the function reports, which is why it loses budget arguments.'
failure_modes:
- 'Used to justify visible spend in public areas, which is the exact inversion — attention should follow usage.'
- 'Cited as a culture intervention in place of addressing what is actually wrong.'
variants:
- applies_to: distributed
  change: Transfers almost entirely to equipment and responsiveness; a delayed laptop replacement is the distributed broken chair.
  why: The environment is the tooling.
- applies_to: startup_lean
  change: Weaker on polish and stronger on responsiveness — nobody expects a good chair, everybody notices whether the request was answered.
  why: Expectations are set by the stage and attention is not.
references:
- title: Workplace services practice
  kind: practitioner

metadata:
  owner: Admin
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  completeness: complete
  notes: >
    The second breakdown case is the honest limit: an immaculate office at a company that has
    not given a pay rise in three years reads as deflection, and the heuristic is being used to
    buy a feeling rather than to remove friction.
