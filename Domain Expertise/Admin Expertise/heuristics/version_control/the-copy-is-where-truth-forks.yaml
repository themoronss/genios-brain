identity:
  id: admin.heu.version_control.the_copy_is_where_truth_forks
  name: The copy is where truth forks
  kind: heuristic
  domain: admin
  scope: capability
  owner_capability: admin.records_and_documentation.version_control
  subdomain: records_and_documentation
  version: 1.0.0
  status: draft
purpose:
  statement: Every 'let me just save a copy' creates a potential parallel truth. Convenience copies of
    canonical documents are future disputes with timestamps.
  answers:
  - Why do document conflicts happen in careful teams?

heuristic:
  statement: >
    Every "let me just save a copy" creates a potential parallel truth. Convenience copies of
    canonical documents are future disputes with timestamps on them.
  why: >
    A copy is made for a good reason — to annotate, to work offline, to send without granting access
    — and at the moment of copying it is identical, so the risk is invisible. Divergence happens
    later and asymmetrically: the canonical version is updated and the copy is not, or the copy is
    edited and never merged back. Nobody experiences the fork; they experience two people quoting
    different numbers months afterwards, which reads as a disagreement rather than as a document
    incident, so the cause is almost never traced.
  confidence_bp: 8000
  applies_when: Any document that binds and that more than one person acts on.
  breaks_down_when: >
    The copy is a deliberate snapshot with a stated purpose — the version attached to a signed
    agreement, the pack circulated for a specific board meeting, the export given to an auditor.
    Those must not track the canonical version, and treating them as forks to be reconciled corrupts
    the record they exist to freeze. It also breaks down where the system genuinely has no copies —
    a single shared editable document with real version history has no fork to prevent, and applying
    copy-hygiene there is ceremony.
  reads: [admin.obj.core.document, admin.obj.core.contract]
  contradicts: [admin.heu.filing_and_retrieval.search_does_not_replace_structure]
limits:
- 'It concerns canonical documents. Copies of working material are how work gets done.'
- 'It has no detection mechanism — copies are invisible to every system that matters, which is why the playbook step is a hunt rather than a query.'
failure_modes:
- 'Applied to snapshots, which destroys frozen records that were correct to freeze.'
- 'Used to forbid copying rather than to label it, which pushes the copies out of the estate entirely.'
variants:
- applies_to: multi_entity
  change: Strongest form — the same policy exists per entity with local amendments, and the fork is intentional and undocumented.
  why: Local variation is legitimate and looks identical to drift.
- applies_to: startup_lean
  change: Weaker, until the first person leaves holding the only annotated copy.
  why: Small teams share context verbally, and the fork surfaces on departure.
references:
- title: ISO 9001 — control of documented information
  kind: standard

metadata:
  owner: Admin
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  completeness: complete
  notes: >
    The first breakdown case is the one practitioners need: deliberate snapshots — the pack sent
    to a board, the export handed to an auditor — must NOT track the canonical version, and a
    copy-hygiene sweep that reconciles them corrupts the record they existed to freeze.
