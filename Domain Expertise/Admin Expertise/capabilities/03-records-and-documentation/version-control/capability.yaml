description: 'Keeping a defensible history of a document: sequential versions, a visible change record,
  superseded copies withdrawn rather than left in place, and the current version unambiguous. Most damaging
  document errors are not lost files — they are the previous version, still circulating.

  '
question: Which version is authoritative, and what changed between them?
