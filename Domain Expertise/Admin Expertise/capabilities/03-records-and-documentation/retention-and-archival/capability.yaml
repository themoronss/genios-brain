description: 'Applying the retention schedule: what is kept, for how long, where it goes when it leaves
  active use, and what must be defensibly destroyed. Retention has two failure modes with opposite consequences
  — discarding something a regulator will ask for, and keeping personal data past the point we were allowed
  to.

  '
question: How long must we keep this, and when are we obliged to destroy it?
