description: >
  Moving a decision through the people who are allowed to make it. The work is routing against
  real authority rather than against the org chart, sequencing approvers so a rejection at the
  end does not waste the queue, and knowing the difference between an approval that is pending
  and one that is stuck. Most administrative delay is one unchased approver.

question: "Who must sign this, in what order, and where exactly is it stuck?"

