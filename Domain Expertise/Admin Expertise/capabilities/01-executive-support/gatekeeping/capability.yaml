description: >
  Deciding what reaches a scarce person and what is answered, redirected, deferred or declined
  on their behalf. Gatekeeping fails in two directions and only one of them is visible:
  letting noise through is obvious, while filtering out the message that mattered is
  discovered weeks later by someone else.

question: "Does this deserve the principal's attention, or someone else's?"

