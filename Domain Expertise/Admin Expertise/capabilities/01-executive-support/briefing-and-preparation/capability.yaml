description: >
  Assembling the minimum sufficient context before a meeting, a call or a decision: who is in
  the room and what they want, what was last said to them, what is outstanding on both sides,
  and the one thing that would embarrass us if it were not known. A brief that restates the
  agenda is not a brief.

question: "Will the principal walk into this knowing what they need to know?"

