# THE OTHER HALF, AND IT IS REACHABLE NOW.
#
# This is founder surface 14 stated exactly: a condition someone set four months ago is now met.
# It routed NOTHING until `condition_satisfied` existed, and this file said so — "binding to
# `admin_contact` would produce a card asserting that something became true, the one claim this
# capability is forbidden to make on evidence it does not have". That was the correct state and
# it is no longer the state.
#
# `correlation_timeline` had computed the satisfaction all along. `_satisfied_json` writes BOTH
# evidence spans side by side and `SatisfiedCondition.__post_init__` refuses to construct with
# only one of them — "the card has to show the sentence from May, and a claim with no receipt is
# a guess". The fact was published every sweep and nothing read it;
# `condition_situations.read_conditions_satisfied` is the reading that does, and
# `domain_spec` maps the `condition_met` anchor onto this type.
#
# The three things this file demanded of the emitter all arrive: the original condition text
# (`condition.text`, with the counterparty's own sentence in `condition.quote`), the satisfying
# evidence (`condition.satisfied_by`), and a certainty tier (`condition.strength_bp`, with
# `condition.stale` below the correlator's freshness floor).

identity:
  id: admin.sit.condition_now_satisfied
  name: Condition Now Satisfied
  domain: admin
  owner_capability: admin.executive_support.opportunity_tracking
  version: 1.0.0
  status: stable

description: >
  A condition a counterparty attached to a future move has been observed to hold. They said they
  would act once something were true; that thing is now on the record as true, and the record says
  which piece of evidence made it so and how certain that reading is.

  The signal must carry three things or it is not usable: the original conditional sentence, the
  evidence that satisfies it, and a certainty. A satisfaction with no evidence cannot be written
  into a message, which is the only act this situation exists to enable — and a satisfaction with
  no certainty cannot be gated, so every one would be treated as definite and the first wrong one
  would cost more than the rest earned.

  The two failure modes are named here because they are properties of the DETECTION and must be
  designed for upstream, not filtered downstream. The first is the rhetorical condition: "come
  back when you are the market leader" is a decline in a condition's clothes, and it will satisfy
  eventually and must never fire. The second is the already-handled case: the founder saw it,
  acted offline, and the system did not. A dismissal there is a coverage signal, not a wrong
  reading, and recording it as an error teaches the system to stop surfacing the thing it got
  right.

matches:
  l2_situation_types:
    - condition_satisfied
  scope: person
  when:
    # The counterparty's own sentence. `SatisfiedCondition` refuses to exist without it, so a row
    # that reached the graph has one — requiring it here is a second lock on the same door rather
    # than a new judgement, and a satisfaction nobody can quote is not a card.
    - exists: condition.quote
    # And what made it true. Asserting "their condition is met" without naming the thing that met
    # it is the claim this capability is forbidden to make.
    - exists: condition.satisfied_by

also_serves:
  - admin.executive_support.commitment_tracking
  - admin.executive_support.briefing_and_preparation

objects:
  load:
    - admin.obj.core.commitment
    - admin.obj.core.request
  optional:
    - admin.obj.core.deadline
  never_load:
    - admin.obj.core.invoice
    - admin.obj.core.employee_record
    - admin.obj.core.asset

priority_bp: 8200
typical_duration_days: 5

signals_of_progress:
  - positive_reply
  - meeting_scheduled
  - next_step_agreed

signals_of_decay:
  - pass_received
  - going_dark

render:
  artifact_kind: draft_reply
  render_hint: >
    Headline: whose condition it was, and that it is now met. Name the person — the whole value of
    this card is that somebody said "once X, then Y" months ago and X has quietly happened.

    Situation: quote their condition back first, then say what satisfied it. Both halves are on the
    record — `correlation_timeline` refuses to write this fact without BOTH evidence spans — so the
    card can show the sentence from months ago and the thing that made it true, and a reader can
    check each. `condition.waited_days` is how long the condition sat before the world met it;
    `condition.days_since_satisfied` is how long it has been true with nobody acting. The second is
    the urgent number.

    Never say we have told them, and never imply the next move has been made. Nothing in this
    system observes that anybody went back about a condition coming true, which is why
    `condition.counterparty_informed` is declared missing — the one thing a reader most wants to
    know is not on the record, and guessing it is how a card tells somebody a job is already done.

    Never present a stale satisfaction as fresh: where `condition.stale` is true, say the
    satisfying evidence is old rather than dropping the card.

    Artifact: the message that goes back to them now, saying the thing they were waiting for has
    happened — not a status note about it.
  fallback:
    headline: "{entity} — the condition they set is now met"
    situation: >-
      {entity} said it depended on something, and that has since happened. Nothing has gone back
      to them about it.

metadata:
  owner: Admin
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-09-07'
  review_status: approved
  confidence: experimental
  reviewed_at: '2026-09-07'
  notes: >
    THE `render` BLOCK WAS ADDED WHEN ITS OWN PRECONDITION EXPIRED. This file shipped without one
    and said why: "a situation that routes nothing has no card to write, and authoring the copy now
    would mean reviewing words against a signal whose shape is not yet fixed — the review would be
    of a guess". Both halves of that have since changed. `domain_spec` binds the `condition_met`
    anchor to this type, so it routes; and `condition_situations.read_conditions_satisfied` fixes
    the signal's shape — every slot below is a fact it actually emits.

    Leaving it empty had become the more dangerous state. `card_builder` takes
    `capability_render` from this block and falls through to the tenant pack when it is absent;
    no pack authors `condition_satisfied`, so the lookup returned {} — an empty headline — and
    `CardStore` refuses a card with no headline. The highest-priority situation in this corpus
    was routing and could not reach a reader.

    `condition_satisfied` is not yet listed in `_schema/vocabulary.yaml`
    `planned_substrate.l2_situation_types`, so validate.py warns about it. The warning is correct
    and is the census doing its job: the ask is real and belongs on that list in the same commit
    that a Layer 2 owner picks it up.

    The priority is the highest in the Admin corpus for a reason that is also a warning: a
    satisfied condition has the shortest half-life of anything this domain surfaces, because the
    evidence that satisfied it is public and everyone else waiting on the same condition can see
    it too.

