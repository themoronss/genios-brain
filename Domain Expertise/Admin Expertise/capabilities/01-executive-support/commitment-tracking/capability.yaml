description: 'Holding the organisation to its own word. Every promise made in an email, a meeting or a
  corridor has an owner, a recipient and a due date, and the administrative function is the only part
  of the company whose job is to remember all three. Tracking is not reminding: the output is a verdict
  on whether the promise was kept, renegotiated, or silently abandoned.

  '
question: What did we promise, to whom, by when — and has it actually been delivered?
