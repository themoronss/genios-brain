description: >
  Owning the diary as a scarce budget rather than a booking queue: protecting deep work,
  sequencing meetings so preparation is possible, resolving collisions by business
  consequence, and defending the gaps that make the rest of the week survivable. Distinct from
  Meeting Scheduling, which arranges one meeting well; this decides which meetings may exist
  at all.

question: "Is the principal's time going to what actually matters this week?"

