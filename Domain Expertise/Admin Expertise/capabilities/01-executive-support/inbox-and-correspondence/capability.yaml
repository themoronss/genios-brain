description: >
  Running correspondence as a ledger of open obligations rather than a list of unread items:
  separating what needs the principal from what needs anyone, drafting on their behalf, and
  making sure nothing that was promised in writing quietly falls out of view. The inbox is
  where most administrative debt is created and where almost none of it is tracked.

question: "Is every message that needs an answer answered, once, by the right person?"

