description: >
  Owning the policy lifecycle from drafting through approval, publication, acknowledgement and
  periodic review. Administration is the difference between a policy that exists and a policy
  that is in force: an unacknowledged policy is unenforceable, and an unreviewed one drifts
  out of alignment with the law it was written against.

question: "Which policy applies here, is it current, and has the affected population acknowledged it?"

