description: >
  Taking a chosen supplier from selection to operational: due diligence, security and data-
  protection review, banking and tax details, contract execution, and system setup. Onboarding
  is a gate, not a form — the checks exist to be capable of failing, and one that has never
  rejected a vendor is not running.

question: "Is this supplier cleared, contracted and set up to be paid?"

