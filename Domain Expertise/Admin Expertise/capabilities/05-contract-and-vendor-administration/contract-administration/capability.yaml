description: >
  Owning the contract as a live instrument rather than a signed PDF: extracting the
  obligations, dates and notice periods, holding the executed copy, tracking amendments, and
  surfacing the clauses that impose work on us. The signature is where most organisations stop
  paying attention and where the obligations start.

question: "What have we actually agreed, and what does it require us to do and by when?"

