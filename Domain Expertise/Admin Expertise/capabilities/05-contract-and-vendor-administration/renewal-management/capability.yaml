description: >
  Managing the end of the contract term before it manages us. Every agreement has a decision
  date that precedes its expiry by the length of the notice period, and that earlier date is
  the real one. Auto-renewal is the default that costs the most money precisely because it
  requires nobody to do anything.

question: "Which agreements auto-renew, when does the notice window open, and do we still want them?"

