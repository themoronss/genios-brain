# Load-set for admin.contract_and_vendor.vendor_performance_management — REFERENCES ONLY, never an inline object.
#
# core   -> objects/core/                    loaded by more than one capability
# scoped -> objects/vendor-performance-management/loaded by this capability alone
#
# required = a missing one blocks the compile.
# optional = absence lowers confidence rather than blocking (Layer 3 strategy S8) — a
#            situation the compiler cannot fully feed should still produce the answer the
#            requester is waiting on, at a lower confidence, not withhold it.

capability: admin.contract_and_vendor.vendor_performance_management

core:
  required:
    - admin.obj.core.vendor
    - admin.obj.core.contract
  optional:
    - admin.obj.core.escalation
    - admin.obj.core.invoice
    - admin.obj.core.document

scoped:
  required: []
  optional: []
