description: >
  Taking an inbound invoice from receipt to payment-ready: validation against the purchase
  order and receipt, coding to the correct budget line, exception handling and approval
  routing. The discipline is refusal — an invoice that does not match is a query, not a
  payment, and paying it to keep the peace is how duplicate and phantom invoices survive.

question: "Is this invoice valid, matched, coded and approved for payment?"

