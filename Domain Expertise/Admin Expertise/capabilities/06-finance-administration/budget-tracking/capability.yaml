description: >
  Maintaining the administrative view of budget: allocation, committed spend, actuals,
  forecast and variance. The number that matters is not what has been spent but what has been
  committed and not yet invoiced, because that is the amount that surprises people at period
  end.

question: "How much of this budget is genuinely left once commitments are counted?"

