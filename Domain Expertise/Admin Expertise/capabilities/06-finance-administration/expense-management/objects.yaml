# Load-set for admin.finance_administration.expense_management — REFERENCES ONLY, never an inline object.
#
# core   -> objects/core/                    loaded by more than one capability
# scoped -> objects/expense-management/    loaded by this capability alone
#
# required = a missing one blocks the compile.
# optional = absence lowers confidence rather than blocking (Layer 3 strategy S8) — a
#            situation the compiler cannot fully feed should still produce the answer the
#            requester is waiting on, at a lower confidence, not withhold it.

capability: admin.finance_administration.expense_management

core:
  required:
    - admin.obj.core.expense
    - admin.obj.core.policy
  optional:
    - admin.obj.core.approval
    - admin.obj.core.employee_record
    - admin.obj.core.budget_line

scoped:
  required: []
  optional: []
