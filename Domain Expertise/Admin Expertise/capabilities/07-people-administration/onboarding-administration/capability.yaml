description: >
  Everything that must exist before a start date: contract and right-to-work documentation,
  payroll setup, system accounts, equipment, seating, induction and mandatory policy
  acknowledgement. Onboarding is a deadline-driven sequence with a hard external date, and the
  parts that fail are always the ones owned by nobody in particular.

question: "Will this person be able to work on day one, legally and practically?"

