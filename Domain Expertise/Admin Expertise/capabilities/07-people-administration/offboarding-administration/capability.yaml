description: >
  Closing an employment cleanly: access revocation, asset recovery, final pay and
  entitlements, handover of owned work, and record retention. Offboarding is the
  administrative process with the widest blast radius when it is done badly — a live account
  and an unreturned laptop belonging to someone who left is a security incident waiting for a
  date.

question: "Has everything this person held been recovered, revoked, reassigned or handed over?"

