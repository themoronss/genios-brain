description: >
  Granting, reviewing and revoking access across systems and physical space: joiner
  provisioning, role changes, periodic recertification and leaver revocation. Access
  accumulates — the risk is almost never the grant, it is the grant that was never removed
  when the reason for it ended.

question: "Who has access to what, why, and should they still?"

