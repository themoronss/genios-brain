identity:
  id: admin.people_administration.attendance_and_leave
  name: Attendance & Leave
  domain: admin
  subdomain: people_administration
  version: 0.2.0
  status: stable
  stub: false
description: 'Administering absence: leave requests and approvals, entitlement and accrual, sickness recording,
  statutory categories and the coverage implications of each. Leave administration is deceptively legal
  — most categories carry statutory rules that a generic approval workflow will quietly get wrong.

  '
question: Who is off, on what basis, with what entitlement left?

outcomes:
- 'Balances that are rule-derived and visible to the person they belong to. Leave disputes are almost always record disputes.'
- 'Statutory categories recorded as themselves — sickness, parental, bereavement — rather than absorbed into a single leave bucket that loses their legal treatment.'
- 'Coverage implications surfaced with the approval, because approving leave without knowing who is also off is how a team discovers it has nobody.'
- 'Clean payroll handoff, since most leave categories affect pay and the cut-off does not move.'
- 'The negative outcome: chronic NON-TAKERS identified and pushed to take leave. Accrued balance is a liability on the balance sheet and a burnout signal at the same time.'
failure_modes:
- 'ONE BUCKET FOR ALL ABSENCE, which loses statutory treatment and produces the wrong answer at exactly the moment it is examined.'
- 'BALANCES CALCULATED SOMEWHERE THE EMPLOYEE CANNOT SEE, which converts every query into a dispute about arithmetic nobody can check.'
- 'APPROVING WITHOUT LOOKING AT COVERAGE, which is individually correct and collectively how a function ends up empty in August.'
- 'CELEBRATING THE PERSON WHO NEVER TAKES LEAVE. They are a single point of failure fatiguing quietly, and the accrual is growing on the balance sheet.'
- 'MANUAL RE-KEYING INTO PAYROLL, which is where absence data acquires its errors.'
kpis:
- name: balance_dispute_rate
  unit: percent
  description: Leave queries that became disagreements. Almost entirely a function of visibility.
  direction: lower_is_better
- name: statutory_category_accuracy
  unit: percent
  description: Absence recorded in its correct legal category.
  direction: higher_is_better
- name: accrued_liability_concentration
  unit: percent
  description: Share of accrued balance held by the top decile of non-takers. The burnout and liability signal in one number.
  direction: lower_is_better
- name: payroll_handoff_error_rate
  unit: percent
  direction: lower_is_better
  description: Absence items wrong in the pay run.
handoffs:
  upstream: [admin.people_administration.employee_records_administration, admin.compliance_and_governance.policy_administration]
  downstream: [admin.people_administration.payroll_input_administration, admin.admin_operations.service_level_management]
  parallel: [admin.executive_support.calendar_management, admin.facilities_and_assets.workplace_management]
applies_to:
  models: [in_house, shared_services, enterprise_admin, multi_entity, regulated, hybrid, distributed, startup_lean]
  offerings: [transactional, assurance]

metadata:
  owner: Admin
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  reviewed_at: '2026-08-27'
  notes: >
    Promoted out of Phase-1 stub. Not on a live route.

    The description's own observation is the one worth keeping: leave administration is
    deceptively legal. Most categories carry statutory treatment that a single all-absence
    bucket destroys, and the destruction is invisible until the one case where it is examined.

    accrued_liability_concentration is the KPI that makes the non-taker visible. It is
    simultaneously a balance-sheet number and a burnout signal, which is why the person nobody
    worries about is usually the one to worry about.

