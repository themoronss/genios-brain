description: >
  The custody chain: issuing equipment against a signed acknowledgement, tracking transfers,
  and recovering it at the end of the relationship. Recovery is the half that fails, and it
  fails silently because nobody is inconvenienced by an asset that is not returned except the
  balance sheet.

question: "Was this issued to a named person, acknowledged, and has it come back?"

