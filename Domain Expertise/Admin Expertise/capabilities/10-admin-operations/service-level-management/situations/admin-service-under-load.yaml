# ROUTED SINCE 2026-08-29. Previously: The admin-operations subdomain reads the administrative FUNCTION
# rather than any one counterparty — how requests arrive, how long they take, whether the process
# holds. That is a portfolio read, and every anchor this system offers is a single subject.

identity:
  id: admin.sit.admin_service_under_load
  name: Admin Service Under Load
  domain: admin
  owner_capability: admin.admin_operations.service_level_management
  version: 1.0.0
  status: stable

description: >
  The administrative function itself is the subject: the shape of the request queue, how long
  things are taking against what was promised, which processes keep producing the same exception,
  and whether the organisation could keep operating if a key person or system were unavailable.

  This is the only Admin subdomain whose unit of analysis is a period rather than a thing. "Are we
  meeting our turnaround" is not a question about a request; it is a question about all of them,
  and answering it from one anchor at a time is the same category error as forecasting a pipeline
  one deal at a time.

matches:
  # BUILT. `context/periodic.py` mints a tenant node, writes the window's aggregates onto it as
  # ordinary facts, and opens one situation per domain anchored there — so the compile path reads
  # a period situation exactly as it reads any other. The type below is live.
  #
  # What arrives with it is a COUNT and its previous-window twin, never a verdict: open deals,
  # events this window against last, counterparties waiting on us, commitments open and overdue.
  # There are still no targets, no per-owner load and no cost-to-serve, and those remain listed in
  # `missing` on every situation this produces rather than being estimated.
  l2_situation_types:
    - admin_period_review
  scope: account
also_serves:
  - admin.admin_operations.admin_analytics
  - admin.admin_operations.process_improvement
  - admin.admin_operations.sop_management
  - admin.admin_operations.business_continuity_administration

objects:
  load:
    - admin.obj.core.sop
  optional:
    - admin.obj.core.request
    - admin.obj.core.deadline
    - admin.obj.core.escalation

priority_bp: 3600
typical_duration_days: 30
signals_of_progress: [next_step_agreed]
signals_of_decay: [timeline_slip]

render:
  artifact_kind: brief
  render_hint: >
    report the period, the movement and the cause — never
    a single number without the comparison that makes it mean something.
  fallback:
    headline: "Administrative turnaround — period unmeasured"
    situation: >-
      No period aggregate exists, so turnaround against target cannot be stated.

metadata:
  owner: Admin
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-29'
  review_status: approved
  confidence: experimental
  reviewed_at: '2026-08-29'
  notes: >
    Built 2026-08-29. The argument against the per-subject binding is kept because it is what stops this being re-pointed at an anchor that cannot carry an aggregate:

    WHY BINDING TO admin_contact WOULD BE WRONG, specifically. (1) A per-counterparty anchor cannot express an aggregate — "turnaround is slipping" is not a statement about one contact, and asserted about one it is meaningless. (2) It would fire once per contact, producing N copies of a single finding and spending the daily signal budget on repetition. (3) Process improvement needs to see the same exception recur across DIFFERENT requests, which is precisely the comparison a single-subject anchor forbids. (4) Business continuity is about the absence of a person or a system; there is no anchor for an absence. # No `scope`. The natural scope is TENANT + PERIOD, which the enum does not offer.

    Deliberately names the SAME missing mechanism as the Sales and Customer Support period
    situations. Three subdomains across three domains are blocked on one Layer 2 capability —
    tenant-anchored periodic situations — and stating it three times in the same words is what
    makes that legible as a single build.

