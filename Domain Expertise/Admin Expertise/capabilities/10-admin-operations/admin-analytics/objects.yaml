# Load-set for admin.admin_operations.admin_analytics — REFERENCES ONLY, never an inline object.
#
# core   -> objects/core/                    loaded by more than one capability
# scoped -> objects/admin-analytics/       loaded by this capability alone
#
# required = a missing one blocks the compile.
# optional = absence lowers confidence rather than blocking (Layer 3 strategy S8) — a
#            situation the compiler cannot fully feed should still produce the answer the
#            requester is waiting on, at a lower confidence, not withhold it.

capability: admin.admin_operations.admin_analytics

core:
  required:
    - admin.obj.core.request
    - admin.obj.core.commitment
  optional:
    - admin.obj.core.action_item
    - admin.obj.core.invoice
    - admin.obj.core.asset

scoped:
  required: []
  optional: []
