description: >
  Authoring and maintaining standard operating procedures: capturing the real process,
  assigning ownership, versioning, and reviewing when the process changes rather than on a
  calendar. An SOP that has drifted from practice is worse than none, because it is what the
  new joiner follows.

question: "Is there a written, current procedure for this, and does it match what we actually do?"

