description: >
  The front door of the administrative function: capturing requests from whatever channel they
  arrive on, classifying and prioritising them, assigning an owner and acknowledging the
  requester. Intake is where an administrative function either becomes measurable or stays a
  set of favours asked of individuals.

question: "What is being asked, by whom, how urgent is it, and who owns it now?"

