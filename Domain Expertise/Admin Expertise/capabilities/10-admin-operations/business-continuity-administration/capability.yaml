description: >
  The administrative side of continuity: documenting critical processes and their
  dependencies, maintaining contact trees and alternate arrangements, and testing them often
  enough that the plan is known to work. A continuity plan that has never been exercised is a
  document, not a capability.

question: "If this stopped working tomorrow, is there a documented, tested way to keep going?"

