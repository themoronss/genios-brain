description: >
  Converting a purpose into a sequenced agenda with pre-read attached, owners named against
  each item, and a decision stated for each one. A meeting with no agenda is a meeting whose
  outcome cannot be evaluated afterwards, which is why so many recur.

question: "What is this meeting for, and what must be in front of people before it starts?"

