description: >
  Finding a slot that works for a set of calendars, time zones and seniority constraints, with
  the right attendees and no more. The hard part is never the free/busy lookup; it is knowing
  who is genuinely required, who is being invited defensively, and what the meeting costs in
  aggregate attention.

question: "When can these specific people meet without damaging the rest of the week?"

