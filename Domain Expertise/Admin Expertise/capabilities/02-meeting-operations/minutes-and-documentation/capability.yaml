description: >
  Producing the durable record of a meeting: decisions distinguished from discussion, actions
  with named owners and dates, dissent recorded where it matters, and the whole thing filed
  where it can be found by someone who was not there. In governed contexts the minute is the
  evidence, and an undocumented decision did not happen.

question: "What was decided, by whom, and where is that written down?"

