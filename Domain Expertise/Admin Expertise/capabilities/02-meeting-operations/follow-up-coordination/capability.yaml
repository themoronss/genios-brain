description: >
  Closing the loop after a meeting, an introduction or a conversation: the recap, the promised
  document, the connection made, the next step proposed. Follow-up is cheap on the day and
  irrecoverable a fortnight later, which is why it is the most valuable thing an
  administrative function can be relied on for.

question: "What is owed to whom after this interaction, and has it gone out?"

