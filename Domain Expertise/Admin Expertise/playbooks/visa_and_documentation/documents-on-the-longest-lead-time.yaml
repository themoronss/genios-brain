identity:
  id: admin.pb.visa_and_documentation.documents_on_the_longest_lead_time
  name: Documents on the longest lead time
  kind: playbook
  domain: admin
  scope: capability
  owner_capability: admin.travel_and_events.visa_and_documentation
  subdomain: travel_and_events
  version: 1.0.0
  status: draft
purpose:
  statement: Visa and document work starts the moment travel is probable — validity checks, requirement
    research, applications with buffer — because document lead times are the one part of a trip that cannot
    be expedited by caring harder.

when_to_use:
  conditions: [{exists: meeting.start_at}]
  do_not_use_when:
  - Domestic travel with no documentation requirement. The machinery adds delay and protects nothing.
steps:
- order: 1
  name: Start when the trip becomes probable
  description: >
    Not when it is booked. Booking takes an hour and a visa can take a month, and doing them in
    that order is the failure.
  actor: human
  objects_read: [admin.obj.core.deadline, admin.obj.core.employee_record]
  done_when: Requirements are being researched before flights are confirmed.
- order: 2
  name: Check the validity WINDOW, not the expiry date
  description: >
    Many destinations require six months of remaining validity. A passport valid on the travel date
    is refused at check-in and the traveller had no reason to think otherwise.
  actor: human
  done_when: Validity is assessed against the destination's rule.
- order: 3
  name: Research per nationality, per traveller
  description: >
    The same trip has different answers for different passports, and a group answer is wrong for
    whoever is the exception.
  actor: human
  done_when: Each traveller has their own requirement list.
- order: 4
  name: Apply with buffer for a request for more information
  description: >
    Applications routinely come back asking for one more document. Without contingency that request
    consumes the trip.
  actor: human
  done_when: The submission date leaves room for one round trip.
- order: 5
  name: Decide early when it will not arrive
  description: >
    Cancelling or substituting in week one costs a booking fee. Discovering it at the airport costs
    the meeting and the trip.
  actor: human
  done_when: A go or no-go was made while options existed.
objects_used: [admin.obj.core.employee_record, admin.obj.core.deadline, admin.obj.core.compliance_obligation, admin.obj.core.document]
limits:
- 'Lead times are set by consulates and are neither predictable nor appealable. This buys margin, not certainty.'
- 'Requirements change without notice and the published guidance lags, so step 3 has a shelf life.'
failure_modes:
- 'Step 1 deferred until the trip is confirmed, which is the single cause of nearly every document-related cancellation.'
- 'Step 5 avoided because cancelling feels premature, so the decision is made by the calendar instead.'
variants:
- applies_to: multi_entity
  change: The employing entity affects work-permit requirements even where the traveller and destination are identical.
  why: Permission attaches to the employer as well as to the person.
- applies_to: executive_office
  change: Step 1 must run on probable trips that may never happen, which feels wasteful and is the correct trade.
  why: The principal's calendar changes late and the consulate's does not.
references:
- title: Business travel documentation practice
  kind: practitioner
  note: Where destination validity windows are treated as the requirement rather than the expiry date.

metadata:
  owner: Admin
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  completeness: complete
  notes: >
    Step 1 is the whole playbook. Every other step is competent execution of something that
    started too late, and starting early is the only variable this capability actually controls.
