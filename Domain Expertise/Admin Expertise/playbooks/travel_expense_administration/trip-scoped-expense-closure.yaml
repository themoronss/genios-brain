identity:
  id: admin.pb.travel_expense_administration.trip_scoped_expense_closure
  name: Trip-scoped expense closure
  kind: playbook
  domain: admin
  scope: capability
  owner_capability: admin.travel_and_events.travel_expense_administration
  subdomain: travel_and_events
  version: 1.0.0
  status: draft
purpose:
  statement: Each trip's expenses close as a unit — advances reconciled, receipts matched, report filed
    within days of return — because trip expenses left open become month-end mysteries with fading receipts
    and memories.
steps:
- order: 1
  name: Issue advances against the trip record
  description: Advance tied to trip id; reconciliation is then arithmetic, not archaeology.
  actor: human
- order: 2
  name: Capture receipts during travel
  description: In-app capture in the taxi, not the envelope method. Fresh capture is complete capture.
  actor: human
- order: 3
  name: Close within the week of return
  description: Report filed, advance settled, exceptions flagged — while the trip is still memory, not
    history.
  actor: human
