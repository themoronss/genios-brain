identity:
  id: admin.pb.vendor_onboarding.vendor_onboarding_gauntlet_right_sized
  name: Vendor onboarding gauntlet, right-sized
  kind: playbook
  domain: admin
  scope: capability
  owner_capability: admin.contract_and_vendor.vendor_onboarding
  subdomain: contract_and_vendor
  version: 1.0.0
  status: draft
purpose:
  statement: New vendors pass through a proportionate gauntlet — legitimacy, security posture where relevant,
    terms, payment details verified out-of-band — because vendor fraud and vendor risk both enter at onboarding.

when_to_use:
  do_not_use_when:
  - A one-off consumer purchase with no ongoing relationship and no access. The gauntlet costs more than it protects and its delay is what creates off-process buying.
steps:
- order: 1
  name: Establish the entity is real and is who it says
  description: >
    Registration, address, an existence independent of the person introducing them. Cheap, fast, and
    the step most often assumed because the requester vouched.
  actor: human
  objects_read: [admin.obj.core.vendor]
  done_when: The legal entity is confirmed from a source the requester did not provide.
- order: 2
  name: Rate risk on access, not on value
  description: >
    What will they touch — our data, our systems, our premises, our customers. Contract value is a
    proxy that inverts precisely where it matters.
  actor: human
  done_when: The rating names the access rather than the amount.
- order: 3
  name: Verify bank details out of band, always
  description: >
    A phone number obtained independently, to a person who is not the one who sent the change. No
    exceptions for urgency, because urgency is the pretext.
  actor: human
  done_when: Confirmation came through a channel we chose.
- order: 4
  name: Agree terms before work starts
  description: >
    Onboarding after engagement makes every check retrospective and removes refusal from the options.
  actor: human
  objects_read: [admin.obj.core.contract]
  done_when: Terms exist before the first deliverable.
- order: 5
  name: Create the vendor record once
  description: >
    Duplicates defeat every downstream control that keys on the supplier, including the payment
    controls this playbook just established.
  actor: agent
  done_when: A search for the supplier returns one record.
objects_used: [admin.obj.core.vendor, admin.obj.core.contract, admin.obj.core.approval, admin.obj.core.compliance_obligation]
limits:
- 'Step 2 requires knowing what the vendor will access, which the requester often cannot state at onboarding.'
- 'It vets at a point in time. A vendor safe at onboarding can be compromised later, and nothing here detects that.'
failure_modes:
- 'Step 3 satisfied by a reply on the same thread, which is the exploit rather than the control.'
- 'Steps 1 to 4 applied uniformly, which slows legitimate purchases until people stop using the process.'
variants:
- applies_to: regulated
  change: Step 2 gains a formal assessment and step 4 a mandated clause set; the fast path narrows but must still exist.
  why: Proportionality survives regulation; it just starts lower.
- applies_to: startup_lean
  change: Steps 1, 3 and 5 only. Security assessments at this size are a form nobody can evaluate.
  why: The realistic exposure is payment fraud and duplicate records, not third-party risk management.
references:
- title: Accounts payable fraud controls
  kind: practitioner
  note: Out-of-band verification is consistently the single highest-yield control in the category.

metadata:
  owner: Admin
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: experimental
  completeness: complete
  notes: >
    Step 3 has no proportionate version. Every other step scales with risk; out-of-band
    verification is binary and the exceptions are always urgent, which is precisely the pretext
    the fraud uses.
