# V1 ROUTING DEFERRALS — the named reason a capability has no door.
#
# Authored, not generated. `_tools/index.py` reads it and `_tools/validate.py` enforces it; the
# generated registry carries the result as `deferred_capabilities` so a compile can be asked what
# it deliberately does not know and get a list instead of a shrug.
#
# WHY THIS FILE EXISTS. Every capability in a domain gets a door or a named reason it has none.
# Twenty-one Admin capabilities were authored, admission-stamped, and reachable by nothing — not
# because anyone decided against them but because nobody had written the decision down, which is
# indistinguishable from having forgotten. An unrouted capability with no entry here is now an
# ERROR, so the census cannot rot back into silence.
#
# WHAT DEFERRED MEANS, EXACTLY.
#   - The capability does NOT appear in any route in the generated registry.
#   - Any situation it OWNS is suppressed from the map, so the resolver never selects it and no
#     package can ever be compiled through it. Deferral is structural, not a label.
#   - The knowledge is NOT deleted and NOT deprecated. It is sound; it is out of scope, or its
#     trigger does not exist. Reversing a deferral is deleting a block from this file.
#   - It does not count against activation coverage. A domain that is 40% routed and 60% reasoned
#     is a domain that knows its own shape; a domain that is 63% routed and silent about the rest
#     is a domain that has not been read.
#
# THREE KINDS, and the difference between them is who unblocks it.
#   out_of_v1_scope     Sound expertise nobody asked for in V1. Unblocked by a product decision.
#   blocked_on_l2_type  The trigger is named in vocabulary planned_substrate and no pack emits
#                       it. Unblocked by Layer 1 or Layer 2 shipping the emitter.
#   no_runtime_trigger  Nothing in a mail-and-calendar tenant can produce the evidence at all.
#                       Unblocked only by connecting a system that does not exist here yet.
#
# Every entry carries `reason` — a sentence, not a category — because the category is the cheap
# half and the sentence is the one a reader six months from now actually needs.

domain: admin
version: 1.0.0

deferred:

  # ── out_of_v1_scope · Facilities & Assets (5) ────────────────────────────────────────
  # The Admin corpus was authored as an ADMIN DEPARTMENT. The product's Admin is FOUNDER
  # OPERATING INTELLIGENCE. Twelve of the fifteen founder surfaces have a corpus home; these
  # five capabilities serve a surface nobody asked for, and on a founder tenant there is no
  # facility, no asset register and no one holding custody of anything.

  - capability: admin.facilities_and_assets.workplace_management
    kind: out_of_v1_scope
    reason: >
      A founder tenant has no workplace to manage and no facilities function to advise. Sound
      administrative expertise, aimed at a reader this product does not have in V1.

  - capability: admin.facilities_and_assets.asset_register
    kind: out_of_v1_scope
    reason: >
      Custody of physical assets is invisible to mail and calendar — an unreturned laptop
      generates no message — and it is not one of the fifteen founder surfaces. Owns
      `admin.sit.asset_in_custody`, which is suppressed with it and routes nothing.
    blocked_on: [asset_custody_unknown, asset_unreturned]

  - capability: admin.facilities_and_assets.asset_issuance_and_recovery
    kind: out_of_v1_scope
    reason: >
      Issue and recover is the transaction half of a register the tenant does not keep. Deferred
      with the register rather than left routing into it.
    blocked_on: [asset_unreturned]

  - capability: admin.facilities_and_assets.maintenance_coordination
    kind: out_of_v1_scope
    reason: >
      Premises maintenance. Out of the founder-intelligence bar and out of V1 scope; nothing here
      is wrong, and nothing here is what a founder opens the product to see.

  - capability: admin.facilities_and_assets.health_and_safety_administration
    kind: out_of_v1_scope
    reason: >
      A statutory duty of an employer with premises. Real, and answerable only from records this
      tenant has never kept in a mailbox.

  # ── out_of_v1_scope · Travel & Events (5) ────────────────────────────────────────────
  # These three DID route, through `admin.sit.date_bound_logistics`, on the generic person and
  # company lanes. That situation's own review note is the argument for deferring it: the
  # predicate it rests on, `meeting.location`, is live on 15 of 62 meeting nodes on the design
  # partner's org and most of those fifteen are video-call URLs. A subdomain whose best door
  # opens onto a Google Meet link is not V1 coverage; it is a card that has to refuse itself.

  - capability: admin.travel_and_events.event_coordination
    kind: out_of_v1_scope
    reason: >
      Owns `admin.sit.date_bound_logistics`, which bound the generic `admin_contact` and
      `relationship` lanes because the subdomain had no trigger of its own. Suppressing that
      situation is the whole of this deferral: five capabilities stop reaching a lane that was
      never about them.

  - capability: admin.travel_and_events.itinerary_management
    kind: out_of_v1_scope
    reason: >
      Reached only through `admin.sit.date_bound_logistics`. Deferred with its door.

  - capability: admin.travel_and_events.travel_booking
    kind: out_of_v1_scope
    reason: >
      Reached only through `admin.sit.date_bound_logistics`. Deferred with its door.

  - capability: admin.travel_and_events.visa_and_documentation
    kind: out_of_v1_scope
    reason: >
      Already unreachable and deliberately so — `date_bound_logistics` refused to serve it on the
      grounds that no fact records a document application. The refusal was right; this records it.

  - capability: admin.travel_and_events.travel_expense_administration
    kind: out_of_v1_scope
    reason: >
      Already unreachable and deliberately so — no fact records a reimbursable expense on a
      mail-and-calendar tenant. Reimbursement of the ordinary kind is served by
      `admin.finance_administration.reimbursement_processing`, which routes.

  # ── blocked_on_l2_type · Compliance & Governance (6) ─────────────────────────────────
  # Founder surface 15 is RISK, and the product's own scope note makes it observation-only for
  # V1. That is the right call and this is what it costs: an obligation whose deadline is set by
  # a regulator is the least deniable finding an administrator produces, and Layer 2 cannot see
  # one. `admin.sit.obligation_falls_due` is authored, correct, and pending on a type no pack
  # emits — the honest state, and the reason binding it to `commitment_overdue` was refused.

  - capability: admin.compliance_and_governance.statutory_filing
    kind: blocked_on_l2_type
    reason: >
      Owns `admin.sit.obligation_falls_due`, which declares its trigger as pending rather than
      borrowing `commitment_overdue`. A filing deadline is external and non-negotiable and a
      promise is neither; reading one through the other would produce a card telling a founder to
      renegotiate a date with a registrar.
    blocked_on: [filing_due, filing_overdue]

  - capability: admin.compliance_and_governance.policy_administration
    kind: blocked_on_l2_type
    reason: >
      An attestation cycle needs a policy register and a roster to attest against. The document
      register can see a file; it cannot see that the file is a policy, and no predicate in the
      grammar matches on a title.
    blocked_on: [policy_attestation_due, policy_review_overdue]

  - capability: admin.compliance_and_governance.licence_and_registration
    kind: blocked_on_l2_type
    reason: >
      A licence expiring is a date in a register nobody has connected. The renewal correspondence
      that would carry it is indistinguishable from any other vendor thread.
    blocked_on: [licence_expiring]

  - capability: admin.compliance_and_governance.board_and_secretarial
    kind: no_runtime_trigger
    reason: >
      Resolutions, registers and statutory books live in a company-secretarial system, not in a
      mailbox. A board meeting appears on the calendar exactly as any other meeting does, so the
      only reading available is the generic one `meeting_follow_through` already gives.

  - capability: admin.compliance_and_governance.audit_support
    kind: no_runtime_trigger
    reason: >
      An audit request arrives as an email and is indistinguishable from any other information
      request. Routing this on `information_requested` would attach audit-evidence expertise to
      every question a counterparty asks.

  - capability: admin.compliance_and_governance.data_protection_administration
    kind: no_runtime_trigger
    reason: >
      A subject access request has a statutory clock and arrives looking like ordinary
      correspondence. Guessing at it would put a legal deadline on a message that does not carry
      one, which is the most expensive wrong card this domain could produce.

  # ── blocked_on_l2_type · People Administration (6) ───────────────────────────────────
  # Doubly deferred: people administration is not among the fifteen founder surfaces, AND its
  # entire substrate is an HRIS the tenant has not connected. `admin.sit.employee_lifecycle_event`
  # is authored and pending, which is the correct state for a situation whose trigger is a joiner
  # record no system emits here.

  - capability: admin.people_administration.onboarding_administration
    kind: blocked_on_l2_type
    reason: >
      Owns `admin.sit.employee_lifecycle_event`, pending on a joiner signal. A start date exists
      in an offer letter and in an HR system; neither is connected, and a calendar invite for a
      first day is not a joiner record.
    blocked_on: [onboarding_task_overdue, start_date_approaching]

  - capability: admin.people_administration.offboarding_administration
    kind: blocked_on_l2_type
    reason: >
      The expensive half of people administration and the one with a real clock — access left
      live after a leaver. Nothing in mail or calendar reports a leaver, and inferring one from
      correspondence going quiet would be a fabricated finding about a named person.
    blocked_on: [access_orphaned]

  - capability: admin.people_administration.access_and_identity_administration
    kind: blocked_on_l2_type
    reason: >
      Needs an identity provider's account list to say anything at all. Without it there is no
      denominator, and an access review with no denominator is a list of guesses.
    blocked_on: [access_orphaned, access_review_due]

  - capability: admin.people_administration.employee_records_administration
    kind: no_runtime_trigger
    reason: >
      A record's completeness can only be judged against a schedule of what the record must hold.
      That schedule is HR configuration; it is not derivable from anything this tenant has.

  - capability: admin.people_administration.attendance_and_leave
    kind: no_runtime_trigger
    reason: >
      Leave is booked in a leave system. A calendar entry marked out-of-office is not a leave
      record, and treating it as one produces a balance nobody agreed to.

  - capability: admin.people_administration.payroll_input_administration
    kind: no_runtime_trigger
    reason: >
      Payroll inputs are assembled from systems of record with a hard monthly cut-off. There is
      no partial version of this that is safe to be approximately right about.

  # ── blocked_on_l2_type · the two singletons ──────────────────────────────────────────

  - capability: admin.contract_and_vendor.purchase_order_management
    kind: blocked_on_l2_type
    reason: >
      A PO is raised, consumed and exhausted inside a finance system. The five sibling contract
      and vendor capabilities route on correspondence because a contract is negotiated in email;
      a purchase order is not.
    blocked_on: [po_raised, po_exhausted, goods_receipted]

  - capability: admin.finance_administration.budget_tracking
    kind: blocked_on_l2_type
    reason: >
      Owns `admin.sit.spend_against_a_commitment`, pending on a budget signal. Founder surface 12
      (financial obligation) is already served by the five finance capabilities that route on
      invoices and payment correspondence; what is missing here is the ledger, not the expertise.
    blocked_on: [budget_overcommitted]

metadata:
  owner: Admin
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-09-07'
  review_status: approved
  notes: >
    Twenty-four of fifty-seven. That number is the honest shape of an admin-department corpus
    pointed at a founder: two whole subdomains serve a reader this product does not have, and
    twelve more capabilities are waiting on an emitter rather than on an author. Not one of them
    is deleted, and every one of them says what would unblock it.
