# Transactional — offering_family branch node.
#
# An Admin 'offering' is a SERVICE LINE: what kind of thing the administrative function
# delivers. It is orthogonal to the operating model — Shared Services x Custodial is real,
# and neither branch owns the other.
#
# INHERITANCE: this file declares only what DIFFERS from its parent. Capability and object
# files are NOT copied into this branch; resolution is type -> family -> canonical.

identity:
  id: admin.offering.transactional
  name: Transactional
  kind: offering_family
  domain: admin
  parent: null
  version: 0.1.0
  status: draft
  stub: false

description: >
  High-volume, rule-bound processing where the same thing is done many times and correctness
  is defined by the rule rather than by the requester. Value is delivered at the moment the
  transaction completes and almost nothing is owed afterwards.

characteristics:
  delivery: "the completed transaction, immediately on processing"
  pricing_shape: "cost per transaction"
  margin_profile: "improves with volume; dominated by rework rate"
  post_sale_load: "low — the record is the only residue"
  notes: >
    Consumers: employees, suppliers and finance. Funded by chargeback per transaction or
    allocated overhead. An internal function with no chargeback has no natural brake on
    demand, which changes which capabilities matter and is why this line is recorded.

capabilities:
  emphasises:
    - admin.finance_administration.invoice_processing
    - admin.finance_administration.expense_management
    - admin.admin_operations.request_intake

metadata:
  owner: Admin
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: experimental
