# Coordinative — offering_family branch node.
#
# An Admin 'offering' is a SERVICE LINE: what kind of thing the administrative function
# delivers. It is orthogonal to the operating model — Shared Services x Custodial is real,
# and neither branch owns the other.
#
# INHERITANCE: this file declares only what DIFFERS from its parent. Capability and object
# files are NOT copied into this branch; resolution is type -> family -> canonical.

identity:
  id: admin.offering.coordinative
  name: Coordinative
  kind: offering_family
  domain: admin
  parent: null
  version: 0.1.0
  status: draft
  stub: false

description: >
  Arranging people, time and logistics so that something can happen. The output is perishable
  and its quality is only observable at the moment of use — a diary that worked yesterday
  tells you nothing about tomorrow.

characteristics:
  delivery: "an arrangement that holds at the moment it is needed"
  pricing_shape: "time-based, or bundled into a support role"
  margin_profile: "does not scale; capacity is the person"
  post_sale_load: "high — arrangements decay and must be re-confirmed"
  notes: >
    Consumers: executives, teams, travellers and external counterparties. Funded by allocated
    to the supported function. An internal function with no chargeback has no natural brake on
    demand, which changes which capabilities matter and is why this line is recorded.

capabilities:
  emphasises:
    - admin.executive_support.calendar_management
    - admin.meeting_operations.meeting_scheduling
    - admin.travel_and_events.itinerary_management

metadata:
  owner: Admin
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: experimental
