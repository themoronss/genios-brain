  completeness: complete
  notes: >
    Rewritten from the 18-section shape onto the 23-section schema. The substance of the earlier
    file — the acknowledgement and enforcement analysis, the exception register reading, the
    obligation boundary — is preserved and extended; the shape is discarded.
    Five of thirteen patterns are executable today: an overdue attached commitment, legal review in
    progress, graph orphaning, exposure by a customer security review, and a policy refresh stalled
    on our side of the thread. That thinness is the honest picture — the substrate can see traffic
    about a policy and almost nothing about whether it operates.
    policy_acknowledged remains the standout ask: every LMS and policy portal emits it on every
    attestation, nothing consumes it, and without it the library cannot tell an enforceable rule
    from a published one. Second is the joiner feed (employee.start_at with joiner_confirmed) — the
    enforceability hole opens continuously rather than at review time, and every joiner between
    attestation runs is bound by a rule nobody showed them.
    The boundary with admin.obj.core.compliance_obligation is deliberate and load-bearing. A policy
    is self-imposed, amendable by the body that approved it, and enforced only as far as the
    organisation chooses. An obligation is imposed, unnegotiable, and breaches by itself.
    derives_from_obligation_ref is the one field connecting them, and
    pol.policy_cannot_relax_an_obligation is the rule that stops Layer 4 confusing them.
