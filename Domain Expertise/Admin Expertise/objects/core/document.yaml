    executable today and all five ride observations built for a revenue motion — legal_review and
    proposal_sent — plus edge_count, elapsed thread time, and the natively administrative
    commitment.due_at / thread.ball_in_court pair. Ranked, the asks are: (1) document.approved_at,
    the single highest-value missing fact path in the Admin brain, because without it the library
    cannot distinguish a draft from a document and every other judgement in this file depends on
    that distinction; (2) document.retention_until together with a trigger event joined from
    employee.end_at, because a schedule whose clock never starts looks complete and disposes of
    nothing; (3) document.version plus identity clustering, which turns a version string into a
    conflict detector for the commonest incident in the domain; (4) document.classification with
    derived.recipient_is_external, one cheap domain comparison away from turning an unrecallable
    data-protection incident into a preventable one; (5) leaver_confirmed reaching document
    ownership, the half of joiner-mover-leaver nobody built. Deliberately kept distinct from
    admin.obj.core.policy and from admin.obj.core.compliance_obligation: a policy is a rule we can
    change, an obligation is a duty we cannot, and a document is the controlled artefact that
    evidences either. "We updated the policy" almost always means somebody edited a file, and this
    object is where that conflation gets caught.
