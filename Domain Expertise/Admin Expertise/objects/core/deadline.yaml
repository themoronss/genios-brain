  notes: >
    Five of fifteen patterns are executable, and all five ride on commitment.due_at — which is
    the honest state of things and also the object's central warning: commitment.due_at carries
    an INTERNAL date, so anything inferred through it inherits the exact collapse this object
    exists to prevent. Every executable pattern here is therefore about timing and never about
    negotiability, and negotiability is what the ranking turns on. The ten needs_signal entries
    rank clearly: obligation.due_at with obligation.authority and obligation.jurisdiction first,
    because without them the brain cannot tell a statute from a preference; then
    contract.end_at with contract.notice_period_days, which would generate an entire notice
    calendar from data the organisation already holds and would catch the auto-renewals that
    currently surface as invoices. dl.preparation_window_open is flagged in its own note as
    depending on days_since returning a negative value for a future timestamp; if the engine
    clamps at zero the pattern is inert rather than wrong, and that should be confirmed against
    engine.py before the window logic is relied on.
