  owner: Admin
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  completeness: complete
  notes: >
    Rewritten from the 18-section shape onto the 23-section schema, and deliberately still not a
    rewrite of sales.obj.core.decision_maker. The Sales object solves discovery — nobody knows who
    can sign. This one solves availability — everybody knows who can sign and the authority is
    unexercisable, because the holder is away, their delegation was verbal, or their instrument
    expired in April.

    Five of fifteen patterns run today and all five are structural rather than semantic
    (edge_count, ball_in_court, reply_cadence, derived.engagement), which is the honest ceiling
    until a DOA matrix is ingested. The two highest-value backlog items are
    approver.unavailable_until — the calendar connector already fetches the events and discards
    all-day absences — and the pairing of leaver_confirmed with access.last_used_at, which turns
    the standard orphaned-approver audit finding into an automatic one.

    The exception apr.statutory_authority_cannot_be_delegated is the line most likely to be missed
    by anything built from policy documents: where a regulator names the individual, delegation and
    escalation are both unavailable, so succession planning is the only control — and an absence
    that looks identical to any other is not.
