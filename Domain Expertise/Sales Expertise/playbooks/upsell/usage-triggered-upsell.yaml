identity:
  id: sales.pb.upsell.usage_triggered_upsell
  name: Usage-triggered upsell
  kind: playbook
  domain: sales
  scope: capability
  owner_capability: sales.post_sale_and_growth.upsell
  subdomain: post_sale_and_growth
  version: 1.1.0
  status: stable
purpose:
  statement: 'The best upsell moment is when the customer bumps against a real limit — seats full,
    volume caps, a premium feature attempted. Sell the removal of a felt constraint, not the abstract
    merits of a higher tier.'
  answers:
  - What triggers an upsell conversation, and what does it say?
  not:
  - Cross-sell. A different product is a different motion with a different buyer.
  - A pricing method. The increment's price is decided elsewhere.

when_to_use:
  situations:
  - sales.sit.live_account_relationship
  conditions:
  - {path: derived.engagement, op: ">=", value: 1}
  signals:
  - question
  - next_step_agreed
  do_not_use_when:
  - 'Engagement is falling. More of an underused product accelerates churn while looking like growth,
    and it is the one upsell that reliably damages the renewal.'
  - 'The limit has real consequences — data loss, service interruption, a compliance breach. Warn
    early instead; waiting for the experience is indefensible here.'
  - 'The peak is seasonal. Selling permanent capacity against a temporary spike is a trade the
    customer will remember at renewal.'

steps:
- order: 1
  name: Check the account is actually healthy first
  description: 'An account with falling engagement should not be sold more of what it is not using.
    This is the cheapest check available — `derived.engagement` exists for every relationship — and it
    is the step that separates growth from accelerated churn.'
  actor: system
  objects_read:
  - sales.obj.core.account
  produces: A health verdict before any offer is considered.
  done_when: No disengaged account is in the upsell motion.

- order: 2
  name: Instrument the limit events
  description: 'Know the moment an account hits a constraint. Where product telemetry exists this is
    mechanical; where it does not, the only available trigger is the customer saying so — which is a
    real signal and a late one, and worth treating as urgent when it arrives.'
  actor: system
  objects_read:
  - sales.obj.core.opportunity
  produces: A limit event with a date.
  done_when: Constraints are noticed rather than discovered at renewal.

- order: 3
  name: Move inside the window
  description: 'A customer who hits a limit and gets no offer builds a workaround, and the workaround
    removes the pain that would have justified the conversation. The window is days, and it closes by
    the customer solving the problem themselves.'
  actor: human
  produces: Contact while the friction is still present.
  done_when: The conversation happened before the customer engineered around it.

- order: 4
  name: Frame as unblock, not upgrade
  description: '"Your team hit this twice last month — here is what removing it costs" meets a problem
    they already have. The same offer framed as a better tier meets a decision they were not making,
    and tier decisions are deferred to a review nobody schedules.'
  actor: human
  objects_read:
  - sales.obj.core.pain_point
  produces: An offer expressed as the removal of a specific block.
  done_when: The message names their event rather than our tier.

- order: 5
  name: Price the step, not the staircase
  description: 'Show the increment from today, in their billing rhythm. Re-anchoring on the full new
    tier price restarts a commercial conversation that was settled a year ago, and frequently reopens
    terms nobody intended to revisit.'
  actor: human
  objects_read:
  - sales.obj.core.pricing
  produces: A small, clearly-bounded increment.
  done_when: The offer is a step from the current position rather than a new deal.

- order: 6
  name: Run it as a standing motion, with an owner
  description: 'This is mechanical work with real revenue attached, which is exactly why it goes
    unworked — nobody is measured on it. An owner and a rhythm are the whole difference between a
    capability and a good intention.'
  actor: human
  produces: A named owner and a recurring cadence.
  done_when: Limit events are worked routinely rather than noticed occasionally.

objects_used:
- sales.obj.core.opportunity
- sales.obj.core.account
- sales.obj.core.pricing
- sales.obj.core.pain_point
- sales.obj.core.timeline

outcomes:
- Upsell follows felt friction in healthy accounts, inside the window.
- The offer is an unblock priced as an increment.
- The motion has an owner rather than depending on someone noticing.

failure_modes:
- 'SOLD INTO A DISENGAGED ACCOUNT. Growth on paper, churn accelerated, and the renewal arrives with
  the wrong evidence.'
- 'TRIGGERED BY A UTILISATION DASHBOARD. Our number, not their experience; the pipeline does not close.'
- 'FRAMED AS AN UPGRADE. Converts a problem into a tier decision, which gets deferred.'
- 'FULL PRICE RE-ANCHORED. A small increment becomes a fresh negotiation.'
- 'UNOWNED. The commonest outcome of all — mechanical, unglamorous, and therefore nobody''s.'

limits:
- No usage telemetry exists in the record, so step 2 is the binding constraint on a
  correspondence-only tenant and the motion degrades to acting on what the customer mentions.
- Says nothing about accounts that should be on LESS; downgrade is a real and unhandled motion.
- Cannot distinguish a felt limit from an approaching one without instrumentation.

variants:
- applies_to: enterprise
  change: The person who feels the limit is an administrator and the buyer is the sponsor; steps 3 and
    4 have to reach both, with different framings.
  why: The experience and the authority sit with different people.
- applies_to: smb
  change: One person, one exchange; steps 4 and 5 can happen in a single message.
  why: The person hitting the limit can also buy.
- applies_to: inside_sales
  change: Automate steps 1 to 3 entirely and keep step 4 human; at volume the trigger will not be
    noticed by anyone.
  why: The failure mode is structural, not individual.
- applies_to: channel
  change: The partner sees the limit event and we do not; the motion is theirs to run and ours to
    supply.
  why: We are not in the usage relationship.

metrics:
- name: limit_event_to_offer_days
  unit: days
  description: Constraint hit to conversation.
  direction: lower_is_better
- name: upsell_on_low_engagement_rate
  unit: percent
  description: Share of upsells sold into declining accounts.
  direction: lower_is_better
- name: post_upsell_retention
  unit: percent
  description: Retention of upsold accounts against the base.
  direction: higher_is_better

references:
- title: SPIN Selling
  kind: methodology
  author: Neil Rackham
  note: Implied to explicit need — the transition a felt limit performs for free.
- title: Practitioner expansion operations
  kind: practitioner
  note: Usage-triggered expansion converts far better than calendar-triggered, and the window before a
    workaround appears is measured in days.

metadata:
  owner: Sales
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: provisional
  completeness: complete
  notes: 'Promoted from a three-step sketch. Steps 1, 3 and 6 are new, and step 1 is the important
    one: it is the only check in this playbook the engine can actually perform today, and it prevents
    the version of upsell that accelerates churn while reporting as growth.'
