identity:
  id: sales.pb.proposal_creation.proposal_as_decision_document
  name: The proposal as a decision document
  kind: playbook
  domain: sales
  scope: capability
  owner_capability: sales.proposal_and_commercials.proposal_creation
  subdomain: proposal_and_commercials
  version: 1.1.0
  status: stable
purpose:
  statement: 'A proposal is not a brochure — it is the document the committee decides FROM when we are
    not in the room. It restates their problem in their words, recommends one thing, and makes saying
    yes mechanical.'
  answers:
  - What does a proposal contain, and in what order?
  - How is a draft checked before it goes out?
  not:
  - A pricing method. The number arrives here already decided.
  - A presentation. If it needs presenting, it fails the test this playbook applies.

when_to_use:
  situations:
  - sales.sit.enterprise_deal
  - sales.sit.out_of_profile_deal
  conditions:
  - {path: deal.status, op: "=", value: open}
  signals:
  - proposal_sent
  - budget_approved
  do_not_use_when:
  - 'A tender or RFP prescribes the structure. The rubric governs, and rewriting for readability loses
    points for sections the evaluator was told to find.'
  - 'The commercial terms are not settled. A proposal sent to continue a negotiation reads as an
    opening position and is treated as one.'
  - 'Authority is unverified. The document will be circulated by whoever received it, to whoever they
    think should see it, and the deal then proceeds on their map of the organisation.'

steps:
- order: 1
  name: Restate the problem better than they did
  description: 'Page one is their situation, in their words, with their cost of today. A buyer who
    feels understood on page one reads page two; one who finds a company overview reads nothing — and
    both outcomes are settled before any argument has been made.'
  actor: human
  objects_read:
  - sales.obj.core.business_need
  - sales.obj.core.pain_point
  produces: An opening the buyer would recognise as their own description.
  done_when: Nothing about us appears before their problem does.

- order: 2
  name: Recommend ONE option
  description: 'Three options outsource our judgement to the busiest people in the organisation. The
    reliable effect is not a choice but a deferral while they work out which they were supposed to
    pick — or a default to the cheapest, which was not the intent either.'
  actor: human
  objects_read:
  - sales.obj.core.pricing
  produces: A single recommendation with its scope and price.
  done_when: The document says what we think they should do.

- order: 3
  name: State scope precisely enough to be refused
  description: 'Vagueness that avoids an objection now becomes a dispute in the first month of
    delivery, and the person who inherits it never saw the trade being made. If nobody could object to
    the scope as written, nobody can approve it either.'
  actor: human
  objects_read:
  - sales.obj.core.proposal
  produces: Scope a sceptical reader could disagree with specifically.
  done_when: What is included and excluded is both stated.

- order: 4
  name: Make saying yes mechanical
  description: 'Validity date, start date, signature block, named next step. Every missing mechanic is
    a delay loop, and each loop is another week in the window where deals are lost for reasons
    unrelated to their merit.'
  actor: human
  objects_read:
  - sales.obj.core.timeline
  - sales.obj.core.contract
  produces: A document that can be acted on without a further exchange.
  done_when: Acting on it requires nothing that is not in it.

- order: 5
  name: Address the sceptic's question inside the document
  description: 'Whoever the committee''s skeptic is — security, finance, an incumbent owner — their
    question will be asked in a room we are not in. Answering it in the document is the only way to be
    present for it.'
  actor: human
  objects_read:
  - sales.obj.core.buying_committee
  - sales.obj.core.risk
  produces: Pre-empted objections from seats we have not met.
  done_when: The likely objection of each mapped seat is addressed somewhere in the document.
  optional: true

- order: 6
  name: Have someone else cold-read it
  description: 'The author cannot un-know the context, so every ambiguity resolves correctly in their
    head and the document reads as complete to exactly one person. A colleague with no deal context,
    four minutes, no explanation — the cheapest quality control available and almost never done.'
  actor: human
  produces: A list of things that did not survive the cold read.
  done_when: Someone who was not in the deal has read it without being briefed.

- order: 7
  name: Send it so the champion can forward it unedited
  description: 'A document the champion has to rewrite before circulating usually just does not get
    circulated. The test is whether they could forward it as it stands, to their own executive,
    without embarrassment.'
  actor: human
  produces: A document fit for forwarding rather than for presenting.
  done_when: The champion has what they need to use it without us.

objects_used:
- sales.obj.core.proposal
- sales.obj.core.pricing
- sales.obj.core.business_need
- sales.obj.core.pain_point
- sales.obj.core.decision_maker
- sales.obj.core.buying_committee
- sales.obj.core.timeline
- sales.obj.core.contract
- sales.obj.core.risk

outcomes:
- The document opens with their problem and recommends one thing.
- Scope is specific and the mechanics of accepting are complete.
- It has survived a cold read by someone with no context.

failure_modes:
- 'OPENING WITH US. Spends the only attention the sceptical reader will give on the least relevant
  content.'
- 'A MENU INSTEAD OF A RECOMMENDATION. Reads as an absence of judgement and produces deferral.'
- 'SAFE VAGUE SCOPE. Avoids an objection now and creates a dispute later, for somebody else.'
- 'PRICE WITHOUT MECHANISM. Requires a further exchange to act on, and every exchange is a week.'
- 'REVIEWED ONLY BY ITS AUTHOR. The one reader for whom it was always going to work.'

limits:
- Cannot compensate for a proposal sent into an unmapped authority structure; that is a qualification
  gap and step 7 will not fix it.
- Says nothing about the commercial content.
- Nothing here is checkable by the engine — the document is not in the record, and `proposal_sent`
  marks only that one went out.

variants:
- applies_to: enterprise
  change: Step 5 stops being optional, and the document is structured so each seat can find its own
    section without reading the rest.
  why: Committee members read only what concerns them, and only that section has to work.
- applies_to: smb
  change: Compress to steps 1, 2 and 4; the reader is the buyer and the document is short.
  why: No committee to survive, only a delay.
- applies_to: channel
  change: Write it so the partner can forward it unedited to their customer, with no references only
    we would understand.
  why: A document the partner must rewrite is a document that does not get sent.
- applies_to: inside_sales
  change: Template steps 2, 3 and 4 and keep step 1 per deal; the opening is the only part that
    cannot be standardised without losing the effect.
  why: The restatement is the part that earns the read.

metrics:
- name: forward_survival_rate
  unit: percent
  description: Share producing a response from someone not previously in the conversation.
  direction: higher_is_better
- name: mechanics_completeness
  unit: percent
  description: Share containing validity date, start date, signature block and next step.
  direction: higher_is_better
- name: post_signature_scope_dispute_rate
  unit: percent
  description: Share of new accounts raising a scope disagreement in their first period.
  direction: lower_is_better

references:
- title: The Challenger Customer
  kind: book
  author: Adamson, Dixon, Spenner and Toman
  note: On the document circulating internally without the seller, and on writing for the mobiliser's
    audience rather than for the mobiliser.
- title: MEDDICC
  kind: methodology
  note: Decision criteria and paper process — steps 3 and 4 are where those two become a document.

metadata:
  owner: Sales
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: provisional
  completeness: complete
  notes: 'Promoted from a four-step sketch. Steps 3, 5 and 7 are new, and step 6 replaces a
    self-review with a cold read by someone else — which is the substantive change, because the
    original asked the author to apply a test only a stranger can apply.'
