purpose:
  statement: "For every load-bearing claim, write the observation that would overturn it before going\
    \ to look — then go looking for that observation specifically.\n Research designed to confirm always\
    \ confirms. Naming the falsifier in advance converts a map from a narrative into something that\
    \ can be checked, and it makes the later argument about evidence rather than about who is more senior.\n"
