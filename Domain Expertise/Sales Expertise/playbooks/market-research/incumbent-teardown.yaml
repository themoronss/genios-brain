purpose:
  statement: "Tear down the incumbent's public pricing, packaging, contract length and renewal terms,\
    \ then correct it against what buyers say they actually pay.\n Prevailing terms are the constraint\
    \ on our commercial design. A packaging shape a segment has never bought is a harder sell than a\
    \ price it has never paid, and list price is a claim while the paid price is a fact — the gap between\
    \ them is itself a find"
