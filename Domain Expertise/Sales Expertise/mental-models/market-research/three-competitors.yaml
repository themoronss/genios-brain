purpose:
  statement: "Every market has three competitors: the named vendor, the internal build, and doing nothing.\
    \ Only one of them has a website.\n The two without websites win most evaluations in immature categories\
    \ and appear in no competitor field, so they are systematically absent from research built on what\
    \ is easy to find. Naming all three changes the plan, because each is displaced by a different argument.\n"
