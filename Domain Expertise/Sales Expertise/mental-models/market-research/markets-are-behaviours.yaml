purpose:
  statement: "A market is a repeated buying behaviour around a shared job. A list of companies can approximate\
    \ one and can never define one.\n Every downstream artefact — profile, size, territory, cadence\
    \ — inherits the unit of analysis chosen here. Choose \"companies matching a filter\" and the whole\
    \ chain inherits a unit that cannot explain why two identical-looking accounts behave differently.\n"
