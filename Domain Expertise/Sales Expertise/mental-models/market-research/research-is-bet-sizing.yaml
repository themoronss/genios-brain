purpose:
  statement: "The purpose is not certainty. It is knowing how wrong the map can be while entry is still\
    \ the right call.\n Perfect information about a market arrives after the market has moved. Naming\
    \ the blocking unknowns and the size of the bet they justify turns an unresolvable argument about\
    \ confidence into a resolvable one about exposure.\n"
