# ─────────────────────────────────────────────────────────────────────────────
# THE VALUE PYRAMID
#
# Six tiers, from the conformance bar at the bottom to the champion's private stake
# at the top. The pyramid is NOT a persuasion ladder to be climbed as fast as
# possible — that reading is what makes new sellers open a first call with a CFO
# narrative in front of an operations manager who wanted to know whether the export
# is CSV. It is a map of WHOSE problem a claim solves. A claim pitched one tier above
# the person hearing it is not ambitious; it is somebody else's business.
#
# Two things a good practitioner knows that no value-selling deck says out loud:
#   1. Deals are lost at the BOTTOM tier far more often than they are won at the top.
#      A perfect ROI model does not survive a failed security questionnaire.
#   2. A value number the vendor produced is a marketing claim. A value number the
#      buyer produced is a commitment they must now defend internally. Same arithmetic,
#      entirely different object.
# ─────────────────────────────────────────────────────────────────────────────

identity:
  id: sales.mm.core.value_pyramid
  name: Value Pyramid
  kind: mental_model
  domain: sales
  scope: core
  subdomain: discovery_and_solution
  version: 1.0.0
  status: draft
  aliases: ["Value Ladder", "Value Hierarchy", "Elements of Value"]

purpose:
  statement: >
    Sorts every claim a seller can make into the tier of buyer outcome it serves, so that
    the claim is aimed at a person who is actually measured on it. Value is not a property
    of the product; it is a relation between what the product does and what a specific
    person is accountable for. The same feature is a differentiator to one seat on the
    committee and noise to the next.
  answers:
    - "Which tier is this claim on, and who at this account is paid to care about that tier?"
    - "Is the business case built out of the buyer's numbers or out of ours?"
    - "Which tier is the deal currently stuck on, and is that a proof problem or an audience problem?"
    - "What does the champion personally gain, and have we ever said it out loud?"
  not:
    - "Not a pricing method. What value is worth and what we charge are separate decisions — see sales.obj.core.pricing."
    - "Not a qualification test. A large quantified value with no budget and no compelling event is still a lost deal."
    - "Not a claim that higher tiers persuade harder. Higher tiers persuade DIFFERENT people."

dimensions:

  - name: Conformance (table stakes)
    asks: "Does the offer clear the bar required to be considered at all — security, data residency, insurance, accessibility, payment terms?"
    objects: [sales.obj.core.risk, sales.obj.core.contract, sales.obj.core.account]
    weak_signal: >
      "We can probably be flexible on that." Nobody has read the questionnaire, and the
      answer will arrive in legal review three weeks after the forecast was committed.
    strong_signal: >
      Security review completed, DPA countersigned, insurance certificate on file — all
      before the commercial conversation, because none of them are negotiable and all of
      them take longer than the seller expects.

  - name: Functional value
    asks: "What does the product do that the current way of working cannot, stated as a capability rather than a feature name?"
    objects: [sales.obj.core.business_need, sales.obj.core.pain_point, sales.obj.core.competitor]
    weak_signal: >
      A feature list with no comparison. Buyers cannot evaluate a capability in isolation;
      they evaluate it against what they do today, and if you do not supply the comparison
      they will invent an unflattering one.
    strong_signal: >
      The buyer restates the capability unprompted in their own words, and names the manual
      step it removes.

  - name: Operational value
    asks: "What changes in how the work actually runs on a Monday, for which team, and how many people feel it?"
    objects: [sales.obj.core.stakeholder, sales.obj.core.pain_point, sales.obj.core.persona]
    weak_signal: >
      Time savings expressed per user per week with no headcount behind them. Two hours a
      week saved by four people is not a business case, it is a rounding error with a slide.
    strong_signal: >
      A named process, its current cycle time, the number of people in it, and the owner of
      that team agreeing the number is right.

  - name: Economic value
    asks: "Which line, on whose P&L, moves — from what baseline, by how much, by when?"
    objects: [sales.obj.core.budget, sales.obj.core.decision_maker, sales.obj.core.proposal, sales.obj.core.pricing]
    weak_signal: >
      A multiple with no denominator — "10x ROI". Finance discounts unsourced multiples to
      zero, and the seller never learns because the deal dies as "no decision" months later.
    strong_signal: >
      A one-page case the buyer's own finance function has already amended. Amendments are
      the proof of engagement; a case returned untouched was never read.

  - name: Strategic value
    asks: "Which published company priority does this advance, and which executive is accountable for that priority this year?"
    objects: [sales.obj.core.company, sales.obj.core.account, sales.obj.core.opportunity]
    weak_signal: >
      A priority lifted from the annual report and repeated back verbatim. Every vendor in
      the evaluation read the same report; quoting it signals research, not insight.
    strong_signal: >
      An executive sponsor connects the purchase to a target they are personally measured
      on, in a meeting the seller did not have to chase.

  - name: Personal value
    asks: "What does each individual gain if this succeeds, and lose if it fails — career risk, credit, workload, standing?"
    objects: [sales.obj.core.champion, sales.obj.core.stakeholder, sales.obj.core.decision_maker]
    weak_signal: >
      No answer at all, because the seller has never considered it. This is the tier every
      vendor deck omits and a large share of enterprise deals turn on.
    strong_signal: >
      The champion says some version of "I need this to work" — they have attached their
      own name to the outcome, which is the only reliable definition of a champion.

how_to_apply:
  - >
    Identify the tier the person in front of you is measured on and start there. A user buyer
    interrupted with strategic narrative concludes you do not understand their job, and they
    are right.
  - >
    Anchor every quantified claim to a baseline the buyer supplied. If the baseline came from
    your marketing team, the claim is a hypothesis and should be spoken as one.
  - >
    Climb tiers WITH the buyer, never on your own. A business case the champion did not
    co-author gets restated wrongly to the CFO, and you will not be in the room to correct it.
  - >
    Test the climb by asking the champion to explain the case back to you with the deck closed.
    Whatever survives that is the case; the rest is your deck.
  - >
    Clear the conformance tier early and in writing. It is the only tier where being late is
    fatal regardless of how good the rest is.
  - >
    Before discounting, check which tier the resistance sits on. Price resistance at the
    economic tier is an arithmetic problem; price resistance at the personal tier is a fear
    problem, and a discount makes the second one worse by suggesting the first number was
    invented.
  - >
    Re-run the pyramid after any champion change. Personal value is the least portable tier —
    it belongs to a person, not to the account.

objects_used:
  - sales.obj.core.business_need
  - sales.obj.core.pain_point
  - sales.obj.core.proposal
  - sales.obj.core.pricing
  - sales.obj.core.budget
  - sales.obj.core.deal
  - sales.obj.core.opportunity
  - sales.obj.core.champion
  - sales.obj.core.decision_maker
  - sales.obj.core.stakeholder
  - sales.obj.core.persona
  - sales.obj.core.competitor
  - sales.obj.core.account
  - sales.obj.core.company
  - sales.obj.core.risk
  - sales.obj.core.contract

limits:
  - >
    Requires a quantifiable baseline. In a genuinely new category the buyer has no current-state
    numbers to anchor against, and the economic tier degenerates into arithmetic performed on
    invented inputs — which a CFO detects immediately.
  - >
    Assumes an economic buyer exists. In self-serve and card-swipe purchases there is no P&L
    conversation to have, and tiers four and five are dead weight.
  - >
    Says nothing about whether the buyer will act. A large, well-evidenced value gap with no
    compelling event sits open indefinitely; pair this with sales.mm.core.status_quo_bias.
  - >
    Value above the switching cost is necessary and not sufficient. Buyers routinely decline
    a positive-NPV change because the disruption lands on a team that did not ask for it.
  - >
    Where price is set by a framework or a published rate card, the economic tier is not a
    persuasion surface — it is a compliance exercise.

failure_modes:
  - >
    Building the value case alone and presenting it as fact. The buyer's first act is to look
    for the wrong assumption, and there is always one; the case is then dead and so is your
    credibility on numbers.
  - >
    Quantifying value carefully and then discounting heavily. You have just told the buyer the
    value number was decoration, and they will apply the same scepticism to the next one.
  - >
    Treating the top of the pyramid as the goal. Strategic framing aimed at a technical
    evaluator reads as evasion of the question they asked.
  - >
    Skipping conformance because it is unglamorous. Deals die in security review with a perfect
    business case attached.
  - >
    Confusing personal value with flattery or inducement. Personal value is the champion's
    genuine professional stake; anything transactional is a different conversation with a
    compliance function attached to it.
  - >
    Letting the case go stale. Baselines move — a reorganisation can hand the pain to somebody
    who has not agreed it exists.

variants:
  - applies_to: sales.model.plg
    change: >
      The pyramid collapses to conformance and functional value during acquisition, and is only
      rebuilt at the expansion conversation. Value must be self-evident inside the product in a
      single session.
    why: >
      Nobody reads a business case before signing up for a trial. The economic tier becomes
      relevant when Finance notices the aggregate card spend, which is an expansion event, not
      an acquisition one.
  - applies_to: sales.model.enterprise_sales
    change: >
      All six tiers are in play simultaneously with different owners, and the conformance tier
      is staffed by people who can say no and never yes.
    why: >
      Eight to fifteen people evaluate on different criteria. A single-tier narrative will be
      correct for one of them and wrong for the rest.
  - applies_to: sales.model.government_sales
    change: >
      The personal tier is not available and should not be sought. Strategic value means a
      published policy objective, and economic value means the evaluation formula in the tender.
    why: >
      Probity rules make individual benefit a disqualifying conversation, and the scoring
      weights are published, so the economic tier is arithmetic rather than persuasion.
  - applies_to: sales.model.channel_sales
    change: >
      A second pyramid exists for the partner — margin, attach rate, services drag, competitive
      protection — and it is evaluated before the end customer's pyramid ever gets built.
    why: >
      The partner is a buyer of your programme, not a distribution pipe. A partner who cannot
      see their own economic tier will not carry yours.
  - applies_to: sales.offering.service
    change: >
      Economic value is staged into a delivery plan with dated milestones, because most of it is
      realised after signature.
    why: >
      For services the value is produced by work not yet done. An undated benefit claim in a
      services proposal is a claim about a team the buyer has not met.
  - applies_to: sales.model.smb_sales
    change: >
      The economic tier is the owner's cash and the payback horizon is months, not years. Tiers
      three to six collapse into one person.
    why: >
      In an owner-led purchase the operational, economic, strategic and personal tiers are all
      held by the same head, and a multi-year NPV argument reads as a way of avoiding the price.

metrics:
  - name: buyer_sourced_baseline_rate
    unit: percent
    description: >
      Share of quantified value claims in the business case whose baseline came from the buyer
      rather than from the vendor.
    direction: higher_is_better
  - name: value_case_amendment_count
    unit: count
    description: >
      Number of edits the buyer's own finance function made to the case. Zero usually means
      unread, not agreed.
    direction: higher_is_better

references:
  - title: "The B2B Elements of Value"
    kind: research
    author: "Eric Almquist, Jamie Cleghorn, Lori Sherer (Bain, Harvard Business Review 2018)"
    note: >
      Forty elements in five tiers, from table stakes to inspirational. The empirical source for
      treating conformance as a tier rather than as an afterthought.
  - title: "Mastering Technical Sales"
    kind: book
    author: "John Care and Aron Bohlig"
    note: "The discipline of tying a demonstrated capability to a business metric someone owns."
  - title: "Command of the Message"
    kind: methodology
    author: "Force Management"
    note: "Positive business outcomes, required capabilities, metrics and proof — the upper tiers, operationalised."
  - title: "The Challenger Sale"
    kind: book
    author: "Matthew Dixon and Brent Adamson"
    note: "Commercial teaching as the mechanism for moving a buyer up a tier rather than merely describing one."
  - title: "SPIN Selling"
    kind: book
    author: "Neil Rackham"
    note: >
      Implication and need-payoff questions are how a buyer climbs the pyramid themselves;
      Rackham's data showed value asserted by the seller underperforms value stated by the buyer.

