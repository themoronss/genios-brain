purpose:
  statement: "The profile is the ruler; a fit assessment is one reading taken with it. Keep them separate\
    \ objects and argue about the reading.\n When they are conflated, every inconvenient account becomes\
    \ a reason to edit the definition, and the definition is the one thing that must be stable enough\
    \ to be wrong in a detectable way.\n"
