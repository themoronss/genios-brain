purpose:
  statement: "The profile is a bet about the next year, evidenced by the last two.\n Markets move, categories\
    \ mature and competitors reprice. A profile validated on a market that has since consolidated describes\
    \ a shape that no longer exists, and it will keep validating cleanly against history the whole time\
    \ it is wrong about the future.\n"
