purpose:
  statement: "Fit is a property of the pairing, not of the account. Half the profile is a statement\
    \ about us.\n Change the price, the packaging or the implementation model and accounts move across\
    \ the boundary without changing at all. A profile that has not been revisited since the last pricing\
    \ change is stale by construction, and nobody thinks to revisit it because nothing about the market\
    \ moved.\n"
