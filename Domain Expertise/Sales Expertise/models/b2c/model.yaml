# B2C — model branch node.
#
# INHERITANCE: this file declares only what DIFFERS from its parent. Capability and object
# files are NOT copied into this branch; resolution is vertical -> model -> canonical.

identity:
  id: sales.model.b2c
  name: B2C
  kind: model
  domain: sales
  parent: null
  version: 0.1.0
  status: draft
  stub: false

description: >
  Selling to an individual for their own use. One person decides, usually quickly, often
  without speaking to anyone. Most of the qualification subdomain does not exist here, and
  loading it produces committee analysis on a customer who is buying a pair of shoes.

characteristics:
  buyer: "one individual, spending their own money"
  typical_cycle_days: 1
  typical_acv: "two to four figures"
  committee_size: "1"
  decision_style: "individual, often emotional, frequently instant"
  primary_channels: [web, mobile, email, social]

capabilities:
  deactivates:
    - sales.qualification.buying_committee_analysis
    - sales.qualification.stakeholder_mapping
    - sales.closing.procurement
    - sales.closing.legal_review
    - sales.sales_management.deal_review
    - sales.revenue_operations.territory_planning
  emphasises:
    - sales.market_and_targeting.icp_definition
    - sales.post_sale_and_growth.churn_prevention
    - sales.post_sale_and_growth.onboarding

objects:
  extends:
    - object: sales.obj.core.decision_maker
      note: >
        In B2C the decision maker and the user are the same person, so authority_level is
        always final_approver and approval_limit is their own wallet. The object still loads;
        almost none of its inference machinery is needed.

metadata:
  owner: Sales
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: experimental
