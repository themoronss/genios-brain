# Government Sales — model branch node.
#
# INHERITANCE: this file declares only what DIFFERS from its parent. Capability and object
# files are NOT copied into this branch; resolution is vertical -> model -> canonical.

identity:
  id: sales.model.government_sales
  name: Government Sales
  kind: model
  domain: sales
  parent: null
  version: 0.1.0
  status: draft
  stub: false

description: >
  Selling into public-sector procurement. Formal, tendered, transparent and slow. Relationship
  matters far less than compliance with a published process, and attempting to shortcut it is
  usually disqualifying rather than merely ineffective.

characteristics:
  buyer: "a public body, through a mandated procurement process"
  typical_cycle_days: 270
  committee_size: "5-15"
  decision_style: "scored tender against published criteria"

capabilities:
  deactivates:
    - sales.prospecting_and_outreach.cold_calling
  emphasises:
    - sales.closing.procurement
    - sales.closing.legal_review
    - sales.proposal_and_commercials.proposal_creation

objects:
  extends:
    - object: sales.obj.core.timeline
      require_properties: [compelling_event, event_date]
      note: >
        Tender deadlines are hard, published and externally verifiable — the one motion where
        the compelling event is never in doubt.

metadata:
  owner: Sales
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: experimental
