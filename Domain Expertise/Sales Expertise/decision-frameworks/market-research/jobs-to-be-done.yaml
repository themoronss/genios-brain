purpose:
  statement: "Jobs To Be Done, with the four forces of switching: push of the current situation, pull\
    \ of the new, habit of the present, and anxiety about the new.\n It is the only common framework\
    \ that models why a buyer with an obvious problem does nothing anyway. Habit and anxiety are the\
    \ two forces our own materials never address and they are why the no-decision competitor keeps winning.\n"
