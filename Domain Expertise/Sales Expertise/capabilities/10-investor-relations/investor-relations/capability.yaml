metadata:
  owner: Sales
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-25'
  review_status: approved
  confidence: experimental
  reviewed_at: '2026-08-25'
  notes: 'Authored for the 11 `investor_relationship` situations the design partner''s org produces
    — six funds, three accelerator programmes, an introduction network and the org''s own domain. Until
    this existed those 11 failed at the resolver''s domain check, before any route was consulted: Layer
    2 types them `fundraising`, and the corpus had no such domain.


    It lives in the Sales corpus for an authority reason, not a taxonomic one — a compiled signal can
    only carry authority in a pack lane the tenant holds. Every line above is written to refuse the
    deal reading that placement invites.


    Note what is NOT here: no thresholds, no scores, no rules. Those are Layer 4''s arithmetic and live
    in the pack manifest. A number appearing in a capability file means the Layer 3/4 boundary has leaked.

    '

