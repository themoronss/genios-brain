metadata:
  owner: Sales
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-08'
  review_status: approved
  confidence: provisional
  notes: 'Two scoped objects carry this capability''s inference: market_map and market_finding, with twenty-three
    patterns between them of which eleven are executable and twelve are blocked. The single highest-value
    signal gap is cross-account aggregation — a segment key on the account plus a derived aggregate over
    it. Every predicate in the grammar is evaluated against one node and its one-hop neighbours, so a
    capability whose subject is a population is currently forced to infer that population from one deal
    at a time. That one addition would unblock most of the blocked half here and in tam_sam_som and icp_definition
    too. Note also that only field-feedback situations bind: nothing Layer 2 emits fires before a deal
    exists, which is where most of this capability actually lives.

    '
  reviewed_at: '2026-08-24'
