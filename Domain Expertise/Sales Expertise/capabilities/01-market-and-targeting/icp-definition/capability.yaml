metadata:
  owner: Sales
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-08'
  review_status: approved
  confidence: provisional
  notes: 'Promoted from stub. Two scoped objects authored — Fit Analysis and Disqualifier — carrying twenty
    inference patterns between them, of which nine are executable against the pipeline today and eleven
    are blocked. The executable half is lopsided in a revealing way: every pattern that runs infers fit
    from DEAL BEHAVIOUR (graph shape, value band, observation mix) and not one infers it from what the
    account actually is, because no firmographic fact is projected. The single highest-value gap is account.industry
    / account.employee_count / account.geography as typed Layer 1 facts — the cheapest enrichment in the
    stack, absent, and it disables the anti-fit half of this capability entirely. The runner-up is a retention
    signal: the profession validates a profile on retention, Layer 2 emits contract_requested and nothing
    about the second contract, so the brain can watch every deal close and never learn whether the account
    was worth closing.

    '
  reviewed_at: '2026-08-24'
