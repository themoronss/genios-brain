identity:
  id: sales.market_and_targeting.icp_definition
  name: ICP Definition
  domain: sales
  subdomain: market_and_targeting
  version: 1.0.0
  status: stable
  stub: false
description: 'Deriving and validating the profile of an account that wins AND retains, stating it in dimensions
  that can be evaluated before anyone has spoken to the account, and publishing the anti-fit half — disqualifiers,
  known loss patterns, churn predictors — which is the operationally useful half and the one most often
  left unwritten. It is NOT market research (which asks whether a market exists), NOT market sizing (which
  asks how large it is), and NOT qualification (which asks whether one live opportunity is real). Those
  three are about the market and the deal; this one is about us — which accounts our product, our price
  and our delivery model actually serve. The output is a classifier, and its worth is measured by what
  it rejects.

  '
question: Which accounts reliably succeed with us, and which reliably do not?
outcomes:
- A profile stated in dimensions that can be evaluated for an account nobody has spoken to — each dimension
  checkable from public data or an early conversation, not from a discovery call that has already been
  paid for.
- 'A published, enforced disqualifier list. This is the negative outcome and the one that makes the capability
  operational: a profile that only says yes cannot say no, and saying no is the entire point.'
- Every claimed dimension carries its cohort evidence — the won-and-retained, lost and churned accounts
  that put it there. Dimensions with no evidence behind them stay labelled hypothesis rather than quietly
  becoming policy.
- Retention evidenced per segment, not only win rate. A segment that closes fast and churns early passes
  every test a win-rate-only profile can apply.
- Open pipeline scored against the profile, with out-of-profile deals named rather than tolerated.
- A review cadence set, and profile drift raised as a finding for a human rather than absorbed by silently
  widening the profile.
failure_modes:
- Building the profile from the accounts the company wishes it had. It reads well, describes nobody in
  the pipeline, and is therefore never used — the most common outcome of this work.
- Listing what customers have in common instead of what separates them from the accounts that were lost.
  Every won account has a website, a founder and a budget line; only attributes that DIFFER between cohorts
  carry any information, and a profile built on shared attributes cannot discriminate.
- Firmographics only. Industry and headcount are the cheapest fields to obtain and among the least predictive,
  so the profile that costs least to build is the one that separates least.
- No disqualifiers, because agreeing on who to reject is politically harder than agreeing on who to want.
  The anti-fit list is the part that saves time on day one and the part that gets deferred.
- Silent widening. Each out-of-profile deal is waved through as a one-off, no exception is recorded, and
  within two quarters the profile describes nothing and constrains nobody.
- Written once, then left. A pricing change, a new tier or a shift in the delivery model invalidates half
  the profile — fit is a joint property of the account and of us — and the document does not move.
kpis:
- name: in_profile_win_rate_delta
  unit: percentage_points
  direction: higher_is_better
  description: Win rate inside the profile minus outside. The single test of whether the profile is a
    classifier. Near zero means everything downstream that depends on it is noise dressed as strategy.
- name: in_profile_retention_delta
  unit: months
  direction: higher_is_better
  description: Retention inside the profile minus outside. The gate the win-rate metric cannot substitute
    for.
- name: out_of_profile_pipeline_share
  unit: percent
  direction: lower_is_better
  description: How much of open pipeline ignores the profile. Measures whether it is used or merely published.
- name: disqualification_rate
  unit: percent
  direction: target_band
  description: A target band, not a maximum. Near zero means the anti-fit list is not being applied; very
    high means it has quietly taken over account selection.
- name: profile_drift
  unit: percent
  direction: lower_is_better
  description: Share of recent won-and-retained accounts falling outside the profile. Rising drift is
    a finding to raise, never a threshold to widen.
- name: time_to_fit_verdict
  unit: hours
  direction: lower_is_better
  description: First touch to a recorded verdict. A profile that needs a research project to apply will
    not be applied, whatever its quality.
