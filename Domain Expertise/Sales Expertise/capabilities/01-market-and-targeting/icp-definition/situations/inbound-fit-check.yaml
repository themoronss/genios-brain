# The one pre-deal moment where ICP expertise is genuinely runtime-triggered: interest arrives
# and somebody has to decide whether to spend a quarter on it. Every other part of this
# capability is planning work no Layer 2 signal fires for.

identity:
  id: sales.sit.inbound_fit_check
  name: Inbound Fit Check
  domain: sales
  owner_capability: sales.market_and_targeting.icp_definition
  version: 1.0.0
  status: stable

description: >
  Interest has arrived from an account nobody has assessed, and the question before any other
  question is whether this account is one we should want. What distinguishes it from
  qualification, which fires on the same signals: qualification asks whether THIS purchase can
  happen — money, authority, timing — and it is the right question about a good-fit account.
  This situation asks the prior one, whether the account belongs in the pipeline at all, and it
  is answerable in minutes from public data where qualification takes a discovery call. Running
  them in the wrong order is how teams qualify their way carefully into accounts they should
  never have replied to.

matches:
  l2_situation_types:
    - opportunity
    - prospect_relationship
  scope: account
  # No condition on `deal.*`, for the reason below — and two that are not about a deal at all.
  # The note is right that a deal-shaped predicate would suppress this at exactly the moment it
  # is cheapest to act on. It does not follow that NOTHING should narrow it: with no `when` at
  # all this fired on every account in the org, including customers of three years, and asked
  # the reader to assess whether they belong in the pipeline.
  #
  # `ball_in_court = us` is the "interest has arrived" half of this file's own description, and
  # the degree bound is the "account nobody has assessed" half.
  when:
    - {path: thread.ball_in_court, op: "=", value: us}
    - {fn: edge_count, op: "<=", value: 3}

also_serves:
  - sales.qualification.lead_qualification
  - sales.prospecting_and_outreach.lead_generation
  - sales.prospecting_and_outreach.account_research

objects:
  load:
    - sales.obj.core.icp
    # Anti-fit resolves before the score — a match ends the assessment, and ending early is
    # the entire economic case for running this situation at all.
    - sales.obj.icp_definition.disqualifier
    - sales.obj.icp_definition.fit_analysis
    - sales.obj.core.company
  optional:
    - sales.obj.core.account
    - sales.obj.core.persona
  never_load:
    # Nothing about committee structure, authority, money or dates is knowable before the
    # first conversation. Loading these objects does not merely waste a compile: each carries
    # inference patterns that will happily resolve to `unknown` and be read downstream as
    # "assessed and absent" rather than "never checked". A confident, empty committee map on
    # an account nobody has spoken to is worse than no map, because the seller stops looking.
    - sales.obj.core.buying_committee
    - sales.obj.core.decision_maker
    - sales.obj.core.budget
    - sales.obj.core.timeline

priority_bp: 6500
typical_duration_days: 2

signals_of_progress:
  - demo_requested
  - introduction
  - pricing_discussed
  - budget_approved

signals_of_decay:
  - budget_freeze
  - objection_price
  - closed_lost_mention

render:
  artifact_kind: draft_reply
  render_hint: >
    This card answers ONE question: is this account one we should want, before anyone spends a
    discovery call on it. Say nothing about deal stage, budget, timeline, close date or "open
    items" — none of those exist at a fit check, and asserting them is precisely the misread
    this situation exists to prevent.

    Headline: the account and the fit judgment, in the reader's terms — what about this account
    matches or contradicts who we sell to. If the evidence does not support a fit read, put the
    fit question itself in the headline; never narrate the shortfall ("fit unknown, no context
    yet", "no facts to assess fit" both shipped to a real user and told him nothing he could act
    on). Never a status line, never a generic phrase.

    Situation: the one or two specifics from what they actually wrote that decide fit — what
    they do, what they asked for, who they are. Evidence, not process vocabulary.

    Artifact: a short reply that moves the fit question forward — ask the single thing that
    would settle it, or engage directly when fit is already clear. Never a generic follow-up.
  fallback:
    headline: "{entity} — fit not assessed"
    situation: >-
      Interest arrived from {entity} and nobody has judged yet whether it fits who we sell to.
    # "Nobody has judged yet" is the state of our own assessment, not of the account. 4 of the
    # design partner's 47 live cards came from here on 2026-08-30 and 3 read as pure absence
    # ("afore.vc — fit unknown, no context yet", "suvan.vc — no facts to assess fit"), all at
    # level `prescriptive` — an order to do nothing nameable. The fit question is worth putting
    # in front of a human; it is not worth putting in front of one as a command.
    states_absence: true

metadata:
  owner: Sales
  created_by: ai
  reviewed_by: harsh
  last_updated: "2026-08-08"
  review_status: approved
  reviewed_at: '2026-09-01'
  confidence: provisional
  notes: >
    Bound to three of the twenty-six Layer 2 types, and all three are inbound-interest types
    rather than deal-state types — the binding is narrow on purpose, because a targeting
    capability that claims deal signals ends up second-guessing qualification. Nearly all the
    knowledge loaded here is currently blocked on firmographic enrichment: with no
    account.industry, account.employee_count or account.geography reaching the engine, the
    disqualifier list cannot fire and the fit reading is limited to what the first reply
    reveals, which arrives after the effort this situation exists to save.

    HELD AT DRAFT ON PURPOSE, 2026-09-01 — this is a recorded decision, not an unfinished file.

    Every reading here turns on whether an enquiry fits who we sell to, and NOTHING IN THIS
    SYSTEM HOLDS A CUSTOMER PROFILE. `sales.obj.core.icp` is an object with no fact writer
    anywhere in Layer 2. Promoting this would ship a card that asks the reader to judge fit
    against a definition the product cannot see, on every account, with no gate at all.

    It becomes real the day an ICP is stored — a tenant-stated profile, not an inferred one.
    Until then the honest state is draft, where the abstention gate keeps anything built from it
    non-prescriptive.

    Promoted from draft on 2026-09-01, once `icp` became one of the things a company can state
    about itself (`capture/internal_knowledge.INTERNAL_KINDS`). Before that this file asked the
    reader to judge fit against a definition the product had nowhere to hold — the card could
    pose the question but never show what to answer it against.

    `sales.obj.core.icp` stays in the load-set and no predicate touches it: where a tenant has
    stated a profile the card can show it, and where none exists the honest output is the
    question plus a prompt to state one. Gating on the object would make the situation
    unroutable for every tenant that has not written their profile down yet, which is most of
    them on day one.

