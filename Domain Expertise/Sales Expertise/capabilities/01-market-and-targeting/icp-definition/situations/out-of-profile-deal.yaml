# A decaying deal, read as a fit question rather than as a rescue problem. This is the second
# and last runtime moment ICP Definition genuinely owns, and it is the one that produces the
# evidence every other part of the capability depends on.

identity:
  id: sales.sit.out_of_profile_deal
  name: Out-of-Profile Deal
  domain: sales
  owner_capability: sales.market_and_targeting.icp_definition
  version: 1.0.0
  status: stable

description: >
  A live deal decaying in the way accounts outside the profile characteristically decay:
  interest without economics, engagement without a funded buyer, effort scaling faster than
  the contract value. What distinguishes it from the stalled-deal situations its neighbours
  own is the question asked, not the symptoms observed — deal review and pipeline management
  ask how to un-stall it, and this asks whether it should have been in pipeline at all. Both
  readings are legitimate on the same deal and they lead opposite ways, which is why this
  situation deliberately loads none of the relationship objects a rescue plan would need. The
  second purpose is calibration: a deal ending is the only moment the profile receives
  evidence, and a stall closed out without a fit reading is a lesson thrown away.

matches:
  l2_situation_types:
    - deal
    - opportunity
  scope: deal
  when:
    # Only on live deals. Once the deal closes the reading becomes calibration, which is a
    # different job with a different confidence and no urgency attached to it.
    - {path: deal.status, op: "=", value: open}
    # "INTEREST WITHOUT ECONOMICS" — this file's own first symptom, and the one of the three
    # that is checkable without inventing anything. `deal.value` absent on a live deal means
    # effort is going into something whose economics nobody has recorded, which is exactly the
    # reading this situation exists to force.
    #
    # The other two symptoms it names — "engagement without a funded buyer", "effort scaling
    # faster than the contract value" — need a funded-buyer fact and an effort measure, neither
    # of which exists. Left to the render hint as questions rather than asserted as findings.
    - {absent: deal.value}

also_serves:
  - sales.sales_management.deal_review
  - sales.revenue_operations.pipeline_management
  - sales.qualification.lead_qualification

objects:
  load:
    - sales.obj.core.icp
    - sales.obj.icp_definition.disqualifier
    - sales.obj.icp_definition.fit_analysis
    - sales.obj.core.account
    - sales.obj.core.deal
  optional:
    - sales.obj.core.company
    - sales.obj.core.competitor
  never_load:
    # Excluded because loading them answers the wrong question convincingly. Champion and
    # committee are the raw material of a rescue plan, and a compile holding both will
    # produce one — a well-reasoned multithreading sequence for an account that should be
    # closed out. The failure this situation exists to catch is a team working an
    # out-of-profile deal competently for another two quarters, and the surest way to cause
    # it is to hand them a good plan for doing so.
    - sales.obj.core.champion
    - sales.obj.core.buying_committee

priority_bp: 5500
typical_duration_days: 14

# Progress here means the fit reading was wrong in the useful direction — which is a finding,
# not an embarrassment, and the only kind of evidence that ever narrows a bad profile.
signals_of_progress:
  - budget_approved
  - proposal_sent
  - verbal_yes
  - contract_requested

signals_of_decay:
  - timeline_slip
  - discount_pressure
  - budget_freeze
  - competitor
  - closed_lost_mention

render:
  artifact_kind: brief
  render_hint: >
    Headline: A DIRECT ORDER — verb first, name who. Never a status line and never a day count on its own; the reader already knows time passed.

    This asks whether the deal should have been in pipeline at all — NOT how to un-stall it. Its
    neighbours own the rescue reading and they lead the opposite way, so never write a save plan
    here.

    Headline: the account and that a live deal carries no recorded value.

    Situation: how long the deal has been open and that nothing on record says what it is worth.
    Where the tenant has stated an ICP, name the one or two criteria this account can be checked
    against. Where they have not, say the profile has never been written down — that is the
    finding, and it is the cheaper thing to fix.

    Artifact: the two questions that settle it — what is this worth, and does this account match
    who we sell to. Offer closing it out as a legitimate answer; a deal ending is the only moment
    the profile receives evidence, and a stall closed without a fit reading is a lesson thrown
    away.

    Never assert that the account is out of profile. Nothing here compares firmographics, and
    calling an account unfit on the absence of a value field would be a finding this system
    invented about somebody's customer.
  fallback:
    headline: "Price the {entity} deal or close it out"
    situation: >-
      The {entity} deal has been open {days} days and nothing on file says what it is worth.

metadata:
  owner: Sales
  created_by: ai
  reviewed_by: harsh
  last_updated: "2026-08-08"
  review_status: approved
  reviewed_at: '2026-09-01'
  confidence: provisional
  notes: >
    Bound to three deal-decay types, all shared with capabilities that will read them
    differently — that overlap is intended, because a stalling deal genuinely has two honest
    readings and the expensive error is running only the rescue one. Unlike the inbound
    situation, most of the knowledge loaded here can actually fire today: the executable
    patterns on Fit Analysis and Disqualifier all key off deal behaviour, which is exactly
    what Layer 2 emits. The gap that would improve this situation most is a loss REASON on
    closed_lost_mention — without it every reading taken here dies with the deal instead of
    grouping into the loss cohort that would evidence a disqualifier.

    HELD AT DRAFT ON PURPOSE, 2026-09-01 — same reason as `inbound_fit_check`, and worse.

    "Out of profile" is a comparison against a profile, and no profile exists in this system.
    The only gate this file carries is `deal.status = open`, so promoting it would label every
    open deal out-of-profile against a standard nobody has written down. That is not a thin
    card; it is a wrong one.

