identity:
  id: sales.qualification.lead_qualification
  name: Lead Qualification
  domain: sales
  subdomain: qualification
  version: 1.0.0
  status: stable
  stub: false
description: 'Establishing whether a real purchase is possible: whether money exists, whether someone
  can approve it, whether there is a reason to act now, and whether the account is one we should want.
  Qualification is a filter, not a stage — its output is as often a disqualification as a next step, and
  a capability that only ever says yes is not qualifying anything.

  '
question: Is a real purchase possible here, with whom, and by when?
outcomes:
- Budget state established above `unknown` — funded, unfunded intent, or explicitly none.
- A Decision Maker identified at 60% confidence or better, with authority verified rather than inferred
  from title.
- A compelling event established, or its absence recorded as an absence.
- Fit scored against the ICP, with disqualifiers checked.
- 'An explicit verdict: pursue, nurture, or disqualify. `Continue by default` is not an outcome.'
failure_modes:
  - >
    Qualifying on interest instead of on purchase. A demo booked, a deck downloaded and a
    reply within the hour all read as progress and none of them is evidence that money can
    move. The question this capability asks is whether a purchase is POSSIBLE; enthusiasm is
    an input to that answer and is routinely mistaken for it.
  - >
    Taking authority from a title. "Head of" resolves to a decision maker in the CRM and to
    a recommender in the room, and the two are indistinguishable on a business card. The
    outcome demands authority VERIFIED rather than inferred, and the verification is one
    question nobody enjoys asking.
  - >
    Recording an absent compelling event as an unknown. "No deadline mentioned" and "we
    asked and there is none" are the same field and opposite facts: the first is work not
    done, the second is a qualified answer. Collapsing them is how a pipeline fills with
    deals that were never going to close this quarter and never said so.
  - >
    Budget state left at `unknown` because asking felt early. It is the cheapest field to
    leave blank and the most expensive one to be wrong about, and it stays blank precisely
    on the deals where the answer would have changed what happened next.
  - >
    `Continue by default`. The capability's own outcome forbids it and it remains the most
    common verdict in every pipeline: nothing was disqualified, nothing was committed to,
    and the deal advances on the absence of a decision rather than the presence of one.
  - >
    Disqualifying on fit alone while the ICP is stale. A profile written before a pricing
    change will reject the accounts the company can now serve, and it will do so quietly,
    because a disqualified lead generates no argument and no review.
  - >
    Re-qualifying from the record instead of from the counterparty. Six weeks on, the budget
    line, the sponsor and the deadline have all moved, and the qualification that is read
    back is the one taken when the deal was new. A qualification has a shelf life and the
    record does not say so.

kpis:
- name: qualification_rate
  unit: percent
  description: Share of leads reaching a verdict either way.
- name: disqualification_rate
  unit: percent
  description: If this is near zero the capability is not running, whatever the dashboard says.
- name: time_to_verdict
  unit: days
- name: qualified_to_won
  unit: percent
  description: Win rate of qualified deals. Measures whether the bar is real.
- name: false_qualification_rate
  unit: percent
  description: Qualified deals later lost to budget or authority. Calibrates the gates.
handoffs:
  upstream:
  - sales.prospecting_and_outreach.lead_generation
  - sales.prospecting_and_outreach.account_research
  downstream:
  - sales.qualification.decision_maker_identification
  - sales.qualification.buying_committee_analysis
  - sales.discovery_and_solution.discovery
  - sales.discovery_and_solution.need_analysis
applies_to:
  models:
  - b2b
  - b2b2c
  - enterprise
  - mid_market
  - smb
  - inside_sales
  - government
  - channel
  - partner
  offerings:
  - product
  - service
  - hybrid
metadata:
  owner: Sales
  created_by: ai
  reviewed_by: rohit
  last_updated: '2026-08-08'
  review_status: approved
  confidence: provisional
  notes: 'Note what is NOT here: no thresholds, no scores, no rules. Those are Layer 4''s arithmetic and
    live in the pack manifest. This file declares which knowledge to load and what the capability is for.
    The moment a number appears in a capability file, the Layer 3/4 boundary has leaked.

    '
  reviewed_at: '2026-09-30'

