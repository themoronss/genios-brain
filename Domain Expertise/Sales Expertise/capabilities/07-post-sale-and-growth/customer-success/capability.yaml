identity:
  id: sales.post_sale_and_growth.customer_success
  name: Customer Success
  domain: sales
  subdomain: post_sale_and_growth
  version: 0.1.0
  status: stable
  stub: false
description: 'Ongoing management of realised value, adoption and relationship health. Distinct from support:
  support answers questions, success ensures the original business case is met.

  '
question: Is the customer getting the outcome they bought?
outcomes:
- Relationship state established above `unknown` — active, dormant, or at risk — from observed
  contact rather than from the last CRM edit.
- 'The current open loop named: what we owe them, or what we are waiting on, or neither.'
- Adoption of the thing they actually bought assessed, separately from how warm the last email felt.
  A friendly thread on an unused product is a churn signal, not a health signal.
- 'An explicit verdict: nurture, intervene, or leave alone. `Stay in touch` is not an outcome — it
  is what gets written when nobody decided.'
- Where the relationship carries no opportunity, that is recorded as a fact and not treated as a
  stalled deal. Reading a healthy non-buying relationship as a lost one is this capability''s
  most expensive failure and the reason it exists apart from the deal capabilities.
failure_modes:
  - >
    Reading warmth as health. A friendly thread on an unused product is the single most
    reliable precursor to a churn nobody saw coming, and it presents as the healthiest
    signal in the account. The capability's own outcome separates adoption from tone for
    this reason, and the separation is the first thing abandoned under time pressure.
  - >
    Taking relationship state from the last CRM edit. The field says `active` because
    somebody typed it, not because anybody spoke. Observed contact and recorded status
    diverge silently and always in the optimistic direction, because nobody updates a record
    to say a relationship has gone quiet.
  - >
    `Stay in touch`. The outcome names it explicitly: it is what gets written when nobody
    decided. It survives review because it is never wrong, and it commits no one to
    anything, which is the same property.
  - >
    Treating a healthy non-buying relationship as a stalled deal. The capability exists
    apart from the deal capabilities precisely to prevent this, and the pressure to reclassify
    a good relationship as pipeline is strongest exactly when the forecast is short.
  - >
    Measuring the outcome the vendor sells instead of the one the customer bought. Usage of
    the product is not the same as the result it was purchased for, and a capability that
    reports the first while the second is failing will be confidently wrong for two quarters.
  - >
    Escalating on a single bad interaction. One curt reply is noise; a pattern is a signal,
    and the difference requires history this capability must go and read rather than infer
    from the message in front of it.
  - >
    An open loop named on our side only. "What we owe them" is easy to see and "what we are
    waiting on" is invisible until it is late — and a relationship where WE are the blocker
    and nobody recorded it is the one that ends without a conversation.

kpis:
- name: relationship_coverage
  unit: percent
  description: Share of active accounts with a relationship state newer than their last inbound.
- name: dormancy_detection_lead_time
  unit: days
  description: Days between engagement decaying and the decay being surfaced. The whole value of
    the capability is in this number being smaller than the renewal notice period.
- name: intervention_rate
  unit: percent
  description: Share of assessments producing an action. Near zero means the capability describes
    and never decides.
- name: silent_churn_rate
  unit: percent
  description: Accounts lost with no prior at-risk verdict. Calibrates whether the decay signals
    are the right ones.
handoffs:
  upstream:
  - sales.post_sale_and_growth.onboarding
  - sales.prospecting_and_outreach.account_research
  downstream:
  - sales.post_sale_and_growth.churn_prevention
  - sales.post_sale_and_growth.renewal
  - sales.post_sale_and_growth.expansion
applies_to:
  models:
  - b2b
  - b2b2c
  - enterprise
  - mid_market
  - smb
  - inside_sales
  - channel
  - partner
  offerings:
  - product
  - service
  - hybrid
metadata:
  owner: Sales
  created_by: ai
  reviewed_by: rohit
  last_updated: '2026-08-08'
  review_status: approved
  confidence: experimental
  notes: 'Promoted out of Phase-1 stub. It owns the largest bucket L2 produces — 25 of 60 active
    situations on the design partner''s org are plain `relationship`, and until this capability left
    stub state no route could form for any of them, so they were never reasoned about at all.

    Note what is NOT here: no thresholds, no scores, no rules. Those are Layer 4''s arithmetic and
    live in the pack manifest. A number appearing in a capability file means the Layer 3/4 boundary
    has leaked.

    '
  reviewed_at: '2026-09-30'

