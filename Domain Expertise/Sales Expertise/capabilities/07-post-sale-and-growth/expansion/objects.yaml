# Load-set for sales.post_sale_and_growth.expansion — REFERENCES ONLY, never an inline object.
#
# core   -> objects/core/            loaded by more than one capability
# scoped -> objects/expansion/              loaded by this capability alone
#
# required = a missing one blocks the compile.
# optional = absence lowers confidence rather than blocking (Layer 3 strategy S8) — a
#            situation the compiler cannot fully feed should still produce advice the seller
#            is waiting on, at a lower confidence, not withhold it.

capability: sales.post_sale_and_growth.expansion

core:
  required:
    - sales.obj.core.account
    - sales.obj.core.opportunity
  optional:
    - sales.obj.core.business_need
    - sales.obj.core.buying_committee
    - sales.obj.core.champion

scoped:
  required: []
  optional: []
