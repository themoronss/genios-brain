# Load-set for sales.revenue_operations.revenue_intelligence — REFERENCES ONLY, never an inline object.
#
# core   -> objects/core/            loaded by more than one capability
# scoped -> objects/revenue-intelligence/   loaded by this capability alone
#
# required = a missing one blocks the compile.
# optional = absence lowers confidence rather than blocking (Layer 3 strategy S8) — a
#            situation the compiler cannot fully feed should still produce advice the seller
#            is waiting on, at a lower confidence, not withhold it.

capability: sales.revenue_operations.revenue_intelligence

core:
  required:
    - sales.obj.core.deal
  optional:
    - sales.obj.core.buying_signal
    - sales.obj.core.opportunity
    - sales.obj.core.risk

scoped:
  required: []
  optional: []
