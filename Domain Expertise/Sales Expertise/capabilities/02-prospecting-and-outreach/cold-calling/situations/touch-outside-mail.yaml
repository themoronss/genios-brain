# THIS SITUATION ROUTES NOTHING. Four Sales capabilities whose evidence is, by definition, not in
# the mailbox: a call, a LinkedIn message, a product demonstration, and the size of a market. The
# first three are channels this tenant has no connector for; the fourth is not a per-account read
# at all.

identity:
  id: sales.sit.touch_outside_mail
  name: Touch Outside Mail
  domain: sales
  owner_capability: sales.prospecting_and_outreach.cold_calling
  version: 1.0.0
  status: stable

description: >
  A meaningful interaction happened somewhere the system cannot see — a phone call, a social
  message, a demonstration — or the question being asked is about a market rather than a
  counterparty. Either way the evidence is outside the graph.

  The reason this matters more than it looks is that the missing channels are where the highest-
  intent moments happen. A prospect who takes a call is further along than one who replies to an
  email, and a demo is usually the single most informative event in a deal. Reading a pipeline
  from mail alone systematically underweights exactly the accounts that are moving fastest.

matches:
  # PARTLY BOUND, 2026-08-30. `context/meeting_touch.py` mints `channel_touch` from the one
  # non-mail channel the graph actually holds: a calendar meeting carrying
  # `meeting.external_counterparty` — 48 of them on the design partner's org. That is a RECORDED
  # event, so the objection below ("it would infer a call from the absence of mail") does not
  # apply to it; the objection stands, and this does not do that.
  #
  # It serves `demo` and NOT `cold_calling` or `linkedin_outreach`: a dialled number and a
  # LinkedIn message appear in no calendar. Every situation says so in `missing` and in
  # `inputs.not_served`, so a capability can see how much of its channel it is looking at rather
  # than reading a third of one as the whole.
  l2_situation_types:
    - channel_touch
  # THE REST OF THE TYPE IS STILL MISSING, and validate.py will not let it be listed both as
  # emitted and as pending, so it is recorded here instead of silently disappearing: calls
  # (dialler/telephony) and LinkedIn touches have no source and reach nothing. `cold_calling` and
  # `linkedin_outreach` therefore remain unserved by this route even though the type now emits.
  pending_l2_situation_types:
    - type: market_period_review
      owner_layer: L2
      nearest_today: opportunity
      note: >
        WHAT THE TYPE MUST MEAN. A market rather than an account — segment size, reachable share,
        and where the current customer base actually sits within it. Its anchor is a SEGMENT and a
        window.

        WHAT WOULD EMIT IT. The same tenant-anchored periodic mechanism named in
        `sales.sit.pipeline_period_review`, plus external market data the graph has no source for.

        WHAT GOES WRONG TODAY. Nothing fires for tam_sam_som.

        WHY BINDING TO opportunity WOULD BE WRONG, specifically. A market size asserted on one
        account is not a market size. `icp_definition` and `market_research` — the two neighbours
        that ARE routed — read a single account against a profile, which is a genuinely different
        and genuinely per-account question; sizing is not.
  # No `scope`. A call has no anchor the enum offers, and a market is not a subject at all.

  # A MEETING THAT ACTUALLY HAPPENED, WITH SOMEBODY OUTSIDE.
  #
  # There was no `when` at all, so this fired on every `channel_touch` row — including cancelled
  # meetings and internal ones. The finding is that a HIGH-INTENT touch happened somewhere mail
  # cannot see, and that is only true of a real external meeting. Both facts are written by
  # `context/meeting_touch.py` straight from the calendar, so this narrows on recorded evidence
  # rather than on an inference about a channel we cannot observe — which is the objection this
  # file's own header raises and is careful not to commit.
  when:
    - {path: meeting.status, op: "!=", value: cancelled}
    - {exists: meeting.external_counterparty}
also_serves:
  - sales.prospecting_and_outreach.linkedin_outreach
  - sales.discovery_and_solution.demo
  - sales.market_and_targeting.tam_sam_som

objects:
  load:
    - sales.obj.core.contact
  optional:
    - sales.obj.core.company
    - sales.obj.core.icp
    - sales.obj.market_research.market_map

priority_bp: 3000
typical_duration_days: 30
signals_of_progress: [meeting_request, positive_reply]
signals_of_decay: [negative_reply]

render:
  artifact_kind: brief
  render_hint: >
    Headline: A DIRECT ORDER — verb first, name who. Never a status line and never a day count on its own; the reader already knows time passed.

    Unreachable today. When the channels exist: never describe a call from its metadata alone —
    connected and dialled are different events, and only one of them is worth advising on.
  fallback:
    headline: "Capture what happened with {entity} off email"
    situation: >-
      Interactions with {entity} on channels other than mail are not captured.

metadata:
  owner: Sales
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-29'
  review_status: approved
  reviewed_at: '2026-09-01'
  confidence: experimental
  reviewed_at: '2026-08-29'
  notes: >
    Carries two pending types rather than one because the four capabilities split cleanly into a
    CAPTURE gap (three channels, Layer 1) and an AGGREGATION gap (market sizing, the same periodic
    mechanism three other files name). Merging them into one type would hide that they are two
    different builds with two different owners.

    HELD AT DRAFT ON PURPOSE, 2026-09-01.

    Its finding is honest and its copy is already written: activity on calls and LinkedIn is not
    captured, so what the product shows is mail-shaped. But the gate is empty, so promoting it
    puts "we cannot see your calls" on every meeting in the org, forever, with no action
    attached. A true statement repeated on every row is noise, and this one cannot be resolved by
    anything the reader does.

    The right home for it is a coverage notice on the account surface, once per tenant — not a
    card in the queue. Left at draft until that surface exists.

