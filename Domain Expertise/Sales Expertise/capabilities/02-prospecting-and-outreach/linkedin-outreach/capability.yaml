  confidence: experimental
  notes: 'Promoted out of Phase-1 stub. A channel under `outreach`, which owns
    `sales.sit.outbound_prospect` on the live `relationship` type.

    Not observable in the record — no social-platform connector exists, so requests, acceptances and
    message threads are all outside the graph. `introduction` (104 rows on the design partner''s org)
    is the nearest adjacent signal and it captures introductions made anywhere, not on this platform
    specifically.

    No numbers: request volumes and platform limits are Layer 4''s arithmetic and change without
    notice.

    '
  reviewed_at: '2026-08-27'

