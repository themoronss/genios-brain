purpose:
  statement: Cold calling earns its cost where the list is short and the value per account is high — named-account
    motions, senior buyers, timing-critical events. Spraying calls at a long tail is the most expensive
    way to be ignored.
  answers:
  - When does calling beat emailing for a first touch?
