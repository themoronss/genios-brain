purpose:
  statement: "A segment that argues loudly about price has a budget line. A segment that says \"interesting,\
    \ send me something\" does not.\n Buyers with no money disengage; they do not negotiate. Price objections\
    \ concentrated in a new segment are a market-fit signal before they are a pricing problem, and the\
    \ standard error is to cut list price after a handful of noisy deals in a population that would\
    \ have paid.\n"
