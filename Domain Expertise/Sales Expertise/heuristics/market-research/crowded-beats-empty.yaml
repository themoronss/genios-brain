purpose:
  statement: "A contested category is cheaper to sell into than an empty one.\n Competitors have already\
    \ convinced the buyer the category exists, created the budget line and taught the internal justification.\
    \ In an empty category we pay for all of that ourselves, in cycle length, before anyone compares\
    \ us to anything. Emptiness is a cost that reads as an opportunity.\n"
