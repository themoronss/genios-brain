purpose:
  statement: "A segment is defined by whose budget line pays, not by industry code or headcount band.\n\
    \ The budget owner determines the approval path, the cycle length, the language that lands and the\
    \ size of cheque available. Two companies that look identical in a database and pay out of different\
    \ functions are two markets that happen to share a filter.\n"
