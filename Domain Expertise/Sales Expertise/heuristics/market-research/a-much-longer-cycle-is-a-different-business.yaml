purpose:
  statement: "If the observed cycle in a segment is several times our current one, that is not a harder\
    \ version of our market. It is a different business with different cash requirements.\n Cycle length\
    \ sets working capital, quota ramp, headcount shape and the compensation plan. Treating it as a\
    \ territory to be worked harder is how a company enters enterprise with a transactional cost base\
    \ and runs out of runway"
