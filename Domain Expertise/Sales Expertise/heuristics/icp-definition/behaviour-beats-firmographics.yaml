  why: 'Committee size, whether procurement runs the process, whether anyone there has bought in this
    category before — these separate won from lost more sharply than industry or headcount, and they
    are the dimensions nobody writes down because they cannot be bought from an enrichment vendor. An
    eighty-person company that runs security review is an enterprise buyer; a five-thousand-person company
    buying on a card is not.

    '
