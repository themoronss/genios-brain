purpose:
  statement: "Compare winners against losers, not winners against the market.\n Attributes shared by\
    \ everyone you sold to and everyone you lost carry no signal. The instinctive method — list what\
    \ our best customers have in common — reliably produces the least discriminating profile available,\
    \ because common attributes are common.\n"
