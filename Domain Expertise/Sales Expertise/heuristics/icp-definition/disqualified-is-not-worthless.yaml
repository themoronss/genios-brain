purpose:
  statement: "A disqualified account is frequently somebody else's ideal customer — route it, do not\
    \ merely drop it.\n Referral relationships are built out of the accounts you correctly refuse, and\
    \ they cost nothing because you were not going to win them. Treating disqualification as deletion\
    \ throws away the only asset a rejected account still has.\n"
