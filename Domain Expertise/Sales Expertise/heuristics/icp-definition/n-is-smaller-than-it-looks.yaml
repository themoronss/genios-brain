purpose:
  statement: "Divide the sample by the number of dimensions before believing it.\n Twenty won accounts\
    \ across four industries and three size bands is a couple of accounts per cell — a story, not a\
    \ signal. Say the profile is a hypothesis until it has survived losses it predicted in advance,\
    \ because a profile has only really been tested when it told you to walk away and walking away turned\
    \ out to be right.\n"
