purpose:
  statement: People do not argue with products they have dismissed — they leave. The dangerous account
    is the politely silent one; the objecting one is negotiating its way to yes. Welcome the pushback
    and worry about the quiet.
  answers:
  - 'Which is worse: an objecting buyer or a quiet one?'
