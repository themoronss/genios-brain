purpose:
  statement: Every feature shown beyond the buyer's needs adds surface for confusion and price anxiety,
    not desire. The demo that closes is remembered as 'it does exactly what we need' — a memory long feature-tours
    cannot produce.
  answers:
  - How much of the product should a demo show?
