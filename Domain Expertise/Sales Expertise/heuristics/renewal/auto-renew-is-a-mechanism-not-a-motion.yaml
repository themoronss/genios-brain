purpose:
  statement: An auto-renew clause collects signatures, not commitment — accounts that renew by default
    and disengage churn violently at the first budget review. Treat every renewal as re-earned, clause
    or no clause.
  answers:
  - Does an auto-renewal clause make renewal safe?
