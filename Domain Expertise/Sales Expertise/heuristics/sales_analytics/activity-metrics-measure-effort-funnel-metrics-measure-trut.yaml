identity:
  id: sales.heu.sales_analytics.activity_metrics_measure_effort__funnel_metrics_measure_trut
  name: Activity metrics measure effort, funnel metrics measure truth
  kind: heuristic
  domain: sales
  scope: capability
  owner_capability: sales.revenue_operations.sales_analytics
  subdomain: revenue_operations
  version: 1.1.0
  status: stable
purpose:
  statement: Calls made and emails sent are inputs a team can inflate at will; stage conversion cannot
    be inflated without lying to the pipeline. When the two disagree, the funnel is right.
  answers:
  - Which metric wins when activity looks healthy and outcomes do not?
  not:
  - A claim that activity is worthless. It is diagnostic, and it is not evidence of progress.

heuristic:
  statement: 'Where activity and funnel metrics disagree, believe the funnel. Activity is generated by
    the same people it measures and costs them nothing to raise; conversion requires a buyer to do
    something, which is not available to anyone on our side of the transaction.'
  why: 'The difference is who controls the number. A team told to make more calls can make more calls
    tomorrow, and the metric will move without anything else changing — so activity measures
    compliance with an instruction rather than progress towards an outcome. Stage conversion cannot be
    moved that way: raising it requires buyers to behave differently, and the only way to fake it is
    to misrepresent stages, which is a visible act with a name rather than an ambiguous one.'
  confidence_bp: 8500
  applies_when: 'Both activity and funnel measures exist and point in different directions.'
  breaks_down_when: 'A NEW TEAM OR MOTION. Before any deals have moved through the funnel there is no
    conversion data, and activity is the only leading signal available — this is the regime where
    activity metrics are genuinely correct.

    STAGE DEFINITIONS THAT ARE NEGOTIATED. Where sellers argue deals into stages, conversion is
    corrupted at source and the funnel is not more trustworthy than activity, merely differently
    wrong.

    VERY LONG CYCLES. Conversion data arrives quarters late, so acting only on it means acting on a
    picture of the past; activity is the only thing available inside the window where intervention is
    possible.

    A DELIBERATE COVERAGE PUSH. Where the objective genuinely is contact volume — a new segment being
    tested — activity is the outcome rather than a proxy for it.

    WHEN THE FUNNEL SAMPLE IS TINY. A handful of deals produces conversion rates that swing on single
    outcomes, and precision is not the same as reliability.'
  reads:
  - sales.obj.core.deal
  - deal.status
  - thread.last_outbound
  contradicts:
  - sales.heu.performance_management.trailing_metrics_manage_history
  pattern_ref: []

when_to_use:
  conditions:
  - {path: deal.status, op: "=", value: open}
  signals:
  - proposal_sent
  - closed_lost_mention
  do_not_use_when:
  - The motion is new and no conversion data exists yet.
  - Stage definitions are negotiated, so the funnel is corrupted at source.
  - The cycle is long enough that conversion data always describes the past.

objects_used:
- sales.obj.core.deal
- sales.obj.core.opportunity

limits:
- Stage history is not in the corpus substrate — `deal.status` holds a current value rather than a
  sequence — so stage conversion is derivable only where a tenant's CRM history reaches the record.
- Activity IS derivable from correspondence (`thread.last_outbound`), which means the engine can
  currently compute the metric this heuristic distrusts and not the one it prefers.
- Says nothing about which stage to fix once the funnel identifies it.

metadata:
  owner: Sales
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: provisional
  completeness: complete
  notes: 'Promoted from an identity-and-purpose page. `limits` records an uncomfortable asymmetry: on
    a correspondence-only tenant the engine can compute activity and not conversion, which is exactly
    backwards from what this heuristic recommends trusting.'
