identity:
  id: sales.heu.decision_maker_identification.title_inflation_hides_the_signer
  name: Title inflation hides the signer
  kind: heuristic
  domain: sales
  scope: capability
  owner_capability: sales.qualification.decision_maker_identification
  subdomain: qualification
  version: 1.1.0
  status: stable
purpose:
  statement: "'Decision maker' on a title or a form is aspiration half the time. Authority is proven by
    past behaviour — who signed the last comparable purchase — not by what anyone, including them,
    says about the next one."
  answers:
  - How is authority established without asking who decides?
  not:
  - A claim that people lie. Almost nobody does; they describe the influence they expect to have.
  - A rule about seniority. Sometimes the signer is junior and the title understates them.

heuristic:
  statement: 'Establish authority from a completed past act of the same shape, and ask about the
    PROCESS rather than about the person. "Walk me through how the last tool this size got bought"
    surfaces the real signer as a by-product of a story someone is happy to tell; "who is the decision
    maker" asks them to rank themselves, which is both socially awkward and answered optimistically.'
  why: 'Authority is a property of the organisation, and the person answering is describing their
    place in it — a self-assessment made under a mild social incentive to sound more central than they
    are. It is rarely dishonest, which is what makes it so reliable a trap: the contact believes their
    answer, so no amount of rapport corrects it. A past purchase, by contrast, has already resolved
    the question; whatever anyone believed beforehand, someone actually signed, and that fact is not
    subject to anyone''s self-image.'
  confidence_bp: 8300
  applies_when: 'A purchase of a size or category the organisation has made before, where a comparable
    precedent exists to ask about.'
  breaks_down_when: 'A GENUINELY FIRST PURCHASE OF ITS KIND. New category, new budget line, or a
    company young enough to have no precedent — there is no past act to read and the authority is
    genuinely being decided for the first time, sometimes during our deal.

    AFTER A REORGANISATION OR A BUDGET CHANGE. The precedent describes an approval structure that no
    longer exists, and confidently naming last year''s signer is worse than admitting ignorance
    because it forecloses the question.

    FOUNDER-LED AND OWNER-MANAGED BUYERS. Authority is obvious, concentrated, and asking a process
    question about precedent reads as an odd formality.

    WHERE THE PRECEDENT WAS ITSELF BADLY RUN. An emergency purchase or an exception approval is not
    the normal path, and copying it produces a route the organisation will not repeat.

    WHEN THE SIGNATURE AND THE DECISION ARE DIFFERENT PEOPLE. A procurement officer signs everything
    and decides nothing. The past act identifies the signer, and the useful question is who that
    signer was persuaded by — which the same story usually answers if it is followed one step further.'
  reads:
  - sales.obj.core.decision_maker
  - sales.obj.core.buying_committee
  - sales.obj.core.budget
  - party.role
  contradicts:
  - sales.heu.champion_identification.coach_vs_champion
  pattern_ref: []

when_to_use:
  situations:
  - sales.sit.enterprise_deal
  conditions:
  - {path: deal.status, op: "=", value: open}
  signals:
  - budget_approved
  - contract_requested
  do_not_use_when:
  - The purchase is genuinely the first of its kind, so no precedent exists to read.
  - The organisation has just reorganised; the precedent describes a structure that is gone.
  - The buyer is founder-led, where authority is obvious and the question is a formality.

objects_used:
- sales.obj.core.decision_maker
- sales.obj.core.buying_committee
- sales.obj.core.budget
- sales.obj.core.stakeholder

outcomes:
- Authority is recorded against a past act rather than against a title.
- The signer and the persuader are identified as potentially different people.

failure_modes:
- 'THE PRECEDENT TREATED AS BINDING. Organisations change; a past signer is strong evidence and not a
  guarantee, and the second breakdown regime is when it is actively wrong.'
- 'STOPPING AT THE SIGNATURE. Identifying who signed without asking who convinced them finds the
  formality rather than the decision.'
- 'USED AS AN INTERROGATION. A sequence of process questions with no reciprocal value reads as
  qualification rather than as conversation, and the contact stops volunteering.'

limits:
- Needs a comparable precedent, which the newest and fastest-growing buyers do not have.
- 'Nothing in the record establishes authority: `party.role` says what a counterparty is to us, and
  `budget_approved` has zero rows on the design partner''s org. This is a human discovery act, and
  the engine''s role is to hold the verdict and notice when it is missing.'
- Says nothing about how to reach the person once identified.

variants:
- applies_to: enterprise
  change: Expect the signer, the budget holder and the decider to be up to three people, and record
    them separately rather than as one decision-maker field.
  why: Collapsing them is what produces a proposal sent to someone who cannot act on it.
- applies_to: mid_market
  change: Usually one approver, and the precedent question resolves it in a single conversation.
  why: Fewer layers between the budget and the decision.
- applies_to: smb
  change: Ask directly. The contact is generally the owner and the indirection is unnecessary.
  why: Authority is not obscured when there is nobody to obscure it from.
- applies_to: channel
  change: Two authority structures — the partner's and the end customer's — and the partner's is
    invisible from the customer's thread.
  why: A partner who cannot approve their own side stalls a deal the customer already approved.

metrics:
- name: evidenced_authority_share
  unit: percent
  description: Share of deals where authority rests on a past act.
  direction: higher_is_better
- name: authority_discovery_lead_time
  unit: days
  description: Days to an evidenced approver.
  direction: lower_is_better

references:
- title: MEDDICC
  kind: methodology
  note: The economic-buyer dimension, and the discipline of verifying rather than assuming it.
- title: The Challenger Customer
  kind: book
  author: Adamson, Dixon, Spenner and Toman
  note: On decision authority being distributed and the signer frequently not being the persuaded
    party.

metadata:
  owner: Sales
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: provisional
  completeness: complete
  notes: 'Promoted from an identity-and-purpose page. The fifth breakdown regime is the addition worth
    keeping — the past act identifies who SIGNED, which in procurement-led organisations is a
    different person from who decided, and following the same story one step further is what separates
    the two.'
