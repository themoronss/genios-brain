purpose:
  statement: A late procurement discount demand is a ritual, not a deal crisis. It means the decision
    is made — nobody negotiates price on a product they rejected. Hold, trade small, do not reopen the
    whole commercial.
  answers:
  - Is the last-minute procurement squeeze a threat to the deal?
