purpose:
  statement: Polished deal narratives correlate with polished sellers, not with deal health — the confident
    story is where the review must push hardest on evidence. The stumbling story about a real buyer is
    often the healthier deal.
  answers:
  - Which deals deserve the hardest review questions?
