purpose:
  statement: 'Momentum is a real deal asset: every idle week invites reorgs, budget freezes, rival vendors
    and cold feet. Between commitment and signature, the seller''s job is to remove every day that does
    not need to exist.'
  answers:
  - How urgent is the gap between verbal yes and signature?
