purpose:
  statement: A specific feature request is evidence of a real pain and a guessed solution. Honour the
    pain, stay neutral on the guess — the buyer's solution guess is one hypothesis, and often not the
    best one available.
  answers:
  - How should a feature request in a sales conversation be read?
