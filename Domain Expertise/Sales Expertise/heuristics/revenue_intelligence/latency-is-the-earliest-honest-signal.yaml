identity:
  id: sales.heu.revenue_intelligence.latency_is_the_earliest_honest_signal
  name: Latency is the earliest honest signal
  kind: heuristic
  domain: sales
  scope: capability
  owner_capability: sales.revenue_operations.revenue_intelligence
  subdomain: revenue_operations
  version: 1.1.0
  status: stable
purpose:
  statement: Before a buyer says no, they slow down. Reply latency stretching is the record's first
    warning — visible before any stage regresses, and worth acting on while the deal is still warm.
  answers:
  - What is the earliest measurable sign a deal is cooling?
  not:
  - A claim that slow replies mean loss. It is about CHANGE against a baseline, not about slowness.
  - A prediction of the outcome. It says attention has moved, not that the answer is no.

heuristic:
  statement: 'Read the CHANGE in reply latency against this counterparty''s own established rhythm,
    not the latency itself. A correspondent who answered within hours now taking days has told you
    something; one who has always taken days has told you nothing. The signal is the ratio, and the
    absolute number is what makes an absolute threshold flag the wrong half of the pipeline.'
  why: 'Attention reallocates before decisions are made and long before anything is communicated.
    Nobody writes to say a project has slipped down their list, but the reply that used to come the
    same afternoon now arrives on Thursday — and that shift is generated by the same mechanism as the
    eventual outcome, which is why it leads it. It is also the cheapest signal in the record: it needs
    no CRM field, no seller input and no product telemetry, only timestamps that already exist, which
    is why it survives on tenants where every other signal is missing.'
  confidence_bp: 7800
  applies_when: 'A two-way correspondence history exists with enough exchanges to establish a rhythm.
    `thread.last_inbound` and `thread.last_outbound` supply the intervals; `reply_cadence` supplies
    the baseline; `derived.engagement` and `derived.momentum` corroborate.'
  breaks_down_when: 'NO BASELINE YET. On a new relationship there is no rhythm to deviate from, and
    the heuristic silently falls back to an absolute threshold — which is the failure it exists to
    prevent. Below a minimum exchange count it should abstain rather than approximate.

    HOLIDAYS, LEAVE AND SEASONALITY. A whole-market slowdown produces a synchronous latency stretch
    across every deal at once. Simultaneity across unrelated counterparties is the tell, and a signal
    that cannot see it will fire on the entire pipeline in the same week.

    THE CONVERSATION MOVED CHANNELS. A deal that shifted to calls, a shared workspace or a portal
    looks identical to one going quiet. On a partially-connected tenant this is the largest single
    source of false positives.

    A DELIBERATE HANDOFF. Latency stretches when the thread passes to procurement, legal or security —
    functions that are slower by design. That is progress presenting as decay, and it is the most
    expensive misread because it triggers a rescue on a deal that is advancing.

    SHORT TRANSACTIONAL CYCLES. With few exchanges there is no rhythm to establish, and latency
    variance is dominated by noise.'
  reads:
  - sales.obj.core.deal
  - sales.obj.core.buying_signal
  - thread.last_inbound
  - thread.last_outbound
  - derived.engagement
  contradicts:
  - sales.heu.pipeline_management.pipeline_coverage_lies_without_hygiene
  pattern_ref:
  - dl.momentum_collapse_after_proposal

when_to_use:
  situations:
  - sales.sit.field_evidence_on_the_market
  conditions:
  - {exists: thread.last_inbound}
  - {exists: thread.last_outbound}
  - {path: derived.engagement, op: "<", value: 1}
  signals:
  - negative_reply
  - timeline_slip
  - going_dark
  do_not_use_when:
  - There are too few exchanges to establish a rhythm.
  - The whole pipeline slowed at once; that is the calendar, not the deals.
  - The thread passed to procurement, legal or security — slower by design is not cooling.

objects_used:
- sales.obj.core.deal
- sales.obj.core.buying_signal
- sales.obj.core.risk
- sales.obj.core.opportunity

outcomes:
- Cooling is detected from correspondence timing before any stage moves.
- Signals are expressed as a ratio to the counterparty's own rhythm.

failure_modes:
- 'ABSOLUTE THRESHOLDS. Flags the fast correspondents and misses the slow ones going quiet — the exact
  inversion of the intended behaviour, and the default implementation.'
- 'FIRED WITHOUT A BASELINE. Produces confident noise on new relationships, which is where sellers
  are least able to judge it.'
- 'TREATED AS A VERDICT. The signal says attention moved; acting as though it says "no" produces a
  rescue message that tells the buyer we read their silence as rejection.'
- 'NOT CHECKED AGAINST OUTCOMES. Without feedback the precision is unknown, and an unmeasured signal
  is trusted exactly until it is wrong twice.'

limits:
- Says nothing about WHY attention moved, which is what determines the response.
- Blind to conversations that left the captured channels; that is the largest false-positive source.
- Needs enough history for a baseline, so it is weakest on exactly the newest relationships.

variants:
- applies_to: enterprise
  change: Measure per stakeholder as well as per thread — the champion staying responsive while the
    economic buyer slows is a different and more serious event than a uniform slowdown.
  why: In a committee the aggregate hides which relationship is cooling.
- applies_to: smb
  change: Use raw silence rather than a latency ratio; there are rarely enough exchanges for a
    baseline and the cycle is short enough that absence carries the information.
  why: The statistics do not exist, and the timescale compensates.
- applies_to: channel
  change: Track the partner's latency and the end customer's separately; a responsive partner masks a
    silent customer entirely.
  why: Two relationships, one thread.

metrics:
- name: signal_lead_time
  unit: days
  description: Days between the latency signal and the lagging indicator it predicted.
  direction: higher_is_better
- name: signal_precision
  unit: percent
  description: Share of latency signals that preceded the outcome they claim to predict.
  direction: higher_is_better

references:
- title: Conversation and engagement analytics practice
  kind: practitioner
  note: Response-time trend as a leading churn and loss indicator; the contribution here is insisting
    on the per-relationship baseline, which most implementations omit.
- title: MEDDICC
  kind: methodology
  note: The complementary structural view — latency says attention moved, MEDDICC says whether the
    deal was ever properly qualified.

metadata:
  owner: Sales
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-26'
  review_status: approved
  confidence: provisional
  completeness: complete
  notes: 'Promoted from an identity-and-purpose page. The original named a specific day count; removed,
    because a threshold in Layer 3 is a boundary leak and the claim is about the ratio anyway. The
    fourth breakdown regime — a handoff to procurement or legal — is the most expensive misread, since
    it triggers a rescue on a deal that is in fact advancing.'
