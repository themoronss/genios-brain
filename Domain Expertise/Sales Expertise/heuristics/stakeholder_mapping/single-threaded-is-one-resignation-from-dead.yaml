identity:
  id: sales.heu.stakeholder_mapping.single_threaded_is_one_resignation_from_dead
  name: Single-threaded is one resignation from dead
  kind: heuristic
  domain: sales
  scope: capability
  owner_capability: sales.qualification.stakeholder_mapping
  subdomain: qualification
  version: 1.1.0
  status: stable
purpose:
  statement: A deal with one internal contact has a single point of failure with two legs. The map's
    first job is to make single-threading visible early, while adding a second thread is a warm
    introduction instead of a cold rescue.
  answers:
  - How exposed is this deal to one person leaving or changing their mind?
  - When is the cheapest moment to widen a relationship?
  not:
  - An instruction to contact everyone. Indiscriminate widening has its own cost.
  - A claim that one contact means a bad deal. It means a fragile one.

heuristic:
  statement: 'Read thread breadth continuously and act on it while the relationship is healthy. The
    cost of adding a second contact is a warm introduction from someone who likes us; the cost of
    adding one after the first has gone quiet or left is a cold approach into an account that has
    stopped answering — and the difference between those two prices is the entire content of this
    heuristic.'
  why: 'A single contact is not merely a concentration of risk, it is a concentration of the wrong
    kind: the failure modes are uncorrelated with the deal''s merit. They leave, they are reassigned,
    they lose an internal argument, their priorities change with a reorganisation. None of that is
    about us and none of it is predictable from anything in the deal, so the exposure cannot be
    reduced by doing the deal better — only by widening. The asymmetry in timing is what makes it a
    heuristic rather than an observation: the same action costs almost nothing before the event and is
    close to impossible afterwards.'
  confidence_bp: 8600
  applies_when: 'A multi-person purchase where substantive contact runs through one person.
    `edge_count` is computed for every situation and is the direct measure.'
  breaks_down_when: 'A GENUINELY SINGLE-PERSON BUYER. Founder-led and owner-managed purchases have one
    person by design, and widening manufactures stakeholders — which then have to be managed and
    sometimes object.

    WHERE THE CHAMPION HAS EXPLICITLY ASKED TO CONTROL THE PROCESS. Some champions gate access
    deliberately and for good internal reasons, and routing around them to satisfy a breadth metric
    costs the strongest asset in the deal. The correct move is to widen THROUGH them, and to record
    the refusal if they will not.

    EARLY IN A FIRST CONTACT. Approaching several people before one relationship exists is outreach,
    not multi-threading, and it reads to the account as a mail merge.

    WHEN BREADTH IS COSMETIC. Five contacts in one function is one seat with redundancy. The metric
    improves, the exposure does not, and the dashboard now actively misleads.

    IN SHORT TRANSACTIONAL CYCLES. A deal that closes in days has no time to be exposed to a
    resignation, and the widening effort is better spent on the next deal.'
  reads:
  - sales.obj.core.stakeholder
  - sales.obj.core.buying_committee
  - sales.obj.core.champion
  - thread.last_inbound
  contradicts:
  - sales.heu.champion_identification.coach_vs_champion
  pattern_ref: []

when_to_use:
  situations:
  - sales.sit.enterprise_deal
  conditions:
  - {path: deal.status, op: "=", value: open}
  - {fn: edge_count, op: "<=", value: 1}
  signals:
  - introduction
  - champion_change
  - stakeholder_left
  do_not_use_when:
  - The buyer genuinely has one decision-maker; widening manufactures stakeholders.
  - The champion controls access deliberately; widen through them or record the refusal.
  - The relationship is a first contact, where several approaches read as a mail merge.

objects_used:
- sales.obj.core.stakeholder
- sales.obj.core.buying_committee
- sales.obj.core.champion
- sales.obj.core.risk

outcomes:
- Single-threading is surfaced while widening is still cheap.
- Breadth is counted by seat rather than by contact.

failure_modes:
- 'WIDENING BY CC. Adding names to a thread produces the appearance of breadth and no second
  relationship, and it irritates the one contact who was working.'
- 'ROUTING AROUND A GATING CHAMPION. Occasionally succeeds and reliably costs the asset that was
  carrying the deal.'
- 'ACTED ON ONLY AT REVIEW TIME. The flag is cheap to compute continuously; discovering it at a stage
  gate means discovering it at the point where the cheap remedy is gone.'

limits:
- '`edge_count` measures connected people, not seats — five contacts in one function count as five,
  which is exactly the cosmetic-breadth failure the fourth regime describes.'
- '`stakeholder_left` and `champion_change` have zero rows on the design partner''s org, so a
  departure is invisible; it shows up only as silence, and silence has other causes.'
- Says nothing about WHO the second thread should be, which is where most of the judgement lies.

variants:
- applies_to: enterprise
  change: Require breadth across FUNCTIONS rather than across people, and treat two contacts in one
    team as single-threaded.
  why: The correlated risk is functional, not individual — a reorganisation moves the whole team.
- applies_to: mid_market
  change: A second thread is usually sufficient, and the champion is usually willing to provide it if
    asked before the deal is under pressure.
  why: The ask is easy while things are going well and awkward once they are not.
- applies_to: smb
  change: Do not apply. One contact is the normal and correct shape.
  why: Widening invents stakeholders who then have to be persuaded.
- applies_to: channel
  change: Count threads inside the partner AND inside the end customer; a deal wide at the partner and
    single-threaded at the customer is single-threaded.
  why: The exposure sits wherever the decision does.

metrics:
- name: single_threaded_deal_share
  unit: percent
  description: Share of live deals with substantive contact through one person.
  direction: lower_is_better
- name: warm_widening_rate
  unit: percent
  description: Share of second threads added by introduction rather than by cold approach. The direct
    test of acting early.
  direction: higher_is_better

references:
- title: MEDDICC
  kind: methodology
  note: Champion and decision-process dimensions, where single-threading is conventionally recorded as
    a risk and rarely as a number.
- title: The Challenger Customer
  kind: book
  author: Adamson, Dixon, Spenner and Toman
  note: On consensus requiring several internal advocates, and on why one is structurally insufficient
    in a large organisation.

metadata:
  owner: Sales
  created_by: ai
  reviewed_by: harsh
  last_updated: '2026-08-27'
  review_status: approved
  confidence: provisional
  completeness: complete
  notes: 'Promoted from an identity-and-purpose page. This is the qualification heuristic with the
    best live signal — `edge_count` is computed for every situation and is exactly the measure — and
    `limits` states its precise weakness: it counts people, not seats, so cosmetic breadth satisfies
    it.'
