identity:
  id: sales.obj.core.company
  scope: core
  name: Company
  domain: sales
  subdomain: market_and_targeting
  owner_capability: sales.market_and_targeting.icp_definition
  version: 1.0.0
  status: draft
  aliases: ["Organisation", "Firm", "Legal Entity"]
purpose:
  statement: >
    The organisation as an entity in the world — firmographics, structure, market position,
    technology. Objective and externally verifiable, independent of whether we have ever spoken
    to them. It is what ICP fit is scored against. Every field here would be true if our
    company did not exist: headcount, industry, ownership, installed technology, fiscal
    year-end. Nothing about how the relationship is going belongs here — that is Account. The
    practical consequence is that a Company record can be enriched, scored and disqualified
    before any human contact, which is the entire basis of targeting; and that when the
    relationship turns, none of these fields change, which is exactly why they must not be
    stored in the same place as the ones that do.
attributes:
  - name: identity
    purpose: What uniquely and durably names this organisation.
    type: composite
    contains:
      - legal_name
      - trading_name
      - primary_domain
      - registration_id
      - public_ticker
  - name: scale
    purpose: Size, measured several ways because no single measure survives contact with reality.
    type: composite
    contains:
      - employee_count
      - employee_band
      - revenue_annual
      - revenue_band
      - growth_rate
      - headcount_trend
  - name: market_position
    purpose: What they do and who they do it against. The basis of relevance, as distinct from fit.
    type: composite
    contains:
      - industry
      - industry_code
      - sub_industry
      - business_model
      - market_position
  - name: structure
    purpose: Ownership and corporate shape. Determines who can actually sign and how long that takes.
    type: composite
    contains:
      - legal_structure
      - funding_stage
      - last_funding_at
      - parent_company_ref
      - subsidiary_count
      - headquarters_country
      - operating_countries
      - fiscal_year_end
  - name: technology_and_compliance
    purpose: Externally observable operating context. The most predictive firmographics in B2B
      software.
    type: composite
    contains:
      - tech_stack
      - incumbent_vendors
      - regulatory_regimes
  - name: data_quality
    purpose: How much any of the above should be believed. Firmographics rot silently.
    type: composite
    contains:
      - research_state
      - data_source
      - data_freshness_at
  - name: legal_name
    purpose: The registered entity name. What appears on the contract, and frequently not what anyone
      calls them.
    type: value
    data_type: string
    required: true
    description: The registered entity name. What appears on the contract, and frequently not what
      anyone calls them.
  - name: trading_name
    purpose: The trading_name of this object.
    type: value
    data_type: string
  - name: primary_domain
    purpose: The primary web domain, and the only durable natural key this object has. Company names
      change on rebrand and acquisition; domains survive both, and every email address we already hold
      contains one. Matching accounts on name instead is the most common source of duplicate
      organisations in any CRM.
    type: value
    data_type: string
    required: true
    description: >
      The primary web domain, and the only durable natural key this object has. Company names
      change on rebrand and acquisition; domains survive both, and every email address we
      already hold contains one. Matching accounts on name instead is the most common source
      of duplicate organisations in any CRM.
  - name: registration_id
    purpose: Companies House number, EIN, or local equivalent. Authoritative and rarely available at
      the top of the funnel.
    type: value
    data_type: string
    description: Companies House number, EIN, or local equivalent. Authoritative and rarely available
      at the top of the funnel.
  - name: public_ticker
    purpose: The public_ticker of this object.
    type: value
    data_type: string
  - name: employee_count
    purpose: Point estimate, always stale, and the field most heavily weighted in most ICP models
      despite it. Pair it with data_freshness_at or it will silently drive segmentation off a
      three-year-old number.
    type: value
    data_type: integer
    unit: people
    description: >
      Point estimate, always stale, and the field most heavily weighted in most ICP models
      despite it. Pair it with data_freshness_at or it will silently drive segmentation off a
      three-year-old number.
  - name: employee_band
    purpose: Banded because the band is what fit models actually consume and because it degrades
      gracefully as the point estimate ages. A count that has drifted 15 per cent usually sits in the
      same band; the band is wrong far less often than the number.
    type: value
    data_type: enum
    allowed_values: [unknown, "1-10", "11-50", "51-200", "201-1000", "1001-5000", "5000+"]
    description: >
      Banded because the band is what fit models actually consume and because it degrades
      gracefully as the point estimate ages. A count that has drifted 15 per cent usually sits
      in the same band; the band is wrong far less often than the number.
  - name: revenue_annual
    purpose: The revenue_annual of this object.
    type: value
    data_type: money
  - name: revenue_band
    purpose: The revenue_band of this object.
    type: value
    data_type: enum
    allowed_values: [unknown, under_1m, m1_10, m10_50, m50_250, m250_1b, over_1b]
  - name: growth_rate
    purpose: Year-on-year. Direction of travel matters more to fit than position — a fast-growing
      80-person company buys like a 300-person one.
    type: value
    data_type: number
    unit: percent
    description: Year-on-year. Direction of travel matters more to fit than position — a fast-growing
      80-person company buys like a 300-person one.
  - name: headcount_trend
    purpose: A shrinking headcount is the single most under-weighted disqualifier in B2B targeting.
      Organisations in contraction do not run evaluations to completion regardless of how well they
      score on every other firmographic.
    type: value
    data_type: enum
    allowed_values: [unknown, shrinking, flat, growing, hypergrowth]
    description: >
      A shrinking headcount is the single most under-weighted disqualifier in B2B targeting.
      Organisations in contraction do not run evaluations to completion regardless of how
      well they score on every other firmographic.
  - name: industry
    purpose: The industry of this object.
    type: value
    data_type: string
  - name: industry_code
    purpose: SIC or NAICS. Machine-comparable where the free-text industry field is not.
    type: value
    data_type: string
    description: SIC or NAICS. Machine-comparable where the free-text industry field is not.
  - name: sub_industry
    purpose: Carries most of the real signal. "Software" is not a segment; "clinical trial management
      software" is, and the two have nothing in common in buying behaviour, cycle length or who signs.
    type: value
    data_type: string
    description: >
      Carries most of the real signal. "Software" is not a segment; "clinical trial management
      software" is, and the two have nothing in common in buying behaviour, cycle length or
      who signs.
  - name: business_model
    purpose: Their model, not ours. It determines their own revenue rhythm and therefore when they can
      spend.
    type: value
    data_type: enum
    allowed_values: [unknown, b2b, b2c, b2b2c, marketplace, government, non_profit, education]
    description: Their model, not ours. It determines their own revenue rhythm and therefore when they
      can spend.
  - name: market_position
    purpose: The market_position of this object.
    type: value
    data_type: enum
    allowed_values: [unknown, leader, challenger, niche, new_entrant, declining]
  - name: legal_structure
    purpose: Public companies and government bodies carry procurement obligations that add weeks
      independent of deal size or enthusiasm. This field, not deal value, is the honest first input to
      a cycle-length estimate.
    type: value
    data_type: enum
    allowed_values: [unknown, private, public, partnership, non_profit, government, subsidiary,
        cooperative]
    description: >
      Public companies and government bodies carry procurement obligations that add weeks
      independent of deal size or enthusiasm. This field, not deal value, is the honest first
      input to a cycle-length estimate.
  - name: funding_stage
    purpose: The funding_stage of this object.
    type: value
    data_type: enum
    allowed_values: [unknown, bootstrapped, pre_seed, seed, series_a, series_b, series_c_plus,
        private_equity, public, subsidiary, non_profit, government]
  - name: last_funding_at
    purpose: Freshly funded companies buy; companies eighteen months past a round conserve. The date
      carries more information about spending capacity than the amount does.
    type: value
    data_type: timestamp
    description: >
      Freshly funded companies buy; companies eighteen months past a round conserve. The date
      carries more information about spending capacity than the amount does.
  - name: parent_company_ref
    purpose: Self-referential. Present for subsidiaries and acquired entities.
    type: reference
    ref: sales.obj.core.company
    data_type: ref
    description: Self-referential. Present for subsidiaries and acquired entities.
  - name: subsidiary_count
    purpose: The subsidiary_count of this object.
    type: value
    data_type: integer
  - name: headquarters_country
    purpose: The headquarters_country of this object.
    type: value
    data_type: string
  - name: operating_countries
    purpose: Multi-jurisdiction operation forces data-residency and legal review into every deal,
      whatever its size.
    type: value
    data_type: list
    description: Multi-jurisdiction operation forces data-residency and legal review into every deal,
      whatever its size.
  - name: fiscal_year_end
    purpose: Objective, externally verifiable, and it sets a budget clock we do not control. A
      December year-end and a March year-end make the identical deal easy or impossible in the
      identical week.
    type: value
    data_type: string
    description: >
      Objective, externally verifiable, and it sets a budget clock we do not control. A
      December year-end and a March year-end make the identical deal easy or impossible in the
      identical week.
  - name: tech_stack
    purpose: Installed technologies. The most predictive firmographic in B2B software because it is
      externally observable and because it names the incumbent — which converts an assumed greenfield
      sale into a displacement, with an entirely different play.
    type: value
    data_type: list
    description: >
      Installed technologies. The most predictive firmographic in B2B software because it is
      externally observable and because it names the incumbent — which converts an assumed
      greenfield sale into a displacement, with an entirely different play.
  - name: incumbent_vendors
    purpose: The subset of tech_stack that we would replace. Kept separate because most of a stack is
      irrelevant to us.
    type: value
    data_type: list
    description: The subset of tech_stack that we would replace. Kept separate because most of a stack
      is irrelevant to us.
  - name: regulatory_regimes
    purpose: GDPR, HIPAA, SOC 2, FedRAMP and the rest. Determines whether a security review is
      inevitable rather than possible, which is a date question before it is a risk question.
    type: value
    data_type: list
    description: >
      GDPR, HIPAA, SOC 2, FedRAMP and the rest. Determines whether a security review is
      inevitable rather than possible, which is a date question before it is a risk question.
  - name: research_state
    purpose: Mirrors `states`. `stale` is a first-class value, not an absence.
    type: value
    data_type: enum
    allowed_values: [unknown, identified, researched, qualified, disqualified, stale]
    required: true
    description: Mirrors `states`. `stale` is a first-class value, not an absence.
  - name: data_source
    purpose: The data_source of this object.
    type: value
    data_type: enum
    allowed_values: [unknown, enrichment_provider, website, filings, manual_entry, inferred_from_deal]
  - name: data_freshness_at
    purpose: When the firmographics were last verified. Without it every field above is presented at
      full confidence forever, and an ICP score computed from a three-year-old headcount is
      indistinguishable from one computed this morning.
    type: value
    data_type: timestamp
    description: >
      When the firmographics were last verified. Without it every field above is presented at
      full confidence forever, and an ICP score computed from a three-year-old headcount is
      indistinguishable from one computed this morning.
states:
  initial: unknown
  values:
    - name: unknown
      description: A name and possibly a domain. Nothing verified.
    - name: identified
      description: Resolved to a real entity with a primary_domain. The point at which deduplication
        becomes possible.
    - name: researched
      description: Firmographics populated from a source better than a guess.
    - name: qualified
      description: Scored against the ICP and inside it. A statement about the organisation, never
        about a conversation.
    - name: disqualified
      description: Scored and outside it. A durable verdict, and the one most often quietly reversed
        by a hopeful rep.
    - name: stale
      description: Previously researched, now past its freshness horizon. Must not silently continue
        to feed fit scores at full weight.
  transitions:
    - {from: unknown, to: identified}
    - {from: identified, to: researched}
    - {from: researched, to: qualified}
    - {from: researched, to: disqualified}
    - {from: researched, to: stale}
    - {from: qualified, to: stale}
    - {from: stale, to: researched}
    - {from: disqualified, to: researched}

# ── 7 · Business Rules ───────────────────────────────────────────────────────────────────
relationships:

  - type: references
    target: sales.obj.core.account
    cardinality: zero_or_many
    description: >
      One company, potentially several accounts — subsidiaries, regions, business units that
      buy separately. Zero is legitimate and common: most companies worth targeting are ones
      we have never contacted, and the record must exist before the relationship does.

  - type: belongs_to
    target: sales.obj.core.company
    cardinality: zero_or_one
    description: Parent entity. Self-referential.

  - type: member_of
    target: sales.obj.core.icp
    cardinality: zero_or_many
    description: >
      Fit is scored here and only here. An ICP describes a class of organisations, so
      membership is a property of the company; scoring it against an account would make fit
      depend on how well the last conversation went.

  - type: references
    target: sales.obj.core.competitor
    cardinality: zero_or_many
    description: Incumbents visible in the tech stack. An installed competitor is a displacement, not
      a greenfield.

  - type: produces
    target: sales.obj.core.buying_signal
    cardinality: zero_or_many
    description: >
      Funding rounds, hiring surges, leadership changes and acquisitions are company-level
      events. They fire whether or not a deal exists, which is what makes them useful for
      timing outbound rather than merely explaining a deal already in flight.

  - type: influences
    target: sales.obj.core.timeline
    cardinality: zero_or_one
    description: fiscal_year_end and regulatory_regimes bound every close date before we propose one.

  - type: works_with
    target: sales.obj.core.persona
    cardinality: zero_or_many
    description: Which personas exist here at all. A 40-person company has no Head of Revenue
      Operations to sell to.

# ── 6 · States ───────────────────────────────────────────────────────────────────────────
#
# No entered_when conditions are declared. Every substrate fact path is deal- or
# thread-scoped, and this object's whole point is that it is true before any deal exists —
# so binding these transitions to deal facts would be a lie dressed as automation.
inference_patterns:

  deterministic:

    - id: co.domain_from_correspondent_email
      statement: "The company's primary domain is the email domain of the people we correspond with."
      status: needs_signal
      yields: {confidence_bp: 9000, attribute: primary_domain}
      requires_signals:
        - {kind: fact_path, name: contact.email_domain, owner_layer: L1, note: "The highest-value gap on\
            this object and probably the cheapest in the whole backlog. Every message already ingested carries
            the company's only durable natural key in its From header, and it is discarded. Without it Company
            records cannot be deduplicated, cannot be enriched automatically, and cannot be linked to an account
            by anything except a hand-typed name."}

    - id: co.firmographics_from_enrichment
      statement: "An enrichment provider supplies headcount, industry, revenue and funding against the domain."
      status: needs_signal
      yields: {confidence_bp: 8500, attribute: employee_count}
      requires_signals:
        - {kind: fact_path, name: company.employee_count, owner_layer: L1, note: "Depends on co.domain_from_correspondent_email\
            — enrichment is keyed on domain, so the two are one chain and ordering matters."}
        - {kind: fact_path, name: company.industry, owner_layer: L1}
        - {kind: fact_path, name: company.revenue_annual, owner_layer: L1}

    - id: co.tech_stack_from_the_website
      statement: "Installed technologies are detectable from the public site and job postings."
      status: needs_signal
      yields: {confidence_bp: 8000, attribute: tech_stack}
      requires_signals:
        - {kind: fact_path, name: company.tech_stack, owner_layer: L1, note: "Names the incumbent before\
            the first call. Knowing a competitor is already installed changes the opening question, not merely
            the fit score."}

    - id: co.parent_from_the_register
      statement: "A corporate register or filing establishes the parent entity."
      status: needs_signal
      yields: {confidence_bp: 9500, attribute: parent_company_ref}
      requires_signals:
        - {kind: fact_path, name: company.parent_domain, owner_layer: L1, note: "Without it subsidiaries\
            inherit the parent's segment by accident, which is how a forty-person business unit ends up in
            an enterprise territory."}

    - id: co.funding_event_observed
      statement: "A funding round was announced."
      status: needs_signal
      yields: {confidence_bp: 9000, attribute: last_funding_at}
      requires_signals:
        - {kind: obs_kind, name: funding_announced, owner_layer: L2, note: "A company-level buying signal\
            that fires with no deal in existence. Every observation kind L2 emits today presupposes an open
            conversation, so the entire class of pre-deal timing signals is currently unreachable."}

  heuristic:

    - id: co.two_review_functions_imply_formal_procurement
      statement: "Both legal and security review appeared on one deal — a structural fact about the organisation,
        not about the deal."
      status: executable
      when:
        - {has_obs: legal_review}
        - {has_obs: security_review_started}
      yields: {confidence_bp: 7000, attribute: legal_structure, value: public}
      evidence_fields: [deal.status]
      note: >
        Reads as a deal observation and is not. Two independent review functions in one
        purchase means the organisation runs a formal process, and it will run it again on the
        next deal and on the renewal. `public` is the most probable structure rather than a
        certainty — regulated private firms and government bodies produce the same shape,
        which is why this yields 7000 and not more.

    - id: co.security_review_implies_regulatory_exposure
      statement: "A security review started, which small and unregulated organisations rarely run."
      status: executable
      when:
        - {has_obs: security_review_started}
      yields: {confidence_bp: 6000, attribute: research_state, value: researched}
      note: >
        Weak and worth having anyway. A security review is a proxy for scale and regulatory
        exposure together, and it is one of only three company-level readings the substrate
        supports at all. It should raise the expected cycle length immediately, before anyone
        has confirmed a single firmographic.

    - id: co.deal_size_implies_scale_band
      statement: "A neighbouring deal is large, which bounds the organisation's size from below."
      status: executable
      when:
        - {neighbor_fact: deal.value, op: ">=", value: 250000}
      yields: {confidence_bp: 5500, attribute: employee_band, value: "1001-5000"}
      note: >
        Inference in the wrong direction, deliberately. Normally size predicts deal value;
        here the only company-level fact available is a deal we are already in, so the arrow
        is reversed. It is bounded from below only — a large deal proves they are not tiny and
        proves nothing about how large they are, hence the low confidence and the caveat that
        any enrichment value must override this outright.

    - id: co.incumbent_from_a_competitor_mention
      statement: "A competitor was named in the deal, which is weak evidence of an installed vendor."
      status: executable
      when:
        - {has_obs: competitor}
      yields: {confidence_bp: 5000, attribute: incumbent_vendors}
      note: >
        The lowest confidence in this file, and the caveat is the point: the substrate cannot
        distinguish a competitor being evaluated alongside us from one already installed. Those
        are opposite situations — the first is a bake-off, the second is a displacement with a
        switching cost and a contract end date — and until L2 separates them this pattern can
        only flag that the name came up.

    - id: co.hiring_surge_implies_growth
      statement: "Sustained hiring against the relevant function signals both growth and a live budget."
      status: needs_signal
      yields: {confidence_bp: 7500, attribute: headcount_trend, value: growing}
      requires_signals:
        - {kind: obs_kind, name: hiring_surge, owner_layer: L2, note: "Job postings are public, cheap to\
            poll and name the exact function that is about to need tooling. The strongest pre-deal timing
            signal available anywhere and entirely absent today."}

    - id: co.regime_from_the_security_questionnaire
      statement: "The questionnaire they send names the regimes they are bound by."
      status: needs_signal
      yields: {confidence_bp: 8500, attribute: regulatory_regimes}
      requires_signals:
        - {kind: obs_kind, name: security_questionnaire_received, owner_layer: L2, note: "security_review_started\
            fires but carries no payload, so the document that answers the compliance question in full arrives,
            is read by a human, and leaves no trace in the graph."}

# ── 10 · Inputs ──────────────────────────────────────────────────────────────────────────
inputs:
  - {source: website, signal: "domain, positioning, technologies, job postings"}
  - {source: crm, signal: "existing company record, industry, size"}
  - {source: email, signal: "correspondent email domains — the natural key, not yet projected"}
  - {source: document, signal: "security questionnaires, MSAs and filings name regimes and legal entity"}
  - {source: contract, signal: signing entity and jurisdiction}
  - {source: meeting_transcript, signal: "stated headcount, structure, fiscal calendar, incumbent tooling"}
  - {source: manual_entry, signal: research a human did that no provider covers}
  - {source: derived, signal: "structure inferred from review functions and deal size", path: derived.momentum}

# ── 11 · Outputs ─────────────────────────────────────────────────────────────────────────
outputs:
  - {name: icp_fit_inputs, type: list, description: "The firmographic and technographic vector the ICP\
      object scores. Deliberately not a score — the score belongs to fit, the facts belong here.",
      consumed_by: [L4.reasoning_unit]}
  - {name: segment_assignment, type: string, description: "Size and structure band used for territory\
      and routing.", consumed_by: [L4.decision_maker]}
  - {name: expected_cycle_modifier, type: integer, description: "Cycle-length multiplier from legal structure,\
      jurisdictions and regulatory regimes. Applies before any deal-specific evidence.", consumed_by: [
      L4.reasoning_unit, L5.execution_planning]}
  - {name: incumbent_summary, type: list, description: "Installed vendors we would displace, with what\
      is known about the switch.", consumed_by: [L4.reasoning_unit]}
  - {name: compliance_requirements, type: list, description: "Regimes that make a security review inevitable.\
      Feeds the close plan, not the risk register.", consumed_by: [L5.execution_planning]}
  - {name: data_confidence_bp, type: integer, description: "How much any of the above should be believed,\
      given freshness and source.", consumed_by: [L4.reasoning_unit, L6.learning_unit]}

# ── 12 · Events ──────────────────────────────────────────────────────────────────────────
constraints:
  - {id: co.no_relationship_fields, statement: "Company carries no field describing our relationship.\
      Owner, stage, health, ARR and renewal live on Account without exception.", hard: true}
  - {id: co.identity_on_domain, statement: "Two records sharing a primary_domain are the same company\
      and must be merged. Name equality is never sufficient.", hard: true}
  - {id: co.subsidiary_no_inheritance, statement: "A subsidiary inherits no firmographic from its parent.\
      Structure is inherited; scale is not.", hard: true}
  - {id: co.stale_never_raises_fit, statement: "Firmographics past the freshness horizon may lower a fit\
      score and may never raise one.", hard: true}
  - {id: co.fit_is_scored_here, statement: "ICP fit is computed against Company only. A fit score that\
      reads any Account field is measuring the relationship and calling it targeting.", hard: true}

# ── 15 · Evidence ────────────────────────────────────────────────────────────────────────
business_rules:

  - id: co.domain_is_the_key
    statement: >
      Company identity resolves on primary_domain, never on name. Names change on rebrand and
      acquisition and collide across jurisdictions; the domain survives both and is present in
      every email address already held.
    then: resolve_on_domain
    severity: blocking

  - id: co.no_relationship_state_here
    statement: >
      No field describing our relationship — owner, stage, health, ARR, renewal — may be
      stored on Company. Every one of them belongs to Account. This is the rule that keeps
      expansion distinguishable from new business.
    severity: blocking

  - id: co.stale_data_cannot_raise_fit
    statement: >
      Firmographics past their freshness horizon may lower an ICP fit score but never raise
      it. Asymmetric on purpose: a stale disqualifier is probably still true, while a stale
      qualifier is how a company that halved in size stays in the enterprise segment.
    then: cap_fit_contribution
    severity: warning

  - id: co.subsidiary_scores_on_its_own_numbers
    statement: >
      A subsidiary's fit is scored on its own firmographics. The parent's revenue is not the
      subsidiary's budget, and inheriting it produces a pipeline full of enterprise deals
      being run by a forty-person business unit.
    severity: blocking

  - id: co.regulated_implies_a_security_gate
    statement: >
      A company with any entry in regulatory_regimes will run a security review. A close plan
      that does not allow for it is not optimistic, it is wrong about the date.
    then: require_security_review_in_plan
    severity: warning

  - id: co.contraction_outranks_fit
    statement: >
      headcount_trend = shrinking must override a strong firmographic fit. Companies in
      contraction start evaluations and finish very few of them, and the pipeline they
      generate is the most convincing kind of waste.
    severity: warning

# ── 8 · Decision Factors ─────────────────────────────────────────────────────────────────
decision_factors:

  - name: firmographic_fit
    weight_bp: 3000
    direction: increases
    description: Industry, size and geography against the ICP. The largest weight, and the one most
      vulnerable to stale data.
    reads: [industry, sub_industry, employee_band, revenue_band, headquarters_country]

  - name: technographic_fit
    weight_bp: 2000
    direction: increases
    description: >
      Installed stack. Weighted almost as heavily as firmographics because it is observed
      rather than reported, and because it identifies the incumbent — which changes the play,
      not merely the score.
    reads: [tech_stack, incumbent_vendors]

  - name: growth_trajectory
    weight_bp: 1500
    direction: increases
    description: Direction beats position. A hypergrowth 80-person company buys like a 300-person one
      and pays like it too.
    reads: [growth_rate, headcount_trend, funding_stage, last_funding_at]

  - name: structural_complexity
    weight_bp: 1500
    direction: decreases
    description: >
      Public ownership, many subsidiaries, many jurisdictions and heavy regulation each add
      weeks. Decreases the score not because such deals are worse but because they are slower,
      and a forecast that ignores this is wrong in the only dimension anybody checks.
    reads: [legal_structure, subsidiary_count, operating_countries, regulatory_regimes]

  - name: market_standing
    weight_bp: 1000
    direction: context
    description: Leaders buy for advantage and pay for it; declining firms buy for cost and negotiate
      hard. Neither is better, and they need different pitches.
    reads: [market_position, business_model]

  - name: data_confidence
    weight_bp: 1000
    direction: context
    description: >
      A multiplier in disguise. Every factor above is arithmetic on fields that may be years
      old, and without this one the model cannot tell a confident fit from a confident guess.
    reads: [data_freshness_at, data_source, research_state]

# ── 9 · Inference Patterns ⭐ ────────────────────────────────────────────────────────────
evidence:
  - {source: document, strength_bp: 9500, description: "Statutory filings and registers. Definitive on\
      structure, ownership and fiscal year-end; silent on everything commercial."}
  - {source: contract, strength_bp: 9000, description: "The signing entity and jurisdiction, stated by\
      them. Arrives far too late to help with targeting."}
  - {source: website, strength_bp: 7500, description: "Positioning, jobs and detectable technologies.\
      Uniquely, this is the strongest source that is available before contact."}
  - {source: crm, strength_bp: 6500, description: "Existing record. Whoever typed it did so once, on a\
      day nobody remembers."}
  - {source: meeting_transcript, strength_bp: 6500, description: "They describe their own structure. Accurate\
      about intent, imprecise about numbers."}
  - {source: manual_entry, strength_bp: 5500, description: "Researched by a person. Good on the day it\
      was written and undated thereafter."}
  - {source: derived, strength_bp: 3500, description: "Structure inferred from review functions and deal\
      size. Corroborating only, and always overridden by enrichment."}

# ── 16 · Metrics ─────────────────────────────────────────────────────────────────────────
metrics:
  - {name: enrichment_coverage, unit: percent, description: "Share of companies with firmographics fresher\
      than the horizon. Bounds the trustworthiness of every fit score downstream.", owner_layer: L6}
  - {name: duplicate_rate, unit: percent, description: "Companies sharing a primary_domain across records.\
      The direct cost of resolving identity on name.", owner_layer: L6}
  - {name: icp_fit_predictive_power, unit: percent, description: "Correlation between fit score and eventual\
      win rate. If this is near zero the ICP is describing who we sold to, not who we should sell to.",
    owner_layer: L6}
  - {name: disqualification_lead_time, unit: days, description: "Days from identification to disqualification.\
      Every day here is spent on a company that was never going to buy.", owner_layer: L6}
  - {name: firmographic_drift, unit: percent, description: "Share of records whose employee_band changed\
      on refresh. Sets the freshness horizon empirically instead of by opinion.", owner_layer: L6}
  - {name: cycle_length_by_structure, unit: days, description: "Median cycle split by legal_structure.\
      The evidence behind the structural_complexity weighting.", owner_layer: L6}

# ── 17 · Examples ────────────────────────────────────────────────────────────────────────
events:
  - {id: co.identified, name: Company Identified, payload: [primary_domain, legal_name]}
  - {id: co.enriched, name: Firmographics Refreshed, payload: [employee_band, revenue_band, data_freshness_at,
      data_source]}
  - {id: co.funding_round, name: Funding Round Announced, payload: [funding_stage, last_funding_at],
      description: "A buying signal that fires with no deal in existence. Blocked today: every observation
      kind L2 emits presupposes an open conversation."}
  - {id: co.acquired, name: Company Acquired, payload: [parent_company_ref, legal_structure],
      description: "Invalidates the segment, the budget authority and usually the champion, all at once
      and with no warning inside our own data."}
  - {id: co.contraction_detected, name: Contraction Detected, payload: [headcount_trend, growth_rate]}
  - {id: co.data_went_stale, name: Firmographics Went Stale, payload: [data_freshness_at, research_state],
    description: "Silent by nature. Nothing observable happens when a record ages, which is why it needs
      an event rather than a check."}

# ── 13 · Actions ─────────────────────────────────────────────────────────────────────────
actions:
  - {id: co.resolve_identity, name: Resolve the company to a domain, actor: system, effect: "The prerequisite\
      for everything else here. Every enrichment provider keys on domain, and every deduplication depends
      on it."}
  - {id: co.enrich, name: Refresh firmographics, actor: system, effect: "Cheap, and the only defence against\
      fit scores computed from a headcount that has since halved."}
  - {id: co.score_icp_fit, name: Score fit against the ICP, actor: system, effect: "Runs against this\
      object alone. If it needs anything from Account, the ICP definition has leaked relationship state
      into a targeting model."}
  - {id: co.map_the_group, name: Map the corporate group, actor: human, effect: "Parent, subsidiaries\
      and which entity actually signs. Discovering at contract stage that the signing entity is in another
      jurisdiction costs weeks."}
  - {id: co.detect_incumbent, name: Identify the installed incumbent, actor: human, effect: "Converts\
      an assumed greenfield sale into a displacement. Different discovery, different objections, different
      timeline anchored on their contract end date."}
  - {id: co.disqualify, name: Disqualify on firmographics, actor: human, effect: "The cheapest action\
      in the entire domain, because it costs one decision and saves a quarter of activity. Doing it before
      contact is the whole point of separating Company from Account."}

# ── 14 · Constraints ─────────────────────────────────────────────────────────────────────
examples:
  - {label: "220-person private SaaS firm, Series B, growing", note: "The clean fit. One economic buyer,\
      no procurement function, a fiscal year-end nobody has mentioned yet and which will decide the quarter."}
  - {label: "40-person subsidiary of a 30,000-person listed group", note: "Scores enterprise on inherited\
      firmographics and buys like a small business — except for the parent's procurement policy, which applies
      in full. Wrong on both size and speed unless parent_company_ref is populated."}
  - {label: "Regulated healthcare provider, 3,000 staff", note: "regulatory_regimes populated. A security\
      review is certain, not probable, and the close plan must contain it from day one rather than absorb
      it in week nine."}
  - {label: "Declining incumbent-heavy retailer, shrinking headcount", note: "Strong firmographic fit\
      on paper. headcount_trend = shrinking should override it — they will run the evaluation and finish
      nothing."}
  - {label: "Company record carrying account_owner and health_score", note: "THE classic conflation. The\
      moment a relationship field lands here, expansion becomes indistinguishable from new business and
      every churned company drops out of the target list it still belongs in."}

# ── 18 · Metadata ────────────────────────────────────────────────────────────────────────
metadata:
  owner: Sales
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  notes: >
    Four of eleven patterns are executable and all four are weak, because the substrate is
    deal-scoped by construction while this object is true before any deal exists — every
    executable pattern here infers a company fact backwards from a conversation we are
    already in, which is the wrong direction for a targeting object. The highest-value signal
    gap by a distance is contact.email_domain: every message already ingested carries the
    company's only durable natural key in its From header and it is discarded, so records
    cannot be deduplicated, enrichment cannot be keyed, and accounts link to companies only
    by a hand-typed name. It is also the cheapest item in the backlog and it unblocks the
    entire enrichment chain behind it. Second is hiring_surge, the strongest pre-deal timing
    signal in the profession and one of a whole class L2 cannot express, since every
    observation kind it emits presupposes an open conversation.
