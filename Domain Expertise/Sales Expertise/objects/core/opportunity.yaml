# ── 18 · Metadata ────────────────────────────────────────────────────────────────────────
metadata:
  owner: Sales
  created_by: ai
  reviewed_by: ""
  last_updated: "2026-08-08"
  review_status: unreviewed
  confidence: provisional
  notes: >
    Eleven patterns: five executable, six needs_signal. The low executable share is honest
    rather than incomplete — the substrate is deal-shaped and this object lives before deals
    exist. The single highest-value gap is opportunity.status as a node type of its own:
    Layer 2 materialises a deal-shaped node the moment a thread appears, so a possibility with
    no thread has nowhere to attach and a possibility with a thread has already been recorded
    as a deal. Until that node exists, the boundary this object was written to police is
    unenforceable at runtime and every executable pattern here fires only after the line has
    already been crossed. product.usage_ratio is the highest-value gap that is merely a
    connector away rather than a modelling change.
