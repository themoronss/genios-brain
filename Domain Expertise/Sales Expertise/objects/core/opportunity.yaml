# ─────────────────────────────────────────────────────────────────────────────
# Opportunity — the object that keeps hope out of the forecast.
#
# Worth knowing before reading the patterns: Layer 2 materialises a graph node the
# moment a thread exists, and that node is deal-shaped. There is no opportunity node,
# so most of this object's knowledge is authored against a node type the pipeline
# does not create yet. That is the single structural gap here and it is named in the
# patterns rather than hidden by them.
# ─────────────────────────────────────────────────────────────────────────────

identity:
  id: sales.obj.core.opportunity
  scope: core
  name: Opportunity
  domain: sales
  subdomain: revenue_operations
  owner_capability: sales.revenue_operations.forecasting
  version: 1.0.0
  status: draft
  aliases: ["Prospect Opportunity", "Expansion Opportunity", "Revenue Possibility"]
purpose:
  statement: >
    An identified possibility of revenue that has not yet become a worked deal — including the
    expansion and cross-sell possibilities sitting inside accounts we already serve. The
    discriminator against Deal is who has committed: an opportunity is one-sided, an assessment
    we have made about a buyer who may not know we exist. Keeping the two objects separate is
    what stops the pipeline reporting hope as process. Collapse them and every coverage ratio,
    capacity model and quota plan in the business is computed on a number that includes
    possibilities nobody has agreed to.
attributes:
  - name: provenance
    purpose: Where this came from. The field that decides whether the pipeline can be attributed to
      anything.
    type: composite
    contains:
      - opportunity_type
      - origin
      - account_ref
      - contact_ref
      - source_signal
  - name: trigger
    purpose: >
      The observable change that made this possible now. An opportunity with no trigger is a
      list entry, and a list is not a pipeline.
    type: composite
    contains:
      - trigger_event
      - compelling_event_present
      - expires_at
  - name: sizing
    purpose: What it might be worth, and how much of that is a guess.
    type: composite
    contains:
      - estimated_value
      - estimated_value_confidence_bp
      - currency
  - name: fit
    purpose: Whether we should want it, checked before whether they want us.
    type: composite
    contains:
      - fit_score_bp
      - icp_ref
      - pain_point_ref
      - business_need_ref
  - name: buyer_readiness
    purpose: Where the buyer is, not where we are. Contains the conversion test.
    type: composite
    contains:
      - buyer_awareness
      - two_sided
      - last_touch_at
      - touch_count
      - engagement
  - name: verdict
    purpose: How this ends. Every opportunity must reach one of these, and most never do.
    type: composite
    contains:
      - conversion_state
      - disqualify_reason
      - converted_deal_ref
      - identified_at
  - name: opportunity_type
    purpose: Expansion and cross-sell are opportunities, not accounts. Most CRMs have nowhere to put
      "this customer will need the second product in March", so the knowledge lives in an account
      manager's head and leaves with them.
    type: value
    data_type: enum
    allowed_values: [new_business, expansion, upsell, cross_sell, renewal, win_back, replacement]
    required: true
    description: >
      Expansion and cross-sell are opportunities, not accounts. Most CRMs have nowhere to put
      "this customer will need the second product in March", so the knowledge lives in an
      account manager's head and leaves with them.
  - name: origin
    purpose: The only field that makes pipeline creation attributable. `unknown` is a reporting
      failure, not a category.
    type: value
    data_type: enum
    allowed_values: [inbound, outbound, referral, partner, existing_account, event, product_usage,
        unknown]
    description: The only field that makes pipeline creation attributable. `unknown` is a reporting
      failure, not a category.
  - name: account_ref
    purpose: The account_ref of this object.
    type: reference
    ref: sales.obj.core.account
    data_type: ref
  - name: contact_ref
    purpose: The human this attaches to. An opportunity with no named human is a market observation.
    type: reference
    ref: sales.obj.core.stakeholder
    data_type: ref
    description: The human this attaches to. An opportunity with no named human is a market
      observation.
  - name: source_signal
    purpose: The specific thing that surfaced it — a job posting, a funding round, a usage threshold,
      a conversation.
    type: value
    data_type: string
    description: The specific thing that surfaced it — a job posting, a funding round, a usage
      threshold, a conversation.
  - name: trigger_event
    purpose: What changed on their side. Distinct from source_signal, which is how we found out. A new
      CFO is a trigger; the press release is the signal.
    type: value
    data_type: string
    description: >
      What changed on their side. Distinct from source_signal, which is how we found out.
      A new CFO is a trigger; the press release is the signal.
  - name: compelling_event_present
    purpose: A dated consequence of inaction on their side. Almost always false and almost always
      recorded as true, which is why the deals it fronts slip.
    type: value
    data_type: boolean
    description: >
      A dated consequence of inaction on their side. Almost always false and almost always
      recorded as true, which is why the deals it fronts slip.
  - name: expires_at
    purpose: Expansion windows close. A renewal date, a budget cycle, a new executive's first ninety
      days — after it passes the same opportunity is worth materially less and usually stays in the
      pipeline at full value.
    type: value
    data_type: timestamp
    description: >
      Expansion windows close. A renewal date, a budget cycle, a new executive's first ninety
      days — after it passes the same opportunity is worth materially less and usually stays
      in the pipeline at full value.
  - name: estimated_value
    purpose: Our estimate, not a quote. It has no relationship to deal.value, which only exists once
      we have proposed something, and summing the two is how pipeline gets double counted.
    type: value
    data_type: money
    description: >
      Our estimate, not a quote. It has no relationship to deal.value, which only exists once
      we have proposed something, and summing the two is how pipeline gets double counted.
  - name: estimated_value_confidence_bp
    purpose: A figure from an account's known seat count and one from a rep's instinct must not read
      the same in a coverage report.
    type: value
    data_type: integer
    description: A figure from an account's known seat count and one from a rep's instinct must not
      read the same in a coverage report.
  - name: currency
    purpose: The currency of this object.
    type: value
    data_type: string
  - name: fit_score_bp
    purpose: Match against the ICP, in basis points. Scored before pursuit, because the cheapest
      disqualification is the one made before any effort is spent.
    type: value
    data_type: integer
    description: Match against the ICP, in basis points. Scored before pursuit, because the cheapest
      disqualification is the one made before any effort is spent.
  - name: icp_ref
    purpose: The icp_ref of this object.
    type: reference
    ref: sales.obj.core.icp
    data_type: ref
  - name: pain_point_ref
    purpose: The pain_point_ref of this object.
    type: reference
    ref: sales.obj.core.pain_point
    data_type: ref
  - name: business_need_ref
    purpose: The business_need_ref of this object.
    type: reference
    ref: sales.obj.core.business_need
    data_type: ref
  - name: buyer_awareness
    purpose: Determines the entire play. An unaware buyer needs a reason to care and a demo will lose
      them; an actively evaluating buyer needs differentiation and a discovery call wastes the only
      meeting we will get.
    type: value
    data_type: enum
    allowed_values: [unaware, problem_aware, solution_aware, vendor_aware, actively_evaluating]
    description: >
      Determines the entire play. An unaware buyer needs a reason to care and a demo will lose
      them; an actively evaluating buyer needs differentiation and a discovery call wastes the
      only meeting we will get.
  - name: two_sided
    purpose: THE discriminator field. False until the buyer has accepted a dated next step. The moment
      it turns true this object should become a Deal and stop existing. Anything else — a warm reply,
      a "send me some information", a meeting they booked and then moved twice — leaves it false.
    type: value
    data_type: boolean
    required: true
    description: >
      THE discriminator field. False until the buyer has accepted a dated next step. The moment
      it turns true this object should become a Deal and stop existing. Anything else — a warm
      reply, a "send me some information", a meeting they booked and then moved twice — leaves
      it false.
  - name: last_touch_at
    purpose: The last_touch_at of this object.
    type: value
    data_type: timestamp
    source_paths: [thread.last_inbound]
  - name: touch_count
    purpose: Attempts made. High touch_count with low engagement is the clearest disqualification
      evidence available and is almost never acted on.
    type: value
    data_type: integer
    description: Attempts made. High touch_count with low engagement is the clearest disqualification
      evidence available and is almost never acted on.
  - name: engagement
    purpose: The engagement of this object.
    type: value
    data_type: number
    source_paths: [derived.engagement]
  - name: conversion_state
    purpose: '`nurture` and `disqualified` are separate because they cost different things. Nurture is a
      future cost we accept; disqualified is a decision we made. An opportunity that drifts into nurture
      without anybody deciding is neither.'
    type: value
    data_type: enum
    allowed_values: [open, converted, nurture, disqualified, expired]
    required: true
    description: >
      `nurture` and `disqualified` are separate because they cost different things. Nurture is
      a future cost we accept; disqualified is a decision we made. An opportunity that drifts
      into nurture without anybody deciding is neither.
  - name: disqualify_reason
    purpose: The disqualify_reason of this object.
    type: value
    data_type: enum
    allowed_values: [no_pain, no_budget, no_authority, no_timing, poor_fit, competitor_incumbent,
        unreachable]
  - name: converted_deal_ref
    purpose: The converted_deal_ref of this object.
    type: reference
    ref: sales.obj.core.deal
    data_type: ref
  - name: identified_at
    purpose: When we first recognised it. Age from here, not from first contact, is what measures
      whether the pipeline is being worked or hoarded.
    type: value
    data_type: timestamp
    description: When we first recognised it. Age from here, not from first contact, is what measures
      whether the pipeline is being worked or hoarded.
states:
  initial: unknown
  values:
    - name: unknown
      description: A hypothesis exists and nothing has been checked.
    - name: identified
      description: Trigger and account named, fit not yet scored.
    - name: contacted
      description: We have reached out. One-sided by definition.
      entered_when: [has_obs: followup_sent]
    - name: engaged
      description: They replied. Still one-sided — a reply is not a commitment.
      entered_when: [exists: thread.last_inbound]
    - name: qualified
      description: Fit scored, pain named, a human identified. Ready to convert if they commit.
      entered_when: [has_obs: demo_requested]
    - name: dormant
      description: Contacted, no reply, not yet decided against. The state most pipelines quietly
        accumulate.
      entered_when: [{fn: days_since, path: thread.last_inbound, op: ">=", value: 45}]
    - name: disqualified
      description: A decision was made. Cheap, correct, and the least-used action in the profession.
    - name: converted
      description: Became a deal. This object stops here; it does not run alongside.
      entered_when: [has_obs: proposal_sent]
  transitions:
    - {from: unknown, to: identified}
    - {from: identified, to: contacted, when: [has_obs: followup_sent]}
    - {from: contacted, to: engaged, when: [exists: thread.last_inbound]}
    - {from: engaged, to: qualified, when: [has_obs: demo_requested]}
    - {from: qualified, to: converted, when: [has_obs: proposal_sent]}
    - {from: contacted, to: dormant, when: [{fn: days_since, path: thread.last_inbound, op: ">=", value:
            45}]}
    - {from: engaged, to: dormant, when: [{fn: days_since, path: thread.last_inbound, op: ">=", value:
            45}]}
    - {from: dormant, to: engaged}
    - {from: dormant, to: disqualified}
    - {from: identified, to: disqualified}

# ── 7 · Business Rules ───────────────────────────────────────────────────────────────────
relationships:

  - type: belongs_to
    target: sales.obj.core.account
    cardinality: one
    description: Including accounts already under contract. Expansion opportunities are the
      highest-yield and least-tracked kind.

  - type: precedes
    target: sales.obj.core.deal
    cardinality: zero_or_one
    description: >
      Precedes and is then superseded by. Both existing at once is double-counted pipeline —
      the failure mode this object exists to prevent.

  - type: references
    target: sales.obj.core.icp
    cardinality: zero_or_one

  - type: references
    target: sales.obj.core.pain_point
    cardinality: zero_or_many

  - type: references
    target: sales.obj.core.buying_signal
    cardinality: zero_or_many
    description: Buying signals create opportunities. They do not create deals — nothing the buyer
      does unilaterally can.

  - type: works_with
    target: sales.obj.core.stakeholder
    cardinality: zero_or_many

  - type: competes_with
    target: sales.obj.core.competitor
    cardinality: zero_or_many
    description: Usually an incumbent rather than a rival bidder. At this stage the competitor is the
      status quo.

  - type: produces
    target: sales.obj.core.next_action
    cardinality: zero_or_many

  - type: requires
    target: sales.obj.core.timeline
    cardinality: zero_or_one

# ── 6 · States ───────────────────────────────────────────────────────────────────────────
inference_patterns:

  deterministic:

    - id: op.proposal_sent_means_converted
      statement: "A proposal has gone out — this is no longer an opportunity."
      status: executable
      when:
        - {has_obs: proposal_sent}
      yields: {confidence_bp: 9500, attribute: conversion_state, value: converted}
      evidence_fields: [thread.last_inbound]
      note: >
        A proposal is unambiguous proof both sides are in a process. If the record is still an
        opportunity at this point the pipeline is misreporting, and the fix is a state change
        rather than a nudge.

    - id: op.demo_requested_is_active_evaluation
      statement: "They asked for a demo."
      status: executable
      when:
        - {has_obs: demo_requested}
      yields: {confidence_bp: 8800, attribute: buyer_awareness, value: actively_evaluating}
      note: >
        A buyer who requests a demo has already decided the category is worth their time. The
        common error is to answer it with discovery — they have moved past the question the
        discovery call is designed to ask.

    - id: op.crm_opportunity_record
      statement: "The CRM holds an explicit opportunity record with its own stage."
      status: needs_signal
      yields: {confidence_bp: 9500, attribute: conversion_state}
      requires_signals:
        - {kind: fact_path, name: crm.opportunity.stage, owner_layer: L1, note: "Most CRMs conflate opportunity\
            and deal into one object, which is exactly the conflation this file exists to undo. The connector
            must distinguish them or the distinction is unenforceable downstream."}

    - id: op.renewal_window_from_contract
      statement: "A contract renewal date creates a dated opportunity."
      status: needs_signal
      yields: {confidence_bp: 9800, attribute: opportunity_type, value: renewal}
      requires_signals:
        - {kind: fact_path, name: contract.renewal_date, owner_layer: L1, note: "Renewal is the most predictable\
            revenue in the business and the only opportunity type that arrives with a known date attached.
            Nothing emits it, so renewals are worked from memory and discovered late."}

    - id: op.opportunity_node_exists
      statement: "A pre-deal possibility has a node of its own in the graph."
      status: needs_signal
      yields: {confidence_bp: 10000, attribute: conversion_state, value: open}
      requires_signals:
        - {kind: fact_path, name: opportunity.status, owner_layer: L2, note: "The structural gap. L2 materialises\
            a deal-shaped node as soon as a thread exists, so a possibility with no thread has nowhere to
            attach and a possibility with a thread is already recorded as a deal. Every executable pattern
            on this object is therefore firing against a node that has already crossed the boundary the object
            is meant to police."}

  heuristic:

    - id: op.dormant_by_silence
      statement: "No inbound for six weeks and no demo ever requested."
      status: executable
      when:
        - {fn: days_since, path: thread.last_inbound, op: ">=", value: 45}
        - {no_obs: demo_requested}
      yields: {confidence_bp: 8000, attribute: conversion_state, value: nurture}
      evidence_fields: [thread.last_inbound]
      note: >
        Forty-five days rather than the reply cadence: an opportunity that never got a reply
        has no cadence baseline to fall below, and those are the ones worth clearing.

    - id: op.competitor_incumbent_not_evaluation
      statement: "A competitor is named and they have never asked us for a demo."
      status: executable
      when:
        - {has_obs: competitor}
        - {no_obs: demo_requested}
      yields: {confidence_bp: 6000, attribute: disqualify_reason, value: competitor_incumbent}
      note: >
        Reads backwards to most reps, who treat a competitor mention as proof of a live
        evaluation. Named competitor plus no demo request is an incumbent being renewed, and
        the buyer is using us to price-check them. This is where prospecting time goes to die.

    - id: op.closed_lost_mention_disqualifies
      statement: "Language indicating a decision has gone elsewhere."
      status: executable
      when:
        - {has_obs: closed_lost_mention}
      yields: {confidence_bp: 7500, attribute: conversion_state, value: disqualified}
      note: >
        Deliberately below 8000 — the observation catches a mention, and buyers mention losing
        other evaluations as often as their own. Enough to demote, not enough to close out
        without a human reading it.

    - id: op.expansion_from_product_usage
      statement: "An existing account has crossed a usage threshold that its current plan does not cover."
      status: needs_signal
      yields: {confidence_bp: 8500, attribute: opportunity_type, value: expansion}
      requires_signals:
        - {kind: fact_path, name: product.usage_ratio, owner_layer: L1, note: "The highest-yield opportunity\
            source in any subscription business and the one no sales system sees, because usage lives in the
            product database and the CRM never asks it."}

    - id: op.trigger_from_account_change
      statement: "A funding round, a leadership hire or a reorganisation at the account."
      status: needs_signal
      yields: {confidence_bp: 7000, attribute: compelling_event_present, value: true}
      requires_signals:
        - {kind: obs_kind, name: account_trigger, owner_layer: L2, note: "Timing is the only variable a\
            seller cannot manufacture, and the whole of it currently arrives through a human reading the news."}

    - id: op.champion_landed_elsewhere
      statement: "A champion who knows us left, and turned up at a company we do not sell to yet."
      status: needs_signal
      yields: {confidence_bp: 8000, attribute: origin, value: referral}
      requires_signals:
        - {kind: fact_path, name: person.current_employer, owner_layer: L1, note: "champion_change already\
            fires on the account they left, so the system sees the loss and misses the opportunity on the
            other side of it. The highest-converting cold outreach in B2B and it is thrown away twice a year
            per champion."}

# ── 10 · Inputs ──────────────────────────────────────────────────────────────────────────
inputs:
  - {source: email, signal: first replies and their latency, path: thread.last_inbound}
  - {source: derived, signal: two-way volume trend, path: derived.engagement}
  - {source: crm, signal: "account ownership, prior deals, renewal dates"}
  - {source: website, signal: "firmographics, hiring, published change"}
  - {source: document, signal: "existing contract terms and renewal window"}
  - {source: meeting_transcript, signal: "stated future needs — the richest and least captured expansion\
      source"}
  - {source: manual_entry, signal: "account manager judgement about a future need"}
  - {source: slack, signal: "internal flag from support or delivery that an account is ready for more"}

# ── 11 · Outputs ─────────────────────────────────────────────────────────────────────────
outputs:
  - {name: pursuit_priority_bp, type: integer, description: "Whether this is worth a rep's next hour,\
      given fit, trigger and access.", consumed_by: [L4.reasoning_unit, L4.decision_maker]}
  - {name: conversion_readiness, type: boolean, description: "Whether the two_sided test is met and this\
      should become a Deal.", consumed_by: [L4.decision_maker]}
  - {name: disqualify_recommendation, type: string, description: "Reason and evidence for closing it out.\
      The most valuable and least wanted output on this object.", consumed_by: [L4.reasoning_unit,
        L5.execution_planning]}
  - {name: outreach_angle, type: string, description: "Trigger and pain to lead with, given buyer_awareness.",
      consumed_by: [L5.communication_planning]}
  - {name: expansion_window, type: timestamp, description: "When this closes. Bounds every renewal and\
      upsell play.", consumed_by: [L5.execution_planning]}
  - {name: source_attribution, type: string, description: "Origin and trigger, for pipeline-creation reporting.",
      consumed_by: [L6.learning_unit]}

# ── 12 · Events ──────────────────────────────────────────────────────────────────────────
constraints:
  - {id: op.no_forecast_weight, statement: "An opportunity may never carry a forecast probability or appear\
      in a weighted pipeline number.", hard: true}
  - {id: op.conversion_needs_commitment, statement: "Conversion requires two_sided = true.", hard: true}
  - {id: op.no_parallel_deal, statement: "An opportunity and its converted deal may not both be open.",
      hard: true}
  - {id: op.expansion_needs_entitlement, statement: "An upsell or cross-sell opportunity requires an active\
      contract on the account.", hard: true}
  - {id: op.no_pursuit_without_human, statement: "An opportunity with no contact_ref may be recorded but\
      not worked.", hard: false}

# ── 15 · Evidence ────────────────────────────────────────────────────────────────────────
business_rules:

  - id: op.never_in_a_weighted_forecast
    statement: >
      An opportunity must never carry a forecast weight. Only deals do. This is the rule the
      object exists for — the moment a possibility earns a probability, the coverage ratio
      becomes a number nobody can defend in a board meeting.
    then: exclude_from_forecast
    severity: blocking

  - id: op.conversion_requires_two_sided
    statement: >
      Conversion to a Deal requires two_sided = true, meaning the buyer has accepted a dated
      next step. A meeting we requested does not qualify; a meeting they confirmed does.
    then: block_conversion
    severity: blocking

  - id: op.converted_does_not_stay_open
    statement: Once converted, conversion_state must leave `open` in the same pass. An opportunity
      running alongside its own deal is counted twice.
    then: close_opportunity
    severity: blocking

  - id: op.age_forces_a_verdict
    statement: >
      An opportunity with no inbound for ninety days must be moved to nurture, disqualified or
      expired. Carrying it costs nothing visible and costs everything in coverage credibility.
    when:
      - {fn: days_since, path: thread.last_inbound, op: ">=", value: 90}
    then: force_verdict
    severity: warning

  - id: op.expansion_needs_an_account_health_check
    statement: >
      An expansion or upsell opportunity in an account with an open escalation is not an
      opportunity. Selling more to an unhappy customer converts a renewal risk into a churn.
    severity: warning

  - id: op.no_trigger_no_pursuit
    statement: An opportunity with no trigger_event may be recorded but must not be prioritised.
      Timing is the variable nobody controls and the one that decides everything.
    severity: advisory

# ── 8 · Decision Factors ─────────────────────────────────────────────────────────────────
decision_factors:

  - name: fit_to_icp
    weight_bp: 2500
    direction: increases
    description: Weighted highest because it is knowable before any effort is spent. Every other
      factor here costs a conversation to learn.
    reads: [fit_score_bp, icp_ref, opportunity_type]

  - name: trigger_strength
    weight_bp: 2000
    direction: increases
    description: A dated change on their side. Without one, the opportunity is real and the timing is
      not.
    reads: [trigger_event, compelling_event_present, expires_at]

  - name: buyer_readiness
    weight_bp: 2000
    direction: increases
    reads: [buyer_awareness, two_sided, engagement]

  - name: account_access
    weight_bp: 1500
    direction: increases
    description: Existing accounts and warm referrals convert several times better than cold reach,
      and the pipeline rarely reflects that.
    reads: [origin, contact_ref, account_ref]

  - name: estimated_size
    weight_bp: 1000
    direction: context
    description: Context, not increases — a large opportunity with a low fit score is the most
      expensive kind of distraction.
    reads: [estimated_value, estimated_value_confidence_bp]

  - name: decay
    weight_bp: 1000
    direction: decreases
    reads: [last_touch_at, touch_count, identified_at]

# ── 9 · Inference Patterns ⭐ ─────────────────────────────────────────────────────────────
evidence:
  - {source: contract, strength_bp: 9000, description: "Renewal date and current entitlement. The most\
      reliable opportunity source there is, and dated."}
  - {source: crm, strength_bp: 7000, description: "Account history and prior deals. Strong for expansion,\
      weak for net new."}
  - {source: meeting_transcript, strength_bp: 7500, description: "A customer describing a future need\
      in their own words. Richest source and almost never captured as an opportunity."}
  - {source: email, strength_bp: 6500, description: "Inbound interest. Real, but interest is not intent."}
  - {source: website, strength_bp: 4500, description: "Firmographics and public change. Fine for trigger\
      detection, useless for intent."}
  - {source: manual_entry, strength_bp: 4000, description: "Rep or account manager judgement. Often right\
      and never checkable, which is why it must not outrank a contract date."}
  - {source: derived, strength_bp: 3500, description: "Engagement shape. Corroborating only at this stage\
      — there is barely any signal to derive from."}

# ── 16 · Metrics ─────────────────────────────────────────────────────────────────────────
metrics:
  - {name: conversion_rate, unit: percent, description: "Opportunities becoming deals, by origin. The\
      number that tells you which channel actually works.", owner_layer: L6}
  - {name: time_to_verdict, unit: days, description: "Identified to converted, disqualified or expired.\
      Long tails here are hoarding, not patience.", owner_layer: L6}
  - {name: disqualification_rate, unit: percent, description: "If this is near zero, no qualification\
      is happening whatever the stage counts say.", owner_layer: L6}
  - {name: expansion_capture_rate, unit: percent, description: "Expansion opportunities converted before\
      expires_at. The clearest measure of whether the installed base is being worked.", owner_layer:
      L6}
  - {name: pipeline_creation_by_origin, unit: currency, description: "Attributable created pipeline. Impossible\
      without a populated origin field.", owner_layer: L6}
  - {name: fit_score_accuracy, unit: percent, description: "Fit score against eventual win rate. Calibrates\
      the ICP itself.", owner_layer: L6}

