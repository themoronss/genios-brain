  notes: >
    Ten patterns, five executable and five blocked. The executable half uses live-deal traffic
    as free, continuous corroboration and contradiction of recorded claims, which is genuinely
    how a good operator keeps a map alive — but each one is worth exactly one account of
    evidence. Two gaps dominate. First and largest: derived.segment_aggregate over an
    account.segment key, without which no claim about a population can ever be evidenced as
    one. Second: research.finding.collected_at — the finding's own date, the cheapest input in
    the file, absent, and therefore nothing here can ever expire.
